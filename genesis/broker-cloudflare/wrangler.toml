# Cloudflare Worker config for the Project Genesis OAuth identity broker.
#
# Secrets are NOT stored here. Set them with:
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put JWT_SECRET            # 32+ random bytes, base64/hex
#   wrangler secret put GITLAB_CLIENT_ID      # optional
#   wrangler secret put GITLAB_CLIENT_SECRET  # optional
#
# For the OPTIONAL GitHub-as-a-database data token (a GitHub App, separate from
# the identity OAuth App above), also set:
#   wrangler secret put GITHUB_DATA_CLIENT_ID
#   wrangler secret put GITHUB_DATA_CLIENT_SECRET
# and create the KV namespace it needs:
#   wrangler kv namespace create SESSIONS   # paste the printed id below
#
# The two non-secret vars below MUST be edited before first deploy.

name = "genesis-auth"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# This Worker's own public URL (no trailing slash). After your first deploy,
# Wrangler prints it as https://genesis-auth.<your-subdomain>.workers.dev —
# put that here and redeploy so redirect_uri matches.
SELF_BASE_URL = "https://genesis-auth.example.workers.dev"

# Comma-separated allowlist of post-login redirect targets. Each entry may be:
#   - a full URL incl. path (TIGHTEST — recommended): only that exact origin+path
#     may receive the identity token, e.g.
#     https://your-username.github.io/Zeta/genesis/
#   - an origin only (looser): any path on that origin is allowed.
# Query strings and fragments are always stripped before redirecting.
ALLOWED_FRONTEND_ORIGINS = "https://your-username.github.io/Zeta/genesis/"

# Optional tuning:
JWT_ISSUER = "genesis-auth"
JWT_TTL_MINUTES = "30"
# GITLAB_BASE_URL = "https://gitlab.com"   # only for self-managed GitLab

# --- Optional: GitHub-as-a-database data token (GitHub App) -----------------
# The vault repo (in each user's own account) the data token is scoped to.
GITHUB_DATA_REPO = "genesis-vault"

# Workers KV holds the long-lived data REFRESH tokens server-side (keyed by an
# opaque handle), so they never reach the browser. Create it with
# `wrangler kv namespace create SESSIONS` and paste the printed id here.
# Leave this block commented out if you are not using the data token.
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "<your-kv-namespace-id>"
