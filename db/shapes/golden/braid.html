<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>shape-braid</title>
  <style>
    :root {
      --c0: #000000;
      --c1: #d62828;
      --c2: #2a9d2a;
      --c3: #d6c828;
      --c4: #2828d6;
      --c5: #d628d6;
      --c6: #28c8d6;
      --c7: #f0f0f0;
    }
    body { background: #101418; margin: 0; display: grid; place-items: center; min-height: 100vh; }
    svg { width: min(96vw, 960px); image-rendering: pixelated; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes appear { to { opacity: 1; } }
    polyline:hover { stroke-width: 7; filter: brightness(1.6); }
    @media (prefers-reduced-motion: reduce) { polyline { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; } }
    #strand-0 { stroke-dasharray: 210; stroke-dashoffset: 210; animation: draw 600ms linear 0ms forwards; }
    #strand-0-r1 { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 600ms linear 180ms forwards; }
    #strand-0-r2 { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 600ms linear 360ms forwards; }
    #strand-1 { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw 600ms linear 540ms forwards; }
    #strand-1-r1 { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 600ms linear 720ms forwards; }
    #strand-1-r2 { stroke-dasharray: 270; stroke-dashoffset: 270; animation: draw 600ms linear 900ms forwards; }
    #strand-2 { stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw 600ms linear 1080ms forwards; }
    #strand-2-r1 { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 600ms linear 1260ms forwards; }
    #strand-2-r2 { stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw 600ms linear 1440ms forwards; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" data-cartridge="shape-braid">
  <polyline id="strand-0" fill="none" stroke="#d62828" stroke-width="4" points="205,5 325,35 373,47" />
  <polyline id="strand-0-r1" fill="none" stroke="#d62828" stroke-width="4" points="397,53 445,65 445,95 325,125 277,137" />
  <polyline id="strand-0-r2" fill="none" stroke="#d62828" stroke-width="4" points="253,143 205,155 205,185 205,215" />
  <polyline id="strand-1" fill="none" stroke="#2a9d2a" stroke-width="4" points="325,5 277,17" />
  <polyline id="strand-1-r1" fill="none" stroke="#2a9d2a" stroke-width="4" points="253,23 205,35 205,65 325,95 373,107" />
  <polyline id="strand-1-r2" fill="none" stroke="#2a9d2a" stroke-width="4" points="397,113 445,125 445,155 325,185 325,215" />
  <polyline id="strand-2" fill="none" stroke="#2828d6" stroke-width="4" points="445,5 445,35 325,65 277,77" />
  <polyline id="strand-2-r1" fill="none" stroke="#2828d6" stroke-width="4" points="253,83 205,95 205,125 325,155 373,167" />
  <polyline id="strand-2-r2" fill="none" stroke="#2828d6" stroke-width="4" points="397,173 445,185 445,215" />
</svg>
</body>
</html>
