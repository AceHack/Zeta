<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>shape-shadow-loop</title>
  <style>
    :root {
      --c0: #000000;
      --c1: #d62828;
      --c2: #2a9d2a;
      --c3: #d6c828;
      --c4: #2828d6;
      --c5: #d628d6;
      --c6: #28c8d6;
      --c7: #f0f0f0;
    }
    body { background: #101418; margin: 0; display: grid; place-items: center; min-height: 100vh; }
    svg { width: min(96vw, 960px); image-rendering: pixelated; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes appear { to { opacity: 1; } }
    polyline:hover { stroke-width: 7; filter: brightness(1.6); }
    @media (prefers-reduced-motion: reduce) { polyline { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; } }
    #loop { stroke-dasharray: 1440; stroke-dashoffset: 1440; animation: draw 600ms linear 0ms forwards; }
    #catch { stroke-dasharray: 48; stroke-dashoffset: 48; animation: draw 600ms linear 180ms forwards; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" data-cartridge="shape-shadow-loop">
  <polyline id="loop" fill="none" stroke="#f0f0f0" stroke-width="4" points="565,165 563,181 557,195 547,207 533,217 515,223 495,225 471,223 445,217 417,207 387,195 356,181 325,165 294,149 263,135 233,123 205,113 179,107 155,105 135,107 117,113 103,123 93,135 87,149 85,165 87,181 93,195 103,207 117,217 135,223 155,225 179,223 205,217 233,207 263,195 294,181 325,165 356,149 387,135 417,123 445,113 471,107 495,105 515,107 533,113 547,123 557,135 563,149 565,165" />
  <polyline id="catch" fill="none" stroke="#d628d6" stroke-width="4" points="325,159 331,165 325,171 319,165 325,159" />
</svg>
</body>
</html>
