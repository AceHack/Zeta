<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>shape-sybil-verdict</title>
  <style>
    :root {
      --c0: #000000;
      --c1: #d62828;
      --c2: #2a9d2a;
      --c3: #d6c828;
      --c4: #2828d6;
      --c5: #d628d6;
      --c6: #28c8d6;
      --c7: #f0f0f0;
    }
    body { background: #101418; margin: 0; display: grid; place-items: center; min-height: 100vh; }
    svg { width: min(96vw, 960px); image-rendering: pixelated; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes appear { to { opacity: 1; } }
    polyline:hover { stroke-width: 7; filter: brightness(1.6); }
    @media (prefers-reduced-motion: reduce) { polyline { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; } }
    #claim-0-r0 { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw 600ms linear 0ms forwards; }
    #claim-0-r1 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 600ms linear 180ms forwards; }
    #claim-0-r2 { stroke-dasharray: 210; stroke-dashoffset: 210; animation: draw 600ms linear 360ms forwards; }
    #claim-1-r0 { stroke-dasharray: 10; stroke-dashoffset: 10; animation: draw 600ms linear 540ms forwards; }
    #claim-1-r1 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 600ms linear 720ms forwards; }
    #claim-1-r2 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 600ms linear 900ms forwards; }
    #claim-1-r3 { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 600ms linear 1080ms forwards; }
    #claim-2 { stroke-dasharray: 270; stroke-dashoffset: 270; animation: draw 600ms linear 1260ms forwards; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" data-cartridge="shape-sybil-verdict">

  <polyline id="claim-0-r1" fill="none" stroke="#d62828" stroke-width="4" points="205,105 205,135 265,145 325,155 325,185" />
  <polyline id="claim-0-r2" fill="none" stroke="#d62828" stroke-width="4" points="205,205 205,235 265,245 325,255 325,295" />
  <polyline id="claim-1-r0" fill="none" stroke="#2828d6" stroke-width="4" points="325,25 325,35" />
  <polyline id="claim-1-r1" fill="none" stroke="#2828d6" stroke-width="4" points="205,55 205,85 265,95 325,105 325,135" />
  <polyline id="claim-1-r2" fill="none" stroke="#2828d6" stroke-width="4" points="205,155 205,185 265,195 325,205 325,235" />

  <polyline id="claim-2" fill="none" stroke="#2a9d2a" stroke-width="4" points="445,25 445,295" />
</svg>
</body>
