# Full-tier runtime pins — merged into .mise.toml ONLY when the host is tier=full
# (MISE_ENV=full, set by tools/setup/common/mise.sh via the host-tier helper).
# Workitem 081KTWQZY7F08QG0R0034KN17T; Aaron 2026-06-12: "addison and max and every cluster
# [node gets] full" — cluster nodes declare full at the zeta-install.sh call site regardless of
# hardware auto-detect; CI k8s lanes declare full explicitly; slim/standard hosts skip these.
#
# Cluster integration + GitOps health tooling (operator 2026-05-31): B-0967 proves
# Kubernetes + ArgoCD health through k3d/kind; kubeconform validates the k8s manifests in
# the `lint (yaml/k8s)` gate job. Same pins as before the split — one tool graph, tiered.

[tools]
# -- WASM compiler substrates (Oracles 10-13 / Conjecture Z-7) --
# Full-tier hosts (cluster nodes, dev laptops) carry all six WASM compilers.
# These mirror the declarations in .mise.toml for the base tier.
# zig: wasm32-freestanding substrate (Oracle 11, 951B binary)
zig = "0.13.0"
# rust: wasm32-unknown-unknown substrate (Oracle 12, 7.4KB binary)
#
# MUST stay byte-identical to the `rust = { ... }` entry in `.mise.toml`
# (081M05X126V087G0R0014GR9KQ). Measured on mise 2026.6.14: this file is loaded
# alongside `.mise.toml` and its `tools.rust` entry WINS — with a bare
# `rust = "1.87.0"` here, `mise config get tools.rust` resolves to the bare
# string and the components/targets declared in `.mise.toml` are silently
# dropped. A partial mirror is therefore not a harmless duplicate; it is an
# override that disarms the base-tier declaration on every host carrying both
# files. Re-check this if the mirror is ever reduced back to a version pin.
rust = { version = "1.87.0", components = ["rustfmt", "clippy"], targets = ["wasm32-unknown-unknown"] }

# -- Kubernetes tooling (full-tier only) --
k3d = "5.8.3"
kind = "0.31.0"
kubectl = "1.36.1"
helm = "4.2.0"
"github:yannh/kubeconform" = "0.7.0"
