<!--
  swarm.html — self-contained viewer for the agent-swarm interaction graph.
  DATA IS GENERATED: the <script id="swarm-data"> block below is overwritten by
  `bun src/Core.TypeScript/swarm-society/swarm-graph.ts`. Do not hand-edit it.

  This is a TROUBLESHOOTING lens on communication TOPOLOGY (who talks to whom,
  how clustered, how many hops apart) — deliberately NON-JUDGMENTAL and distinct
  from DORA (velocity) and the society rho / health metrics. It rests on the
  persona registry + AgencySignature root of trust: the built-in, always-on
  contrast to the METR/OpenAI Hugging Face incident, where the swarm's
  interaction graph had to be reconstructed forensically after the fact.
-->
<style>
  :root{
    --bg:#0B0E16; --panel:#0E1220; --border:#26304A; --ink:#E7EBF4;
    --dim:#94A0BC; --faint:#5E6B8A; --gold:#E8B566; --teal:#5EC8C2; --violet:#A78BFA;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1100px 600px at 72% -12%,#111a2e 0%,var(--bg) 60%);
    color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  a{color:var(--dim)}
  .mono{font-family:'Space Mono',monospace}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 72px}
  header{display:flex;align-items:center;gap:16px;padding:6px 2px 20px}
  .glyph{width:52px;height:52px;flex:0 0 auto;border-radius:50%;border:3px solid #7a6c58;
    background:radial-gradient(circle at 50% 36%,#6a5e4e,#2c2620 72%);display:grid;place-items:center;
    box-shadow:inset 0 0 12px rgba(0,0,0,.6)}
  .glyph b{font-family:'Space Mono',monospace;font-size:20px;color:var(--gold);text-shadow:0 0 10px rgba(232,181,102,.5)}
  .kicker{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  h1{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;letter-spacing:.02em;margin:2px 0 0}
  .sub{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:4px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 16px}
  .tile{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:12px 14px}
  .tile .lab{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .tile .val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-top:3px}
  .tile .hint{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:5px}
  .stage{display:grid;grid-template-columns:1fr 250px;gap:14px}
  @media(max-width:820px){.stage{grid-template-columns:1fr}}
  .graphcard{border:1px solid var(--border);border-radius:14px;background:#0C1020;overflow:hidden;position:relative}
  svg{display:block;width:100%;height:560px;touch-action:none}
  .side{display:flex;flex-direction:column;gap:12px}
  .card{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:13px 15px}
  .card h3{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
  .legrow{display:flex;align-items:center;gap:9px;margin:7px 0;cursor:pointer;user-select:none;font-size:12px}
  .legrow.off{opacity:.34}
  .swatch{width:22px;height:0;border-top-width:3px;border-top-style:solid;flex:0 0 auto;border-radius:2px}
  .legrow .meta{color:var(--faint);font-size:10px;margin-left:auto}
  .nlist{display:flex;flex-direction:column;gap:6px;font-size:11.5px}
  .nrow{display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .nrow .role{color:var(--faint);font-size:10px;margin-left:auto}
  .foot{margin-top:16px;font-size:11px;color:var(--dim);line-height:1.6}
  .tip{position:absolute;pointer-events:none;background:#0a0d17;border:1px solid var(--border);border-radius:8px;
    padding:7px 9px;font-family:'Space Mono',monospace;font-size:10.5px;color:var(--ink);opacity:0;transition:opacity .1s;max-width:240px;z-index:5}
  .pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-family:'Space Mono',monospace;font-size:9.5px;color:var(--dim);margin-left:6px}
</style>

</div>

<script>
(function(){
  "use strict";
  var G = JSON.parse(document.getElementById("swarm-data").textContent);
  var SVG_NS = "http://www.w3.org/2000/svg";
  var W = 900, H = 560;
  var active = {bus:true, workitem:true, commit:true};

  function fmt(x, d){ return x === null || x === undefined ? "n/a" : (typeof x === "number" ? x.toFixed(d) : x); }
  // HTML-entity encode every dynamic value before it reaches innerHTML. The graph
  // data is our own generated JSON (persona ids from the registry), but it is read
  // via textContent and must not be reinterpreted as HTML unescaped
  // (CodeQL js/dom-text-reinterpreted-as-html). This is the sanitizer barrier.
  function esc(s){
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  // ---- metric tiles (non-judgmental one-liners) ----
  var m = G.metrics;
  var tiles = [
    ["personas", m.nodeCount, "named agents on the board"],
    ["links", m.edgeCount, "distinct pairs that interacted"],
    ["density", fmt(m.density,2), "share of possible pairs that talk"],
    ["clustering", fmt(m.clusteringCoefficient,2), "do neighbours share neighbours (cliquey?)"],
    ["avg hops", fmt(m.averagePathLength,2), "typical distance between two agents"],
    ["small-world &sigma;", fmt(m.smallWorldSigma,2), "&gt;1 hints small-world (clustered + short paths)"],
    ["islands", m.componentCount, "disconnected groups (isolation is visible, not bad)"],
    ["bus reciprocity", fmt(m.reciprocityBus,2), "how often a message gets a reply back"]
  ];
  var thtml = tiles.map(function(t){
    // t[0]/t[2] are trusted in-page literals (carry intentional entities like
    // &sigma;); t[1] is data-derived and is escaped.
    return '<div class="tile"><div class="lab">'+t[0]+'</div><div class="val">'+esc(t[1])+'</div><div class="hint">'+t[2]+'</div></div>';
  }).join("");
  document.getElementById("tiles").innerHTML = thtml;

  // ---- legend ----
  var colorByChannel = {};
  G.channels.forEach(function(c){ colorByChannel[c.channel] = c.color; });
  var legend = document.getElementById("legend");
  G.channels.forEach(function(c){
    var edges = G.edges.filter(function(e){ return e.channel === c.channel; }).length;
    var row = document.createElement("div");
    row.className = "legrow";
    row.setAttribute("data-ch", c.channel);
    row.innerHTML = '<span class="swatch" style="border-top-color:'+esc(c.color)+'"></span>'+
      '<span>'+esc(c.label)+(c.directed?' &rarr;':'')+'</span><span class="meta">'+esc(edges)+'</span>';
    row.addEventListener("click", function(){
      active[c.channel] = !active[c.channel];
      row.classList.toggle("off", !active[c.channel]);
      render();
    });
    legend.appendChild(row);
  });

  // ---- node list ----
  var nl = document.getElementById("nodelist");
  G.nodes.slice().sort(function(a,b){ return b.activity - a.activity; }).forEach(function(n){
    var row = document.createElement("div");
    row.className = "nrow";
    row.innerHTML = '<span class="dot" style="background:'+esc(n.color)+'"></span>'+
      '<span class="mono">'+esc(n.id)+'</span><span class="role">'+esc(n.role)+' &middot; '+esc(n.activity)+'</span>';
    nl.appendChild(row);
  });

  // ---- footer provenance ----
  var cov = G.coverage;
  document.getElementById("foot").innerHTML =
    "generated " + esc(G.generatedAt || "—") + " &middot; window " + (G.windowDays===null?"all-time":esc(G.windowDays)+"d") +
    " &middot; sources: bus " + esc(cov.bus.records) + " msgs / work-items " + esc(cov.workitem.records) + " events / commits " + esc(cov.commit.records) +
    ". <span class='pill'>root of trust: persona registry + AgencySignature</span> " +
    "This is the built-in version of the swarm visibility the METR/OpenAI Hugging Face incident had to reconstruct forensically. " +
    "It is a troubleshooting lens on interaction shape — not a health score, not a ranking.";

  // ---- force layout (dependency-free) ----
  var svg = document.getElementById("graph");
  var nodes = G.nodes.map(function(n){ return Object.assign({}, n); });
  var byId = {};
  nodes.forEach(function(n,i){
    var a = (i / Math.max(1,nodes.length)) * Math.PI * 2;
    n.x = W/2 + Math.cos(a)*180 + (Math.random()-0.5)*40;
    n.y = H/2 + Math.sin(a)*150 + (Math.random()-0.5)*40;
    n.vx = 0; n.vy = 0;
    byId[n.id] = n;
  });
  var maxAct = Math.max(1, Math.max.apply(null, nodes.map(function(n){return n.activity;})));
  function radius(n){ return 9 + 20 * Math.sqrt(n.activity / maxAct); }

  function activeEdges(){ return G.edges.filter(function(e){ return active[e.channel] && byId[e.source] && byId[e.target]; }); }

  function layout(){
    var iters = 320;
    for(var it=0; it<iters; it++){
      var k = 0.9;
      // repulsion
      for(var i=0;i<nodes.length;i++){
        for(var j=i+1;j<nodes.length;j++){
          var a=nodes[i], b=nodes[j];
          var dx=a.x-b.x, dy=a.y-b.y;
          var d2 = dx*dx+dy*dy+0.01;
          var f = 9000 / d2;
          var d = Math.sqrt(d2);
          var ux=dx/d, uy=dy/d;
          a.vx += ux*f; a.vy += uy*f; b.vx -= ux*f; b.vy -= uy*f;
        }
      }
      // springs (all edges regardless of toggle, so hidden channels still shape)
      G.edges.forEach(function(e){
        var a=byId[e.source], b=byId[e.target]; if(!a||!b) return;
        var dx=b.x-a.x, dy=b.y-a.y; var d=Math.sqrt(dx*dx+dy*dy)+0.01;
        var rest = 120;
        var f = (d-rest) * 0.02 * Math.min(3, 1 + Math.log(1+e.weight));
        var ux=dx/d, uy=dy/d;
        a.vx += ux*f; a.vy += uy*f; b.vx -= ux*f; b.vy -= uy*f;
      });
      // centering + integrate
      nodes.forEach(function(n){
        n.vx += (W/2 - n.x)*0.006; n.vy += (H/2 - n.y)*0.006;
        n.x += n.vx*k; n.y += n.vy*k; n.vx*=0.82; n.vy*=0.82;
        n.x = Math.max(40, Math.min(W-40, n.x)); n.y = Math.max(34, Math.min(H-34, n.y));
      });
    }
  }

  function el(name, attrs){
    var e = document.createElementNS(SVG_NS, name);
    for(var k in attrs){ e.setAttribute(k, attrs[k]); }
    return e;
  }

  var tip = document.getElementById("tip");
  function showTip(html, x, y){ tip.innerHTML = html; tip.style.left=(x+14)+"px"; tip.style.top=(y+10)+"px"; tip.style.opacity=1; }
  function hideTip(){ tip.style.opacity=0; }

  var maxW = Math.max(1, Math.max.apply(null, G.edges.map(function(e){return e.weight;})));
  function strokeW(w){ return 1 + 5 * Math.sqrt(w/maxW); }

  function render(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    // arrow marker
    var defs = el("defs",{});
    ["bus"].forEach(function(ch){
      var mk = el("marker",{id:"arw-"+ch,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
      mk.appendChild(el("path",{d:"M0,0 L10,5 L0,10 z",fill:colorByChannel[ch]}));
      defs.appendChild(mk);
    });
    svg.appendChild(defs);

    // edges
    activeEdges().forEach(function(e){
      var a=byId[e.source], b=byId[e.target];
      var line = el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:colorByChannel[e.channel],
        "stroke-width":strokeW(e.weight),"stroke-opacity":0.55,"stroke-linecap":"round"});
      if(e.directed){
        // shorten to node edge so arrow sits at the rim
        var dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
        var rb=radius(b);
        line.setAttribute("x2", b.x - dx/d*rb);
        line.setAttribute("y2", b.y - dy/d*rb);
        line.setAttribute("marker-end","url(#arw-bus)");
      }
      line.addEventListener("mousemove",function(ev){
        showTip(esc(e.source)+(e.directed?" &rarr; ":" &harr; ")+esc(e.target)+"<br>"+esc(e.channel)+" &middot; weight "+esc(e.weight)+(e.lastAt?"<br>last "+esc(e.lastAt.slice(0,10)):""), ev.offsetX, ev.offsetY);
      });
      line.addEventListener("mouseleave", hideTip);
      svg.appendChild(line);
    });

    // nodes
    nodes.forEach(function(n){
      var r = radius(n);
      var g = el("g",{});
      var c = el("circle",{cx:n.x,cy:n.y,r:r,fill:n.color,"fill-opacity":0.9,stroke:"#0B0E16","stroke-width":2});
      var deg = n.degree;
      c.addEventListener("mousemove",function(ev){
        showTip("<b>"+esc(n.id)+"</b> &middot; "+esc(n.role)+"<br>activity "+esc(n.activity)+" &middot; degree "+esc(deg)+" &middot; strength "+esc(n.strength), n.x, n.y);
      });
      c.addEventListener("mouseleave", hideTip);
      g.appendChild(c);
      var t = el("text",{x:n.x,y:n.y+r+12,"text-anchor":"middle",fill:"#C9D2E8","font-size":"11","font-family":"Space Mono, monospace"});
      t.textContent = n.id;
      g.appendChild(t);
      svg.appendChild(g);
    });
  }

  layout();
  render();
})();
</script>
</body>
