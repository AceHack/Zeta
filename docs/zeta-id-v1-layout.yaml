version: 1
total_bits: 128
endianness: big                    # MSB at bit 127
bit_numbering: lsb_zero            # bit 0 = LSB, bit 127 = MSB
description: "Zeta Observation ID v1 — 128-bit semantic DNA"

fields:
  - name: Version
    offset: 123
    width: 5
    type: enum
    enum_ref: registry/id-versions.yaml
    required: true

  - name: Timestamp
    offset: 75
    width: 48
    type: int64
    unit: ms
    validation: { min: 0, max: 281474976710655 }   # 2^48 - 1
    required: true

  - name: Chromosome
    offset: 70
    width: 5
    type: enum
    enum_ref: registry/chromosomes.yaml
    required: true

  - name: Category
    offset: 65
    width: 4
    type: enum
    enum_ref: registry/categories.yaml
    required: true


  - name: Authority
    offset: 59
    width: 5
    type: discriminated_union
    cases_ref: registry/authority-cases.yaml
    raw_escape: true
    required: true

  - name: Persona
    offset: 51
    width: 8
    type: enum
    enum_ref: registry/personas.yaml
    required: true

  - name: Momentum
    offset: 43
    width: 8
    type: discriminated_union
    cases_ref: registry/momentum-cases.yaml
    raw_escape: true
    required: true

  - name: Location
    offset: 35
    width: 8
    type: enum
    enum_ref: registry/locations.yaml
    required: true

  - name: Randomness
    offset: 0
    width: 32
    type: random
    source: env.nextInt64
    mask: 0xFFFFFFFF
    description: "Safe 32-bit window. 64-bit randomness in earlier versions corrupted higher fields (empirically caught by round-trip test)."

reserved_bits:
  # Sum of named field widths = 123. Total bits = 128. Difference = 5 reserved bits
  # at the offsets below. Pack() leaves them zero; Unpack() ignores them. Reserved
  # bits are V2+ evolution surface (e.g., signature-version stripe, parity bit,
  # confidentiality flag, or an extension to one of the existing fields).
  # Touching them in V1 is an unversioned schema break.
  - offset: 32
    width: 3
    note: "Gap between Randomness end (bit 31) and Location start (bit 35)"
  - offset: 64
    width: 1
    note: >-
      Former Firefly bit, reclaimed 2026-08-11 (no-shift: no other field moved).
      Firefly was a declared case-of-one (`NoDirective = 1`), i.e. it encoded an
      INVARIANT rather than a variable — a bit that can never vary carries zero
      information, and the no-directives principle is enforced by governance, not
      by a wire bit. It was also already incoherent in practice: TypeScript writers
      emitted 1 while `ReticulumLink.fs` emitted 0, and C#'s enum had no zero member
      at all, so unpacking such an id produced an undeclared value with no error.
      NOTE for reclaimers: this bit is NOT adjacent to Randomness (0-31), so it
      cannot widen the entropy field without a relocation. If more entropy is ever
      needed (e.g. birthday collisions at volume), the 3 reserved bits at offset 32
      sit directly above Randomness and are the natural candidate.

      CAUTION — bit 64 has a SECOND, legitimate meaning that no generated constant covers.
      For categories >= 9 (ContentAddress and the generic payload layouts) the codec does NOT
      use the observation field layout: `packGeneric`/`unpackGeneric` spread payload across
      bits 0..64 and 69..122, so a generic ZetaId DOES write bit 64 and that is correct.
      "Reserved" here means the OBSERVATION pack path leaves it zero; unpack must still accept
      it set, which is why the `max-128` cross-verification vector is deliberately all-ones and
      was NOT altered by this reclamation. Do not "fix" the generic layout into agreement with
      the observation layout — they are different layouts sharing one 128-bit word.
  - offset: 69
    width: 1
    note: "Gap between Category end (bit 68) and Chromosome start (bit 70)"

# Sanity check (for spec readers):
#   5 + 48 + 5 + 4 + 5 + 8 + 8 + 8 + 32 = 123 named-field bits
#   123 + 5 reserved = 128 total_bits
