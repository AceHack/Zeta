schema: zeta-registry/v1
description: |
  Uncompensatable-floor registry — the drift-and-heal ADR's pre-merge floor
  as DATA, not prose (workitem 081KX3KA3EK08QG0R0019ER8WV; ADR
  docs/DECISIONS/2026-07-09-drift-and-heal-replaces-pre-merge-gates-
  reconciliation-at-ai-speed.md, item 5). Everything NOT in this registry
  converges via drift detection + certified healers; only these classes may
  block pre-merge. The default derivation is the ERASURE class — violations
  that break T-reconstructibility of the ledger (deterministic-agreed-time
  ferry, 2026-07-09). An explicitly consented adjacent functional-break entry
  must say that it is NOT erasure-class and record the measured reason for the
  exception. Detectors, hooks, and humans read THIS file; additions require
  the treaty-amendment consent path, removals likewise.
entries:
  - id: secret-exposure
    description: "Secret / key material committed or logged — cannot be unpublished; the adversary's ledger cannot be erased"
    detector: "gitleaks-class scanners (gate secret scan)"
    rationale: erasure-class
  - id: treaty-byte-lock-vectors
    description: "Golden-vector cross-oracle contracts (identity actor-ref, ZetaId, IR) that other lanes build on THIS tick"
    detector: "tests/cross-verification/ suites"
    rationale: erasure-class
  - id: consent-invariants-hc9
    description: "Persona-memory consent (HC-9): no human-unilateral wipe; persona is the consenting party"
    detector: "cascade-teardown persona-consent gates (tools/setup/persona-keys/cascade-teardown.ts)"
    rationale: erasure-class
  - id: signed-history-rewrite
    description: "Force-push / rewrite of signed history — destroys the record itself"
    detector: "branch protection non-fast-forward refusal"
    rationale: erasure-class
  - id: workflow-supply-chain
    description: "Mutable third-party action tags or untrusted event data inline in run: — a poisoned tag executes on the NEXT tick, ahead of any reconstruction (Vera review, #9601)"
    detector: ".semgrep-floor.yml via the gate's blocking lint (semgrep) job — this file IS the floor scan; the full set runs as non-blocking drift in lint (semgrep drift)"
    rationale: erasure-class
  - id: scoped-build-test-break
    description: >-
      Functional build/test failure in the PR's OWN scope — downstream lanes consume the break this
      tick; never blocks on pre-existing whole-repo drift (Vera review, #9601 P1).
      PLATFORM COVERAGE IS NARROWER THAN THE ENTRY NAME, and is stated here so the registry does not
      overstate itself: only the LINUX legs of `gate build-and-test` (ubuntu-24.04, ubuntu-24.04-arm)
      can block. The windows-2025 / windows-11-arm legs (2026-08-19) and the macos-26 leg
      (2026-08-19, same day, second amendment) carry `continue-on-error` and are DRIFT CHECKS by
      maintainer classification — Aaron: "windows and mac are drift checks … we don't want to block
      on them", then "we are moving away from anything that blocks into drift checks instead". Their
      failures reach `gate (required)` as success and are reported, not enforced; the reporting path
      is named in the detector field below. Narrowing coverage went through the same treaty-amendment
      consent path this file requires for additions.
    detector: >-
      gate build-and-test, scoped to the diff — BLOCKING on ubuntu-24.04 + ubuntu-24.04-arm only.
      Non-blocking legs are reported by src/Core.TypeScript/ci/gate-scope-summary.ts (per-run: the
      `gate (required)` step summary + a warning annotation naming each leg that failed
      non-blockingly), by drift-sweep.yml's BD001 detector (post-merge, into docs/drift-events/), and
      by src/Core.TypeScript/ci/platform-drift-report.ts (rates + coverage → data/platform-drift.json
      → data/monitor.html). The leg's own check run still concludes `failure`, so it is a visible red
      X beside the green rollup.
    rationale: erasure-class
  - id: typescript-type-break
    description: >-
      TypeScript type errors in the PR's own diff. Admitted 2026-08-17 on Aaron's explicit consent
      ("yes add lint (TS) to the required floor"), via the treaty-amendment path this file names.
      Precedent is this class recurring after its gate was removed: the `lint-typescript` job was
      created because "Slice 9 (PR #882) shipped a real TS2322 to main", the drift-and-heal flip
      later dropped it from the blocking list, and on 2026-08-17 the identical class shipped again —
      TS2322 in installer/usb-iserial-probe.ts plus six TS2300s in zflash/test-harness/run.test.ts,
      live on main while `gate (required)` reported SUCCESS (PR #11268 merged 02:05:47Z with
      `lint (TS)` FAILURE). The job's own header states the principle: codified rules without a gate
      are not a control.
    detector: "gate lint-typescript (tsc --noEmit, tsconfig strict mode)"
    rationale: >-
      NOT erasure-class, and recorded as such rather than relabelled to fit. Admitted on the adjacent
      `scoped-build-test-break` rationale — a functional break downstream lanes consume this tick. The
      honest limit: a pre-merge floor checks each branch against main-as-it-was, so it cannot catch the
      two-PR semantic collision that prompted the amendment (both 2026-08-17 PRs were individually
      green; the duplicate import existed only in the merged tree). That class needs a merge queue.
      This entry closes the single-PR case only.
  - id: typescript-hermetic-behavior-break
    description: >-
      Functional failures in the dependency-closed, whole-tree TypeScript behavior suite. Admitted
      2026-08-25 on Aaron's explicit consent ("lets try to get your hermetic suite in and if we need
      to update drift policies do so") after a measured probationary period. PR #15352 merged while
      `test (TS hermetic)` was red and `gate (required)` was green; the failure was a real repository
      defect in the generated-code execution budget, not an unavailable service or developer-machine
      dependency. PR #15358 fixed the defect but merged before the suite finished, proving that a
      non-blocking run cannot establish a pre-merge behavior floor. PR #15395 supplied a second
      post-repair green run before merge.
    detector: >-
      gate test-typescript-hermetic (`bun --config=bunfig.hermetic.toml test`); structurally pinned in
      src/Core.TypeScript/ci/gate-scope-summary.test.ts. The separate test-typescript-environment job
      remains a non-blocking drift check.
    rationale: >-
      NOT erasure-class. Admitted on the adjacent scoped-build-test-break rationale because the
      dependency-closed suite covers executable behavior that downstream lanes consume this tick.
      This is a deliberate narrow exception to the ADR's diff-scoped default: the bare whole-tree
      invocation prevents new TypeScript test directories from silently escaping CI, which a path
      allowlist or diff filter would reintroduce. The accepted cost is that existing hermetic drift
      can temporarily block an unrelated PR until healed. Environment-dependent failures do not gain
      blocking authority from this entry.
