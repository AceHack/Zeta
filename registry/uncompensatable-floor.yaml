schema: zeta-registry/v1
description: |
  Uncompensatable-floor registry — the drift-and-heal ADR's pre-merge floor
  as DATA, not prose (workitem 081KX3KA3EK08QG0R0019ER8WV; ADR
  docs/DECISIONS/2026-07-09-drift-and-heal-replaces-pre-merge-gates-
  reconciliation-at-ai-speed.md, item 5). Everything NOT in this registry
  converges via drift detection + certified healers; only these classes may
  block pre-merge. Derivation: the floor is the ERASURE class — violations
  that break T-reconstructibility of the ledger (deterministic-agreed-time
  ferry, 2026-07-09). Detectors, hooks, and humans read THIS file; additions
  require the treaty-amendment consent path, removals likewise.
entries:
  - id: secret-exposure
    description: "Secret / key material committed or logged — cannot be unpublished; the adversary's ledger cannot be erased"
    detector: "gitleaks-class scanners (gate secret scan)"
    rationale: erasure-class
  - id: treaty-byte-lock-vectors
    description: "Golden-vector cross-oracle contracts (identity actor-ref, ZetaId, IR) that other lanes build on THIS tick"
    detector: "tests/cross-verification/ suites"
    rationale: erasure-class
  - id: consent-invariants-hc9
    description: "Persona-memory consent (HC-9): no human-unilateral wipe; persona is the consenting party"
    detector: "cascade-teardown persona-consent gates (tools/setup/persona-keys/cascade-teardown.ts)"
    rationale: erasure-class
  - id: signed-history-rewrite
    description: "Force-push / rewrite of signed history — destroys the record itself"
    detector: "branch protection non-fast-forward refusal"
    rationale: erasure-class
  - id: workflow-supply-chain
    description: "Mutable third-party action tags or untrusted event data inline in run: — a poisoned tag executes on the NEXT tick, ahead of any reconstruction (Vera review, #9601)"
    detector: "semgrep gha-action-mutable-tag + gha-untrusted-in-run-line (blocking)"
    rationale: erasure-class
  - id: scoped-build-test-break
    description: "Functional build/test failure in the PR's OWN scope — downstream lanes consume the break this tick; never blocks on pre-existing whole-repo drift (Vera review, #9601 P1)"
    detector: "gate build-and-test, scoped to the diff"
    rationale: erasure-class
