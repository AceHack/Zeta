schema: zeta-registry/v1
description: |
  Cell surfaces registry — descriptive vocabulary of KNOWN surfaces.
  NOT a closure of the open cell set (treaty Art. 1: cells are open,
  self-describing satellite data; new surfaces appear without treaty
  or schema ceremony). Consumers may use this list for vocabulary
  (codegen, lint, dashboards) but MUST NOT reject an unlisted surface
  on identity grounds — authorization is per-resource policy over
  ActorRef fields (ADR §3), never registry closure.
surfaces:
