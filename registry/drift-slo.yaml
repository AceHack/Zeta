# Drift SLO registry — the enforcement half of the drift-and-heal ADR
# (items 2 + 6 as amended 2026-07-09: MTTH and its SLO are TICK-indexed;
# the phase clock is the official drift reference frame).
#
# 1 tick = one drift-sweep of main (.github/workflows/drift-sweep.yml,
# cron every 4h). A drift class whose oldest OPEN finding has been open
# for MORE than max_open_age_ticks ticks is in breach, and the sweep
# auto-files a P1 workitem for it (`drift-ledger.ts slo`) — one filing
# per breach episode, tracked in docs/drift-events/slo-filed.json, which
# clears when the class fully heals.
#
# Post-flip (#9860) drift does not block merges; THIS file is what keeps
# that from decaying into normalized deviance: a threshold here is a
# promise about how long the fleet lets a drift class live before work
# is mechanically filed. Raising a budget = weakening that promise —
# treat changes like any registry change (PR + review; the floor
# registry's consent discipline is the sibling precedent).

defaults:
  # ~24 hours at the 4-hour cadence — the fallback for classes without
  # measured evidence.
  max_open_age_ticks: 6

# Gyroscope closure (2026-08-10): once a class has min_heals of measured
# evidence, its budget derives from its OWN demonstrated MTTH —
# ceil(multiplier x mtth), floored at floor_ticks. Explicit per_rule
# overrides always win. A "leak" is thereby drift outliving the fleet's
# own proven pace, not an arbitrary constant.
adaptive:
  multiplier: 2
  min_heals: 2
  floor_ticks: 1

# Per-rule overrides (tighter or looser than the default), e.g.:
#   MD022:
#     max_open_age_ticks: 12
per_rule:
  # BD001 = whole-repo build drift on main (the drift-sweep detector step;
  # detector half of 081KZHGP45V, from Vera's drift-ADR ratification note).
  # Tightest budget on the ledger: a red build-and-test leg on main's own
  # gate run gets ONE tick of tolerance, then work is mechanically filed.
  BD001:
    max_open_age_ticks: 1

  # LD001 = package.json / bun.lock desync. Like BD001 this is a HARD red: every
  # consumer runs `bun install --frozen-lockfile`, which fails closed, so the build
  # is broken for everyone while it stays open. It cost two red mains on 2026-08-10
  # (c101a6ac9 added dependencies, 47095a706 removed one).
  #
  # Budget 1 — same tolerance as BD001, for a stronger reason. This class has a
  # dedicated healer (.github/workflows/lockfile-healer.yml) running every 17 minutes
  # AND on push. A finding still open after a full 4-hour sweep tick therefore means
  # the HEALER failed, not that nobody got to it, and that deserves filed work.
  LD001:
    max_open_age_ticks: 1
