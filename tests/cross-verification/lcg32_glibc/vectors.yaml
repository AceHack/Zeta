# lcg32_glibc vectors
#
# WHAT THESE VECTORS ACTUALLY ENCODE — read this before trusting the directory name.
#
#   expected(id) = (1103515245 * state + 12345) mod 2^32
#
# a FULL-WORD 32-bit linear congruential step carrying the ANSI/glibc-TYPE_0
# constant pair. That is what the committed IR says (`mul 1103515245`,
# `add 12345`, width 32) and what every lane computes; there is no arithmetic
# defect here.
#
# THE NAME OVERCLAIMS. glibc does not compute this.
#   * glibc `stdlib/random_r.c`, `__random_r`, TYPE_0 branch:
#         int32_t val = ((read_state(state, 0) * 1103515245U) + 12345U)
#                        & 0x7fffffff;
#         write_state (state, 0, val);
#     The reduction is mod 2^31, and the MASKED value is written back into the
#     state — so the recurrence itself is mod 2^31, not a full-width state with a
#     truncated output.
#   * Under that reading FOUR of the ten vectors below differ — the four whose
#     product exceeds 2^31:
#         x-2  here 2207042835   glibc TYPE_0   59559187
#         x-3  here 3310558080   glibc TYPE_0 1163074432
#         x-6  here 2326136519   glibc TYPE_0  178652871
#         x-7  here 3429651764   glibc TYPE_0 1282168116
#     The other six agree, because their products stay under 2^31 and the mask is
#     a no-op. Six-of-ten agreement is how a wrong anchor survives a spot check.
#   * glibc's default `rand()` is not this generator at all: `unsafe_state` is
#     initialised `.rand_type = TYPE_3` (`stdlib/random.c`), the degree-31
#     additive-feedback trinomial. TYPE_0 is reached only through `initstate()`
#     with a state buffer smaller than 8 words.
#   * It is not the ANSI C example `rand()`'s OUTPUT either: that example's state
#     is an `unsigned long` (mod 2^64 on LP64) and it returns bits 30..16, not
#     the whole word. The constants are shared; the function is not.
#
# NOT RENAMED HERE, DELIBERATELY. `idOf "rng.lcg32_glibc" 1` is a pure function
# of the name, so a rename moves the generator's ZetaId, the `generator` field
# inside the content-addressed IR document, and every golden byte derived from
# both — and it requires editing `src/Core/ZetaIrV4.fs`, owned by another agent
# in flight. The finding is pinned as an executable assertion instead, in
# `tests/cross-verification/_harness/anchor-entailment.test.ts`, and the rename
# is filed as work-item 081M02YCNMA087G0R003TK7AEW.
#
# (.claude/rules/anchor-to-human-prior-art.md — an anchor must be CHECKED for
#  entailment, not cited. .claude/rules/numerology-vs-number-theory.md — the
#  constant pair 1103515245/12345 appears in several distinct generators, so the
#  constants never identified which one this is; the MODULUS does.)
vectors:
