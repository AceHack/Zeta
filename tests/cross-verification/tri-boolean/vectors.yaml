version: 1
description: "Canonical TriBoolean digital qubit test vectors for cross-verification"

vectors:
  - id: unary-t
    type: unary
    state: T
    is_living: false
    is_certain: true
    not_state: F
    cooperate_state: T
    measure_ok: true
    measure_value: true
    measure_feedback: ""
    map_not: F
    bind_not: F
    bind_to_t: T

  - id: unary-f
    type: unary
    state: F
    is_living: false
    is_certain: true
    not_state: T
    cooperate_state: F
    measure_ok: true
    measure_value: false
    measure_feedback: ""
    map_not: T
    bind_not: T
    bind_to_t: T

  - id: unary-n
    type: unary
    state: N
    is_living: true
    is_certain: false
    not_state: N
    cooperate_state: N
    measure_ok: false
    measure_value: false
    measure_feedback: "collapsed-living-uncertainty"
    map_not: N
    bind_not: N
    bind_to_t: N

  - id: and-t-t
    type: binary
    left: T
    right: T
    expected_and: T
    expected_or: T

  - id: and-t-f
    type: binary
    left: T
    right: F
    expected_and: F
    expected_or: T

  - id: and-t-n
    type: binary
    left: T
    right: N
    expected_and: N
    expected_or: T

  - id: and-f-t
    type: binary
    left: F
    right: T
    expected_and: F
    expected_or: T

  - id: and-f-f
    type: binary
    left: F
    right: F
    expected_and: F
    expected_or: F

  - id: and-f-n
    type: binary
    left: F
    right: N
    expected_and: F
    expected_or: N

  - id: and-n-t
    type: binary
    left: N
    right: T
    expected_and: N
    expected_or: T

  - id: and-n-f
    type: binary
    left: N
    right: F
    expected_and: F
    expected_or: N

  - id: and-n-n
    type: binary
    left: N
    right: N
    expected_and: N
    expected_or: N

  - id: float-mode-equals-bias
    type: float
    high: "FFFF"
    decoder: "TFF"
    low: "FTFT"
    expected_ok: true
    expected_value: 5.0
    expected_feedback: ""
    encode_value: 5.0
    expected_encode_ok: true
    expected_encode_high: "FTFT"
    expected_encode_decoder: "FFF"
    expected_encode_low: "FFFF"

  - id: float-mode-greater-than-bias
    type: float
    high: "FFFF"
    decoder: "TFT"
    low: "FFTT"
    expected_ok: true
    expected_value: 6.0
    expected_feedback: ""

  - id: float-mode-less-than-bias-half
    type: float
    high: "FFFF"
    decoder: "FTT"
    low: "TFFF"
    expected_ok: true
    expected_value: 4.0
    expected_feedback: ""

  - id: float-mode-less-than-bias-quarter
    type: float
    high: "FFFF"
    decoder: "FTF"
    low: "FTFF"
    expected_ok: true
    expected_value: 1.0
    expected_feedback: ""

  - id: float-reads-high-low
    type: float
    high: "FFFT"
    decoder: "TFF"
    low: "FFFF"
    expected_ok: true
    expected_value: 16.0
    expected_feedback: ""

  - id: float-interpretation-superposed
    type: float
    high: "FFFF"
    decoder: "TNF"
    low: "FTFT"
    expected_ok: false
    expected_value: 0.0
    expected_feedback: "interpretation-superposed"

  - id: float-value-superposed
    type: float
    high: "FFFN"
    decoder: "TFF"
    low: "FFFF"
    expected_ok: false
    expected_value: 0.0
    expected_feedback: "value-superposed"

  - id: float-both-superposed
    type: float
    high: "NFFF"
    decoder: "NFF"
    low: "FFFF"
    expected_ok: false
    expected_value: 0.0
    expected_feedback: "interpretation-superposed"

  - id: float-encode-0
    type: float
    high: "FFFF"
    decoder: "FFF"
    low: "FFFF"
    expected_ok: true
    expected_value: 0.0
    expected_feedback: ""
    encode_value: 0.0
    expected_encode_ok: true
    expected_encode_high: "FFFF"
    expected_encode_decoder: "FFF"
    expected_encode_low: "FFFF"

  - id: float-encode-negative
    type: float
    high: "FFFF"
    decoder: "FFF"
    low: "FFFF"
    expected_ok: true
    expected_value: 0.0
    expected_feedback: ""
    encode_value: -1.0
    expected_encode_ok: false
    expected_encode_detail: "v0 is unsigned + finite"

  - id: float-encode-non-dyadic
    type: float
    high: "FFFF"
    decoder: "FFF"
    low: "FFFF"
    expected_ok: true
    expected_value: 0.0
    expected_feedback: ""
    encode_value: 0.1
    expected_encode_ok: false
    expected_encode_detail: "no (mode,V) with mode<=7 and V<256 represents 0.1"
