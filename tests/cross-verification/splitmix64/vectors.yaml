version: 1
description: >-
  SplitMix64 finaliser golden vectors — the shared seed for cross-language
  byte-lock. Sebastiano Vigna's mixer (arXiv:1410.0530 §3; public-domain
  reference https://prng.di.unimi.it/splitmix64.c), the deterministic mixing
  step behind Zeta's DST RNG. mix(x): z = x*0x9E3779B97F4A7C15; z = (z ^ z>>30)
  * 0xBF58476D1CE4E5B9; z = (z ^ z>>27) * 0x94D049BB133111EB; return z ^ z>>31
  — all WRAPPING uint64 arithmetic. uint64 exceeds JSON's exact number range,
  so inputs (id-encoded) and the canonical `result` are decimal STRINGS (parse
  to BigInt / UInt64 / u64). Cross-language agreement here is load-bearing:
  DST replays must produce identical pseudo-random streams across the ports.
