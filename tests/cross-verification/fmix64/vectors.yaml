version: 1
description: >-
  MurmurHash3 fmix64 finaliser golden vectors — the THIRD "generated-from-ir"
  primitive (after splitmix64 at u64 and fmix32 at u32), proving the DynamicValue
  IR vocabulary generalises to a SECOND member of the hash family at the u64
  width. Austin Appleby's avalanche finalizer (public domain, smhasher
  MurmurHash3.cpp): k ^= k>>33; k *= 0xff51afd7ed558ccd; k ^= k>>33;
  k *= 0xc4ceb9fe1a85ec53; k ^= k>>33 — all WRAPPING uint64 arithmetic. The ops
  are exactly the `mul`/`xorshr` vocabulary at width 64, so the same total-u-word
  IR interpreter folds it; only the IR row differs from the other two generators.
  Inputs (id-encoded) and the canonical `result` are decimal STRINGS (parse to
  BigInt / UInt64 / u64).
