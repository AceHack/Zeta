  Numerical Recipes 32-bit Linear Congruential Generator (LCG) finaliser golden vectors
  — a second "add-user" primitive to prove that the `add` op (zeta-ir-v4) generalizes
  to a 32-bit word width and different constants. The algorithm is
  `x = x * 1664525 + 1013904223`.
