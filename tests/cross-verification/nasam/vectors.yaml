version: 1
description: >-
  nasam mixer golden vectors — the FIFTH generated-from-ir primitive and the
  SECOND grammar evolution (it needs ops the v2 mul/xorshr/rotl vocabulary
  cannot express: XOR-ing several self-rotations / self-shifts of the CURRENT
  word back into it). Pelle Evensen's public-domain reference
  (mostlymangling.blogspot.com/2020/01/nasam-not-another-strange-acronym-mixer.html)
  is, with M1 = 0x9E6C63D0676A9A99 and M2 = 0x9E6D62D06F6A9A9B, all WRAPPING uint64:
    x ^= ror(x,25) ^ ror(x,47);  x *= M1;  x ^= x>>23 ^ x>>51;  x *= M2;  x ^= x>>23 ^ x>>51
  In the zeta-ir-v3 grammar the ops are xrotxor[39,17] (ror 25/47 == rotl 39/17),
  mul M1, xshrxor[23,51], mul M2, xshrxor[23,51] at width 64. Inputs and the
  canonical result are decimal STRINGS (parse to BigInt / UInt64 / u64).
