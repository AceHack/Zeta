description: xoshiro256** OUTPUT SCRAMBLER golden vectors — the FOURTH generated-from-ir primitive and the FIRST under the EXTENDED zeta-ir-v2 grammar (it needs a constant rotate-left, rotl, which the v1 mul/xorshr vocabulary cannot express). Blackman & Vigna public-domain reference (prng.di.unimi.it/xoshiro256starstar.c) scrambler is result = rotl(x*5, 7) * 9, all WRAPPING uint64. The ops are mul 5, rotl 7, mul 9 at width 64. Inputs and the canonical result are decimal STRINGS (parse to BigInt / UInt64 / u64).
