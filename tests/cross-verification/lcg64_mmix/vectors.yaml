version: 1
description: >-
  Knuth's 64-bit Linear Congruential Generator (from MMIX) finaliser golden vectors
  — the SIXTH "generated-from-ir" primitive, and the first to require the `add` op
  (zeta-ir-v4). The algorithm is `x = x * 6364136223846793005 + 1442695040888963407`.
  This is an affine translation, proving the IR vocabulary can grow to support
  operations outside the v3 grammar (which only contained linear operations that map 0 to 0).
  Inputs (id-encoded) and the canonical `result` are decimal STRINGS (parse to
  BigInt / UInt64 / u64).
