# markdownlint-cli2: markdown linter. Declarative pin per the
# human maintainer's "update declaratively everywhere" directive
# (2026-04-24). Moves the version off a hardcoded
# `.github/workflows/gate.yml` line and into the single source
# of truth the rest of the toolchain already uses. Kept in sync
# with `package.json` devDependency (used by the `lint:markdown`
# script in package.json) so dev laptops can also `bun run
# lint:markdown`. Both pins point at the same version.
# Keep in sync with `devDependencies.markdownlint-cli2` in package.json. They
# DISAGREED (mise 0.22.1 vs package.json 0.23.2), and package.json won in practice:
# `lint:markdown` runs node_modules/.bin/markdownlint-cli2, so `lint (markdownlint)`
# has been green against 0.23.2 while mise installed an 0.22.1 nothing used.
#
# The stale entry was not merely redundant, it was BREAKING macOS. `build-and-test
# (macos-26)` failed on every commit with:
#
#   Failed to install npm:markdownlint-cli2@0.22.1: aube install failed
#     caused by: trust downgrade for fastq@1.20.2 (trustPolicy=no-downgrade):
#     earlier published version 1.20.0 had trusted publisher but this version has
#     no trust evidence
#
# fastq is a transitive dep (markdownlint-cli2 -> globby -> fast-glob ->
# @nodelib/fs.walk -> fastq). Checked on npm 2026-08-29: 1.20.0 and 1.20.1 carry
# attestations, 1.20.2 was published 2026-08-28 WITHOUT them, and 1.20.3 restored
# them the next day with SLSA provenance. The policy caught a real regression, and
# it is already fixed upstream -- so no `trust_policy_excludes` is warranted.
# Verified locally that npm resolves BOTH 0.22.1 and 0.23.2 to fastq@1.20.3 today.
#
# Only macOS saw it because only macOS runs a mise new enough to enforce the aube
# trust policy (2026.7.15 via Homebrew's floor, vs 2026.6.12 pinned on Linux and
# Windows). That divergence is real and is NOT resolved here -- see the note in
# tools/setup/macos.sh.
# TRUST-POLICY EXCLUSION, narrowest possible: one package at one version.
#
# `build-and-test (macos-26)` fails on every commit because aube refuses the tree:
#
#   Failed to install npm:markdownlint-cli2@0.23.2: aube install failed
#     caused by: trust downgrade for fastq@1.20.2 (trustPolicy=no-downgrade):
#     earlier published version 1.20.0 had trusted publisher but this version has
#     no trust evidence
#
# THE REVIEW mise's error message requires before bypassing, done 2026-08-30 against
# the npm registry. fastq is Matteo Collina's (github.com/mcollina/fastq), reached
# transitively: markdownlint-cli2 -> globby -> fast-glob -> @nodelib/fs.walk -> fastq.
#
#   1.20.0  2025-12-23  attestations: yes
#   1.20.1              attestations: yes
#   1.20.2  2026-08-28  attestations: NO   <- what the policy caught
#   1.20.3  2026-08-29  attestations: yes, SLSA provenance
#
# So this is the benign shape the error text names -- "a maintainer manually
# publishes ... skips provenance for convenience" -- and upstream restored provenance
# the next day. Not a compromised release.
#
# WHY AN EXCLUSION AND NOT A VERSION BUMP. That was tried and it did not work: #16181
# moved this pin 0.22.1 -> 0.23.2 on the theory that a fresh resolve would take
# 1.20.3. It did not. `npm i --package-lock-only` resolves fastq@1.20.3 for BOTH
# 0.22.1 and 0.23.2, but aube's resolver still selects 1.20.2, so the bump changed
# nothing about the failure. Recording that here so the next person does not repeat it.
#
# SCOPE. `fastq@1.20.2` only -- not a bare `fastq`, which would exempt every future
# version and discard exactly the signal that worked. REMOVE THIS once aube resolves
# 1.20.3 or later; it is dead weight the moment the resolver moves.
#
# Keep the version in sync with `devDependencies.markdownlint-cli2` in package.json
# (audit-tool-pin-agreement.test.ts enforces it, table form included).
"npm:markdownlint-cli2" = { version = "0.23.2", trust_policy_excludes = ["fastq@1.20.2"] }
