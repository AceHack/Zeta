# Runtime pins for tools mise manages on Zeta.
#
# Round 34 late-round flip: .NET SDK moved onto mise. The
# round-32 rationale for keeping dotnet out of mise (shared
# `dotnet-root/` layout fighting the in-process PATH story)
# was resolved upstream — Aaron landed the fix in the mise
# dotnet plugin itself; homebrew-mise was stale, not the
# plugin. `../scratch` ships with this shape green. `global.json`
# stays as the .NET-native pin contract; mise reads the
# declared version here and installs it via the plugin.
#
# Lean stays outside mise until a mise plugin exists (candidate
# OSS contribution target per GOVERNANCE.md §23) — installed via
# `src/Core.TypeScript/ace/setup-realizers/from-elan.ts`.
#
# Consumed by `tools/setup/common/mise.sh` which runs
# `mise install` from this directory. See
# `docs/research/build-machine-setup.md` for the full rationale.
#
# Keep in sync with tools/setup/linux.sh MISE_VERSION and
# full-ai-cluster/nixos/overlays/mise-pin.nix (three-way parity).
min_version = "2026.6.12"

[tools]
# .NET 10 SDK. THIS LINE IS THE SINGLE DECLARED SOURCE of the SDK
# version; `global.json` restates it and is held in agreement by
# `src/Core.TypeScript/hygiene/audit-dotnet-pin-parity.ts`.
#
# Why this file and not `global.json`: mise is the only one of the two
# that ACQUIRES an SDK. `global.json`'s `rollForward` is a RESOLUTION
# policy over already-installed SDKs — it has never downloaded one — so
# `rollForward: latestPatch` was never an update mechanism and reading it
# as one is the belief this split existed to create. The exact pin here
# is also what keeps installs deterministic across laptops + CI (§7 DST);
# a loose pin would trade that away for an uptake it still would not get.
#
# 10.0.302 -> 10.0.303 (2026-08-11): SECURITY roll, runtime 10.0.10 ->
# 10.0.11, 10 CVEs (CVE-2026-62871/62886/62897/62898/62899/62900/62901/
# 62902/62909, CVE-2026-70354). Verified locally, not inferred: the
# bundled Roslyn is UNCHANGED at 5.6.0 across the roll --
#   10.0.302 -> 5.6.0-2.26329.109
#   10.0.303 -> 5.6.0-2.26377.103
# so the `Microsoft.CodeAnalysis.*` ceiling in Directory.Packages.props
# (5.6.0) and its dependabot `ignore:` entry both stayed exactly as they
# were. A patch-band roll keeps the Roslyn minor; a FEATURE-band roll
# (10.0.3xx -> 10.0.4xx) is what moves it, and that is the change that
# must carry the CodeAnalysis + FSharp.Core bumps with it in one commit.
#
# 10.0.303 -> 10.0.400 (2026-08-25): the FEATURE-BAND roll the paragraph
# above was written for. It moved the Roslyn MINOR, as predicted, and the
# prediction is the reason this comment exists. Measured the same way as
# the entries above -- `dotnet exec <sdk>/Roslyn/bincore/csc.dll -version`,
# the method audit-codeanalysis-sdk-match.ts itself uses -- and validated
# against the two rows above as a control before the new SDK was read:
#   10.0.303 -> 5.6.0-2.26377.103   (control, reproduced exactly)
#   10.0.400 -> 5.9.0-1.26379.115   <-- the minor moved, 5.6 -> 5.9
# So the CodeAnalysis CEILING MOVED, 5.6.0 -> 5.9.0, and the pins in
# Directory.Packages.props move with it in this same commit. That 5.9.0
# is exactly the version dependabot proposed on PR #13590 and the guard
# refused when the SDK was still on 5.6.0: the refusal was correct then
# and the same pin is correct now, because the SDK moved underneath it.
# The `ignore:` entry's LIFTS-WHEN condition is now MET; its comment is
# corrected in the same commit rather than left standing as a stale
# justification for an entry that is now load-bearing for a new reason.
#
# FSharp.Core needed NO edit, and that is a measurement rather than an
# omission. Each SDK declares its implicit FSharp.Core as
# `<FSCorePackageVersion>` under `<sdk>/FSharp/`:
#   10.0.303 -> 10.1.303
#   10.0.400 -> 10.1.400
# Directory.Packages.props already pinned 10.1.400, i.e. it was pinned
# AHEAD of the SDK it ran on. This roll does not bump FSharp.Core; it
# makes the existing pin correct for the first time.
#
# macOS trap, measured 2026-08-23, HIT AGAIN AND CONFIRMED 2026-08-25 on
# the 10.0.400 install: `mise install dotnet@<newer>` replaces the shared
# host binary and native runtime libraries IN PLACE, and the kernel keeps
# previous code-signature cache entries for those vnodes. A stale host vnode
# SIGKILLs every later `dotnet` invocation
# (exit 137, no stdout, no stderr). mise's own post-install `dotnet
# --version` probe fails the same way ("exited with non-zero status: no
# exit status"), so the install REPORTS FAILURE after having succeeded --
# `dotnet-install: Installation finished successfully` is in the same
# output, and the SDK is on disk. It is not a bad download: `codesign -v`
# passes and a copy of the same bytes at a new path runs. Fix is to give
# the file a new vnode -- `cp` it aside, `rm`, `cp` back.
#
# 2026-08-27 measured extension: the host can run while stale native files
# under `shared/Microsoft.NETCore.App/<runtime>/` make `dotnet format` fail
# with `ReflectionTypeLoadException: The signature is incorrect`. A clean SDK
# at another path formats the same project. Preserve the old runtime directory,
# then copy the clean runtime payload into a newly-created version directory so
# every dylib receives a new vnode. Do NOT revert the pin on either signature;
# the SDK payload is fine and the local vnode cache is stale.
dotnet = "10.0.400"
go = "1.26.4"
golangci-lint = "2.13.1"
# Rust stable. Edition 2024 requires >=1.85. The mise `core:rust`
# backend wraps rustup and passes `components`/`targets` straight
# through to `rustup toolchain install`, so ONE declaration
# provisions the compiler, the lint/format components, and the
# wasm32 target — no `rustup component add` / `rustup target add`
# top-up afterwards (081M05X126V087G0R0014GR9KQ; retired
# `tools/setup/common/ensure-rust-components.sh` and the
# "after mise install, run rustup target add" comment this
# replaces). `wasm32-unknown-unknown` enables the Rust WASM
# substrate (Oracle 10 sixth compiler / Conjecture Z-7).
#
# That mise HONOURS these options rather than ignoring them is a
# checked fact, not a cited one. Negative control, mise 2026.6.14:
# an isolated config adding a bogus component was rejected by rustup
# BY NAME — "error: component
# 'shadow-negative-control-not-a-component' for target
# 'aarch64-apple-darwin' is unavailable for download". Had the
# options been dropped the install would have SUCCEEDED, so the
# check can fail, which is what makes it a check. Positive control,
# same run: from an empty RUSTUP_HOME, `mise install rust` alone
# produced rustfmt-preview, clippy-preview and
# rust-std-wasm32-unknown-unknown, and that toolchain compiled a
# real `--target wasm32-unknown-unknown` binary.
#
# A version bump must also move every OTHER site that restates this
# version. That used to read "the `1.87.0-*` rustup-toolchain cache
# globs in `.github/workflows/gate.yml` + `installer-unit-tests.yml`",
# which was true and short by an order of magnitude: measured
# 2026-08-23 there are 17 operative restatements, and one of them is
# `.mise.full.toml`, which carries its OWN `rust = { version = ... }`
# pin -- so a bump here alone leaves full-tier hosts (dev laptops,
# cluster nodes, the k8s CI lanes) on a different compiler from
# slim/standard hosts. Nothing in the tree said that.
#
# Every one of these fails SILENTLY: a stale cache glob degrades the
# offline path to a CDN fetch, and a stale second mise config just
# provisions the wrong thing. So the constraint is no longer prose --
# `src/Core.TypeScript/hygiene/audit-mise-toolchain-couplings.ts`
# discovers the sites and reddens on disagreement, on the
# `cross-verify` floor. Bump this line and run it; it names every
# file and line that still has to move.
#
# Factory pin is 1.99.0-beta.3 (cbae9b4ca, 2026-08-28): first line
# after 1.96.1 that compiles Feldera 0.342.0 dbsp. rustc 1.97.0 and
# 1.98.0 ICE (StarJoinFuncTrait / FnOnce::Output, first-bad 1.97.0).
# 1.96.1 is last-good *stable*; Aaron 2026-09-02: use latest beta for
# now. Pin the exact point-release, not the floating `beta` channel.
# Measured: cargo +1.99.0-beta.3 build --release -p dbsp PASS locally
# and on GHA ubuntu-24.04 / macos-26 (run 33561885627).
rust = { version = "1.99.0-beta.3", components = ["rustfmt", "clippy"], targets = ["wasm32-unknown-unknown"] }
# Zig 0.13.0 -- wasm32-freestanding compiler substrate (Oracle 11).
# Builds the 1,314-byte `src/wasm-dla/bytelock/dla-canonical-zig.wasm` byte-lock
# substrate; the exact command lives in `bytelock/build-substrates.mjs`. Verified
# byte-identical on rebuild under this pin (sha256 c28210dc..., 2026-08-17).
# THE COMMITTED ARTIFACT DOES NOT MOVE WHEN THIS PIN DOES, and that is the quiet
# failure: the byte-lock compares the artifact to its golden vectors, both are
# unchanged, every check stays green, and the module has silently stopped being
# reproducible from the pinned toolchain -- condition 3 of the
# no-binary-in-proof-lineage exception. So the (version, sha256) pairing is
# recorded in
# `src/Core.TypeScript/hygiene/audit-mise-toolchain-couplings.provenance.json`
# and checked BOTH ways. To bump zig: regenerate via
# `node src/wasm-dla/bytelock/build-substrates.mjs`, re-run the byte-lock, and
# move the provenance record in the SAME commit.
# The 951-byte figure quoted here previously was a SECOND, non-canonical Zig module
# under `src/wasm-dla/zig/`, removed 2026-08-17: it was in no byte-lock roster, was
# pinned by no golden vector, and returned cluster size 1 at every seed.
# mise zig plugin downloads the official release tarball.
zig = "0.13.0"
python = "3.14.6"
