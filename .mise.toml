# Runtime pins for tools mise manages on Zeta.
#
# Round 34 late-round flip: .NET SDK moved onto mise. The
# round-32 rationale for keeping dotnet out of mise (shared
# `dotnet-root/` layout fighting the in-process PATH story)
# was resolved upstream — Aaron landed the fix in the mise
# dotnet plugin itself; homebrew-mise was stale, not the
# plugin. `../scratch` ships with this shape green. `global.json`
# stays as the .NET-native pin contract; mise reads the
# declared version here and installs it via the plugin.
#
# Lean stays outside mise until a mise plugin exists (candidate
# OSS contribution target per GOVERNANCE.md §23) — installed via
# `src/Core.TypeScript/ace/setup-realizers/from-elan.ts`.
#
# Consumed by `tools/setup/common/mise.sh` which runs
# `mise install` from this directory. See
# `docs/research/build-machine-setup.md` for the full rationale.
#
# Keep in sync with tools/setup/linux.sh MISE_VERSION and
# full-ai-cluster/nixos/overlays/mise-pin.nix (three-way parity).
min_version = "2026.6.12"

[tools]
# .NET 10 SDK (latest). Kept in sync with `global.json` — Zeta's
# own `.NET`-native pin contract. Round-34 flip from
# Microsoft's dotnet-install.sh to mise (see header).
dotnet = "10.0.302"
go = "1.26.4"
golangci-lint = "2.12.2"
# Rust stable. Edition 2024 requires >=1.85. The mise `core:rust`
# backend wraps rustup and passes `components`/`targets` straight
# through to `rustup toolchain install`, so ONE declaration
# provisions the compiler, the lint/format components, and the
# wasm32 target — no `rustup component add` / `rustup target add`
# top-up afterwards (081M05X126V087G0R0014GR9KQ; retired
# `tools/setup/common/ensure-rust-components.sh` and the
# "after mise install, run rustup target add" comment this
# replaces). `wasm32-unknown-unknown` enables the Rust WASM
# substrate (Oracle 10 sixth compiler / Conjecture Z-7).
#
# That mise HONOURS these options rather than ignoring them is a
# checked fact, not a cited one. Negative control, mise 2026.6.14:
# an isolated config adding a bogus component was rejected by rustup
# BY NAME — "error: component
# 'shadow-negative-control-not-a-component' for target
# 'aarch64-apple-darwin' is unavailable for download". Had the
# options been dropped the install would have SUCCEEDED, so the
# check can fail, which is what makes it a check. Positive control,
# same run: from an empty RUSTUP_HOME, `mise install rust` alone
# produced rustfmt-preview, clippy-preview and
# rust-std-wasm32-unknown-unknown, and that toolchain compiled a
# real `--target wasm32-unknown-unknown` binary.
#
# A version bump must also move the `1.87.0-*` rustup-toolchain
# cache globs in `.github/workflows/gate.yml` +
# `installer-unit-tests.yml`; a stale glob silently degrades the
# offline path to a CDN fetch.
rust = { version = "1.87.0", components = ["rustfmt", "clippy"], targets = ["wasm32-unknown-unknown"] }
# Zig 0.13.0 -- wasm32-freestanding compiler substrate (Oracle 11).
# Builds the 1,314-byte `src/wasm-dla/bytelock/dla-canonical-zig.wasm` byte-lock
# substrate; the exact command lives in `bytelock/build-substrates.mjs`. Verified
# byte-identical on rebuild under this pin (sha256 c28210dc..., 2026-08-17).
# The 951-byte figure quoted here previously was a SECOND, non-canonical Zig module
# under `src/wasm-dla/zig/`, removed 2026-08-17: it was in no byte-lock roster, was
# pinned by no golden vector, and returned cluster size 1 at every seed.
# mise zig plugin downloads the official release tarball.
zig = "0.13.0"
python = "3.14.6"
# Java 26 (latest). Round-34 migration: OpenJDK moved off brew
# and onto mise so all language runtimes share one manager.
java = "26"
# Bun pinned. Round-34 seeding for the post-install repo-
# automation runtime research (BACKLOG P1 "Post-install repo
# automation: runtime choice open") + future web/UI work.
# Matches `../scratch`'s install shape.
bun = "1.3"
# uv pinned (round-34 pull-in from ../scratch). Manages Python
# CLI tooling (ruff etc.) via `uv tool install` with
# reproducible versions across laptops + CI. See BACKLOG
# "Python tool management via uv tool (from ../scratch)". Also
# powers mise's `pipx:` backend below (mise auto-routes `pipx:`
# tools through `uv tool install` when uv is available — no
# pipx package needed, faster + already in our toolchain).
#
# Bumped 0.11.8 → 0.11.16 (2026-05-28) — 0.11.8 was empirically
# failing in `mise install` with `aqua:astral-sh/uv@0.11.8: HTTP
# status client error (404 Not Found)`, cascading all 11 lint
# jobs into FAILURE on every open PR (the install step exits 1
# before lint runs). Per `.claude/rules/dep-pin-search-first-
# authority.md`: bumped to current upstream latest stable per
# WebSearch 2026-05-28 + `gh api repos/astral-sh/uv/releases/
# latest` (both authoritative; tag_name = "0.11.16",
# published_at = 2026-05-21T22:11:32Z). Source:
# https://github.com/astral-sh/uv/releases/tag/0.11.16
uv = "0.11.21"
# actionlint: GitHub Actions workflow linter. Declarative install
# (GOVERNANCE §24 three-way-parity) so dev laptops + CI runners
# (including ubuntu-slim which doesn't ship with it) have identical
# pinned versions. Replaces the prior inline `Download actionlint`
# step in gate.yml.
actionlint = "1.7.12"
# shellcheck: bash-script linter. Same parity rationale — ubuntu-
# slim + ubuntu-24.04-arm runners don't ship shellcheck pre-
# installed, so declarative pin here ensures dev/CI parity.
shellcheck = "0.11.0"
# 1Password CLI (`op`) — cross-OS secret/cert access for the private-key-custody lane
# (Aaron 2026-06-21: "1password-cli ... we need to support on all operating systems ...
# just the cli not the whole app ... make sure all our oses have it"). Via mise (the
# cross-platform path — NOT per-OS brew/apt/scoop) so mac+linux+windows get the SAME
# pinned `op` in one line. Scoped service accounts + `op` give least-privilege agent
# secret retrieval; the desktop app (mac cask) is deliberately NOT a dep (CLI suffices).
# Pin per dep-pin-search-first (mise ls-remote 2026-06-21): 1password-cli 2.34.1.
"1password-cli" = "2.34.1"
# Cluster integration + GitOps tooling (k3d/kind/kubectl/helm/kubeconform) moved to
# .mise.full.toml (host-tier split, workitem 081KTWQZY7F08QG0R0034KN17T): full-tier hosts
# (dev laptops, cluster nodes, CI k8s lanes) still converge on the one pinned tool graph
# via MISE_ENV=full; slim/standard hosts skip the k8s set.
# Node + npm: required for the npm-backed mise tools below.
# Mise's `npm:` backend installs via `npm install -g`, so the
# Node runtime must be installed first. Pinned here so dev
# laptops + CI runners + devcontainers all get the same Node
# version through the install script — no separate
# actions/setup-node step in gate.yml. 24 = current Active LTS
# as of 2026-06 (Node 22 -> Maintenance Oct 2025); supported by
# all agent CLIs we target (Claude Code >=22.5, Gemini CLI 18+).
node = "24"
# markdownlint-cli2: markdown linter. Declarative pin per the
# human maintainer's "update declaratively everywhere" directive
# (2026-04-24). Moves the version off a hardcoded
# `.github/workflows/gate.yml` line and into the single source
# of truth the rest of the toolchain already uses. Kept in sync
# with `package.json` devDependency (used by the `lint:markdown`
# script in package.json) so dev laptops can also `bun run
# lint:markdown`. Both pins point at the same version.
"npm:markdownlint-cli2" = "0.22.1"
# semgrep: SAST linter (the 14 rules in `.semgrep.yml`). Pinned
# here per the three-way-parity invariant (GOVERNANCE §24) — dev
# laptops + CI runners + devcontainers all get the same semgrep
# through the same `tools/setup/install.sh` rather than
# CI fetching its own copy via `actions/setup-python` + pip.
# The `pipx:` backend prefix is mise's naming; the actual
# installer mise uses is `uv tool install` (since `uv` above is
# in this toolchain — mise auto-routes pipx: through uv when
# uv is available; faster than real pipx, no separate package
# needed). See docs/DECISIONS/2026-04-27-uv-canonical-python-
# tool-manager.md for the uv-as-canonical decision and lineage
# from ../scratch. Resolves Scorecard PinnedDependenciesID #17
# + #18 (pip install --upgrade pip + pip install semgrep — the
# unpinned pip-bootstrap surface goes away entirely once mise
# owns this tool).
"pipx:semgrep" = "1.161.0"
# yamllint: YAML syntax/indentation/duplicate-key linter for the k8s manifests
# under full-ai-cluster/k8s/** (the `lint (yaml/k8s)` gate job). Same three-way-
# parity rationale as semgrep — mac/linux/windows all get it through mise, so
# install.sh AND install.ps1 stay in sync by construction (no per-OS manifest
# divergence). NOTE: the `pipx:` prefix is mise's backend NAME only — because `uv`
# is in this toolchain, mise auto-routes `pipx:` through `uv tool install`, NOT
# pip (the uv-canonical ADR; identical to `pipx:semgrep` above). No pip anywhere.
# Pin per dep-pin-search-first (PyPI 2026-06-10: 1.38.0).
"pipx:yamllint" = "1.38.0"
"pipx:ruff" = "0.15.17"
"pipx:mypy" = "2.1.0"

[settings]
# Explicit: use astral-sh/python-build-standalone precompiled binaries (fast
# install on dev laptops + CI). Compile-from-source is opt-in via
# `python.compile = true` when a platform build is required.
python.compile = false
# Same discipline for node (081KZETP6AT, 2026-08-09). Without this, mise fetched the
# node SOURCE tarball (`node-v24.19.0.tar.gz`, not `-linux-x64.tar.xz`) and ran
# `./configure`, which needs `python` on PATH in the build subshell — it is not there
# during first-boot provisioning, so the build died with `exec: python: not found`
# (exit 127) and took the whole first-boot install.sh down with it.
#
# Compiling was never wanted here: node is the ONLY tool that chose source. In the
# same run bun, dotnet, java, python and rust all installed from PRECOMPILED binaries
# successfully — proof the platform executes prebuilts fine now that programs.nix-ld
# provides the FHS loader (foreign-binaries.nix). So take the prebuilt, and skip a
# multi-minute source build on every cluster-node bringup.
node.compile = false
# `python-build-standalone` (upstream for mise's python plugin)
# gates downloads on GitHub artifact attestations. On CI the
# unauthenticated GitHub API rate-limits the shared runner IP;
# scratch + SQLSharp both disable this check. Round-32 v1.0
# security scope treats python-attestation on CI as a post-v1
# hardening item (`SECURITY-BACKLOG.md`). Disabled via
# MISE_PYTHON_GITHUB_ATTESTATIONS in tools/setup/common/mise.sh (not here —
# nixpkgs mise 2025.11.x on cluster nodes predates the v2026.3.18 key).
# Auto-activate uv-created venvs when mise enters a directory.
# QoL: `uv run` / venv switching seamless. From ../scratch.
python.uv_venv_auto = "source"
