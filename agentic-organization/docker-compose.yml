# Local dependency stack for the Agentic Organization worker:
#   - CockroachDB single-node (the authoritative Organization state DB)
#   - NATS with JetStream (the event transport / outbox sink)
#   - the worker runtime itself
#
# Brings up the real substrate so the env-gated Cockroach + NATS integration
# tests run against actual services, and the worker boots end to end locally
# before the same images are deployed to kind (Phase 6).
services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.1
    command: start-single-node --insecure
    ports:
      - "26257:26257" # SQL
      - "8080:8080" # admin UI
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cockroach-data:/cockroach/cockroach-data

  nats:
    image: nats:2.14.1-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring
    volumes:
      - nats-data:/data

  worker:
    build:
      context: .
    depends_on:
      cockroach:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      AGENTIC_ORG_ENV: local
      AGENTIC_ORG_ID: org-local
      COCKROACH_DATABASE_URL: postgresql://root@cockroach:26257/defaultdb?sslmode=disable
      NATS_SERVERS: nats://nats:4222
      NATS_STREAM: agentic-org-local
      NATS_DURABLE: agentic-org-worker
      NATS_INBOUND_BATCH_SIZE: "16"
    restart: on-failure

volumes:
  cockroach-data:
  nats-data:
