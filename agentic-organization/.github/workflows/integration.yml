# INT1 — run the env-gated integration tests GREEN against real Cockroach + NATS.
# These are the in-process twins of the in-cluster deploy/run-*.ts proofs; here they
# execute (skipped: 0) instead of skipping locally. Cockroach + NATS run as real
# containers; the two AGENTIC_ORG_*_INTEGRATION_* env vars point the tests at them.
name: integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
      - run: npm ci || npm install

      - name: start CockroachDB (single-node insecure)
        run: |
          docker run -d --name crdb -p 26257:26257 cockroachdb/cockroach:v24.1.5 start-single-node --insecure
      - name: start NATS (JetStream)
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.10 -js

      - name: wait for Cockroach SQL
        run: |
          for i in $(seq 1 60); do
            if docker exec crdb ./cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then echo "cockroach ready"; break; fi
            sleep 2
          done
          docker exec crdb ./cockroach sql --insecure -e "SELECT 1"
      - name: wait for NATS
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8222/healthz >/dev/null 2>&1 || nc -z localhost 4222; then echo "nats ready"; break; fi
            sleep 1
          done

      - name: run the 7 env-gated integration tests (must execute, not skip)
        env:
          AGENTIC_ORG_COCKROACH_INTEGRATION_DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
          AGENTIC_ORG_NATS_INTEGRATION_SERVERS: nats://localhost:4222
        run: |
          npm run test:integration 2>&1 | tee /tmp/itest.log
          # fail the job if anything was skipped (the whole point is they EXECUTE here)
          if grep -qE '# SKIP|ℹ skipped [1-9]' /tmp/itest.log; then
            echo "::error::an integration test SKIPPED — the env wiring did not take"; exit 1
          fi

      - name: teardown
        if: always()
        run: docker rm -f crdb nats || true
