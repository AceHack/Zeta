# Fast hermetic CI — typecheck + the in-memory unit/contract suite (no network deps).
# The env-gated integration tests skip here by design; integration.yml runs them green.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
      - run: npm ci || npm install
      - name: typecheck (tsc, 0 errors)
        run: npm run typecheck
      - name: unit + contract suite (deterministic, no network)
        run: npm test
