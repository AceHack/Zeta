# GEN3 — the live-flip secret (TEMPLATE; the operator fills + applies it).
#
# THIS FILE IS NOT PART OF THE APPLY SET, and it is in this sibling directory rather than
# deploy/k8s/ for exactly that reason: `kubectl apply -f deploy/k8s/` selects files by
# EXTENSION (.json/.yaml/.yml), never by filename, so a `.example.yaml` sitting in the apply
# directory is applied like any other manifest. It was, until it was moved here — which meant
# the documented bring-up installed WORK_PROVIDER=github with a placeholder token and turned
# the external work port live against `your-org/your-repo`.
#
# The worker mounts this Secret as env via `envFrom ... optional: true`, so the org boots
# internal-only WITHOUT it. Apply a filled copy to turn a real provider port live:
#
#   cp deploy/k8s-templates/31-work-provider-secret.example.yaml /tmp/wp.yaml
#   # edit /tmp/wp.yaml: set WORK_PROVIDER + the selected provider's token/ids
#   kubectl apply -f /tmp/wp.yaml
#   kubectl -n agentic-org rollout restart deploy/worker
#   kubectl -n agentic-org logs deploy/worker | grep change_control.external   # mode: external:<kind>
#
# The token is a real secret — never commit a filled copy. WORK_PROVIDER picks ONE provider;
# only that provider's keys are required (the resolver throws on a partial config, fail-fast).
apiVersion: v1
kind: Secret
metadata:
  name: work-provider-secrets
  namespace: agentic-org
type: Opaque
stringData:
  # ── pick ONE provider ──────────────────────────────────────────────────────
  WORK_PROVIDER: "github" # github | gitlab | jira | linear

  # ── github (code-review: real PRs) ─────────────────────────────────────────
  GITHUB_TOKEN: "REPLACE_WITH_A_REAL_TOKEN"
  GITHUB_OWNER: "your-org"
  GITHUB_REPO: "your-repo"
  # GITHUB_API_BASE_URL: "https://github.your-enterprise.com/api/v3"  # optional (GHE)
  # GITHUB_BASE_BRANCH: "main"                                         # optional

  # ── gitlab (code-review: real MRs) ─────────────────────────────────────────
  # GITLAB_TOKEN: "REPLACE_WITH_A_REAL_TOKEN"
  # GITLAB_PROJECT_ID: "your-group/your-project"  # or the numeric id
  # GITLAB_API_BASE_URL: "https://gitlab.your-host.com/api/v4"  # optional (self-hosted)
  # GITLAB_BASE_BRANCH: "main"                                  # optional

  # ── jira (work-item: real cards) ───────────────────────────────────────────
  # JIRA_TOKEN: "REPLACE_WITH_A_REAL_TOKEN"
  # JIRA_BASE_URL: "https://your-org.atlassian.net/rest/api/3"
  # JIRA_PROJECT_KEY: "ENG"

  # ── linear (work-item: real issues) ────────────────────────────────────────
  # LINEAR_TOKEN: "REPLACE_WITH_A_REAL_TOKEN"
  # LINEAR_TEAM_ID: "your-team-id"
  # LINEAR_API_BASE_URL: "https://api.linear.app/graphql"  # optional
