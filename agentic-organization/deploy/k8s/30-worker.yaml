# The agentic-organization worker process. On start it runs the Cockroach
# migration bootstrapper (incl. 0011 control-plane keep-alive), checks readiness,
# then loops runOnce(): keep-alive ticks the org heartbeat FIRST every cycle
# (deterministic "stay alive"), then the org-worker + NATS-consumer lanes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: agentic-org
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: agentic-org-worker:keepalive
          imagePullPolicy: IfNotPresent
          # GEN3 live-flip: the work-provider secret is OPTIONAL — absent → the org runs
          # internal-only (the safe default). Fill a copy of
          # deploy/k8s-templates/31-work-provider-secret.example.yaml with a real token and apply it
          # to turn the GitHub/GitLab/Jira/Linear port live. WORK_PROVIDER selects; the token never
          # appears in this manifest or the logs — only the resolved mode is.
          #
          # The template lives OUTSIDE deploy/k8s/ on purpose: `kubectl apply -f deploy/k8s/` selects
          # files by EXTENSION, not by name, so while it sat in this directory as `.example.yaml` the
          # bring-up command applied it — installing WORK_PROVIDER=github with the literal placeholder
          # token and silently destroying the internal-only safe default described above.
          envFrom:
            - secretRef:
                name: work-provider-secrets
                optional: true
          env:
            - { name: AGENTIC_ORG_ENV, value: "dev" }
            - { name: AGENTIC_ORG_ID, value: "org-lfg" }
            - {
                name: COCKROACH_DATABASE_URL,
                value: "postgresql://root@cockroach:26257/defaultdb?sslmode=disable",
              }
            - { name: NATS_SERVERS, value: "nats://nats:4222" }
            - { name: NATS_STREAM, value: "agentic-org-events" }
            - { name: NATS_DURABLE, value: "agentic-org-v0-automation-planner" }
            - { name: NATS_INBOUND_BATCH_SIZE, value: "25" }
            - { name: WORKER_INBOUND_BATCH_SIZE, value: "15" }
            - { name: WORKER_OUTBOX_BATCH_SIZE, value: "10" }
            - { name: WORKER_REACTION_PLAN_BATCH_SIZE, value: "8" }
            - { name: WORKER_REACTION_PLAN_LEASE_MS, value: "300000" }
            # The keep-alive ticks once per worker cycle, and an idle cycle is
            # bounded by the NATS pull long-poll (~30s). The deadline must exceed
            # the max cycle time so a healthy org is not flagged flatlining; 90s
            # gives comfortable margin over the ~30s idle cycle. (Future hardening:
            # an independent fast keep-alive loop decoupled from the work cycle.)
            - { name: WORKER_KEEP_ALIVE_ORG_HEARTBEAT_DEADLINE_MS, value: "90000" }
            # LGTM observability: worker emits OTLP HTTP traces/metrics/logs to
            # the in-cluster collector. Unit tests and local runs omit this env
            # and remain no-op.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
            # the agent's live decision backend: real model calls to the
            # in-cluster Ollama service (no external credentials). If unset, the
            # agent uses the deterministic first-legal-option policy.
            - { name: LLM_BASE_URL, value: "http://ollama:11434" }
            - { name: LLM_MODEL, value: "qwen2:0.5b" }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
