apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: agentic-org
  labels: { app: ollama }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.5.7
          ports:
            - containerPort: 11434
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_KEEP_ALIVE, value: "-1" }
          readinessProbe:
            httpGet: { path: "/", port: 11434 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits: { cpu: "2", memory: "3Gi" }
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      volumes:
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: agentic-org
spec:
  selector: { app: ollama }
  ports:
    - { port: 11434, targetPort: 11434 }
