# Single-node CockroachDB for the in-cluster end-to-end test. Ephemeral
# (emptyDir) — this is a test substrate, not production. The worker's migration
# bootstrapper applies the schema (incl. 0011 control-plane keep-alive) on start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockroach
  namespace: agentic-org
  labels:
    app: cockroach
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cockroach
  template:
    metadata:
      labels:
        app: cockroach
    spec:
      containers:
        - name: cockroach
          image: cockroachdb/cockroach:v26.2.1
          # NB: v26.2.1 start-single-node rejects a non-localhost --listen-addr.
          # Leave it unset (as docker-compose does) — cockroach binds network-
          # accessibly by default, reachable cluster-wide via the Service.
          args:
            - start-single-node
            - --insecure
            - --store=/cockroach/cockroach-data
          ports:
            - name: sql
              containerPort: 26257
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /cockroach/cockroach-data
          # REQUESTS ONLY, DELIBERATELY. Without a requests block this container is
          # BestEffort, and the kubelet evicts BestEffort pods FIRST under node memory
          # pressure -- i.e. on a single USB-booted node the DATABASE is the first thing
          # to die. Requests move it to Burstable and off that front line.
          # No limits: a memory ceiling picked without a measured working set OOMKills
          # where no ceiling does not. These numbers are CONVENTIONAL (they match the
          # light-service profile used elsewhere in this directory), not metered.
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
          readinessProbe:
            httpGet:
              path: "/health?ready=1"
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: "/health"
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cockroach
  namespace: agentic-org
  labels:
    app: cockroach
spec:
  selector:
    app: cockroach
  ports:
    - name: sql
      port: 26257
      targetPort: 26257
    - name: http
      port: 8080
      targetPort: 8080
