apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: agentic-org
  labels: { app: hindsight }
spec:
  replicas: 1
  selector:
    matchLabels: { app: hindsight }
  template:
    metadata:
      labels: { app: hindsight }
    spec:
      containers:
        - name: hindsight
          image: ghcr.io/vectorize-io/hindsight:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8888 } # REST API
            - { containerPort: 9999 } # UI
          env:
            # LLM for extraction/reflect — the in-cluster Ollama (OpenAI-compatible).
            - { name: HINDSIGHT_API_LLM_PROVIDER, value: "ollama" }
            - { name: HINDSIGHT_API_LLM_BASE_URL, value: "http://ollama:11434" }
            - { name: HINDSIGHT_API_LLM_MODEL, value: "qwen2:0.5b" }
            - { name: HINDSIGHT_API_LLM_API_KEY, value: "ollama" }
            - { name: HINDSIGHT_API_HOST, value: "0.0.0.0" }
            - { name: HINDSIGHT_API_PORT, value: "8888" }
            - { name: HINDSIGHT_API_LOG_LEVEL, value: "info" }
            # embeddings: local (bundled) by default; database: embedded pg0 by default.
            - { name: HINDSIGHT_DB_PASSWORD, value: "hindsight" }
          readinessProbe:
            httpGet: { path: "/health", port: 8888 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          volumeMounts:
            - { name: pgdata, mountPath: /home/hindsight/.pg0 }
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hindsight
  namespace: agentic-org
spec:
  selector: { app: hindsight }
  ports:
    - { name: api, port: 8888, targetPort: 8888 }
    - { name: ui, port: 9999, targetPort: 9999 }
