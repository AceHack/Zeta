# NATS with JetStream for the in-cluster end-to-end test. Memory storage
# (ephemeral).
#
# THE STREAM AND DURABLE CONSUMER ARE NOT CREATED BY ANYTHING IN THIS DIRECTORY.
# This header used to say they were "provisioned by the nats-provision Job". There
# is no such Job, here or anywhere in the tree -- provisioning is a HOST-RUN SCRIPT
# that needs a port-forward:
#
#   kubectl -n agentic-org port-forward svc/nats 4222:4222 &
#   node --experimental-strip-types deploy/provision-nats.ts
#
# The difference matters because the worker BINDS an existing durable consumer and
# never creates one (apps/workers/src/adapters/nats-js-transport-connection.ts calls
# consumers.get and rethrows). So `kubectl apply -f deploy/k8s/` ALONE brings up a
# worker that crash-loops on an unhandled rejection until that script has been run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: agentic-org
  labels:
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.14.1-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - { name: client, containerPort: 4222 }
            - { name: monitor, containerPort: 8222 }
          volumeMounts:
            - { name: data, mountPath: /data }
          # REQUESTS ONLY -- see the note in 10-cockroach.yaml. BestEffort would make the
          # message bus an early eviction candidate on a single node; the worker fails
          # fast when it cannot reach NATS, so this pod dying takes the org down with it.
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: agentic-org
  labels:
    app: nats
spec:
  selector:
    app: nats
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitor, port: 8222, targetPort: 8222 }
