# Semgrep FLOOR rules for Zeta — the uncompensatable class ONLY.
#
# This file is the executable half of registry/uncompensatable-floor.yaml's
# `workflow-supply-chain` entry (drift-and-heal ADR item 5, ratified
# 2026-08-08): a poisoned action tag or injected run: line executes on the
# NEXT workflow tick — the compromise window is the uncompensatable part.
# The gate's blocking `lint (semgrep)` job scans THIS config only
# (seconds-fast floor check, as the ADR promises); the full detector set
# lives in `.semgrep.yml` and runs as non-blocking drift.
#
# ADDING a rule here = adding to the floor = the treaty-amendment consent
# path (see the ADR's ratification section + Vera's signature note that
# created this split). The full detector run composes both files:
#   semgrep --config .semgrep.yml --config .semgrep-floor.yml

rules:


  # ────────────────────────────────────────────────────────────────
  # Rule 15: GitHub Actions third-party action pinned by mutable
  # tag (`@v4`, `@main`, `@develop`) instead of a full 40-char
  # commit SHA. Under nation-state + supply-chain posture
  # (round-30 elevation) the tag-rewrite attack class (tj-actions/
  # changed-files, CVE-2025-30066, March 2025) makes mutable tags
  # a supply-chain vulnerability. Every third-party action (`uses:`)
  # MUST pin by full SHA; the tag comment alongside is for humans.
  #
  # Exempt: reusable workflows under this repo (`uses: ./...`).
  # ────────────────────────────────────────────────────────────────
  - id: gha-action-mutable-tag
    patterns:
      - pattern-regex: '(?m)^\s*-?\s*uses:\s+(?!\.\/)[^\s@#]+@(?:v?\d+(?:\.\d+)*|main|master|develop|latest|HEAD)\s*(?:#.*)?$'
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
    message: >-
      Third-party GitHub Action pinned by a mutable tag. A tag-
      rewrite attack (tj-actions/changed-files cascade,
      CVE-2025-30066, March 2025) landed a malicious commit on
      23,000+ repos via exactly this path. Pin by the full 40-char
      commit SHA; put the human-readable version in a trailing
      `# vX.Y.Z` comment. Example:
        `uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2`
      See `.github/workflows/gate.yml` for the canonical pattern.
    languages: [generic]
    severity: ERROR


  # Rule 16 — skill safety-clause shape check — intentionally
  # deferred. Semgrep generic-mode regex cannot cleanly express
  # "file lacks any of these headings"; a bespoke diff-level lint
  # (which round-30 spec calls the "safety-clause-diff lint") is
  # the stronger signal. Tracked in docs/DEBT.md; target round-31.

  # ────────────────────────────────────────────────────────────────
  # Rule 17 — GitHub Actions workflow-injection: inline untrusted
  # context on a `run:` line. The primary workflow-injection vector
  # per https://github.blog/security/vulnerability-research/how-to-
  # catch-github-actions-workflow-injections-before-attackers-do/.
  # Matches single-line `run: ... ${{ github.<unsafe-path> }} ...`
  # forms for the attacker-controlled contexts enumerated in
  # docs/security/GITHUB-ACTIONS-SAFE-PATTERNS.md. Multi-line `run:
  # |` blocks are NOT covered by this rule and are also NOT covered
  # by actionlint (which validates workflow/YAML correctness, not
  # shell-injection patterns inside script contents). Multi-line
  # coverage is owed via a separate semgrep rule (or shellcheck-
  # over-extracted-script-bodies) — tracked under §rule-17-followups.
  # Fix: bind the value to an `env:` entry on the step and read it
  # as `"$VAR"` in the shell. See the safe-patterns doc.
  # ────────────────────────────────────────────────────────────────
  - id: gha-untrusted-in-run-line
    patterns:
      - pattern-regex: '(?m)^\s*-?\s*run:.*\$\{\{\s*github\.(head_ref|event\.(issue\.(title|body)|pull_request\.(title|body|head_ref|head\.ref|head\.label)|comment\.body|review\.body|head_commit\.message|commits))'
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
    message: >-
      Attacker-controlled `github.event.*` / `github.head_ref` value
      expanded directly into a `run:` shell command — classic GitHub
      Actions workflow-injection sink. A PR title / issue body /
      branch name containing shell metacharacters will execute on
      the runner. Bind the value to the step's `env:` block and
      reference it as `"$VAR"` in the shell instead. See
      `docs/security/GITHUB-ACTIONS-SAFE-PATTERNS.md` §Do / don't.
    languages: [generic]
    severity: ERROR
