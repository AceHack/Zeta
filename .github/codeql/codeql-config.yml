# CodeQL configuration — Zeta-tuned (round 34).
# Consumed by: .github/workflows/codeql.yml (via `config-file`).
#
# Why this file exists
# --------------------
# Without paths-ignore, the C# pack happily scans every .cs /
# .csproj under the repo — including vendored reference
# implementations (Rust DBSP via references/prior-art/feldera/,
# which carries incidental C# test scaffolding) and the
# benchmark harness. Those findings would pollute the triage
# queue with code Zeta does not own.
#
# paths / paths-ignore semantics: glob-style, relative to repo
# root. `paths-ignore` wins over `paths` on overlap.

name: "Zeta CodeQL config"

paths-ignore:
  # Vendored upstream references (Feldera, Materialize docs,
  # FASTER notes, etc.). Not Zeta's code; not Zeta's bugs.
  - "references/prior-art/**"

  # Project Genesis prototype — a built Vite/React static site
  # served as a subfolder of the existing Jekyll Pages deploy
  # (genesis/index.html + genesis/assets/*). The shipped JS is a
  # minified production bundle (not authored source), and the
  # genesis/_src/ snapshot is a self-contained UI prototype, not
  # part of Zeta's production surfaces. Findings here would ask us
  # to fix bundler output or a prototype, not Zeta's code.
  - "genesis/**"

  # Iris design-handoff GENERATED assets. Both declare their own nature:
  # support.js opens with "GENERATED from dc-runtime/src/*.ts — do not edit",
  # and _ds_bundle.js is a 100KB minified third-party design-system bundle.
  # Same case as genesis/** above — findings would ask us to fix bundler output.
  #
  # SCOPED DELIBERATELY NARROW: docs/design/root-site-iris/edge/zeta-mesh.js is
  # NOT excluded. It is authored Zeta source ("no deps, no build step") and it
  # folds unverified BroadcastChannel/WebSocket input straight into state (#9916).
  # That file is exactly what CodeQL should look at; excluding the directory
  # would have hidden it.
  - "docs/design/root-site-iris/_ds/**"
  - "docs/design/root-site-iris/support.js"

  # Benchmark harness. Perf-critical by definition; uses
  # patterns (unsafe pointers, pinned spans, unchecked
  # arithmetic) that are intentional there. Keep CodeQL
  # focused on production surfaces.
  - "bench/**"

  # Formal-method tool trees. TLA+ specs and Lean proofs —
  # CodeQL has no language pack that understands either.
  # Incidental C# helper code in these dirs (e.g. TLC driver
  # shims) is tool-internal, not shipped.
  #
  # `src/Core.Alloy/**` was previously listed here. Removed
  # 2026-04-28: `src/Core.Alloy/AlloyRunner.java` is first-party
  # Java that drives Alloy from .NET, and Java is a managed
  # runtime pinned via `.mise.toml` (java = "26"). Treating
  # that file as scannable code is consistent with how csharp
  # / fsharp / actions are treated elsewhere; CodeQL's
  # `java-kotlin` extractor handles it.
  - "src/Core.TLA/**"
  - "src/Core.Lean4/**"

  # Generated code. If any file ends in `.generated.cs` it is
  # source-of-truth-elsewhere; findings on it would ask us to
  # fix a generator, not the file.
  - "**/*.generated.cs"

  # .NET build artifacts. The `obj/` and `bin/` trees contain
  # generated test scaffolding (xUnit auto-generated entry
  # points: `XunitAutoGeneratedEntry*.cs`) and compiler
  # intermediates that aren't authored source. CodeQL findings
  # here ask us to fix MSBuild's output, not the source —
  # which is the wrong dependency direction. Empirically
  # discovered 2026-04-28 (081KQ8P5D0008QG0R002RYXE89): two open csharp alerts on
  # `obj/Release/net10.0/XunitAutoGenerated*.cs` were gating
  # the LFG `code_quality:severity=all` ruleset on every PR.
  - "**/obj/**"
  - "**/bin/**"

# Custom query packs — reserved for the follow-up round that
# ships Zeta-specific taint / CWE rules. The formal-
# verification-expert (Soraya) routes the rule authoring
# between Semgrep (syntactic) and CodeQL (taint-flow); see
# .claude/skills/formal-methods/blueprints/codeql-expert.md §"When CodeQL is the
# wrong tool" for the decision rubric.
#
# packs:
#   - custom-queries/zeta-security
