# Independently-testable lanes — the derived shard matrix, and the measurement
# that decides whether a shard is a shard or a wish.
#
# THE PROBLEM THIS LANE IS FOR
# ----------------------------
# `full-ai-cluster/k8s/storage-profiles.json` measures all 47 Applications at
# 3941m / 15406Mi / 74.26 GiB of images at the `dev` rung, against a hosted
# `ubuntu-24.04` runner's 2500m / 9216Mi / 66 GiB of unreserved capacity. CPU
# is over by 1.58x and disk by 1.13x. So "test every chart" is not reachable on
# one hosted runner at any CPU ladder — a ladder cannot shrink an image.
# Sharding is the only route.
#
# THIS PARAGRAPH'S NUMBERS MOVED TWICE ON 2026-08-23 AND THE PROVENANCE MATTERS,
# because the previous version cited `envelope freeDiskGib 70, leftover-on-main
# #13784` — a value that was NOT on main when that sentence was written. The
# field oscillated 70/14/70/14 across four PRs on 2026-08-22 with no human
# decision recorded in either direction, and this comment was left describing a
# world the tree did not carry. It does now, deliberately: Aaron took the 70
# explicitly on 2026-08-23 ("take the 70, unlock hindsight and vllm on hosted
# runners"), and the authorization is recorded in the artifact itself. The CPU
# figure moved with it — 6166m -> 4916m — because 18 governed `dev` rows were
# floored at 25m under the same decision. THEN THEY MOVED AGAIN ON REBASE, which
# is why they are written with their history: 6166m -> 4916m (the 25m floor) ->
# 3941m, because #14194 landed on main in between and made raw in-repo manifests
# rung-reachable, taking gmod from an unreachable 1000m to a governed 100m. The
# disk figure moved 74.54 -> 74.26 GiB in the same rebase and NEITHER direction
# is growth or shrinkage of the tree: #14174 and #14233 made 8 previously
# unmeasurable images measurable (pushing it UP, to 75.81), and #14250 then took
# the private FlowDent charts out of the public tree (pushing it back DOWN). What
# changed is how much of the tree is COUNTED, not how big it is. Neither number here is a bound; both are read out of
# the catalogue by `lane-partition.ts` on every run, and this comment is prose
# that has already been wrong once.
#
# WHY THE MATRIX IS COMPUTED AND NOT WRITTEN DOWN
# -----------------------------------------------
# `lane-partition.ts` derives the lanes from the declared dependency graph, the
# resource catalogue and the measured image footprints, on every run. Nothing
# in this file names an Application. A hand-written shard list drifts from the
# dependency data the moment someone adds a chart, and this repo has already
# been bitten by that exact shape — a glob deferring nine directories while a
# registry reasoned about five, both reporting green. Here a new Application
# lands in a lane (or in the quarantine) without anyone editing YAML.
#
# WHAT EACH LANE JOB ACTUALLY PROVES
# ----------------------------------
# The partition's disk numbers are compressed registry bytes times x2.67, an
# aggregate measured over four images. That is an estimate. Each lane job
# CONVICTS it: it reads the runner's real free disk, pulls exactly its lane's
# images, and measures the delta. If the estimate is low the job fills the disk
# and says which lane did it — which is the only way this stops resting on a
# ratio. The three-axis budget is checked against the runner's OWN /proc, not
# against the vendor spec, for the same reason.
#
# WHAT IT DOES NOT YET PROVE, said plainly rather than implied
# ------------------------------------------------------------
# It does not yet BRING UP the lane. `--root-exclude` emits the ArgoCD
# `directory.exclude` glob that would scope a root Application to one lane, and
# `app-of-apps-discovery.ts` already reads that field — so the wiring is one
# step, not a redesign. It is not taken here because a bring-up that has never
# run is not something to assert in a workflow comment. The pull step is real
# work in the meantime: it is the binding constraint, measured.

name: k8s-lane-partition

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/Core.TypeScript/cluster/lane-partition.ts"
      - "src/Core.TypeScript/cluster/lane-partition.test.ts"
      - "src/Core.TypeScript/cluster/assert-runner-envelope.ts"
      - "src/Core.TypeScript/cluster/measure-lane-footprints.ts"
      - "full-ai-cluster/k8s/lane-footprints.json"
      - "full-ai-cluster/k8s/sync-wave-dependency-graph.yaml"
      - "full-ai-cluster/k8s/storage-profiles.json"
      # The partition JOINS four sources; a change to the roster or to what a
      # chart renders moves the answer. Watching only this module would let the
      # partition go stale against the tree it partitions.
      - "full-ai-cluster/k8s/applications/**"
      - "full-ai-cluster/k8s/bootstrap/**"
      - "src/Core.TypeScript/cluster/app-of-apps-discovery.ts"
      - "src/Core.TypeScript/cluster/rendered-storage-claims.ts"
      - ".github/workflows/k8s-lane-partition.yml"
  push:
    branches: [main]
    paths:
      - "src/Core.TypeScript/cluster/lane-partition.ts"
      - "src/Core.TypeScript/cluster/lane-partition.test.ts"
      - "src/Core.TypeScript/cluster/assert-runner-envelope.ts"
      - "src/Core.TypeScript/cluster/measure-lane-footprints.ts"
      - "full-ai-cluster/k8s/lane-footprints.json"
      - "full-ai-cluster/k8s/sync-wave-dependency-graph.yaml"
      - "full-ai-cluster/k8s/storage-profiles.json"
      - "full-ai-cluster/k8s/applications/**"
      - "full-ai-cluster/k8s/bootstrap/**"
      - "src/Core.TypeScript/cluster/app-of-apps-discovery.ts"
      - "src/Core.TypeScript/cluster/rendered-storage-claims.ts"
      - ".github/workflows/k8s-lane-partition.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k8s-lane-partition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: derive the lane matrix
    # The cluster toolchain lives in `.mise.full.toml` and the shim resolve
    # needs MISE_ENV=full at install AND run time -- job-level, never
    # step-level (workitem 081KTWQZY7F). Without it `bun` is not on PATH and
    # the first run of this workflow failed with `bun: command not found`.
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
      lane_count: ${{ steps.derive.outputs.lane_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      # A falsifier that is not NAMED is a falsifier that never runs: no job in
      # CI runs `src/Core.TypeScript/cluster/` as a directory.
      - name: Falsifiers
        run: bun test src/Core.TypeScript/cluster/lane-partition.test.ts

      # buildModel REFUSES on any mismatch between the roster, the graph, the
      # catalogue and the footprints — including a citation that mentions
      # declared intent and that `spec.intentAdjudication` does not answer. This
      # step exists so that refusal reddens the gate rather than only appearing
      # inside a test.
      - name: The four sources still join
        run: bun src/Core.TypeScript/cluster/lane-partition.ts --rung dev

      - name: Derive the matrix
        id: derive
        run: |
          set -euo pipefail
          MATRIX="$(bun src/Core.TypeScript/cluster/lane-partition.ts --matrix)"
          COUNT="$(printf '%s' "$MATRIX" | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).length)')"
          # A zero-lane matrix would make every downstream job vanish and the
          # workflow report green having tested nothing — the vacuity class in
          # its purest form. Refuse it.
          if [ "$COUNT" -lt 1 ]; then
            echo "the partition produced NO lanes; refusing to report green on an empty matrix" >&2
            exit 1
          fi
          {
            echo "matrix=$MATRIX"
            echo "lane_count=$COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          {
            echo '## Lane partition'
            echo '```'
            bun src/Core.TypeScript/cluster/lane-partition.ts --rung dev
            echo '```'
            echo '### Connected components (the zero-duplication baseline this does NOT use)'
            echo '```'
            bun src/Core.TypeScript/cluster/lane-partition.ts --components
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lane:
    name: lane ${{ matrix.lane }}
    needs: plan
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      # The envelope's capacity half is GitHub's PUBLISHED spec, not something
      # we measured — `storage-profiles.json` says so in
      # `reservationEvidence`. This convicts it against the machine we are
      # actually on, because a budget computed from a spec the runner does not
      # meet is a check that did not run.
      # `assert-runner-envelope.ts` rather than an inline `bun -e`: a check that
      # exists only inside a YAML string cannot be run locally and cannot be
      # tested, and shellcheck cannot see through `${...}` in a single-quoted
      # heredoc either (SC2016 -- this workflow's first run went red on it).
      - name: The runner really has the envelope's capacity
        run: |
          set -euo pipefail
          cpu_millis=$(( $(nproc) * 1000 ))
          mem_mib=$(( $(awk '/MemTotal/{print $2}' /proc/meminfo) / 1024 ))
          free_gib=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "measured runner: ${cpu_millis}m / ${mem_mib}Mi / ${free_gib}Gi free on /"
          bun src/Core.TypeScript/cluster/assert-runner-envelope.ts \
            --cpu-millis "$cpu_millis" --memory-mib "$mem_mib" --free-disk-gib "$free_gib"

      - name: Render every chart in this lane
        env:
          LANE_MEMBERS: ${{ matrix.members }}
        run: |
          set -euo pipefail
          echo "lane members: $LANE_MEMBERS"
          bun src/Core.TypeScript/cluster/lane-partition.ts --lane "${{ matrix.lane }}" --images

      # THE MEASUREMENT. Pull exactly this lane's images and read the real
      # on-disk delta. This is what converts `compressed x 2.67` from an
      # estimate into a number, per lane, on the runner the lane runs on.
      - name: Pull this lane's images and measure the real on-disk cost
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          BUDGET_GIB="$(bun src/Core.TypeScript/cluster/lane-partition.ts --lane "$LANE" --budget-gib)"
          BEFORE_MIB=$(df -BM --output=used /var/lib/docker 2>/dev/null | tail -1 | tr -dc '0-9' || df -BM --output=used / | tail -1 | tr -dc '0-9')
          FAILED=0
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            echo "::group::pull $image"
            # Registry throttles are transient, so retry them without weakening
            # the measurement: a persistently unreachable image is still
            # recorded and fails the lane after the remaining images are pulled.
            PULLED=0
            for attempt in 1 2 3; do
              if docker pull --quiet "$image"; then
                PULLED=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                delay=$((attempt * 5))
                echo "pull attempt $attempt failed; retrying in ${delay}s"
                sleep "$delay"
              fi
            done
            if [ "$PULLED" -eq 0 ]; then
              echo "PULL FAILED: $image"
              FAILED=$((FAILED + 1))
            fi
            echo "::endgroup::"
          done < <(bun src/Core.TypeScript/cluster/lane-partition.ts --lane "$LANE" --images)
          AFTER_MIB=$(df -BM --output=used /var/lib/docker 2>/dev/null | tail -1 | tr -dc '0-9' || df -BM --output=used / | tail -1 | tr -dc '0-9')
          DELTA_MIB=$(( AFTER_MIB - BEFORE_MIB ))
          echo "MEASURED on-disk for $LANE: ${DELTA_MIB} MiB against a budget of ${BUDGET_GIB} GiB"
          {
            echo "### $LANE measured image footprint"
            echo "- estimated budget: ${BUDGET_GIB} GiB"
            echo "- measured on disk: ${DELTA_MIB} MiB"
            echo "- images that would not pull: ${FAILED}"
          } >> "$GITHUB_STEP_SUMMARY"
          # Convict the estimate. `x2.67` is an aggregate over four images and a
          # lane whose real cost exceeds its budget is a lane that does not fit,
          # whatever the arithmetic said.
          BUDGET_MIB=$(BUDGET_GIB="$BUDGET_GIB" bun -e '
            const gib = Number(process.env.BUDGET_GIB);
            if (!Number.isFinite(gib)) process.exit(2);
            console.log(Math.round(gib * 1024));
          ')
          if [ "$DELTA_MIB" -gt "$BUDGET_MIB" ]; then
            echo "$LANE does NOT fit: ${DELTA_MIB} MiB measured > ${BUDGET_MIB} MiB budgeted. The x2.67 ratio under-estimates this lane." >&2
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "$LANE fits on disk, but ${FAILED} image(s) could not be pulled — the measurement is a FLOOR." >&2
            exit 1
          fi
