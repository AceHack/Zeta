name: ci-cache-paths-lint

# Flags any actions/cache `path:` in `.github/workflows/*.yml`
# overlapping with `git ls-files`. The discipline rule:
#
#   actions/cache paths are mutually exclusive with git ls-files —
#   cache only DERIVED files (downloaded jars, built artefacts,
#   user-home tool state), never source-controlled content.
#
# Failure mode this prevents (silent + invisible): cache hit
# OVERWRITES freshly-checked-out source files with cached versions.
# PR edits to tracked files silently revert; CI tests the OLD
# content but reports the result as the PR's new state. Discovery-
# by-luck class — only surfaced via empirical bug in a recent
# CircuitRegistration test failure.
#
# Composes with:
#   - src/Core.TypeScript/hygiene/audit-ci-cache-paths.ts (the audit tool itself)
#   - .github/workflows/gate.yml (uses the narrowed cache pattern)
#   - .github/workflows/low-memory.yml (same pattern)
#
# Safe-pattern compliance (per FACTORY-HYGIENE row #43):
#   - SHA-pinned actions/checkout
#   - Explicit minimum permissions: contents: read
#   - No user-authored context; purely repo-file reads
#   - Concurrency group + pinned runs-on
#   - Path-filter narrows trigger surface

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "src/Core.TypeScript/hygiene/audit-ci-cache-paths.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "src/Core.TypeScript/hygiene/audit-ci-cache-paths.ts"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ci-cache-paths-lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: audit actions/cache paths vs git ls-files
    runs-on: ubuntu-24.04
    # 12 minutes, not 5: this job runs tools/setup/install.sh, so its timeout is
    # the CEILING on the installer's apt wall budget (audit-apt-budget-fits-job-
    # timeout.ts). At 5 minutes these three cadence jobs pinned that budget to
    # 150s fleet-wide, which left the first apt attempt 45s against a 38.2s
    # healthy cost — tight enough to false-fail a merely-slow mirror. A timeout
    # is a cap, not a reservation: this job finishes in ~2.5 min, so raising it
    # costs zero additional CI minutes on the healthy path.
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        # Provides bun via mise's pin in .mise.toml. Same pattern as
        # memory-index-duplicate-lint.yml. shellenv.sh wires
        # BASH_ENV so subsequent run: steps auto-source the managed
        # shellenv with bun on PATH.
        env:
          # TIER DECLARED, not detected (081M0K36K69087G0R003BYSCF8 applied beyond gate.yml).
          # Every payload step in this job is bun/git/gh only -- it touches no agda, ghc,
          # emscripten, llvm, pandoc, r-base, podman, qemu or opam. On a hosted ubuntu runner
          # the undeclared path is not adaptation: 16 GB always detects `full`, i.e. the whole
          # 388-package / 713.0 MiB apt manifest. slim is 149 packages / 139.7 MiB.
          # This is a RELIABILITY fix before it is a cost one: the mirror stalls land on the
          # biggest archives (pandoc 26.9 MB, r-base-core 27.1 MB), so fetch fewer and fewer
          # runs die at exit 124 inside the 420s apt budget.
          ZETA_HOST_TIER: slim
          # mise release-metadata calls authenticate (1000/hr) instead of anonymous (60/hr 403 flake)
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Run audit-ci-cache-paths
        # Exits 0 if all cache paths are mutually exclusive with
        # git ls-files; non-zero if any path overlaps with a tracked
        # file. Detailed violation reports to stderr include the
        # workflow + step name + the offending tracked file +
        # "Why this is a bug" + "How to fix" output.
        shell: bash
        run: |
          set -euo pipefail
          bun src/Core.TypeScript/hygiene/audit-ci-cache-paths.ts
