# mirror-to-fork.yml — keep the acehack/Zeta fork an exact mirror of the
# canonical Lucent-Financial-Group/Zeta repository.
#
# WHY: acehack/Zeta is a *pure mirror* (no unique content of its own — that is
# the standing contract; see the 2026-06-13 mirror reconciliation). Without a
# sync job it drifts the moment origin advances (every merge pushes a fresh
# automation/pr-archive-* branch). This workflow re-establishes the mirror on
# every push, on branch deletions, and on a 6-hourly safety-net schedule.
#
# DESTRUCTIVE BY DESIGN: the push uses --prune, so any ref on the fork that is
# absent on origin is DELETED on the fork. This is correct for a pure mirror.
# It is safe ONLY while the fork-holds-no-unique-content contract holds. The
# one-time reconciliation that established that contract preserved every prior
# fork-unique tip under origin tags `archive/2026-06-13-acehack/*`.
#
# SECRET REQUIRED (maintainer/Dejan to provision before enabling):
#   ACEHACK_MIRROR_TOKEN — a fine-grained PAT scoped to AceHack/Zeta ONLY,
#   with Contents: read+write and Workflows: read+write. NOT the default
#   GITHUB_TOKEN (that cannot push to a different repository). Rotate per the
#   HSM/secret-rotation cadence.
#
# ENABLEMENT REQUIRED:
#   Set repository variable ACEHACK_MIRROR_ENABLED=true only after the token has
#   the workflow scope above. Without that explicit enablement, the job is a
#   no-op so ordinary PRs do not fail on an unprovisioned side-effect.
#
# GATED: workflow + secret handling. Requires Dejan (devops) review + human
# sign-off before merge/enable (GOVERNANCE.md §23). Drafted by Otto (shadow)
# at Aaron's request; NOT auto-merged.

name: mirror-to-fork

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete: {}
  schedule:
    - cron: "13 */6 * * *" # safety net every 6h (off-peak minute, not :00)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mirror-to-fork
  cancel-in-progress: false # never interrupt a mirror push mid-flight

jobs:
  mirror:
    # Only the canonical repo mirrors outward; a fork running this is a no-op.
    if: github.repository == 'Lucent-Financial-Group/Zeta' && vars.ACEHACK_MIRROR_ENABLED == 'true'
    # Timeout basis: no completed runs (gated on ACEHACK_MIRROR_ENABLED); full-history mirror push, deliberately generous.
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (all history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Do NOT persist the default GITHUB_TOKEN as a global
          # http.<github>.extraheader — it would override the
          # x-access-token:${MIRROR_TOKEN} embedded in the mirror remote URL
          # and push as github-actions[bot] (403 on the fork). origin is
          # public, so the unauthenticated fetch still works.
          persist-credentials: false

      - name: Mirror all branches and tags to the acehack fork
        env:
          MIRROR_TOKEN: ${{ secrets.ACEHACK_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "::error::ACEHACK_MIRROR_TOKEN is not set — cannot push to the fork." >&2
            exit 1
          fi
          # Fetch every origin head into the REMOTE-TRACKING namespace
          # (refs/remotes/origin/*), NOT local refs/heads/* — the runner has
          # refs/heads/main checked out, and git refuses to fetch into a
          # checked-out branch. Tags fetch into refs/tags/* (no conflict).
          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch --prune --tags origin
          git update-ref -d refs/remotes/origin/HEAD || true

          # Token is interpolated into the URL only at runtime; never logged.
          git remote add mirror \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/acehack/Zeta.git"

          # Push the remote-tracking refs to the fork's heads. --prune makes
          # the fork MATCH origin (deletes fork refs absent here); '+' forces
          # divergent same-name refs to origin's tip.
          echo "Mirroring heads…"
          git push --prune --force mirror "+refs/remotes/origin/*:refs/heads/*"
          echo "Mirroring tags…"
          git push --prune --force mirror "+refs/tags/*:refs/tags/*"
          echo "Mirror sync complete."
