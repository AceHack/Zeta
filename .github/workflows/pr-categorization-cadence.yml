name: pr-categorization-cadence

# Refreshes the PR-area statistics and the dashboard that renders them.
#
# WHAT IT PRODUCES. `data/pr-categorization/statistics.json` (the statistics file),
# `data/pr-categorization/index.html` (the page), and `docs/PR-AREA-STATISTICS.md`
# (the digest). All three come from one generator pass and all three are flushed
# together — see the flush step for why that is stated so loudly.
#
# WHY IT IS SCHEDULED. The numbers are a measurement of a corpus that grows by
# hundreds of PRs a day, and the AREA MIX is the fastest-moving thing in it: over
# the eleven days before this lane was written, telemetry went from 12% to 47% of
# merged PRs and `memory` went to zero. A statistics file regenerated by hand is a
# statistics file that describes a repo that no longer exists.
#
# HOW IT LANDS. Not by pushing `main`. Ruleset "CI Gate" requires `gate (required)`
# at PUSH time with no bypass actors, so no credential of any scope can land a
# commit there — the route is the fix, not a stronger token. This lane parks on
# `heartbeat/pr-categorization` and flushes via a PR with auto-merge armed, the same
# route every other telemetry lane uses.
#
# THE LANE WATCHES ITS OWN SILENCE. `statistics.json` carries `generatedAtIso` and
# is registered in FRESHNESS_ROSTER in
# src/Core.TypeScript/hygiene/audit-artifact-freshness.ts against the cron below. If
# this workflow stops firing, `artifact-freshness` goes red naming this file — a
# lane nobody watches is a lane that dies quietly, and three did in the week this
# was written.
#
# Guarded by src/Core.TypeScript/hygiene/lint-drift-publication-lands.ts.

on:
  schedule:
    # Every 6 hours at :34 — a minute no other workflow in this repo uses, so the
    # scheduled lanes are not dropped together under scheduler load. The choice is
    # enforced rather than merely intended: pr-categorization.test.ts fails on a
    # collision, including against daily crons the `*/N` pattern would miss.
    - cron: "34 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-categorization-cadence
  cancel-in-progress: false

jobs:
  categorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # ABSENCE IS A NAMED REFUSAL, NOT A SUBSTITUTION. A `|| secrets.GITHUB_TOKEN`
      # rung here would select on the secret being EMPTY and hand the lane a
      # credential with different authority — the push would succeed, the lane would
      # look alive, and GitHub's recursion guard would silently stop the flush PR
      # from triggering `gate`.
      - name: Assert the branch-push credential is present
        env:
          BRANCH_PUSH_TOKEN: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}
        run: |
          if [ -z "${BRANCH_PUSH_TOKEN:-}" ]; then
            echo "::error title=Missing ZETA_TELEMETRY_FLUSH_TOKEN::This lane holds the BRANCH-PUSH role and its credential is absent. There is no substitute: GITHUB_TOKEN carries different authority and its pushes do not trigger workflows. FIX: set repository secret ZETA_TELEMETRY_FLUSH_TOKEN on Lucent-Financial-Group/Zeta to a fine-grained PAT with Contents: read and write, Pull requests: read and write, Metadata: read. Role table: docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md"
            exit 1
          fi
          echo "branch-push credential present (role=branch-push secret=ZETA_TELEMETRY_FLUSH_TOKEN)"

      # fetch-depth: 0 IS LOAD-BEARING, NOT HYGIENE. The ground-truth label for every
      # PR is derived from the files its squash-merge commit touched, recovered by
      # walking `git log --name-only` and joining on the trailing `(#NNNN)`. A shallow
      # clone yields a handful of commits, so the join finds almost nothing — the
      # generator refuses below rather than publishing a study of 50 PRs as if it
      # were a study of 13,000.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # ROLE: BRANCH-PUSH. One role, one secret. This credential pushes
          # `heartbeat/pr-categorization`, and that push's ACTOR is what decides
          # whether `gate (required)` ever runs on the flush PR.
          persist-credentials: true
          token: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}

      # THE FALSIFIER FOR THE CREDENTIAL, RUN IN PRODUCTION ON EVERY TICK. A real
      # `git push --dry-run` against the real remote, which updates nothing: GitHub
      # authorizes repository-write at the `git-receive-pack` advertisement, before
      # any ref is considered, so a dry run gets the true 403/200 answer. Probes a
      # `credprobe/` ref so a permission answer can never be confused with an
      # ancestry answer. Presence (the step above) and capability (this step) are
      # different conditions and get different reports.
      - name: Preflight the push credential
        env:
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          probe() { git push --dry-run origin "HEAD:refs/heads/credprobe/pr-categorization" 2>&1; }

          if OUT=$(probe); then
            echo "[preflight] pr-categorization: push credential is authorized for this repository."
            exit 0
          fi
          echo "$OUT"

          if ! printf '%s' "$OUT" | grep -qiE 'denied to|Authentication failed|Invalid username or token|error: 403'; then
            echo "::warning title=pr-categorization preflight inconclusive::the probe failed, but not with a credential answer. Leaving the credential as-is; the flush below will report the true error."
            exit 0
          fi

          echo "::error title=pr-categorization PAT cannot push::ZETA_TELEMETRY_FLUSH_TOKEN was denied by the remote. FIX: grant that fine-grained PAT 'Contents: read and write' on Lucent-Financial-Group/Zeta. Falling back to GITHUB_TOKEN: the artifacts still park on the staging branch, but 'gate (required)' will NOT start on the flush PR."

          HDR_B64=$(printf 'x-access-token:%s' "$FALLBACK_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$HDR_B64"
          git config --local --replace-all "http.https://github.com/.extraheader" "AUTHORIZATION: basic $HDR_B64"

          # RE-PROBE: a repair that is applied and never checked looks identical to
          # one that worked. That is the vacuity class, and the sibling lane has
          # already paid for it once.
          if OUT2=$(probe); then
            echo "[preflight] pr-categorization: fallback credential verified; lane is DEGRADED but alive."
            exit 0
          fi
          echo "$OUT2"
          echo "::error title=pr-categorization has no working push credential::BOTH the PAT and GITHUB_TOKEN were denied. The pass still runs so the summary carries the answer, and the flush below will report the authoritative error."

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Configure committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Start from origin/main, then union in anything still parked on the staging
      # branch from a tick whose flush PR has not landed — otherwise a fast cadence
      # force-pushes over a refresh that was computed but not yet merged.
      - name: Prepare staging working tree
        run: bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts prepare --lane pr-categorization

      - name: Run the categorization pass (with --write)
        id: pass
        run: |
          # `set -o pipefail` IS REQUIRED AND IS NOT THE DEFAULT. GitHub runs `run:`
          # under `bash -e {0}` with pipefail OFF, so `bun ... | tee` reports TEE's
          # exit status and a failing generator reads as a passing step. The whole
          # point of this step is its exit code; without this line it does not have
          # one of its own.
          set -uo pipefail
          set +e
          bun src/Core.TypeScript/pr-categorization/cli.ts --write 2>&1 | tee pr-cat.txt
          status="${PIPESTATUS[0]}"
          set -e
          {
            echo '```'
            cat pr-cat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pass_status=$status" >> "$GITHUB_OUTPUT"

      # THE PUBLICATION. No `||`, no `continue-on-error`: a lane that cannot publish
      # is RED. A tick with nothing new to publish is still a clean no-op, because
      # `flush` returns 0 on an empty index — idempotent without pretending.
      #
      # ALL THREE ARTIFACTS ARE NAMED HERE. The sibling drift-dashboard lane wrote
      # four artifacts and flushed two for three days, so the markdown a human opens
      # sat frozen while the JSON beside it refreshed every six hours. A publication
      # route that carries part of the publication is the stale-artifact defect this
      # step exists to prevent. `pr-categorization.test.ts` asserts this `--paths`
      # list equals the generator's own exported `ARTIFACTS`, so the two cannot
      # drift silently again.
      - name: Flush the refreshed statistics to main via staging branch + PR
        if: always()
        env:
          # ROLE: PR-CREATE. A different role from the branch push above, and
          # therefore a different secret: the enterprise forbids the Actions identity
          # from creating pull requests.
          ZETA_FLUSH_ARM_AUTOMERGE: "1"
          GH_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN }}
        run: |
          set -euo pipefail
          bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts flush \
            --lane pr-categorization \
            --paths data/pr-categorization/statistics.json data/pr-categorization/index.html docs/PR-AREA-STATISTICS.md \
            --message "pr-categorization: refresh area statistics"

      - name: Fail if the categorization pass did not succeed
        env:
          PASS_STATUS: ${{ steps.pass.outputs.pass_status }}
        run: |
          # Read the status through the environment and REFUSE what cannot be read,
          # rather than interpolating a GH expression straight into `exit` (SC2242)
          # and exiting on a value nobody verified.
          status="${PASS_STATUS:-0}"
          case "$status" in
            ''|*[!0-9]*)
              echo "::error::[pr-categorization] pass_status is not a number: '$status'"
              exit 1
              ;;
          esac
          if [ "$status" -gt 255 ]; then
            echo "::error::[pr-categorization] pass_status out of range (0-255): $status"
            exit 1
          fi
          # Exit 4 is the label-shuffle null having leaked, which invalidates every
          # number the pass just published. It is a failure, not a warning.
          exit "$status"
