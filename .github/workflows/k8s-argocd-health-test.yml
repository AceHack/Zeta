# Kubernetes + ArgoCD health integration test (081KSXN940008QG0R000SCP2H1).
#
# SECURITY NOTE:
# - This workflow reads the PR head SHA / push SHA only through env-block
#   buffering (`ZETA_ARGOCD_GIT_REF`) and then quotes that shell variable.
# - No attacker-controlled PR title/body/branch text is interpolated into a
#   `run:` block.
# - The only third-party action used is checkout, SHA-pinned per
#   docs/security/GITHUB-ACTIONS-SAFE-PATTERNS.md.

name: k8s-argocd-health-test

on:
  schedule:
    # DAILY (was weekly Sunday, "43 16 * * 0") — Aaron 2026-08-13: "it should
    # be more often than weekly on the k8s testing".
    #
    # Why daily, and why not more or less:
    #
    # 1. The billable cost is ZERO, checked not assumed. Lucent-Financial-
    #    Group/Zeta is a PUBLIC repository, and GitHub-hosted standard runners
    #    are free for public repositories. Confirmed against this workflow's
    #    own accounting: `GET /actions/runs/31754638408/timing` reports
    #    `billable.UBUNTU.total_ms = 0` across all 4 jobs for a 12.6-minute
    #    run. So the real costs are concurrency slots and the maintainer
    #    attention a failure consumes — not dollars.
    #
    # 2. Everything this lane could drift against is PINNED IN-REPO: kind
    #    0.31.0 / kubectl 1.36.1 / helm 4.2.0 (.mise.full.toml), argo-cd chart
    #    7.7.10, Gateway API v1.2.1 (vendored CRDs). What is NOT pinned is the
    #    substrate underneath: the `ubuntu-24.04` runner image (Docker,
    #    containerd, kernel, cgroup layout), live registry + helm-repo
    #    availability, and main-branch changes outside this workflow's `paths`
    #    filter — `tools/setup/**` is notably absent from it, so an
    #    `install.sh` change reaches main untested by this lane until a cron
    #    fires. Those move on the order of a day; a weekly cron gives a mean
    #    time-to-detect of ~3.5 days and a worst case of 7, which is longer
    #    than the drift period it exists to catch.
    #
    # 3. Daily brings MTTD to ~12h (24h worst case) — matched to the fastest
    #    drift source we actually have. Sub-daily (e.g. `*/6`) would mostly
    #    re-measure the same unchanged substrate and multiply failure noise
    #    without shortening detection below that period, so it would buy
    #    signal we cannot act on any faster.
    #
    # Minute 53 is off `:00`/`:30` (thundering-herd) and unused elsewhere in
    # .github/workflows; 16:53 UTC is mid-morning US Pacific, so a failure
    # lands when someone is around to read it. Hour retained from the former
    # weekly slot — only the day-of-week widens.
    - cron: "53 16 * * *"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/Core.TypeScript/cluster/argocd-health-test.ts"
      - "src/Core.TypeScript/cluster/argocd-health-test.test.ts"
      - "full-ai-cluster/dev-cluster/**"
      # WATCH WHAT THIS LANE DEPLOYS. This used to be
      # "applications/**/Application.yaml", which matched only the ArgoCD
      # Application objects and none of the manifests they point at -- yet
      # the lane deploys those manifests. Measured: the run that caught the
      # gatekeeper CRD-wait Job being rejected by PodSecurity created the pod
      # from applications/hat-system/gatekeeper-crd-wait.yaml, a file this
      # filter did not watch. So a PR breaking a workload manifest did not
      # run the one lane that deploys it, and the PR that FIXED that Job
      # (#13223) got no kind check either -- it was caught only because an
      # unrelated PR happened to touch a watched path.
      #
      # Now the same breadth as the bootstrap entry below, which already
      # uses "**" for the same reason.
      - "full-ai-cluster/k8s/applications/**"
      - "full-ai-cluster/k8s/bootstrap/**"
      - "full-ai-cluster/k8s/single-node-budget.json"
      - "src/Core.TypeScript/cluster/single-node-readiness.ts"
      - "src/Core.TypeScript/cluster/single-node-readiness.test.ts"
      - "docs/backlog/P1/081KSXN940008QG0R000SCP2H1-kubernetes-argocd-kind-k3d-integration-health-tests-separate.md"
      - ".github/workflows/k8s-argocd-health-test.yml"
      - ".mise.toml"
      - ".mise.full.toml"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "src/Core.TypeScript/cluster/argocd-health-test.ts"
      - "src/Core.TypeScript/cluster/argocd-health-test.test.ts"
      - "full-ai-cluster/dev-cluster/**"
      # WATCH WHAT THIS LANE DEPLOYS. This used to be
      # "applications/**/Application.yaml", which matched only the ArgoCD
      # Application objects and none of the manifests they point at -- yet
      # the lane deploys those manifests. Measured: the run that caught the
      # gatekeeper CRD-wait Job being rejected by PodSecurity created the pod
      # from applications/hat-system/gatekeeper-crd-wait.yaml, a file this
      # filter did not watch. So a PR breaking a workload manifest did not
      # run the one lane that deploys it, and the PR that FIXED that Job
      # (#13223) got no kind check either -- it was caught only because an
      # unrelated PR happened to touch a watched path.
      #
      # Now the same breadth as the bootstrap entry below, which already
      # uses "**" for the same reason.
      - "full-ai-cluster/k8s/applications/**"
      - "full-ai-cluster/k8s/bootstrap/**"
      - "full-ai-cluster/k8s/single-node-budget.json"
      - "src/Core.TypeScript/cluster/single-node-readiness.ts"
      - "src/Core.TypeScript/cluster/single-node-readiness.test.ts"
      - "docs/backlog/P1/081KSXN940008QG0R000SCP2H1-kubernetes-argocd-kind-k3d-integration-health-tests-separate.md"
      - ".github/workflows/k8s-argocd-health-test.yml"
      - ".mise.toml"
      - ".mise.full.toml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    name: plan + unit tests
    # k8s lane NEEDS .mise.full.toml (k3d/kubectl/helm) at install AND run time — job-level
    # env, never step-level (the shim resolve needs MISE_ENV=full; workitem 081KTWQZY7F).
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      - name: Run 081KSXN940008QG0R000SCP2H1 harness unit tests
        run: bun test src/Core.TypeScript/cluster/argocd-health-test.test.ts

      # Single-node readiness (081M02QMJPA087G0R000J9M39E). Lives in THIS job
      # rather than a job of its own: the toolchain and bun deps are already
      # installed here, so the marginal cost is the ~2s the two commands take.
      # A separate job would pay a fresh runner + cache restore + install.sh
      # (~3 min) to run a 2-second offline check.
      #
      # NOT `continue-on-error`. It is green on main today against the
      # checked-in ledger; it fails on DRIFT away from that ledger. Proof it
      # can go red: single-node-readiness.test.ts pairs every green case with
      # the red case, and four deliberate manifest breaks were run against the
      # live tree (over-budget PVC, unacknowledged replicas>1, tab-indented
      # YAML, a third app-of-apps root) -- all exit 1.
      - name: Run single-node readiness unit tests
        run: bun test src/Core.TypeScript/cluster/single-node-readiness.test.ts

      - name: Audit single-node readiness against the checked-in budget ledger
        run: bun src/Core.TypeScript/cluster/single-node-readiness.ts

      - name: Build ArgoCD health dry-run plan
        env:
          ZETA_ARGOCD_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          ZETA_ARGOCD_GIT_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/Lucent-Financial-Group/Zeta' }}
        run: |
          bun src/Core.TypeScript/cluster/argocd-health-test.ts \
            --dry-run \
            --provider kind \
            --scope smoke \
            --runtime docker \
            --config full-ai-cluster/dev-cluster/profiles/ci.kind-config.yaml \
            --git-ref "$ZETA_ARGOCD_GIT_REF"

  live-kind:
    name: live kind ArgoCD health (${{ matrix.runner }})
    needs: dry-run
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    # k8s lane NEEDS .mise.full.toml (k3d/kubectl/helm) at install AND run time — job-level
    # env, never step-level (the shim resolve needs MISE_ENV=full; workitem 081KTWQZY7F).
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      - name: Run live kind ArgoCD health check
        env:
          ZETA_ARGOCD_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          ZETA_ARGOCD_GIT_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/Lucent-Financial-Group/Zeta' }}
        run: |
          bun src/Core.TypeScript/cluster/argocd-health-test.ts \
            --run \
            --provider kind \
            --scope smoke \
            --runtime docker \
            --config full-ai-cluster/dev-cluster/profiles/ci.kind-config.yaml \
            --cluster-name zeta-ci \
            --git-ref "$ZETA_ARGOCD_GIT_REF" \
            --timeout-sec 1200 \
            --poll-sec 10

      - name: Print cluster diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n argocd get applications.argoproj.io -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -200 || true

      - name: Tear down kind cluster
        if: always()
        run: bun src/Core.TypeScript/cluster/dev-cluster/kind-down.ts --cluster-name zeta-ci

  live-kind-included:
    name: live kind included Synced+Healthy proof (${{ matrix.runner }})
    needs: dry-run
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      - name: Run live kind included ArgoCD health proof
        env:
          ZETA_ARGOCD_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          ZETA_ARGOCD_GIT_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/Lucent-Financial-Group/Zeta' }}
        run: |
          bun src/Core.TypeScript/cluster/argocd-health-test.ts \
            --run \
            --provider kind \
            --scope included \
            --runtime docker \
            --config full-ai-cluster/dev-cluster/profiles/ci.kind-config.yaml \
            --cluster-name zeta-ci-included \
            --git-ref "$ZETA_ARGOCD_GIT_REF" \
            --timeout-sec 2400 \
            --poll-sec 15

      - name: Print cluster diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n argocd get applications.argoproj.io -o wide || true
          kubectl get pods -A -o wide || true
          kubectl -n arc-systems describe pods -l app.kubernetes.io/name=gha-rs-controller || true
          kubectl -n arc-systems logs -l app.kubernetes.io/name=gha-rs-controller --all-containers=true --prefix=true --tail=200 || true
          kubectl -n arc-systems logs -l app.kubernetes.io/name=gha-rs-controller --all-containers=true --prefix=true --previous=true --tail=200 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -200 || true

      - name: Tear down kind cluster
        if: always()
        run: bun src/Core.TypeScript/cluster/dev-cluster/kind-down.ts --cluster-name zeta-ci-included
