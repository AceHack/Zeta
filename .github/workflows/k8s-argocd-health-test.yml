# Kubernetes + ArgoCD health integration test (081KSXN940008QG0R000SCP2H1).
#
# SECURITY NOTE:
# - This workflow reads the PR head SHA / push SHA only through env-block
#   buffering (`ZETA_ARGOCD_GIT_REF`) and then quotes that shell variable.
# - No attacker-controlled PR title/body/branch text is interpolated into a
#   `run:` block.
# - The only third-party action used is checkout, SHA-pinned per
#   docs/security/GITHUB-ACTIONS-SAFE-PATTERNS.md.

name: k8s-argocd-health-test

on:
  schedule:
    # DAILY (was weekly Sunday, "43 16 * * 0") — Aaron 2026-08-13: "it should
    # be more often than weekly on the k8s testing".
    #
    # Why daily, and why not more or less:
    #
    # 1. The billable cost is ZERO, checked not assumed. Lucent-Financial-
    #    Group/Zeta is a PUBLIC repository, and GitHub-hosted standard runners
    #    are free for public repositories. Confirmed against this workflow's
    #    own accounting: `GET /actions/runs/31754638408/timing` reports
    #    `billable.UBUNTU.total_ms = 0` across all 4 jobs for a 12.6-minute
    #    run. So the real costs are concurrency slots and the maintainer
    #    attention a failure consumes — not dollars.
    #
    # 2. Everything this lane could drift against is PINNED IN-REPO: kind
    #    0.31.0 / kubectl 1.36.1 / helm 4.2.0 (.mise.full.toml), argo-cd chart
    #    7.7.10, Gateway API v1.2.1 (vendored CRDs). What is NOT pinned is the
    #    substrate underneath: the `ubuntu-24.04` runner image (Docker,
    #    containerd, kernel, cgroup layout), live registry + helm-repo
    #    availability, and main-branch changes outside this workflow's `paths`
    #    filter — `tools/setup/**` is notably absent from it, so an
    #    `install.sh` change reaches main untested by this lane until a cron
    #    fires. Those move on the order of a day; a weekly cron gives a mean
    #    time-to-detect of ~3.5 days and a worst case of 7, which is longer
    #    than the drift period it exists to catch.
    #
    # 3. Daily brings MTTD to ~12h (24h worst case) — matched to the fastest
    #    drift source we actually have. Sub-daily (e.g. `*/6`) would mostly
    #    re-measure the same unchanged substrate and multiply failure noise
    #    without shortening detection below that period, so it would buy
    #    signal we cannot act on any faster.
    #
    # Minute 53 is off `:00`/`:30` (thundering-herd) and unused elsewhere in
    # .github/workflows; 16:53 UTC is mid-morning US Pacific, so a failure
    # lands when someone is around to read it. Hour retained from the former
    # weekly slot — only the day-of-week widens.
    - cron: "53 16 * * *"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/Core.TypeScript/cluster/argocd-health-test.ts"
      - "src/Core.TypeScript/cluster/argocd-health-test.test.ts"
      - "src/Core.TypeScript/cluster/app-of-apps-discovery.ts"
      - "src/Core.TypeScript/cluster/app-of-apps-discovery.test.ts"
      - "src/Core.TypeScript/cluster/included-proof-summary.ts"
      - "src/Core.TypeScript/cluster/included-proof-summary.test.ts"
      - "src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.ts"
      - "src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.test.ts"
      - "full-ai-cluster/dev-cluster/**"
      # WATCH WHAT THIS LANE DEPLOYS. This used to be
      # "applications/**/Application.yaml", which matched only the ArgoCD
      # Application objects and none of the manifests they point at -- yet
      # the lane deploys those manifests. Measured: the run that caught the
      # gatekeeper CRD-wait Job being rejected by PodSecurity created the pod
      # from applications/hat-system/gatekeeper-crd-wait.yaml, a file this
      # filter did not watch. So a PR breaking a workload manifest did not
      # run the one lane that deploys it, and the PR that FIXED that Job
      # (#13223) got no kind check either -- it was caught only because an
      # unrelated PR happened to touch a watched path.
      #
      # Now the same breadth as the bootstrap entry below, which already
      # uses "**" for the same reason.
      - "full-ai-cluster/k8s/applications/**"
      - "full-ai-cluster/k8s/bootstrap/**"
      - "full-ai-cluster/k8s/single-node-budget.json"
      # The storage size profile ladder. The ledger's activeStorageProfile
      # names a rung in this catalogue and the auditor compares the manifests
      # against it, so a change to either side moves what the capacity gate
      # convicts on -- the same reason single-node-budget.json is watched.
      - "full-ai-cluster/k8s/storage-profiles.json"
      # The MEASURED comparator for the capacity gate. A node registering (or
      # re-registering with different disks) moves the hardware bound the audit
      # compares against, so it has to re-run -- otherwise a smaller node could
      # land on main without the gate that would have caught it ever firing.
      - "maintainers/*/cluster-nodes/**"
      - "src/Core.TypeScript/cluster/single-node-readiness.ts"
      - "src/Core.TypeScript/cluster/single-node-readiness.test.ts"
      - "src/Core.TypeScript/cluster/storage-profiles.ts"
      - "src/Core.TypeScript/cluster/storage-profiles.test.ts"
      - "docs/backlog/P1/081KSXN940008QG0R000SCP2H1-kubernetes-argocd-kind-k3d-integration-health-tests-separate.md"
      - ".github/workflows/k8s-argocd-health-test.yml"
      - ".mise.toml"
      - ".mise.full.toml"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "src/Core.TypeScript/cluster/argocd-health-test.ts"
      - "src/Core.TypeScript/cluster/argocd-health-test.test.ts"
      - "src/Core.TypeScript/cluster/app-of-apps-discovery.ts"
      - "src/Core.TypeScript/cluster/app-of-apps-discovery.test.ts"
      - "src/Core.TypeScript/cluster/included-proof-summary.ts"
      - "src/Core.TypeScript/cluster/included-proof-summary.test.ts"
      - "src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.ts"
      - "src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.test.ts"
      - "full-ai-cluster/dev-cluster/**"
      # WATCH WHAT THIS LANE DEPLOYS. This used to be
      # "applications/**/Application.yaml", which matched only the ArgoCD
      # Application objects and none of the manifests they point at -- yet
      # the lane deploys those manifests. Measured: the run that caught the
      # gatekeeper CRD-wait Job being rejected by PodSecurity created the pod
      # from applications/hat-system/gatekeeper-crd-wait.yaml, a file this
      # filter did not watch. So a PR breaking a workload manifest did not
      # run the one lane that deploys it, and the PR that FIXED that Job
      # (#13223) got no kind check either -- it was caught only because an
      # unrelated PR happened to touch a watched path.
      #
      # Now the same breadth as the bootstrap entry below, which already
      # uses "**" for the same reason.
      - "full-ai-cluster/k8s/applications/**"
      - "full-ai-cluster/k8s/bootstrap/**"
      - "full-ai-cluster/k8s/single-node-budget.json"
      # The storage size profile ladder. The ledger's activeStorageProfile
      # names a rung in this catalogue and the auditor compares the manifests
      # against it, so a change to either side moves what the capacity gate
      # convicts on -- the same reason single-node-budget.json is watched.
      - "full-ai-cluster/k8s/storage-profiles.json"
      # The MEASURED comparator for the capacity gate. A node registering (or
      # re-registering with different disks) moves the hardware bound the audit
      # compares against, so it has to re-run -- otherwise a smaller node could
      # land on main without the gate that would have caught it ever firing.
      - "maintainers/*/cluster-nodes/**"
      - "src/Core.TypeScript/cluster/single-node-readiness.ts"
      - "src/Core.TypeScript/cluster/single-node-readiness.test.ts"
      - "src/Core.TypeScript/cluster/storage-profiles.ts"
      - "src/Core.TypeScript/cluster/storage-profiles.test.ts"
      - "docs/backlog/P1/081KSXN940008QG0R000SCP2H1-kubernetes-argocd-kind-k3d-integration-health-tests-separate.md"
      - ".github/workflows/k8s-argocd-health-test.yml"
      - ".mise.toml"
      - ".mise.full.toml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    name: plan + unit tests
    # k8s lane NEEDS .mise.full.toml (k3d/kubectl/helm) at install AND run time — job-level
    # env, never step-level (the shim resolve needs MISE_ENV=full; workitem 081KTWQZY7F).
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      # `included-proof-summary.test.ts` is named explicitly. No job anywhere in CI
      # runs `src/Core.TypeScript/cluster/` as a directory -- every test under it is
      # reached by being listed by name, here or in a sibling step. So a falsifier
      # that is not named is a falsifier that never runs.
      - name: Run 081KSXN940008QG0R000SCP2H1 harness unit tests
        run: |
          bun test \
            src/Core.TypeScript/cluster/argocd-health-test.test.ts \
            src/Core.TypeScript/cluster/included-proof-summary.test.ts

      # WHICH Application MANIFESTS DOES A ROOT ACTUALLY REACH, AND WHICH OF
      # THOSE DOES ANY CHECK ASSERT ON. Offline, pure, ~1s -- so it lives in
      # this job beside the other harness unit tests rather than paying a fresh
      # runner.
      #
      # It exists because a manifest can be applied by the app-of-apps root and
      # be invisible to every roster CI asserts on, which is the strongest form
      # of "a check that did not run looks like a check that passed".
      # `game-hosting/gmod/Application.yaml` is live in that gap right now: the
      # root DOES apply it (ArgoCD's `*` is not path-segment bounded), it fails
      # its sync on every reconcile against gatekeeper's check-ignore-label
      # webhook, and the `--scope included` job stays green because
      # discoverExpectedApplications() is depth-1 and never sees it.
      #
      # NOT continue-on-error. It is green on the tree it ships with (46
      # manifests, 1 registered gap, 0 drift) and goes red on drift in three
      # directions -- measured, each by mutating the live tree: a second nested
      # Application (exit 1, UNASSERTED), the registry entry removed (exit 1,
      # UNASSERTED), an Application no root glob matches (exit 1,
      # NEVER-DISCOVERED). Making the glob path-segment bounded also turns it
      # red, which is the point: the semantics is the load-bearing claim.
      - name: Run app-of-apps discovery unit tests
        run: bun test src/Core.TypeScript/cluster/app-of-apps-discovery.test.ts

      # The virt proof's OFFLINE half. It builds its plan from the live
      # cdi/kubevirt Application manifests -- the include glob, the
      # operator-before-CR order, the useEmulation patch landing AFTER the
      # verbatim CR -- so a manifest edit that would make the live lane apply
      # the wrong bytes fails here in ~1s instead of 20 minutes later.
      #
      # Mutation-checked, each mutation verified applied by byte `cmp` against a
      # pristine copy before its result was read: useEmulation flipped to false,
      # the patch moved before the CR apply, the CDI wait swapped to the
      # operator Deployment's condition, the wildcard refusal removed, a
      # spurious emulation patch added to the CDI phase. All five go red.
      - name: Run kubevirt/cdi emulation proof unit tests
        run: bun test src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.test.ts

      - name: Build kubevirt/cdi emulation proof plan (offline)
        run: bun src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.ts --dry-run

      - name: Audit app-of-apps root reach against the asserted roster
        run: bun src/Core.TypeScript/cluster/app-of-apps-discovery.ts

      # Single-node readiness (081M02QMJPA087G0R000J9M39E). Lives in THIS job
      # rather than a job of its own: the toolchain and bun deps are already
      # installed here, so the marginal cost is the ~2s the two commands take.
      # A separate job would pay a fresh runner + cache restore + install.sh
      # (~3 min) to run a 2-second offline check.
      #
      # NOT `continue-on-error`. It is green on main today against the
      # checked-in ledger; it fails on DRIFT away from that ledger. Proof it
      # can go red: single-node-readiness.test.ts pairs every green case with
      # the red case, and four deliberate manifest breaks were run against the
      # live tree (over-budget PVC, unacknowledged replicas>1, tab-indented
      # YAML, a third app-of-apps root) -- all exit 1.
      #
      # 2026-08-21: a fifth comparator now runs, `capacity-provenance`. It
      # compares the same declared totals against MEASURED hardware from
      # maintainers/*/cluster-nodes/*/node.yaml (hence that path in the filters
      # above) and REFUSES when nothing measurable is registered -- because the
      # other comparator, ledger.nodeDiskGib, is an unsigned aspiration by the
      # ledger's own admission. Verified red on the live tree: exit 1 with
      # "longhorn declares 1409 GiB ... exceeds EVERY block device on
      # node-ad1efd (1047 GiB)" before that shortfall was recorded as debt.
      - name: Run single-node readiness unit tests
        run: bun test src/Core.TypeScript/cluster/single-node-readiness.test.ts

      # The storage-profile ladder's own falsifiers. Run SEPARATELY rather than
      # folded into the audit step: the audit checks the tree against the ACTIVE
      # rung, which says nothing about whether the validator that guards the
      # catalogue can still go red. A ladder whose refusals never execute in CI
      # is a check that did not run wearing the face of one that passed.
      - name: Run storage size profile unit tests
        run: bun test src/Core.TypeScript/cluster/storage-profiles.test.ts

      - name: Audit single-node readiness against the checked-in budget ledger
        run: bun src/Core.TypeScript/cluster/single-node-readiness.ts

      # THE RUNNER'S OWN CPU/MEMORY BUDGET (Aaron 2026-08-20: "make things small
      # enough to fit for disk and ram on the runners"). Offline, ~1s, so it
      # lives in this job beside the other catalogue checks.
      #
      # `--measure-runner` first, and it is the load-bearing half: the envelope
      # in storage-profiles.json records GitHub's PUBLISHED spec for a hosted
      # ubuntu-24.04 standard runner (4 vCPU / 16 GB), which is a vendor claim
      # and not a measurement. This step reads /proc on the actual runner and
      # exits 1 when the real machine is smaller than the record. Without it
      # every "it fits" the budget prints is arithmetic against a machine
      # nobody checked. It REFUSES rather than passes where /proc is absent,
      # so it cannot go quietly green on a non-Linux host either.
      #
      # Then the budget itself, against the `dev` rung. NOT continue-on-error:
      # green on main today at 1806m / 6079Mi against a 2500m / 9216Mi budget,
      # and red in four measured directions -- raise a dev number past the
      # budget, delete an ungoverned row, add an Application the catalogue does
      # not cover, or drop the acknowledgement for a chart nobody could measure.
      # All four were run as mutations against the live tree; all four exit 1.
      # The same audit against the `metal` rung exits 1 today (4131m / 11299Mi),
      # which is the point of there being two rungs.
      - name: Verify the runner is as big as the catalogue claims
        run: bun src/Core.TypeScript/cluster/storage-profiles.ts --measure-runner

      - name: Audit the dev resource rung against the runner budget
        run: bun src/Core.TypeScript/cluster/storage-profiles.ts --resource-profile dev --budget

      - name: Build ArgoCD health dry-run plan
        env:
          ZETA_ARGOCD_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          ZETA_ARGOCD_GIT_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/Lucent-Financial-Group/Zeta' }}
        run: |
          bun src/Core.TypeScript/cluster/argocd-health-test.ts \
            --dry-run \
            --provider kind \
            --scope smoke \
            --runtime docker \
            --config full-ai-cluster/dev-cluster/profiles/ci.kind-config.yaml \
            --git-ref "$ZETA_ARGOCD_GIT_REF"

  live-kind:
    name: live kind ArgoCD health (${{ matrix.runner }})
    needs: dry-run
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    # k8s lane NEEDS .mise.full.toml (k3d/kubectl/helm) at install AND run time — job-level
    # env, never step-level (the shim resolve needs MISE_ENV=full; workitem 081KTWQZY7F).
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      - name: Run live kind ArgoCD health check
        env:
          ZETA_ARGOCD_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          ZETA_ARGOCD_GIT_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/Lucent-Financial-Group/Zeta' }}
        run: |
          bun src/Core.TypeScript/cluster/argocd-health-test.ts \
            --run \
            --provider kind \
            --scope smoke \
            --runtime docker \
            --config full-ai-cluster/dev-cluster/profiles/ci.kind-config.yaml \
            --cluster-name zeta-ci \
            --git-ref "$ZETA_ARGOCD_GIT_REF" \
            --timeout-sec 1200 \
            --poll-sec 10

      - name: Print cluster diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n argocd get applications.argoproj.io -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -200 || true

      - name: Tear down kind cluster
        if: always()
        run: bun src/Core.TypeScript/cluster/dev-cluster/kind-down.ts --cluster-name zeta-ci

  live-kind-included:
    name: live kind included Synced+Healthy proof (${{ matrix.runner }})
    needs: dry-run
    # NOT `continue-on-error` -- removed 2026-08-21, and here is the measurement.
    #
    # It was added 2026-06-20 in #8789, a five-part `chore(setup)` PR whose only
    # recorded reason is one clause of one bullet: "live kind job advisory until
    # stable". Explicitly temporary, with an exit condition nobody ever came back
    # to. The job had shipped BLOCKING seven days earlier (#7911) and carried no
    # inline comment for the flag in the 62 days it stood.
    #
    # MEASURED over the 195 runs of this job from 2026-06-21 to 2026-08-21:
    #   * decisive conclusions 157 -- 104 pass / 53 fail;
    #   * ZERO failures in cluster creation, install.sh, cache restore or teardown.
    #     Every one of the 53 was the assertion step itself. It does not fail for
    #     environmental reasons, which is the thing that would have justified
    #     advisory status and is the thing the data refuses;
    #   * failures cluster into outages traceable to real, later-fixed defects.
    #     Only 4 isolated failures in two months (~2.5%). Sampling the failing
    #     runs by which Application missed shows ONE named defect per outage, held
    #     until someone fixed it -- never a different app each time, which is what
    #     flakiness looks like: `loki` (2026-07-31..08-01), `arc-controller`
    #     (2026-08-01..08-08, fixed by #10170), `cdi`+`kubevirt`
    #     (2026-08-16..08-21, fixed by #13084);
    #   * 91% pass before the 2026-08-16 regression, 100% (10/10) after it was
    #     fixed on 2026-08-21;
    #   * a green run takes ~10 min median. Only failures run long (~45 min), and
    #     those burn the runner today anyway.
    #
    # AND THE COST OF LEAVING IT: 52 of those 53 failures reported run-level
    # `success`. The 2026-08-16..2026-08-21 window was 44 consecutive failures,
    # 18 on `main`, all one real defect -- `cdi` and `kubevirt` asserted under the
    # auto-sync contract when both are declared manual-sync. The job caught it on
    # the first run. It went unseen for four and a half days because every surface
    # that aggregates runs said green. A check that ran and failed looked exactly
    # like a check that passed.
    #
    # WHAT THIS DOES AND DOES NOT CHANGE. It makes the RUN conclusion honest. It
    # does not block merges: `gate (required)` is the only required status check on
    # this repository and this job is not in its floor. Making it required is a
    # policy call for the maintainer, not a cleanup, and is deliberately not done
    # here. The summary step below is the other half -- the reason, without the
    # 11,000-line log.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      - name: Run live kind included ArgoCD health proof
        id: proof
        env:
          ZETA_ARGOCD_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          ZETA_ARGOCD_GIT_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/Lucent-Financial-Group/Zeta' }}
        run: |
          # `pipefail` so the HARNESS's exit code -- not tee's -- is the job verdict.
          # Without it the tee would swallow every failure and re-create, in a subtler
          # place, exactly the misreport that removing `continue-on-error` just closed.
          set -o pipefail
          bun src/Core.TypeScript/cluster/argocd-health-test.ts \
            --run \
            --provider kind \
            --scope included \
            --runtime docker \
            --config full-ai-cluster/dev-cluster/profiles/ci.kind-config.yaml \
            --cluster-name zeta-ci-included \
            --git-ref "$ZETA_ARGOCD_GIT_REF" \
            --timeout-sec 2400 \
            --poll-sec 15 \
            | tee "$RUNNER_TEMP/included-proof.log"

      # The other half of making the failure loud. Runs even when the proof failed --
      # that is the case worth reporting -- and the timeout case, where the harness
      # printed no verdict at all, renders as UNREADABLE rather than as either green
      # or a specific failure.
      #
      # Gated on the proof step having actually RUN. If an earlier step failed, the
      # proof is `skipped`, there is no capture file, and summarising anyway would
      # raise "produced no verdict" over what is really a toolchain failure -- an
      # annotation pointing at the wrong thing, which is its own species of the
      # misreport this change exists to remove.
      - name: Summarise the included proof
        if: always() && steps.proof.conclusion != 'skipped'
        # One line because audit-workflow-cli-flags.ts reads only the rest of the line
        # after `bun <script>`, so a continuation-line flag is invisible to it. Honest
        # limit: that audit skips this tool anyway (it only judges parsers that REJECT
        # unknown flags, and this one does not), so the shape buys coverage only if the
        # parser is ever closed. It costs nothing meanwhile.
        run: bun src/Core.TypeScript/cluster/included-proof-summary.ts --log "$RUNNER_TEMP/included-proof.log"

      - name: Print cluster diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n argocd get applications.argoproj.io -o wide || true
          kubectl get pods -A -o wide || true
          kubectl -n arc-systems describe pods -l app.kubernetes.io/name=gha-rs-controller || true
          kubectl -n arc-systems logs -l app.kubernetes.io/name=gha-rs-controller --all-containers=true --prefix=true --tail=200 || true
          kubectl -n arc-systems logs -l app.kubernetes.io/name=gha-rs-controller --all-containers=true --prefix=true --previous=true --tail=200 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -200 || true

      - name: Tear down kind cluster
        if: always()
        run: bun src/Core.TypeScript/cluster/dev-cluster/kind-down.ts --cluster-name zeta-ci-included

  # ---------------------------------------------------------------------------
  # DO THE VENDORED cdi/kubevirt BYTES ACTUALLY DEPLOY?
  #
  # `cdi` and `kubevirt` are the only two Applications in the catalogue whose
  # MANIFESTS no check has ever executed. They are declared manual-sync, so the
  # `included` lane asserts them under the weaker contract in
  # manual-sync-policy.ts -- exists, ArgoCD completed a comparison, health not
  # Degraded -- and that module states its own limit out loud: it "can no longer
  # catch anything that only appears once the manifests are APPLIED". Nothing
  # applied them. `OutOfSync`/`Missing` with `ok: true` is honest for a lane that
  # never syncs them, and it is also the shape of a check that did not run.
  #
  # This job runs them. It does NOT weaken the manual-sync declaration: that
  # reason is a PRODUCTION constraint about node-5b2dfa and its three live
  # Windows guests, and an ephemeral kind cluster has no guests to disturb.
  #
  # /dev/kvm is not assumed. GitHub's own hosted-runner docs: "While nested
  # virtualization is technically possible while using runners, it is not
  # officially supported." KubeVirt does not need it -- software-emulation.md:
  # "If `useEmulation` is enabled, `qemu` will be used for software emulation, in
  # case that hardware emulation via `/dev/kvm` is unavailable." The recipe here
  # is upstream's own: kubevirt/kubevirt.core's .github/workflows/integration.yml
  # runs on `ubuntu-latest` + helm/kind-action and its hack/e2e-setup.sh applies
  # exactly this merge patch when nested virt is off, then waits
  # `--for=condition=Available kubevirt kubevirt`.
  #
  # NOT continue-on-error, and deliberately so -- an advisory job here would
  # re-create in a new place the exact misreport this job exists to remove. It is
  # also not in the `gate (required)` floor, so it reports without blocking;
  # promoting it is a maintainer policy call, not a cleanup.
  # ---------------------------------------------------------------------------
  live-kind-virt:
    name: live kind kubevirt+cdi emulation proof
    needs: dry-run
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      # RECORD what the runner actually had, rather than asserting it. If a
      # runner image ever does ship /dev/kvm, KubeVirt uses hardware emulation
      # regardless of useEmulation ("Hardware emulation is always attempted
      # first" -- software-emulation.md) and the proof still holds; this line is
      # how a reader of the log knows which path was taken.
      - name: Record virtualization availability on this runner
        run: |
          echo "kvm device: $(test -e /dev/kvm && echo present || echo ABSENT)"
          cat /sys/module/kvm_*/parameters/nested 2>/dev/null || echo "nested: unknown"

      - name: Run kubevirt+cdi emulation proof on kind
        run: |
          set -o pipefail
          bun src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.ts \
            --run \
            --cluster-name zeta-ci-virt \
            --config full-ai-cluster/dev-cluster/profiles/ci.kind-config.yaml \
            --timeout-sec 900

      - name: Print virt diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide || true
          kubectl get cdi cdi -o wide || true
          kubectl -n cdi get pods -o wide || true
          kubectl -n kubevirt get kubevirt kubevirt -o yaml || true
          kubectl -n kubevirt get pods -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -200 || true

      - name: Tear down kind cluster
        if: always()
        run: bun src/Core.TypeScript/cluster/dev-cluster/kind-down.ts --cluster-name zeta-ci-virt
