      - "bun.lock"
  # ONE-SHOT EXPERIMENT SWITCH, not a standing lane.
  #
  # `live-kind-cilium-included` answers exactly one question and should be switched
  # off again once it has: do the four Applications that never reach Healthy on k3d
  # (vault, openziti-controller, trust-manager, spire) fail because of CILIUM or
  # because of K3S? It is dispatch-gated rather than wired into the PR/cron path
  # because its expected FIRST result is red, and an assertion that is red on every
  # run is a signal nobody reads -- the same defect just repaired in `drift-loud`,
  # which could not tell "off by decision" from "silently broken". Wiring a
  # known-red assertion into a standing lane would rebuild that defect on purpose.
  workflow_dispatch:
    inputs:
      cilium_included_probe:
        description: >-
          Run the kind+Cilium included Synced+Healthy proof. Fills the missing cell of
          the 2x2 (kindnetd+kind=green, Cilium+k3s=4 unhealthy, Cilium+kind=never
          asserted) so the CNI is separated from the orchestrator on ONE variable.
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# `packages: read` is KEPT but is NO LONGER LOAD-BEARING for the `platform`
# Application's two images. It stays because it is additive, least-privilege (no
# write scope of any kind), and the next image added here may well be private.
#
# MEASURED 2026-09-07, and this REPLACES the 2026-08-22 reasoning below it. All
# four Lucent-Financial-Group container packages -- `zeta-ci-runtime`,
# `zeta-orleans-silo`, `zeta-platform-controller`, `zeta-portal` -- are PUBLIC.
# Verified by EXERCISE rather than by API report: an anonymous ghcr.io pull token
# (no credential of any kind) returns HTTP 200 on `tags/list` for
# `zeta-platform-controller` and `zeta-portal`. No `GITHUB_TOKEN`, no package
# grant, and no `ZETA_GHCR_PULL_TOKEN` is required to pull them.
#
# WHAT THIS PARAGRAPH USED TO SAY, kept rather than deleted because the shape of
# the error is the lesson: "MEASURED 2026-08-22 ... both packages are private AND
# both report `repository.full_name = Lucent-Financial-Group/Zeta` ... So this is
# a well-founded expectation. It is still not a pull ... The first run with
# `platform` un-deferred is what measures it; if the token is refused, the exit is
# a package-level grant or a PAT in `ZETA_GHCR_PULL_TOKEN`."
#
# That reasoning was careful, correctly hedged, and became FALSE when the packages
# were made public -- and nothing re-measured it. `lane-partition.ts` had already
# caught exactly this ("`zeta-portal` and `zeta-platform-controller` had been made
# public, the anonymous read prices them, and nothing had re-measured"), so the
# repo held both the correction and the stale claim at once, in two files, for
# over two weeks. A RESOLVED BLOCKER STILL BEING REPORTED is the same defect class
# as a check that did not run looking like one that passed: it costs real work,
# because the standing plan was to mint a PAT for a wall that is not there.
#
# So the GHCR half of `platform`'s deferral is CLOSED. Whatever still defers
# `platform` is not a credential, and any future claim here should be re-exercised
# rather than re-read.
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    name: plan + unit tests
    # k8s lane NEEDS .mise.full.toml (k3d/kubectl/helm) at install AND run time — job-level
    # env, never step-level (the shim resolve needs MISE_ENV=full; workitem 081KTWQZY7F).
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json', '!tools/setup/persona-keys/**', '!tools/setup/op-token-setup.*', '!tools/setup/secret-clip.sh', '!tools/setup/manus-smoke-test.ts', '!tools/setup/build-lumen-persona-package.ts') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      # `included-proof-summary.test.ts` is named explicitly. No job anywhere in CI
      # runs `src/Core.TypeScript/cluster/` as a directory -- every test under it is
      # reached by being listed by name, here or in a sibling step. So a falsifier
      # that is not named is a falsifier that never runs.
      - name: Run 081KSXN940008QG0R000SCP2H1 harness unit tests
        # `use-cases.test.ts` added 2026-08-21, and by this step's own rule: a
        # falsifier that is not NAMED is a falsifier that never runs here. It
        # carries the wiring proofs for what the bring-up puts INTO the cluster
        # this lane then asserts against -- the alias StorageClasses and the
        # Grafana admin Secret kube-prometheus-stack requires to pre-exist. It
        # does run in `gate`'s whole-suite job; running it beside the harness it
        # is about means a broken bring-up reddens the lane that deploys it,
        # rather than a lane one repository over.
        run: |
          bun test \
            src/Core.TypeScript/cluster/argocd-health-test.test.ts \
            src/Core.TypeScript/cluster/included-proof-summary.test.ts \
            src/Core.TypeScript/cluster/dev-cluster/use-cases.test.ts \
            src/Core.TypeScript/cluster/provider-conditional-lift.test.ts \
            src/Core.TypeScript/cluster/applied-vs-asserted-agreement.test.ts \
            src/Core.TypeScript/cluster/cilium-k3d-values.test.ts

      # WHICH Application MANIFESTS DOES A ROOT ACTUALLY REACH, AND WHICH OF
      # THOSE DOES ANY CHECK ASSERT ON. Offline, pure, ~1s -- so it lives in
      # this job beside the other harness unit tests rather than paying a fresh
      # runner.
      #
      # It exists because a manifest can be applied by the app-of-apps root and
      # be invisible to every roster CI asserts on, which is the strongest form
      # of "a check that did not run looks like a check that passed".
      # `game-hosting/gmod/Application.yaml` is live in that gap right now: the
      # root DOES apply it (ArgoCD's `*` is not path-segment bounded), it fails
      # its sync on every reconcile against gatekeeper's check-ignore-label
      # webhook, and the `--scope included` job stays green because
      # discoverExpectedApplications() is depth-1 and never sees it.
      #
      # NOT continue-on-error. It is green on the tree it ships with (46
      # manifests, 1 registered gap, 0 drift) and goes red on drift in three
      # directions -- measured, each by mutating the live tree: a second nested
      # Application (exit 1, UNASSERTED), the registry entry removed (exit 1,
      # UNASSERTED), an Application no root glob matches (exit 1,
      # NEVER-DISCOVERED). Making the glob path-segment bounded also turns it
      # red, which is the point: the semantics is the load-bearing claim.
      # THE FALSIFIERS FOR THE EPHEMERAL VAULT CEREMONY, and they get their own
      # step because this job runs EXPLICITLY NAMED test files -- there is no
      # repo-wide `bun test src/Core.TypeScript/cluster/` anywhere in
      # .github/workflows/. A new test file here is therefore orphaned by
      # default: green, passing locally, and never once executed by CI. That is
      # the purest form of "a check that did not run looks like a check that
      # passed", and it is why this step exists rather than the file being left
      # to be picked up by something.
      #
      # What it pins, offline and in ~1.5s: the gate refuses `--existing` (the
      # metal case wearing the harness's clothes) and three other conditions,
      # each with its own reachable refusal; the ceremony follows
      # vault/TOPOLOGY.md section 5's order; the unseal share travels on stdin
      # and never argv; no share or root token reaches the report, the log, or a
      # failure detail -- including the init failure path, where stdout would
      # still be material; and the leak scan both FIRES on planted material and
      # reports a zero-byte scan as VACUOUS rather than clean.
      #
      # Mutation-checked, every mutation proven applied by byte-level `cmp`
      # against a saved pristine copy before its result was read: gate stops
      # refusing --existing, scan never matches, vacuity flag never fires, unseal
      # threshold 3 -> 2, redact replaces first occurrence only, failing init
      # echoes its stdout, root token never revoked, revoke sent without a token,
      # token passed in argv. 9/9 go red.
      - name: Run ephemeral Vault init falsifiers
        run: bun test src/Core.TypeScript/cluster/ephemeral-vault-init.test.ts

      - name: Run app-of-apps discovery unit tests
        run: bun test src/Core.TypeScript/cluster/app-of-apps-discovery.test.ts

      # DOES EVERY NAMESPACE THAT CLAIMS A GATEKEEPER EXEMPTION ACTUALLY HAVE ONE?
      #
      # Gatekeeper ships its own validating webhook, `check-ignore-label`, which
      # refuses the label `admission.gatekeeper.sh/ignore` on any namespace outside
      # the controller's exempt set. It is not one of our ConstraintTemplates and no
      # Constraint can switch it off -- it guards the exemption mechanism itself, so
      # a workload cannot exempt itself from policy by labelling its own namespace.
      #
      # Three namespaces in this tree carried that label and only one was exempt.
      # MEASURED on run 33790413535 (main, 2026-09-03), the other two were denied on
      # every sync attempt:
      #
      #   application/agent-memory  ... the namespace failed to apply, reason:
      #     admission webhook "check-ignore-label.gatekeeper.sh" denied the request:
      #     Only exempt namespace can have the admission.gatekeeper.sh/ignore label
      #     (retried 5 times).
      #   application/gmod          ... identical ...
      #
      # The Namespace never applies, so the Application never syncs, so it reads
      # OutOfSync/Missing forever -- and `agent-memory is OutOfSync/Missing` is one
      # of the two findings that failed the included proof below.
      #
      # WHY IT SURVIVED: the correspondence was asserted in a YAML COMMENT
      # ("matches open-policy-agent exemptions") and never read from the other side.
      # It was false when it was written. This step is that comment made mechanical,
      # and it reproduces the whole failure offline in about a second.
      #
      # It is a SEPARATE step from the test file below on purpose: the audit reads
      # the live tree and is what goes red when someone adds a labelled namespace;
      # the tests pin the refusals that keep the audit from being vacuous -- an
      # unreadable exempt list reported rather than defaulted in either direction, an
      # empty list distinguished from an unreadable one, and a zero-namespace walk
      # treated as an alarm rather than a pass.
      - name: Audit gatekeeper ignore-label exemptions
        run: bun src/Core.TypeScript/cluster/gatekeeper-ignore-label.ts

      - name: Run gatekeeper ignore-label falsifiers
        run: bun test src/Core.TypeScript/cluster/gatekeeper-ignore-label.test.ts
      # THE RESOURCE-RUNG OVERRIDE POINT, verified offline.
      #
      # `argocd-health-test.ts` already names the blocker this addresses: "One
      # committed tree, two substrates, no override point." `--resource-profile dev
      # --apply` rewrites the WORKING tree while ArgoCD syncs the COMMITTED tree at
      # `--git-ref`, so the dev rung has never been able to reach this lane, and the
      # lane applies `metal` -- 6390m of requests to a 4000m node. MEASURED on run
      # 33790413535: mimir-kafka-0 and three hindsight pods Pending on
      # `Insufficient cpu`, mimir Degraded, the included proof red.
      #
      # `lane-tree-source.ts` builds the tree the lane should sync: a staged copy of
      # `full-ai-cluster/k8s` with the rung applied through the SAME
      # `applyResourceProfile` the `--verify` path checks, self-referencing repoURLs
      # pointed at an in-cluster server, committed to a bare repository and packed
      # into a ConfigMap. Nothing is pushed and nothing leaves the runner, which is
      # what keeps it off the repository-growth budget and makes it work for a fork.
      #
      # THIS STEP IS THE VERIFICATION, and it is genuinely end-to-end despite being
      # offline: the test CLONES the bare repository it just built and reads
      # mimir's kafka request out of the clone, asserting 25m (dev) rather than
      # 1000m (metal, the value that could not be scheduled). Mutation-checked
      # 2026-09-03 -- applying the rung AFTER the commit, a plausible ordering bug,
      # turns exactly that assertion red.
      #
      # The measurement it prints is worth reading on every run: the packed tree is
      # 419,840 bytes against a 716,800-byte budget (58.6%). The refusal above that
      # budget is deliberate -- the day this tree outgrows ConfigMap delivery should
      # arrive as a named message here, not as an etcd rejection inside a live lane.
      - name: Run lane-tree source falsifiers (the resource-rung override point)
        run: bun test src/Core.TypeScript/cluster/lane-tree-source.test.ts

      # SYNC-WAVE DERIVATION. The App-of-Apps bring-up order is DERIVED from
      # full-ai-cluster/k8s/sync-wave-dependency-graph.yaml by ace's own engine
      # (resolveGraph in src/Core.TypeScript/ace/deps.ts) and compared against
      # the hand-written argocd.argoproj.io/sync-wave annotations.
      #
      # This exists because SYNC-WAVES.md was hand-maintained and named 34
      # components while 46 Applications shipped -- twelve were in no graph at
      # all, and nothing could see it. An Application missing from the
      # declaration is now a FINDING, not a gap.
      #
      # NOT continue-on-error. Green on the tree it ships with (46 declared, 0
      # undeclared, 0 uncited edges, 8 order disagreements all registered with a
      # reason and PRINTED on every run). Mutation-checked, each mutation
      # verified applied by byte `cmp` against a pristine copy before its result
      # was read: undeclared forced empty (caught), the order comparison
      # loosened from >= to > (caught, 4 tests), uncited edges accepted
      # (caught, 2 tests), the CNI floor loosened from <= to < (caught), and a
      # node deleted from the declaration -- the twelve-missing-apps defect
      # itself -- (caught, 4 tests).
      #
      # It does NOT renumber. Wave order sequences bring-up on a real cluster; a
      # wrong reorder is a broken bootstrap, so disagreements are reported for a
      # human to adjudicate.
      - name: Run sync-wave derivation unit tests
        run: bun test src/Core.TypeScript/cluster/derive-sync-waves.test.ts

      - name: Print the ace-derived sync-wave order and every disagreement
        run: bun src/Core.TypeScript/cluster/derive-sync-waves.ts

      # The virt proof's OFFLINE half. It builds its plan from the live
      # cdi/kubevirt Application manifests -- the include glob, the
      # operator-before-CR order, the useEmulation patch landing AFTER the
      # verbatim CR -- so a manifest edit that would make the live lane apply
      # the wrong bytes fails here in ~1s instead of 20 minutes later.
      #
      # Mutation-checked, each mutation verified applied by byte `cmp` against a
      # pristine copy before its result was read: useEmulation flipped to false,
      # the patch moved before the CR apply, the CDI wait swapped to the
      # operator Deployment's condition, the wildcard refusal removed, a
      # spurious emulation patch added to the CDI phase. All five go red.
      - name: Run kubevirt/cdi emulation proof unit tests
        run: bun test src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.test.ts

      - name: Build kubevirt/cdi emulation proof plan (offline)
        run: bun src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.ts --dry-run

      # THE VENDORED-BYTES CLAIM, CHECKED. `cdi/cdi-operator.yaml` and
      # `kubevirt/kubevirt-operator.yaml` are the ONLY two upstream copies in the
      # tree -- every other Application references a pinned upstream chart and
      # overrides it with a valuesObject. Both file headers say the copies are
      # byte-for-byte upstream, and `single-node-budget.json` REFUSES an edit on
      # the strength of that sentence ("would make the checked-in copy diverge
      # from the cluster it documents"). Until now the sentence was asserted and
      # nothing re-measured it, which is the same shape as a rung whose
      # provenance is a one-time manual render.
      #
      # Offline here: sha256 the committed bytes against the pinned upstream
      # digest, and require every file the Application's own `directory.include`
      # glob applies to be classified as upstream's or ours. `--fetch` (not run
      # in this job) re-checks what the pinned URL serves today, which is the
      # release-asset-replaced-in-place case.
      #
      # Mutation-checked in the unit tests, each class reached by mutating a
      # scratch tree rather than by constructing a Finding: one byte changed in
      # the copy, a `cpu: 25m` added to it, the copy deleted, the roster URL
      # moved to a branch, a third file added to the glob, a rostered file
      # dropped from the glob, upstream serving different bytes, and a fetch
      # that fails. All eight go red; a file the glob EXCLUDES stays green.
      - name: Run vendored-upstream parity unit tests
        run: bun test src/Core.TypeScript/cluster/vendored-upstream-parity.test.ts

      - name: Check the vendored operator manifests against their pinned upstream digests (offline)
        run: bun src/Core.TypeScript/cluster/vendored-upstream-parity.ts

      # THE CILIUM LANE'S OFFLINE HALF. Pure, ~1s, so it rides in this job
      # rather than paying a fresh runner -- same reasoning as the single-node
      # readiness steps below.
      #
      # NOT continue-on-error. It is green on the tree it ships with and was
      # measured red in six directions by mutating the live tree: nodeCount
      # 1 -> 3 in single-node-budget.json (the kind and metal encryption
      # verdicts diverge), a new value on one Cilium surface only (UNEXPLAINED
      # drift), making the surfaces agree on a registered delta (STALE), adding
      # the TLSRoute CRD to the vendored bundle (STALE gap), emptying the nix
      # roster (refusal, not a silent empty set), and adding a worker to the
      # kind profile (REFUSED -- the lane would prove more than metal runs).
      - name: Run Cilium kind-lane unit tests
        run: bun test src/Core.TypeScript/cluster/cilium-kind-lane.test.ts

      - name: Audit the Cilium value surfaces, CRD coverage and encryption reachability
        run: bun src/Core.TypeScript/cluster/cilium-kind-lane.ts --plan

      - name: Audit app-of-apps root reach against the asserted roster
        run: bun src/Core.TypeScript/cluster/app-of-apps-discovery.ts

      # Single-node readiness (081M02QMJPA087G0R000J9M39E). Lives in THIS job
      # rather than a job of its own: the toolchain and bun deps are already
      # installed here, so the marginal cost is the ~2s the two commands take.
      # A separate job would pay a fresh runner + cache restore + install.sh
      # (~3 min) to run a 2-second offline check.
      #
      # NOT `continue-on-error`. It is green on main today against the
      # checked-in ledger; it fails on DRIFT away from that ledger. Proof it
      # can go red: single-node-readiness.test.ts pairs every green case with
      # the red case, and four deliberate manifest breaks were run against the
      # live tree (over-budget PVC, unacknowledged replicas>1, tab-indented
      # YAML, a third app-of-apps root) -- all exit 1.
      #
      # 2026-08-22: three more comparators run, and they are the CPU/memory
      # half of the same discipline. `compute-provenance` compares the ACTIVE
      # resource rung's total over the metal cohort against `hardware.cores` /
      # `hardware.memory` on the smallest registered node and REFUSES when no
      # registration carries both -- until it existed, `metal` was the one rung
      # in the ladder validated against no machine at all, while the only
      # number it was ever compared to was a 4000m runner ~4x smaller than the
      # 16- and 22-CPU boxes actually registered. `resource-profile` checks the
      # tree carries the rung the ledger names. `rung-coverage` compares the
      # rung CI budgets against the rung the tree carries; see the budget step
      # below for why that comparison could not live in the budget step.
      #
      # 2026-08-21: a fifth comparator now runs, `capacity-provenance`. It
      # compares the same declared totals against MEASURED hardware from
      # maintainers/*/cluster-nodes/*/node.yaml (hence that path in the filters
      # above) and REFUSES when nothing measurable is registered -- because the
      # other comparator, ledger.nodeDiskGib, is an unsigned aspiration by the
      # ledger's own admission. Verified red on the live tree: exit 1 with
      # "longhorn declares 1409 GiB ... exceeds EVERY block device on
      # node-ad1efd (1047 GiB)" before that shortfall was recorded as debt.
      - name: Run single-node readiness unit tests
        run: bun test src/Core.TypeScript/cluster/single-node-readiness.test.ts

      # The storage-profile ladder's own falsifiers. Run SEPARATELY rather than
      # folded into the audit step: the audit checks the tree against the ACTIVE
      # rung, which says nothing about whether the validator that guards the
      # catalogue can still go red. A ladder whose refusals never execute in CI
      # is a check that did not run wearing the face of one that passed.
      - name: Run storage size profile unit tests
        run: bun test src/Core.TypeScript/cluster/storage-profiles.test.ts

      # DOES THE DECLARED CLAIM CORRESPOND TO A PVC THE CHART RENDERS?
      #
      # Everything above this line reads OUR YAML on both sides: the catalogue
      # records what we wrote into a valuesObject and the extractor reads the
      # same scalar back. Neither asks the chart whether the value reaches a
      # PersistentVolumeClaim. Two apps measurably show that it does not --
      # hindsight's `postgresql.primary.*` and nats's top-level `cluster:` are
      # both inert against their pinned charts -- and nothing detected either.
      #
      # OFFLINE, against the checked-in snapshot of what `helm template`
      # produced. Not the live render: that needs the network, an upstream
      # still serving five-month-old pinned tags, and two minutes, which is
      # three ways for a gate to be unavailable -- and an unavailable gate is
      # skipped, and a skipped gate reads like a passing one. The snapshot is
      # text, so every byte of a re-measurement is a readable diff.
      #
      # Red in five measured directions: a declared size the chart does not
      # render, a declared storageClass it does not render, a rendered PVC no
      # row covers, a pod count that disagrees with the render, and an app that
      # could not be rendered without an acknowledgement. All five were run as
      # mutations against this checker; all five exit 1.
      - name: Run rendered-storage-claims unit tests
        run: bun test src/Core.TypeScript/cluster/rendered-storage-claims.test.ts

      - name: Audit declared storage claims against the measured render
        run: bun src/Core.TypeScript/cluster/rendered-storage-claims.ts --offline

      # DOES EVERY `valuesObject` KEY EXIST IN THE CHART? -- the general form of
      # the defect the step above catches only by accident.
      #
      # `rendered-storage-claims` compares a declared PVC against a rendered
      # one, so it catches an inert key only when that key happens to govern
      # STORAGE. Three of the four measured instances did (hindsight, nats, oz);
      # the fourth governed whether the process could start -- headscale's
      # entire top-level `config:` block against a chart with no `config` key,
      # zero occurrences of `server_url` in the render, CrashLoopBackOff with 12
      # restarts -- and nothing in this repo would have caught it.
      #
      # This checker compares every Application's `valuesObject` key set against
      # its pinned chart's schema: the chart's values.yaml, its SUBCHARTS'
      # values (resolved from Chart.yaml, aliases included), every literal
      # `.Values.a.b.c` its templates name, and the nodes it consumes wholesale.
      # It goes red on all four instances as they stood before their fixes,
      # reconstructed from git history in
      # `testdata/inert-valuesobject-history/`, plus two more found
      # independently in #13524.
      #
      # OFFLINE, against a checked-in schema snapshot, for the same reason as
      # the step above: a gate that needs the network is a gate that can be
      # unavailable, and an unavailable gate reads like a passing one.
      #
      # UNDECIDABLE COUNTS AS A FINDING. A chart that reaches `.Values` by a
      # computed subscript, a chart that cannot be fetched, and an Application
      # the snapshot does not cover all exit 1 -- an app nobody checked must
      # never read as an app that passed.
      - name: Run inert-valuesobject-keys falsifiers (the four measured instances)
        run: bun test src/Core.TypeScript/cluster/inert-valuesobject-keys.test.ts

      - name: Audit every valuesObject key against its pinned chart's schema
        run: bun src/Core.TypeScript/cluster/inert-valuesobject-keys.ts --offline

      # IS THE REASON TRUE? -- the falsifiers for `reason-truth.ts`.
      #
      # The registries above record WHY each Application is deferred, and until
      # 2026-08-22 every audit over them checked that a reason was PRESENT and
      # named a lift condition. None checked that it was TRUE, and two reasons
      # were measured false within a day of being written while every audit
      # stayed green (`temporal` #13472->#13483, `oz` #13313->#13471).
      #
      # This file reconstructs both AS THEY STOOD and runs the checker against
      # today's tree: it goes red on both, and stays green on the clauses of the
      # same reasons that are still true -- which is the difference between
      # checking truth and measuring age. Named explicitly, like every other
      # test in this job, because nothing here runs the directory.
      - name: Run reason-truth falsifiers (the two historical false reasons)
        run: bun test src/Core.TypeScript/cluster/reason-truth.test.ts

      - name: Audit single-node readiness against the checked-in budget ledger
        run: bun src/Core.TypeScript/cluster/single-node-readiness.ts

      # THE RUNNER'S OWN CPU/MEMORY BUDGET (Aaron 2026-08-20: "make things small
      # enough to fit for disk and ram on the runners"). Offline, ~1s, so it
      # lives in this job beside the other catalogue checks.
      #
      # `--measure-runner` first, and it is the load-bearing half: the envelope
      # in storage-profiles.json records GitHub's PUBLISHED spec for a hosted
      # ubuntu-24.04 standard runner (4 vCPU / 16 GB), which is a vendor claim
      # and not a measurement. This step reads /proc on the actual runner and
      # exits 1 when the real machine is smaller than the record. Without it
      # every "it fits" the budget prints is arithmetic against a machine
      # nobody checked. It REFUSES rather than passes where /proc is absent,
      # so it cannot go quietly green on a non-Linux host either.
      #
      # Then the budget itself, against the `dev` rung. The four numbers it was
      # green on -- 1906m / 6207Mi lane, 4231m / 11427Mi at metal -- were all
      # understated by exactly 1000m / 2048Mi until 2026-08-22, and nothing grew:
      # `applicationDirs()` enumerated depth 1 while ArgoCD's include glob is not
      # path-segment bounded, so `game-hosting/gmod` had always been applied and
      # never counted. The lane is 2906m at `dev` and 5231m at `metal` now, and
      # `dev` is 406m OVER rather than 594m under. The shortfall is carried in the
      # catalogue's `acknowledgedLaneBudgetShortfall`, pinned to its arithmetic, with
      # the reason and the lift condition beside it -- the budget is not widened.
      #
      # AND THE HONEST LIMIT ON THIS STEP, because a green gate that is silent
      # about its own scope is how the vacuity class gets in. It budgets `dev`.
      # The COMMITTED tree is `metal`: `--resource-profile metal --check` exits
      # 0 and `--resource-profile dev --check` exits 1 with 54 drifts
      # (MEASURED 2026-08-22). So this step passing is not evidence that the
      # lane can schedule what it applies -- it is arithmetic about a rung
      # nobody has applied to the manifests, and `hindsight-postgresql-0`
      # taking `Insufficient cpu` on run 32519516070 is what that gap looks
      # like from the cluster's side.
      #
      # WHAT COMPARES THE TWO is `findRungCoverage`, in the readiness auditor
      # step above -- not this step, which cannot see past its own rung. It
      # reads the budgeted rung off THIS run line (`ciBudgetedProfile` parses
      # `--resource-profile <rung> --budget` out of this file, so a constant
      # here could not drift from the command), reads the committed rung off
      # `ledger.activeResourceProfile`, and blocks on a disagreement unless the
      # gap is carried in `acknowledgedRungBudgetGap` with all four numbers
      # pinned. It is carried today. Changing the rung on the line below
      # therefore changes what the coverage check compares, which is the point:
      # this step and that check can no longer be green about different trees.
      #
      # AND THE NUMBER IN THAT ACKNOWLEDGEMENT MOVED ON THIS BRANCH, which is the
      # coverage check working rather than failing: `applicationDirs()` was
      # depth-1 and ArgoCD's include glob is not path-segment bounded, so
      # `game-hosting/gmod` (1000m / 2Gi, a literal in its own statefulset.yaml)
      # had always been applied and never counted. `metal` on the lane is 5231m,
      # not 4231m, and the ledger's `acknowledgedRungBudgetGap` is re-keyed to
      # match. `dev` is 2906m, OVER the 2500m budget by 406m -- so the step below
      # is red on the arithmetic alone, and the shortfall is carried in the
      # catalogue's `acknowledgedLaneBudgetShortfall` with its reason and its lift
      # condition rather than by widening the budget.
      - name: Run runner-disk falsifiers
        run: bun test src/Core.TypeScript/cluster/runner-disk.test.ts

      - name: Run image-footprint falsifiers
        run: bun test src/Core.TypeScript/cluster/image-footprint.test.ts

      # Printed, not gated. Gating on "the images do not fit" would be a red
      # lane every run for a fact everyone already knows; what this buys is that
      # the ranking is READ on every run, so a measurement nobody looks at
      # cannot quietly go stale. The cohorts come from the live tree, so an
      # Application added or excluded moves this output without a re-measure.
      - name: Print the per-app image footprint (offline, from the measurement)
        run: bun src/Core.TypeScript/cluster/image-footprint.ts --report

      - name: Verify the runner is as big as the catalogue claims
        run: bun src/Core.TypeScript/cluster/storage-profiles.ts --measure-runner

      - name: Audit the dev resource rung against the runner budget
        run: bun src/Core.TypeScript/cluster/storage-profiles.ts --resource-profile dev --budget

      # DOES A DECLARED CPU/MEMORY RUNG CORRESPOND TO THE REQUESTS THE CHARTS
      # RENDER, AT BOTH RUNGS? -- the CPU/memory twin of
      # `rendered-storage-claims` above, and it exists for the same reason: the
      # ladder's numbers came from a ONE-TIME hand measurement
      # (`$comment_resources`: "MEASURED 2026-08-21 by `helm pull` ... followed
      # by `helm template`") that nothing in the repo re-ran.
      #
      # BOTH RUNGS, and that is not decorative. A rung is a set of values in each
      # Application's own valuesObject, so "render at rung X" means overlaying X
      # and templating the pinned chart. Rendering both makes inertness
      # OBSERVABLE: a row whose two rungs differ must move the render, and one
      # that does not is a key the chart never reads -- the CPU/memory form of
      # the defect `inert-valuesobject-keys` found four times in a day.
      #
      # It found three things on first run, all confirmed by hand: cilium's row
      # said 0m against a DaemonSet with a 100m init container (the scheduler
      # reserves max(sum(regular), max(init)), not the sum of regular
      # containers); gitlab's hand-summed 2475m was 50m short for the same
      # reason, with the memory column already exact to the mebibyte; and
      # `game-hosting/gmod` -- 1000m, applied by the dev root, asserted in
      # writing to contribute 0m -- was invisible to a depth-1 enumerator.
      #
      # OFFLINE, against a checked-in snapshot, same reason as its siblings. The
      # snapshot compares COVERAGE before rows: `rendered-storage-claims` once
      # printed "the snapshot matches the live render" against a tree that had
      # grown a whole Application, because the new app rendered no rows to
      # disagree about. Absence is not agreement.
      - name: Run rendered-resource-requests falsifiers
        run: bun test src/Core.TypeScript/cluster/rendered-resource-requests.test.ts

      - name: Audit the declared CPU/memory rungs against the measured render
        run: bun src/Core.TypeScript/cluster/rendered-resource-requests.ts

      - name: Build ArgoCD health dry-run plan
        env:
          ZETA_ARGOCD_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          ZETA_ARGOCD_GIT_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/Lucent-Financial-Group/Zeta' }}
        run: |
          bun src/Core.TypeScript/cluster/argocd-health-test.ts \
            --dry-run \
            --provider kind \
            --scope smoke \
            --runtime docker \
            --config full-ai-cluster/dev-cluster/profiles/ci.kind-config.yaml \
            --git-ref "$ZETA_ARGOCD_GIT_REF"

  live-kind:
    name: live kind ArgoCD health (${{ matrix.runner }})
    needs: dry-run
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    # k8s lane NEEDS .mise.full.toml (k3d/kubectl/helm) at install AND run time — job-level
    # env, never step-level (the shim resolve needs MISE_ENV=full; workitem 081KTWQZY7F).
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json', '!tools/setup/persona-keys/**', '!tools/setup/op-token-setup.*', '!tools/setup/secret-clip.sh', '!tools/setup/manus-smoke-test.ts', '!tools/setup/build-lumen-persona-package.ts') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      # WHAT DISK THIS RUNNER ACTUALLY HAS, measured rather than quoted.
      #
      # `storage-profiles.json`'s runnerEnvelope carried `freeDiskGib: 14` when
      # this step was written -- a vendor number nobody had measured.
      # `--measure-runner` reads /proc for CPU and memory and reads NO disk, so
      # the number the image-footprint argument divided by (~77 GB of images
      # against ~14 GB free) had never been read off a runner. This step reads
      # it, prints every mount, and measures the preinstalled toolchains a k8s
      # lane never invokes.
      #
      # THE BOUND IS 70 SINCE 2026-08-23, taken by the maintainer against these
      # very measurements (77.06 GiB x64 / 99.02 GiB arm). That makes this step
      # MORE load-bearing, not less: `--check-envelope` convicts a runner with
      # LESS free disk than the envelope declares, and at 14 it could only ever
      # have caught a machine no hosted runner resembles. At 70 it catches a
      # runner that cannot hold what the lanes were planned against -- so if
      # GitHub ever ships a smaller image, this is where it surfaces.
      #
      # ARMED as of run 32585090483, which is what the first (report-only) pass
      # bought. It measured 77.06 GiB available on `ubuntu-24.04` and 99.02 GiB
      # on `ubuntu-24.04-arm` -- one filesystem, no /mnt -- against a declared
      # 14. The catalogue's disk row now reads 70 GiB, a conservative floor
      # beneath both, so this step convicts on a materially smaller machine and
      # not on ordinary runner-image variation.
      - name: Measure the runner's disk and check it against the envelope
        run: bun src/Core.TypeScript/cluster/runner-disk.ts --check-envelope

      - name: Run live kind ArgoCD health check
        env:
          ZETA_ARGOCD_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          ZETA_ARGOCD_GIT_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/Lucent-Financial-Group/Zeta' }}
        run: |
          bun src/Core.TypeScript/cluster/argocd-health-test.ts \
            --run \
            --provider kind \
            --scope smoke \
            --runtime docker \
            --config full-ai-cluster/dev-cluster/profiles/ci.kind-config.yaml \
            --cluster-name zeta-ci \
            --git-ref "$ZETA_ARGOCD_GIT_REF" \
            --timeout-sec 1200 \
            --poll-sec 10

      # LOGS FROM THE CRASHED CONTAINER, NOT THE LIVE ONE.
      #
      # A CrashLoopBackOff pod's CURRENT container has usually not started, so
      # `kubectl logs` returns nothing and the reason the PREVIOUS one died is
      # thrown away on each restart. That gap is why headscale's diagnosis on
      # 2026-08-22 had to be REASONED from a local `helm template` -- "the render
      # contains zero occurrences of server_url" -- instead of read from the
      # error the process printed 12 times. The controller-specific
      # `--previous=true` a few lines below already existed; nothing did it for
      # an arbitrary pod.
      #
      # Scoped to pods that are not Running/Succeeded OR have a restart, so a
      # green run prints nothing. `|| true` throughout: a diagnostics step must
      # never be the thing that fails a job.
      - name: Logs from crash-looping pods, including the PREVIOUS container
        if: always()
        run: |
          kubectl get pods -A -o json 2>/dev/null \
            | jq -r '.items[]
                | select((.status.phase != "Running" and .status.phase != "Succeeded")
                         or ((.status.containerStatuses // []) | map(.restartCount // 0) | add // 0) > 0)
                | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r ns pod; do
                echo "=== $ns/$pod (waiting reasons + restart counts)"
                kubectl -n "$ns" get pod "$pod" -o jsonpath='{range .status.containerStatuses[*]}  {.name}: restarts={.restartCount} state={.state}{"\n"}{end}' || true
                echo "--- current container logs"
                kubectl -n "$ns" logs "$pod" --all-containers=true --prefix=true --tail=100 || true
                echo "--- PREVIOUS container logs (the ones that explain the crash)"
                kubectl -n "$ns" logs "$pod" --all-containers=true --prefix=true --previous=true --tail=100 || true
              done || true

      - name: Print cluster diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n argocd get applications.argoproj.io -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -200 || true

      - name: Tear down kind cluster
        if: always()
        run: bun src/Core.TypeScript/cluster/dev-cluster/kind-down.ts --cluster-name zeta-ci

  # THE SECOND PROVIDER. k3d/k3s, not kind.
  #
  # AARON 2026-08-31: "can we test with things other than kind so we can test more".
  #
  # WHAT WAS ALREADY HERE AND HAD NEVER RUN. `argocd-health-test.ts` has accepted
  # `--provider k3d` since it was written (`isProvider` returns true for it, and
  # `bootstrapK3dClusterInProcess` is a real code path with its own named failure
  # kind). `full-ai-cluster/dev-cluster/profiles/ci.k3d-config.yaml` has existed
  # since 2026-06-21. `dev-cluster/k3d-up.ts` brings up k3d -> Cilium -> ArgoCD ->
  # root app end to end and `k3d-down.ts` tears it down. Measured 2026-08-31:
  # ZERO occurrences of `--provider k3d`, `k3d-config` or `k3d cluster` across
  # every file in .github/workflows. A complete second substrate, built, pinned in
  # .mise.full.toml (k3d 5.8.3), and dispatched by nothing.
  #
  # WHY A SECOND PROVIDER BUYS COVERAGE AND NOT JUST A SECOND GREEN TICK. kind and
  # k3d disagree about the substrate in ways this repo's own exclusion reasons
  # already name:
  #   * CNI. kind CI takes kind's default CNI; this profile passes
  #     `--flannel-backend=none --disable-kube-proxy --disable-network-policy`, so
  #     the CNI slot is EMPTY and Cilium owns it. `cilium` and `cilium-lb-ipam` are
  #     excluded from the app-of-apps proof with the LIFTS WHEN "the app-of-apps
  #     included proof runs on that profile, so ArgoCD is reconciling a cluster
  #     whose CNI slot Cilium already owns." This job is that profile.
  #   * distribution. k3s is not upstream kubelet+kubeadm. Metal runs k3s
  #     (`services.k3s.manifests` is the bootstrap roster for both cluster trees),
  #     so the provider CI has never used is the one closest to the target.
  #   * `live-kind-cilium` is NOT this. It proves Cilium INSTALLS AND SERVES as a
  #     CNI on kind. It does not reconcile the `cilium` Application through ArgoCD,
  #     which is a different claim and the one the exclusion is about.
  #
  # SCOPE IS `smoke`. IT WAS LIFTED TO `included` ON 2026-08-31 AND REVERTED
  # ON 2026-09-01, BECAUSE THE LIFT WAS NOT SUPPORTED BY ITS OWN EVIDENCE.
  #
  # WHAT I DID WRONG. The lift's stated condition was "one green smoke run
  # exists". Two did. But `included` does not assert what smoke asserts -- it
  # asserts 33 Applications reaching Synced/Healthy on this substrate, and TWO
  # GREEN SMOKE RUNS ARE NOT EVIDENCE FOR THAT. The lift PR said its budget was
  # "matched to live-kind-included"; that was about the TIMEOUT, and I let a
  # sizing match read as a viability match.
  #
  # MEASURED, and this is the part worth keeping. k3d has NEVER passed at
  # `included`: it failed on the lift's own branch, then on main, then on every
  # run of the follow-up branch. The unhealthy Applications are the same each
  # time and NONE of them is cilium:
  #
  #     openziti-controller   Unknown   Degraded
  #     trust-manager         Synced    Degraded
  #     spire                 Synced    Progressing
  #     vault                 Unknown   Progressing
  #
  #     cilium                Unknown   HEALTHY      <- the provider-aware lift works
  #
  # So the provider-conditional cilium work is sound and is NOT what is red.
  # What is red is four Applications that do not reach Healthy on k3s+Cilium --
  # which is what METAL runs, so this is plausibly real signal about metal
  # rather than a k3d artifact. Filed as a finding rather than waved through.
  #
  # LIFTS WHEN: those four are understood -- fixed, or deferred with a named
  # reason like every other entry in APPLIED_BUT_UNASSERTED_REASONS. Not when
  # another smoke run goes green; that is the inference that produced this
  # revert.
  #
  # NOT continue-on-error, and it must not become one. It was considered and
  # refused for the reason the ratchet header already gives -- a check that cannot
  # fail permits anything and constrains nothing. If this goes red on the PR that
  # introduces it, that is the measurement, and the response is to fix it or to
  # withdraw the job, never to make it unable to speak.
  #
  # LOCAL VERIFICATION, AND ITS LIMIT (2026-08-31, stated rather than implied).
  # `k3d cluster create --config ci.k3d-config.yaml` was run on macOS/arm64 against
  # podman and reached "Starting node 'k3d-zeta-ci-server-0'" with exit 0 -- the
  # config parses and the profile is accepted by k3d 5.8.3. Kubeconfig extraction
  # then FAILED, because k3d copies the file out of the container and podman on
  # macOS does not serve that copy. That is a runtime+platform limitation and it is
  # NOT evidence about ubuntu-24.04 + docker, which is what this job runs. So the
  # local run proves the profile is well-formed and proves nothing about the lane.
  # This job's first CI run is the first real measurement.
  live-k3d:
    name: live k3d ArgoCD health (${{ matrix.runner }})
    needs: dry-run
    strategy:
      fail-fast: false
      matrix:
        # x64 only to start. arm is a second axis on an unmeasured lane; add it
        # once this one has a green run, so a failure names one variable.
        runner: [ubuntu-24.04]
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json', '!tools/setup/persona-keys/**', '!tools/setup/op-token-setup.*', '!tools/setup/secret-clip.sh', '!tools/setup/manus-smoke-test.ts', '!tools/setup/build-lumen-persona-package.ts') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      - name: Confirm k3d is on PATH before anything depends on it
        # Fail HERE with the tool's name rather than inside a bootstrap that
        # reports "k3d bootstrap failed" for a missing binary. k3d ships in
        # .mise.full.toml only, so a tier regression surfaces as this line.
        run: |
          set -euo pipefail
          command -v k3d
          k3d version

      - name: Measure the runner's disk and check it against the envelope
        run: bun src/Core.TypeScript/cluster/runner-disk.ts --check-envelope

      - name: Run live k3d ArgoCD health check
        env:
          ZETA_ARGOCD_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          ZETA_ARGOCD_GIT_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/Lucent-Financial-Group/Zeta' }}
        # CPU/MEMORY OVERLAY, same mechanism as live-kind-included. The committed
        # tree is `metal` (6390m on a 4000m GitHub node). `--serve-tree dev` is
        # 1165m / 9164Mi and fits the runner budget (2500m / 9216Mi). Metal stays
        # in git for USB/hardware. Disk is a different ladder: this job already
        # runs `--check-envelope` (70 GiB). PVC sizes stay at the metal storage
        # profile because CI `zeta-local-path` is thin and shrinking PVCs would
        # not be a USB rehearsal. Do not invent a fourth budget. Do not shrink
        # metal.
        run: |
          bun src/Core.TypeScript/cluster/argocd-health-test.ts \
            --run \
            --provider k3d \
            --scope smoke \
            --runtime docker \
            --config full-ai-cluster/dev-cluster/profiles/ci.k3d-config.yaml \
            --cluster-name zeta-ci \
            --git-ref "$ZETA_ARGOCD_GIT_REF" \
            --timeout-sec 1200 \
            --poll-sec 10 \
            --serve-tree dev

      - name: Which CNI actually owns the cluster (the reason this job exists)
        # The profile CLAIMS flannel and kube-proxy are off and Cilium owns the
        # slot. This prints what is actually there, so the claim is readable in
        # the log rather than inferred from the config. Diagnostic only: `|| true`
        # throughout, because a diagnostics step must never be the thing that
        # fails a job.
        if: always()
        run: |
          echo "--- pods in kube-system (expect cilium, expect NO flannel/kube-proxy) ---"
          kubectl -n kube-system get pods -o wide || true
          echo "--- nodes and their substrate labels ---"
          kubectl get nodes -o json 2>/dev/null \
            | jq -r '.items[] | "\(.metadata.name)\t\(.metadata.labels["zeta.io/substrate"] // "<unlabelled>")\t\(.status.nodeInfo.kubeletVersion)"' || true

      - name: Why ArgoCD could not COMPARE — the running-and-failing case
        # STDERR IS NOT SILENCED IN THIS STEP, deliberately. The first version
        # wrote `2>/dev/null` on every probe. On a run where ArgoCD never
        # installed at all, it printed four headers and nothing else --
        # indistinguishable from "ArgoCD is fine and had nothing to report". The
        # ONE probe whose stderr was not suppressed is what explained it:
        # `deployments.apps "argocd-repo-server" not found`.
        #
        # An empty diagnostic must never read as a clean one. `|| true` still
        # guards every line, so this step cannot fail the job; what it no longer
        # does is hide WHY it is empty.
        # ADDED after run 3, which this job could not diagnose from its own logs.
        #
        # THE GAP THIS CLOSES. The step below dumps pods that are crash-looping or
        # restarting. `argocd-repo-server` was neither: it was Running, and failing
        # only to FETCH AND RENDER, so it produced no restart, no waiting reason,
        # and nothing in this job's output. The verdict was `sync=Unknown` on
        # `zeta-root-dev` -- an ArgoCD ComparisonError -- with zero child
        # Applications, and the reason lived in a log nothing collected.
        #
        # `Unknown` is NOT inherently a failure here (this repo's lanes assert
        # several Applications at `sync=Unknown health=Healthy`, where Unknown is a
        # diff-time ComparisonError). What distinguishes THIS case is that the root
        # App-of-Apps produced no children at all, and `.status.conditions` is where
        # ArgoCD writes why.
        #
        # Diagnostic only: `|| true` throughout. A diagnostics step must never be
        # the thing that fails a job.
        if: always()
        run: |
          echo "--- zeta-root-dev .status (conditions carry the ComparisonError text) ---"
          kubectl -n argocd get application zeta-root-dev -o jsonpath='{.status.sync.status}{"\t"}{.status.health.status}{"\n"}' || true
          kubectl -n argocd get application zeta-root-dev -o jsonpath='{range .status.conditions[*]}{.type}: {.message}{"\n"}{end}' || true
          echo "--- repo-server (fetches + renders; Running while failing is its normal shape) ---"
          kubectl -n argocd logs deploy/argocd-repo-server --tail=120 --prefix=true || true
          echo "--- application-controller (drives comparison) ---"
          kubectl -n argocd logs statefulset/argocd-application-controller --tail=80 --prefix=true || true
          # DNS PROBE, WRITTEN FOR THE SHELL AND TOOLSET THAT ACTUALLY EXIST.
          #
          # The first version ran `nslookup` and bash's `/dev/tcp`. Neither is
          # present: the repo-server image has no nslookup, and its `sh` is dash,
          # so `/dev/tcp` is a nonexistent directory rather than a socket. Both
          # probes failed for TOOLING reasons and said nothing about the network
          # -- a probe that cannot run is not a negative result. `getent hosts`
          # is glibc and present; `wget`/`curl` are tried only if they exist.
          echo "--- can a pod resolve the git host? (getent = glibc, always present) ---"
          kubectl -n argocd exec deploy/argocd-repo-server -- sh -c '
            echo "resolv.conf:"; cat /etc/resolv.conf 2>&1 | sed "s/^/  /"
            echo "getent hosts github.com:"; getent hosts github.com 2>&1 | sed "s/^/  /" || echo "  FAILED rc=$?"
            echo "getent hosts kubernetes.default (in-cluster):"; getent hosts kubernetes.default 2>&1 | sed "s/^/  /" || echo "  FAILED rc=$?"
            echo "getent hosts zeta-lane-tree.zeta-lane-tree.svc.cluster.local:"; getent hosts zeta-lane-tree.zeta-lane-tree.svc.cluster.local 2>&1 | sed "s/^/  /" || echo "  FAILED rc=$?"
            echo "git ls-remote overlay tree.git:"; git ls-remote http://zeta-lane-tree.zeta-lane-tree.svc.cluster.local:8080/tree.git 2>&1 | sed "s/^/  /" || echo "  FAILED rc=$?"
          ' || true
          echo "--- what does CoreDNS forward upstream to? (the k3d/docker 127.0.0.11 question) ---"
          kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' || true

      - name: Logs from crash-looping pods, including the PREVIOUS container
        if: always()
        run: |
          kubectl get pods -A -o json 2>/dev/null \
            | jq -r '.items[]
                | select((.status.phase != "Running" and .status.phase != "Succeeded")
                         or ((.status.containerStatuses // []) | map(.restartCount // 0) | add // 0) > 0)
                | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r ns pod; do
                echo "=== $ns/$pod (waiting reasons + restart counts)"
                kubectl -n "$ns" logs "$pod" --all-containers=true --prefix=true --previous=true --tail=100 || true
              done || true

      - name: Gateway API CRDs and the four (k3s-vs-k3d dump, not a re-lift)
        # MEASURED run 33429761222: cert-manager CrashLoopBackOff
        # "the Gateway API CRDs do not seem to be present, but ExperimentalGatewayAPISupport is set to true".
        # Metal applies full-ai-cluster/k8s/bootstrap/gateway-api-crds.yaml first
        # (`aa-gateway-api-crds`). Kind --cni cilium applies the same file. k3d
        # bring-up used to skip it. This dump is diagnostic: smoke does not
        # assert the four, so NOT FOUND is honest. Do not re-lift --scope included.
        if: always()
        run: |
          echo "=== Gateway API CRDs (metal first-boot aa-gateway-api-crds) ==="
          kubectl get crd -o name 2>/dev/null | grep -E 'gateway\.networking' || echo "NONE"
          echo "=== cert-manager pods (CrashLoop here is the CRD-absent cascade) ==="
          kubectl -n cert-manager get pods -o wide || true
          echo "=== the four (NOT FOUND on smoke is honest) ==="
          for app in openziti-controller trust-manager spire vault; do
            line="$(kubectl -n argocd get application "$app" \
              -o jsonpath='=== {.metadata.name}: sync={.status.sync.status} health={.status.health.status}' \
              2>/dev/null || true)"
            if [ -z "$line" ] || [ "$line" = "=== : sync= health=" ]; then
              echo "  === $app: NOT FOUND IN CLUSTER"
            else
              echo "  $line"
            fi
          done
          echo "=== spire-agent (second k3s/k3d class: hostNetwork DNS i/o timeout; not Gateway API) ==="
          echo "--- DaemonSets + pods (chart 0.24.2 hardcodes hostNetwork + ClusterFirstWithHostNet) ---"
          kubectl -n spire get daemonset,pods -o wide || true
          kubectl -n spire get pods -o custom-columns=NAME:.metadata.name,HOSTNET:.spec.hostNetwork,DNSPOL:.spec.dnsPolicy,LABELS:.metadata.labels --no-headers || true
          echo "--- kube-dns ClusterIP (the 10.43.0.10 the agent dials) ---"
          kubectl -n kube-system get svc -l k8s-app=kube-dns -o wide || true
          kubectl -n kube-system get ep kube-dns -o wide || true
          echo "--- logs from DaemonSet/spire-agent ---"
          # Selector is app.kubernetes.io/name=agent (MEASURED 33751425785),
          # not app=spire-agent. DaemonSet name is still spire-agent.
          kubectl -n spire logs daemonset/spire-agent --tail=80 --prefix=true || true
          kubectl -n spire logs daemonset/spire-agent --previous --tail=80 --prefix=true || true
          echo "--- spire PVC + ConfigMaps (server writes bundle.crt at runtime) ---"
          # MEASURED 33751425785 job 100636645454: agent CrashLoop was
          # "could not parse trust bundle: open /run/spire/bundle/bundle.crt"
          # because spire-server-0 was Pending on rancher.io/local-path, not
          # the included-class DNS timeout. Do not collapse the two.
          kubectl -n spire get pvc,cm -o wide || true
          echo "--- spire-bundle keys (MEASURED 33754516236: DATA 0, no bundle.crt) ---"
          kubectl -n spire get cm spire-bundle -o jsonpath='data={.data}{"\n"}' || true
          echo "--- cilium-dbg service list (do not swallow exec failure) ---"
          DNS_IP="$(kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)"
          echo "kube-dns ClusterIP=${DNS_IP:-NONE}"
          if ! kubectl -n kube-system exec ds/cilium -c cilium-agent -- cilium-dbg service list; then
            echo "cilium-dbg service list FAILED (MEASURED 33754516236: container not found cilium-agent)"
            kubectl -n kube-system get ds,pods -l k8s-app=cilium -o wide || true
          fi
          echo "=== hostNetwork TCP ClusterIP + pod-IP probe (081M1DFQ2MZ distinguisher) ==="
          echo "MEASURED 33804533591: --disable=servicelb emptied app=svclb; hostNetwork ClusterIP still FAIL, pod IP OPEN."
          echo "Agent lookup spire-server.spire on 10.43.0.10:53 i/o timeout with bundle.crt present."
          echo "Klipper is not the translator. Do not invent Cilium values. Do not re-lift included."
          echo "--- klipper svclb (MEASURED 33804533591: No resources found) ---"
          kubectl get ds,pods -A -l app=svclb -o wide || true
          SPIRE_IP="$(kubectl -n spire get svc spire-server -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)"
          SPIRE_PORT="$(kubectl -n spire get svc spire-server -o jsonpath='{.spec.ports[0].port}' 2>/dev/null || true)"
          SPIRE_POD_IP="$(kubectl -n spire get pod spire-server-0 -o jsonpath='{.status.podIP}' 2>/dev/null || true)"
          DNS_EP_IP="$(kubectl -n kube-system get ep kube-dns -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null || true)"
          echo "spire-server ClusterIP=${SPIRE_IP:-NONE}:${SPIRE_PORT:-NONE} podIP=${SPIRE_POD_IP:-NONE}:8081"
          echo "kube-dns endpoint podIP=${DNS_EP_IP:-NONE}:53"
          NODE="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          echo "node=${NODE:-NONE}"
          echo "--- cilium-dbg status (Socket LB / KubeProxyReplacement; do not invent helm values) ---"
          kubectl -n kube-system exec ds/cilium -c cilium-agent -- cilium-dbg status \
            || echo "cilium-dbg status FAILED"
          echo "--- cilium-config ConfigMap socket-LB keys (read, do not set) ---"
          echo "MEASURED 33814040666: cilium-dbg config get names 404; enable-host-legacy-routing=false."
          echo "MEASURED 33817974673: bpf-lb-sock=false bpf-lb-sock-hostns-only=true bpf-lb-external-clusterip=false kube-proxy-replacement=true; verbose Socket LB Enabled Coverage Hostns-only; hostNetwork ClusterIP still FAIL."
          kubectl -n kube-system get cm cilium-config -o jsonpath='bpf-lb-sock={.data.bpf-lb-sock} bpf-lb-sock-hostns-only={.data.bpf-lb-sock-hostns-only} bpf-lb-external-clusterip={.data.bpf-lb-external-clusterip} enable-host-reachable-services={.data.enable-host-reachable-services} kube-proxy-replacement={.data.kube-proxy-replacement} enable-host-legacy-routing={.data.enable-host-legacy-routing}{"\n"}' \
            || echo "cilium-config ConfigMap FAILED"
          echo "--- cilium-dbg status --verbose KubeProxyReplacement Details ---"
          kubectl -n kube-system exec ds/cilium -c cilium-agent -- cilium-dbg status --verbose \
            | awk '/KubeProxyReplacement Details/,/^$/' \
            || echo "verbose KPR details FAILED"
          echo "--- host route to kube-dns ClusterIP (next distinguisher; not a helm value) ---"
          if [ -n "$NODE" ] && [ -n "$DNS_IP" ]; then
            docker exec "$NODE" ip route get "$DNS_IP" || echo "ip route get FAILED"
            docker exec "$NODE" ip -o link || echo "ip link FAILED"
          else
            echo "ip route get: SKIP"
          fi
          echo "--- k3d node cgroupns (MEASURED 33809535624: private, not the hole) ---"
          if [ -n "$NODE" ]; then
            docker inspect "$NODE" --format 'CgroupnsMode={{.HostConfig.CgroupnsMode}} Privileged={{.HostConfig.Privileged}}' \
              || echo "docker inspect FAILED"
            echo "host /proc/1/ns/cgroup=$(readlink /proc/1/ns/cgroup 2>/dev/null || echo NONE)"
            echo "node /proc/1/ns/cgroup=$(docker exec "$NODE" readlink /proc/1/ns/cgroup 2>/dev/null || echo NONE)"
          else
            echo "cgroupns: NO_NODE"
          fi
          tcp_probe_from_node() {
            local ip="$1" port="$2" label="$3"
            echo "--- TCP ${label} ${ip:-NONE}:${port:-NONE} from k3d node (hostNetwork netns) ---"
            if [ -z "$ip" ] || [ -z "$port" ]; then
              echo "TCP ${label}: SKIP (no address)"
              return 0
            fi
            if [ -z "$NODE" ] || ! docker exec "$NODE" true >/dev/null 2>&1; then
              echo "TCP ${label}: NO_NODE"
              return 1
            fi
            APPLETS=""
            if APPLETS="$(docker exec "$NODE" /bin/busybox --list)"; then
              if echo "$APPLETS" | tr ' ' '\n' | grep -qx nc; then
                if docker exec "$NODE" /bin/busybox nc -z -w 3 "$ip" "$port"; then
                  echo "TCP ${label}: OPEN"
                else
                  echo "TCP ${label}: FAIL"
                fi
                return 0
              fi
            else
              echo "busybox --list failed on ${NODE} (not a TCP measurement)"
            fi
            if docker exec "$NODE" python3 -c "print('ok')" >/dev/null 2>&1; then
              if docker exec "$NODE" python3 -c "import socket; socket.create_connection(('$ip', int('$port')), 3).close()"; then
                echo "TCP ${label}: OPEN"
              else
                echo "TCP ${label}: FAIL"
              fi
              return 0
            fi
            echo "TCP ${label}: NO_TOOL (k3s node has neither busybox nc nor python3)"
            return 1
          }
          NODE_TOOL=1
          tcp_probe_from_node "${DNS_IP}" 53 kube-dns || NODE_TOOL=0
          tcp_probe_from_node "${SPIRE_IP}" "${SPIRE_PORT}" spire-server || NODE_TOOL=0
          tcp_probe_from_node "${SPIRE_POD_IP}" 8081 spire-server-pod || NODE_TOOL=0
          tcp_probe_from_node "${DNS_EP_IP}" 53 kube-dns-pod || NODE_TOOL=0
          echo "--- UDP nslookup spire-server.spire from k3d node via kube-dns ---"
          if [ -n "$NODE" ] && [ -n "$DNS_IP" ]; then
            docker exec "$NODE" /bin/busybox nslookup spire-server.spire "$DNS_IP" \
              || echo "UDP DNS lookup: FAIL"
          else
            echo "UDP DNS lookup: SKIP"
          fi
          PROBE_SH="echo -n \"TCP kube-dns ${DNS_IP:-NONE}:53 \"; nc -z -w 3 \"${DNS_IP}\" 53 && echo OPEN || echo FAIL; echo -n \"TCP kube-dns-pod ${DNS_EP_IP:-NONE}:53 \"; nc -z -w 3 \"${DNS_EP_IP}\" 53 && echo OPEN || echo FAIL; echo -n \"TCP spire-server ${SPIRE_IP:-NONE}:${SPIRE_PORT:-NONE} \"; nc -z -w 3 \"${SPIRE_IP}\" \"${SPIRE_PORT}\" && echo OPEN || echo FAIL; echo -n \"TCP spire-server-pod ${SPIRE_POD_IP:-NONE}:8081 \"; nc -z -w 3 \"${SPIRE_POD_IP}\" 8081 && echo OPEN || echo FAIL"
          run_busybox_tcp() {
            local pod="$1" hostnet="$2"
            echo "--- busybox ${pod} (hostNetwork: ${hostnet}) ---"
            local overrides
            if [ "$hostnet" = "true" ]; then
              overrides='{"spec":{"hostNetwork":true,"dnsPolicy":"ClusterFirstWithHostNet","tolerations":[{"operator":"Exists"}]}}'
            else
              overrides='{"spec":{"hostNetwork":false,"dnsPolicy":"ClusterFirst","tolerations":[{"operator":"Exists"}]}}'
            fi
            kubectl -n kube-system delete pod "$pod" --ignore-not-found --wait=true --timeout=20s || true
            kubectl -n kube-system run "$pod" \
              --image=busybox:1.36.1 \
              --restart=Never \
              --overrides="$overrides" \
              --command -- /bin/sh -c "$PROBE_SH" \
              || echo "kubectl run ${pod} FAILED"
            kubectl -n kube-system wait --for=jsonpath='{.status.phase}'=Succeeded pod/"$pod" --timeout=60s \
              || echo "${pod} did not Succeed"
            kubectl -n kube-system logs "$pod" || echo "logs ${pod} FAILED"
            kubectl -n kube-system delete pod "$pod" --ignore-not-found --wait=false || true
          }
          echo "--- busybox hostNetwork fallback (hostNetwork: true) ---"
          if [ "$NODE_TOOL" != "1" ]; then
            run_busybox_tcp hostnet-tcp-probe true
          fi
          echo "--- pod-network control (hostNetwork: false); docker exec cannot do this ---"
          run_busybox_tcp podnet-tcp-probe false

      - name: Print cluster diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n argocd get applications.argoproj.io -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -200 || true

      - name: Tear down k3d cluster
        if: always()
        run: bun src/Core.TypeScript/cluster/dev-cluster/k3d-down.ts --config full-ai-cluster/dev-cluster/profiles/ci.k3d-config.yaml


  # THE CNI THE METAL CLUSTER WILL RUN, EXERCISED.
  #
  # Aaron 2026-08-20: "Also can we test cilium? This is the plan on real metal."
  # It was not testable before this job existed: `cilium` and `cilium-lb-ipam`
  # are excluded from the dev catalogue on BOTH sides (ports.ts excludeGlob and
  # argocd-health-test.ts DEV_EXCLUDED_DIRS), and the other kind lanes take
  # kind's own CNI, so the network layer under CI and the network layer under
  # metal were different software.
  #
  # WHAT MAKES IT POSSIBLE, cited rather than assumed:
  #   * kind documents `networking.disableDefaultCNI` and `networking.kubeProxyMode`
  #     (https://kind.sigs.k8s.io/docs/user/configuration/), and Cilium documents
  #     the kind install path (https://docs.cilium.io/en/stable/installation/kind/);
  #   * cilium/cilium's own .github/workflows/conformance-clustermesh.yaml runs
  #     kind on GitHub-hosted ubuntu-24.04 with encryption.type=wireguard, so the
  #     WireGuard kernel path is exercised upstream on this runner image.
  #
  # WHAT IT DOES NOT CLAIM. On one node WireGuard encrypts nothing -- pod traffic
  # never leaves the node, and control-plane nodes opt OUT of node-to-node
  # encryption by default. That is equally true of the metal cluster, which
  # single-node-budget.json declares as `nodeCount: 1`. So this lane runs the
  # SHIPPED values on a cluster shaped like metal and proves they INSTALL AND
  # SERVE; cilium-kind-lane.ts prints the reachability verdict on every run and
  # REFUSES if the two shapes ever stop agreeing.
  #
  # NOT continue-on-error, and it must not become one. It installs from the
  # checked-in valuesObject, so a red here is a real statement about a
  # configuration metal will boot.
  live-kind-cilium:
    name: live kind Cilium CNI (${{ matrix.runner }})
    needs: dry-run
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json', '!tools/setup/persona-keys/**', '!tools/setup/op-token-setup.*', '!tools/setup/secret-clip.sh', '!tools/setup/manus-smoke-test.ts', '!tools/setup/build-lumen-persona-package.ts') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      # The same three things full-ai-cluster/nixos/modules/cilium-wireguard-node-preflight.nix
      # checks on a metal node, run here on the runner kernel the kind node
      # containers share. GATING, not advisory: the shipped values ask for
      # WireGuard and cilium-agent fails closed without it, so a runner that
      # cannot make a WireGuard device cannot host this configuration, and
      # saying so in one line beats reading it out of a CrashLoopBackOff.
      #
      # THE DEVICE NAME IS READ FROM THAT NIX MODULE, NOT WRITTEN HERE. The first
      # version of this step spelled it `zeta-wg-preflight` -- 17 characters,
      # over IFNAMSIZ-1 -- and the kernel rejected IFLA_IFNAME with
      # `Error: Attribute failed policy validation`, which reads exactly like
      # "this runner has no WireGuard" and was nothing of the kind: modprobe had
      # already succeeded. The nix module has carried the right name and the
      # comment `Under IFNAMSIZ (16)` beside it the whole time.
      - name: Preflight the WireGuard kernel path on the runner
        run: |
          set -euo pipefail
          iface="$(bun src/Core.TypeScript/cluster/cilium-kind-lane.ts --print-wg-probe-iface)"
          echo "probe device (from cilium-wireguard-preflight-checks.nix): $iface"
          sudo modprobe wireguard
          sudo ip link add dev "$iface" type wireguard
          sudo ip link del dev "$iface"
          echo "runner kernel can create a WireGuard device"

      - name: Bring up kind with Cilium as the CNI and assert it
        id: cilium
        run: |
          set -o pipefail
          bun src/Core.TypeScript/cluster/dev-cluster/cilium-kind-up.ts \
            --cluster-name zeta-ci-cilium \
            --timeout-sec 600 \
            | tee "$RUNNER_TEMP/cilium-kind.log"

      # LOGS FROM THE CRASHED CONTAINER, NOT THE LIVE ONE.
      #
      # A CrashLoopBackOff pod's CURRENT container has usually not started, so
      # `kubectl logs` returns nothing and the reason the PREVIOUS one died is
      # thrown away on each restart. That gap is why headscale's diagnosis on
      # 2026-08-22 had to be REASONED from a local `helm template` -- "the render
      # contains zero occurrences of server_url" -- instead of read from the
      # error the process printed 12 times. The controller-specific
      # `--previous=true` a few lines below already existed; nothing did it for
      # an arbitrary pod.
      #
      # Scoped to pods that are not Running/Succeeded OR have a restart, so a
      # green run prints nothing. `|| true` throughout: a diagnostics step must
      # never be the thing that fails a job.
      - name: Logs from crash-looping pods, including the PREVIOUS container
        if: always()
        run: |
          kubectl get pods -A -o json 2>/dev/null \
            | jq -r '.items[]
                | select((.status.phase != "Running" and .status.phase != "Succeeded")
                         or ((.status.containerStatuses // []) | map(.restartCount // 0) | add // 0) > 0)
                | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r ns pod; do
                echo "=== $ns/$pod (waiting reasons + restart counts)"
                kubectl -n "$ns" get pod "$pod" -o jsonpath='{range .status.containerStatuses[*]}  {.name}: restarts={.restartCount} state={.state}{"\n"}{end}' || true
                echo "--- current container logs"
                kubectl -n "$ns" logs "$pod" --all-containers=true --prefix=true --tail=100 || true
                echo "--- PREVIOUS container logs (the ones that explain the crash)"
                kubectl -n "$ns" logs "$pod" --all-containers=true --prefix=true --previous=true --tail=100 || true
              done || true

      - name: Print cluster diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n kube-system get pods -o wide || true
          kubectl -n kube-system describe daemonset cilium || true
          kubectl -n kube-system logs daemonset/cilium -c cilium-agent --tail=200 || true
          kubectl -n kube-system logs deployment/cilium-operator --tail=200 || true
          kubectl get gatewayclass -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true

      - name: Tear down kind cluster
        if: always()
        run: bun src/Core.TypeScript/cluster/dev-cluster/kind-down.ts --cluster-name zeta-ci-cilium

  # THE MISSING CELL OF THE 2x2. Dispatch-gated; see `workflow_dispatch` above.
  #
  #   CNI        orchestrator   app roster asserted   result
  #   kindnetd   kind           included              green, 25 apps
  #   Cilium     k3s (k3d)      included              4 never reach Healthy
  #   Cilium     kind           included, own cluster <- this job (081M1DFQ2MZ)
  #
  # Four `--existing` attempts produced zero per-app verdicts: the included proof
  # depends on preparation the harness performs during ITS OWN cluster creation.
  # `--cni cilium` is the exit. The harness creates the no-default-CNI cluster,
  # helm-installs the shipped Cilium pin, runs the vault ceremony, then asserts
  # the same roster as `live-kind-included`. One variable against that baseline:
  # CNI. vault is no longer confounded.
  #
  # `live-kind-cilium` still exists: it proves Cilium comes UP on kind and stops
  # there. This job is the App-of-Apps half, deliberately separate so the CNI
  # lane's 30-minute ceiling stays a real guard.
  live-kind-cilium-included:
    name: PROBE kind+Cilium included proof (${{ matrix.runner }})
    needs: dry-run
    if: github.event_name == 'workflow_dispatch' && inputs.cilium_included_probe == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json', '!tools/setup/persona-keys/**', '!tools/setup/op-token-setup.*', '!tools/setup/secret-clip.sh', '!tools/setup/manus-smoke-test.ts', '!tools/setup/build-lumen-persona-package.ts') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      - name: Preflight the WireGuard kernel path on the runner
        run: |
          set -euo pipefail
          iface="$(bun src/Core.TypeScript/cluster/cilium-kind-lane.ts --print-wg-probe-iface)"
          echo "probe device (from cilium-wireguard-preflight-checks.nix): $iface"
          sudo modprobe wireguard
          sudo ip link add dev "$iface" type wireguard
          sudo ip link del dev "$iface"
          echo "runner kernel can create a WireGuard device"

      - name: Run the included Synced+Healthy proof on kind+Cilium
        id: proof
        env:
          ZETA_GHCR_PULL_TOKEN: ${{ github.token }}
          ZETA_ARGOCD_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          ZETA_ARGOCD_GIT_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/Lucent-Financial-Group/Zeta' }}
        # ONE harness invocation. `--cni cilium` creates the no-default-CNI
        # cluster, helm-installs the shipped Cilium surface, applies StorageClass
        # aliases and bootstrap secrets, and runs the vault ceremony. `--existing`
        # is not on this line: four attempts showed it cannot carry the included
        # proof (081M1DFQ2MZ). `--ephemeral-vault-init` is now legal because this
        # process creates and destroys the cluster, so vault is comparable to
        # `live-kind-included`.
        run: |
          set -o pipefail
          bun src/Core.TypeScript/cluster/argocd-health-test.ts \
            --run \
            --provider kind \
            --cni cilium \
            --scope included \
            --runtime docker \
            --config full-ai-cluster/dev-cluster/profiles/ci.cilium.kind-config.yaml \
            --cluster-name zeta-ci-cilium-included \
            --git-ref "$ZETA_ARGOCD_GIT_REF" \
            --timeout-sec 2400 \
            --poll-sec 15 \
            --serve-tree dev \
            --ephemeral-vault-init \
            | tee "$RUNNER_TEMP/cilium-included-proof.log"

      # The verdict table is the POINT of this job, so it is printed whether the
      # proof passed or failed -- a red run is the informative one here.
      # THE TABLE MUST NOT TURN "THE PROOF NEVER RAN" INTO "THESE APPS WERE NOT
      # ASSERTED". Its first version did: on run 33474432508 the proof exited 2 on a
      # usage error before emitting a single verdict, and the table printed four tidy
      # `NOT ASSERTED IN THIS SCOPE` lines -- which reads exactly like a measurement of
      # scope and is nothing of the kind. The only reason it was caught is that the
      # all-apps section above was ALSO empty; that accident is now the explicit check.
      - name: Per-application verdicts (the answer this job was dispatched for)
        if: always()
        run: |
          LOG="$RUNNER_TEMP/cilium-included-proof.log"
          echo "=== every app verdict on kind+Cilium (live cluster, not log-grep) ==="
          kubectl -n argocd get applications.argoproj.io \
            -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status \
            --no-headers 2>/dev/null | sort || true
          echo
          echo "=== the four this probe can speak to ==="
          for app in openziti-controller trust-manager spire vault; do
            line="$(kubectl -n argocd get application "$app" \
              -o jsonpath='=== {.metadata.name}: sync={.status.sync.status} health={.status.health.status}' \
              2>/dev/null || true)"
            if [ -z "$line" ] || [ "$line" = "=== : sync= health=" ]; then
              echo "  === $app: NOT FOUND IN CLUSTER"
            else
              echo "  $line"
            fi
          done
          echo
          echo "=== weaviate LoadBalancer Services (LIFTS WHEN for weaviate) ==="
          kubectl get svc -A --field-selector spec.type=LoadBalancer || true
          if [ ! -s "$LOG" ]; then
            echo
            echo "NO PROOF OUTPUT: '$LOG' is missing or empty."
          fi

      # Run 33684309073 died waiting for hat-system (the NAME, wave -10) with
      # only NotFound in the proof JSON. The wait is now ANY child, 180s, not
      # the 2400s health budget. These dumps are why the next dispatch can speak:
      # zeta-root-dev status, whether ANY child exists, repo-server clone
      # errors, Cilium/CoreDNS pods, the kind LB-IPAM pool, LoadBalancer
      # Services. `|| true`: a diagnostics step must never fail the job.
      - name: Why App-of-Apps produced no children
        if: always()
        run: |
          echo "=== zeta-root-dev ==="
          kubectl -n argocd get application zeta-root-dev -o yaml || true
          echo "=== applications ==="
          kubectl -n argocd get applications.argoproj.io -o wide || true
          echo "=== argocd pods ==="
          kubectl -n argocd get pods -o wide || true
          echo "=== repo-server logs ==="
          kubectl -n argocd logs deploy/argocd-repo-server --tail=150 || true
          echo "=== application-controller logs ==="
          kubectl -n argocd logs statefulset/argocd-application-controller --tail=150 || true
          echo "=== kube-system pods ==="
          kubectl -n kube-system get pods -o wide || true
          echo "=== cilium LB IPAM pool (kind alias zeta-lb-pool) ==="
          kubectl get ciliumloadbalancerippools.cilium.io -o wide || true
          echo "=== LoadBalancer Services ==="
          kubectl get svc -A --field-selector spec.type=LoadBalancer || true
          echo "=== CoreDNS Corefile (the github.com resolver) ==="
          kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' || true
          echo "=== overlay git ls-remote (MEASURED 33824995558: unexpected EOF, not helm deps) ==="
          kubectl -n argocd exec deploy/argocd-repo-server -- sh -c '
            echo "getent hosts zeta-lane-tree.zeta-lane-tree.svc.cluster.local:"; getent hosts zeta-lane-tree.zeta-lane-tree.svc.cluster.local 2>&1 | sed "s/^/  /" || echo "  FAILED rc=$?"
            echo "git ls-remote overlay tree.git:"; git ls-remote http://zeta-lane-tree.zeta-lane-tree.svc.cluster.local:8080/tree.git 2>&1 | sed "s/^/  /" || echo "  FAILED rc=$?"
          ' || true
          echo

      - name: Name the drifting resources (per-Application, failures only)
        if: always()
        run: |
          kubectl -n argocd get applications.argoproj.io -o json 2>/dev/null \
            | jq -r '.items[]
                | select((.status.sync.status != "Synced") or (.status.health.status != "Healthy"))
                | "=== \(.metadata.name): sync=\(.status.sync.status // "?") health=\(.status.health.status // "?")",
                  (.status.conditions // [] | .[] | "    condition \(.type): \(.message)"),
                  (.status.resources // [] | .[]
                     | select((.status != "Synced") or ((.health.status // "Healthy") != "Healthy"))
                     | "    \(.kind)/\(.name): sync=\(.status // "-") health=\(.health.status // "-") \(.health.message // "")")' \
            || true

      - name: Tear down kind cluster
        if: always()
        run: bun src/Core.TypeScript/cluster/dev-cluster/kind-down.ts --cluster-name zeta-ci-cilium-included

  live-kind-included:
    name: live kind included Synced+Healthy proof (${{ matrix.runner }})
    needs: dry-run
    # NOT `continue-on-error` -- removed 2026-08-21, and here is the measurement.
    #
    # It was added 2026-06-20 in #8789, a five-part `chore(setup)` PR whose only
    # recorded reason is one clause of one bullet: "live kind job advisory until
    # stable". Explicitly temporary, with an exit condition nobody ever came back
    # to. The job had shipped BLOCKING seven days earlier (#7911) and carried no
    # inline comment for the flag in the 62 days it stood.
    #
    # MEASURED over the 195 runs of this job from 2026-06-21 to 2026-08-21:
    #   * decisive conclusions 157 -- 104 pass / 53 fail;
    #   * ZERO failures in cluster creation, install.sh, cache restore or teardown.
    #     Every one of the 53 was the assertion step itself. It does not fail for
    #     environmental reasons, which is the thing that would have justified
    #     advisory status and is the thing the data refuses;
    #   * failures cluster into outages traceable to real, later-fixed defects.
    #     Only 4 isolated failures in two months (~2.5%). Sampling the failing
    #     runs by which Application missed shows ONE named defect per outage, held
    #     until someone fixed it -- never a different app each time, which is what
    #     flakiness looks like: `loki` (2026-07-31..08-01), `arc-controller`
    #     (2026-08-01..08-08, fixed by #10170), `cdi`+`kubevirt`
    #     (2026-08-16..08-21, fixed by #13084);
    #   * 91% pass before the 2026-08-16 regression, 100% (10/10) after it was
    #     fixed on 2026-08-21;
    #   * a green run takes ~10 min median. Only failures run long (~45 min), and
    #     those burn the runner today anyway.
    #
    # AND THE COST OF LEAVING IT: 52 of those 53 failures reported run-level
    # `success`. The 2026-08-16..2026-08-21 window was 44 consecutive failures,
    # 18 on `main`, all one real defect -- `cdi` and `kubevirt` asserted under the
    # auto-sync contract when both are declared manual-sync. The job caught it on
    # the first run. It went unseen for four and a half days because every surface
    # that aggregates runs said green. A check that ran and failed looked exactly
    # like a check that passed.
    #
    # WHAT THIS DOES AND DOES NOT CHANGE. It makes the RUN conclusion honest. It
    # does not block merges: `gate (required)` is the only required status check on
    # this repository and this job is not in its floor. Making it required is a
    # policy call for the maintainer, not a cleanup, and is deliberately not done
    # here. The summary step below is the other half -- the reason, without the
    # 11,000-line log.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json', '!tools/setup/persona-keys/**', '!tools/setup/op-token-setup.*', '!tools/setup/secret-clip.sh', '!tools/setup/manus-smoke-test.ts', '!tools/setup/build-lumen-persona-package.ts') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      # `--ephemeral-vault-init` (2026-08-21). The harness performs
      # vault/TOPOLOGY.md section 5's init+unseal procedure against THIS kind
      # cluster, which the teardown step below destroys unconditionally.
      #
      # THE METAL PATH IS UNCHANGED. TOPOLOGY.md section 5 still describes a
      # human ceremony behind the biometric gate, with a witness, and nothing in
      # this PR automates, wraps or softens it. The maintainer authorised the
      # EPHEMERAL case only -- "if we init key materials and throw it away not a
      # bit deal" -- and every word of that condition is enforced in code:
      # src/Core.TypeScript/cluster/ephemeral-vault-init.ts refuses `--existing`,
      # refuses a non-disposable provider, writes no material anywhere, and runs
      # a leak scan over RUNNER_TEMP + the dirty working tree + this job's own
      # stdout WHILE STILL HOLDING the shares -- the only moment such a scan is
      # possible. It fails if it finds them AND it fails if it scanned 0 bytes,
      # so a scan that did not run cannot read as a scan that passed.
      #
      # This is what lets `vault` be asserted under the FULL auto-sync contract
      # rather than deferred. It is not a weakening: Vault reaches genuinely
      # Synced+Healthy, sealed-to-unsealed, or the job goes red.
      # WHAT DISK THIS RUNNER ACTUALLY HAS, measured rather than quoted.
      #
      # `storage-profiles.json`'s runnerEnvelope carried `freeDiskGib: 14` when
      # this step was written -- a vendor number nobody had measured.
      # `--measure-runner` reads /proc for CPU and memory and reads NO disk, so
      # the number the image-footprint argument divided by (~77 GB of images
      # against ~14 GB free) had never been read off a runner. This step reads
      # it, prints every mount, and measures the preinstalled toolchains a k8s
      # lane never invokes.
      #
      # THE BOUND IS 70 SINCE 2026-08-23, taken by the maintainer against these
      # very measurements (77.06 GiB x64 / 99.02 GiB arm). That makes this step
      # MORE load-bearing, not less: `--check-envelope` convicts a runner with
      # LESS free disk than the envelope declares, and at 14 it could only ever
      # have caught a machine no hosted runner resembles. At 70 it catches a
      # runner that cannot hold what the lanes were planned against -- so if
      # GitHub ever ships a smaller image, this is where it surfaces.
      #
      # ARMED as of run 32585090483, which is what the first (report-only) pass
      # bought. It measured 77.06 GiB available on `ubuntu-24.04` and 99.02 GiB
      # on `ubuntu-24.04-arm` -- one filesystem, no /mnt -- against a declared
      # 14. The catalogue's disk row now reads 70 GiB, a conservative floor
      # beneath both, so this step convicts on a materially smaller machine and
      # not on ordinary runner-image variation.
      - name: Measure the runner's disk and check it against the envelope
        run: bun src/Core.TypeScript/cluster/runner-disk.ts --check-envelope

      - name: Run live kind included ArgoCD health proof
        id: proof
        env:
          # Sourced by `applyDevRegistryPullSecret` during the in-process kind
          # bring-up. GitHub does NOT put `GITHUB_TOKEN` in a step's environment
          # on its own -- it has to be mapped, as here -- so without this line
          # the mint finds nothing and SKIPS, silently, and the first run with
          # `platform` un-deferred would fail on a missing Secret rather than on
          # anything about `platform`.
          #
          # Harmless while `platform` is still deferred: the mint creates the
          # `zeta-platform` namespace and one Secret in a cluster that is thrown
          # away at the end of the job, and exercises the mint path in CI before
          # anything depends on it.
          ZETA_GHCR_PULL_TOKEN: ${{ github.token }}
          ZETA_ARGOCD_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          ZETA_ARGOCD_GIT_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/Lucent-Financial-Group/Zeta' }}
        # SERVES THE `dev` RUNG rather than syncing the committed `metal` one.
        # Aaron 2026-09-03: "we don't have to test metal on our CI, metal is for our
        # real hardware, dev is for testing on our github runners."
        #
        # The committed tree is `metal` -- 6390m of requests across the dev lane's 39
        # apps against this runner's 4000m node -- so `mimir-kafka-0` and three
        # hindsight pods take `Insufficient cpu` and never schedule (run
        # 33790413535). `dev` is 1165m and fits. `--serve-tree dev` builds a copy of
        # `full-ai-cluster/k8s` with that rung applied through the same
        # `applyResourceProfile` the `--verify` path checks, serves it from an
        # in-cluster read-only git server, and points the root Application there.
        # Nothing is pushed, nothing leaves the runner, and the committed tree is
        # untouched -- so the hardware box keeps the rung it needs.
        #
        # IT FAILS CLOSED. If the server never becomes Available the bring-up throws
        # rather than falling back to GitHub: a silent fallback would sync `metal`,
        # reproduce this exact failure, and say nothing about the override having
        # been skipped.
        run: |
          # `pipefail` so the HARNESS's exit code -- not tee's -- is the job verdict.
          # Without it the tee would swallow every failure and re-create, in a subtler
          # place, exactly the misreport that removing `continue-on-error` just closed.
          set -o pipefail
          bun src/Core.TypeScript/cluster/argocd-health-test.ts \
            --run \
            --provider kind \
            --scope included \
            --runtime docker \
            --config full-ai-cluster/dev-cluster/profiles/ci.kind-config.yaml \
            --cluster-name zeta-ci-included \
            --git-ref "$ZETA_ARGOCD_GIT_REF" \
            --timeout-sec 2400 \
            --poll-sec 15 \
            --serve-tree dev \
            --ephemeral-vault-init \
            | tee "$RUNNER_TEMP/included-proof.log"

      # The other half of making the failure loud. Runs even when the proof failed --
      # that is the case worth reporting -- and the timeout case, where the harness
      # printed no verdict at all, renders as UNREADABLE rather than as either green
      # or a specific failure.
      #
      # Gated on the proof step having actually RUN. If an earlier step failed, the
      # proof is `skipped`, there is no capture file, and summarising anyway would
      # raise "produced no verdict" over what is really a toolchain failure -- an
      # annotation pointing at the wrong thing, which is its own species of the
      # misreport this change exists to remove.
      - name: Summarise the included proof
        if: always() && steps.proof.conclusion != 'skipped'
        # One line because audit-workflow-cli-flags.ts reads only the rest of the line
        # after `bun <script>`, so a continuation-line flag is invisible to it. Honest
        # limit: that audit skips this tool anyway (it only judges parsers that REJECT
        # unknown flags, and this one does not), so the shape buys coverage only if the
        # parser is ever closed. It costs nothing meanwhile.
        run: bun src/Core.TypeScript/cluster/included-proof-summary.ts --log "$RUNNER_TEMP/included-proof.log"

      # NAME THE RESOURCE, NOT JUST THE APPLICATION.
      #
      # Added 2026-08-21 after a run where `weaviate` reported
      # `OutOfSync/Progressing` and the diagnostics could not say WHICH of its
      # six resources was which -- so the cause was reconstructed by rendering
      # the chart locally and reading gitops-engine, and the first reconstruction
      # was wrong. `status.resources` carries a per-resource sync AND health
      # verdict, and `status.conditions` carries ArgoCD's own comparison errors;
      # both are one kubectl away and neither was being printed.
      #
      # Scoped to Applications that are NOT Synced+Healthy, so a green run prints
      # nothing and a red one prints exactly the rows a human would have gone
      # looking for. `|| true` throughout: a diagnostics step must never be the
      # thing that fails a job, or the verdict above it stops being readable.
      - name: Name the drifting resources (per-Application, failures only)
        if: always()
        run: |
          kubectl -n argocd get applications.argoproj.io -o json 2>/dev/null \
            | jq -r '.items[]
                | select((.status.sync.status != "Synced") or (.status.health.status != "Healthy"))
                | "=== \(.metadata.name): sync=\(.status.sync.status // "?") health=\(.status.health.status // "?")",
                  (.status.conditions // [] | .[] | "    condition \(.type): \(.message)"),
                  (.status.resources // [] | .[]
                     | select((.status != "Synced") or ((.health.status // "Healthy") != "Healthy"))
                     | "    \(.kind)/\(.name): sync=\(.status // "-") health=\(.health.status // "-") \(.health.message // "")")' \
            || true

      # LOGS FROM THE CRASHED CONTAINER, NOT THE LIVE ONE.
      #
      # A CrashLoopBackOff pod's CURRENT container has usually not started, so
      # `kubectl logs` returns nothing and the reason the PREVIOUS one died is
      # thrown away on each restart. That gap is why headscale's diagnosis on
      # 2026-08-22 had to be REASONED from a local `helm template` -- "the render
      # contains zero occurrences of server_url" -- instead of read from the
      # error the process printed 12 times. The controller-specific
      # `--previous=true` a few lines below already existed; nothing did it for
      # an arbitrary pod.
      #
      # Scoped to pods that are not Running/Succeeded OR have a restart, so a
      # green run prints nothing. `|| true` throughout: a diagnostics step must
      # never be the thing that fails a job.
      - name: Logs from crash-looping pods, including the PREVIOUS container
        if: always()
        run: |
          kubectl get pods -A -o json 2>/dev/null \
            | jq -r '.items[]
                | select((.status.phase != "Running" and .status.phase != "Succeeded")
                         or ((.status.containerStatuses // []) | map(.restartCount // 0) | add // 0) > 0)
                | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r ns pod; do
                echo "=== $ns/$pod (waiting reasons + restart counts)"
                kubectl -n "$ns" get pod "$pod" -o jsonpath='{range .status.containerStatuses[*]}  {.name}: restarts={.restartCount} state={.state}{"\n"}{end}' || true
                echo "--- current container logs"
                kubectl -n "$ns" logs "$pod" --all-containers=true --prefix=true --tail=100 || true
                echo "--- PREVIOUS container logs (the ones that explain the crash)"
                kubectl -n "$ns" logs "$pod" --all-containers=true --prefix=true --previous=true --tail=100 || true
              done || true

      - name: Print cluster diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide || true
          kubectl -n argocd get applications.argoproj.io -o wide || true
          kubectl get pods -A -o wide || true
          echo "=== overlay git ls-remote (MEASURED 33824995558: unexpected EOF, not helm deps) ==="
          kubectl -n argocd exec deploy/argocd-repo-server -- sh -c '
            echo "getent hosts zeta-lane-tree.zeta-lane-tree.svc.cluster.local:"; getent hosts zeta-lane-tree.zeta-lane-tree.svc.cluster.local 2>&1 | sed "s/^/  /" || echo "  FAILED rc=$?"
            echo "git ls-remote overlay tree.git:"; git ls-remote http://zeta-lane-tree.zeta-lane-tree.svc.cluster.local:8080/tree.git 2>&1 | sed "s/^/  /" || echo "  FAILED rc=$?"
          ' || true
          kubectl -n arc-systems describe pods -l app.kubernetes.io/name=gha-rs-controller || true
          kubectl -n arc-systems logs -l app.kubernetes.io/name=gha-rs-controller --all-containers=true --prefix=true --tail=200 || true
          kubectl -n arc-systems logs -l app.kubernetes.io/name=gha-rs-controller --all-containers=true --prefix=true --previous=true --tail=200 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -200 || true

      - name: Tear down kind cluster
        if: always()
        run: bun src/Core.TypeScript/cluster/dev-cluster/kind-down.ts --cluster-name zeta-ci-included

  # ---------------------------------------------------------------------------
  # DO THE VENDORED cdi/kubevirt BYTES ACTUALLY DEPLOY?
  #
  # `cdi` and `kubevirt` are the only two Applications in the catalogue whose
  # MANIFESTS no check has ever executed. They are declared manual-sync, so the
  # `included` lane asserts them under the weaker contract in
  # manual-sync-policy.ts -- exists, ArgoCD completed a comparison, health not
  # Degraded -- and that module states its own limit out loud: it "can no longer
  # catch anything that only appears once the manifests are APPLIED". Nothing
  # applied them. `OutOfSync`/`Missing` with `ok: true` is honest for a lane that
  # never syncs them, and it is also the shape of a check that did not run.
  #
  # This job runs them. It does NOT weaken the manual-sync declaration: that
  # reason is a PRODUCTION constraint about node-5b2dfa and its three live
  # Windows guests, and an ephemeral kind cluster has no guests to disturb.
  #
  # /dev/kvm is not assumed. GitHub's own hosted-runner docs: "While nested
  # virtualization is technically possible while using runners, it is not
  # officially supported." KubeVirt does not need it -- software-emulation.md:
  # "If `useEmulation` is enabled, `qemu` will be used for software emulation, in
  # case that hardware emulation via `/dev/kvm` is unavailable." The recipe here
  # is upstream's own: kubevirt/kubevirt.core's .github/workflows/integration.yml
  # runs on `ubuntu-latest` + helm/kind-action and its hack/e2e-setup.sh applies
  # exactly this merge patch when nested virt is off, then waits
  # `--for=condition=Available kubevirt kubevirt`.
  #
  # NOT continue-on-error, and deliberately so -- an advisory job here would
  # re-create in a new place the exact misreport this job exists to remove. It is
  # also not in the `gate (required)` floor, so it reports without blocking;
  # promoting it is a maintainer policy call, not a cleanup.
  # ---------------------------------------------------------------------------
  live-kind-virt:
    name: live kind kubevirt+cdi emulation proof
    needs: dry-run
    env:
      ZETA_HOST_TIER: full
      MISE_ENV: full
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
          key: install-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('.mise.toml', '.mise.full.toml', 'tools/setup/**', 'global.json', '!tools/setup/persona-keys/**', '!tools/setup/op-token-setup.*', '!tools/setup/secret-clip.sh', '!tools/setup/manus-smoke-test.ts', '!tools/setup/build-lumen-persona-package.ts') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain via three-way-parity script
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      # RECORD what the runner actually had, rather than asserting it. If a
      # runner image ever does ship /dev/kvm, KubeVirt uses hardware emulation
      # regardless of useEmulation ("Hardware emulation is always attempted
      # first" -- software-emulation.md) and the proof still holds; this line is
      # how a reader of the log knows which path was taken.
      - name: Record virtualization availability on this runner
        run: |
          echo "kvm device: $(test -e /dev/kvm && echo present || echo ABSENT)"
          cat /sys/module/kvm_*/parameters/nested 2>/dev/null || echo "nested: unknown"

      - name: Run kubevirt+cdi emulation proof on kind
        run: |
          set -o pipefail
          bun src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.ts \
            --run \
            --cluster-name zeta-ci-virt \
            --config full-ai-cluster/dev-cluster/profiles/ci.kind-config.yaml \
            --timeout-sec 900

      - name: Print virt diagnostics
        if: always()
        run: |
          kubectl get nodes -o wide || true
          kubectl get cdi cdi -o wide || true
          kubectl -n cdi get pods -o wide || true
          kubectl -n kubevirt get kubevirt kubevirt -o yaml || true
          kubectl -n kubevirt get pods -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -200 || true

      - name: Tear down kind cluster
        if: always()
        run: bun src/Core.TypeScript/cluster/dev-cluster/kind-down.ts --cluster-name zeta-ci-virt
