# Kubernetes + ArgoCD health integration test (081KSXN940008QG0R000SCP2H1).
#
# SECURITY NOTE:
# - This workflow reads the PR head SHA / push SHA only through env-block
#   buffering (`ZETA_ARGOCD_GIT_REF`) and then quotes that shell variable.
# - No attacker-controlled PR title/body/branch text is interpolated into a
#   `run:` block.
# - The only third-party action used is checkout, SHA-pinned per
#   docs/security/GITHUB-ACTIONS-SAFE-PATTERNS.md.

name: k8s-argocd-health-test

on:
  schedule:
    # DAILY (was weekly Sunday, "43 16 * * 0") — Aaron 2026-08-13: "it should
    # be more often than weekly on the k8s testing".
    #
    # Why daily, and why not more or less:
    #
    # 1. The billable cost is ZERO, checked not assumed. Lucent-Financial-
    #    Group/Zeta is a PUBLIC repository, and GitHub-hosted standard runners
    #    are free for public repositories. Confirmed against this workflow's
    #    own accounting: `GET /actions/runs/31754638408/timing` reports
    #    `billable.UBUNTU.total_ms = 0` across all 4 jobs for a 12.6-minute
    #    run. So the real costs are concurrency slots and the maintainer
    #    attention a failure consumes — not dollars.
    #
    # 2. Everything this lane could drift against is PINNED IN-REPO: kind
    #    0.31.0 / kubectl 1.36.1 / helm 4.2.0 (.mise.full.toml), argo-cd chart
    #    7.7.10, Gateway API v1.2.1 (vendored CRDs). What is NOT pinned is the
    #    substrate underneath: the `ubuntu-24.04` runner image (Docker,
    #    containerd, kernel, cgroup layout), live registry + helm-repo
    #    availability, and main-branch changes outside this workflow's `paths`
    #    filter — `tools/setup/**` is notably absent from it, so an
    #    `install.sh` change reaches main untested by this lane until a cron
    #    fires. Those move on the order of a day; a weekly cron gives a mean
    #    time-to-detect of ~3.5 days and a worst case of 7, which is longer
    #    than the drift period it exists to catch.
    #
    # 3. Daily brings MTTD to ~12h (24h worst case) — matched to the fastest
    #    drift source we actually have. Sub-daily (e.g. `*/6`) would mostly
    #    re-measure the same unchanged substrate and multiply failure noise
    #    without shortening detection below that period, so it would buy
    #    signal we cannot act on any faster.
    #
    # Minute 53 is off `:00`/`:30` (thundering-herd) and unused elsewhere in
    # .github/workflows; 16:53 UTC is mid-morning US Pacific, so a failure
    # lands when someone is around to read it. Hour retained from the former
    # weekly slot — only the day-of-week widens.
    - cron: "53 16 * * *"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/Core.TypeScript/cluster/argocd-health-test.ts"
      - "src/Core.TypeScript/cluster/argocd-health-test.test.ts"
      - "src/Core.TypeScript/cluster/app-of-apps-discovery.ts"
      - "src/Core.TypeScript/cluster/app-of-apps-discovery.test.ts"
      - "src/Core.TypeScript/cluster/derive-sync-waves.ts"
      - "src/Core.TypeScript/cluster/derive-sync-waves.test.ts"
      - "full-ai-cluster/k8s/sync-wave-dependency-graph.yaml"
      # THE FILE THAT DEFINES THIS JOB'S CLUSTER DID NOT TRIGGER THIS JOB.
      # `ci.kind-config.yaml` / `ci.cilium.kind-config.yaml` are the kind
      # configs these steps pass to `--config`, so they decide what the cluster
      # IS -- node count, CNI, and (as of the maxPods change) the pod ceiling
      # that the scheduler enforces. Editing them could not re-run the only job
      # that proves the cluster comes up, so a bootstrap change landed unverified
      # by construction. That is the same shape as a check that cannot run
      # looking like one that passed, one layer further out: here the check
      # exists and is green, on a cluster built from a config it never saw.
      - "full-ai-cluster/dev-cluster/profiles/**"
      - "src/Core.TypeScript/cluster/included-proof-summary.ts"
      - "src/Core.TypeScript/cluster/included-proof-summary.test.ts"
      - "src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.ts"
      - "src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.test.ts"
      # The Cilium CNI lane. `cilium-kind-lane.ts` DERIVES its roster from the
      # nix sources file, its probe device name from the nix preflight module,
      # and its verdict from the node ledger, so a change to any of those moves
      # what it concludes -- which is why all three are listed here beside the
      # TypeScript, for the same reason maintainers/*/cluster-nodes is below.
      - "src/Core.TypeScript/cluster/cilium-kind-lane.ts"
      - "src/Core.TypeScript/cluster/cilium-kind-lane.test.ts"
      - "src/Core.TypeScript/cluster/dev-cluster/cilium-kind-up.ts"
      # The k3d provider lane (live-k3d). Listed for the same reason
      # cilium-kind-up.ts is: the bring-up and teardown this job dispatches
      # can change without touching any manifest.
      - "src/Core.TypeScript/cluster/dev-cluster/k3d-up.ts"
      - "src/Core.TypeScript/cluster/dev-cluster/k3d-down.ts"
      # THE BRING-UP ITSELF, added 2026-08-21 (081M0JXXFV0087G0R...). These four
      # files decide WHAT IS IN the cluster this lane asserts against -- the
      # alias StorageClasses, and now the Grafana admin Secret that
      # kube-prometheus-stack requires to pre-exist -- and none of them was
      # watched. So a change that broke the substrate the proof stands on did
      # not run the proof, which is the same defect the `applications/**`
      # widening above was written to fix, one directory over.
      - "src/Core.TypeScript/cluster/dev-cluster/use-cases.ts"
      - "src/Core.TypeScript/cluster/dev-cluster/use-cases.test.ts"
      - "src/Core.TypeScript/cluster/dev-cluster/lib.ts"
      - "src/Core.TypeScript/cluster/dev-cluster/apply-root-app.ts"
      - "src/Core.TypeScript/cluster/adapters/kubectl-control-plane.ts"
      - "src/Core.TypeScript/cluster/adapters/helm-package-driver.ts"
      - "src/Core.TypeScript/cluster/ports.ts"
      - "full-ai-cluster/nixos/modules/cilium-wireguard-sources.nix"
      - "full-ai-cluster/nixos/modules/cilium-wireguard-preflight-checks.nix"
      - "full-ai-cluster/dev-cluster/**"
      # WATCH WHAT THIS LANE DEPLOYS. This used to be
      # "applications/**/Application.yaml", which matched only the ArgoCD
      # Application objects and none of the manifests they point at -- yet
      # the lane deploys those manifests. Measured: the run that caught the
      # gatekeeper CRD-wait Job being rejected by PodSecurity created the pod
      # from applications/hat-system/gatekeeper-crd-wait.yaml, a file this
      # filter did not watch. So a PR breaking a workload manifest did not
      # run the one lane that deploys it, and the PR that FIXED that Job
      # (#13223) got no kind check either -- it was caught only because an
      # unrelated PR happened to touch a watched path.
      #
      # Now the same breadth as the bootstrap entry below, which already
      # uses "**" for the same reason.
      - "full-ai-cluster/k8s/applications/**"
      - "full-ai-cluster/k8s/bootstrap/**"
      - "full-ai-cluster/k8s/single-node-budget.json"
      # The storage size profile ladder. The ledger's activeStorageProfile
      # names a rung in this catalogue and the auditor compares the manifests
      # against it, so a change to either side moves what the capacity gate
      # convicts on -- the same reason single-node-budget.json is watched.
      - "full-ai-cluster/k8s/storage-profiles.json"
      # The MEASURED comparator for the capacity gate. A node registering (or
      # re-registering with different disks) moves the hardware bound the audit
      # compares against, so it has to re-run -- otherwise a smaller node could
      # land on main without the gate that would have caught it ever firing.
      - "maintainers/*/cluster-nodes/**"
      - "src/Core.TypeScript/cluster/single-node-readiness.ts"
      - "src/Core.TypeScript/cluster/single-node-readiness.test.ts"
      - "src/Core.TypeScript/cluster/storage-profiles.ts"
      - "src/Core.TypeScript/cluster/storage-profiles.test.ts"
      # The disk half of the runner envelope, and its measurer.
      - "src/Core.TypeScript/cluster/runner-disk.ts"
      - "src/Core.TypeScript/cluster/runner-disk.test.ts"
      # Which Applications the disk is actually spent on. The measurement is a
      # dated artifact like the storage snapshot, so it is watched beside its
      # reader for the same reason: editing one without the other is the drift.
      - "src/Core.TypeScript/cluster/image-footprint.ts"
      - "src/Core.TypeScript/cluster/image-footprint.test.ts"
      - "src/Core.TypeScript/cluster/image-footprint.measured.json"
      # Does a DECLARED storage claim correspond to a PVC the chart actually
      # renders? The snapshot is the measured render; the checker compares the
      # catalogue against it offline. Editing either without re-measuring is
      # exactly the drift this job exists to catch, so all four are watched.
      - "src/Core.TypeScript/cluster/rendered-storage-claims.ts"
      - "src/Core.TypeScript/cluster/rendered-storage-claims.test.ts"
      - "src/Core.TypeScript/cluster/rendered-storage-claims.baseline.json"
      - "src/Core.TypeScript/cluster/rendered-storage-claims.snapshot.json"
      - "src/Core.TypeScript/cluster/rendered-resource-requests.ts"
      - "src/Core.TypeScript/cluster/rendered-resource-requests.test.ts"
      - "src/Core.TypeScript/cluster/rendered-resource-requests.baseline.json"
      - "src/Core.TypeScript/cluster/rendered-resource-requests.snapshot.json"
      - "src/Core.TypeScript/cluster/inert-valuesobject-keys.ts"
      - "src/Core.TypeScript/cluster/inert-valuesobject-keys.test.ts"
      - "src/Core.TypeScript/cluster/inert-valuesobject-keys.baseline.json"
      - "src/Core.TypeScript/cluster/inert-valuesobject-keys.schema.json"
      - "src/Core.TypeScript/cluster/reason-truth.ts"
      - "src/Core.TypeScript/cluster/reason-truth.test.ts"
      - "src/Core.TypeScript/cluster/gatekeeper-ignore-label.ts"
      - "src/Core.TypeScript/cluster/gatekeeper-ignore-label.test.ts"
      - "src/Core.TypeScript/cluster/lane-tree-source.ts"
      - "src/Core.TypeScript/cluster/lane-tree-source.test.ts"
      - "docs/backlog/P1/081KSXN940008QG0R000SCP2H1-kubernetes-argocd-kind-k3d-integration-health-tests-separate.md"
      - ".github/workflows/k8s-argocd-health-test.yml"
      - ".mise.toml"
      - ".mise.full.toml"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "src/Core.TypeScript/cluster/argocd-health-test.ts"
      - "src/Core.TypeScript/cluster/argocd-health-test.test.ts"
      - "src/Core.TypeScript/cluster/app-of-apps-discovery.ts"
