name: budget-snapshot-cadence

# Weekly cadence for evidence-based LFG burn tracking. Runs
# src/Core.TypeScript/budget/snapshot-burn.ts, captures the resulting JSONL row,
# and commits it DIRECTLY TO MAIN (fast-forward-safe, no branch, no PR).
# Closes task #297 (cadence half of the evidence-based-budgeting work;
# tooling was task #285, baseline snapshot was task #287).
#
# Why weekly: docs/budget-history/README.md says "On a cadenced
# schedule (weekly) — catches drift when no PRs are merging." Weekly
# is the right balance for a small project — daily produces too many
# rows for the burn pattern to be informative; monthly is too coarse
# for the Stage-1-blocker decision the snapshots were originally
# designed to gate.
#
# Why off-the-hour: GHA cron thundering-herd avoidance per
# .github/workflows/github-settings-drift.yml convention. Sunday is
# chosen over weekdays so the snapshot isn't competing with PR
# cadence for runner minutes.
#
# Security note (safe-pattern compliance per
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
# ): this workflow consumes only first-party trusted context —
# secrets.GITHUB_TOKEN, github.repository, github.run_id. Every
# expression value is passed via env: into run blocks and quoted
# there as "$VAR"; no expressions are interpolated directly inside
# run-block scripts. The workflow_dispatch `note` input is also
# routed via env: + quoted to neutralise potentially-malicious
# content if an attacker with dispatch permissions tries injection.
#
# Scope coverage limits per docs/budget-history/README.md:
# snapshot-burn.ts works without admin:org but captures the
# scope_coverage block honestly. If the human maintainer later runs
# `gh auth refresh -s admin:org` the snapshots get richer
# automatically (Actions billing / Packages / shared-storage).
#
# AgencySignature v1 attribution (per the canonical 10-trailer
# convention documented in src/Core.TypeScript/hygiene/validate-
# agencysignature-pr-body.sh): this workflow's commits identify
# themselves as the budget-cadence-workflow agent running on
# GitHub Actions. The Human-Review-Evidence trailer is "none"
# because the validator's consistency rule (Amara ferry-5 evidence-
# pointer rule) requires Evidence="none" whenever Human-Review is
# not "explicit". The signed-policy authorization for the cadence
# itself (docs/budget-history/README.md + the maintainer's
# 2026-04-22 standing direction for evidence-based budgeting) is
# documented in the commit body prose, not the per-run trailer
# fields — per-run trailers describe the per-run state, not the
# deployment-time authorization.
#
# HOW IT LANDS ON MAIN. It does not push to main. Ruleset "CI Gate"
# (16134995) makes `gate (required)` a required status check on main with
# `bypass_actors: []`, and a required check is evaluated at PUSH time
# against the pushed tip — so a commit that has never been through a check
# run is rejected before any check could start. This lane pushed
# `HEAD:main` anyway and had been failing on `GH013: Repository rule
# violations` since 2026-08-16 (run 31959534906); because the cadence is
# WEEKLY it then sat red for a full week per failure and nobody saw it.
# The ruleset is intended and is not to be weakened; the lane is what was
# out of date.
#
# The row is now parked on the ungated staging branch
# `heartbeat/budget-snapshot` and flushed via a PR with squash auto-merge
# armed, exactly as tick-metrics/society/red-state already do. Both
# objections quoted in the old text are handled by the shared flush tool
# rather than by avoiding PRs: it authenticates PR creation with a
# fine-grained PAT (the enterprise restriction), and the same PAT on the
# checkout is what makes `gate` actually run on the flush PR instead of
# parking as `action_required` (the dead-end auto-merge).
# See src/Core.TypeScript/forge-host/github/flush-via-staging.ts.

on:
  schedule:
    # Weekly Sundays 16:23 UTC — off-the-hour weekend slot to
    # avoid GHA cron thundering-herd + PR cadence competition.
    - cron: "23 16 * * 0"
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note to attach to this snapshot row"
        required: false
        default: ""

permissions:
  # Top-level: read-only by default (per Scorecard TokenPermissions
  # best-practice — minimize blast radius if any step is compromised).
  # The snapshot job below scopes write permissions narrowly.
  contents: read

concurrency:
  # Only one cadence run at a time. Retriggers queue (rather than
  # cancel) so a partially-through snapshot doesn't get clobbered
  # mid-write — the snapshots.jsonl file is append-only and we'd
  # rather sequence appends than risk a half-written row.
  group: budget-snapshot-cadence
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    # 12 minutes, not 5: this job runs tools/setup/install.sh, so its timeout is
    # the CEILING on the installer's apt wall budget (audit-apt-budget-fits-job-
    # timeout.ts). At 5 minutes these three cadence jobs pinned that budget to
    # 150s fleet-wide, which left the first apt attempt 45s against a 38.2s
    # healthy cost — tight enough to false-fail a merely-slow mirror. A timeout
    # is a cap, not a reservation: this job finishes in ~2.5 min, so raising it
    # costs zero additional CI minutes on the healthy path.
    timeout-minutes: 12

    permissions:
      # Need contents:write to commit the snapshot row to main; actions:read
      # so snapshot-burn.ts can call the Actions REST endpoints
      # (/repos/.../actions/runs and /actions/runs/{id}/timing) to populate
      # burn metrics. Without actions:read, those API calls 403 silently and
      # snapshot-burn.ts falls back to empty/zeroed timing data while still
      # writing a snapshot — producing misleading evidence rather than a hard
      # failure. With explicit job permissions, omitted scopes are `none`, so
      # actions:read MUST be listed explicitly here. pull-requests:write is
      # required now that the row lands through a flush PR rather than a
      # direct push to main.
      contents: write
      actions: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Need full history so snapshot-burn.ts can compute
          # factory_git_sha correctly.
          fetch-depth: 0
          # This checkout's credential is the one that pushes
          # `heartbeat/budget-snapshot`, and its actor is what decides whether
          # `gate (required)` ever runs on the flush PR. See tick-metrics.yml
          # for the measurement behind this ladder.
          persist-credentials: true
          token: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        env:
          # mise release-metadata calls authenticate (1000/hr) instead of anonymous (60/hr 403 flake)
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Verify required tooling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          command -v gh >/dev/null
          command -v bun >/dev/null
          gh auth status

      - name: Configure committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Runs BEFORE the snapshot: `prepare` checks out a fresh branch off origin/main
      # and would discard a row written ahead of it. It also unions in anything still
      # parked on the staging branch from a previous run whose flush PR has not landed.
      - name: Prepare staging working tree
        run: bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts prepare --lane budget-snapshot

      - name: Run budget snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTE_INPUT: ${{ github.event.inputs.note || '' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "${NOTE_INPUT:-}" ]; then
            note="$NOTE_INPUT"
          else
            note="weekly cadence run via .github/workflows/budget-snapshot-cadence.yml (run $RUN_ID)"
          fi
          bun src/Core.TypeScript/budget/snapshot-burn.ts --note "$note"

      # No `Inspect diff` gate: `flush` stages the paths and returns a clean no-op when
      # nothing changed (idempotency, discipline #6), so a re-dispatch that produces an
      # identical row is green and commits nothing.
      - name: Flush to main via staging branch + PR
        env:
          GH_TOKEN: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN || secrets.ZETA_PR_ARCHIVE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts flush \
            --lane budget-snapshot \
            --paths docs/budget-history/snapshots.jsonl \
            --message "ops(budget): weekly cadence burn snapshot — task #297"
