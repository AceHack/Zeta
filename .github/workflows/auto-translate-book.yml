name: Auto-Translate Book

on:
  push:
    branches: [main]
    paths:
      - 'docs/books/you-born-at-the-hinge/site/index.en.html'

permissions:
  contents: write

concurrency:
  group: "auto-translate"
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Book Translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run docs/books/you-born-at-the-hinge/scripts/translate_book.ts

      - name: Commit translated files
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: auto-translate book updates [skip ci]"
          file_pattern: "docs/books/you-born-at-the-hinge/site/index.*.html"
