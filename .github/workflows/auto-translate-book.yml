name: Auto-Translate Book

on:
  push:
    branches: [main]
    paths:
      - 'docs/books/you-born-at-the-hinge/site/index.en.html'

permissions:
  contents: write

concurrency:
  group: "auto-translate"
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Book Translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bun run docs/books/you-born-at-the-hinge/scripts/translate_book.ts

      - name: Commit translated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-translate book updates [skip ci]"
          file_pattern: "docs/books/you-born-at-the-hinge/site/index.*.html"
