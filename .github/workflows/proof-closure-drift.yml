# Proof-closure drift telemetry — does a proof file CLAIM closure it does not have?
#
# Detects the contradiction where a comment asserts "no sorry" / "no axiom" /
# "the proof chain is CLOSED" while the code below it still carries `sorry`,
# `admit`, or an `axiom` declaration.
#
# Why a workflow can see this and the Lean build cannot:
#   `sorry` makes Lean ACCEPT the file. A green build is therefore not evidence
#   of closure — it is evidence of compilation. Nothing in the normal toolchain
#   compares the prose claim against the tactic block, so this class of drift is
#   invisible to every gate we already run.
#
# TELEMETRY, NOT A GATE (deliberate).
#   Per `docs/DECISIONS/2026-07-09-drift-and-heal-replaces-pre-merge-gates-…`:
#   a required serial pre-merge gate is a global lock on the write path, and one
#   lane's drift then blocks every other lane. So this job REPORTS and never
#   blocks — `continue-on-error` on the audit step, and the job's own success is
#   not conditioned on a clean result. It exists so the mistake is seen after the
#   fact and corrected, while the fleet keeps moving.
#
# Origin: 2026-08-10. `ImaginaryStack/PhaseClockErasure.lean` line 90 read
# "The ECC proof chain is CLOSED: no axiom, no sorry, non-vacuous" while
# `xorshift_mod17_in_rsCode` at line 114 was proven by `sorry`. Found by hand
# during a routed CI verification; automated here so the next one is not.

name: proof-closure-drift

on:
  push:
    branches: [main]
    paths:
      - "src/Core.Lean4/**/*.lean"
      - "src/Core.TypeScript/hygiene/audit-proof-closure-claims.ts"
      - ".github/workflows/proof-closure-drift.yml"
  schedule:
    - cron: "23 */6 * * *" # four times a day, off the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-closure-drift
  cancel-in-progress: true

jobs:
  # Regenerates demo/red/red-state.json and commits it — GIT IS THE BACKEND for the
  # Red State dashboard at /demo/red/. The dashboard is a static page and a pure
  # function of that committed file, so no server or browser-side API key is
  # involved, and every change in the red state lands as a readable diff whose git
  # history is the event log.
  #
  # Separate job because it needs `contents: write` while the audit job stays
  # read-only. It is also allowed to fail without consequence: a stale dashboard is
  # a smaller problem than a workflow that blocks.
  red-state:
    name: Refresh Red State dashboard data
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write       # push the staging branch
      pull-requests: write  # open/arm the flush PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Configure committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # red-state.json is a regenerated SNAPSHOT, not an accumulating ledger — it carries
      # {version, generatedAtIso, commit, totals, territories} recomputed from scratch on
      # every run. So there is nothing to shard and nothing to union semantically:
      # latest-wins is the correct resolution, which is exactly what `prepare` gives here.
      - name: Prepare staging working tree
        run: bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts prepare --lane red-state

      - name: Collect red state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun src/Core.TypeScript/hygiene/collect-red-state.ts --ci

      # No `[skip ci]` in this message — it becomes the PR head, and a skip token there
      # would stop `gate` running, leaving the PR permanently unmergeable. Direct push to
      # main is no longer possible: ruleset "CI Gate" requires `gate (required)` at push
      # time with no bypass actors, by design.
      - name: Flush to main via staging branch + PR
        env:
          # ROLE: PR-CREATE. One role, one secret.
          #
          # The enterprise forbids the Actions identity from creating pull requests, so the
          # `gh` calls in this step authenticate as ZETA_PR_ARCHIVE_TOKEN — the credential the
          # role table in
          # docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md
          # assigns to `gh pr create`. The BRANCH PUSH is a different role and is already
          # authenticated by the persisted checkout credential (ZETA_TELEMETRY_FLUSH_TOKEN);
          # the `||` chain that stood here collapsed both roles plus GITHUB_TOKEN into one
          # variable and silently substituted whichever happened to be set.
          #
          # ABSENCE IS A NAMED REFUSAL, NOT A SUBSTITUTION. `openMergePR` refuses an empty
          # GH_TOKEN and names the secret and the exact scope
          # (src/Core.TypeScript/agent-heartbeats/merge-heartbeats-to-main.ts). The payload
          # still parks safely on the staging branch — nothing is lost — and the step goes
          # red rather than landing under the wrong authority.

          # ARM AUTO-MERGE ON THE FLUSH PR. Opt-in flag read by `armingEnabled`
          # (src/Core.TypeScript/agent-heartbeats/merge-heartbeats-to-main.ts). Turned on
          # 2026-08-26 after Aaron rotated ZETA_PR_ARCHIVE_TOKEN at 19:54Z to carry
          # `enablePullRequestAutoMerge`; the docstring there records the decision. Scoped to
          # THIS step so it cannot reach an unrelated one.
          ZETA_FLUSH_ARM_AUTOMERGE: "1"
          GH_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN }}
        run: |
          bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts flush \
            --lane red-state \
            --paths demo/red/red-state.json \
            --message "chore(red-state): refresh dashboard data"

  audit:
    name: Proof-closure claim audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Audit proof-closure claims
        id: audit
        continue-on-error: true # drift telemetry never blocks the fleet
        run: |
          bun src/Core.TypeScript/hygiene/audit-proof-closure-claims.ts | tee audit.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Audit Lean CI coverage (what the axiom audit is NOT looking at)
        id: coverage
        continue-on-error: true # coverage telemetry never blocks the fleet
        run: bun src/Core.TypeScript/hygiene/audit-lean-ci-coverage.ts | tee coverage.txt

      - name: Publish drift to the run summary
        if: always()
        run: |
          {
            echo "## Lean CI coverage"
            echo
            if [ "${{ steps.coverage.outcome }}" = "success" ]; then
              echo "Every \`sorry\`-carrying Lean file is axiom-audited."
            else
              echo "**Coverage gap.** A file carries \`sorry\` that no axiom audit examines."
              echo
              echo "\`lake env lean\` only WARNS on \`sorry\` (exit 0), so an unlisted file is"
              echo "invisible to every check we run. Closing a gap may legitimately turn the"
              echo "Lean job red — that is a human call, not a side effect of this job."
            fi
            echo
            echo '```'
            cat coverage.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo
            echo "## Proof-closure drift"
            echo
            if [ "${{ steps.audit.outcome }}" = "success" ]; then
              echo "No proof file claims a closure it does not have."
            else
              echo "**Drift found.** A file claims closure while carrying \`sorry\` / \`admit\` / \`axiom\`."
              echo
              echo "A \`sorry\` makes the file compile, so a green build is not evidence."
              echo "Correct whichever is wrong: discharge the marker, or retract the claim."
            fi
            echo
            echo '```'
            cat audit.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
