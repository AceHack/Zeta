# Tick metrics writer — records observe loop metrics for the Pages-served dashboard.
#
# Runs on every push to main (each merge = a potential tick event landing)
# and on a 15-minute schedule (catch ticks that landed via another lane).
#
# Reads:  docs/observe-events/*.json (the durable event log)
# Writes: data/tick-shards/YYYY/MM/DD/<HHMMSSmmm>-<hash>.json (the ledger — one file
#         per write, so no two writers ever touch the same path)
#         data/tick-history.json + data/tick-latest.json (DERIVED, bounded rollups)
# Served by: GitHub Pages at /data/tick-history.json (same-origin fetch)
#
# The data contract (from the design handoff):
#   Frame shape: { t, total_events, last_action, last_mode, last_agent, entropy_state,
#                  entropy_heat, ticks_24h, agents_active, claims_pending }
#   The SHARD SET is the ledger. Append-only. CI never deletes shards.
#   data/tick-history.json is a pure function of the shards, regenerated each run and
#   bounded — a static page cannot list a directory, so it needs one file to fetch.
#
# HOW IT LANDS ON MAIN. It does not push to main. Ruleset "CI Gate" (16134995) makes
# `gate (required)` a required status check on main with `bypass_actors: []`, and a
# required check is evaluated at PUSH time against the pushed tip — so a commit that has
# never been through a check run is rejected before any check could start. That is
# intended and is not to be weakened. Instead the frame is parked on the ungated staging
# branch `heartbeat/tick-metrics` and flushed via a PR with squash auto-merge armed.
# See src/Core.TypeScript/forge-host/github/flush-via-staging.ts.

name: tick-metrics

on:
  push:
    branches: [main]
    paths:
      - 'docs/observe-events/**'
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:

permissions:
  contents: write       # push the staging branch
  pull-requests: write  # open/arm the flush PR

# One writer per lane. Without this, the push trigger and the 15-minute schedule can
# overlap and race each other onto the same staging ref. The shard store makes the DATA
# conflict-free; this makes the REF handling conflict-free too.
concurrency:
  group: tick-metrics-flush
  cancel-in-progress: false

jobs:
  append-metrics:
    name: append tick metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history for accurate event counting

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Configure committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Start from main, then union in anything still parked on the staging branch from a
      # previous run whose flush PR has not landed yet. Without this, a slow PR plus a
      # fast schedule would let each run force-push over the last run's unlanded frame.
      - name: Prepare staging working tree
        run: bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts prepare --lane tick-metrics

      - name: Compute metrics frame and rebuild rollup
        run: bun src/Core.TypeScript/observe/tick-metrics-writer.ts

      # NOTE for future editors: the flush commit message must NOT carry `[skip ci]`.
      # It becomes the PR head, and a CI-skip token there stops `gate` from ever running,
      # so the required check never reports and the PR hangs unmergeable forever. The old
      # message had `[skip ci]` because it was pushed straight at main, where it was
      # harmless. flush-via-staging.ts refuses a skip token rather than open a dead PR.
      - name: Flush to main via staging branch + PR
        env:
          # The enterprise forbids the Actions identity from creating pull requests, so a
          # fine-grained PAT is required here (same constraint and same fallback ladder as
          # pr-archive-on-merge.yml). Without one the frame still parks safely on the
          # staging branch and the job reports the reason.
          GH_TOKEN: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN || secrets.ZETA_PR_ARCHIVE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts flush \
            --lane tick-metrics \
            --paths data/tick-shards data/tick-history.json data/tick-latest.json \
            --message "metrics: append tick frame"
