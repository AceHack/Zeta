# Tick metrics writer — appends observe loop metrics to the Pages-served ledger.
#
# Runs on every push to main (each merge = a potential tick event landing)
# and on a 15-minute schedule (catch ticks that landed via direct push).
#
# Reads: docs/observe-events/*.json (the durable event log)
# Writes: data/tick-history.json (the append-only metrics ledger)
# Served by: GitHub Pages at /data/tick-history.json (same-origin fetch)
#
# The data contract (from the design handoff):
#   Frame shape: { t, action, mode, agent, entropy_state, entropy_heat, duration_ms }
#   The file IS the ledger. Append-only. CI never deletes frames.
#   Pages auto-deploys on push → readers see fresh data on next fetch.

name: tick-metrics

on:
  push:
    branches: [main]
    paths:
      - 'docs/observe-events/**'
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:

permissions:
  contents: write  # needs write to commit the metrics frame

jobs:
  append-metrics:
    name: append tick metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history for accurate event counting

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Compute and append metrics frame
        run: bun src/Core.TypeScript/observe/tick-metrics-writer.ts

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tick-history.json data/tick-latest.json
          if git diff --cached --quiet; then
            echo "No new metrics to commit."
          else
            git commit -m "metrics: append tick frame [skip ci]"
            # Rebase before pushing. This job runs every 15 minutes and appends to
            # data/tick-*.json; the fleet pushes to main continuously, so a bare
            # `git push` loses the race and fails non-fast-forward — which is exactly
            # what happened on 8b4273ca9 (run 31428773872). Not a code failure: the
            # frame was computed correctly and simply could not land.
            #
            # Rebase rather than merge: this lane only ever appends generated metric
            # frames, so a merge commit here is pure noise. Matches lockfile-healer.yml
            # and drift-sweep.yml, which already do this; tick-metrics was the one
            # commit-back workflow still pushing bare.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
