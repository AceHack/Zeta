name: chart-version-refresh

# THE NETWORK HALF of the ArgoCD chart-resolvability check, deliberately kept
# out of every PR-blocking lane — and the lane that answers the SECOND question,
# currency.
#
# `src/Core.TypeScript/hygiene/audit-chart-target-revisions.ts` resolves every
# `targetRevision` in full-ai-cluster/k8s/applications against a CHECKED-IN
# snapshot of what each upstream repository publishes. That offline half runs in
# gate.yml's cross-verify floor and opens no socket. This workflow is the other
# half: it re-fetches all ~35 coordinates from their registries and rewrites
# `src/Core.TypeScript/hygiene/published-chart-versions.json`.
#
# WHY THE SPLIT IS THE WHOLE DESIGN. A resolvability check that talks to twelve
# third-party registries on every PR reddens unrelated changes the first time
# any one of them has a bad afternoon, and gets deleted the week after. So the
# blocking lane reads a file and this lane touches the network — and this lane
# is ALLOWED TO FAIL. A registry outage here delays a snapshot update and blocks
# nobody.
#
# WHAT THE EXIT CODE MEANS. `--refresh` returns 1 when the snapshot actually
# CHANGED — the signal that the diff needs committing — and 0 otherwise. It does
# NOT open a PR: the snapshot is evidence, and the run's artifact is reviewed
# before it becomes the thing the blocking lane trusts.
#
# It deliberately does NOT return 1 merely because a fetch failed. Two
# coordinates in this tree are permanently unreachable (wrong repoURLs,
# 081M0JX4M7H087G0R0029R5QG6), so that rule would have made this lane red on
# every run from the day it landed — and a lane nobody can ever see go green is
# a lane nobody reads. The same reasoning is why `fetchedAt` alone is not a
# change (sameIgnoringTimestamps): a signal that is always on carries no
# information. Unreachable coordinates are still printed here, and the offline
# audit names them as findings on every PR.
#
# WHY CURRENCY RIDES THIS LANE RATHER THAN GETTING ITS OWN. Resolvability
# ("does this pin resolve?") and currency ("how far behind is it, and is
# upstream still alive?") are different questions, but they are answered from
# the SAME bytes: a Helm `index.yaml` carries `version` and `created` side by
# side, so the publish dates cost this job zero additional requests and zero
# additional schedule. `--refresh` writes both snapshots from one pass, and the
# report below is rendered offline from them.
#
# AND CURRENCY IS NOT A GATE ANYWHERE. On the day it landed, 34 of 35 pins in
# this tree were behind upstream and 14 crossed a major. A check on that would
# be red from birth and learned-to-ignore within a week. So it is a report: a
# committed generated file whose diff shows drift, plus the job summary below.
# The only failure `--check` can produce is "the committed report no longer
# matches the committed data", which one command fixes.
#
# Composes with:
#   src/Core.TypeScript/hygiene/audit-chart-target-revisions.ts  (both halves)
#   src/Core.TypeScript/hygiene/published-chart-versions.json    (the snapshot)
#   src/Core.TypeScript/hygiene/published-chart-dates.json       (publish dates)
#   src/Core.TypeScript/hygiene/report-chart-currency.ts         (the currency report)
#   docs/CHART-CURRENCY.md                                       (its committed output)
#   .github/workflows/gate.yml  cross-verify                     (the offline lane)
#   081M0JVD5YG087G0R002QDFR9H (the oz pin) · 081M0JX4M7H087G0R0029R5QG6 (the two
#   unreachable repoURLs this lane's first run found)

on:
  schedule:
    # Weekly Sundays 17:07 UTC — off-the-hour weekend slot, clear of
    # budget-snapshot-cadence (16:23) and git-hotspot-cadence (16:43), per the
    # thundering-herd convention in budget-snapshot-cadence.yml.
    - cron: "7 17 * * 0"
  workflow_dispatch: {}
  pull_request:
    # Self-test only: a change to the tool or this workflow should prove the
    # network path still works before it is trusted on a schedule. This job is
    # NOT in the required set, so a registry flake here cannot block a merge.
    paths:
      - "src/Core.TypeScript/hygiene/audit-chart-target-revisions.ts"
      - "src/Core.TypeScript/hygiene/chart-publish-dates.ts"
      - "src/Core.TypeScript/hygiene/report-chart-currency.ts"
      # The image-provenance network half rides this lane, so a change to it
      # must self-test here for the same reason the chart tools do.
      - "src/Core.TypeScript/cluster/image-source-provenance.ts"
      - ".github/workflows/chart-version-refresh.yml"

permissions:
  contents: read
  # The image-provenance half reads the GHCR packages API to tell "ours, private"
  # (flip visibility) from "ours, never published" (build and push it) -- two
  # opposite remedies. Read-only, and least-privilege: nothing here writes a
  # package. Without it the step degrades honestly rather than failing, recording
  # `packagePresence: unreadable` on new rows and preserving what an
  # authenticated run already measured on existing ones.
  packages: read

concurrency:
  group: chart-version-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh the chart snapshots from upstream registries, then report currency
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        env:
          # mise release-metadata calls authenticate (1000/hr) instead of anonymous (60/hr 403 flake)
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      # Exit 1 means either "the snapshot changed" or "a registry was
      # unreachable". Both are things a human should look at and neither is a
      # reason to block anyone's merge, which is why this job is not required.
      #
      # There is deliberately NO `continue-on-error` on THIS step, and the step
      # name must not imply one — the step going red IS the output, and a green
      # step would be a check that did not run wearing a check that passed.
      # Note the contrast with "Currency report drift" below, which does carry
      # the flag: that one is allowed to fail in the literal sense. Here,
      # "does not block" means only that the JOB is outside the required set,
      # so the red stays visible without gating anyone's merge.
      - name: Refresh the published-version snapshot (network; red here is the signal, non-required job)
        run: bun src/Core.TypeScript/hygiene/audit-chart-target-revisions.ts --refresh

      # Always uploaded, including on the failing path — the diff IS the output.
      - name: Upload the refreshed snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-chart-versions-${{ github.run_id }}
          path: src/Core.TypeScript/hygiene/published-chart-versions.json
          if-no-files-found: error
          retention-days: 90

      # The refreshed snapshot re-run through the OFFLINE audit. This is what
      # turns a version list into a verdict: if upstream unpublished something
      # a manifest pins, or an acknowledgement has outlived its defect, this is
      # where it shows up — days before it would otherwise reach anyone.
      - name: Re-audit against the freshly refreshed snapshot
        if: always()
        run: bun src/Core.TypeScript/hygiene/audit-chart-target-revisions.ts

      # DRIFT, not currency. This step CANNOT fail because a chart is out of
      # date — being behind is a standing condition and is never an error here.
      # It fails for exactly one reason: docs/CHART-CURRENCY.md no longer
      # matches what the committed snapshots render, i.e. the generated file is
      # stale and one command fixes it. Non-blocking like everything in this
      # job.
      - name: Currency report drift (is the committed report stale?)
        if: always()
        continue-on-error: true
        run: bun src/Core.TypeScript/hygiene/report-chart-currency.ts --check

      - name: Regenerate the currency report from the refreshed snapshots
        if: always()
        run: bun src/Core.TypeScript/hygiene/report-chart-currency.ts --write

      # The recurring surface Aaron asked for: the whole report in the run
      # summary, so a reader sees the state without cloning anything. It is the
      # same bytes as the committed file — one renderer, no second format to
      # drift.
      - name: Publish the currency report to the job summary
        if: always()
        run: cat docs/CHART-CURRENCY.md >> "$GITHUB_STEP_SUMMARY"

      # Uploaded beside the version snapshot, on the failing path too: when the
      # committed report is stale, THIS is the file that replaces it.
      - name: Upload the currency report and the publish-date snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-currency-${{ github.run_id }}
          path: |
            docs/CHART-CURRENCY.md
            src/Core.TypeScript/hygiene/published-chart-dates.json
          if-no-files-found: error
          retention-days: 90

      # THE SECOND NETWORK HALF, riding this lane rather than earning its own schedule.
      # `src/Core.TypeScript/cluster/image-source-provenance.ts` gates every PR OFFLINE against
      # `full-ai-cluster/k8s/image-source-provenance.json`; this re-measures every image
      # reference in the tree as an ANONYMOUS client would -- which is the whole predicate:
      # can someone who cloned this public repository actually pull what its manifests name?
      #
      # Here rather than in its own workflow for the same reason currency is: a second cron buys
      # nothing. The two answer different questions off different endpoints, but both are "ask
      # upstream what it publishes", both are non-blocking, and both write a committed snapshot
      # whose DIFF is the signal.
      #
      # `if: always()` IS LOAD-BEARING, and it was learned the expensive way. These two steps
      # first landed WITHOUT it, sitting immediately after "Refresh the published-version
      # snapshot" -- which exits 1 by design whenever upstream published anything, i.e. most
      # runs. Measured on run 32652872721: both steps `skipped`, the job red for the chart
      # step's reason, and nothing anywhere saying the image half had not run. That is this
      # repository's own organising failure -- a check that did not run looking exactly like one
      # that passed -- committed inside a change whose entire purpose is to refuse that shape.
      # `continue-on-error` does NOT fix it: it governs a step's own failure, never a prior
      # step's. So they moved to the end of the `if: always()` block, beside the chart lane's
      # own re-audit.
      #
      # No `continue-on-error`, matching this job's stated convention: red here IS the output.
      # `--refresh` exits 1 when the snapshot CHANGED, which on this lane means "the provenance
      # moved, commit the diff", and the job is outside the required set so that red blocks
      # nobody's merge.
      #
      # It uses `gh` for the GHCR packages API (the route the original FlowDent investigation
      # took) and degrades honestly without it: `packagePresence` is recorded `unreadable`,
      # never `absent`, so an unauthenticated run cannot invent the difference between a private
      # package and a missing one.
      - name: Refresh the image-provenance snapshot (network; anonymous pull is the measurement)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun src/Core.TypeScript/cluster/image-source-provenance.ts --refresh

      # The refreshed provenance re-run through the OFFLINE gate. A package that went private,
      # or an acknowledgement that has outlived its defect, shows up HERE -- in the lane allowed
      # to be red -- rather than reaching the next contributor to touch an unrelated file.
      - name: Re-audit image provenance against the freshly refreshed snapshot
        if: always()
        run: bun src/Core.TypeScript/cluster/image-source-provenance.ts

      # Uploaded on the failing path too: when the committed provenance is stale, THIS is the
      # file that replaces it.
      - name: Upload the refreshed image-provenance snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-source-provenance-${{ github.run_id }}
          path: full-ai-cluster/k8s/image-source-provenance.json
          if-no-files-found: error
          retention-days: 90
