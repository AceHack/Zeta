# Watchdog: has the agent-heartbeat lane SUCCEEDED recently?
#
# WHY A SEPARATE WORKFLOW AND NOT ANOTHER STEP IN agent-heartbeat.yml.
#
# agent-heartbeat.yml already carries "Measure cadence (declared vs actual — detect silent
# degradation)". That step sits inside the heartbeat job, downstream of "Accumulate unflushed
# heartbeat state over current main", with no `if:` — so it inherits the default `success()`
# gate. Between 2026-08-16T23:05Z and 2026-08-17T00:49Z the accumulate step failed on every
# tick and the cadence step was `skipped` on every one of them. The check built to detect
# silent degradation is switched off by the degradation. It speaks only while the thing it
# watches is healthy.
#
# It also cannot see the other failure mode. It reads docs/observe-events/*.json from inside a
# run, so it only ever measures ticks that HAPPENED. GitHub delays and DROPS scheduled runs
# under load — measured on this repo over 2026-08-16T00:19Z..2026-08-17T00:49Z, the lane fired
# 84 scheduled runs against the 100 slots a 15-minute cron declares (16% dropped), with
# inter-run gaps of 12..43 minutes (p50 16, p90 27) and whole hours reduced to one or two runs.
# When a slot is dropped there is no run, and nothing that only executes inside a run can
# notice. An outage made of runs NOT HAPPENING is invisible from inside the lane.
#
# Cron punctuality is not the defect and is not fixable from here — GitHub's scheduler is
# best-effort by documented design, and a dropped tick is recoverable because the lane carries
# its unflushed state forward. The defect is that a missed tick is SILENT, so a recoverable
# 15-minute gap and an unrecoverable multi-hour outage look identical from the outside. This
# workflow makes only the second one loud.
#
# LEVEL-TRIGGERED, NEVER EDGE-TRIGGERED. It asks "how old is the newest success?" rather than
# "did a tick just land?". That distinction is what keeps the watchdog correct when its OWN
# cron slot is dropped — the same GitHub behaviour it is watching for applies to this workflow
# too. A level check that runs late still gives the right answer; an edge check would miss the
# edge and go quiet, reproducing the bug it exists to catch.
#
# The threshold is 60 minutes, sized off measured behaviour rather than the declared 15: the
# worst observed healthy gap was 43 minutes, so anything at or below that fires on GitHub's
# normal jitter, and an alarm that cries wolf gets muted — a slower way of having no alarm.
# 60 is four consecutive missed slots.

name: heartbeat-liveness

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      stale_after_minutes:
        description: "Minutes without a successful heartbeat before this fails"
        required: false
        default: "60"

permissions:
  actions: read # read agent-heartbeat run history — the whole input to the verdict
  issues: write # raise/refresh the tracking issue so the alarm survives outside Actions
  # WRITE, AS OF 2026-08-27, AND EXACTLY WHAT IT CAN AND CANNOT REACH.
  #
  # This is the workflow's own scoped GITHUB_TOKEN, the same grant `agent-heartbeat.yml` already
  # holds. It is used for ONE thing: `git push origin HEAD:liveness/observations`. It provably
  # cannot reach `main`, and that is a property of the repository rulesets rather than of this
  # workflow's good behaviour — verified against the live API on 2026-08-27:
  #
  #   `CI Gate` (required_status_checks) has conditions.ref_name.include == ["~DEFAULT_BRANCH"],
  #   and its ONLY bypass actor is RepositoryRole 5 with bypass_mode `pull_request`. GITHUB_TOKEN
  #   is not that actor, and even that actor cannot push to `main` without a PR.
  #
  # So this grant buys the ability to write a non-default ref and nothing else. It is not the
  # bypass actor that a literal "observations land as commits ON main" would require; that would
  # be a credential able to push anything to `main`, enforced only by its own source code, and it
  # is a security decision for the maintainer rather than a workflow edit.
  contents: write

concurrency:
  group: heartbeat-liveness
  # SAFE TO CANCEL HERE, unlike the heartbeat lane. Every run recomputes the same level from
  # scratch, so a newer check strictly supersedes an older queued one.
  #
  # STILL TRUE AFTER THE LEDGER (2026-08-27), and worth stating because the ledger DOES write
  # commits, which contradicts the sentence this comment used to carry. Cancelling a run mid-write
  # loses that run's record, and a lost record reads as a gap — which is exactly what it was: a
  # cancelled run did not observe anything. The ledger is append-only and keyed per run, so a
  # superseded write is never half-applied and never double-counted.
  cancel-in-progress: true

jobs:
  check:
    name: No successful heartbeat in N minutes?
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Lane evidence is read from commit history, so the default depth-1 checkout cannot
          # answer the question. Depth 0 costs a fuller clone on a 5-minute job; that is the
          # price of the watchdog being able to see ticks it did not schedule.
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Fetch agent-heartbeat run history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Unfiltered by event on purpose: a manual workflow_dispatch that succeeds is still
          # proof the lane can produce a good tick, and suppressing it would raise a false alarm
          # during exactly the manual recovery a real outage triggers.
          #
          # NOT piped through `|| echo '[]'`. If this call fails the step must fail here, where
          # the cause is legible, rather than handing the assessor an empty array — which it
          # would correctly but misleadingly report as "the lane is stopped", a real-looking
          # finding nobody actually observed.
          gh api "repos/${REPO}/actions/workflows/agent-heartbeat.yml/runs?per_page=50" > runs.json
          echo "fetched $(bun -e 'console.log(JSON.parse(require("fs").readFileSync("runs.json","utf8")).workflow_runs.length)') runs"

      - name: Collect lane tick evidence (every source, not just Actions)
        # WHY THIS STEP EXISTS. The step above asks GitHub whether GitHub ran a job. That is the
        # provider's job status, and it is not the same question as "did a tick happen" -- the two
        # were measured coming apart in BOTH directions on 2026-08-25:
        #
        #   FALSE ALARM at 17:11Z: the assessor exited 1 with "NO SUCCESSFUL agent-heartbeat IN
        #   102 MINUTES" while heartbeat/alexa carried a tick 22 minutes old. The run that
        #   produced that tick went red at a LATER step, so its conclusion was not `success`.
        #
        #   FALSE GREEN, structurally: agent-heartbeat.yml runs its tick body under `|| echo` and
        #   its commit step succeeds on an empty stage, so a run can conclude `success` having
        #   committed nothing at all.
        #
        # And a tick from any substrate that is not GitHub Actions contributes ZERO rows to the
        # runs list, so it could never have turned this check green -- which made the watchdog the
        # hardest GitHub coupling in the fleet, harder than the workflow it watches.
        #
        # ADDITIVE ONLY. A lane holds just UNFLUSHED ticks (the preparer resets it over main every
        # tick), so a flush that just landed legitimately leaves a lane empty. Absence here is NOT
        # evidence of death, and `assessFleetLiveness` is written so it cannot become one.
        #
        # COST: one extra fetch of the heartbeat refs on a job that already runs every 15 minutes.
        run: |
          set -euo pipefail
          # Lanes are fetched explicitly: they are not part of the default refspec, and reading
          # origin/main alone under-reports liveness by up to a flush interval.
          git fetch --quiet origin "+refs/heads/heartbeat/*:refs/remotes/origin/heartbeat/*"
          # Every lane, not a hardcoded roster -- a new tick source must become visible by
          # EXISTING, not by someone remembering to add it to a list here.
          refs=$(git for-each-ref --format="%(refname)" "refs/remotes/origin/heartbeat/*")
          echo "[evidence] lanes discovered:"
          echo "$refs"
          # shellcheck disable=SC2086
          bun src/Core.TypeScript/agent-heartbeats/lane-tick-evidence.ts $refs > lane-evidence.json
          echo "[evidence] observations: $(bun -e 'console.log(JSON.parse(require("fs").readFileSync("lane-evidence.json","utf8")).length)')"

      - name: Assess liveness
        id: assess
        env:
          STALE_AFTER_MINUTES: ${{ github.event.inputs.stale_after_minutes || '60' }}
        run: |
          set -euo pipefail
          # Exits non-zero when the lane is not alive. That non-zero IS the alarm — this step is
          # deliberately not `continue-on-error`, because a watchdog that cannot turn the run red
          # reports nothing a human will ever see.
          # Third argument is the lane evidence. Without it this is the single-source check it
          # has always been; with it, "alive" means at least one tick source ticked, whichever one.
          bun src/Core.TypeScript/agent-heartbeats/heartbeat-liveness.ts runs.json "$STALE_AFTER_MINUTES" lane-evidence.json \
            | tee liveness.txt

      - name: Record the observation on the liveness ledger (direct push, no PR, no gate)
        # `always()`, AND THAT IS THE WHOLE POINT OF THE STEP.
        #
        # Until 2026-08-27 this workflow's observation was durable only as a check-run annotation,
        # and an annotation is written only when the verdict is bad and only inside the substrate
        # being observed. That gives an observation channel which cannot distinguish "healthy" from
        # "not observing" — the vacuity class, wearing a monitor's costume.
        #
        # So: EVERY run records, including the run that finds nothing wrong, and including the run
        # whose own verdict just failed. `always()` also covers `cancelled()`, which is deliberate —
        # this repo measured 88% of gate runs on `main` cancelled, and a cancelled observer that
        # writes nothing is indistinguishable from one that never started.
        #
        # WHAT THIS STEP DOES NOT DEPEND ON: `gate`, any check, any PR, `main`, or the flush
        # pipeline. It pushes an orphan-history ref with the workflow's own scoped token. Aaron
        # 2026-08-26: "the liveness observations about heartbeats never ever need PRs to get to
        # main." The observer must not depend on the observed.
        #
        # THE HONEST LIMIT, stated rather than papered over: this writer runs inside GitHub Actions,
        # so a run that dies before `Setup bun` writes no record at all, and a total Actions outage
        # stops the writing along with the ticking. Nothing hosted here can fix that. What the
        # ledger fixes is that such a gap becomes READABLE — because the healthy case is also
        # written, `liveness-ledger.ts read` computes the age of the newest record and answers
        # "is anyone still observing?" from a clone, with no call to the provider in question.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          STALE_AFTER_MINUTES: ${{ github.event.inputs.stale_after_minutes || '60' }}
          LEDGER_BRANCH: liveness/observations
        run: |
          set -euo pipefail
          LEDGER_DIR="${RUNNER_TEMP}/liveness-ledger"
          rm -rf "$LEDGER_DIR"
          mkdir -p "$LEDGER_DIR"

          # A SEPARATE REPOSITORY, not a worktree of the checkout. Two reasons, both load-bearing:
          # the checkout was made with `persist-credentials: false` and must stay that way, and an
          # orphan ledger has no business sharing an index, a HEAD, or a COMMIT_EDITMSG with the
          # tree it is reporting on.
          git init -q "$LEDGER_DIR"
          git -C "$LEDGER_DIR" config user.name "heartbeat-liveness[bot]"
          git -C "$LEDGER_DIR" config user.email "heartbeat-liveness[bot]@users.noreply.github.com"
          git -C "$LEDGER_DIR" remote add origin "${GITHUB_SERVER_URL}/${REPO}.git"
          # Token as an auth header, never in the remote URL — `git remote -v` and any error
          # message that echoes the URL would otherwise carry the credential.
          git -C "$LEDGER_DIR" config "http.${GITHUB_SERVER_URL}/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          # ABSENT REF IS THE FIRST OBSERVATION, NOT AN ERROR. Depth 1: the append only ever needs
          # the current tip, and fetching the ledger's whole history every 15 minutes would make
          # the recorder slower the longer it has been working.
          if git -C "$LEDGER_DIR" fetch --quiet --depth=1 origin "$LEDGER_BRANCH"; then
            git -C "$LEDGER_DIR" reset -q --hard FETCH_HEAD
            echo "[liveness-ledger] appending to $LEDGER_BRANCH @ $(git -C "$LEDGER_DIR" rev-parse --short HEAD)"
          else
            echo "[liveness-ledger] $LEDGER_BRANCH does not exist yet — starting the orphan ledger"
          fi

          # Recomputes the verdict from the SAME arrays the alarm used, rather than scraping
          # liveness.txt: a second, weaker parser could drift from the verdict and nothing would
          # detect it. Missing inputs produce a `blind` record — never silence.
          bun src/Core.TypeScript/agent-heartbeats/liveness-ledger.ts record \
            --dir "$LEDGER_DIR" \
            --runs runs.json \
            --evidence lane-evidence.json \
            --threshold "$STALE_AFTER_MINUTES" \
            --run-id "$RUN_ID" \
            --subject-out "${RUNNER_TEMP}/liveness-subject.txt"

          SUBJECT="$(head -n 1 "${RUNNER_TEMP}/liveness-subject.txt")"
          [ -n "$SUBJECT" ] || { echo "::error::[liveness-ledger] recorder produced no commit subject"; exit 1; }

          # Signed as the credential that actually pushes — `github-actions[bot]`, not as any
          # human and not by copying another branch's block. `Human-Review:
          # not-implied-by-credential` because nobody reviewed this observation: it is a machine
          # reading a clock, and saying otherwise would be an attestation the validator's shape
          # check would happily pass and that would be false.
          MSG="${RUNNER_TEMP}/liveness-commit-msg.txt"
          {
            printf '%s\n\n' "$SUBJECT"
            printf 'Recorded by heartbeat-liveness.yml run %s. Direct push to %s: no PR, no gate,\n' "$RUN_ID" "$LEDGER_BRANCH"
            printf 'no dependency on the pipeline this observation may be reporting on.\n\n'
            printf 'Agency-Signature-Version: 1\n'
            printf 'Agent: shadow\n'
            printf 'Agent-Runtime: github-actions/.github/workflows/heartbeat-liveness.yml\n'
            printf 'Agent-Model: none\n'
            printf 'Credential-Identity: github-actions[bot]\n'
            printf 'Credential-Mode: workflow-token\n'
            printf 'Human-Review: not-implied-by-credential\n'
            printf 'Human-Review-Evidence: none\n'
            printf 'Action-Mode: autonomous-fail-closed\n'
            printf 'Task: none\n'
          } > "$MSG"

          # NOT `continue-on-error`. A recorder that cannot write must be loud: exiting 0 having
          # recorded nothing is the silent-success failure this channel exists to remove, and it
          # would be worse than the annotation it replaces because it would look like coverage.
          bun src/Core.TypeScript/agent-heartbeats/liveness-ledger.ts publish \
            --dir "$LEDGER_DIR" \
            --message-file "${RUNNER_TEMP}/liveness-commit-msg.txt"

          # Read the channel back through the same public path a human would use. A write nobody
          # has read back is a claim, not a proof.
          bun src/Core.TypeScript/agent-heartbeats/liveness-ledger.ts read \
            --dir "$LEDGER_DIR" --threshold "$STALE_AFTER_MINUTES" \
            || echo "::warning::[liveness-ledger] the ledger read-back reports the observer stale; the record above still landed"

      - name: Raise or refresh the tracking issue
        # `failure()` only — scoped to this job's own failure so an infrastructure error in
        # checkout/setup does not get reported to humans as a heartbeat outage.
        if: failure() && steps.assess.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A red run in a repo with 60+ workflows is easy to miss, and the heartbeat lane
          # itself is often already red for its own reasons. One deduplicated issue is the
          # surface that survives outside the Actions tab.
          summary="$(head -n 1 liveness.txt 2>/dev/null || echo '[heartbeat-liveness] lane not alive')"
          title="heartbeat-liveness: the agent-heartbeat lane has stopped succeeding"

          if ! gh label create heartbeat-liveness \
            --repo "$REPO" \
            --description "Raised by heartbeat-liveness.yml when no agent-heartbeat run has succeeded within the threshold" \
            --color "B60205" 2>label_err.txt; then
            # Only "already exists" is benign. Permission and rate-limit failures must surface,
            # not be swallowed into a silent no-op.
            grep -q "already exists" label_err.txt || { cat label_err.txt >&2; exit 1; }
          fi

          existing="$(gh issue list --repo "$REPO" --label heartbeat-liveness --state open --limit 1 --json number --jq '.[0].number // empty')"
          body="$(printf '%s\n\nWatchdog run: %s\n\nThe lane carries unflushed state forward, so a single dropped tick is recoverable and this threshold is set well above GitHub'"'"'s normal scheduling jitter (worst healthy gap measured: 43min). This firing means successes have stopped, not merely that a tick was late.\n\nThis issue does not auto-close. Close it once heartbeats are succeeding again.\n' "$summary" "$RUN_URL")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" --label heartbeat-liveness
          fi
