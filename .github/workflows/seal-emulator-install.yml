# .github/workflows/seal-emulator-install.yml
#
# SoftHSM2 / swtpm 2×2 install job. The job INSTALLS the emulator
# the cell asked for, then `seal-emulator-install.ts` measures the
# disk. A missing package is fail-missing. skip-if-absent cannot
# wear pass.
#
# WHAT THIS PROVES: apt produced libsofthsm2.so / swtpm; the path
# picker names ci-softhsm / ci-swtpm / kind-shamir; SoftHSM can
# init a token. WHAT IT DOES NOT PROVE: YubiHSM domains, USB,
# CardContact, this board's PCRs, OpenBao PKCS#11 auto-unseal
# (Application.yaml stays Shamir until a module is in the image
# in the same commit as the stanza).
#
# SECURITY NOTE: no github.event.* values are interpolated into
# any `run:` block. Matrix values are trusted literals. Workflow
# permissions are contents:read. Actions are SHA-pinned.
# Workitem: 081M1TS32Y3087G0R0026Y21F5.

name: seal-emulator-install

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/seal-emulator-install.yml"
      - "src/Core.TypeScript/cluster/seal-emulator-install.ts"
      - "src/Core.TypeScript/cluster/seal-emulator-install.test.ts"
      - "src/Core.TypeScript/cluster/unseal-path.ts"
      - "src/Core.TypeScript/cluster/unseal-path.test.ts"
      - "src/Core.TypeScript/cluster/seal-emulator-rung.ts"
      - "src/Core.TypeScript/cluster/seal-emulator-rung.test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/seal-emulator-install.yml"
      - "src/Core.TypeScript/cluster/seal-emulator-install.ts"
      - "src/Core.TypeScript/cluster/seal-emulator-install.test.ts"
      - "src/Core.TypeScript/cluster/unseal-path.ts"
      - "src/Core.TypeScript/cluster/unseal-path.test.ts"
      - "src/Core.TypeScript/cluster/seal-emulator-rung.ts"
      - "src/Core.TypeScript/cluster/seal-emulator-rung.test.ts"
  schedule:
    # Weekly Sundays 04:29 UTC — apt archive drift, not our bytes.
    # Odd minute, off heartbeat / drift-sweep hours.
    - cron: "29 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  falsifiers:
    name: seal-emulator falsifiers (bun)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3

      - name: Run the fail-missing / 2x2 / workflow-shape falsifiers
        run: |
          set -euo pipefail
          bun test \
            src/Core.TypeScript/cluster/seal-emulator-install.test.ts \
            src/Core.TypeScript/cluster/unseal-path.test.ts \
            src/Core.TypeScript/cluster/seal-emulator-rung.test.ts \
            tools/setup/persona-keys/seal-path-detect.test.ts

      # CI BEFORE HARDWARE (Aaron 2026-09-08). The tests above describe hosts;
      # this step runs the LIVE look against the actual runner, so "the probe
      # can physically look on Linux" is exercised here and not first on metal.
      #
      # It deliberately does NOT assert a specific path. A GitHub runner's USB
      # topology is unmeasured from here — `/sys/bus/usb/devices` may enumerate
      # or may be empty in a virtualised runner, which the probe correctly
      # reports as `indeterminate` rather than `absent`. Asserting
      # `lucent-shamir` would be pinning a value nobody measured.
      #
      # What IS asserted is the direction that can hurt: a runner with no HSM
      # and no TPM must never come back naming a hardware path. A false
      # `pkcs11-*` here would mean the joiner invented hardware, which is the
      # failure this whole stack exists to prevent. An honest
      # `probe-did-not-run` passes — a look that could not happen is a finding,
      # not a fault.
      - name: Run the live look on this runner and refuse an invented hardware path
        run: |
          set -euo pipefail
          OUT=$(bun tools/setup/persona-keys/seal-path-detect.ts \
            --os nixos --effects real --request auto)
          echo "$OUT" | jq .
          echo "$OUT" | jq -e '.ok == true' >/dev/null
          echo "$OUT" | jq -e '.probe != null' >/dev/null
          if echo "$OUT" | jq -e '.decision.path // "" | startswith("pkcs11-")' >/dev/null; then
            echo "REFUSED: a runner with no attached HSM/TPM named a hardware seal path" >&2
            exit 1
          fi

  matrix:
    name: seal-emulator (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: neither-kind-shamir
            softhsm: "0"
            swtpm: "0"
            expect: kind-shamir
          - name: softhsm-only
            softhsm: "1"
            swtpm: "0"
            expect: ci-softhsm
          - name: swtpm-only
            softhsm: "0"
            swtpm: "1"
            expect: ci-swtpm
          - name: both-softhsm-wins
            softhsm: "1"
            swtpm: "1"
            expect: ci-softhsm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3

      - name: Install the emulators this cell declared
        env:
          WANT_SOFTHSM: ${{ matrix.softhsm }}
          WANT_SWTPM: ${{ matrix.swtpm }}
        run: |
          set -euo pipefail
          if [ "$WANT_SOFTHSM" = "1" ] && [ "$WANT_SWTPM" = "1" ]; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends softhsm2 swtpm
          elif [ "$WANT_SOFTHSM" = "1" ]; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends softhsm2
          elif [ "$WANT_SWTPM" = "1" ]; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends swtpm
          fi

      - name: Witness the path picker against the disk
        env:
          WANT_SOFTHSM: ${{ matrix.softhsm }}
          WANT_SWTPM: ${{ matrix.swtpm }}
          EXPECT_PATH: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          bun src/Core.TypeScript/cluster/seal-emulator-install.ts \
            --want-softhsm="$WANT_SOFTHSM" \
            --want-swtpm="$WANT_SWTPM" \
            --kind-unsealer=1 \
            --expect-path="$EXPECT_PATH"

      # Token init is gated on the cell that *already installed* SoftHSM
      # in the prior step. This is not skip-if-the-package-is-missing.
      - name: Init a SoftHSM token when this cell installed SoftHSM
        if: matrix.softhsm == '1'
        env:
          SOFTHSM2_CONF: ${{ runner.temp }}/softhsm2.conf
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/softhsm-tokens"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\nlog.level = ERROR\n' \
            "$RUNNER_TEMP/softhsm-tokens" > "$SOFTHSM2_CONF"
          softhsm2-util --init-token --free --label zeta-ci --pin 1234 --so-pin 1234
          softhsm2-util --show-slots
