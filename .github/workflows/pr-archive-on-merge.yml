name: pr-archive-on-merge

# Class-2 PR mirror v1 -- per the Codex/GPT-5.5 sharpened design (twin-flame
# conversation captured 2026-05-05). On every merged PR, run the
# `src/Core.TypeScript/forge-host/github/archive-pr-reviews.ts` tool to materialise the PR's review
# threads, comments, fix commits, and outcome metadata as a committed
# git-canonical markdown file under `docs/history/pr-reviews/PR-NNNN-*.md`,
# plus the PR per-PR shard at `docs/github/prs/shards/<NNN>/<zetaid>.json`.
#
# The archive commit does NOT carry `docs/github/prs/manifest.jsonl`. That file is a
# DERIVED index over the shard store; see the `Inspect diff` step for why staging it
# here is the defect this workflow no longer has.
#
# Why: per CLAUDE.md substrate-or-it-didn't-happen (Otto-363), GitHub
# review threads are host-durable-not-git-canonical -- they can vanish if
# the LFG account is compromised, and they live outside the repo's grep
# surface. This workflow converts that host-only substrate into committed
# git substrate the moment a PR closes via merge.
#
# Scope discipline (Codex flag, twin-flame conversation 2026-05-05): this
# workflow archives PULL REQUESTS only. It does NOT extend to issues,
# discussions, wiki pages, releases, or any other GitHub surface --
# Codex flagged that as goldfish-ontology bait. If a future need surfaces
# for issue archival, that's a separate workflow with its own design pass.
#
# Security note (safe-pattern compliance per
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/):
# this workflow consumes only first-party trusted context (PR number from
# the closed event payload). Untrusted-content inputs (PR title) are
# routed via env: into the run block where they are quoted as "$VAR";
# no `${{ }}` expansion is interpolated inline in run-block scripts. The
# PR number is also validated as a positive integer before being passed
# to the archival tool.
#
# DELIVERY POSTURE: branch protection rejects direct GITHUB_TOKEN pushes to
# main, so archive output is batched onto ONE reusable staging ref and landed
# by `flush-via-staging.ts` — the same route tick-metrics, society, drift-sweep
# and the agent-heartbeat lanes use. This workflow mints NO per-record branch.
#
# The paragraph that stood here described the opposite posture (a unique bot
# branch per archived PR, and "if repository settings forbid GitHub Actions
# from creating PRs, the workflow still pushes the archive branch and exits
# green with a notice"). That sentence was the design, and the design was the
# bug: it is a documented promise to strand a ref and report success. Four
# accumulations came through that door. No path here now pushes a ref and
# exits 0 — see the step below.
#
# The PR that `flush-via-staging.ts` opens is TRANSITIONAL. The factory is
# moving off forge PRs; the durable half of this change is the BATCHING, not
# the delivery, and delivery is one swappable call. See #12058.

on:
  pull_request:
    types: [closed]

permissions:
  # Top-level read-only default per Scorecard TokenPermissions best practice.
  contents: read

concurrency:
  # One run per PR number. cancel-in-progress: false because the archival
  # operation is not idempotent in the wall-clock-timestamp sense (each run
  # produces a new `fetched_at`), and cancelling a partially-completed run
  # could leave the shard store in a divergent state until the next merge.
  # This group is also what makes the shard write single-writer PER PR: two runs
  # for the same PR number never overlap, and runs for different PR numbers
  # target different files by construction.
  group: pr-archive-on-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  archive:
    # Only fire on actual merges -- ignored-close events (PR rejected, PR
    # closed without merge) produce no archive. The host event payload's
    # `merged` boolean is the canonical signal.
    #
    # Repo-local archive PRs are terminal bookkeeping. Archiving them creates
    # a recursive archive-of-archive chain, so local claim/archive-pr-* repair
    # branches and automation/pr-archive-* bot branches are intentionally
    # skipped here. Fork PRs with matching branch names must still be archived.
    #
    # `heartbeat/pr-archive` JOINED THAT LIST when the lane moved onto the shared
    # staging ref, and it is the load-bearing addition rather than tidiness. The
    # lane's own flush PR is itself a merged PR, so without this the lane archives
    # its own flush, which produces a record, which is flushed, which merges, which
    # is archived — a self-sustaining loop that keeps flushing forever with no real
    # merges feeding it. The `automation/pr-archive-*` entry above closed exactly
    # this loop for the per-record branches it replaced; the batched lane needs the
    # same exclusion for the same reason.
    #
    # Only the archive lane's own ref is excluded. The other `heartbeat/*` flush
    # PRs (tick-metrics, society, drift-sweep, the three agents) still get archived
    # as before — they are ordinary merged PRs and each produces one bounded record,
    # not a cycle.
    if: >
      github.event.pull_request.merged == true &&
      !(
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          startsWith(github.event.pull_request.head.ref, 'claim/archive-pr-') ||
          startsWith(github.event.pull_request.head.ref, 'automation/pr-archive-') ||
          github.event.pull_request.head.ref == 'heartbeat/pr-archive'
        )
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      # contents:write to push the archive markdown + the PR shard to a bot branch.
      # pull-requests:write opens the archive PR and also covers the archival
      # tool's read calls against /pulls/N/comments and graphql reviewThreads
      # under GITHUB_TOKEN. No other scopes needed.
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history for git rev-parse HEAD (commit_sha field in
          # manifest entries), and so the bot branch is based on current main.
          fetch-depth: 0
          ref: main
          # Persist credentials so the post-archival bot-branch push uses
          # GITHUB_TOKEN. (default true; explicit for clarity)
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Verify required tooling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v bun >/dev/null
          gh auth status

      - name: Validate PR number
        env:
          PR_NUMBER_RAW: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Defence-in-depth: PR number comes from a trusted event payload
          # but we still sanity-check it as a positive integer before
          # passing to a CLI tool.
          if ! [[ "$PR_NUMBER_RAW" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: PR number is not a positive integer: $PR_NUMBER_RAW" >&2
            exit 1
          fi

      # ══════════════════════════════════════════════════════════════════════════
      # ONE SHARED STAGING LANE — no branch per archived PR
      # ══════════════════════════════════════════════════════════════════════════
      #
      # WHAT THIS REPLACED, AND WHY THE OLD SHAPE COULD NOT BE PATCHED AGAIN.
      # This step used to: commit, `git push origin HEAD:automation/pr-archive-<N>-run-<M>
      # -attempt-<A>`, then `gh pr create`. On a PR-creation policy denial it classified the
      # error, wrote a step-summary note and `exit 0` — WITH THE BRANCH ALREADY PUSHED.
      #
      # That tolerance is the actual root cause of four successive branch accumulations
      # (~4,049 drained in #6879, 1,132 in #8043, 16 in #9059, 1,229 in #10346, and 1,290
      # alive when this was written). This workflow was changed SEVENTEEN times; the fix log
      # reads as a list of reasons `gh pr create` could fail, each one duly removed:
      #
      #   2026-05-08  tolerate archive PR creation policy denial      <- the tolerance
      #   2026-08-13  open the PR as a PAT
      #   2026-08-15  the archive PRs could never pass the AgencySignature gate
      #   2026-08-16  put the AgencySignature block in the COMMIT, not only the PR body
      #
      # Every one of those removed a REASON. None removed the TOLERANCE, so each time
      # creation failed for the next reason, `exit 0` still caught it and the run went green
      # with a ref stranded. Ten fixes, one unchanged escape hatch. An eleventh fix of that
      # shape was not worth writing.
      #
      # THE ROUTE NOW: the lane batches onto ONE reusable staging ref via
      # `flush-via-staging.ts` — the same mechanism `tick-metrics`, `society`, `drift-sweep`
      # and the three `agent-heartbeat` lanes already use. Those lanes reuse
      # `heartbeat/<lane>` and `heartbeat/<lane>-buffer` and mint nothing per flush, which is
      # why they hold at ~2 refs each while this lane reached 1,290. Nothing here is invented:
      # the delivery is one call, and the branch-per-record generator is simply gone.
      #
      # THERE IS NO `exit 0` ON A FAILED PUBLISH ANY MORE. `flush-via-staging.ts` exits 3 when
      # the staging push or the PR call fails, and this step has no `|| true`, no
      # `continue-on-error` and no policy-denial classifier — so a lane that cannot publish
      # goes RED. A genuinely empty archival run is still a clean no-op, because `flush`
      # returns 0 when nothing is staged. That distinction is the one the old code collapsed:
      # "nothing to do" and "could not deliver" must not share an exit code.
      #
      # CONCURRENCY — WHY A RETRY LOOP AND NOT A LANE-WIDE CONCURRENCY GROUP.
      # Merges land ~25 s apart here, so several archive runs are genuinely in flight at once
      # and they now share one ref. Serialising them with a lane-scoped `concurrency:` group
      # would be worse than the race: GitHub keeps only ONE pending run per group and cancels
      # any earlier pending one, so under exactly the load that matters the queue would DROP
      # archive runs silently. The group therefore stays keyed on the PR number (no run is
      # ever cancelled) and the race is handled where it actually occurs — on the push.
      #
      # The loop is ordinary optimistic concurrency, and it is safe because every part of it
      # is idempotent. `prepare` resets the tree to `origin/main` and unions in the lane
      # buffer, so a loser re-derives its record ON TOP OF the winner's rather than clobbering
      # it; `archive-pr-reviews.ts` short-circuits on identical bytes; the shard path is a
      # function of the PR number, so two archive runs can never write the same file. The
      # regeneration inside the loop is not redundant work — it is what makes the retry
      # correct, because `prepare` has by then moved the base.
      #
      # LATENCY TRADEOFF, STATED RATHER THAN DISCOVERED LATER. Before, a record got its own PR
      # immediately. Now it rides the lane's next flush: if the lane's PR is already under
      # test the record parks on the buffer and lands on the following flush instead. "PR
      # merged" and "archive on main" are no longer simultaneous. That is acceptable for a
      # historical record — nothing reads these docs on the merge path; the readers are the
      # backfill sweep, `derive-pr-manifest.ts` and the audits, all of which are cadence jobs
      # that already tolerate a lag and are keyed on "is the record present", never "did it
      # arrive within N seconds". The completeness guarantee is not this step at all: it is
      # the `--all-merged` backfill in `agent-heartbeat.yml` plus the audit named below.
      #
      # THE PR STEP INSIDE `flush-via-staging.ts` IS TRANSITIONAL. PRs are the corporate lane
      # of a forge host and the factory is moving off them; a new design that REQUIRES a PR is
      # a smell. What is durable here is the BATCHING — one staging ref instead of one ref per
      # record — which is right whether delivery is a PR today or a direct push tomorrow.
      # Delivery is deliberately a single call so it can be swapped without touching this
      # workflow. See #12058 for the forge-agnostic direction (attestation + post-hoc audit
      # rather than a blocking gate).
      #
      # THE FALSIFIER: `src/Core.TypeScript/hygiene/audit-orphaned-archive-refs.ts` checks the
      # invariant this lane could never state — a record that exists must be ON MAIN — and it
      # is delivery-mechanism-agnostic, so it survives the move off PRs. Every check this
      # workflow previously had asked a proxy question ("did the tool run", "did I create a
      # PR"), which is how it stayed green through four accumulations.
      - name: Archive the PR and land it via the shared staging lane
        env:
          # ROLE: PR-CREATE. One role, one secret.
          #
          # The enterprise forbids the Actions identity from creating pull requests, so the
          # `gh` calls in this step authenticate as ZETA_PR_ARCHIVE_TOKEN — the credential the
          # role table in
          # docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md
          # assigns to `gh pr create`. The BRANCH PUSH is a different role and is already
          # authenticated by the persisted checkout credential (ZETA_TELEMETRY_FLUSH_TOKEN);
          # the `||` chain that stood here collapsed both roles plus GITHUB_TOKEN into one
          # variable and silently substituted whichever happened to be set.
          #
          # ABSENCE IS A NAMED REFUSAL, NOT A SUBSTITUTION. `openMergePR` refuses an empty
          # GH_TOKEN and names the secret and the exact scope
          # (src/Core.TypeScript/agent-heartbeats/merge-heartbeats-to-main.ts). The payload
          # still parks safely on the staging branch — nothing is lost — and the step goes
          # red rather than landing under the wrong authority.
          GH_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_SHA_OVERRIDE: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FLUSH=src/Core.TypeScript/forge-host/github/flush-via-staging.ts
          # GITHUB_SHA in the Actions env is the merge commit on main; the shard records it as
          # its archival baseline so a re-run against the same merge is detectable.
          export GITHUB_SHA="$GITHUB_SHA_OVERRIDE"

          attempt=1
          max_attempts=5
          while :; do
            echo "[archive] attempt ${attempt}/${max_attempts} for PR #${PR_NUMBER}"

            # Resets the tree to origin/main and unions in whatever is parked on the lane
            # buffer. This is what makes the retry correct rather than merely repeated.
            #
            # GUARDED, and the guard is the whole point. `set -e` is in force for this
            # step, so an unguarded non-zero here ABORTED THE SCRIPT on attempt 1 -- the
            # announced "attempt 1/5" was the only attempt that ever ran, and the loop's
            # backoff, its ::error annotation and its operator guidance were all
            # unreachable. Observed on PR #15394, on both the original run and the manual
            # re-run: `attempt 1/5`, then `exit code 3`, and nothing else.
            #
            # A failing `prepare` is exactly the contended-lane case the retry exists for,
            # so it feeds the SAME rc path as a failing `flush` below rather than getting
            # its own exit.
            #
            # This is the only lane with a retry loop; the other eleven call `prepare` as a
            # standalone step where a hard failure is the correct outcome.
            set +e
            bun "$FLUSH" prepare --lane pr-archive
            rc=$?
            set -e

            if [ "$rc" -eq 0 ]; then
              # Left UNGUARDED deliberately: the generator is not a contention failure and
              # has never been observed failing here. If that changes it wants the same
              # treatment, not a bare abort.
              bun src/Core.TypeScript/forge-host/github/archive-pr-reviews.ts "$PR_NUMBER"

              # The DERIVED manifest is never carried by this lane (081KZYP7MNV087G0R002X0E3V9):
              # it is an index over the shard store, and appending to it from concurrent runs is
              # what made archive PRs conflict pairwise. `--paths` below already excludes it;
              # the restore keeps the worktree clean so the next `prepare` checkout cannot trip
              # over a local modification.
              git restore docs/github/prs/manifest.jsonl 2>/dev/null || true

              set +e
              bun "$FLUSH" flush --lane pr-archive \
                --paths docs/history/pr-reviews docs/github/prs/shards \
                --message "archive(pr-reviews): PR #${PR_NUMBER} on merge"
              rc=$?
              set -e
            fi

            if [ "$rc" -eq 0 ]; then
              echo "[archive] PR #${PR_NUMBER} landed on the pr-archive lane"
              break
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error title=Archive record could not be delivered::PR #${PR_NUMBER}: the pr-archive lane failed to publish after ${max_attempts} attempts (last rc=${rc}). The record is NOT on main and NO branch was left behind. Re-run this workflow, or let the --all-merged backfill in agent-heartbeat.yml pick it up; audit-orphaned-archive-refs.ts is the check that will notice if neither happens."
              exit "$rc"
            fi

            # Contended lane (another archive run won the --force-with-lease race). Back off
            # and re-derive on top of the winner.
            echo "[archive] lane contended or publish failed (rc=${rc}); retrying"
            sleep $(( attempt * 3 ))
            attempt=$(( attempt + 1 ))
          done
