name: pr-archive-on-merge

# Class-2 PR mirror v1 -- per the Codex/GPT-5.5 sharpened design (twin-flame
# conversation captured 2026-05-05). On every merged PR, run the
# `src/Core.TypeScript/forge-host/github/archive-pr-reviews.ts` tool to materialise the PR's review
# threads, comments, fix commits, and outcome metadata as a committed
# git-canonical markdown file under `docs/history/pr-reviews/PR-NNNN-*.md`,
# plus the PR per-PR shard at `docs/github/prs/shards/<NNN>/<zetaid>.json`.
#
# The archive commit does NOT carry `docs/github/prs/manifest.jsonl`. That file is a
# DERIVED index over the shard store; see the `Inspect diff` step for why staging it
# here is the defect this workflow no longer has.
#
# Why: per CLAUDE.md substrate-or-it-didn't-happen (Otto-363), GitHub
# review threads are host-durable-not-git-canonical -- they can vanish if
# the LFG account is compromised, and they live outside the repo's grep
# surface. This workflow converts that host-only substrate into committed
# git substrate the moment a PR closes via merge.
#
# Scope discipline (Codex flag, twin-flame conversation 2026-05-05): this
# workflow archives PULL REQUESTS only. It does NOT extend to issues,
# discussions, wiki pages, releases, or any other GitHub surface --
# Codex flagged that as goldfish-ontology bait. If a future need surfaces
# for issue archival, that's a separate workflow with its own design pass.
#
# Security note (safe-pattern compliance per
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/):
# this workflow consumes only first-party trusted context (PR number from
# the closed event payload). Untrusted-content inputs (PR title) are
# routed via env: into the run block where they are quoted as "$VAR";
# no `${{ }}` expansion is interpolated inline in run-block scripts. The
# PR number is also validated as a positive integer before being passed
# to the archival tool.
#
# PR-based posture: branch protection rejects direct GITHUB_TOKEN pushes
# to main, so this workflow commits archive output to a unique bot branch
# and opens a small PR instead. GITHUB_TOKEN-created PRs may not trigger
# downstream required checks; like budget-snapshot-cadence.yml, this
# workflow therefore opens the PR and leaves merge/auto-merge handling to
# the next maintainer or agent pass through the queue. If repository settings
# forbid GitHub Actions from creating PRs, the workflow still pushes the
# archive branch and exits green with a notice; the next agent pass can open
# that branch as a normal PR without treating the durable archive branch as a
# failed archival run.

on:
  pull_request:
    types: [closed]

permissions:
  # Top-level read-only default per Scorecard TokenPermissions best practice.
  contents: read

concurrency:
  # One run per PR number. cancel-in-progress: false because the archival
  # operation is not idempotent in the wall-clock-timestamp sense (each run
  # produces a new `fetched_at`), and cancelling a partially-completed run
  # could leave the shard store in a divergent state until the next merge.
  # This group is also what makes the shard write single-writer PER PR: two runs
  # for the same PR number never overlap, and runs for different PR numbers
  # target different files by construction.
  group: pr-archive-on-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  archive:
    # Only fire on actual merges -- ignored-close events (PR rejected, PR
    # closed without merge) produce no archive. The host event payload's
    # `merged` boolean is the canonical signal.
    #
    # Repo-local archive PRs are terminal bookkeeping. Archiving them creates
    # a recursive archive-of-archive chain, so local claim/archive-pr-* repair
    # branches and automation/pr-archive-* bot branches are intentionally
    # skipped here. Fork PRs with matching branch names must still be archived.
    if: >
      github.event.pull_request.merged == true &&
      !(
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          startsWith(github.event.pull_request.head.ref, 'claim/archive-pr-') ||
          startsWith(github.event.pull_request.head.ref, 'automation/pr-archive-')
        )
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      # contents:write to push the archive markdown + the PR shard to a bot branch.
      # pull-requests:write opens the archive PR and also covers the archival
      # tool's read calls against /pulls/N/comments and graphql reviewThreads
      # under GITHUB_TOKEN. No other scopes needed.
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history for git rev-parse HEAD (commit_sha field in
          # manifest entries), and so the bot branch is based on current main.
          fetch-depth: 0
          ref: main
          # Persist credentials so the post-archival bot-branch push uses
          # GITHUB_TOKEN. (default true; explicit for clarity)
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Verify required tooling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v bun >/dev/null
          gh auth status

      - name: Validate PR number
        env:
          PR_NUMBER_RAW: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Defence-in-depth: PR number comes from a trusted event payload
          # but we still sanity-check it as a positive integer before
          # passing to a CLI tool.
          if ! [[ "$PR_NUMBER_RAW" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: PR number is not a positive integer: $PR_NUMBER_RAW" >&2
            exit 1
          fi

      - name: Archive PR review substrate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_SHA_OVERRIDE: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GITHUB_SHA in the GHA env is the merge-commit SHA on main; we
          # want that recorded as the shard commit_sha so future re-runs
          # against the same merge can detect "same archival baseline".
          export GITHUB_SHA="$GITHUB_SHA_OVERRIDE"
          bun src/Core.TypeScript/forge-host/github/archive-pr-reviews.ts "$PR_NUMBER"

      - name: Inspect diff
        id: diff
        run: |
          set -euo pipefail
          # Stage the archive markdown + this PR ONE shard. Anything else is noise the
          # archival tool should not be producing.
          #
          # THE DERIVED MANIFEST IS DELIBERATELY NOT STAGED (081KZYP7MNV087G0R002X0E3V9).
          # docs/github/prs/manifest.jsonl is a DERIVED index over the shard store
          # (081KZYMY46P087G0R003S64V2B); staging it here is what made every in-flight archive
          # PR append to the same trailing region of the same file and therefore conflict
          # PAIRWISE. Measured 2026-08-13: 26 open archive PRs, 13 already CONFLICTING.
          # Reproduced with a control at the git level before this change landed:
          #   two archive commits off one base, each appending a manifest line
          #     -> CONFLICT (content) in docs/github/prs/manifest.jsonl
          #   the same two commits writing only their own shard
          #     -> clean merge
          # The shard path is a function of pr_number, so two archive commits can never
          # write the same file and can never conflict. git restore drops the tool side
          # manifest mutation from the worktree so a later git add -a cannot resurrect it.
          #
          # The index is repaired by the serialised single writer in agent-heartbeat.yml
          # (soraya archive duty runs derive-pr-manifest.ts --write); the staleness bound is
          # stated at that step. pr-manifest-integrity.yml is the watchdog that fails loudly
          # if that repair cadence stops running.
          git add docs/history/pr-reviews/ docs/github/prs/shards/
          git restore docs/github/prs/manifest.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "archival produced no diff -- nothing to commit (deterministic-rerun no-op)"
            exit 0
          fi
          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Commit and open archive PR
        if: steps.diff.outputs.changed == 'true'
        env:
          # PR CREATION RUNS AS A PAT, NOT AS ACTIONS — this is the whole fix.
          #
          # The enterprise forbids the Actions identity from creating pull requests
          # (`409: The enterprise does not allow GitHub Actions to create or approve pull
          # requests`, reproduced against the repo API on 2026-08-13). That restriction is on the
          # IDENTITY, not the operation: a fine-grained PAT authenticates as its owner and is not
          # subject to it. So the archive PR opens, and the branch stops orphaning at the source.
          #
          # This is what 1,229 orphaned `automation/pr-archive-*` branches cost — ~3.5 MB of
          # PR-review substrate stranded off main, the FOURTH such accumulation (~4,049 drained in
          # #6879, 1,132 in #8043, 16 in #9059, 1,229 in #10346). Each previous round drained the
          # symptom; this closes the generator.
          #
          # SCOPE: ZETA_PR_ARCHIVE_TOKEN carries `pull_requests: write` + `metadata: read` ONLY.
          # It deliberately does NOT carry `contents: write` — the branch push below is
          # authenticated by actions/checkout's persisted GITHUB_TOKEN credentials and already
          # works — nor `actions`, which belongs to ZETA_SOCIETY_DISPATCH_TOKEN. Two secrets, two
          # authorities: neither can do the other's job if either leaks.
          #
          # FALLBACK: if the secret is absent the expression yields GITHUB_TOKEN, `gh pr create`
          # fails the same way it does today, and `is-pr-create-policy-denial.ts` catches it and
          # exits green with the branch pushed. Removing the secret degrades to the OLD behaviour
          # rather than turning the job red.
          GH_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Configure committer identity for the workflow commit.
          # github-actions[bot] is the canonical workflow identity per
          # the budget-snapshot-cadence.yml convention.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Compose commit message. PR_TITLE is untrusted (PR-author-
          # controlled) so it's only embedded in the markdown body via
          # printf with %s, never interpreted as shell.
          #
          # The AgencySignature block goes in the COMMIT MESSAGE, not only in the
          # PR body below. These archive PRs carry exactly one commit and are
          # auto-merged with squash, so GitHub composes the squash message from
          # THIS string -- a block that exists only in the PR body never reaches
          # main, and `agencysignature (main tip)` then fails on the merge commit.
          # Observed on 63ebc56f7 ("archive(pr-reviews): PR #11119 on merge"),
          # whose whole body was "Archive PR. Auto-merge armed." This is the
          # failure mode .github/PULL_REQUEST_TEMPLATE.md documents from #11002:
          # "Put the block in the COMMIT MESSAGE too, not only here."
          #
          # Values are identical to the PR-body block emitted further down (they
          # describe this workflow, not a human) -- keep the two in step.
          #
          # Trailer-parse safety with untrusted PR_TITLE: the block must be the
          # final paragraph and nothing above it may START a line with `---`
          # (git interpret-trailers treats that as the patch boundary). The title
          # is emitted as "PR title: %s", so the line always begins with the
          # literal label; and GitHub PR titles cannot contain newlines, so an
          # embedded `---` line is not reachable.
          msg="$(printf 'archive(pr-reviews): PR #%s on merge -- run %s\n\nPR title: %s\n\nGenerated by .github/workflows/pr-archive-on-merge.yml\nfrom src/Core.TypeScript/forge-host/github/archive-pr-reviews.ts.\n\nAgency-Signature-Version: 1\nAgent: pr-archive-on-merge\nAgent-Runtime: GitHub Actions\nAgent-Model: bun + git + gh CLI\nCredential-Identity: github-actions[bot]\nCredential-Mode: dedicated-agent\nHuman-Review: not-implied-by-credential\nHuman-Review-Evidence: none\nAction-Mode: autonomous-fail-open\nTask: none\nCo-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>\n' "$PR_NUMBER" "$RUN_ID" "$PR_TITLE")"

          git commit -m "$msg"

          branch="automation/pr-archive-${PR_NUMBER}-run-${RUN_ID}-attempt-${RUN_ATTEMPT}"
          git push origin "HEAD:${branch}"

          body_file="$(mktemp)"
          create_log="$(mktemp)"
          trap 'rm -f "$body_file" "$create_log"' EXIT
          {
            echo "## Summary"
            echo
            echo "- Archive review substrate for merged PR #${PR_NUMBER}"
            echo "- Add docs/github/prs/shards/<NNN>/<zetaid>.json (the derived manifest is regenerated separately)"
            echo
            echo "## Notes"
            echo
            echo "Generated by .github/workflows/pr-archive-on-merge.yml"
            echo "from src/Core.TypeScript/forge-host/github/archive-pr-reviews.ts."
            echo
            echo "PR title: ${PR_TITLE}"
            echo "Workflow run: ${RUN_ID}"
            echo "Workflow attempt: ${RUN_ATTEMPT}"
            # AgencySignature v1 trailer block. Required in the PR BODY by
            # .github/workflows/agencysignature-enforcement.yml for every PR created after
            # FAIL_CLOSED_CUTOVER (2026-08-15T00:00:00Z); this workflow predates the cutover
            # and so emitted archive PRs that failed the gate on creation, every time.
            #
            # Two shape constraints, both load-bearing, both learned the hard way:
            #   * the block must be the LAST contiguous group of trailer lines, with exactly
            #     one blank line before it and ZERO blank lines inside it — including before
            #     Co-authored-by, which is itself a trailer and belongs in the same group.
            #   * nothing above it may start a line with `---`. `git interpret-trailers`
            #     reads a leading `---` as the diff/patch boundary and discards everything
            #     after it, so a markdown horizontal rule anywhere above silently makes a
            #     perfectly well-formed block invisible to the parser.
            #
            # Values describe THIS workflow, not a human: the credential is the Actions bot,
            # nobody reviewed this PR, and it runs unattended — so Human-Review is
            # not-implied-by-credential with no evidence, and the mode is autonomous. Same
            # shape the red-state-flush workflow already emits on its commits.
            echo
            echo "Agency-Signature-Version: 1"
            echo "Agent: pr-archive-on-merge"
            echo "Agent-Runtime: GitHub Actions"
            echo "Agent-Model: bun + git + gh CLI"
            echo "Credential-Identity: github-actions[bot]"
            echo "Credential-Mode: dedicated-agent"
            echo "Human-Review: not-implied-by-credential"
            echo "Human-Review-Evidence: none"
            echo "Action-Mode: autonomous-fail-open"
            echo "Task: none"
            echo "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          } >"${body_file}"

          set +e
          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$branch" \
            --title "archive(pr-reviews): PR #${PR_NUMBER} on merge" \
            --body-file "${body_file}" >"$create_log" 2>&1
          create_status=$?
          set -e

          if [ "$create_status" -eq 0 ]; then
            cat "$create_log"
            exit 0
          fi

          cat "$create_log" >&2
          if bun src/Core.TypeScript/forge-host/github/is-pr-create-policy-denial.ts "$create_log"; then
            {
              echo "### Archive PR creation skipped by repository policy"
              echo
              echo "Archive branch pushed successfully:"
              echo
              echo "\`${branch}\`"
              echo
              echo "GitHub Actions is not permitted to create pull requests in this repository."
              echo "A maintainer or agent pass can open that branch as a normal PR."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::notice title=Archive branch pushed::GitHub Actions cannot create PRs here; open ${branch} manually."
            exit 0
          fi

          exit "$create_status"
