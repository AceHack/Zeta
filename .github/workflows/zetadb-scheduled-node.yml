# zetadb-scheduled-node — fold newly admitted journal events into the durable
# ZetaDB checkpoint.
#
# HOW IT LANDS (changed 2026-08-22 — it previously could not land at all)
# ----------------------------------------------------------------------
# This lane used to end in `git push origin HEAD:main`, wrapped in a five-attempt
# rebase/re-fold/amend retry loop. No attempt could ever have succeeded: ruleset
# "CI Gate" (16134995) makes `gate (required)` a required status check on `main`, and
# a required check is evaluated at PUSH time against the pushed tip, so a commit that
# has never been through a check run is rejected before any check could start:
#
#     remote: - Required status check "gate (required)" is expected.
#
# The lane was nonetheless GREEN on every run, because it exits early with
# "No new database events to checkpoint." and never reached the push. It was green
# for never doing its work — the vacuity class — and the retry loop made it worse,
# not better: five identical rejections would have been read as "sustained
# contention" (081KZM0FTJM) when the true cause is a ruleset that no amount of
# re-deriving can satisfy.
#
# It now lands the way `tick-metrics`, `society` and the three cadences fixed in
# #13808 do: `flush-via-staging.ts` parks the checkpoint on
# `heartbeat/zetadb-scheduled-node` and opens a PR with squash auto-merge armed;
# `gate` runs on the PR and GitHub squashes it onto main.
#
# WHAT HAPPENED TO THE CONVERGENCE LOOP (081KZM0FTJM). Its property is preserved and
# its mechanism is gone, which is the right trade. The property was: never fail on a
# lost push race, RE-DERIVE from whatever main now holds rather than replaying a stale
# diff. `flush-via-staging` gives that structurally — `prepare` resets to `origin/main`
# and unions in anything still parked on the lane's staging branch, the fold below then
# re-derives against exactly that tree, and the staging push is
# `--force-with-lease` onto `heartbeat/*`, a ref no other writer touches. There is no
# compare-and-swap left to lose, so there is no race to retry. It is still convergence
# and still not a distributed lock (§1 scale-free, #6 idempotency).
#
# The flush commit deliberately carries NO `[skip ci]`: on this route it would
# suppress the `pull_request` run of `gate`, the required check would never report,
# and the PR would be unmergeable forever. `flush-via-staging.ts` refuses it outright.

name: zetadb-scheduled-node

on:
  push:
    branches: [main]
    paths:
      - "data/zetadb/journal.json"
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zetadb-scheduled-node
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # pushes the heartbeat/zetadb-scheduled-node staging branch
      pull-requests: write # opens the flush PR that carries the checkpoint onto main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # THIS CHECKOUT'S CREDENTIAL IS THE ONE THAT PUSHES `heartbeat/zetadb-scheduled-node`.
          # ROLE: BRANCH-PUSH. One role, one secret —
          # docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md
          # assigns ZETA_TELEMETRY_FLUSH_TOKEN this role and only this role. Same shape as
          # `lockfile-healer.yml`, which is the lane this one is being brought into line with.
          token: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      # Reset to `origin/main` and union in anything still parked on
      # `heartbeat/zetadb-scheduled-node` from a previous flush whose PR has not landed
      # yet, so the fold below re-derives against the true pending state rather than
      # force-pushing over a checkpoint that is still in flight.
      - name: Prepare staging working tree
        run: bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts prepare --lane zetadb-scheduled-node

      - name: Fold scheduled database journal
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun run run:zetadb-node

      # No hand-rolled `git diff` gate and no hand-echoed AgencySignature block:
      # `flush` stages the path and returns a clean no-op when the fold produced
      # nothing (idempotency, #6), and it signs at the shared choke point so this lane's
      # block cannot drift from the other lanes'. The signature also reaches `main`,
      # because the flush PR's BODY carries it and squash-merge builds the landed commit
      # message from the body.
      - name: Flush checkpoint to main via staging branch + PR
        env:
          # The enterprise forbids the Actions identity from creating pull requests, so
          # a fine-grained PAT is required to OPEN the PR. Without one the checkpoint
          # still parks safely on the staging branch and the step reports why it could
          # go no further — the fold is never lost, only delayed.
          #
          # ROLE: PR-CREATE. One role, one secret. A `||` chain stood here and collapsed
          # three roles into one variable: `||` selects on the left secret being EMPTY, so
          # an absent ZETA_TELEMETRY_FLUSH_TOKEN would have been silently replaced by a
          # credential with DIFFERENT authority, and the `secrets.GITHUB_TOKEN` rung would
          # additionally have parked the flush PR's `gate (required)` behind GitHub's
          # recursion guard — a checkpoint that looks flushed and can never merge.
          # `audit-workflow-credential-role-separation.ts` (cross-verify floor) refuses it.
          # Absence is a NAMED refusal, not a substitution: `openMergePR` refuses an empty
          # GH_TOKEN and names the secret and the scope.
          GH_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts flush \
            --lane zetadb-scheduled-node \
            --paths data/zetadb/checkpoint.json \
            --message "db(zetadb): fold scheduled journal"
