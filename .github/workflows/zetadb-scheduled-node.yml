name: zetadb-scheduled-node

on:
  push:
    branches: [main]
    paths:
      - "data/zetadb/journal.json"
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zetadb-scheduled-node
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Fold scheduled database journal
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun run run:zetadb-node

      - name: Commit checkpoint if changed
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet data/zetadb/checkpoint.json; then
            echo "No new database events to checkpoint."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zetadb/checkpoint.json
          {
            echo "db(zetadb): fold scheduled journal [skip ci]"
            echo
            echo "The scheduled executor folded newly admitted events into the"
            echo "durable ZetaDB checkpoint during Actions run $RUN_ID."
            echo
            echo "Agency-Signature-Version: 1"
            echo "Agent: zetadb-scheduled-node"
            echo "Agent-Runtime: GitHub Actions"
            echo "Agent-Model: deterministic TypeScript kernel"
            echo "Credential-Identity: github-actions[bot]"
            echo "Credential-Mode: dedicated-agent"
            echo "Human-Review: not-implied-by-credential"
            echo "Human-Review-Evidence: none"
            echo "Action-Mode: autonomous-fail-closed"
            echo "Task: task-browser-zetadb-node"
            echo "Co-Authored-By: Codex <noreply@openai.com>"
          } | git commit --file=-

          git pull --rebase origin main
          bun run run:zetadb-node
          git add data/zetadb/checkpoint.json
          git -c core.editor=true commit --amend --no-edit
          git push origin HEAD:main
