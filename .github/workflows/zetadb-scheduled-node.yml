name: zetadb-scheduled-node

on:
  push:
    branches: [main]
    paths:
      - "data/zetadb/journal.json"
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zetadb-scheduled-node
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Fold scheduled database journal
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun run run:zetadb-node

      - name: Commit checkpoint if changed
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet data/zetadb/checkpoint.json; then
            echo "No new database events to checkpoint."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zetadb/checkpoint.json
          {
            echo "db(zetadb): fold scheduled journal [skip ci]"
            echo
            echo "The scheduled executor folded newly admitted events into the"
            echo "durable ZetaDB checkpoint during Actions run $RUN_ID."
            echo
            echo "Agency-Signature-Version: 1"
            echo "Agent: zetadb-scheduled-node"
            echo "Agent-Runtime: GitHub Actions"
            echo "Agent-Model: deterministic TypeScript kernel"
            echo "Credential-Identity: github-actions[bot]"
            echo "Credential-Mode: dedicated-agent"
            echo "Human-Review: not-implied-by-credential"
            echo "Human-Review-Evidence: none"
            echo "Action-Mode: autonomous-fail-closed"
            echo "Task: task-browser-zetadb-node"
            echo "Co-Authored-By: Codex <noreply@openai.com>"
          } | git commit --file=-

          # 081KZM0FTJM — CONVERGE on a lost push race, do not fail.
          #
          # The fold is already convergent in shape: after rebasing we RE-DERIVE the
          # checkpoint (re-run the fold) instead of replaying a stale precomputed diff,
          # so two folds of the same journal agree. What was missing is what happens
          # when another writer lands BETWEEN our rebase and our push: `git push` is a
          # compare-and-swap, the loser is rejected, and with `set -e` the run simply
          # died. That was tolerable while GitHub Actions was the only writer — the
          # Actions-scoped `concurrency:` group serialised us with ourselves — but the
          # dogfooding target is runners AND local hardware AND browser cells at once,
          # and that group cannot see any of them.
          #
          # The fix is convergence, NOT a distributed lock: a lock would be a central
          # point of coordination (§1 scale-free) and would not survive a browser tab
          # going offline. Retry the rebase→re-fold→amend→push cycle; each attempt
          # re-derives from whatever main now holds, so the result converges regardless
          # of arrival order (#6 idempotency + commutativity).
          push_ok=0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            bun run run:zetadb-node
            git add data/zetadb/checkpoint.json
            git -c core.editor=true commit --amend --no-edit
            if git push origin HEAD:main; then
              push_ok=1
              [ "$attempt" -gt 1 ] && echo "[zetadb] converged on attempt $attempt/5 (lost $((attempt-1)) push race(s))"
              break
            fi
            echo "[zetadb] push race lost on attempt $attempt/5 — another writer landed; re-deriving from new main"
            sleep $((attempt * 3))
          done
          if [ "$push_ok" -ne 1 ]; then
            echo "::error::[zetadb] failed to converge after 5 attempts — sustained contention on data/zetadb/checkpoint.json (081KZM0FTJM)" >&2
            exit 1
          fi
