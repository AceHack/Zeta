# .github/workflows/docker-nixos-install-sh-test.yml
#
# 081KSKBP80008QG0R000E3RKPK Phase 2 — CI integration for the Docker NixOS install.sh
# test harness. Runs the fast-iteration test (~30-60 sec) on PRs
# that touch install substrate; catches install.sh / linux.sh /
# mise.sh bugs at PR time vs reboot time.
#
# Complements .github/workflows/build-ai-cluster-iso.yml's QEMU
# boot test (081KSGS9H0008QG0R0011BC7T2 cascade #5) at the cycle-time vs scope tradeoff:
#   - This workflow: install.sh on NixOS userspace, ~30-60 sec
#   - build-ai-cluster-iso QEMU: end-to-end virtualized boot, ~15 min
# Both run on install-substrate PRs.
#
# Discipline mirrors build-ai-cluster-iso.yml (per the canonical
# install-test workflow pattern):
#   - Runner pinned to ubuntu-24.04 (NOT -latest)
#   - Third-party actions SHA-pinned with trailing # vX.Y.Z comments
#   - permissions: contents: read at workflow level
#   - Concurrency: workflow-scoped, cancel-in-progress for PRs
#   - No github.event.* values interpolated into run: lines

name: docker-nixos-install-sh-test

on:
  # ── THE TIME-DRIVEN ARM (added 2026-08-26). ──────────────────────────────────
  #
  # The triggers below this comment and the one above it catch DIFFERENT FAILURE
  # CLASSES, and that is why both exist. This is DV2.0 change-rate partitioning
  # applied to CI triggers: two causes with different arrival processes get two
  # triggers, not one compromise.
  #
  #   path filter (`pull_request` / `push`)  <-  OUR CHANGES. Event-driven: it
  #     fires the moment someone edits the installer, which is the fastest
  #     possible feedback and is tied directly to the cause.
  #
  #   `schedule:`  <-  UPSTREAM DRIFT. Time-driven, and NOTHING ELSE CAN CATCH
  #     IT. the nixpkgs channel and the upstream downloads install.sh makes inside it all move with no commit in this repo, so a
  #     path filter never fires: there is nothing to filter on. Before this
  #     block, the only checks that prove the installer works from a bare
  #     machine ran solely when somebody happened to edit the installer.
  #
  # WHY THIS WORKFLOW AND NOT THE OTHERS. The rule applied was: schedule a check
  # iff its outcome can change WITH NO COMMIT -- i.e. it reaches outside the
  # repo. `installer-unit-tests` and `installer-repair-mode-existing-install` are
  # deliberately NOT scheduled: their inputs are all committed, so a cron would
  # re-run the same computation on the same bytes and could only ever report what
  # the last push already reported.
  #
  # WHY DAILY. The drift this catches is a mirror, a channel, or a runner image
  # moving -- a days-scale process, not an hours-scale one. Daily is the coarsest
  # cadence that still surfaces it inside one work-window, which is the stated
  # basis `factory-hygiene-audit-cadence.yml` already uses. (`mirror-to-fork.yml`
  # runs 6-hourly for a different reason -- it bounds staleness of a BACKUP -- so
  # its number is not the one to copy here, only its principle: a periodic
  # artefact, with the cadence chosen from what it is protecting against.)
  #
  # WHY THE MINUTE IS ODD. Off-the-hour and distinct per lane so the fleet's
  # scheduled runs do not pile onto one minute and get dropped together under
  # GitHub scheduler load. Avoids :00/:15/:30/:45 (heartbeat), :07/:37
  # (drift-sweep) and the */6 lanes at :13/:23/:41.
  #
  # THIS IS NON-BLOCKING AND STILL LOUD, and the loudness needs no wiring here.
  # `drift-dashboard-cadence.yml` enumerates every active workflow and derives its
  # expectation from this `on:` block: `expectationFromWorkflow`
  # (src/Core.TypeScript/forge-host/github/workflow-triggers.ts) turns a `cron:`
  # into `{{ kind: "periodic", periodSeconds }}` -- and it treats a workflow that is
  # BOTH scheduled and PR-triggered as `periodic`, "because the clock is the
  # stronger claim". `fold.ts` then reddens on FAILURE, on SILENCE
  # (age > 3x period, fold.ts:335), and on "declared to run every N and has NEVER
  # produced a verdict" (fold.ts:301). So a scheduled shield that quietly stops
  # running goes red -- which is the whole point, since a cron nobody reads is the
  # vacuity class wearing a schedule.
  schedule:
    - cron: "51 3 * * *"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      # Install dispatcher + per-OS scripts + shared library
      - 'tools/setup/**'
      # Pinned runtime versions read by tools/setup/common/mise.sh
      - '.mise.toml'
      # NixOS module that declares system-packages including mise +
      # bun-derived PATH (zeta-install.sh Step 6.95 reads from here
      # transitively via the systemd unit's Environment block)
      - 'full-ai-cluster/nixos/modules/common.nix'
      # The Docker harness itself
      - 'src/Core.TypeScript/ci/dockerfiles/nixos-install-sh-test/**'
      - 'src/Core.TypeScript/ci/docker-nixos-install-sh-test.ts'
      # .dockerignore affects build context for ALL docker builds
      - '.dockerignore'
      # bun deps + lockfile (used by the TS wrapper)
      - 'package.json'
      - 'bun.lock'
      # This workflow file itself
      - '.github/workflows/docker-nixos-install-sh-test.yml'

  push:
    branches:
      - main
      # Off-leash validation: install.sh changes are built on the accelerator
      # branch (incl. the local-LLM step) BEFORE harvesting to main (the operator's
      # off-leash-first model). This test validates install.sh, so it must
      # re-run when install.sh changes there too — otherwise the primary OS is
      # only re-validated at harvest time.
      - accelerator/pr-less-git-monster
    paths:
      - 'tools/setup/**'
      - '.mise.toml'
      - 'full-ai-cluster/nixos/modules/common.nix'
      - 'src/Core.TypeScript/ci/dockerfiles/nixos-install-sh-test/**'
      - 'src/Core.TypeScript/ci/docker-nixos-install-sh-test.ts'
      - '.dockerignore'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docker-nixos-install-sh-test.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-test:
    name: docker-nixos-install-sh-test
    runs-on: ubuntu-24.04
    # 081KSKBP80008QG0R000E3RKPK Phase 1 Dockerfile validation steps include: install.sh
    # full run + mise install + bun = 1.3.x check + claude-code install
    # + gh nix-shell. Cold-cache run ~5-10 min upper bound; warm-cache
    # closer to 60-120 sec. 15-min job timeout gives generous headroom.
    timeout-minutes: 15

    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun (matches .mise.toml pin)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3

      - name: Install bun dependencies (for the TS wrapper)
        run: bun install --frozen-lockfile

      - name: Run Docker NixOS install.sh test harness
        env:
          # Workspace-relative log output for the upload-artifact step
          DOCKER_LOG_OUT_PATH: docker-nixos-install-sh-test.log
          # Cold-cache install.sh can take longer than the 600s default
          # (mise install + bun install + claude-code download + gh
          # nix-shell + ~50 mise-tool installs); bump to 900s.
          DOCKER_BUILD_TIMEOUT_SEC: '900'
          # mise.sh promotes GITHUB_TOKEN -> MISE_GITHUB_TOKEN (authenticated GitHub API,
          # no 403); the driver passes it into the build as a BuildKit secret. BuildKit on.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_BUILDKIT: '1'
        run: bun src/Core.TypeScript/ci/docker-nixos-install-sh-test.ts

      - name: Upload Docker test log (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-nixos-install-sh-test-log
          path: docker-nixos-install-sh-test.log
          if-no-files-found: warn
          retention-days: 7
