# .github/workflows/docker-ubuntu-install-sh-test.yml
#
# Docker-based install.sh test on Ubuntu — sibling to docker-nixos-install-sh-test
# (operator 2026-05-30: "center our docker tests around ubuntu and nixos and have
# tests for both with install.sh"). The Dockerfile IS the test: it runs install.sh
# on a bare ubuntu image and validates the core local-LLM primitive (ollama +
# pinned model + real chooseIndex probe). A failing install.sh / assert fails the
# build, which fails this job.
#
# Off-leash on the accelerator branch (operator: "accelerator is for off-leash
# testing; once we get it right, main becomes off-leash too"). This is the gate
# that guards graduating the local-LLM install primitive to main.
#
# FIRST CUT uses a direct `docker build` (vs the nixos TS driver) for simplicity.
# FOLLOW-UP (the operator's GHA-cache point): consolidate both OS tests onto a shared TS
# driver + buildx `cache-from/to: type=gha` so the heavy install (1.2GB ollama +
# toolchain) bakes once and iteration runs inside the cached image.
#
# Security: no github.event.* values interpolated into run: lines.

name: docker-ubuntu-install-sh-test

on:
  # ── THE TIME-DRIVEN ARM (added 2026-08-26). ──────────────────────────────────
  #
  # The triggers below this comment and the one above it catch DIFFERENT FAILURE
  # CLASSES, and that is why both exist. This is DV2.0 change-rate partitioning
  # applied to CI triggers: two causes with different arrival processes get two
  # triggers, not one compromise.
  #
  #   path filter (`pull_request` / `push`)  <-  OUR CHANGES. Event-driven: it
  #     fires the moment someone edits the installer, which is the fastest
  #     possible feedback and is tied directly to the cause.
  #
  #   `schedule:`  <-  UPSTREAM DRIFT. Time-driven, and NOTHING ELSE CAN CATCH
  #     IT. the Ubuntu apt archive, the mise release feed, and every upstream tarball install.sh fetches all move with no commit in this repo, so a
  #     path filter never fires: there is nothing to filter on. Before this
  #     block, the only checks that prove the installer works from a bare
  #     machine ran solely when somebody happened to edit the installer.
  #
  # WHY THIS WORKFLOW AND NOT THE OTHERS. The rule applied was: schedule a check
  # iff its outcome can change WITH NO COMMIT -- i.e. it reaches outside the
  # repo. `installer-unit-tests` and `installer-repair-mode-existing-install` are
  # deliberately NOT scheduled: their inputs are all committed, so a cron would
  # re-run the same computation on the same bytes and could only ever report what
  # the last push already reported.
  #
  # WHY DAILY. The drift this catches is a mirror, a channel, or a runner image
  # moving -- a days-scale process, not an hours-scale one. Daily is the coarsest
  # cadence that still surfaces it inside one work-window, which is the stated
  # basis `factory-hygiene-audit-cadence.yml` already uses. (`mirror-to-fork.yml`
  # runs 6-hourly for a different reason -- it bounds staleness of a BACKUP -- so
  # its number is not the one to copy here, only its principle: a periodic
  # artefact, with the cadence chosen from what it is protecting against.)
  #
  # WHY THE MINUTE IS ODD. Off-the-hour and distinct per lane so the fleet's
  # scheduled runs do not pile onto one minute and get dropped together under
  # GitHub scheduler load. Avoids :00/:15/:30/:45 (heartbeat), :07/:37
  # (drift-sweep) and the */6 lanes at :13/:23/:41.
  #
  # THIS IS NON-BLOCKING AND STILL LOUD, and the loudness needs no wiring here.
  # `drift-dashboard-cadence.yml` enumerates every active workflow and derives its
  # expectation from this `on:` block: `expectationFromWorkflow`
  # (src/Core.TypeScript/forge-host/github/workflow-triggers.ts) turns a `cron:`
  # into `{{ kind: "periodic", periodSeconds }}` -- and it treats a workflow that is
  # BOTH scheduled and PR-triggered as `periodic`, "because the clock is the
  # stronger claim". `fold.ts` then reddens on FAILURE, on SILENCE
  # (age > 3x period, fold.ts:335), and on "declared to run every N and has NEVER
  # produced a verdict" (fold.ts:301). So a scheduled shield that quietly stops
  # running goes red -- which is the whole point, since a cron nobody reads is the
  # vacuity class wearing a schedule.
  schedule:
    - cron: "11 3 * * *"
  workflow_dispatch:
  push:
    branches: [accelerator/pr-less-git-monster]
    paths:
      - "src/Core.TypeScript/ci/dockerfiles/ubuntu-install-sh-test/**"
      - "tools/setup/**"
      - "src/Core.TypeScript/accelerator/local-llm.ts"
      - "src/Core.TypeScript/accelerator/validate-local-llm.ts"
      - ".mise.toml"
      - ".dockerignore"
      - ".github/workflows/docker-ubuntu-install-sh-test.yml"
  # Run on PRs to main too — after harvest the install-graph lives on main, so a
  # PR touching it must be Ubuntu-tested (mirrors docker-nixos-install-sh-test).
  # The shield must cover main, not just the accelerator branch: a test that only
  # fires off-leash is a hole that reads as covered.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/Core.TypeScript/ci/dockerfiles/ubuntu-install-sh-test/**"
      - "tools/setup/**"
      - "src/Core.TypeScript/accelerator/local-llm.ts"
      - "src/Core.TypeScript/accelerator/validate-local-llm.ts"
      - ".mise.toml"
      - ".dockerignore"
      - ".github/workflows/docker-ubuntu-install-sh-test.yml"

concurrency:
  group: docker-ubuntu-install-sh-test-${{ github.ref }}
  # PR-conditional, matching all six sibling install shields. This was an unconditional
  # `true`, which is fine while every trigger is a PR but is wrong now that a `schedule:`
  # exists: on `main` a scheduled run and a later push share this group, so the clock-driven
  # verdict could be CANCELLED by an unrelated merge. A cancelled run reads as neither pass
  # nor fail, so the shield would go quiet with nothing red -- the drift-verdict-drought
  # class, imported into the one arm that exists to catch what nothing else can.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docker-ubuntu-test:
    name: docker-ubuntu-install-sh-test
    runs-on: ubuntu-24.04
    # Cold build: full install.sh (mise toolchain + lean + jars) + ollama 1.2GB +
    # 398MB model pull. Generous bound for the first uncached run.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker build (the test — install.sh + local-LLM validation inside)
        env:
          # mise.sh promotes GITHUB_TOKEN -> MISE_GITHUB_TOKEN (authenticated GitHub API,
          # no 403); passed into the build as a BuildKit secret below (not a build-arg).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --secret id=github_token,env=GITHUB_TOKEN \
            -f src/Core.TypeScript/ci/dockerfiles/ubuntu-install-sh-test/Dockerfile \
            -t zeta-ubuntu-install-sh-test \
            .
