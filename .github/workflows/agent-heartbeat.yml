# Agent heartbeat — symmetric pair heartbeating on free-tier Ollama.
#
# TWO agents (alexa + otto) heartbeat independently, each on their own branch.
# The flush creates PRs that the agent-reviewer workflow cross-verifies:
#   alexa's flush ← otto attests (the pairwise NFT)
#   otto's flush  ← alexa attests (the symmetric attestation)
#
# Free tier: GitHub Actions (unlimited for public repos) + Ollama with
# qwen2.5:0.5b (~400MB, fits in runner memory). No API keys. No cloud bills.
#
# Phase 1 (this): symmetric heartbeat + cross-verification (prove reliability).
# Phase 2: assign lightweight work (decompose items, write docs).
# Phase 3: codegen with larger models (via summon subscription backend).

name: agent-heartbeat

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: ${{ matrix.agent }} heartbeat tick
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false # both agents tick independently
      matrix:
        agent: [alexa, otto, soraya]

    steps:
      # ABSENCE IS A NAMED REFUSAL, NOT A SUBSTITUTION.
      #
      # The checkout below carries the BRANCH-PUSH role credential, and that role has no
      # substitute. The `|| secrets.GITHUB_TOKEN` rung this step replaces selected on the
      # secret being EMPTY and handed the lane a credential with DIFFERENT authority: the
      # push still succeeded, so the lane looked alive, and the failure surfaced later
      # under an error naming the wrong subject. It also trips GitHub's recursion guard —
      # actions taken with GITHUB_TOKEN do not trigger other workflows — so the degraded
      # lane silently stopped producing the events downstream jobs wait on.
      #
      # COST: one `test -z` on a bare runner, no checkout, no network. It buys one legible
      # line naming the exact secret and the exact scope instead of a downstream misread.
      - name: Assert the branch-push credential is present
        env:
          BRANCH_PUSH_TOKEN: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}
        run: |
          if [ -z "${BRANCH_PUSH_TOKEN:-}" ]; then
            echo "::error title=Missing ZETA_TELEMETRY_FLUSH_TOKEN::This lane holds the BRANCH-PUSH role and its credential is absent. There is no substitute: GITHUB_TOKEN carries different authority and its pushes do not trigger workflows. FIX: set repository secret ZETA_TELEMETRY_FLUSH_TOKEN on Lucent-Financial-Group/Zeta to a fine-grained PAT with Contents: read and write, Pull requests: read and write, Metadata: read. Role table: docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md"
            exit 1
          fi
          echo "branch-push credential present (role=branch-push secret=ZETA_TELEMETRY_FLUSH_TOKEN)"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          # THIS CHECKOUT'S CREDENTIAL IS THE ONE THAT PUSHES `heartbeat/$AGENT`
          # (the `Push heartbeat branch` step below), and that push's actor is what
          # decides whether `gate (required)` ever runs on the flush PR.
          #
          # WHY THE PAT IS BACK (081M05G8D36087G0R0034D3QPA, 081M010H4KE):
          # a `pull_request` run whose triggering actor is `github-actions[bot]` is
          # created and then immediately parked — status `completed`, conclusion
          # `action_required` — so it never executes and never contributes a check to
          # the PR's rollup. Measured on heartbeat/alexa, not inferred:
          #   pull_request     gate  action_required  actor=github-actions[bot]
          #   workflow_dispatch gate success          actor=AceHack   (SAME head sha)
          # That is why every heartbeat/* flush PR has had 6 checks and no
          # `gate (required)`. The earlier reading — "GITHUB_TOKEN pushes do not
          # trigger workflows at all" — is not what the API shows: the run IS created,
          # it is held. Either way the cure is the same, a push actor that is a human
          # account, which is what this PAT is.
          #
          # WHY IT IS SAFE TO TRY AGAIN: #10850 did exactly this and killed all three
          # lanes for ~16.75h because the PAT had no `contents: write`. That grant was
          # made by the operator on 2026-08-16 (Contents R+W, Pull requests R+W,
          # Actions R+W, Commit statuses R, Metadata R; no Workflows: Write). This
          # workflow does NOT take that grant on faith — the preflight step below
          # probes it against the real remote on every tick and falls back if it is
          # wrong, so a mis-scoped or revoked PAT costs a degraded lane, never a dead
          # one. `.claude/rules/tick-must-never-stop.md`.
          #
          # ROLE: BRANCH-PUSH. One role, one secret. docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md
          # assigns ZETA_TELEMETRY_FLUSH_TOKEN this role and only this role; the
          # PR-create role is ZETA_PR_ARCHIVE_TOKEN and the dispatch role is
          # ZETA_SOCIETY_DISPATCH_TOKEN. A `||` chain collapsed all three into one
          # variable, which is why the rung below is gone.
          #
          # WHAT THE REMOVED `|| secrets.GITHUB_TOKEN` RUNG COST. It selected on the
          # secret being EMPTY and silently substituted a credential with DIFFERENT
          # authority, so the lane kept running and failed somewhere downstream under an
          # error naming the wrong subject. Compounding it, GitHub's recursion guard means
          # actions taken with GITHUB_TOKEN do not trigger other workflows — so a degraded
          # lane ALSO stopped producing the events downstream jobs wait on, silently.
          # ABSENCE is now the assert step above: loud, and it names the secret and scope.
          # DENIAL remains the preflight's job below. Two distinct conditions, two
          # distinct reports — that separation is the fix.
          persist-credentials: true
          token: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}

      # THE FALSIFIER FOR THE CREDENTIAL, RUN IN PRODUCTION ON EVERY TICK.
      #
      # #10913 verified a credential fix against a STUBBED git and it failed on the
      # first real tick, because a stub models control flow and says nothing about
      # which token git actually authenticates with. So this check is not a stub and
      # not a mock: it is a real `git push` to the real remote over the real network,
      # with `--dry-run` so it updates nothing. GitHub performs repository-write
      # authorization at the `git-receive-pack` advertisement, before any ref is
      # considered, so a dry run gets the true 403/200 answer. Verified locally
      # against this repo before shipping: a valid extraheader dry-runs clean, a
      # deliberately invalid one fails with `Authentication failed`.
      #
      # It probes a `credprobe/` ref, never `heartbeat/$AGENT`: at this point HEAD is
      # main and the remote lane branch has diverged (the flush squashes), so probing
      # the real lane would be rejected as non-fast-forward and a permission answer
      # would be indistinguishable from an ancestry answer. A ref that does not exist
      # yet has no ancestry question to get wrong. `--dry-run` creates nothing.
      - name: Preflight the push credential
        env:
          AGENT: ${{ matrix.agent }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          probe() { git push --dry-run origin "HEAD:refs/heads/credprobe/heartbeat-$AGENT" 2>&1; }

          if OUT=$(probe); then
            echo "[preflight] $AGENT: push credential is authorized for this repository."
            exit 0
          fi
          echo "$OUT"

          # Only a CREDENTIAL answer is eligible for the swap. A network blip or an
          # unexpected refusal must NOT silently re-point the credential — that would
          # hide a different failure behind a credential story.
          if ! printf '%s' "$OUT" | grep -qiE 'denied to|Authentication failed|Invalid username or token|error: 403'; then
            echo "::warning title=Heartbeat preflight inconclusive::$AGENT: the probe failed, but not with a credential answer. Leaving the credential as-is; the real push below will report the true error."
            exit 0
          fi

          echo "::error title=Heartbeat PAT cannot push::ZETA_TELEMETRY_FLUSH_TOKEN was denied by the remote. FIX: grant that fine-grained PAT 'Contents: read and write' on Lucent-Financial-Group/Zeta. Falling back to GITHUB_TOKEN: the lane keeps recording, but 'gate (required)' will NOT start on the flush PR (081M010H4KE)."

          # Swap the credential the way actions/checkout itself sets it — one
          # `--replace-all` of the extraheader, which is the key git actually
          # authenticates with. `git -c http.<url>.extraheader=` APPENDS rather than
          # overrides, and re-pointing the remote URL alone did not displace it in
          # production (#10913), so neither of those is used here.
          HDR_B64=$(printf 'x-access-token:%s' "$FALLBACK_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$HDR_B64"
          git config --local --replace-all "http.https://github.com/.extraheader" "AUTHORIZATION: basic $HDR_B64"

          # RE-PROBE. Without this the fallback is the vacuity class: a repair that is
          # applied and never checked looks identical to one that worked. #10913's
          # fallback ran, logged that it ran, and was denied under the same identity.
          if OUT2=$(probe); then
            echo "[preflight] $AGENT: fallback credential verified against the remote; lane is DEGRADED but alive."
            {
              echo "### heartbeat/$AGENT is running on the FALLBACK credential"
              echo ""
              echo "\`ZETA_TELEMETRY_FLUSH_TOKEN\` was denied by the remote; \`GITHUB_TOKEN\` is verified and in use."
              echo "Telemetry still lands. \`gate (required)\` will NOT start on the flush PR until the PAT can push."
              echo "Fix: grant that fine-grained PAT **Contents: read and write** on this repository."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$OUT2"
          echo "::error title=Heartbeat has no working push credential::$AGENT: BOTH the PAT and GITHUB_TOKEN were denied. This is worse than #10850 and the lane is about to fail its push. Not exiting here so the tick still records locally and the push reports the authoritative error."

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # PINNED INSTALL (2026-08-16). This step used to be:
      #     curl -fsSL https://ollama.com/install.sh | sh
      # a remote script fetched and handed straight to a shell, every 15 minutes, three times
      # over (one per matrix agent), in a job holding contents:write and pull-requests:write.
      # Whatever that URL served at that instant executed with the runner's token in the
      # environment, and nothing in the repo could have told us it had changed. That is
      # influence entering through an undeclared, unmetered channel — manifesto §13,
      # noninterference — and it was the sharpest instance in the egress inventory.
      #
      # It now installs ONE named release asset by version, verifies its SHA-256 against
      # .github/ollama-pin.json, and refuses to install anything that does not match. The
      # installer script is gone from the loop entirely, which also drops the behaviours we
      # never wanted on an ephemeral GPU-less runner: a systemd unit, a service user, and an
      # apt-based NVIDIA/ROCm driver install. The server is started by hand below, as before.
      #
      # THE TENSION, DECIDED EXPLICITLY. A pin fails closed when upstream moves, and on this
      # lane failing closed means the tick stops — which .claude/rules.bak/tick-must-never-stop.md
      # forbids (a lapse cost 12 hours once). Three options, and the third is not available:
      #   fail the tick               — maximum safety, violates tick-must-never-stop
      #   fall back to unpinned       — FORBIDDEN. A check with a bypass is not a check.
      #   fail loudly, tick continues — CHOSEN.
      # So `continue-on-error: true`: the step goes red in the run UI and emits an ::error::
      # annotation, the job carries on, and the tick runs WITHOUT a model. Every downstream
      # consumer of the model already degrades rather than dies (the observe tick and the
      # codegen step both end in `|| echo "... (non-fatal)"`), and the healer, mutation runner,
      # cadence measurement, attestation, archive and push do not use a model at all. A
      # model-less tick is a large loss; a stopped society is a total one.
      #
      # Note this is strictly SAFER than what it replaced in the liveness sense too: a failed
      # `ollama pull` used to kill the whole job, because the pulls sat under `set -e` in the
      # same step as the install. They no longer do.
      #
      # TYPESCRIPT, NOT A SHELL SCRIPT, and that is not a style preference. A SHA-256 pin
      # reaches naturally for shell (curl + sha256sum + compare + branch) at exactly the moment
      # this repo is retiring bash — registering new shell in the retained-shell allowlist would
      # have been the locally-easy, strategically-wrong move. The allowlist exists for scripts
      # that run BEFORE bun is available; this one does not (bun install runs above). And a
      # shell one-liner in a workflow cannot be unit-tested, while the verifier can be and is:
      # src/Core.TypeScript/ace/pinned-artifact.test.ts drives it through injected effects and
      # proves the REFUSAL, which is the only half that matters. Neutering the digest comparison
      # turns 5 of those tests red — checked, not assumed.
      #
      # Refresh path, failure modes, and why the pin is written in ace's PackageEntry shape:
      # see the `_doc` block in .github/ollama-pin.json. A pin bump is proved on a real runner
      # by verify-ollama-pin.yml BEFORE it merges — that workflow runs automatically on any PR
      # touching the pin.
      - name: Install Ollama (pinned, checksum-verified)
        continue-on-error: true
        run: bun src/Core.TypeScript/ace/install-pinned-artifact.ts --pin .github/ollama-pin.json

      - name: Start Ollama + pull models
        continue-on-error: true
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            echo "::error title=heartbeat degraded::The pinned Ollama install did not complete, so this tick runs WITHOUT a model. The observe and codegen steps will produce nothing; every other duty still runs. Fix the pin (.github/ollama-pin.json) — do not restore the unpinned installer."
            {
              echo "### ${AGENT:-agent}: DEGRADED TICK — no model"
              echo ""
              echo "The pinned Ollama install failed; see the install step above."
              echo "Ticking continues without inference."
              echo ""
              echo "Refresh:  bun src/Core.TypeScript/ace/refresh-ollama-pin.ts"
              echo "Prove it: open a PR — verify-ollama-pin.yml runs on it"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          ollama serve &
          # Poll for readiness instead of `sleep 5`. The old fixed sleep was a race the tick
          # lost silently whenever the runner was slow — the pulls simply failed against a
          # server that had not bound yet.
          for _ in $(seq 1 30); do
            if ollama list >/dev/null 2>&1; then break; fi
            sleep 1
          done

          # STRUCTURAL DECORRELATION (2026-08-24, Alexa): each agent uses a different
          # model family so their errors are orthogonal. The decorrelation meter
          # (decorrelation-meter.ts) measures whether this actually helps — if all three
          # used the same model, S ≈ 2 (correlated, useless redundancy). With different
          # families, S should exceed 2 (genuinely independent).
          #
          # All three fit in ~2GB RAM (well within the 7GB runner limit).
          # The 7b codegen model is pulled separately for the work tick.
          # Heterogeneous by design: three model FAMILIES, so a wrong answer from one
          # agent is not automatically the wrong answer from the others. Selected by
          # `case` rather than indirect expansion (`${!VAR}`) -- shellcheck cannot follow
          # an indirect reference and reports the roster as unused (SC2034), and the
          # honest fix is to stop being indirect rather than to silence the rule.
          case "$AGENT" in
            alexa)  HEARTBEAT_MODEL="qwen2.5:0.5b" ;;
            otto)   HEARTBEAT_MODEL="llama3.2:1b" ;;
            soraya) HEARTBEAT_MODEL="gemma2:2b" ;;
            # FAIL-CLOSED. Indirect expansion yielded "" for an unknown agent and the
            # failure surfaced later as `ollama pull ""`. An unknown agent halts here.
            *) echo "::error::no heartbeat model declared for agent '$AGENT'" >&2; exit 1 ;;
          esac
          echo "[models] $AGENT heartbeat model: $HEARTBEAT_MODEL"
          ollama pull "$HEARTBEAT_MODEL"
          # Smart model for codegen/decompose work (5GB, fits in 7GB runner)
          ollama pull qwen2.5:7b
          ollama list

      - name: Accumulate unflushed heartbeat state over current main
        env:
          AGENT: ${{ matrix.agent }}
        # The lane ticks every 15 minutes but flushes about hourly. Rebuilding it directly from
        # main discarded the intervening ticks. The source-owned preparer starts from current main
        # and squash-carries the previous lane's final tree delta. Already-flushed state is empty;
        # unflushed state is staged; a content conflict stops before the remote ref can be moved.
        run: |
          # OUTAGE 2026-08-16 23:05 UTC: all three lanes died here every tick for ~1h.
          # Observed, from the run log:
          #     prepare-heartbeat-branch: carry unflushed heartbeat state failed:
          #     *** Please tell me who you are.  /  fatal: empty ident name
          # The preparer's carry step needs a committer identity, and the identity was set only in
          # `Commit accumulated heartbeat tick` -- a LATER step. #11160 moved this work out of that
          # step into the preparer without moving the identity with it, so from 23:01:40 onward the
          # first git operation of every tick ran without one. `society` and `tick-metrics`, which
          # do not use this preparer, stayed healthy throughout -- which is what localises it here.
          #
          # NOT claimed: which git internal demands the ident. A local `git merge --squash
          # --no-commit` over a divergent branch succeeds WITHOUT one, so the plain-merge
          # explanation does not reproduce and is deliberately not asserted. What is established is
          # the failure, its message, and that setting the identity before the preparer removes it.
          #
          # The rule that generalises: set the identity before the FIRST git operation that needs
          # it, not before the commit that happens to come last.
          git config user.name "${AGENT}[bot]"
          git config user.email "${AGENT}[bot]@users.noreply.github.com"
          bun src/Core.TypeScript/agent-heartbeats/prepare-heartbeat-branch.ts --agent "$AGENT"

      - name: Run observe tick (local-llm, heartbeat mode)
        id: observe_tick
        env:
          ZETA_FIRST_SESSION_MARKER: /tmp/zeta-first-session-complete
          ZETA_AGENT_ID: ${{ matrix.agent }}
          ZETA_SINK_MODE: local
          AGENT: ${{ matrix.agent }}
        run: |
          # Each agent uses its own model family (structural decorrelation)
          # Same roster as the pull step above; same `case` for the same reason.
          case "$AGENT" in
            alexa)  MODEL="qwen2.5:0.5b" ;;
            otto)   MODEL="llama3.2:1b" ;;
            soraya) MODEL="gemma2:2b" ;;
            *) echo "::error::no heartbeat model declared for agent '$AGENT'" >&2; exit 1 ;;
          esac

          mkdir -p /tmp && echo "2026-07-08" > /tmp/zeta-first-session-complete
          export ZETA_PARTICIPANT="local-llm:${MODEL}"
          set +e
          bun src/Core.TypeScript/observe/run-loop-real.ts \
            --by "$ZETA_AGENT_ID" \
            --event-dir docs/observe-events \
            --participant "local-llm:${MODEL}"
          TICK_RC=$?
          set -e
          if [ "$TICK_RC" -ne 0 ]; then
            echo "[heartbeat] tick failed (non-fatal); no room receipt will be emitted"
            echo "observed=false" >> "$GITHUB_OUTPUT"
          else
            echo "observed=true" >> "$GITHUB_OUTPUT"
          fi

      # First bounded production room emitter. Alexa alone owns the shared v1 feed index, avoiding
      # cross-lane index races; other lanes keep their durable observe events and do not synthesize
      # room receipts. The generated atom records a successful heartbeat generator only—not a solved
      # episode, a cryptographic signature, or an authority verdict.
      - name: Emit durable room receipt (Alexa bounded lane)
        if: matrix.agent == 'alexa' && steps.observe_tick.outputs.observed == 'true'
        env:
          AGENT: ${{ matrix.agent }}
          ROOM_RECEIPT_RUN_ID: github-run:${{ github.run_id }}:${{ github.run_attempt }}
          ROOM_RECEIPT_SOURCE_SHA: ${{ github.sha }}
        run: |
          bun src/Core.TypeScript/agent-heartbeats/emit-room-evidence.ts \
            --agent "$AGENT" \
            --run-id "$ROOM_RECEIPT_RUN_ID" \
            --repo-root . \
            --source-sha "$ROOM_RECEIPT_SOURCE_SHA"

      - name: Commit accumulated heartbeat tick
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          git config user.name "${AGENT}[bot]"
          git config user.email "${AGENT}[bot]@users.noreply.github.com"
          git add docs/observe-events/ docs/room-evidence/ || true
          if git diff --cached --quiet; then
            echo "[heartbeat] no new events to commit"
          else
            git commit --no-verify -m "heartbeat($AGENT): accumulated tick $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Carries any prior unflushed lane delta over current main, then adds this tick.
          Free-tier Ollama (qwen2.5:0.5b). Agent: $AGENT.

          Agency-Signature-Version: 1
          Agent: $AGENT
          Agent-Runtime: github-actions/.github/workflows/agent-heartbeat.yml
          Agent-Model: qwen2.5:0.5b
          Credential-Identity: AceHack
          Credential-Mode: shared
          Human-Review: not-implied-by-credential
          Human-Review-Evidence: none
          Action-Mode: autonomous-fail-open
          Task: 081M0ZWYF7R087G0R002RXA889
          Co-authored-by: Kiro <noreply@kiro.dev>"
          fi

      - name: Run Tier-0 self-healers (automated drift correction)
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          # Only otto handles healer duty
          if [ "$AGENT" != "otto" ]; then
            echo "[heal] Skipping — only otto handles healer duty"
            exit 0
          fi

          # Run the composed Tier-0 healers over the working tree.
          # Direct exit-code check, not `$?` (shellcheck SC2181) — actionlint treats this as an
          # error, so the indirect form turned main red on merge.
          # BOUNDED blast radius. The bound is the precondition for retraction-over-prevention:
          # drift cleanup after the fact stays tractable only while one tick cannot rewrite the
          # repository. exit 2 = the plan exceeded the bound and NOTHING was written.
          echo "[heal] Running Tier-0 healers (bounded)..."
          set +e
          bun src/Core.TypeScript/hygiene/healers/run-tier0.ts \
            --repo-root . --max-files 25 --plan-out /tmp/heal-plan.txt 2>&1
          HEAL_RC=$?
          set -e

          # An oversized plan is a FINDING, not a routine heal — it must stay loud.
          if [ "$HEAL_RC" -eq 2 ]; then
            # LOUD, BUT NOT FATAL. An oversized heal plan is a FINDING about the repository, not a
            # failure of this tick. `exit 1` here (my error, 2026-08-01) killed the WHOLE heartbeat
            # job — observe tick, flush, archive, codegen and the mutation runner all died because
            # ONE duty had a big plan. First production firing: "1005 files planned, bound is 25"
            # took otto's entire tick down with it.
            #
            # That contradicts the rule applied everywhere else here — DRIFT REPORT, NOT A GATE —
            # and it fails in the OFF direction rather than the closed one. The bound's job is to
            # refuse the write and say so; it is not to stop the society.
            echo "::warning::[heal] BLAST RADIUS EXCEEDED — nothing written, tree untouched."
            echo "[heal] A Tier-0 run this large wants a human read, not a silent commit."
            echo "[heal] Nothing to stage (the healer wrote nothing); ending this step cleanly."
            # exit 0, NOT fall-through. The healer wrote nothing, so there is nothing to stage —
            # but `--plan-out` is written BEFORE the bound check, so /tmp/heal-plan.txt still holds
            # the full oversized plan. Falling through ran `git add --pathspec-from-file` over ~1005
            # paths that were never modified, and under `set -e` any refusal (an ignored path, a
            # pathspec matching nothing) killed the step.
            #
            # My error, twice: #9911 removed the `exit 1` without replacing it. exit 0 ends the STEP
            # successfully and the job continues — which is what "loud but not fatal" actually
            # requires. The 19:56 tick failed on this, with otto down and alexa/soraya green.
            exit 0
          fi
          if [ "$HEAL_RC" -ne 0 ]; then
            echo "::warning::[heal] HEALER FAILED rc=$HEAL_RC — drift may exist but went undetected"
          fi

          # If anything was healed, stage and commit it
          # Stage EXACTLY the paths the healer touched — never `git add -A`, which sweeps in
          # anything else this tick left in the tree (the observe-tick's own event files, a stray
          # artefact) and attributes it to the healer.
          if [ -s /tmp/heal-plan.txt ]; then
            git config user.name "otto[bot]"
            git config user.email "otto[bot]@users.noreply.github.com"
            git add --pathspec-from-file=/tmp/heal-plan.txt
            git commit --no-verify -m "heal(otto): Tier-0 drift correction $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Automated self-healing: stale-js, unpinned-actions, unused-imports,
          exact-optional-spread. Zero intelligence. Certified against 3 laws.

          Co-Authored-By: Kiro <noreply@kiro.dev>"
            echo "[heal] Committed healed files"
          else
            echo "[heal] No drift found — all clean"
          fi

      # NOTE ON ORDER (2026-08-01): the healer MUST run before the push.
      # It previously sat after it, with no push of its own anywhere in this job — so it
      # committed healed files to a local branch on a runner that was then destroyed. The log
      # said "[heal] Committed healed files", which was true and completely inert: the heal
      # never reached the repository. The self-healing system had never actually healed
      # anything. Keeping it here means one push carries both the event and the heal.
      - name: Find tests that cannot fail (one mutant per agent per tick)
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          # THE SOCIETY'S STANDING JOB. A passing test proves nothing until you know it can fail.
          # On 2026-08-01 that gap produced six unfalsifiable "discharges" in the frozen core and a
          # cache whose test asserted `remaining >= 0` on a count that is non-negative by
          # construction — disabling the retraction entirely left it 3 pass / 0 fail. All caught by
          # hand, which is the most expensive tier there is.
          #
          # WHY THE FLEET IS THE RIGHT RUNNER, and it is not about capability: flipping `>=` to `>`
          # and comparing exit codes needs ZERO judgement — no model has to be RIGHT about anything.
          # Selection is deterministic from (agent, tick), so three agents cover three different
          # files having exchanged NO messages. Adding members adds throughput at zero coordination
          # cost.
          #
          # NOT A HUNT (renamed 2026-08-11). The runner reports a NEUTRAL FACT — the suite could not
          # distinguish this variant from the baseline — and deciding whether that is a TEST GAP or a
          # genuine DEGREE OF FREEDOM is undecidable (Budd & Angluin 1982). So it does not decide.
          # It prints a bounded 4x4 menu of honest responses and an agent picks a cell; a dimension
          # already declared free in db/mutation-freedoms/<agent>.json goes SILENT, which is what
          # stops every tick re-reporting the same known freedoms.
          #
          # DRIFT REPORT, NOT A GATE. It never fails the tick: this bounds DETECTION LATENCY, it does
          # not block. Two distinct outcomes, previously flattened by a bare `|| true`:
          #   exit 3  indistinguishable AND undeclared  -> the finding
          #   exit 4  SPECIFICATION TIGHTENED           -> a mutant now dies in a dimension someone
          #                                               declared free; drift in the other direction
          #   exit 5  UNRESOLVED                        -> the run established NOTHING and says so
          #                                               rather than guessing (SLAM's rule). Either
          #                                               the baseline suite was already red, or the
          #                                               mutant exited 0 without running the tests
          #                                               (a CLI-entrypoint guard flipped to `||`
          #                                               makes importing the module call
          #                                               process.exit(0) — zero tests, exit 0).
          #                                               NOT a finding and NOT a clean bill.
          # Both are annotated ::warning:: by the runner. Until 2026-08-11 the only annotation was on
          # the "no files matched" edge case, so this comment's old claim that the warning "keeps the
          # finding loud" was false for the case it cared about — the finding sat in log output.
          #
          # Runs BEFORE the push per the ordering rule below. It writes nothing unless `--choose` is
          # passed (it is not, here): runMutant restores the file in a `finally`, including when the
          # suite cannot run at all.
          # --since must be a git approxidate string git can actually parse, and "24h" is a TRAP.
          # This step was a COMPLETE NO-OP from the day it shipped: every tick the runner's own
          # guard printed "returned NO FILES AT ALL" and did nothing.
          #
          # The precise failure, measured on this repo 2026-08-11 (an earlier version of this
          # comment said short forms were invalid in general, which is WRONG for THIS step's
          # git-approxidate `--since`):
          #
          # CORRECTION 2026-08-14 (081M005VXY6087G0R001T04ATY): that earlier revision went on to
          # call `--since 7d` on the archive step below "working". It was not. Those are two
          # different tools with two different --since implementations, and the archive one was
          # never a git approxidate at all — it was a lexicographic string compare against ISO
          # `mergedAt`, where "2026-08-14T..." >= "7d" is FALSE, so it matched zero PRs. A
          # comment written to stop a bad fix ended up vouching for a broken flag. Both the
          # archive `--since` and that claim are fixed below; the numbers in this table remain
          # correct for the mutation-runner `--since`, which really is a git approxidate.
          #     24h            ->    0 commits   <- 24 overflows the HOUR field
          #     1h             -> 1239 commits
          #     2h             -> 1095 commits
          #     7d             ->  809 commits
          #     24.hours       ->  334 commits
          #     "24 hours ago" ->  334 commits
          # So `Nh` works for N <= 23 and silently means something else at 24. It is a BOUNDARY,
          # not a format-category error. Use the unambiguous long form here.
          #
          # The standing job that finds tests which cannot fail was itself unable to fail, which is
          # precisely the defect class it exists to catch — and its guard was right and loud for
          # months while nobody acted on it. A loud warning nobody reads is not detection.
          TICK=$(git rev-list --count HEAD)
          echo "[mutation] $AGENT tick=$TICK — observing one mutant"
          set +e
          OUT=$(bun src/Core.TypeScript/hygiene/mutation-runner.ts \
            --agent "$AGENT" --tick "$TICK" --since "24 hours ago" 2>&1)
          RC=$?
          set -e
          echo "$OUT"

          # Surface the readout in the run UI, not only in scrollback. The menu is the actionable
          # part — a finding nobody can act on is a finding nobody acts on.
          if [ "$RC" = "3" ] || [ "$RC" = "4" ] || [ "$RC" = "5" ]; then
            {
              if [ "$RC" = "4" ]; then
                echo "### mutation ($AGENT, tick $TICK) — SPECIFICATION TIGHTENED"
              elif [ "$RC" = "5" ]; then
                echo "### mutation ($AGENT, tick $TICK) — UNRESOLVED (no signal)"
              else
                echo "### mutation ($AGENT, tick $TICK) — indistinguishable under suite"
              fi
              echo ""
              echo '```'
              echo "$OUT"
              echo '```'
              echo ""
              # An unresolved run has no menu to act on — offering a cell there would invite a
              # judgement about a dimension nothing was actually measured on.
              if [ "$RC" != "5" ]; then
                echo "Act with: \`bun src/Core.TypeScript/hygiene/mutation-runner.ts --agent $AGENT --tick $TICK --choose <cell> --reason \"...\"\`"
              else
                echo "Nothing to choose: fix the suite (or why it cannot run) and the next tick answers."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # The metric that would eventually earn this runner the right to be more than a report.
          # SDV became a REQUIRED Windows 7 gate when its false-alarm rate fell 25.7% -> <4%, not
          # when it became correct. Printed every tick so the trend is visible rather than
          # reconstructed later. It WITHHOLDS the rate below MIN_SAMPLE and says why, and it marks
          # itself NOT SLAM-comparable: a finding fixed by opening a PR leaves no transcript entry,
          # and this job never stages db/, so per-tick findings are recorded nowhere. Read-only.
          #
          # NOT `|| true`. The first version of this step used one, which is the exact pattern §207
          # above records as the reason the mutation step sat dead for months: a bare `|| true`
          # turns "this never ran" and "this ran and found nothing" into the same silent output.
          # Reporting must never fail the tick, so the RC is still swallowed for exit purposes —
          # but it is ANNOUNCED first, because an unannounced swallow is how the last one hid.
          set +e
          bun src/Core.TypeScript/hygiene/mutation-false-alarm-rate.ts
          FA_RC=$?
          set -e
          if [ "$FA_RC" -ne 0 ]; then
            echo "::warning::[false-alarm] metric failed rc=$FA_RC — the convergence trend is going unmeasured"
          fi

          # Registry-level convergence: escape rate + freedom churn.
          # Complementary to the per-tick false-alarm-rate above — this measures the LEDGER shape
          # (are declarations sticking? is the grammar sufficient?) rather than per-finding accuracy.
          set +e
          bun src/Core.TypeScript/hygiene/mutation-convergence-cli.ts --repo-root .
          CONV_RC=$?
          set -e
          if [ "$CONV_RC" -ne 0 ]; then
            echo "::warning::[convergence] measurement failed rc=$CONV_RC — registry health is unmeasured"
          fi

          # STAGE db/ — this is what makes the metric mean anything (Aaron 2026-08-12).
          #
          # The runner now records EVERY observation to db/mutation-findings/<agent>.jsonl, not just
          # the ones somebody chose a cell on. Without committing it the write lands in a checkout
          # that is thrown away, and the false-alarm rate can only ever be false/RESOLVED — a
          # voluntary, biased sample. With it, `alarmsReported` is the real population.
          #
          # Scoped to db/ EXACTLY, never `git add -A`: the same rule §159 states for the healer.
          # One line per agent per tick, and the append is idempotent by content address, so a
          # re-run of a tick adds nothing and produces an empty diff rather than a duplicate.
          git add db/mutation-findings/ || true
          if git diff --cached --quiet; then
            echo "[mutation] no new findings to record"
          else
            git commit --no-verify -q -m "findings($AGENT): tick $TICK mutation observation

          Denominator for the false-alarm rate — every observation, not just resolved ones.
          Idempotent by content address; a re-run of this tick appends nothing.

          Co-Authored-By: Kiro <noreply@kiro.dev>"
          fi
          exit 0

      - name: Measure cadence (declared vs actual — detect silent degradation)
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          # WHY THIS IS ALL IN PYTHON AND FILTERED BY AGENT.
          #
          # Three agents tick together, so "the last two events" GLOBALLY are two different
          # agents inside the SAME tick. Measuring that gap reports the spacing between peers,
          # not the cadence: on real data it read 29s / "3004% of target" while the society was
          # actually running at 14% of target. A measurement that confidently reports the
          # opposite of the truth is worse than none — it manufactures false confidence.
          # Consecutive events FOR ONE AGENT are consecutive TICKS. That is the cadence.
          #
          # Python, not shell: `ls -t` trips SC2012 (actionlint escalates it to a gate failure —
          # it turned main red in #9898), and `find -printf` is GNU-only so it would work on the
          # runner while being unverifiable on a Mac — the same environment-mismatch trap that
          # made #9890 ship broken. Reading the JSON directly avoids both and is testable
          # anywhere. Event files are ZetaId-named and ZetaIds are time-ordered, so name order
          # is chronological — verified against all 947 committed events, not assumed.
          #
          # Output goes to STDOUT, never captured into a variable: #9898 assigned the result to
          # $GAP and never referenced it, so the measurement AND its ::warning:: were computed
          # correctly and discarded. An annotation only becomes an annotation on the step's
          # stdout. The measurement added to catch silent degradation was itself silent.
          python3 -c "
          import json, glob, os, sys
          agent = os.environ.get('AGENT', '')
          rows = []
          for f in sorted(glob.glob('docs/observe-events/*.json')):
              try:
                  d = json.load(open(f))
              except Exception:
                  continue
              if d.get('by') == agent and d.get('at'):
                  rows.append(d['at'])
          if len(rows) < 2:
              print(f'[cadence] {agent}: fewer than 2 events — cannot measure yet')
              sys.exit(0)
          from datetime import datetime
          # SORT BY TIMESTAMP, not by filename. The comment above says name order is chronological
          # because ZetaIds are time-ordered — that was verified once and is no longer true. One
          # event is named with the HEX OF ITS OWN JSON (7b22... decodes to an attestor record),
          # after every ZetaId (7b > 08) while carrying a timestamp three days earlier. On real data
          # that produced a gap of MINUS 59.6 hours and 'actual=0.0% of target' — a measurement
          # confidently reporting the opposite of the truth, which is the exact failure this step's
          # own comments say it was rewritten to avoid. Sorting on the value we actually measure is
          # robust to however the files come to be named.
          ts = sorted(datetime.fromisoformat(r.replace('Z', '+00:00')) for r in rows)
          gaps = [(b - a).total_seconds() for a, b in zip(ts, ts[1:]) if (b - a).total_seconds() > 0]
          declared = 900
          gap = gaps[-1] if gaps else 0
          ratio = declared / gap if gap > 0 else 0
          print(f'[cadence] {agent}: gap={int(gap)}s ({gap/60:.1f}min) declared=900s ({declared/60:.0f}min) actual={ratio:.1%} of target')
          # SUSTAINED drift, not just the last gap. One late tick is weather; a median that sits far
          # from the declared cadence is climate, and only the second is worth acting on. Measured
          # over a window so a single outlier can neither raise nor silence the alarm.
          window = gaps[-10:]
          if len(window) >= 3:
              srt = sorted(window)
              med = srt[len(srt)//2] if len(srt) % 2 else (srt[len(srt)//2 - 1] + srt[len(srt)//2]) / 2
              drift = med / declared if declared else 0
              over = sum(1 for g in window if g > 2 * declared)
              print(f'[cadence] {agent}: DRIFT over last {len(window)} ticks — median={med/60:.1f}min vs declared {declared/60:.0f}min = {drift:.1f}x slower; {over}/{len(window)} over 2x')
              if drift >= 2:
                  print(f'::warning::[cadence] {agent}: SUSTAINED drift — median {med/60:.1f}min against a declared {declared/60:.0f}min ({drift:.1f}x). The declared cadence is not what the society actually runs at; every per-tick rate means something other than it says.')
          if gap > 1800:
              print(f'::warning::[cadence] {agent}: {gap/60:.0f}min since its last tick, over 2x the declared 15min. Running at {ratio:.0%} of target.')
          " || echo "::warning::[cadence] measurement failed (non-fatal — but the cadence is now UNMEASURED, which is the condition this step exists to prevent)"

      - name: Auto-merge clean PRs (agent-to-agent value transfer)
        env:
          # ── WHO ARMS THE MERGE DECIDES WHETHER IT IS EVER ARCHIVED ─────────
          #
          # This step hardcoded `secrets.GITHUB_TOKEN` while every other
          # credentialed step in this file used the PAT fallback chain. That one
          # inconsistency is the root cause of the PR-archive coverage collapse,
          # and it is invisible because NOTHING FAILS:
          #
          #   arm with GITHUB_TOKEN -> auto-merge fires as `github-actions[bot]`
          #   -> GitHub suppresses workflow triggers for GITHUB_TOKEN-driven
          #      events (the recursion guard) -> no `pull_request: closed`
          #   -> pr-archive-on-merge.yml NEVER RUNS -> the PR is never archived.
          #
          # No run is created, so no run is red. Measured 2026-08-21..25: of 765
          # eligible unarchived PRs, 747 (97.6%) were bot-merged; of 539 archived
          # in the same window, 530 (98.3%) were user-merged. Per-SHA: bot-merged
          # -> 0 workflow runs; user-merged -> 1 run, success. Daily coverage held
          # at 100.00% from 08-11 to 08-20 and collapsed on 08-21, exactly as the
          # bot-merge share crossed over (9/40 -> 11/40 -> 29/40).
          #
          # THIS IS WHY GRANTING THE PAT MORE PERMISSIONS NEVER HELPED: the step
          # never read the PAT. It is a workflow defect, NOT the credential
          # denial tracked by 081M05G8D36087G0R0034D3QPA.
          #
          # AND SWAPPING THE TOKEN ALONE IS NOT SUFFICIENT. `gh pr merge --auto`
          # is the GraphQL mutation `enablePullRequestAutoMerge`, and the scoped
          # flush PAT has been measured being refused it on every call:
          #   `GraphQL: Resource not accessible by personal access token
          #    (enablePullRequestAutoMerge)`
          # -- src/Core.TypeScript/agent-heartbeats/merge-heartbeats-to-main.ts
          #    and docs/research/2026-08-13-graphql-is-the-scarce-budget-and-
          #    automerge-is-graphql-only.md. A blind swap would therefore have
          #    armed NOTHING and stalled the merge queue outright, which is worse
          #    than the bug it was meant to repair.
          #
          # So: PREFER the PAT, and degrade to GITHUB_TOKEN on a refusal, ONCE
          # per run, loudly, naming the exact missing scope. The day the PAT carries
          # `Pull requests: read and write`, archive coverage repairs itself with no
          # further edit here.
          #
          # ROLE: PR-CREATE — ZETA_PR_ARCHIVE_TOKEN, per the role table in
          # docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md.
          # The `||` chain that stood here named three secrets in one variable, so "which
          # authority is this step running under" had no answer visible anywhere in the log.
          # FALLBACK_GH_TOKEN stays, because the degradation below is DELIBERATE, EXPLICIT
          # and LOGGED — that is the distinction being drawn, not a ban on ever degrading.
          GH_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT: ${{ matrix.agent }}
        run: |
          # Only the first agent in the matrix (alexa) does merge duty to avoid races
          if [ "$AGENT" != "alexa" ]; then
            echo "[merge] Skipping — only alexa handles merge duty"
            exit 0
          fi

          # SELECTION — why this is not `gh pr list ... | head -3`.
          #
          # It used to be. `gh pr list` returns NEWEST-FIRST, so `head -3` made this a LIFO
          # stack with a cap: whenever three fresher mergeable PRs existed at tick time, every
          # older PR was passed over. Not merged slowly — passed over on every tick, forever.
          # On 2026-08-14 that had stranded 19 bot PRs, the oldest 13 hours old, and it was
          # what turned main red: soraya's archive duty had committed the manifest.jsonl repair
          # on schedule, and its PR was sitting in the starved tail while pr-manifest-integrity
          # failed with "the repair writer has stopped landing". The writer had not stopped.
          # The queue had.
          #
          # Capacity was never the problem: 3 per tick x 2 ticks/hour = 144/day against ~100
          # PRs/day. Ordering was. So this selects OLDEST-FIRST, and the cap is now a rate
          # limit rather than a queue bound.
          #
          # It also filters to UNARMED PRs (`auto_merge == null`). Arming is durable and
          # idempotent — an armed PR merges when its checks go green with no further help — so
          # re-arming one is pure waste, and spending slots on it is how a cap this small
          # starves the tail. Filtering to unarmed makes the candidate set shrink monotonically
          # as we work it, which is what makes 3/tick sufficient.
          #
          # REST, not `gh pr list --json` (GraphQL). One request, zero GraphQL points, and the
          # REST list response already carries `auto_merge` — which the GraphQL path did not
          # give us anyway. Rate-limit budgets are separate per API and the GraphQL one is what
          # binds us.
          # SCOPE — automation branches ONLY, and this is load-bearing.
          #
          # This step is titled "agent-to-agent value transfer" and exists for terminal
          # bookkeeping: PR-review archives and telemetry flushes. It was never scoped to that
          # in code, and while the selection was newest-first that omission LOOKED harmless —
          # the newest open PRs are almost always the bookkeeping ones, so the unfiltered
          # selection happened to land on them.
          #
          # Inverting to oldest-first (the starvation fix above) turned that latent hole into a
          # live one, aimed at the worst possible target. The OLDEST unarmed PRs are precisely
          # the ones a human or a reviewing agent deliberately left unarmed pending review.
          # Caught 2026-08-14T13:46Z with the next three selections being an unreviewed
          # passkey-authorization PR, an unreviewed FROST signing change carrying a P0 CSPRNG
          # fix, and an exact-arithmetic carrier — i.e. a heartbeat was one step from arming
          # auto-merge on security-class changes nobody had read. Draft status held them off
          # (see the `.draft` filter) but draft is a human convention, not a guard.
          #
          # So the guard is the branch name, matched against the prefixes THIS repo's
          # automation actually pushes. A substantive change never lives on those branches, so
          # it can never be selected here regardless of age, review state, or who forgot to
          # mark something draft. Fail-closed: an unrecognised branch is not auto-merged.
          #
          # If a new automation lane is added, add its prefix here DELIBERATELY. That one-line
          # diff is the whole cost, and it is the correct place to think about whether that
          # lane's output should merge without a human.
          CANDIDATES=$(gh api "repos/{owner}/{repo}/pulls?state=open&per_page=100" \
            --jq '[.[]
                   | select(.auto_merge == null)
                   | select(.draft == false)
                   | select(.head.ref
                            | startswith("automation/pr-archive-")
                              or startswith("heartbeat/"))]
                  | sort_by(.created_at) | .[].number' 2>/dev/null)
          if [ -z "$CANDIDATES" ]; then
            echo "[merge] No unarmed PRs — the queue is caught up."
            exit 0
          fi

          # A PR that can never be armed (conflicting, blocked by a failed required check) would
          # otherwise occupy a slot on every tick and re-create the starvation from the head
          # instead of the tail. So the cap counts SUCCESSES, not attempts: a failure costs an
          # API call and moves on. ATTEMPT_LIMIT bounds the blast radius when many are stuck.
          # THE ARMING CREDENTIAL IS CHOSEN ONCE PER RUN, NOT PER PR. A refusal
          # costs a GraphQL point, and GraphQL is the budget that actually binds
          # this repo (measured 2026-08-14: 1147/5000 GraphQL points against
          # 33/5000 REST requests). Re-probing on every candidate would spend
          # three times that for no information the first probe did not give.
          #
          # `set +e` AROUND THE LOOP IS REQUIRED, not stylistic. No `shell:` is
          # declared anywhere in this workflow, so GitHub runs each `run:` block
          # under its default `bash -e`. The previous form was errexit-safe by
          # accident — `if gh pr merge ...; then` puts the command in a condition,
          # which errexit exempts. Capturing output into a variable does not get
          # that exemption: `OUT=$(cmd)` with a failing `cmd` aborts the step
          # before the `$?` check can run, which would turn one unarmable PR into
          # a dead merge duty for the whole tick.
          set +e
          # THE SELECTION IS EXPLICIT NOW, AND IT NAMES THE SECRET. This used to compare
          # GH_TOKEN against FALLBACK_GH_TOKEN, which worked only because a `||` chain had
          # already collapsed the absent case onto GITHUB_TOKEN somewhere out of sight in the
          # `env:` block. With one role and one secret the absent case is an EMPTY string, so
          # the test is emptiness and the report says which secret is missing and what it needs.
          #
          # The DEGRADATION here is deliberate and is kept: arming is an optimisation, an
          # unarmed PR is merged by the next duty cycle, and a credential fault must never
          # stall the merge queue (.claude/rules/tick-must-never-stop.md). What was wrong was
          # never the fallback — it was that the fallback happened SILENTLY, in an expression,
          # with no line in the log saying a different authority had been substituted.
          ARM_MODE=pat
          if [ -z "${GH_TOKEN:-}" ]; then
            ARM_MODE=workflow-token-only
            echo "::warning title=Auto-merge arming has no PR-CREATE credential::ZETA_PR_ARCHIVE_TOKEN is absent, so PRs are armed by GITHUB_TOKEN and their merges raise no events at all: no 'gate' push run and therefore no post-merge verdict on the merged commit, and no pr-archive-on-merge.yml run either (archive coverage then rests on the backfill sweep alone; the verdict has no backfill). FIX: set repository secret ZETA_PR_ARCHIVE_TOKEN on Lucent-Financial-Group/Zeta to a fine-grained PAT with 'Pull requests: read and write' + 'Metadata: read'. Role table: docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md"
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
          fi

          ARMED=0
          ATTEMPTS=0
          CAP=3
          ATTEMPT_LIMIT=20
          for PR in $CANDIDATES; do
            [ "$ARMED" -ge "$CAP" ] && break
            [ "$ATTEMPTS" -ge "$ATTEMPT_LIMIT" ] && break
            ATTEMPTS=$((ATTEMPTS + 1))
            MERGE_OUT=$(gh pr merge "$PR" --squash --auto --delete-branch 2>&1)
            MERGE_RC=$?
            # A PAT refused the mutation: degrade ONCE, name the exact scope, and
            # keep arming. A credential fault must not stall the queue, and it
            # must not be silent either — the silence is what this whole change
            # set is repairing.
            #
            # THE CONSEQUENCE NAMED HERE WAS TOO SMALL (corrected 2026-08-26,
            # 081M0YWHE7G087G0R001PSGEH5). It said only that pr-archive-on-merge.yml
            # would not fire. True, and it is the lesser half. The suppressed event also
            # means NO `gate` PUSH RUN, so the merged commit carries no post-merge
            # verdict at all — and since `CI Gate` has
            # `strict_required_status_checks_policy: false`, that run is the only cover
            # for "two PRs green alone, red together". Measured over a full population,
            # `main` 06:00Z..11:10Z on 2026-08-26: 89 commits, total separation —
            # AceHack-merged 63/63 got a push run, github-actions[bot]-merged 26/26 got
            # none, and all 26 were `heartbeat/*`. A warning that under-states its own
            # blast radius gets triaged at the wrong priority, which is how this one sat.
            if [ "$MERGE_RC" -ne 0 ] && [ "$ARM_MODE" = "pat" ] \
               && printf '%s' "$MERGE_OUT" | grep -q "not accessible by personal access token"; then
              echo "::warning title=Auto-merge arming PAT lacks enablePullRequestAutoMerge::ZETA_PR_ARCHIVE_TOKEN (the PR-create role credential) was refused the GraphQL mutation, so arming falls back to GITHUB_TOKEN. GitHub's recursion guard then suppresses every event that merge would raise: these commits land on main with NO 'gate' push run and therefore NO post-merge verdict (measured 2026-08-26: 26 of 26 bot-merged main commits had zero gate push runs, against 63 of 63 for PAT-merged), and pr-archive-on-merge.yml does not fire for them either. FIX: grant that fine-grained PAT 'Pull requests: read and write' on Lucent-Financial-Group/Zeta. This is a DIFFERENT scope from the 'Contents: read and write' denial tracked by 081M05G8D36087G0R0034D3QPA; the blocker itself is tracked by 081M0YWHE7G087G0R001PSGEH5."
              ARM_MODE=degraded-to-workflow-token
              export GH_TOKEN="$FALLBACK_GH_TOKEN"
              MERGE_OUT=$(gh pr merge "$PR" --squash --auto --delete-branch 2>&1)
              MERGE_RC=$?
            fi
            printf '%s\n' "$MERGE_OUT"
            if [ "$MERGE_RC" -eq 0 ]; then
              ARMED=$((ARMED + 1))
              echo "[merge] armed auto-merge on PR #$PR (credential: $ARM_MODE)"
            else
              echo "[merge] PR #$PR could not be armed (non-fatal) — not consuming a slot"
            fi
          done
          set -e
          echo "[merge] armed $ARMED of $CAP (attempted $ATTEMPTS, $(echo "$CANDIDATES" | wc -l) unarmed in queue, credential: $ARM_MODE)"

      - name: Archive PR review history (git-native backup)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT: ${{ matrix.agent }}
        run: |
          # Only soraya handles archive duty (rotate duties across agents)
          if [ "$AGENT" != "soraya" ]; then
            echo "[archive] Skipping — only soraya handles archive duty"
            exit 0
          fi

          # BACKFILL NET. The primary archive path is pr-archive-on-merge.yml, which archives
          # each PR at merge time; this sweep exists only to pick up whatever that path missed.
          #
          # THIS STEP DID NOTHING AT ALL FROM THE DAY IT SHIPPED UNTIL 2026-08-14
          # (081M005VXY6087G0R001T04ATY). Three independent defects, each sufficient on its own:
          #
          #   1. `--batch 3` is not a flag archive-pr-reviews.ts has ever accepted. Its parser
          #      hits the else-branch, writes "unknown arg: --batch" and exits 1. Live proof:
          #      run 31800609010, soraya tick — the entire step output was that one line.
          #   2. `2>&1 | tail -10` made the failure invisible: a pipeline's exit status is the
          #      LAST command's, so the archiver's 1 became tail's 0. That also made the
          #      trailing `|| echo "::warning::"` UNREACHABLE — it could never fire.
          #      Check: `bash -c 'false 2>&1 | tail -10 || echo FALLBACK; echo $?'` -> no
          #      FALLBACK, exit 0. So the step reported success on every tick, forever.
          #   3. `--since 7d` matched ZERO PRs even had the above been fixed. That filter is a
          #      lexicographic string compare against ISO `mergedAt`, and
          #      "2026-08-14T..." >= "7d" is false. An earlier comment in this file asserted
          #      `--since 7d` was "working" on this step; that claim was WRONG and is retracted
          #      here. `--since` now parses Nd/Nh into a real cutoff and rejects garbage loudly.
          #
          # Cost of the outage, measured 2026-08-14 rather than guessed: archiving has a
          # 1282-PR-number hole between PR 9058 (2026-07-01) and PR 10341 (2026-08-13),
          # ~1273 merged PRs with no shard. GitHub still holds those review threads; what was
          # lost is the git-canonical mirror this repo keeps precisely because the host copy is
          # not durable. This net is what should have drained that hole and never ran.
          #
          # --limit 3 is a real bound, and it DRAINS rather than spinning: the tool skips
          # PRs that already have a shard and takes the OLDEST 3 of what is left. Oldest-first
          # is deliberate — newest-first with a small cap re-picks the same head every tick and
          # starves the tail (the unbounded-queue starvation bug fixed elsewhere in this file).
          # The backlog drains monotonically; once drained the tool prints "nothing to
          # backfill" and exits 0.
          #
          # WHY 3 AND NOT 25 — blast radius, not arithmetic (Aaron 2026-08-14).
          #
          # The measurement genuinely favours a larger bound. Per-invocation cost splits into a
          # FIXED part and a MARGINAL part:
          #   fixed:    `gh pr list --state merged --limit 3000` = 30 GraphQL points, ~10s.
          #   marginal: 3 GraphQL points + ~2 REST requests + ~4.4s per PR archived.
          #             (Measured, not derived from the node-count formula, which predicts
          #             ~150 points/PR for the reviewThreads query and is wrong here — GitHub
          #             charged 1 point for each of the three calls.)
          # So at --limit 3 this step spends 39 GraphQL points to archive 3 PRs: 77% of the
          # budget goes on the listing and 23% on the work. At 25 it would be 71% useful and
          # take the drain from ~9 days to ~27 hours. On cost alone, 25 wins.
          #
          # It is 3 anyway, and the reason is the track record of THIS step specifically:
          #
          #   Archive bodies under docs/history/pr-reviews/ ever added by a heartbeat commit: 0.
          #   Checked over 500 commits touching that directory — every one came from
          #   pr-archive-on-merge.yml or a bulk backfill PR. This lane has never once worked.
          #
          # And on 2026-08-14 four defects were found in this one step, in sequence, each
          # masking the next: `--batch 3` was not an accepted flag (exit 1 on arg parsing);
          # `| tail -10` swallowed that exit code so the `::warning::` fallback was unreachable;
          # `--since 7d` compared timestamps LEXICOGRAPHICALLY (`"2026-…" >= "7d"` is false) so
          # it matched nothing even had the flag parsed; and the commit staged the shard index
          # while never staging the archive BODY the shard points at.
          #
          # That last one is why the bound is the safety knob rather than a throughput dial. It
          # is SELF-SEALING: `selectBatch` skips any PR that already has a shard, so a shard
          # written without its body is never re-selected and never repaired. A bulk drain under
          # that defect would have converted ~1,345 PRs missing from the mirror into ~1,345
          # permanent dangling pointers.
          #
          # Four defects in one step in one day makes a fifth likely enough that cheap discovery
          # beats fast completion. At 3, an undiscovered defect costs 3 PRs and shows up in the
          # first flush. At 25 it costs 25. The drain is not urgent — these PRs have been out of
          # the mirror for six weeks, GitHub still holds the threads, and 9 days versus 27 hours
          # buys nothing against that risk.
          #
          # RAISE IT once this lane has produced a few clean ticks — at which point it will have
          # a track record for the first time, and the measurement above is already done.
          #
          # RAISED 3 -> 15 on 2026-08-25, and the condition above is what authorises it: the lane
          # has run cleanly for days and the fifth defect did not appear. It is raised because at
          # 3 THE SWEEP CANNOT KEEP UP, and it has to — it is no longer the safety net, it is the
          # ONLY path for a large population of merges.
          #
          # WHY. GitHub does not deliver a `pull_request` event for an action taken with
          # GITHUB_TOKEN, so a PR merged by `github-actions[bot]` never triggers
          # pr-archive-on-merge.yml — no run is created, nothing fails, nothing is red. Measured
          # over 2026-08-21..25: of 765 eligible unarchived PRs, 747 (97.6%) were bot-merged;
          # of 539 archived in the same window, 530 (98.3%) were user-merged. The bot-merge share
          # of all merges crossed over on 08-20; coverage collapsed on 08-21.
          #
          # THE ARITHMETIC. Bot-merged PRs accrue at ~150/day. At --limit 3 over 96 ticks/day the
          # ceiling is 288/day, and 41% of that budget was going to `automation/pr-archive-*` PRs
          # that pr-archive-on-merge.yml's `if:` deliberately skips (524 of the 1,289 unarchived
          # PRs in the sweep's reachable window, sitting at the HEAD of an oldest-first queue).
          # Effective drain was therefore ~170/day against ~150/day of accrual — break-even, which
          # is exactly the flat ~1,289 backlog observed. Both halves are fixed: `listMergedPRs` now
          # applies the same eligibility predicate the workflow does, and the bound is 15.
          #
          # The OTHER ceiling this must respect is `timeout-minutes: 10` on this job: blowing it
          # kills the whole tick, not just archive duty. Measured on the three most recent soraya
          # ticks: 136s / 293s / 188s of a 600s budget, with this step at 18s under --limit 3.
          # That is ~6s/PR, so 15 costs ~90s: worst measured tick 293s + 72s = ~365s of 600s.
          # 15 x 96 ticks = 1,440/day against ~150/day of accrual, so the backlog drains rather
          # than holding station. If the job starts timing out, LOWER THIS FIRST — a tick killed
          # by archive duty loses the whole heartbeat, which costs more than a slow drain.
          #
          # THE COVERAGE NUMBER IS NOW MEASURED, which is what makes a raise safe to make at all:
          # src/Core.TypeScript/hygiene/audit-pr-archive-coverage.ts runs 4x/day in
          # pr-manifest-integrity.yml and FAILS below its floors. If this bound is wrong in either
          # direction, that audit says so instead of a human counting files by hand.
          #
          # NO PIPE on the command itself — the output is captured, then printed separately —
          # because piping is what hid the failure for months. The exit code is checked
          # explicitly rather than with `||`, which is unreachable after a pipe. errexit is NOT
          # enabled here: the rest of this step (git add/commit, `|| true`) is written for a
          # non-errexit shell, so turning it on would change behaviour well beyond this fix.
          echo "[archive] Checking for un-archived merged PRs..."
          set +e
          ARCHIVE_OUT=$(bun src/Core.TypeScript/forge-host/github/archive-pr-reviews.ts \
            --owner Lucent-Financial-Group --repo Zeta --all-merged --limit 15 2>&1)
          ARCHIVE_RC=$?
          printf '%s\n' "$ARCHIVE_OUT" | tail -20
          if [ "$ARCHIVE_RC" -ne 0 ]; then
            echo "::warning::[archive] archive-pr-reviews.ts exited $ARCHIVE_RC (non-fatal; see log above)"
          fi

          # RECONCILE THE MERGE-TIME RACE (081M08MVPR9087G0R000NCF8PV).
          #
          # The sweep above archives PRs that have NO doc. This one repairs docs that exist
          # and are WRONG: pr-archive-on-merge.yml fetches review threads the instant a PR
          # closes, and the automated reviewer posts its threads after that, so the archiver
          # records a count that was already stale when it was written and nothing ever
          # revisits. Measured 2026-08-18 over 150 uniformly sampled docs: 20.0% of docs
          # under-report; thread-level capture 74.3%. Against what was FETCHABLE when the
          # archiver looked, capture was 191/191 = 100% — the loss is entirely the race.
          #
          # WHY HERE AND NOT AS A WAIT IN THE MERGE JOB. Only 55 of the 1,997 most recent
          # merged PRs (2.8%) ever acquire a review thread, so waiting out the reviewer tail
          # on every merge would spend ~165 runner-hours a month to help 2.8% of runs — and a
          # fixed wait is only correct until the reviewer population changes, at which point
          # it is wrong SILENTLY. A sweep keyed on "live count exceeds recorded count" is
          # correct for any tail length, is idempotent (§12 — once they agree it does
          # nothing), and costs a few batched queries per tick (~50 s measured).
          #
          # IT ENUMERATES FROM THE REPO, NOT FROM `gh pr list`. Candidates are archive docs
          # joined to their PR shards (which carry `fetched_at`), so the scan is complete by
          # construction with no cap and no ordering assumption. The first draft listed merged
          # PRs and filtered by merge time; that listing is ordered by CREATION, so a PR
          # created weeks before it merged fell off the end and was never judged. Caught by
          # doctoring PR #10367 (created 08-13, merged 08-17, 12 threads) and finding the
          # guard cheerfully passed — a scan reporting success while missing rows, which is
          # the same family as the defect this whole change set is repairing.
          #
          # IT CAN ONLY ADD. A re-archive is a whole-file rewrite, so the tool re-reads the
          # doc afterwards and restores the previous bytes if the count went DOWN. Losing a
          # thread already captured would be worse than the bug being fixed (§5 memory
          # preservation), and "repair" that destroys is not repair.
          #
          # --limit 5 for the same reason --limit 3 is used above: the bound is a blast-radius
          # knob, not a throughput dial. Under-reporting docs run at roughly 2-3/day, so 5 per
          # tick drains faster than they accrue with room to spare.
          #
          # NO PIPE on the command (a pipeline's exit status is the last command's, which is
          # what hid the --batch failure on this step for months). Output captured, printed
          # separately, exit code checked explicitly.
          echo "[archive] Reconciling archive docs that under-report review threads..."
          set +e
          RECONCILE_OUT=$(bun src/Core.TypeScript/forge-host/github/reconcile-review-archive.ts \
            --write --since-hours 48 --min-age-minutes 30 --limit 5 2>&1)
          RECONCILE_RC=$?
          printf '%s\n' "$RECONCILE_OUT" | tail -20
          if [ "$RECONCILE_RC" -ne 0 ]; then
            echo "::warning::[archive] reconcile-review-archive.ts exited $RECONCILE_RC (non-fatal; see log above)"
          fi

          # THIS STEP IS THE SINGLE SERIALISED WRITER OF THE DERIVED MANIFEST INDEX
          # (081KZYP7MNV087G0R002X0E3V9). pr-archive-on-merge.yml no longer stages
          # docs/github/prs/manifest.jsonl, because N concurrent archive PRs writing one shared
          # file is exactly the pairwise-conflict class that work retired. The index has to be
          # maintained SOMEWHERE, and it has to be somewhere serialised, which is here:
          #   - one duty holder (soraya only, gated above),
          #   - workflow-level concurrency group agent-heartbeat with cancel-in-progress: false,
          #   - the branch is hard-reset from origin/main at the top of every tick, so a tick
          #     that fails to land is simply recomputed next tick (idempotent, discipline #6).
          #
          # --write is a full REGENERATION from the shard store, not the per-PR upsert that
          # archive-pr-reviews.ts does. That matters: the shards this tick has to index were
          # written by OTHER runs (every merged PR archives itself), so an upsert of the three
          # PRs handled above would leave the index short by every shard landed since the last
          # tick. Regenerating from the shards is also the only correct repair by construction --
          # the derived file carries no information the shards do not.
          #
          # STALENESS BOUND, stated because a knowingly-stale index is fine and a silently-stale
          # one is not: the shards are authoritative the moment an archive PR merges; the derived
          # index lags them by at most one landed flush.
          #
          # THE BOUND IS MEASURED, NOT DERIVED FROM MIN_INTERVAL_SECONDS. This comment used to
          # say "flush-to-main gates on MIN_INTERVAL_SECONDS=3000, so the bound is ~1 hour plus
          # GitHub scheduled-run delay". That is the gate's PERIOD, not the index's LAG, and
          # quoting it as a bound was a guarantee nothing enforced. Measured on `main` over the
          # 14 days to 2026-08-26, across 303 landings of docs/github/prs/manifest.jsonl:
          #     p50 27.4 min · p90 81.6 min · p95 158.5 min · max 2799.5 min (46.7 h)
          #     14 of 302 gaps (4.6%) exceeded 180 min
          # So ~1 hour is roughly p75, not a ceiling, and the honest statement is: the ENFORCED
          # bound is the 180 minutes pr-manifest-integrity.yml goes red on, which is ~2.2x the
          # measured p90 and is exceeded by ~5% of gaps. Readers wanting the current set must
          # read docs/github/prs/shards/, or run derive-pr-manifest.ts themselves.
          #
          # THE `|| echo` IS DELIBERATE AND STAYS. A transient derive failure must not take down
          # a tick that also archives PRs, reconciles review threads, audits the lane, runs the
          # healers and the mutation probe, and carries the codegen output — the shards are the
          # ledger and the index is rebuilt from scratch next tick (idempotent, #6). What it must
          # NOT do is stand in for a liveness check, and it never could: this step is the WRITER,
          # and the two ways the repair silently stops are the writer not running (caught by the
          # 180-minute bound in pr-manifest-integrity.yml, measured from the oldest unreconciled
          # shard's fetched_at) and the writer's commit not LANDING (caught since 2026-08-26 by
          # the rc=4 guard in the flush job below, which refuses to report a no-op while `main`
          # does not contain the tip this tick parked). Both of those were reached in the sixteen
          # hours to 2026-08-26T07:00Z, and only the first one reported.
          bun src/Core.TypeScript/forge-host/github/derive-pr-manifest.ts --write             || echo "::warning::[archive] manifest derive failed (non-fatal; shards are the ledger)"

          # WATCHDOG FOR STRANDED ARCHIVE PRs (added 2026-08-22).
          #
          # The two archive writers -- pr-archive-on-merge.yml (event-driven) and this backfill
          # duty -- can archive the SAME PR from different bases. Both are idempotent, so
          # neither is wrong; but whichever copy lands on main second becomes an unresolvable
          # add/add conflict on its own shard path, carrying a markdown that is byte-identical
          # to main's and a shard whose fetched_at is strictly OLDER. It can never merge
          # anything new.
          #
          # Nothing noticed that, and that silence -- not the conflict -- is the accumulation
          # generator. A stranded archive PR is ARMED, so the "Auto-merge clean PRs" step
          # filters it out (auto_merge != null); --auto can never merge a CONFLICTING PR; and
          # no reaper existed. Measured 2026-08-22: PR #13843 (archiving #12059, whose record
          # landed on main at 18:25:04 via #13850) sat open ~3 hours and was found by hand.
          # This lane has now accumulated four times; every prior round drained the symptom.
          #
          # NON-FATAL BY DESIGN, and the restraint is the point: this reports the condition and
          # never closes anything. Whether a record is truly redundant is a judgement that
          # belongs to a reviewer who can diff it -- detection is a measurement, not a verdict.
          echo "[archive] Auditing the archive lane for stranded PRs..."
          set +e
          LANE_OUT=$(bun src/Core.TypeScript/hygiene/audit-archive-pr-lane.ts 2>&1)
          LANE_RC=$?
          printf '%s\n' "$LANE_OUT" | tail -20
          if [ "$LANE_RC" -ne 0 ]; then
            echo "::warning::[archive] audit-archive-pr-lane.ts exited $LANE_RC -- the lane is now UNAUDITED, which is the condition it exists to prevent"
          fi
          set -e

          # Stage + commit what the archive wrote. It writes into TRACKED paths
          # (docs/github/prs/ -- shards + the derived manifest) but previously never staged them,
          # and it ran after the push anyway — so its output was written to a runner and destroyed.
          #
          # docs/history/pr-reviews/ IS IN THIS LIST BECAUSE IT IS THE ARCHIVE BODY
          # (081M00GCA8P087G0R000M00W9S). Staging only docs/github/prs/ committed the INDEX
          # while discarding the thing it indexes: archive-pr-reviews.ts writes the rendered
          # markdown to docs/history/pr-reviews/PR-<N>-<slug>.md and the shard is just a
          # pointer at it. The markdown arrives UNTRACKED, so `git diff --quiet` below never
          # saw it, and the later codegen step's `git add -A` is itself gated on a bare
          # `git diff --quiet` that is also blind to untracked files — nothing staged it.
          #
          # That is worse than the six-week hole this step exists to drain, because it is
          # self-sealing: `selectBatch` skips any PR that already HAS a shard, so every PR
          # this step touched would be marked archived, have no body on main, and never be
          # re-selected by --all-merged again. Measured before the fix: 0 of the 6,467 shards
          # on main were dangling and 0 archive bodies had EVER been added by a heartbeat
          # commit (every one came from pr-archive-on-merge.yml or a bulk backfill PR) — the
          # step had simply not yet flushed a tick since its --batch defect was fixed.
          #
          # The guard against a silent recurrence is archive-pr-reviews.test.ts, which derives
          # the required pathspec set from the tool's exported WRITE_TARGETS instead of
          # restating it, so a new output directory cannot be added to the tool without this
          # step failing until it stages it too.
          if ! git diff --quiet -- docs/github/prs/ docs/history/pr-reviews/ \
             || [ -n "$(git ls-files -o --exclude-standard docs/github/prs/ docs/history/pr-reviews/)" ]; then
            git config user.name "${AGENT}[bot]"
            git config user.email "${AGENT}[bot]@users.noreply.github.com"
            git add docs/github/prs/ docs/history/pr-reviews/
            git commit --no-verify -q -m "archive($AGENT): PR review history $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Git-native backup of merged PR review threads.

          Co-Authored-By: Kiro <noreply@kiro.dev>" || true
            echo "[archive] committed archive output"
          else
            echo "[archive] nothing new to archive"
          fi

      - name: Attempt codegen work (7B model — real intellectual work)
        env:
          AGENT: ${{ matrix.agent }}
          ZETA_FIRST_SESSION_MARKER: /tmp/zeta-first-session-complete
          ZETA_SINK_MODE: local
          ZETA_EXECUTOR: codegen
          ZETA_CODEGEN_MODEL: qwen2.5:7b
        run: |
          # Work fires once per hour. Use the hour number (reliable) not the minute
          # (unreliable — delayed cron arrives at random minutes, never exactly :00).
          # Gate: only one work tick per hour per agent, enforced by checking if
          # a work event was already committed this hour (idempotent).
          HOUR=$(date -u +%H)
          ROTATION=$(( HOUR % 3 ))
          AGENTS=("alexa" "otto" "soraya")
          WORK_AGENT=${AGENTS[$ROTATION]}

          if [ "$AGENT" != "$WORK_AGENT" ]; then
            echo "[work] Not my work turn (this hour: $WORK_AGENT). Skipping."
            exit 0
          fi

          echo "[work] My turn for codegen work (agent=$AGENT, model=qwen2.5:7b)"

          # Run the observe loop with the 7B model for real work
          bun src/Core.TypeScript/observe/run-loop-real.ts \
            --by "$AGENT" \
            --event-dir docs/observe-events \
            --participant local-llm:qwen2.5:7b \
            2>&1 | tail -20 || echo "[work] codegen tick failed (non-fatal)"

          # Commit any work produced
          if ! git diff --quiet; then
            git add -A
            git commit --no-verify -m "work($AGENT): codegen tick $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Autonomous intellectual work. Model: qwen2.5:7b (free, 5GB).
          Produced by the observe loop's codegen executor.

          Co-Authored-By: Kiro <noreply@kiro.dev>"
            echo "[work] Committed work output"
          else
            echo "[work] No new work produced this tick"
          fi

      # ═══ Flush: merge heartbeat events to main (hourly, per agent) ═══════════════
      #
      # CORPORATE MODE: creates a PR per agent. The agent-reviewer workflow
      # cross-verifies (the symmetric NFT attestation) then approves.
      #
      # SOVEREIGN MODE (goal): direct push, cross-verification stays as attestation-only.
      # THE PUSH IS LAST, DELIBERATELY — see the ordering audit of 2026-08-01.
      #
      # This job has exactly ONE push. Every step that produces an artifact must therefore run
      # BEFORE it, or its work is committed to a local branch on a runner that is then destroyed.
      # The push used to sit at step 8 of 13, which silently discarded the output of all three
      # productive steps:
      #     archive  — wrote docs/github/prs/ (tracked!) and never even staged it
      #     healer   — committed, never pushed  ("[heal] Committed healed files" — true, inert)
      #     codegen  — `git add -A` + commit, never pushed (the 7B's "real intellectual work")
      # so the society produced exactly one durable artifact per tick, the heartbeat event,
      # because that was the only thing committed before the push.
      #
      # Rule for anyone adding a step here: if it writes or commits, it goes ABOVE this line.
      - name: Emit peer attestation events (symmetric mutual observation)
        env:
          AGENT: ${{ matrix.agent }}
          ZETA_AGENT_ID: ${{ matrix.agent }}
        run: |
          # Every agent attests what it sees from its peers — everyone IS IT.
          # The attestation is a G-set event (same as heartbeats): durable, foldable,
          # composable. Peers' reputation scores derive from these receipts.
          bun src/Core.TypeScript/observe/emit-attestation.ts \
            --attestor "$AGENT" --event-dir docs/observe-events \
            2>&1 | tail -5 || echo "[attestation] emission failed (non-fatal)"

          # Stage any attestation events produced
          git add docs/observe-events/ 2>/dev/null || true
          if ! git diff --cached --quiet -- docs/observe-events/; then
            git commit --no-verify -q -m "attestation($AGENT): peer verification $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Symmetric mutual observation: $AGENT attests peers' recent heartbeat events.
          Durable NFT receipt in the G-set event log.

          Co-Authored-By: Kiro <noreply@kiro.dev>"
            echo "[attestation] committed attestation events"
          fi

      - name: Generate vault state JSON (bridge adapter)
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          set -o pipefail

          # Only otto generates (avoid 3 parallel writes to the same file)
          if [ "$AGENT" != "otto" ]; then
            echo "[bridge] Skipping — only otto generates vault-state"
            exit 0
          fi

          echo "[bridge] Generating vault-roster.json + vault-state.json..."
          set +e
          bun src/Core.TypeScript/observe/vault-state-bridge-cli.ts \
            --events-dir docs/observe-events \
            --tick-history data/tick-history.json \
            --drift-ledger data/drift-mtth.json \
            --output-dir data 2>&1
          BRIDGE_RC=$?
          set -e

          if [ "$BRIDGE_RC" -ne 0 ]; then
            echo "::warning::[bridge] vault-state generation failed rc=$BRIDGE_RC (non-fatal)"
          fi

          # Stage if produced — non-fatal means the push still carries the heartbeat event
          if [ -f data/vault-state.json ]; then
            git add data/vault-roster.json data/vault-state.json
            if ! git diff --cached --quiet -- data/vault-roster.json data/vault-state.json; then
              git commit --no-verify -q -m "bridge(otto): vault-state $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Vault monitoring bridge — projects heartbeat telemetry into Genesis ontology.

          Co-Authored-By: Kiro <noreply@kiro.dev>"
              echo "[bridge] Committed vault-state update"
            else
              echo "[bridge] vault-state unchanged"
            fi
          fi

      - name: Verify RS block integrity (continuous ECC validation)
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          # Only otto verifies (same pattern as bridge — one writer, one verifier)
          if [ "$AGENT" != "otto" ]; then
            echo "[rs-verify] Skipping — only otto verifies RS blocks"
            exit 0
          fi

          if [ ! -f data/rs-blocks.jsonl ]; then
            echo "[rs-verify] No blocks file yet — nothing to verify"
            exit 0
          fi

          set +e
          bun src/Core.TypeScript/observe/verify-rs-blocks.ts --path data/rs-blocks.jsonl --erasures 4 2>&1
          VERIFY_RC=$?
          set -e

          if [ "$VERIFY_RC" -ne 0 ]; then
            echo "::warning::[rs-verify] ECC verification FAILED — at least one block is not recoverable"
          fi

      - name: Phase coverage summary (gap visibility per tick)
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          # Only otto reports (same as verify — avoid 3x duplicate output)
          if [ "$AGENT" != "otto" ]; then
            exit 0
          fi
          if [ ! -f data/rs-blocks.jsonl ]; then
            exit 0
          fi
          bun src/Core.TypeScript/observe/phase-history-cli.ts --summary 2>&1 || true

      - name: Record CI drift + report trend
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          # All agents record their own tick outcome — builds the denominator for
          # per-check drift measurement over time.
          #
          # CHECK IDENTITY IS SHARED WITH THE DRIFT DASHBOARD, DELIBERATELY.
          # `--check` takes a CheckId — the workflow file's basename, the same key
          # `db/drift-dashboard/roster.json` uses. This used to record
          # `--workflow "heartbeat-$AGENT"`, which is not a workflow basename and is in
          # no roster, so the two features would have accumulated separate vocabularies
          # and told two disagreeing health stories about the same repository. The agent
          # goes in `--lane`, which is a satellite: carried for humans, never a key.
          set +e
          bun src/Core.TypeScript/observe/drift-rate-cli.ts \
            --record --check agent-heartbeat --lane "$AGENT" --outcome green \
            --run-id "${GITHUB_RUN_ID:-}" 2>&1
          RECORD_RC=$?
          set -e
          if [ "$RECORD_RC" -ne 0 ]; then
            echo "::warning title=drift-rate::recorder exited $RECORD_RC — this tick's outcome was NOT recorded"
          fi

          # Only otto reports the aggregate drift trend (one output per tick).
          #
          # WHY THIS IS NO LONGER `|| true`, AND WHY IT IS STILL NON-FATAL.
          # Swallowing the status is defensible for telemetry — a broken reporter must
          # not break the heartbeat — but `|| true` alone means a permanently-broken
          # reporter and a working one produce byte-identical evidence, forever. That is
          # the exact class this repo keeps finding (`lockfile-healer.yml` and
          # `zetadb-scheduled-node.yml` were green today solely because they never
          # reached their push).
          #
          # So the status is CAPTURED and ANNOUNCED instead of discarded. The reporter
          # exits 0 whether the news is good or bad — it is a measurement, not a gate
          # (SDV) — and non-zero ONLY when the reporter itself failed. A `::warning::`
          # is therefore never noise, and it is visible in the run summary and to the
          # dashboard without failing the tick. Same shape as `Verify RS block
          # integrity` above; this step was the odd one out.
          if [ "$AGENT" = "otto" ]; then
            set +e
            bun src/Core.TypeScript/observe/drift-rate-cli.ts --report --annotate 2>&1
            REPORT_RC=$?
            set -e
            if [ "$REPORT_RC" -ne 0 ]; then
              echo "::warning title=drift-rate::reporter exited $REPORT_RC — the drift trend for this tick is UNKNOWN, not green"
            fi
          fi

          # COMMIT, not just stage. THIS IS THE FIX THAT MAKES THE LANE REAL.
          # Until 2026-08-22 this step ran `git add data/ci-runs.jsonl` and nothing
          # else. The next step is `git push`, and git does not push a staged-but-
          # uncommitted file — so every tick appended a line to a working-tree file that
          # was discarded when the runner was torn down. `data/ci-runs.jsonl` has never
          # existed on `main`: `git log -- data/ci-runs.jsonl` is empty and the path is
          # absent from `git ls-files`. The step was green on every tick and produced
          # nothing, which is the silent-no-op pattern in its purest form.
          if [ -f data/ci-runs.jsonl ]; then
            git config user.name "${AGENT}[bot]"
            git config user.email "${AGENT}[bot]@users.noreply.github.com"
            git add data/ci-runs.jsonl
            if git diff --cached --quiet -- data/ci-runs.jsonl; then
              echo "[drift-rate] ci-runs.jsonl unchanged"
            else
              git commit --no-verify -q -m "telemetry(drift-rate): $AGENT tick outcome $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Appends one CI outcome to data/ci-runs.jsonl — the denominator for
          'is the society making the code healthier or sicker?'. Flushed to main via
          the heartbeat/* staging path, never pushed at main.

          Agency-Signature-Version: 1
          Agent: $AGENT
          Agent-Runtime: github-actions/.github/workflows/agent-heartbeat.yml
          Agent-Model: qwen2.5:0.5b
          Credential-Identity: AceHack
          Credential-Mode: shared
          Human-Review: not-implied-by-credential
          Human-Review-Evidence: none
          Action-Mode: autonomous-fail-open
          Task: 081M0ZWYF7R087G0R002RXA889
          Co-authored-by: Kiro <noreply@kiro.dev>"
              echo "[drift-rate] committed ci-runs.jsonl"
            fi
          else
            echo "::warning title=drift-rate::data/ci-runs.jsonl absent after --record — nothing to commit"
          fi

      - name: Push heartbeat branch
        env:
          AGENT: ${{ matrix.agent }}
        # --force-with-lease is REQUIRED here, and it is safe. Why both halves matter:
        #
        # REQUIRED: the branch is rebuilt over current main each tick, with its previous final
        # tree delta squash-carried by prepare-heartbeat-branch.ts. Both that rebuild and the
        # flush's squash create new commit identities, so the new lane tip is not generally a
        # descendant of its remote predecessor even when every file is preserved.
        #
        # SAFE: before the rebuild, the preparer three-way merges the remote lane over current main
        # and stages every unflushed change. A conflict stops the tick without pushing. The lease
        # then refuses if another writer moved the remote ref after that observation.
        #
        # CONFIG NOTE: this is why `heartbeat/*` must NOT carry a `non_fast_forward` ruleset.
        # Ruleset 16934633 ("Heartbeat Branch Protection") now targets `refs/heads/heartbeat/*`
        # (re-verified against the live API 2026-08-16; the older note in this file said it
        # targeted `refs/heads/agent-heartbeats` and matched nothing — that is stale). It carries
        # `deletion` ONLY, which is correct: adding non_fast_forward would deadlock this step
        # permanently. The ruleset is NOT what denies this push when it fails — see below.
        #
        # CREDENTIAL: whatever the `Preflight the push credential` step left in place —
        # `ZETA_TELEMETRY_FLUSH_TOKEN` normally, GITHUB_TOKEN if the remote refused it.
        # By the time this step runs the credential has ALREADY been dry-run against the
        # real remote, so this push is not where a credential problem is discovered.
        # That ordering is the point: #10850's bad credential surfaced here, at the end
        # of the tick, once per lane per 15 minutes, for 16.75 hours.
        #
        # Do NOT add an in-step credential swap. One was tried and reverted on
        # 2026-08-16 (#10913 → #10926): it was denied under the same identity in
        # production, and the reason was never established. Both repair mechanisms
        # (`--unset-all` + inline-URL creds, and `--replace-all` of the extraheader) do
        # work under real git locally — checked against this repo 2026-08-16 — so the
        # bench does NOT reproduce the production failure and cannot be trusted to
        # predict it. The preflight above therefore never assumes its own repair worked;
        # it re-probes the remote and says so out loud either way.
        run: git push --force-with-lease origin "heartbeat/$AGENT"

  flush-to-main:
    name: flush ${{ matrix.agent }} heartbeats
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # always() ensures a failed heartbeat can't skip the drain.
    #
    # The hourly cadence is enforced INSIDE the check step against the last landed flush,
    # NOT against the cron string. The previous gate was
    #     endsWith(github.event.schedule, '0 * * * *')
    # but this workflow declares exactly one schedule, '*/15 * * * *', so that predicate was
    # unsatisfiable: flush-to-main never ran on schedule between 2026-08-01 and 2026-08-05.
    # Agents kept ticking the whole time; their events simply never reached main, so the
    # Pages dashboard read ticks_24h=0 / agents_active=0 while the society was in fact alive.
    #
    # Adding a second '0 * * * *' cron would also have worked, but GitHub raises one run per
    # matching cron expression, so the top of every hour would fire TWO runs — each re-pulling
    # ~5GB of Ollama models per agent. Gating on elapsed time keeps one run per tick.
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    needs: [heartbeat]
    strategy:
      fail-fast: false
      matrix:
        agent: [alexa, otto, soraya]

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # NO `token:` OVERRIDE — DELIBERATE, and for a different reason than the tick job's.
          #
          # The tick checkout got the PAT back (081M05G8D36087G0R0034D3QPA) because its
          # credential performs the `heartbeat/$AGENT` push whose ACTOR decides whether gate
          # runs. This one creates one immutable snapshot ref before the PR-only identity takes
          # over. That push uses the workflow's `contents: write` GITHUB_TOKEN; it cannot update
          # main, and it never moves an existing snapshot. All later git calls are read-only.
          #
          # #10850 put the PAT here too, and that was its second, latent break. Correcting the
          # record while I am here: #10926 justified reverting it by saying this credential
          # authenticates `flush-via-staging.ts`'s push. That is stale — this job runs
          # `merge-heartbeats-to-main.ts`, which is API-only; `flush-via-staging.ts` belongs to
          # society-heartbeat.yml and tick-metrics.yml. The conclusion was right, the stated
          # reason was not, and a reason nobody can check is how the wrong thing gets copied
          # forward next time.
          #
          # The PR-creation identity does NOT come from here — it comes from `GH_TOKEN` on the
          # Flush step below, which `gh` reads. Least privilege: the checkout may create only
          # the immutable input ref; the PR identity does not gain repository-write authority.
          persist-credentials: true

      # WITHOUT THIS THE WHOLE FLUSH JOB IS DEAD. The Flush step below shells out to
      # `bun src/Core.TypeScript/agent-heartbeats/merge-heartbeats-to-main.ts`, and this job
      # never installed bun -- only the heartbeat job above did. Every scheduled run therefore
      # exited 127:
      #     line 59: bun: command not found
      #     [flush] alexa: could not open/arm the flush PR (rc=127).
      # Confirmed on runs 31740994688 / 31742919389 / ... / 31755070447 -- every flush leg of
      # every run on 2026-08-13, all three agents. The ticks themselves were green the whole
      # time, so the failure read as an ordinary red X on a noisy workflow rather than as
      # "no agent telemetry has reached main in hours".
      #
      # Found while wiring the derived PR-manifest index onto this job soraya archive duty
      # (081KZYP7MNV087G0R002X0E3V9): that index has a staleness bound only if this job runs,
      # so the bound could not be stated honestly without repairing this first.
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Check if heartbeat branch has events to flush
        id: check
        env:
          AGENT: ${{ matrix.agent }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git fetch origin "heartbeat/$AGENT" 2>/dev/null || { echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          AHEAD=$(git rev-list --count "origin/main..origin/heartbeat/$AGENT")
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" = "0" ]; then
            echo "[flush-gate] $AGENT: nothing ahead of main"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Hourly cadence, measured against the last flush that actually LANDED rather than
          # against the schedule that was supposed to produce it. Self-correcting: GitHub delays
          # scheduled runs by minutes-to-tens-of-minutes on busy repos, so a fixed minute-window
          # check ("is it :00?") silently drops whole hours. "Has an hour passed since the last
          # landed flush?" cannot drift — a late run still flushes, it just flushes late.
          MIN_INTERVAL_SECONDS=3000  # 50 min — tolerates an early tick without skipping the hour

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "[flush-gate] $AGENT: manual dispatch — bypassing the hourly gate"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main --quiet
          LAST_FLUSH=$(git log -1 --format=%ct --grep="^flush(heartbeat): $AGENT " origin/main || echo "")
          if [ -z "$LAST_FLUSH" ]; then
            echo "[flush-gate] $AGENT: no prior flush on main — flushing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ELAPSED=$(( $(date +%s) - LAST_FLUSH ))
          if [ "$ELAPSED" -lt "$MIN_INTERVAL_SECONDS" ]; then
            echo "[flush-gate] $AGENT: last flush ${ELAPSED}s ago (< ${MIN_INTERVAL_SECONDS}s) — holding"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "[flush-gate] $AGENT: last flush ${ELAPSED}s ago — flushing $AHEAD commits"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # SOVEREIGN MODE, activated 2026-08-01. This is the "(goal)" named at the top of this job.
      #
      # WHY THE PR CEREMONY CAME OUT:
      #
      #   1. IT WAS FAILING ON EVERY TICK. `gh pr create` returned "GitHub Actions is not
      #      permitted to create or approve pull requests" every hour for days. Verified this is
      #      NOT branch protection — main requires nothing (required_status_checks: false,
      #      required_pull_request_reviews: false, restrictions: false). It is the Actions
      #      workflow permission, likely org-level. The branch push always SUCCEEDED, so no
      #      events were ever lost; they simply never reached main.
      #
      #   2. THE PR HAD NOTHING TO REVIEW. The payload is pure append-only telemetry —
      #      docs/observe-events/*.json, one file per ZetaId, ~312 of them. Asking a human to
      #      review 312 machine-written event files is ceremony, not verification. A review
      #      nobody can meaningfully perform is a rubber stamp, and a rubber stamp sitting on
      #      the liveness path is strictly worse than no gate at all.
      #
      #   3. THE DATA STRUCTURE ALREADY CARRIES THE SAFETY. These are G-Set (grow-only CRDT)
      #      events under unique ZetaId filenames — the merge is set union, commutative and
      #      idempotent by construction (disciplines #2 lock-free, #6 idempotency). Agents
      #      flushing concurrently cannot semantically conflict. The only real hazard is a
      #      non-fast-forward REF race, which the loop below handles by replaying, never forcing.
      #
      #   4. FORGE-HOST INDEPENDENCE. `gh pr create` put a GitHub-specific call on the critical
      #      path of the society's liveness. `git push` is not GitHub-specific. The forge is a
      #      plugin (forge-host/ carries six adapters); the heartbeat must not care which one is
      #      mounted. Retraction over prevention: a bad flush is retracted like any other drift.
      #
      # SCOPE: this removes the ceremony for TELEMETRY ONLY. Code changes still go through PRs —
      # there the review is not vacuous. Removing a gate where there is genuinely nothing to
      # review is a different act from removing one where there is.
      #
      # Cross-verification is unchanged in kind: it stays attestation-only, exactly as the
      # "SOVEREIGN MODE (goal)" note above specified. Peer attestation is a signed claim about
      # the events, not a merge gate.
      #
      # Verified before shipping (scratch repo, real git, 4 cases): lands on a quiet main;
      # lands after main moved with BOTH agents' events preserved (union); re-flushing
      # already-landed events is a no-op; and a rejected push replays and lands on attempt 2.
      - name: Flush to main (staging branch + checked squash-merge PR)
        id: flush
        if: steps.check.outputs.skip != 'true'
        env:
          AGENT: ${{ matrix.agent }}
          # The Actions identity is forbidden from creating pull requests, so the PR is
          # opened by a fine-grained PAT (pull_requests: write + metadata: read). If the
          # secret is absent the step now REFUSES BY NAME in the preamble below, and the
          # events wait safely on the staging branch — nothing is lost, and the log says
          # which secret is missing instead of degrading to a different authority.
          #
          # ROLE: PR-CREATE — ZETA_PR_ARCHIVE_TOKEN, per the role table in
          # docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md.
          # The `||` chain that stood here named three secrets in one variable, so "which
          # authority is this step running under" had no answer visible anywhere in the log.
          # FALLBACK_GH_TOKEN stays, because the degradation below is DELIBERATE, EXPLICIT
          # and LOGGED — that is the distinction being drawn, not a ban on ever degrading.
          #
          # "ABSENT" IS NOT THE CONDITION THAT OCCURS (2026-08-17). The `||` chain removed
          # from this expression selected on the secret being EMPTY, never on it being
          # DENIED, and the production
          # failure is denial: the PAT is set and unauthorized. On 2026-08-17 that put every
          # lane — otto, alexa AND soraya — into `compare failed: gh: Not Found (HTTP 404)`
          # at 13:46 and again at 14:10. GitHub answers 404, not 403, for a resource the
          # token cannot see, so a denied PAT looks exactly like a missing repository.
          #
          # Measured, so this is not inferred from the error string alone: the identical
          # `gh api repos/{repo}/compare/main...heartbeat/otto-flush-<sha>` call returns
          # `status=diverged` under an authorized credential. Endpoint, URL form and the
          # slash-bearing branch name are all fine; only the credential differs.
          #
          # The preflight step above already solves this for GIT, and solves it properly —
          # probe, swap the extraheader, then RE-PROBE, with its own comment naming the
          # vacuity class it is avoiding. It repairs `git push` only. `gh api` kept the
          # denied PAT, which is why the log shows the snapshot branch pushing successfully
          # and the very next compare 404ing. The preamble below extends that same
          # discipline to the API credential.
          GH_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Probe → swap → RE-PROBE, mirroring the git preflight. The re-probe is the part
          # that matters: a fallback that is applied and never checked is indistinguishable
          # from one that worked, and #10913 was exactly that failure.
          #
          # ONLY AN AUTHORIZATION ANSWER IS ELIGIBLE FOR THE SWAP — the same rule the git
          # preflight states, and for the same reason: "a network blip or an unexpected
          # refusal must NOT silently re-point the credential — that would hide a different
          # failure behind a credential story."
          #
          # This is not hypothetical here. During the GitHub degradation on 2026-08-17
          # (429s, then 503/504 on action downloads) `rerun-cancelled-gate` took a bare
          # `{"message":"Not Found","status":"404"}` while running under an ordinary,
          # perfectly valid GITHUB_TOKEN. So a 404 alone does not prove denial, and a probe
          # that swapped on ANY failure would have quietly demoted a healthy lane to the
          # lesser credential — losing `gate (required)` on its flush PR — on the strength
          # of a transient blip. 5xx and transport failures are therefore left alone and
          # reported as inconclusive rather than acted on.
          # PROBE THE SCOPE THE WORK ACTUALLY USES, NOT MERELY "can I see the repo".
          #
          # The first version of this probe called `GET /repos/{owner}/{repo}`, and it was
          # VACUOUS for the fault it guards. Measured on run 32044425464 (16:07Z 2026-08-17),
          # the first heartbeat after that fix landed: the probe PASSED — neither the denial
          # warning nor the inconclusive warning appears anywhere in the log — and the very
          # next call still died on `compare failed: gh: Not Found (HTTP 404)`. A check that
          # cannot fail under the condition it exists to detect is not a check.
          #
          # The reason is a scope boundary. `GET /repos/{owner}/{repo}` is satisfied by
          # Metadata alone, which this fine-grained PAT has. `GET /repos/{...}/compare/...`
          # is a CONTENTS-scope endpoint, which it does not. So the credential can see the
          # repository and cannot read its commits — and GitHub renders that second refusal
          # as 404, not 403.
          #
          # That also sharpens the diagnosis rather than replacing it: the fault is not "the
          # token sees no repository", it is precisely the missing **Contents** permission
          # named in 081M010H4KE.
          #
          # The probe is `commits?per_page=1`: a Contents-scope read, one page, one request.
          # `compare/main...main` was tried first and REJECTED — it 404s even under a fully
          # authorized credential (verified by hand against this repository), so it would
          # have reported denial unconditionally and demoted every lane forever. That is a
          # worse failure than the vacuous probe it replaced: a check that cannot pass is as
          # useless as one that cannot fail, and it does damage on the way. Both directions
          # were therefore checked against a real credential before this shipped.
          # ABSENT IS NOT DENIED, AND THE PROBE CANNOT TELL THEM APART. With an empty
          # GH_TOKEN, `gh` fails before it reaches the network with "gh: To use GitHub CLI in a
          # GitHub Actions workflow, set the GH_TOKEN environment variable" — no HTTP status at
          # all — so the probe below would classify a MISSING SECRET as "inconclusive" and
          # leave it alone. That is a true sentence about the wrong subject, which is the exact
          # failure mode this whole change set exists to remove. So absence is tested first,
          # named, and reported as itself.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Missing ZETA_PR_ARCHIVE_TOKEN::$AGENT: this step holds the PR-CREATE role and its credential is absent. FIX: set repository secret ZETA_PR_ARCHIVE_TOKEN on Lucent-Financial-Group/Zeta to a fine-grained PAT with 'Pull requests: read and write' + 'Contents: read and write' + 'Metadata: read'. Role table: docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md"
            exit 1
          fi
          # PROBE THE SCOPE THE STEP ACTUALLY USES, NOT A SCOPE IT HAPPENS TO HAVE.
          #
          # This read `repos/$GITHUB_REPOSITORY/commits` — a CONTENTS read — while the
          # step's real work is `gh pr create`, which needs `pull_requests: write`.
          # Those are different permissions, so a credential could sail through the
          # probe and die on the work. It did, twice on 2026-08-25: the probe passed
          # and `gh pr create` returned HTTP 403, and because the guard could not fail
          # for the reason the step fails, three agents read the red as a broken flush
          # and one of them (me) spent two rounds telling the maintainer his token was
          # wrong. It was not; the step was calling PR-create with the branch-push
          # credential.
          #
          # A write scope has no side-effect-free endpoint, so this probes it with a
          # create that CANNOT succeed — `head` names a ref that does not exist — and
          # reads the status code, which discriminates exactly the two cases:
          #
          #     403  the credential may NOT create pull requests here
          #     422  the credential MAY; the request was merely invalid
          #
          # Verified against a known-good credential before shipping: returns 422 with
          # `{"resource":"PullRequest","field":"head","code":"invalid"}` and creates
          # nothing. The contents probe is kept as a second, separate question — the
          # step reads the repo too — so a failure now says WHICH capability is absent.
          probe_api() { { gh api "repos/$GITHUB_REPOSITORY/commits?per_page=1" --jq '.[0].sha' >/dev/null; } 2>&1; }
          probe_pr_create_scope() {
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f "title=zeta-scope-probe" \
              -f "head=zeta-scope-probe-nonexistent-ref-$GITHUB_RUN_ID" \
              -f "base=main" 2>&1
          }
          if PR_PROBE_OUT=$(probe_pr_create_scope); then
            echo "::warning title=Heartbeat PR-scope probe unexpectedly succeeded::$AGENT: the probe create was supposed to fail on a nonexistent head. Check for a stray PR."
          elif printf '%s' "$PR_PROBE_OUT" | grep -q 'HTTP 403'; then
            echo "::error title=Heartbeat PR-CREATE credential lacks the scope::$AGENT: the PR-create credential is refused POST /repos/.../pulls with HTTP 403, so this flush WILL fail at 'gh pr create' no matter what the contents probe says. FIX: grant that fine-grained PAT 'Pull requests: read and write' on Lucent-Financial-Group/Zeta. This is a DIFFERENT scope from the 'Contents: read and write' denial tracked by 081M05G8D36087G0R0034D3QPA."
          elif printf '%s' "$PR_PROBE_OUT" | grep -q 'HTTP 422'; then
            echo "[flush] $AGENT: PR-create scope confirmed (422 on an invalid head = permitted)."
          else
            echo "$PR_PROBE_OUT"
            echo "::warning title=Heartbeat PR-scope probe inconclusive::$AGENT: neither 403 nor 422. Leaving the credential alone — this is not evidence of denial."
          fi
          if ! OUT=$(probe_api); then
            if printf '%s' "$OUT" | grep -qE 'HTTP (401|403|404)'; then
              echo "::warning title=Heartbeat API credential denied::$AGENT: ZETA_PR_ARCHIVE_TOKEN cannot read this repository over the API; falling back to GITHUB_TOKEN. FIX: grant that fine-grained PAT 'Contents: read and write' on Lucent-Financial-Group/Zeta (081M010H4KE)."
              export GH_TOKEN="$FALLBACK_GH_TOKEN"
              if OUT2=$(probe_api); then
                echo "[flush] $AGENT: fallback API credential verified; lane is DEGRADED but alive."
              else
                echo "$OUT2"
                echo "::error title=Heartbeat has no working API credential::$AGENT: BOTH the PAT and GITHUB_TOKEN were refused by the API. Not a credential-swap case — do not treat this as the known PAT denial."
              fi
            else
              echo "$OUT"
              echo "::warning title=Heartbeat API probe inconclusive::$AGENT: the probe failed, but not with an authorization answer. Leaving the credential alone — this is not evidence of denial."
            fi
          fi

          AHEAD=$(git rev-list --count "origin/main..origin/heartbeat/$AGENT")
          echo "[flush] $AGENT: $AHEAD heartbeat commits to flush"

          # ════════════════════════════════════════════════════════════════════════
          # ONE FIXED FLUSH REF PER LANE — this block used to mint one per tick
          # ════════════════════════════════════════════════════════════════════════
          #
          # It pushed `heartbeat/$AGENT-flush-$SOURCE_SHA`, a NEW ref on every flush. Measured
          # on origin 2026-08-25: 1,610 such refs (alexa 564, otto 532, soraya 514) out of
          # 1,631 `heartbeat/*` refs total.
          #
          # AND NOTHING COULD EVER HAVE CLEANED THEM UP. Ruleset "Heartbeat Branch Protection"
          # (16934633) covers `refs/heads/heartbeat/*` with a `deletion` rule, `bypass_actors:
          # []`, `current_user_can_bypass: "never"`. No agent, no admin and no workflow may
          # delete one, and `delete_branch_on_merge` cannot fire on them either. Checked, not
          # assumed: merged flush PRs #15267/#15255 still have their heads on the remote,
          # while `automation/*` branches in the same repo ARE deleted on merge.
          #
          # So the leak was never the "superseded PR closed unmerged" case it was reported as
          # — a MERGED flush leaked its ref just the same — and "delete the branch when the PR
          # reaches a terminal state" is not an available fix here. Under the ruleset as
          # written the only remedy is to stop minting names. Note this needs NO ruleset change
          # and adds NO bypass actor: the protection stays exactly as strict as it was.
          #
          # THE REF IS NOW IMMUTABLE-WHILE-OPEN RATHER THAN IMMUTABLE-FOREVER, which is what
          # the snapshot was really buying. The head must not move while its PR is under test,
          # so this checks for an open PR FIRST and simply does not flush when one exists. That
          # costs nothing: the tick job rebuilds `heartbeat/$AGENT` every 15 minutes carrying
          # any prior unflushed delta over current main, so a skipped flush's payload is
          # re-accumulated into the next one. This is the same active/buffer backpressure
          # `flush-via-staging.ts` implements for the other lanes, and it is why the
          # "superseded flush carries observations the newer one does not" hazard cannot arise
          # here: there is never more than one open flush PR per lane, so nothing is ever
          # superseded, and the lane — not the ref — is what holds unlanded work.
          SOURCE_SHA=$(git rev-parse "origin/heartbeat/$AGENT")
          SNAPSHOT_REF="heartbeat/$AGENT-flush"
          # SOURCE_SHA is REASSIGNED by the pre-merge below; LANE_SHA is not. The rc=4
          # ("main already contains this branch") branch at the end of this step needs the
          # immutable lane tip to tell an honest no-op from a silent stall, and reading a
          # variable the pre-merge has since moved is how it would fail to notice.
          LANE_SHA="$SOURCE_SHA"

          # A DENIED CREDENTIAL MUST NOT READ AS A CLEAR RUNWAY.
          #
          # This was `... 2>/dev/null || true`, which made a FAILED query indistinguishable
          # from a successful one that found nothing. Both produced an empty
          # `OPEN_FLUSH_PR`, and empty means "no PR is open, proceed" — so a 403 here does
          # not merely blind the check, it INVERTS it: the lane concludes the runway is
          # clear and force-pushes `$SNAPSHOT_REF` over the head of a PR that is still
          # under test. That is the precise hazard backpressure exists to prevent, reached
          # by the guard against it failing quietly.
          #
          # Not hypothetical. On 2026-08-25 this exact job ran with a token that could not
          # perform PR operations (`gh pr create` → HTTP 403), and the only reason no ref
          # was clobbered is that the failure happened to land on the create rather than on
          # this list. The credential was equally denied for both.
          #
          # So: capture stderr, read the status DIRECTLY (never through a pipe — `$?` after
          # a pipeline is the last command's), and treat a failed query as fatal. Refusing
          # to flush costs one tick; the lane re-accumulates and the next flush carries it.
          # Guessing costs another agent's in-flight work.
          PR_LIST_ERR="$(mktemp)"
          OPEN_FLUSH_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$SNAPSHOT_REF" --base main --json number --jq '.[0].number // empty' 2>"$PR_LIST_ERR")"
          PR_LIST_RC=$?
          if [ "$PR_LIST_RC" -ne 0 ]; then
            echo "::error title=Heartbeat backpressure state unknown::$AGENT: could not list open PRs for $SNAPSHOT_REF (rc=$PR_LIST_RC). REFUSING to flush rather than assume the runway is clear — proceeding could force-push over an in-flight PR's head. No events are lost; heartbeat/$AGENT keeps them and the next flush carries this tick too."
            sed 's/^/[flush] gh: /' "$PR_LIST_ERR" || true
            rm -f "$PR_LIST_ERR"
            exit 1
          fi
          rm -f "$PR_LIST_ERR"

          # BACKPRESSURE NEEDS AN ESCAPE, OR IT IS A DEADLOCK.
          #
          # Waiting for the open flush PR is correct only while that PR can still merge. A
          # CONFLICTED one never can: `mergeStateStatus: DIRTY` means there is no computable
          # merge ref, and nothing upstream ever rebases a flush snapshot. So the lane waits
          # on an event that cannot occur, and the retirement pass that would clear it lives
          # BELOW this early return and is never reached. Measured 2026-08-25: soraya blocked
          # behind DIRTY #15319 since 07:50 and alexa behind #15326, both lanes dead with the
          # tick still reporting healthy.
          #
          # Closing it loses nothing, for the reason stated above: the LANE holds unlanded
          # work, not the ref. `heartbeat/$AGENT` still carries every unflushed commit, so the
          # next flush re-cuts the snapshot from the current lane head over current main —
          # which is also what resolves the conflict.
          #
          # Scoped deliberately to DIRTY. A gate-FAILING PR is not retired here: re-cutting on
          # every tick would relaunch the same failing checks forever and turn a real, visible
          # failure into an invisible retry loop. That case gets a loud warning below instead,
          # because a stuck lane a human can see beats a stuck lane that hides itself.
          if [ -n "$OPEN_FLUSH_PR" ]; then
            BLOCKER_STATE=$(gh pr view "$OPEN_FLUSH_PR" --repo "$GITHUB_REPOSITORY" \
              --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null || echo UNKNOWN)
            if [ "$BLOCKER_STATE" = "DIRTY" ]; then
              # ONE RETRY, THEN BE LOUD — retiring a blocker assumes the re-cut FIXES it.
              #
              # The original escape (mine, earlier today) assumed a re-cut from the
              # current lane head over current main resolves the conflict. Measured
              # hours later: it does not always. #15362 was retired as DIRTY, the lane
              # re-cut as #15366, and #15366 came back DIRTY too — so the escape would
              # retire and re-cut forever, replacing a permanent wedge with a permanent
              # churn. Quieter than the wedge, and therefore worse: nothing goes red.
              #
              # Stranger still, and the reason this backs off rather than trying harder:
              # `git merge-tree` says that head merges into that exact base CLEANLY
              # (rc=0, same base 7e1e1487f, same head 5a67ec385), while GitHub reports
              # CONFLICTING on three consecutive reads. I could not reconcile them. An
              # automation that does not understand why a thing is failing must not keep
              # acting on it — so it acts ONCE and then hands over.
              RETIRE_MARKER="Retired by the flush lane"
              # COUNT ONLY THE LANE'S OWN RETIREMENTS, identified by the marker it writes.
              # Two false positives were caught by running this query live before shipping:
              #   * `--state closed` INCLUDES MERGED, so a HEALTHY lane that merged two
              #     flushes in 2h looked like two retirements and the guard would have
              #     refused to retire a genuinely-stuck blocker — reinstating the wedge.
              #   * a HUMAN closing a flush PR by hand (I closed #15319 this afternoon)
              #     also counted, so a manual intervention would silently disable the
              #     automatic one.
              # Matching the lane's own comment marker excludes both: it counts exactly the
              # thing whose repetition means 're-cutting is not working'.
              # `--jq` with an interpolated marker needs escaping through two quoting layers
              # and got it wrong silently: the expression errored, `2>/dev/null` ate it, the
              # result was EMPTY, and `${PRIOR_RETIRED:-0}` turned that into 0 — i.e. the
              # guard would have permitted every retirement and been perfectly vacuous.
              # `jq --arg` passes the marker as data, so there is nothing to escape.
              # READ gh's STATUS, NOT THE PIPELINE'S. This block runs under `set -e` WITHOUT
              # `pipefail`, so `$?` after `gh ... | jq ...` is JQ's status — `gh` could fail
              # outright and the guard would still read success. That is the same defect this
              # repo has been repairing all day, and I wrote it into the repair. So the fetch
              # and the parse are separate statements with separately-checked outcomes.
              #
              # `|| PRIOR_GH_RC=$?` rather than a bare assignment because `set -e` would
              # otherwise abort the whole step on a transient API blip, taking down a flush
              # that had nothing wrong with it.
              PRIOR_GH_RC=0
              PRIOR_JSON=$(gh pr list --repo "$GITHUB_REPOSITORY" --state closed --limit 10 \
                --head "$SNAPSHOT_REF" --base main --json number,closedAt,mergedAt,comments) || PRIOR_GH_RC=$?
              if [ "$PRIOR_GH_RC" -ne 0 ] || [ -z "$PRIOR_JSON" ]; then
                echo "::error title=Heartbeat retire-guard could not read history::$AGENT: the prior-retirement query failed (rc=$PRIOR_GH_RC). REFUSING to retire PR #$OPEN_FLUSH_PR — a guard that cannot read its own history must not authorise the action it guards."
                PRIOR_RETIRED=1
              else
                PRIOR_RETIRED=$(printf '%s' "$PRIOR_JSON" | jq --arg m "$RETIRE_MARKER" '[.[] | select(.mergedAt == null) | select((now - (.closedAt|fromdateiso8601)) < 7200) | select([.comments[]?.body] | join(" ") | contains($m))] | length') || PRIOR_RETIRED=""
                if [ -z "$PRIOR_RETIRED" ]; then
                  echo "::error title=Heartbeat retire-guard could not parse history::$AGENT: the prior-retirement filter produced no value. REFUSING to retire PR #$OPEN_FLUSH_PR."
                  PRIOR_RETIRED=1
                fi
              fi
              if [ "${PRIOR_RETIRED:-0}" -ge 1 ]; then
                echo "::error title=Heartbeat lane wedged — retire did not help::$AGENT: PR #$OPEN_FLUSH_PR is DIRTY and a previous flush PR on $SNAPSHOT_REF was already closed within the last 2h. Re-cutting is NOT resolving this, so the lane is NOT retiring it again — that would churn silently instead of failing visibly. Needs a look. No events are lost; heartbeat/$AGENT holds them and the flush is idempotent (G-Set union)."
              else
                echo "::warning title=Heartbeat flush blocker retired::$AGENT: PR #$OPEN_FLUSH_PR is CONFLICTED (DIRTY) and can never merge; closing it so the lane can re-cut ONCE. If the re-cut is DIRTY too, the next tick escalates instead of retrying. No events are lost — heartbeat/$AGENT still carries them."
                gh pr close "$OPEN_FLUSH_PR" --repo "$GITHUB_REPOSITORY" \
                  --comment "$RETIRE_MARKER: mergeStateStatus was DIRTY, so this snapshot could never merge. The lane (heartbeat/$AGENT) still holds every unflushed event and the flush is idempotent, so nothing is lost by re-cutting. If the re-cut comes back DIRTY as well, the lane will STOP retiring and escalate rather than loop." >/dev/null 2>&1 || true
                OPEN_FLUSH_PR=""
              fi
            fi
          fi

          if [ -n "$OPEN_FLUSH_PR" ]; then
            echo "::notice title=Heartbeat flush backpressured::$AGENT: PR #$OPEN_FLUSH_PR is still testing $SNAPSHOT_REF; leaving the head alone. The lane keeps accumulating and the next flush carries this tick too."
            echo "[flush] $AGENT: backpressured behind PR #$OPEN_FLUSH_PR — nothing lost"
            # A blocker that is not DIRTY is presumed to still be making progress, which is
            # true for a PR under test and false for one whose checks have settled red. Age is
            # the discriminator available here without re-deciding the merge: past the
            # threshold, say so at warning level so a wedged lane is visible in the run summary
            # rather than reported only as a routine notice nobody reads.
            BLOCKER_AGE_MIN=$(( ( $(date -u +%s) - $(date -u -d "$(gh pr view "$OPEN_FLUSH_PR" \
              --repo "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt 2>/dev/null)" +%s 2>/dev/null || date -u +%s) ) / 60 ))
            if [ "$BLOCKER_AGE_MIN" -ge 90 ]; then
              echo "::warning title=Heartbeat lane wedged::$AGENT: PR #$OPEN_FLUSH_PR has blocked this lane for ${BLOCKER_AGE_MIN}m in state $BLOCKER_STATE. It is not DIRTY, so the lane will not retire it automatically — its checks need a look. Events are accumulating on heartbeat/$AGENT and are not lost."
            fi
            # Declare the no-op to the steps that follow. Backpressure is a HEALTHY outcome
            # — the lane keeps the delta and the next flush carries it — but this branch
            # returns before `merge-heartbeats-to-main.ts` runs, so `pr_number` is never
            # written. Without this line the arming step's `steps.flush.outputs.skip` reads
            # as empty, its `!= 'true'` guard passes, and it hard-fails on a blank PR number
            # with "snapshot produced no PR number". That names the FLUSH step, so a healthy
            # backpressured tick reports as a broken flush. Measured before the fix: 12
            # consecutive runs, `failure` for every lane holding work and `skipped` for every
            # lane without — the arming step had never once concluded `success`, and three
            # separate agents read the red as an auto-merge token-scope fault. The auto-merge
            # call was never reached on any of those runs.
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXISTING_SHA=$(git ls-remote --heads origin "refs/heads/$SNAPSHOT_REF" | awk '{print $1}')
          if [ "$EXISTING_SHA" = "$SOURCE_SHA" ]; then
            echo "[flush] $AGENT: $SNAPSHOT_REF already at $SOURCE_SHA"
          elif [ -z "$EXISTING_SHA" ]; then
            git push origin "$SOURCE_SHA:refs/heads/$SNAPSHOT_REF"
          else
            # No PR is open on it (checked above), so the previous flush is terminal and its
            # payload is either on main or still carried by the lane. `--force-with-lease`
            # against the sha we just observed, so a flush racing us loses instead of being
            # silently overwritten.
            git push --force-with-lease="refs/heads/$SNAPSHOT_REF:$EXISTING_SHA" \
              origin "$SOURCE_SHA:refs/heads/$SNAPSHOT_REF"
          fi
          CONFIRMED_SHA=$(git ls-remote --heads origin "refs/heads/$SNAPSHOT_REF" | awk '{print $1}')
          if [ "$CONFIRMED_SHA" != "$SOURCE_SHA" ]; then
            echo "::error title=Heartbeat snapshot verification failed::$SNAPSHOT_REF resolved to $CONFIRMED_SHA, expected $SOURCE_SHA"
            exit 1
          fi

          # PRE-MERGE `main` SO GITHUB IS NEVER ASKED TO APPLY A MERGE DRIVER.
          #
          # GitHub does NOT apply `.gitattributes` merge drivers when it creates a PR's
          # merge commit. Several files this lane touches carry `merge=union` precisely
          # because both `main` and the lane APPEND to them — `data/ci-runs.jsonl`,
          # `db/mutation-findings/*.jsonl`, `docs/github/prs/manifest.jsonl`,
          # `data/rs-blocks.jsonl`. Locally `git` unions them and merges clean; on
          # GitHub the same pair is a conflict.
          #
          # So whether a flush lands has been down to timing: if `main` happens not to
          # have touched a co-modified append since the lane branched, it merges; if it
          # has, the PR is born CONFLICTING and the lane wedges. Measured 2026-08-25:
          # soraya's #15361 merged while alexa's #15366 — same files, twenty minutes
          # apart — reported `mergeable: CONFLICTING`, and `gh pr merge` answered "the
          # merge commit cannot be cleanly created" while `git merge-tree` on the exact
          # same base and head returned rc=0 with zero conflicts.
          #
          # `.gitattributes` records this being rediscovered at least SEVEN times, each
          # entry added after a lane wedged (see its comments dated 2026-08-17 and
          # 2026-08-22). Adding another union line after the next wedge treats the
          # symptom; the driver was never the missing part. The missing part is that
          # the merge has to happen HERE, where the driver is honoured.
          #
          # After this, GitHub only ever fast-forwards, and the squash-merge onto `main`
          # is a single commit exactly as `required_linear_history` demands.
          #
          # The immutable park above is untouched: `$SOURCE_SHA` was already pushed and
          # VERIFIED before this runs, so the "no events lost" guarantee does not depend
          # on the merge succeeding.
          #
          # ─────────────────────────────────────────────────────────────────────────────
          # IT MUST MERGE ONTO THE LANE. IT USED TO MERGE ONTO `main`, AND THAT KILLED THE
          # WHOLE FLUSH PATH FOR SIXTEEN HOURS WHILE EVERY LANE REPORTED GREEN.
          #
          # The four lines that used to sit here were:
          #     git fetch origin main --quiet
          #     git merge --no-edit origin/main || PREMERGE_RC=$?
          #     MERGED_SHA=$(git rev-parse HEAD)
          #     git push --force-with-lease=... origin "HEAD:refs/heads/$SNAPSHOT_REF"
          # This job checks out `main` (`ref: main`, above) and never leaves it, so that
          # merge fast-forwarded main onto main and the push wrote **main itself** over
          # `$SNAPSHOT_REF`, deleting the parked lane payload from the ref that the PR is
          # cut from. `merge-heartbeats-to-main.ts` then compared main to a copy of main,
          # answered rc=4 "already contains", and the rc=4 branch below — written for a
          # genuine no-op — exited 0. The step CREATED the condition that made its own
          # success branch true, which is the vacuity class exactly.
          #
          # Measured on the live lanes 2026-08-26 before this fix:
          #   - `heartbeat/soraya-flush` and `heartbeat/alexa-flush` both pointed at
          #     precisely `origin/main`;
          #   - run 32942319401 logged "4 heartbeat commits to flush", then
          #     "+ e0daddeaf...dc15f463d (forced update)", where dc15f463d is an ordinary
          #     SINGLE-PARENT main commit — a real pre-merge cannot produce a commit that
          #     does not have the lane as a parent;
          #   - `[heartbeat-batch-merge]` last landed 2026-08-25T16:08:11Z, four minutes
          #     before #15372 shipped the block above. Nothing has landed since.
          # The stale `docs/github/prs/manifest.jsonl` that was repaired by hand twice
          # (#15471, #15511) is one visible symptom of this; the lost telemetry is the rest.
          #
          # The logic is now `premerge-flush-ref.ts` so it can be run against a scratch git
          # repo from a working tree checked out on `main` — the condition this job supplies
          # — and asserted to still contain the lane. It refuses to push its own result;
          # it only computes the commit and verifies containment of BOTH the lane tip and
          # the base. `premerge-flush-ref.test.ts` carries the falsifier, including the old
          # behaviour reproduced as an explicit control.
          # ─────────────────────────────────────────────────────────────────────────────
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          set +e
          bun src/Core.TypeScript/agent-heartbeats/premerge-flush-ref.ts \
            --lane-sha "$SOURCE_SHA" --base main >/tmp/premerge.log 2>&1
          PREMERGE_RC=$?
          set -e
          sed 's/^/[flush] premerge: /' /tmp/premerge.log | head -20 || true
          if [ "$PREMERGE_RC" -eq 3 ]; then
            echo "::warning title=Heartbeat pre-merge hit a REAL conflict::$AGENT: merging origin/main into the lane failed even with this repo's merge drivers applied, so this is a genuine content conflict rather than the GitHub driver gap. Leaving the snapshot at the parked SHA and letting the PR report it. No events lost."
          elif [ "$PREMERGE_RC" -ne 0 ]; then
            # NOT a warning, and that is the change. The old block treated every non-zero as
            # "conflict, carry on", so a pre-merge that produced the WRONG COMMIT was
            # indistinguishable from one that produced none. The tool now separates the two:
            # 3 is a content conflict (above, still non-fatal); anything else means it could
            # not verify that the result carries the lane, and a flush that cannot prove it
            # is carrying the payload must not proceed to open a PR claiming it does.
            echo "::error title=Heartbeat pre-merge refused::$AGENT: premerge-flush-ref.ts exited $PREMERGE_RC. NO EVENTS LOST — $LANE_SHA is parked on $SNAPSHOT_REF and the lane keeps accumulating. See the log above."
            exit 1
          else
            MERGED_SHA=$(sed -n 's/^merged-sha=//p' /tmp/premerge.log | tail -1)
            if [ -z "$MERGED_SHA" ]; then
              echo "::error title=Heartbeat pre-merge produced no SHA::$AGENT: premerge-flush-ref.ts exited 0 without printing merged-sha=. Refusing to guess."
              exit 1
            fi
            if [ "$MERGED_SHA" != "$SOURCE_SHA" ]; then
              git push --force-with-lease="refs/heads/$SNAPSHOT_REF:$SOURCE_SHA" \
                origin "$MERGED_SHA:refs/heads/$SNAPSHOT_REF"
              echo "[flush] $AGENT: pre-merged origin/main into $SNAPSHOT_REF ($SOURCE_SHA -> $MERGED_SHA); GitHub now only fast-forwards."
              # THE SNAPSHOT REF IS NOW THE MERGED COMMIT, SO THAT IS THE SOURCE.
              #
              # `merge-heartbeats-to-main.ts` is handed `--source-sha "$SOURCE_SHA"` below and
              # refuses when the ref does not point at it — "snapshot ref collision". The
              # pre-merge moves the ref, so leaving SOURCE_SHA at the pre-merge value makes
              # the verification fail BY CONSTRUCTION, and only on the ticks where the
              # pre-merge actually did something.
              #
              # CORRECTING THE RECORD THAT USED TO BE HERE: this note read "alexa failed
              # rc=3 at 16:23 while soraya passed, because soraya's lane already contained
              # main and its pre-merge was a no-op." The second clause was never true. The
              # merge ran on `main`, not on the lane, so it could not be a no-op for that
              # reason — soraya "passed" because the ref had been overwritten with `main`
              # and the tool then agreed main contained it. A reason nobody can check is
              # how the wrong thing gets carried forward, and this one was carried forward
              # into a diagnosis of a lane that had already stopped landing.
              #
              # Safe to reassign here: the immutable park is upstream of this point —
              # $SOURCE_SHA was pushed AND verified against the ref before the merge ran — so
              # the "no events lost" guarantee does not depend on this variable afterwards.
              SOURCE_SHA="$MERGED_SHA"
            else
              echo "[flush] $AGENT: $SNAPSHOT_REF already contains origin/main; no pre-merge needed."
            fi
          fi

          # SQUASH, NOT MERGE — main forbids merge commits.
          #
          # `main` carries ruleset "Branch Safety" (id 16189060, ACTIVE) targeting ~DEFAULT_BRANCH
          # with `required_linear_history`. A `--no-ff` merge commit is rejected outright:
          #     ! [remote rejected] HEAD -> main (push declined due to repository rule violations)
          #
          # #9890 shipped the merge form and would have failed on its very first run. It passed
          # review because it was verified in a scratch repo that HAD NO RULESETS — an environment
          # that differed from production in the one way that decided the outcome. Recording that
          # here so the next person tests the rule, not just the logic.
          #
          # NOTE: classic branch protection is EMPTY on this repo (required_status_checks: false,
          # required_pull_request_reviews: false, restrictions: false). Rulesets are a SEPARATE
          # mechanism and do not appear in that API. Check both:
          #     gh api repos/<owner>/<repo>/rules/branches/main
          #
          # Squashing loses nothing here: the payload is append-only ZetaId event files (G-Set),
          # so the per-tick commit boundaries carry no information the events themselves do not.
          # One linear commit per flush satisfies the rule and reads better in `git log`.
          #
          # SOVEREIGN MODE RETIRED FOR THIS STEP, 2026-08-13 — not by preference, by rule.
          #
          # The direct-push flush below this comment used to be the whole story. It cannot work
          # any more: ruleset "CI Gate" (16134995) now makes `gate (required)` a required status
          # check on ~DEFAULT_BRANCH with `bypass_actors: []`, and a required check is evaluated
          # at PUSH time against the pushed tip. A commit that has never been through a check run
          # is refused before any check could start:
          #     remote: - Required status check "gate (required)" is expected.
          # No retry loop can fix that — it is not a race, it is the rule. Dropping `[skip ci]`
          # does not help either: the check is MISSING, not failing.
          #
          # So the flush goes back through a PR — the same `merge-heartbeats-to-main.ts` that
          # was written for exactly this and then abandoned. Read the sovereign-mode note above
          # for why it was abandoned: `gh pr create` failed with "GitHub Actions is not permitted
          # to create or approve pull requests". THAT REASON STILL HOLDS for the Actions identity
          # (`can_approve_pull_request_reviews: false` at both repo and org, verified 2026-08-13),
          # so the call is authenticated with a fine-grained PAT instead — the restriction is on
          # the identity, not the operation. Same ladder pr-archive-on-merge.yml already uses.
          #
          # The PR is the transport for a checked merge. The tick can now carry generated events,
          # archives, repairs, and source changes, so it keeps the batch marker but does not claim
          # a telemetry-only review exemption. Auto-merge remains gated by the required checks.
          #
          # The events are never at risk: this workflow snapshots the exact mutable branch SHA
          # onto an immutable `heartbeat/<agent>-flush-<sha>` ref, and the PR tool verifies that
          # ref before opening the PR. A later tick may reset and advance `heartbeat/$AGENT`, but
          # it cannot move the checked PR head. A rerun at the same SHA reuses the same snapshot;
          # a new SHA gets a new snapshot. Re-flushing an already-landed event set is a no-op.
          # `set +e` around the call is load-bearing: the default step shell is
          # `bash -eo pipefail`, so without it a non-zero exit aborts the step before $?
          # can be read — and rc=4 ("already on main") would be reported as a failure.
          set +e
          bun src/Core.TypeScript/agent-heartbeats/merge-heartbeats-to-main.ts \
            --repo "$GITHUB_REPOSITORY" \
            --head "heartbeat/$AGENT" \
            --source-sha "$SOURCE_SHA" \
            --base main
          RC=$?
          set -e

          # 4 = "main already contains this branch" — an ordinary no-op, not a failure.
          #
          # AND THIS IS THE ONE PLACE A DEAD LANE CAN HIDE, SO IT IS CHECKED RATHER THAN
          # BELIEVED. rc=4 is a claim about a REF; the thing that matters is whether the
          # PAYLOAD landed. When the pre-merge defect above overwrote $SNAPSHOT_REF with
          # `main`, rc=4 became true on every tick — truthfully, about a ref that no longer
          # carried anything — and this branch reported a green no-op for sixteen hours
          # while three lanes accumulated unlanded work. Nothing else in the pipeline could
          # have noticed: the step exits 0, the job is green, the arming step is skipped,
          # and `pr-manifest-integrity.yml` sees only the downstream staleness three hours
          # later without being able to say why.
          #
          # So the no-op must AGREE WITH THE LANE. $LANE_SHA is the immutable tip this tick
          # parked, captured before the pre-merge could move $SOURCE_SHA. If `main` really
          # contains it, the no-op is honest and nothing is outstanding. If it does not,
          # the flush is reporting success over unlanded work, and that is the failure this
          # whole step exists to make impossible.
          #
          # It cannot pass vacuously and it cannot false-positive on a racing tick: the
          # lane advancing after $LANE_SHA was taken does not affect the question, because
          # the question is about $LANE_SHA and not about the lane's current tip.
          if [ "$RC" -eq 4 ]; then
            git fetch origin main --quiet
            if ! git merge-base --is-ancestor "$LANE_SHA" origin/main; then
              echo "::error title=Heartbeat flush claimed a no-op over unlanded work::$AGENT: merge-heartbeats-to-main.ts reported main already contains $SNAPSHOT_REF, but main does NOT contain the lane tip this tick parked ($LANE_SHA). The snapshot ref is not carrying the payload — the usual cause is something overwriting $SNAPSHOT_REF with main. NO EVENTS LOST: heartbeat/$AGENT still holds them and the flush is idempotent."
              exit 1
            fi
            echo "[flush] $AGENT: already on main — nothing to land (no-op)"
            # Same declaration the backpressure branch makes, and for the same reason: this
            # path returns before any PR exists, so the arming step must not run. Found by
            # `audit-workflow-step-output-has-writer.ts`, not by hand — the backpressure fix
            # alone left this second success-without-write path live, and it would have kept
            # producing the identical misleading red on every "already on main" tick.
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RC" -ne 0 ]; then
            echo "[flush] $AGENT: could not open/arm the flush PR (rc=$RC)."
            echo "[flush] NO EVENTS LOST — the workflow parks the exact source SHA on an"
            echo "[flush] immutable heartbeat snapshot before opening its PR. The flush is idempotent:"
            echo "[flush] re-merging an already-landed event set is a no-op (G-Set union)."
            exit 1
          fi

          # RETIRE WHAT THIS FLUSH REPLACED. Reached only on rc=0 — i.e. only once
          # the replacement PR is open. The tool re-checks that itself and retires
          # nothing if the keeper is absent from the open set, so a half-failed
          # flush cannot strand a predecessor behind a closed PR.
          #
          # Without this the open set grew monotonically: on 2026-08-17 eight
          # heartbeat PRs were open at once, three for the same lane, the oldest
          # hours stale. That is not cosmetic — an abandoned flush PR whose gate
          # never starts fails `required-check-started`, which took THIS VERY JOB
          # red every ~25 minutes until the stale PR was closed by hand (#11369,
          # #11426).
          #
          # Non-fatal by construction: this tick's telemetry is already safely on
          # an open PR by the time we get here, so failing the flush over
          # unfinished HOUSEKEEPING would trade a real success for a cosmetic
          # failure.
          set +e
          bun src/Core.TypeScript/agent-heartbeats/retire-superseded-flush-prs.ts \
            --agent "$AGENT" \
            --keep-sha "$SOURCE_SHA"
          RETIRE_RC=$?
          set -e
          if [ "$RETIRE_RC" -ne 0 ]; then
            echo "::warning title=Superseded flush PRs not retired::$AGENT: retire step exited $RETIRE_RC. The flush itself SUCCEEDED; stale flush PRs may accumulate until the next tick."
          fi

      # THE GATE DISPATCH BELT THAT USED TO SIT HERE WAS REMOVED 2026-08-16, AND THE
      # REASON IS NOT "IT IS REDUNDANT". IT WAS INERT. Measured, not inferred.
      #
      # (The literal invocation is spelled out nowhere in this file on purpose: the
      # unit test pins its ABSENCE by string search, so writing it even inside a
      # comment would defeat the pin.)
      #
      # The dispatch belt was added when a `pull_request` gate run on a heartbeat
      # lane was created and immediately parked (`completed`/`action_required`)
      # because the pushing actor was `github-actions[bot]`. #10986 fixed that at
      # the root by putting a PAT on the checkout whose credential performs the
      # push, and the `pull_request` run has executed normally since the 17:49Z
      # cutover — zero `action_required` on alexa/otto/soraya after 18:00Z, all
      # runs triggered by the PAT actor.
      #
      # What the measurement then showed is stronger than redundancy. A
      # `workflow_dispatch` gate run's checks DO NOT ENTER THE FLUSH PR'S
      # statusCheckRollup, so they can never satisfy the `gate (required)`
      # required status check. Both halves observed on the same commit:
      #   PR #11165, head 3da9b0f3 — dispatch check-suite 86701078150 carried
      #     `gate (required) completed/success`, and the PR's rollup carried nine
      #     contexts, none of them gate. `required-check-started.ts` agreed:
      #     "gate (required) never started on heartbeat PR(s): #11165 ...".
      #   PR #11166 / #11167 — merged, and the `gate (required)` in the rollup
      #     came from the `pull_request` run, never from the dispatch run beside it.
      # So the dispatch was paying for a full matrix that no merge could ever read.
      #
      # It was also the MORE expensive of the two: `matrix-setup` gives
      # `workflow_dispatch` the full OS set (5 build legs, Windows + macOS) and
      # gives `pull_request` the pre-merge set (3 legs). Cadence measured over 13
      # consecutive cycles: exactly 3 dispatch gate runs every 15 minutes, without
      # exception — 288/day of full-matrix work with no consumer.
      #
      # AND THE FALSIFIER IS ALREADY IN PRODUCTION, one step below: "Fail if a
      # heartbeat PR is old and gate never started" exits 1 when a heartbeat PR
      # older than one tick has no `gate (required)` in its rollup. If removing
      # this belt is wrong, that step says so on the next tick rather than a lane
      # merging unchecked. That is why the belt could be removed rather than
      # merely suspected.
      #
      # Reasoning inherited from #10986, which declined to ADD this belt to the
      # lanes it treated: two independent gate-starting mechanisms make the result
      # unattributable. That argument applies here in reverse — one mechanism, and
      # it is the one whose checks the merge actually reads.
      #
      # DO NOT re-add a dispatch here to "make sure gate runs". If a flush PR has
      # no gate run, the cause is upstream of this step: every flush PR observed
      # without a `pull_request` gate run was `mergeStateStatus: DIRTY` (a
      # conflicting PR has no computable merge ref), and a dispatch does not fix a
      # conflict — it only hides the conflict behind a green check nobody reads.
      - name: Arm heartbeat PR auto-merge
        if: steps.check.outputs.skip != 'true' && steps.flush.outputs.skip != 'true'
        env:
          AGENT: ${{ matrix.agent }}
          PR: ${{ steps.flush.outputs.pr_number }}
          # SIBLING OF THE MERGE-DUTY STEP, AND THE SAME DEFECT. The comment here
          # used to read "the scoped PAT intentionally cannot perform
          # enablePullRequestAutoMerge", which is a true MEASUREMENT dressed up as
          # a DESIGN INTENT. Nobody chose it: the PAT is refused the mutation
          # because it was never granted the scope, and writing that down as
          # deliberate is how a credential gap became invisible.
          #
          # It matters here for the same reason it matters there: a heartbeat
          # flush PR armed by GITHUB_TOKEN merges as `github-actions[bot]`, the
          # `pull_request: closed` event is suppressed, and pr-archive-on-merge.yml
          # never runs on it. Every telemetry-lane PR the society opens has been
          # landing outside the archive for that reason.
          #
          # Same repair as the merge-duty step: prefer the PAT, degrade ONCE on a
          # refusal with the missing scope named, never stall the flush over a
          # credential.
          #
          # ROLE: PR-CREATE — ZETA_PR_ARCHIVE_TOKEN, per the role table in
          # docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md.
          # The `||` chain that stood here named three secrets in one variable, so "which
          # authority is this step running under" had no answer visible anywhere in the log.
          # FALLBACK_GH_TOKEN stays, because the degradation below is DELIBERATE, EXPLICIT
          # and LOGGED — that is the distinction being drawn, not a ban on ever degrading.
          GH_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$PR" ]; then
            echo "::error title=Heartbeat flush PR missing::$AGENT snapshot produced no PR number"
            exit 1
          fi
          # `set +e`: the default shell is `bash -e` (no `shell:` is declared in
          # this workflow), and `OUT=$(cmd)` is NOT errexit-exempt the way the
          # bare `gh pr merge` this replaced was. Without it the step dies on the
          # PAT refusal before the fallback can run. The explicit `exit "$ARM_RC"`
          # below restores the original fail-closed behaviour.
          # Absence named explicitly, for the same reason as the merge-duty step: the `||`
          # chain used to fold "secret unset" onto GITHUB_TOKEN inside the `env:` expression,
          # where no log line could ever mention it. The degradation itself is deliberate and
          # kept — an unarmed flush PR is a queue delay, not lost telemetry.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=Heartbeat arming has no PR-CREATE credential::$AGENT: ZETA_PR_ARCHIVE_TOKEN is absent, so PR #$PR is armed by GITHUB_TOKEN and its merge raises no events: no 'gate' push run on the merged commit (so no post-merge verdict) and no pr-archive-on-merge.yml run. FIX: set repository secret ZETA_PR_ARCHIVE_TOKEN on Lucent-Financial-Group/Zeta to a fine-grained PAT with 'Pull requests: read and write'."
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
          fi
          set +e
          ARM_OUT=$(gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch 2>&1)
          ARM_RC=$?
          if [ "$ARM_RC" -ne 0 ] && [ "$GH_TOKEN" != "$FALLBACK_GH_TOKEN" ] \
             && printf '%s' "$ARM_OUT" | grep -q "not accessible by personal access token"; then
            echo "::warning title=Heartbeat arming PAT lacks enablePullRequestAutoMerge::$AGENT: ZETA_PR_ARCHIVE_TOKEN (the PR-create role credential) was refused the GraphQL mutation, so this PR is armed by GITHUB_TOKEN and its merge raises no events: no 'gate' push run on the merged commit (so no post-merge verdict, the largest measured verdict-loss class on main) and no pr-archive-on-merge.yml run. FIX: grant that fine-grained PAT 'Pull requests: read and write' on Lucent-Financial-Group/Zeta. Different scope from the 'Contents: read and write' denial tracked by 081M05G8D36087G0R0034D3QPA; the blocker itself is tracked by 081M0YWHE7G087G0R001PSGEH5."
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
            ARM_OUT=$(gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch 2>&1)
            ARM_RC=$?
          fi
          set -e
          printf '%s\n' "$ARM_OUT"
          if [ "$ARM_RC" -ne 0 ]; then
            echo "::error title=Heartbeat flush PR could not be armed::$AGENT: PR #$PR"
            exit "$ARM_RC"
          fi
          echo "[flush] $AGENT: armed auto-merge on PR #$PR"

      - name: Fail if a heartbeat PR is old and gate never started
        if: always() && matrix.agent == 'alexa'
        env:
          # ROLE: READ-ONLY — so this step gets the ACTIONS IDENTITY and no PAT at all.
          #
          # This step's whole job is to READ a heartbeat PR's check rollup. It pushes
          # nothing, creates nothing and dispatches nothing, so under least privilege it has
          # no business holding a write-scoped PAT — and holding one is what made it
          # dangerous: a DENIED PAT makes the instrument report on nothing while still going
          # red, which is exactly how a credential fault gets misread as a gate fault. That
          # misreading happened again on 2026-08-25 (three agents, one heartbeat failure,
          # all three blaming auto-merge token scope), which is what prompted this change.
          #
          # FALLBACK_GH_TOKEN IS GONE FROM THIS STEP, deliberately. With GH_TOKEN already the
          # Actions token, a "fall back to the Actions token" branch is a swap of a value for
          # itself: a repair that cannot repair, sitting under a warning that reads as if it
          # could. That is the vacuity class, so the probe below now REPORTS denial instead
          # of pretending to fix it. The rollup tool still distinguishes "unavailable" (rc=2)
          # from "absent"; the probe is what stops a credential answer being read as either.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Authorization answers only — see the flush step for why a bare 404 is not
          # sufficient evidence of denial during a GitHub degradation.
          # PROBE THE SCOPE THE WORK ACTUALLY USES, NOT MERELY "can I see the repo".
          #
          # The first version of this probe called `GET /repos/{owner}/{repo}`, and it was
          # VACUOUS for the fault it guards. Measured on run 32044425464 (16:07Z 2026-08-17),
          # the first heartbeat after that fix landed: the probe PASSED — neither the denial
          # warning nor the inconclusive warning appears anywhere in the log — and the very
          # next call still died on `compare failed: gh: Not Found (HTTP 404)`. A check that
          # cannot fail under the condition it exists to detect is not a check.
          #
          # The reason is a scope boundary. `GET /repos/{owner}/{repo}` is satisfied by
          # Metadata alone, which this fine-grained PAT has. `GET /repos/{...}/compare/...`
          # is a CONTENTS-scope endpoint, which it does not. So the credential can see the
          # repository and cannot read its commits — and GitHub renders that second refusal
          # as 404, not 403.
          #
          # That also sharpens the diagnosis rather than replacing it: the fault is not "the
          # token sees no repository", it is precisely the missing **Contents** permission
          # named in 081M010H4KE.
          #
          # The probe is `commits?per_page=1`: a Contents-scope read, one page, one request.
          # `compare/main...main` was tried first and REJECTED — it 404s even under a fully
          # authorized credential (verified by hand against this repository), so it would
          # have reported denial unconditionally and demoted every lane forever. That is a
          # worse failure than the vacuous probe it replaced: a check that cannot pass is as
          # useless as one that cannot fail, and it does damage on the way. Both directions
          # were therefore checked against a real credential before this shipped.
          probe_api() { { gh api "repos/$GITHUB_REPOSITORY/commits?per_page=1" --jq '.[0].sha' >/dev/null; } 2>&1; }
          if ! OUT=$(probe_api); then
            if printf '%s' "$OUT" | grep -qE 'HTTP (401|403|404)'; then
              echo "::error title=Gate check has no working credential::the Actions token was refused a Contents-scope read of this repository, so the verdict below is about the CREDENTIAL, not about the gate. Do not read it as gate absence."
            else
              echo "$OUT"
              echo "::warning title=Gate-check API probe inconclusive::the probe failed without an authorization answer; leaving the credential alone."
            fi
          fi

          # 081M010H4KE / 081M005FXAB. "All present checks are green" was the
          # lie: gate never started. This exits 1 when a CURRENT-AGENT flush
          # PR older than one tick has no `gate (required)` in its rollup.
          #
          # The previous heartbeat/* scope was over-broad: an unrelated stale
          # archive or peer-lane PR could make this flush red AFTER this lane
          # had safely written its own evidence. That turns another lane's
          # unresolved promotion into erasure of a distinct observation. The
          # agent-specific scope below preserves the gate-absence falsifier for
          # this lane, while the repo-wide drift job still reports stale PRs.
          # Young PRs are ignored — the check may not have been scheduled yet.
          set +e
          bun src/Core.TypeScript/forge-host/github/required-check-started.ts \
            --min-age-min 20 \
            --ref-prefix "heartbeat/${AGENT}-flush"
          RC=$?
          set -e
          if [ "$RC" -eq 2 ]; then
            echo "::warning title=Heartbeat gate state unavailable::GitHub did not answer after bounded retries; gate absence is unmeasured, not disproven"
            exit 0
          fi
          exit "$RC"
