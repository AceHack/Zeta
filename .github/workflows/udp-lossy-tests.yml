name: udp-lossy-tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: this job runs `bun install`, which executes PR-controlled
# lifecycle scripts, so the token it is handed must be read-only. Declared
# rather than inherited -- the repo default is currently `read`, but that is a
# mutable repo setting and an implicit grant is not a guarantee.
# Scorecard TokenPermissionsID alert 671 / CodeQL actions/missing-workflow-permissions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Timeout basis: observed med 0.4m / max 4.1m (n=39).
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Was one file (observe/udp-lossy-loop.test.ts) asserting a transport claim
      # and a participant claim at once. Split so each half sits with its subject;
      # both paths are named here so neither can silently stop running.
      - name: Run UDP Lossy Event Loop Tests
        run: |
          bun test \
            src/Core.TypeScript/model-backend/udp-lossy-persona-interrupt.test.ts \
            src/Core.TypeScript/observe/cloud-persona-participant.test.ts
