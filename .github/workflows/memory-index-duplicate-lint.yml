name: memory-index-duplicate-lint

# Detects duplicate link targets in `memory/MEMORY.md`. An index
# with duplicate entries is a discoverability defect: fresh
# sessions can't tell which entry is authoritative; the
# newest-first ordering invariant breaks when the same file
# appears twice.
#
# Companion to `.github/workflows/memory-index-integrity.yml`
# (the same-commit-pairing check for memory/ changes +
# MEMORY.md updates). That check ensures index edits happen;
# this check ensures those edits don't create duplicates.
#
# Safe-pattern compliance (FACTORY-HYGIENE row #43):
#   - SHA-pinned actions/checkout
#   - Explicit minimum `permissions: contents: read`
#   - No user-authored context referenced
#   - Concurrency group + cancel-in-progress: false
#   - runs-on: ubuntu-24.04 pinned
#
# See:
#   - src/Core.TypeScript/hygiene/audit-memory-index-duplicates.ts (the tool)

on:
  pull_request:
    paths:
      - "memory/MEMORY.md"
      - "src/Core.TypeScript/hygiene/audit-memory-index-duplicates.ts"
      - ".github/workflows/memory-index-duplicate-lint.yml"
  push:
    branches: [main]
    paths:
      - "memory/MEMORY.md"
      - "src/Core.TypeScript/hygiene/audit-memory-index-duplicates.ts"
      - ".github/workflows/memory-index-duplicate-lint.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: memory-index-duplicate-lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: lint memory/MEMORY.md for duplicate link targets
    # Timeout basis: observed med 1.9m / max 3.6m (n=40); uncached install.sh headroom.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        # Provides bun via mise's pin in .mise.toml. Same pattern as
        # gate.yml. shellenv.sh wires BASH_ENV so subsequent run:
        # steps auto-source the managed shellenv with bun on PATH.
        env:
          # TIER DECLARED, not detected (081M0K36K69087G0R003BYSCF8 applied beyond gate.yml).
          # Every payload step in this job is bun/git/gh only -- it touches no agda, ghc,
          # emscripten, llvm, pandoc, r-base, podman, qemu or opam. On a hosted ubuntu runner
          # the undeclared path is not adaptation: 16 GB always detects `full`, i.e. the whole
          # 388-package / 713.0 MiB apt manifest. slim is 149 packages / 139.7 MiB.
          # This is a RELIABILITY fix before it is a cost one: the mirror stalls land on the
          # biggest archives (pandoc 26.9 MB, r-base-core 27.1 MB), so fetch fewer and fewer
          # runs die at exit 124 inside the 420s apt budget.
          ZETA_HOST_TIER: slim
          # mise release-metadata calls authenticate (1000/hr) instead of anonymous (60/hr 403 flake)
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: run duplicate-link lint
        shell: bash
        run: |
          set -euo pipefail
          bun src/Core.TypeScript/hygiene/audit-memory-index-duplicates.ts --enforce
