name: context-cost-trend-cadence

# Daily DORA trend cadence for 081KT7YW00008QG0R002T1XNWT context-window minimization. Runs
# `bun src/Core.TypeScript/observe/context-cost-trend.ts --record`, which appends one row per
# harness (bytes + token estimate) to the append-only trend store
# src/Core.TypeScript/observe/context-cost-trend.jsonl. This turns the trend store from one
# datapoint into a real over-time series so context-cost DRIFT is visible.
#
# HOW IT LANDS ON MAIN. It does not push to main. Ruleset "CI Gate" (16134995) makes
# `gate (required)` a required status check on main with `bypass_actors: []`, and a required
# check is evaluated at PUSH time against the pushed tip — so a commit that has never been
# through a check run is rejected before any check could start. This lane pushed
# `HEAD:main` anyway and had been failing on `GH013: Repository rule violations` on every
# scheduled run since 2026-08-19 (runs 32559948214 and its three predecessors). The ruleset
# is intended and is not to be weakened; the lane is what was out of date. The row is now
# parked on the ungated staging branch `heartbeat/context-cost-trend` and flushed via a PR
# with squash auto-merge armed, exactly as tick-metrics/society/red-state already do.
# See src/Core.TypeScript/forge-host/github/flush-via-staging.ts.
#
# Composes with:
#  - src/Core.TypeScript/observe/context-cost-trend.ts (the --record tool)
#  - src/Core.TypeScript/observe/context-cost.ts + byte-cost meter (the measured signal)
#  - src/Core.TypeScript/forge-host/github/flush-via-staging.ts (how it lands)
#  - 081KT7YW00008QG0R002T1XNWT (context-window minimization; over-time enforcement leg)
#
# Cost note: this is a deterministic bash+bun job (NO model/LLM), so the GitHub
# Actions run is free — exactly the "workflows are free, they just won't gate"
# direction (Aaron 2026-06-04). Append-only/lightlike: never rewrites the past.
#
# Security: consumes only first-party trusted context (secrets.GITHUB_TOKEN,
# github.run_id); no untrusted expression is interpolated into a run block.

on:
  schedule:
    # Daily 07:23 UTC — off-the-hour, clear of razor (09:17), manifesto (06:37),
    # so the fleet's cadence runs don't all land on the same minute.
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write       # push the staging branch
  pull-requests: write  # open/arm the flush PR

concurrency:
  group: context-cost-trend-cadence
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: write

    steps:
      # ABSENCE IS A NAMED REFUSAL, NOT A SUBSTITUTION.
      #
      # The checkout below carries the BRANCH-PUSH role credential, and that role has no
      # substitute. The `|| secrets.GITHUB_TOKEN` rung this step replaces selected on the
      # secret being EMPTY and handed the lane a credential with DIFFERENT authority: the
      # push still succeeded, so the lane looked alive, and the failure surfaced later
      # under an error naming the wrong subject. It also trips GitHub's recursion guard —
      # actions taken with GITHUB_TOKEN do not trigger other workflows — so the degraded
      # lane silently stopped producing the events downstream jobs wait on.
      #
      # COST: one `test -z` on a bare runner, no checkout, no network. It buys one legible
      # line naming the exact secret and the exact scope instead of a downstream misread.
      - name: Assert the branch-push credential is present
        env:
          BRANCH_PUSH_TOKEN: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}
        run: |
          if [ -z "${BRANCH_PUSH_TOKEN:-}" ]; then
            echo "::error title=Missing ZETA_TELEMETRY_FLUSH_TOKEN::This lane holds the BRANCH-PUSH role and its credential is absent. There is no substitute: GITHUB_TOKEN carries different authority and its pushes do not trigger workflows. FIX: set repository secret ZETA_TELEMETRY_FLUSH_TOKEN on Lucent-Financial-Group/Zeta to a fine-grained PAT with Contents: read and write, Pull requests: read and write, Metadata: read. Role table: docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md"
            exit 1
          fi
          echo "branch-push credential present (role=branch-push secret=ZETA_TELEMETRY_FLUSH_TOKEN)"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # THIS CHECKOUT'S CREDENTIAL IS THE ONE THAT PUSHES `heartbeat/context-cost-trend`,
          # and its actor is what decides whether `gate (required)` ever runs on the flush PR.
          # A `pull_request` run whose triggering actor is `github-actions[bot]` is created and
          # then immediately parked (`completed`/`action_required`), so it never contributes a
          # check to the PR's rollup and the PR hangs unmergeable. Same reason as
          # tick-metrics.yml, which documents the measurement behind it.
          #
          # ROLE: BRANCH-PUSH. One role, one secret. docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md
          # assigns ZETA_TELEMETRY_FLUSH_TOKEN this role and only this role; the
          # PR-create role is ZETA_PR_ARCHIVE_TOKEN and the dispatch role is
          # ZETA_SOCIETY_DISPATCH_TOKEN. A `||` chain collapsed all three into one
          # variable, which is why the rung below is gone.
          #
          # WHAT THE REMOVED `|| secrets.GITHUB_TOKEN` RUNG COST. It selected on the
          # secret being EMPTY and silently substituted a credential with DIFFERENT
          # authority, so the lane kept running and failed somewhere downstream under an
          # error naming the wrong subject. Compounding it, GitHub's recursion guard means
          # actions taken with GITHUB_TOKEN do not trigger other workflows — so a degraded
          # lane ALSO stopped producing the events downstream jobs wait on, silently.
          # ABSENCE is now the assert step above: loud, and it names the secret and scope.
          persist-credentials: true
          token: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Configure committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Start from main, then union in anything still parked on the staging branch from a
      # previous run whose flush PR has not landed yet. This runs BEFORE the recorder because
      # `prepare` checks out a fresh branch off origin/main and would discard a row written
      # ahead of it.
      - name: Prepare staging working tree
        run: bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts prepare --lane context-cost-trend

      - name: Record context-cost trend row
        run: |
          set -euo pipefail
          bun src/Core.TypeScript/observe/context-cost-trend.ts --record

      # No `Inspect diff` gate: `flush` stages the paths and returns a clean no-op when
      # nothing changed (idempotency, discipline #6), so the day's second run is green and
      # commits nothing. The old hand-rolled `git status` guard duplicated that check and is
      # one more thing to keep in sync.
      - name: Flush to main via staging branch + PR
        env:
          # ROLE: PR-CREATE. One role, one secret.
          #
          # The enterprise forbids the Actions identity from creating pull requests, so the
          # `gh` calls in this step authenticate as ZETA_PR_ARCHIVE_TOKEN — the credential the
          # role table in
          # docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md
          # assigns to `gh pr create`. The BRANCH PUSH is a different role and is already
          # authenticated by the persisted checkout credential (ZETA_TELEMETRY_FLUSH_TOKEN);
          # the `||` chain that stood here collapsed both roles plus GITHUB_TOKEN into one
          # variable and silently substituted whichever happened to be set.
          #
          # ABSENCE IS A NAMED REFUSAL, NOT A SUBSTITUTION. `openMergePR` refuses an empty
          # GH_TOKEN and names the secret and the exact scope
          # (src/Core.TypeScript/agent-heartbeats/merge-heartbeats-to-main.ts). The payload
          # still parks safely on the staging branch — nothing is lost — and the step goes
          # red rather than landing under the wrong authority.

          # ARM AUTO-MERGE ON THE FLUSH PR. Opt-in flag read by `armingEnabled`
          # (src/Core.TypeScript/agent-heartbeats/merge-heartbeats-to-main.ts). Turned on
          # 2026-08-26 after Aaron rotated ZETA_PR_ARCHIVE_TOKEN at 19:54Z to carry
          # `enablePullRequestAutoMerge`; the docstring there records the decision. Scoped to
          # THIS step so it cannot reach an unrelated one.
          ZETA_FLUSH_ARM_AUTOMERGE: "1"
          GH_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN }}
        run: |
          bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts flush \
            --lane context-cost-trend \
            --paths src/Core.TypeScript/observe/context-cost-trend.jsonl \
            --message "ops(081KT7YW00008QG0R002T1XNWT): daily context-cost trend row"
