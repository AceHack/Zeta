# LD001 self-healer — regenerate bun.lock when package.json has moved without it.
#
# Aaron 2026-08-10: "lets drift detect this on our auto heal cluster too if possible
# one of our low no intelligence auto healers if we can and drift" / "the self heal
# stuff should be running 24 7 with our little free agent society on github actions".
#
# WHY THIS CLASS EARNED A HEALER
# ------------------------------
# It turned main red TWICE on 2026-08-10, in both directions:
#   c101a6ac9  ADDED two dependencies, no lockfile update
#   47095a706  REMOVED one dependency, no lockfile update
# Every consumer runs `bun install --frozen-lockfile`, which fails closed, so the
# build breaks for everyone until a human notices. Both times, a human noticing WAS
# the recovery mechanism. This replaces that with a machine.
#
# WHY IT IS SAFE TO AUTOMATE — the properties that make it "no intelligence"
# -------------------------------------------------------------------------
# The auto-revert healer is deliberately gated because reverting main can erase work
# other lanes built on. This healer has none of that blast radius, and the reasons
# are checkable rather than asserted:
#
#   1. ONE GENERATED FILE. It stages `bun.lock` and nothing else. `package.json` —
#      the human's actual intent — is never touched, and the job FAILS if it moved.
#   2. NO JUDGEMENT. The fix is `bun install`. There is no choice to make, no
#      candidate to select, no diff to interpret.
#   3. IDEMPOTENT. Running it twice is a no-op: the second run finds nothing to
#      commit. Apply-N-times == apply-once (§12).
#   4. SELF-VERIFYING. It re-runs `--frozen-lockfile` AFTER healing and refuses to
#      push unless that passes. It cannot commit a lockfile that does not fix the
#      problem it was summoned for.
#   5. CONVERGENT AND REVERSIBLE. The output is a pure function of package.json at
#      that commit; a wrong result is one `git revert` away and erases no one's work.
#
# It also refuses rather than guesses: a network failure or a missing binary is
# INDETERMINATE, never desync (see audit-lockfile-sync.ts `classify`), so a registry
# blip can never trick it into rewriting a lockfile that was correct.
#
# 24/7 CADENCE
# ------------
# Scheduled every 17 minutes (off-minute, per the thundering-herd convention) so the
# society is always watching, PLUS an immediate trigger on any push to main that
# touches package.json or bun.lock — so the common case heals in one build cycle
# rather than waiting for the next tick.
#
# HOW THE HEAL LANDS (changed 2026-08-18). This lane used to commit "[skip ci]" and
# push straight at main. Ruleset "CI Gate" evaluates `gate (required)` at PUSH time,
# and "[skip ci]" guarantees that check is never scheduled — so the push was rejected
# deterministically, not transiently. The heal therefore could never land, and the
# summary said "**Healed.** ... and pushed" regardless, because it read the DETECTOR's
# exit code and never the push result: an outcome reported without being observed.
# Same defect family as drift-sweep.yml, same remedy — park on
# `heartbeat/lockfile-healer` and flush via a checked PR — and the summary is now
# derived from the flush step's own outcome.

name: lockfile-healer

on:
  schedule:
    - cron: "*/17 * * * *"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/workflows/lockfile-healer.yml"
  workflow_dispatch: {}

permissions:
  contents: write      # push the lane's heartbeat/lockfile-healer staging branch
  pull-requests: write # open + arm the flush PR that lands the heal on main

concurrency:
  group: lockfile-healer
  cancel-in-progress: false # never cancel a heal mid-push

jobs:
  heal:
    name: LD001 — heal bun.lock desync
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # THIS CHECKOUT'S CREDENTIAL IS THE ONE THAT PUSHES `heartbeat/lockfile-healer`.
          # Same leftover PAT ladder as tick-metrics / #13808 cadence lanes: a
          # GITHUB_TOKEN-actored synchronize parks `gate (required)` and the
          # summary would then print Healed while the write sat unmergeable.
          persist-credentials: true
          token: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Prepare the staging working tree (flush-via-staging lane)
        # Runs BEFORE detect so every later step — detect, heal, the safety
        # refusal, and the verify — operates on exactly the tree that will be
        # flushed. It also fetches `heartbeat/lockfile-healer`, which is what
        # gives the flush's `--force-with-lease` a defined expectation.
        run: bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts prepare --lane lockfile-healer

      - name: Detect (authoritative — the same command every consumer runs)
        id: detect
        run: |
          set +e
          bun src/Core.TypeScript/hygiene/audit-lockfile-sync.ts --human
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "in sync — nothing to heal" ;;
            1) echo "DESYNC detected — healing" ;;
            *) echo "INDETERMINATE — refusing to touch the lockfile" ;;
          esac

      - name: Heal
        if: steps.detect.outputs.code == '1'
        run: bun install

      - name: Refuse if anything but bun.lock moved
        if: steps.detect.outputs.code == '1'
        run: |
          # The healer's entire safety case rests on this. `bun install` should only
          # ever rewrite the lockfile; if it has touched package.json or anything
          # else, the situation is not the one this healer was built for and a human
          # should look.
          # vs HEAD, not the index: `prepare` may have staged an unlanded previous
          # heal, and an index-relative diff would then report "nothing" for a
          # perfectly good lockfile — a false refusal. HEAD-relative sees every
          # modification either way, so the safety property is unchanged.
          changed=$(git diff --name-only HEAD)
          if [ "$changed" != "bun.lock" ]; then
            echo "::error::expected only bun.lock to change, got: ${changed:-<nothing>}"
            exit 1
          fi

      - name: Verify the heal actually heals
        if: steps.detect.outputs.code == '1'
        run: |
          # Self-verification: refuse to push a lockfile that does not resolve the
          # very condition that summoned the healer.
          bun install --frozen-lockfile

      - name: Flush the heal to main via staging branch + PR
        id: flush
        if: steps.detect.outputs.code == '1'
        # No "[skip ci]" in the message: the flush commit is the PR head, and a skip
        # token there would stop `gate` reporting and hang the PR forever.
        # This step fails the job if the heal does not land — the summary below
        # reads THIS step's outcome, so an unlanded heal can never print "Healed".
        env:
          GH_TOKEN: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN || secrets.ZETA_PR_ARCHIVE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts flush \
            --lane lockfile-healer \
            --paths bun.lock \
            --message "fix(deps): regenerate bun.lock (LD001 auto-heal)"

      - name: Summary
        if: always()
        run: |
          {
            echo "## LD001 lockfile healer"
            echo
            case "${{ steps.detect.outputs.code }}" in
              0) echo "In sync — no action." ;;
              1)
                # Derived from the flush's OBSERVED outcome, never from the detector's.
                if [ "${{ steps.flush.outcome }}" = "success" ]; then
                  echo "**Healed.** bun.lock regenerated, verified, and flushed via \`heartbeat/lockfile-healer\` for a checked merge."
                else
                  echo "**Heal did NOT land** (flush outcome: \`${{ steps.flush.outcome }}\`). bun.lock was regenerated and verified, but it is not on main — \`bun install --frozen-lockfile\` is still failing for consumers."
                fi
                ;;
              *) echo "**Indeterminate** — bun could not determine sync state. Refused to act; no lockfile was written." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
