# .github/workflows/seal-emulator-bao.yml
#
# Off-cluster PKCS#11 init against SoftHSM2. The install job proved
# libsofthsm2.so exists; this job proves HSM-enabled bao can run
# `bao operator init` without Shamir unseal keys.
#
# WHAT THIS PROVES: glibc openbao-hsm 2.6.2 + Ubuntu SoftHSM2 +
# pkcs11-tool AES wrap key → recovery keys, zero Shamir unseal
# keys, health 200 with no `bao operator unseal`. PIN is
# BAO_HSM_PIN, never HCL.
#
# WHAT IT DOES NOT PROVE: YubiHSM domains, CardContact,
# this board's PCRs, USB companions, or a seal stanza in the
# OpenBao Application chart. SoftHSM green is not metal green.
# The Alpine musl image is not this job's proof.
#
# SECURITY NOTE: no github.event.* values are interpolated into
# any `run:` block. Workflow permissions are contents:read.
# Actions are SHA-pinned. Init JSON is mode 0600 in RUNNER_TEMP
# and is not printed. Throw-away CI material: ephemeral-vault-init.ts.
# Workitem: 081M1TV43F6087G0R0008QFTKM.

name: seal-emulator-bao

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/seal-emulator-bao.yml"
      - "src/Core.TypeScript/cluster/seal-emulator-bao.ts"
      - "src/Core.TypeScript/cluster/seal-emulator-bao.test.ts"
      - "src/Core.TypeScript/cluster/seal-emulator-install.ts"
      - "src/Core.TypeScript/cluster/seal-emulator-rung.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/seal-emulator-bao.yml"
      - "src/Core.TypeScript/cluster/seal-emulator-bao.ts"
      - "src/Core.TypeScript/cluster/seal-emulator-bao.test.ts"
      - "src/Core.TypeScript/cluster/seal-emulator-install.ts"
      - "src/Core.TypeScript/cluster/seal-emulator-rung.ts"
  schedule:
    # Weekly Sundays 04:41 UTC — apt / release-asset drift.
    # Odd minute, off the install-job cron and heartbeat hours.
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  falsifiers:
    name: seal-emulator-bao falsifiers (bun)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Run the PIN / Shamir / workflow-shape falsifiers
        run: |
          set -euo pipefail
          bun test src/Core.TypeScript/cluster/seal-emulator-bao.test.ts

  off-cluster-init:
    name: Off-cluster bao operator init against SoftHSM PKCS#11
    needs: [falsifiers]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install softhsm2 and opensc (pkcs11-tool)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends softhsm2 opensc

      - name: Download the pinned glibc openbao-hsm tarball
        env:
          OPENBAO_HSM_URL: https://github.com/openbao/openbao/releases/download/v2.6.2/openbao-hsm_2.6.2_linux_amd64.tar.gz
          OPENBAO_HSM_SHA256: 340511b6f87662b80252c202a7c5aa90dbe32341ea741458d49ce6839c2d7721
          OPENBAO_HSM_TAR: ${{ runner.temp }}/openbao-hsm_2.6.2_linux_amd64.tar.gz
          OPENBAO_HSM_DIR: ${{ runner.temp }}/openbao-hsm
        run: |
          set -euo pipefail
          curl -fsSL -o "$OPENBAO_HSM_TAR" "$OPENBAO_HSM_URL"
          printf '%s  %s\n' "$OPENBAO_HSM_SHA256" "$OPENBAO_HSM_TAR" | sha256sum -c
          mkdir -p "$OPENBAO_HSM_DIR"
          tar -xzf "$OPENBAO_HSM_TAR" -C "$OPENBAO_HSM_DIR"
          test -x "$OPENBAO_HSM_DIR/bao"

      - name: Create wrap key and bao operator init (BAO_HSM_PIN, no Shamir)
        env:
          BAO_HSM_PIN: "1234"
          BAO_BIN: ${{ runner.temp }}/openbao-hsm/bao
          WORKDIR: ${{ runner.temp }}/bao-pkcs11
        run: |
          set -euo pipefail
          bun src/Core.TypeScript/cluster/seal-emulator-bao.ts \
            --run \
            --bao-bin="$BAO_BIN" \
            --workdir="$WORKDIR"
