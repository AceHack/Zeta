# Inventory — hardening regression guard (Phase 7 Part 1)
# ---------------------------------------------------------------------------------------
# Keeps the CSP hardening and the shared lib logic from regressing:
#   * inventory/proofs/phase7-csp-proof.ts — asserts the shipped index.html keeps a
#     locked CSP (script/style/connect-src 'self', no 'unsafe-inline', no off-origin
#     host), no inline JS/CSS, and every referenced script/stylesheet on disk.
#   * inventory/proofs/viewer.unit.test.ts — the viewer's pure filter/sort/escape logic.
# Static + offline only (no network, no secrets, no browser). The live in-browser
# CSP-no-violations check is the Part-2 Auditor's job.
name: inventory-hardening-check

on:
  push:
    paths:
      - "inventory/index.html"
      - "inventory/inventory.css"
      - "inventory/lib/**"
      - "inventory/proofs/**"
      - ".github/workflows/inventory-hardening-check.yml"
  pull_request:
    paths:
      - "inventory/index.html"
      - "inventory/inventory.css"
      - "inventory/lib/**"
      - "inventory/proofs/**"
      - ".github/workflows/inventory-hardening-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    # Timeout basis: observed med 0.2m / max 0.3m (n=40).
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: CSP hardening proof (static)
        run: bun inventory/proofs/phase7-csp-proof.ts

      - name: Inventory viewer unit tests
        run: bun test inventory/proofs/viewer.unit.test.ts
