# Inventory — hardening regression guard (Phase 7 Part 1)
# ---------------------------------------------------------------------------------------
# Keeps the CSP hardening and the shared lib logic from regressing:
#   * inventory/proofs/phase7-csp-proof.ts — asserts the shipped index.html keeps a
#     locked CSP (script-src/style-src 'self', no 'unsafe-inline', no off-origin CDN),
#     no inline JS/CSS, and supabase-js vendored same-origin with an SRI matching the
#     file on disk.
#   * inventory/proofs/*.unit.test.ts — the shared custom-field + export/QR logic.
# Static + offline only (no network, no secrets, no browser). The live in-browser
# CSP-no-violations check is the Part-2 Auditor's job.
name: inventory-hardening-check

on:
  push:
    paths:
      - "inventory/index.html"
      - "inventory/inventory.css"
      - "inventory/lib/**"
      - "inventory/proofs/**"
      - ".github/workflows/inventory-hardening-check.yml"
  pull_request:
    paths:
      - "inventory/index.html"
      - "inventory/inventory.css"
      - "inventory/lib/**"
      - "inventory/proofs/**"
      - ".github/workflows/inventory-hardening-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: CSP hardening proof (static)
        run: bun inventory/proofs/phase7-csp-proof.ts

      - name: Inventory lib unit tests
        run: bun test inventory/proofs/custom-fields.unit.test.ts inventory/proofs/inventory-export.unit.test.ts
