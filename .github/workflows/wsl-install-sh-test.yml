# .github/workflows/wsl-install-sh-test.yml
#
# WSL install.sh test (081KSKBP80008QG0R002J03WGA Windows parity — the WSL lane). Runs tools/setup/install.sh inside a
# REAL WSL2 Ubuntu on a Windows host, which the Docker-Linux lane cannot exercise (no WSL kernel,
# no /mnt interop, no systemd-absent quirks). Complements the other three install shields:
#   - docker-ubuntu-install-sh-test   (install.sh on bare Ubuntu 24.04, Docker)
#   - docker-ubuntu-jammy-install-sh-test (install.sh on bare Ubuntu 22.04, Docker)
#   - docker-nixos-install-sh-test    (install.sh on NixOS userspace, Docker)
#   - docker-windows-install-ps1-test (install.ps1 on Windows Server Core, Docker)
#
# Provisioner: Vampire/setup-wsl (the hosted-WSL pattern proven in the SQLSharp repo) on
# runs-on: windows-2025 (WSL needs a Windows host). Distribution Ubuntu-24.04.
#
# Validated locally first (operator "b then a"): a clean-room Ubuntu-24.04 distro ran the FULL
# graph end-to-end on 2026-05-31 — routing -> linux.sh -> apt -> mise + dotnet/python/java/bun/uv
# + node + actionlint/shellcheck/semgrep -> uv tools (ruff) -> elan/Lean -> dotnet-stryker +
# fsharp-analyzers -> TLA+/Alloy jars -> ollama + qwen2.5:0.5b model pull -> "Install complete".
#
# Like docker-ubuntu-install-sh-test this runs the FULL install.sh including the local-LLM primitive
# (ollama 1.2GB + ~398MB model) — the operator's standing position is that the local-LLM step is a
# core primitive worth testing, not skipping. Generous timeout for the cold, uncached run.
#
# Pins (dep-pin-search-first, GitHub API 2026-05-31): Vampire/setup-wsl v7.0.0 is the current latest
# (published 2026-04-11); SHA d1da7f2c… verified against the v7.0.0 release tag + matches the
# SQLSharp pin. actions/checkout v6.0.2.
#
# Security: runner pinned (windows-2025, NOT -latest); third-party actions SHA-pinned with trailing
# # vX.Y.Z; permissions contents: read; concurrency cancel-in-progress for PRs; no github.event.*
# values interpolated into run: lines.

name: wsl-install-sh-test

on:
  # ── THE TIME-DRIVEN ARM (added 2026-08-26). ──────────────────────────────────
  #
  # The triggers below this comment and the one above it catch DIFFERENT FAILURE
  # CLASSES, and that is why both exist. This is DV2.0 change-rate partitioning
  # applied to CI triggers: two causes with different arrival processes get two
  # triggers, not one compromise.
  #
  #   path filter (`pull_request` / `push`)  <-  OUR CHANGES. Event-driven: it
  #     fires the moment someone edits the installer, which is the fastest
  #     possible feedback and is tied directly to the cause.
  #
  #   `schedule:`  <-  UPSTREAM DRIFT. Time-driven, and NOTHING ELSE CAN CATCH
  #     IT. the WSL Ubuntu-24.04 distro image, its apt archive, and the upstream downloads all move with no commit in this repo, so a
  #     path filter never fires: there is nothing to filter on. Before this
  #     block, the only checks that prove the installer works from a bare
  #     machine ran solely when somebody happened to edit the installer.
  #
  # WHY THIS WORKFLOW AND NOT THE OTHERS. The rule applied was: schedule a check
  # iff its outcome can change WITH NO COMMIT -- i.e. it reaches outside the
  # repo. `installer-unit-tests` and `installer-repair-mode-existing-install` are
  # deliberately NOT scheduled: their inputs are all committed, so a cron would
  # re-run the same computation on the same bytes and could only ever report what
  # the last push already reported.
  #
  # WHY DAILY. The drift this catches is a mirror, a channel, or a runner image
  # moving -- a days-scale process, not an hours-scale one. Daily is the coarsest
  # cadence that still surfaces it inside one work-window, which is the stated
  # basis `factory-hygiene-audit-cadence.yml` already uses. (`mirror-to-fork.yml`
  # runs 6-hourly for a different reason -- it bounds staleness of a BACKUP -- so
  # its number is not the one to copy here, only its principle: a periodic
  # artefact, with the cadence chosen from what it is protecting against.)
  #
  # WHY THE MINUTE IS ODD. Off-the-hour and distinct per lane so the fleet's
  # scheduled runs do not pile onto one minute and get dropped together under
  # GitHub scheduler load. Avoids :00/:15/:30/:45 (heartbeat), :07/:37
  # (drift-sweep) and the */6 lanes at :13/:23/:41.
  #
  # THIS IS NON-BLOCKING AND STILL LOUD, and the loudness needs no wiring here.
  # `drift-dashboard-cadence.yml` enumerates every active workflow and derives its
  # expectation from this `on:` block: `expectationFromWorkflow`
  # (src/Core.TypeScript/forge-host/github/workflow-triggers.ts) turns a `cron:`
  # into `{{ kind: "periodic", periodSeconds }}` -- and it treats a workflow that is
  # BOTH scheduled and PR-triggered as `periodic`, "because the clock is the
  # stronger claim". `fold.ts` then reddens on FAILURE, on SILENCE
  # (age > 3x period, fold.ts:335), and on "declared to run every N and has NEVER
  # produced a verdict" (fold.ts:301). So a scheduled shield that quietly stops
  # running goes red -- which is the whole point, since a cron nobody reads is the
  # vacuity class wearing a schedule.
  schedule:
    - cron: "49 4 * * *"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      # Install dispatcher + per-OS scripts + shared library (install.sh -> linux.sh -> common/*)
      - "tools/setup/**"
      # Pinned runtime versions read by mise — the IDENTICAL file Unix uses (symmetric)
      - ".mise.toml"
      # This workflow file itself
      - ".github/workflows/wsl-install-sh-test.yml"
  push:
    branches:
      - main
    paths:
      - "tools/setup/**"
      - ".mise.toml"
      - ".github/workflows/wsl-install-sh-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wsl-install-sh-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wsl-test:
    name: wsl-install-sh-test
    runs-on: windows-2025
    # Cold run: full install.sh inside WSL (apt + mise toolchain + lean + jars) + ollama 1.2GB +
    # ~398MB model pull. Matches docker-ubuntu-install-sh-test's 40-min bound, +5 for WSL setup.
    timeout-minutes: 45

    steps:
      # Zeta has >260-char filenames (dense persona/research naming); a fresh runner's git fails
      # checkout with "Filename too long" without long-path support.
      - name: Enable git long paths (Windows MAX_PATH)
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup WSL (Ubuntu-24.04)
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-shell-command: bash -lc
          # Base deps so the clone step works; install.sh's apt manifest installs the rest.
          additional-packages: git ca-certificates curl

      - name: Run install.sh inside WSL
        shell: wsl-bash {0}
        env:
          # Pass the Windows-host checkout path into WSL, /p = translate to the /mnt form.
          HOST_WORKSPACE: ${{ github.workspace }}
          # mise.sh promotes GITHUB_TOKEN -> MISE_GITHUB_TOKEN (authenticated GitHub API,
          # no 403 rate-limit); ZETA_INSTALL_FULL exercises the one-liner installers.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WSL does not inherit the Windows host env unless listed in WSLENV.
          # Without GITHUB_ACTIONS, common/mise.sh skips install_with_retry and the
          # python minor-alias idempotency guard — a single GitHub 500 on any aqua
          # release (observed: golangci-lint@2.12.2, 2026-06-21) fails the job.
          GITHUB_ACTIONS: "true"
          ZETA_INSTALL_FULL: "1"
          WSLENV: HOST_WORKSPACE/p:GITHUB_TOKEN:ZETA_INSTALL_FULL:GITHUB_ACTIONS
        run: |
          set -euo pipefail
          echo "=== WSL install.sh test ==="
          grep PRETTY_NAME /etc/os-release
          uname -sr
          # Native clone into the WSL filesystem (NOT running from the /mnt mount): git restores the
          # committed +x mode bits so the entrypoint stays executable, and ext4 avoids the 9p perf hit.
          # This was the reliable path in the local clean-room validation.
          rm -rf /root/zeta
          git clone --depth 1 "file://${HOST_WORKSPACE}" /root/zeta
          cd /root/zeta
          echo "HEAD=$(git rev-parse --short HEAD)"
          # Assert the clone preserved +x on the ENTRYPOINT (the whole point of native-clone-not-/mnt),
          # then invoke it DIRECTLY via its shebang — the real user-invocation path, not `bash …` which
          # would mask a lost +x bit. install.sh itself execs "$SETUP_DIR/linux.sh" directly, so
          # linux.sh's +x is validated transitively once install.sh runs it.
          test -x tools/setup/install.sh || { echo "install.sh not executable after clone (+x not preserved)"; exit 1; }
          echo "=== running ./tools/setup/install.sh (direct, via shebang) ==="
          # CI-level retry (same budget as gate.yml): mise's internal 3-attempt HTTP
          # retry can exhaust on a GitHub releases 502/500; outer loop covers outages.
          for attempt in 1 2 3 4 5; do
            if ./tools/setup/install.sh; then
              echo "=== install.sh completed (exit 0) ==="
              exit 0
            fi
            [ "$attempt" = "5" ] && { echo "install.sh failed after 5 attempts"; exit 1; }
            case "$attempt" in
              1) backoff=10 ;;
              2) backoff=30 ;;
              3) backoff=60 ;;
              4) backoff=120 ;;
            esac
            echo "install.sh attempt $attempt failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
          done
