# The drift clock — each run is one TICK of the drift ledger.
#
# Workitem 081KX3KA3EW08QG0R002WFQ6BG (drift-and-heal ADR items 2 + 6 as
# amended 2026-07-09: MTTH is tick-indexed, the phase clock is the official
# drift reference frame).
#
# Post-flip (#9860) the hygiene lints REPORT drift instead of blocking
# merges. This sweep is what keeps that honest: on a cadence it runs the
# non-blocking detectors over main, pipes findings into
# `drift-ledger sweep` (tick = max existing + 1, derived from the ledger
# itself — no ambient clock in the math; the ISO timestamp is metadata
# only), and commits the tick event to docs/drift-events/.
# `drift-ledger report` folds tick-indexed MTTH per drift class.
# Unmeasured drift-tolerance is normalized deviance — this workflow is the
# measurement (#9863 built the fold; this arms it).
#
# Detectors are ADDITIVE: to bring another non-blocking drift class into
# the ledger, append its output to the same findings file before the sweep
# step. v1 pipes markdownlint (the dominant observed drift class; pin
# matches .mise.toml). --tracked (git ls-files) keeps path-shaped tool
# preamble out of the permanent ledger.
#
# Loop safety: the commit-back uses the workflow's GITHUB_TOKEN, whose
# pushes do not trigger workflows, and the message carries [skip ci] —
# belt and suspenders. Cron is off-minute per the thundering-herd
# convention.
#
# Safe-pattern compliance (mirrors tick-metrics.yml): SHA-pinned actions,
# explicit minimal permissions, concurrency without cancel-in-progress,
# only first-party trusted context — no user-authored text referenced.

name: drift-sweep

on:
  # EVENT-DRIVEN TICK (Aaron 2026-08-10, "how do we speed it up"): the tick
  # fires on every real push to main — drift is measured the moment it can
  # exist. Loop-safe by construction: the sweep's own bookkeeping (and the
  # retraction actuator's pushes) use GITHUB_TOKEN, which never triggers
  # workflows; only human/agent-credential landings mint ticks. The cron
  # drops to a twice-hourly HEARTBEAT (catches token-pushed drift + proves
  # liveness). Because every budget and MTTH is denominated in TICKS, not
  # wallclock, the whole organism speeds up proportionally with zero
  # recalibration — the phase-clock design's dividend.
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *" # twice-hourly heartbeat, off-minute
  workflow_dispatch: {}

permissions:
  contents: write # commits the tick event back to docs/drift-events/

concurrency:
  group: drift-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep main into the drift ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # FULL history. The retraction actuator walks `git rev-list greenHead..redHead` over
          # arbitrary commits, and actions/checkout defaults to a depth-1 clone in which those SHAs
          # do not exist — `fatal: Invalid revision range`. The `git fetch origin main` below does
          # NOT deepen a shallow clone, so it cannot rescue this. Six other workflows in this repo
          # already set `fetch-depth: 0` for the same reason; this one was the exception.
          fetch-depth: 0

      - name: Sync to origin tip (event-driven ticks race pushes)
        # The checkout is pinned to the TRIGGERING commit, which can predate
        # the previous sweep's bookkeeping push — reading the ledger from it
        # double-mints tick numbers (first observed: 000070 add/add race,
        # the speedup's own first drift). The tick must be computed from
        # origin's latest ledger.
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Run detectors (findings are data here, not failures)
        run: |
          set +e
          bunx markdownlint-cli2@0.22.1 "**/*.md" > /tmp/findings.txt 2>&1
          echo "markdownlint exit: $? ($(wc -l < /tmp/findings.txt) output line(s))"
          exit 0

      - name: Retraction actuator (sovereign push_retraction edge — 081KZHGP45V)
        # The hands of episode-protocol.ts. Consent: RFC round 2026-08-10
        # (Vera+Riven builder assents; Lior/Soraya conditions in the machine's
        # laws; operator word). ALL decisions are the state machine's — this
        # step gathers facts, steps the machine, executes commands. Runs
        # BEFORE this tick's sweep so openTicks reflects completed ticks.
        # Bot pushes don't trigger workflows: the actuator dispatches gate.yml
        # after pushing; post_push_gate reads check-runs by SHA next tick.
        # Safe-pattern: first-party context via env only.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --deepen=50 origin main
          bun src/Core.TypeScript/hygiene/retraction-actuator.ts

      - name: Detect build drift on main (BD001 — detector half of 081KZHGP45V)
        # Queries the latest COMPLETED gate push-run on main; any failed
        # build-and-test leg becomes a BD001 finding anchored to Zeta.sln
        # (tracked, so it passes the --tracked guard). BD001 carries the
        # tightest SLO budget in registry/drift-slo.yaml: a red main build
        # gets ONE tick of tolerance, then the SLO auto-files a P1 — this is
        # Vera's ratification clause ('true only while main stays green')
        # made mechanically watched. The auto-REVERT actuator (the healer
        # half of 081KZHGP45V) is deliberately not here: reverting main is
        # the most dangerous healer class and lands only through the
        # certification harness with fleet eyes.
        # Safe-pattern: first-party trusted context only, passed via env.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/gate.yml/runs?branch=main&event=push&status=completed&per_page=1" \
            | jq -r '.workflow_runs[0]')
          run_id=$(echo "$run_json" | jq -r '.id // empty')
          run_conclusion=$(echo "$run_json" | jq -r '.conclusion')
          
          if [ -z "$run_id" ]; then
            echo "no completed gate push-run found — no BD001 signal this tick"
          else
            if [ "$run_conclusion" == "success" ]; then
              echo "main build green (gate run $run_id conclusion success, ignoring any non-blocking failures)"
            else
              failed=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
                | jq -r '[.jobs[] | select((.name|startswith("build-and-test")) and .conclusion=="failure") | .name] | join("; ")')
              if [ -n "$failed" ]; then
                echo "Zeta.sln:1 BD001/main-build-red gate run $run_id: $failed" >> /tmp/findings.txt
                echo "BD001: main build drift detected ($failed, run $run_id)"
              else
                echo "main build green (gate run $run_id failed but not in build-and-test)"
              fi
            fi
          fi

      - name: Install dependencies (yaml parser for the SLO registry)
        run: bun install --frozen-lockfile

      - name: Record the tick
        run: |
          git ls-files > /tmp/tracked.txt
          bun src/Core.TypeScript/hygiene/drift-ledger.ts sweep \
            --dir docs/drift-events --tracked /tmp/tracked.txt < /tmp/findings.txt
          bun src/Core.TypeScript/hygiene/drift-ledger.ts report --dir docs/drift-events

      - name: Certified markdown heal (gyroscope — measure, then stabilize)
        # The sweep stops being a stethoscope: after findings are captured
        # (measure-first, so the ledger records the drift), the CERTIFIED
        # markdown fixer heals it in the same tick's push. The entry point
        # re-certifies the healer's three laws on every invocation and exits
        # 2 touching nothing on failure (#10153) — certification IS the
        # write gate. Next tick measures the heal: every markdown class
        # converges at MTTH ~ 1 tick, continuously. Additive pattern: each
        # new certified healer = one more stabilized axis.
        run: |
          # SCOPE FIRST. `git ls-files '*.md'` is every tracked markdown file in the repo, and the
          # healer used to receive it whole — including paths `.markdownlint-cli2.jsonc` explicitly
          # excludes. On 2026-08-13 that rewrote 414 preserved PR-review archives with an MD032 fix,
          # the exact rule the config names as violating their verbatim contract. The ignore list
          # existed and was simply never consulted on the path that could write.
          mapfile -t files < <(git ls-files '*.md' | bun src/Core.TypeScript/hygiene/healers/md-heal-scope.ts)
          if [ "${#files[@]}" -gt 0 ]; then
            bun src/Core.TypeScript/hygiene/healers/md-fixer-certified.ts "${files[@]}"
            git add -u -- '*.md'
          fi

      - name: Certified memory reindex (gyroscope axis 3 — MEMORY.md cannot stale)
        # The second named subject of the healer workitem. Certification is
        # the write gate (gen(gen)==gen staleness detector + independent
        # trailing-space/code-span teeth); refuses to write on failure. The
        # 2026-07-08 closure incident — heals staling this very index — is
        # now impossible by construction: regeneration runs every tick.
        run: |
          bun src/Core.TypeScript/hygiene/healers/memory-reindex-certified.ts
          git add memory/MEMORY.md

      - name: SLO check — auto-file P1 workitems for breaching drift classes
        env:
          ZETA_WORKITEM_ACTOR: drift-sweep
        run: |
          bun src/Core.TypeScript/hygiene/drift-ledger.ts slo \
            --dir docs/drift-events --config registry/drift-slo.yaml --workitems workitems

      - name: Publish per-leg platform drift (the read surface for non-blocking legs)
        # Aaron 2026-08-19: "windows and mac are drift checks ... we don't want to
        # block on them." Non-blocking is only honest if the drift is SEEN, and the
        # two surfaces that existed both stop short: `gate (required)`'s summary is
        # per-run on a push run nobody opens, and BD001 above keys findings to
        # `Zeta.sln` so it cannot say WHICH platform drifted or how often. This fold
        # answers per-leg rate, clean streak, and coverage — the last of which is the
        # one that bites: 265 of the 300 most recent completed gate push runs were
        # `cancelled` before their legs ever ran, so a clean streak counted over
        # pushes rather than over EXECUTIONS is evidence of nothing.
        #
        # Incremental and idempotent: run records are keyed by run id and upserted,
        # so a tick costs one list call plus jobs for runs it has not already seen
        # (usually zero or one). Never fatal — it reports on legs that by decision
        # cannot block, so it must not be able to block either.
        continue-on-error: true
        # Safe-pattern: first-party trusted context via env only, never interpolated
        # into the shell. `GITHUB_*` is reserved by the runner, so the repo slug rides
        # under its own name and is passed as an argument.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          bun src/Core.TypeScript/ci/platform-drift-report.ts \
            --repo "$REPO" --out data/platform-drift.json --pages 1 --max-runs 500

      - name: Publish the MTTH fold for the Pages monitor panel
        run: |
          bun src/Core.TypeScript/hygiene/drift-ledger.ts report \
            --dir docs/drift-events --json > data/drift-mtth.json

      - name: Publish the drift genome fitness (society-evolution's ledger contract)
        # The gyroscope as a citizen of planning/society-evolution.ts:
        # tunables encoded on the society's 7-channel genome, fitness scored
        # from THIS ledger each tick, published for the generational loop to
        # select on. Measurement only — a genome that wants to become config
        # goes through the registry-change discipline.
        run: bun src/Core.TypeScript/hygiene/drift-genome.ts

      - name: Run one generation in shadow (selection over drift genomes)
        # society-evolution's loop, drift edition: current + 16 seeded
        # mutants scored by replaying THIS ledger under candidate budgets
        # (leak vs alarm objective); ranked population published. Seed =
        # latest tick — reproducible exploration each tick. Adoption of a
        # winner remains a registry consent act.
        run: bun src/Core.TypeScript/hygiene/drift-evolution.ts

      - name: Evaluate the proposer (persistent dominance -> consent letter)
        # 081KZSRBBAM: when the current genome has been strictly dominated
        # for K consecutive ticks, an at-most-once letter (keyed by genome
        # hex) lands in docs/letters/ carrying the registry diff + evidence.
        # Evolution proposes; the society disposes — this NEVER edits the
        # registry. Status published to data/drift-proposal.json every tick.
        run: bun src/Core.TypeScript/hygiene/drift-proposer.ts

      - name: Commit and push the tick event (and any SLO filings)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/drift-events docs/letters workitems data/drift-mtth.json data/drift-genome.json data/drift-evolution.json data/drift-proposal.json data/platform-drift.json
          if git diff --cached --quiet; then
            echo "Nothing staged — no tick recorded."
          else
            git commit -m "drift: record sweep tick + certified heals [skip ci]"
            # Bookkeeping races are NON-FATAL by design: findings are
            # recomputed and heals are certified-idempotent, so a lost tick
            # is a skipped heartbeat, not an error — the next tick
            # re-records everything. Red runs here would just be noise.
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "tick bookkeeping lost a push race — next tick re-records (idempotent)"
              exit 0
            fi
            # A PUSH RACE AND A RULE REJECTION ARE NOT THE SAME EVENT, and until
            # 2026-08-23 this line called both of them a race. They differ in the only
            # way that matters: a race is TRANSIENT and the next tick genuinely does
            # re-record it; a ruleset rejection is PERMANENT and the next tick fails the
            # same way forever. Measured — since 2026-08-13 every push here has been
            # rejected with `GH013 ... Required status check "gate (required)" is
            # expected` (telemetry lanes no longer push straight to main), and 1,597
            # `drift-sweep` runs concluded SUCCESS while `docs/drift-events/` stayed
            # frozen at tick 000247 and `data/platform-drift.json` at run 32232815018.
            # The sweep computed the correct fold every few minutes and then threw it
            # away, from behind a green check. That is the exact shape of the defect
            # this whole surface exists to detect, committed in the detector itself.
            #
            # STILL NON-FATAL, deliberately: this is telemetry bookkeeping and a red run
            # here would be noise, per the note above. What changes is that a permanent
            # rejection is now LOUD — an `::error::` annotation on the run page naming
            # the cause and the route — instead of being misfiled as weather.
            if git push 2>/tmp/push-err; then
              echo "tick bookkeeping pushed."
            elif grep -qE 'GH013|repository rule violations|protected branch' /tmp/push-err; then
              cat /tmp/push-err
              echo "::error title=drift ledger is not landing::drift-sweep's push to main was REJECTED BY A REPOSITORY RULE, not lost to a race. This is permanent: every tick will recompute the ledger and discard it until the bookkeeping is routed the way the other telemetry lanes are (park on a \`heartbeat/*\` ref, flush via PR). Until then docs/drift-events/ and data/platform-drift.json are FROZEN and every dashboard reading them is showing stale numbers. This annotation is loud on purpose and blocks nothing."
            else
              cat /tmp/push-err
              echo "::warning title=drift ledger push failed::push race — next tick re-records (idempotent)"
            fi
          fi
