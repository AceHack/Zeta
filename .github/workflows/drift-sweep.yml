# The drift clock — each run is one TICK of the drift ledger.
#
# Workitem 081KX3KA3EW08QG0R002WFQ6BG (drift-and-heal ADR items 2 + 6 as
# amended 2026-07-09: MTTH is tick-indexed, the phase clock is the official
# drift reference frame).
#
# Post-flip (#9860) the hygiene lints REPORT drift instead of blocking
# merges. This sweep is what keeps that honest: on a cadence it runs the
# non-blocking detectors over main, pipes findings into
# `drift-ledger sweep` (tick = max existing + 1, derived from the ledger
# itself — no ambient clock in the math; the ISO timestamp is metadata
# only), and commits the tick event to docs/drift-events/.
# `drift-ledger report` folds tick-indexed MTTH per drift class.
# Unmeasured drift-tolerance is normalized deviance — this workflow is the
# measurement (#9863 built the fold; this arms it).
#
# Detectors are ADDITIVE: to bring another non-blocking drift class into
# the ledger, append its output to the same findings file before the sweep
# step. v1 pipes markdownlint (the dominant observed drift class; pin
# matches .mise.toml). --tracked (git ls-files) keeps path-shaped tool
# preamble out of the permanent ledger.
#
# Loop safety (REWRITTEN 2026-08-23, and the old text is worth keeping visible
# because it was true and stopped being true): it used to read "the commit-back
# uses the workflow's GITHUB_TOKEN, whose pushes do not trigger workflows, and
# the message carries [skip ci] — belt and suspenders." Both belts are gone. The
# bookkeeping no longer pushes at all — it flushes through a PR that SQUASH-MERGES,
# which is a real push by a real actor — and `[skip ci]` is now forbidden in that
# message, because on the PR route it would stop `gate` from ever running and leave
# the PR unmergeable forever. Loop safety is now carried by the `paths-ignore` on
# the push trigger below. Cron is off-minute per the thundering-herd convention.
#
# Safe-pattern compliance (mirrors tick-metrics.yml): SHA-pinned actions,
# explicit minimal permissions, concurrency without cancel-in-progress,
# only first-party trusted context — no user-authored text referenced.

name: drift-sweep

on:
  # EVENT-DRIVEN TICK (Aaron 2026-08-10, "how do we speed it up"): the tick
  # fires on every real push to main — drift is measured the moment it can
  # exist. The cron drops to a twice-hourly HEARTBEAT (catches token-pushed
  # drift + proves liveness). Because every budget and MTTH is denominated in
  # TICKS, not wallclock, the whole organism speeds up proportionally with
  # zero recalibration — the phase-clock design's dividend.
  #
  # This paragraph used to continue "Loop-safe by construction: the sweep's own
  # bookkeeping (and the retraction actuator's pushes) use GITHUB_TOKEN, which
  # never triggers workflows; only human/agent-credential landings mint ticks."
  # That was true and is now FALSE for the bookkeeping half — it lands by
  # squash-merging a PR, which is a real push by a real actor. The sentence is
  # replaced rather than deleted because a stale loop-safety claim reads as a
  # guarantee and carries none. Loop safety now lives in the `paths-ignore`
  # below. (The retraction actuator's own push still uses GITHUB_TOKEN, and that
  # half of the old sentence still holds.)
  push:
    branches: [main]
    # LOOP GUARD, and it is NEW because the flush route made it necessary.
    #
    # The old bookkeeping pushed with GITHUB_TOKEN, whose pushes do not trigger workflows,
    # so the lane could never re-trigger itself. It now lands by SQUASH-MERGING a PR, and
    # that merge is a real push to `main` by a real actor — which this trigger would catch.
    # Since `drift-ledger sweep` mints a tick event on EVERY invocation (tick = max + 1,
    # unconditionally — there is no "nothing happened" early return), each flush would mint
    # the tick that produces the next flush, forever, on a quiet repository.
    #
    # So the lane ignores its own bookkeeping. `paths-ignore` skips a run only when EVERY
    # changed path matches, which is exactly right here: a steady-state flush touches only
    # the tick event and the published folds and is skipped, while a flush that also carried
    # an SLO filing or a certified heal still mints one tick — and that tick's own flush
    # carries bookkeeping alone and terminates. Bounded, not suppressed.
    #
    # This is the same defect `tick-metrics.yml` avoids with a `paths` filter, arriving here
    # for the first time because this lane's pushes had never actually landed before.
    paths-ignore:
      - 'docs/drift-events/**'
      - 'data/platform-drift.json'
      - 'data/drift-mtth.json'
      - 'data/drift-genome.json'
      - 'data/drift-evolution.json'
      - 'data/drift-proposal.json'
  schedule:
    - cron: "7,37 * * * *" # twice-hourly heartbeat, off-minute
  workflow_dispatch: {}

permissions:
  contents: write # commits the tick event back to docs/drift-events/
  actions: read # GET /actions/workflows/gate.yml/runs — the gate-verdict drought step below

concurrency:
  group: drift-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep main into the drift ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # ABSENCE IS A NAMED REFUSAL, NOT A SUBSTITUTION.
      #
      # The checkout below carries the BRANCH-PUSH role credential, and that role has no
      # substitute. The `|| secrets.GITHUB_TOKEN` rung this step replaces selected on the
      # secret being EMPTY and handed the lane a credential with DIFFERENT authority: the
      # push still succeeded, so the lane looked alive, and the failure surfaced later
      # under an error naming the wrong subject. It also trips GitHub's recursion guard —
      # actions taken with GITHUB_TOKEN do not trigger other workflows — so the degraded
      # lane silently stopped producing the events downstream jobs wait on.
      #
      # COST: one `test -z` on a bare runner, no checkout, no network. It buys one legible
      # line naming the exact secret and the exact scope instead of a downstream misread.
      - name: Assert the branch-push credential is present
        env:
          BRANCH_PUSH_TOKEN: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}
        run: |
          if [ -z "${BRANCH_PUSH_TOKEN:-}" ]; then
            echo "::error title=Missing ZETA_TELEMETRY_FLUSH_TOKEN::This lane holds the BRANCH-PUSH role and its credential is absent. There is no substitute: GITHUB_TOKEN carries different authority and its pushes do not trigger workflows. FIX: set repository secret ZETA_TELEMETRY_FLUSH_TOKEN on Lucent-Financial-Group/Zeta to a fine-grained PAT with Contents: read and write, Pull requests: read and write, Metadata: read. Role table: docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md"
            exit 1
          fi
          echo "branch-push credential present (role=branch-push secret=ZETA_TELEMETRY_FLUSH_TOKEN)"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # THIS CHECKOUT'S CREDENTIAL IS THE ONE THAT PUSHES `heartbeat/drift-sweep`, and
          # that push's actor is what decides whether `gate (required)` ever runs on the
          # flush PR — a `pull_request` run whose triggering actor is `github-actions[bot]`
          # is created and then immediately parked (`completed`/`action_required`), so it
          # never contributes a check to the rollup (081M010H4KE). Same two-rung ladder as
          # tick-metrics.yml and agent-heartbeat.yml.
          #
          # ROLE: BRANCH-PUSH. One role, one secret. docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md
          # assigns ZETA_TELEMETRY_FLUSH_TOKEN this role and only this role; the
          # PR-create role is ZETA_PR_ARCHIVE_TOKEN and the dispatch role is
          # ZETA_SOCIETY_DISPATCH_TOKEN. A `||` chain collapsed all three into one
          # variable, which is why the rung below is gone.
          #
          # WHAT THE REMOVED `|| secrets.GITHUB_TOKEN` RUNG COST. It selected on the
          # secret being EMPTY and silently substituted a credential with DIFFERENT
          # authority, so the lane kept running and failed somewhere downstream under an
          # error naming the wrong subject. Compounding it, GitHub's recursion guard means
          # actions taken with GITHUB_TOKEN do not trigger other workflows — so a degraded
          # lane ALSO stopped producing the events downstream jobs wait on, silently.
          # ABSENCE is now the assert step above: loud, and it names the secret and scope.
          # DENIAL remains the preflight's job below. Two distinct conditions, two
          # distinct reports — that separation is the fix.
          persist-credentials: true
          token: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}
          # FULL history. The retraction actuator walks `git rev-list greenHead..redHead` over
          # arbitrary commits, and actions/checkout defaults to a depth-1 clone in which those SHAs
          # do not exist — `fatal: Invalid revision range`. The `git fetch origin main` below does
          # NOT deepen a shallow clone, so it cannot rescue this. Six other workflows in this repo
          # already set `fetch-depth: 0` for the same reason; this one was the exception.
          fetch-depth: 0

      # THE FALSIFIER FOR THE CREDENTIAL, RUN IN PRODUCTION ON EVERY TICK.
      #
      # This lane published nothing for TEN DAYS while reporting success, and the reason
      # nobody caught it on day one is that nothing ever tested whether the push could
      # succeed — only that a token was present. Presence is not capability. So this is not
      # a stub and not a mock: a real `git push` to the real remote over the real network,
      # with `--dry-run` so it updates nothing. GitHub performs repository-write
      # authorization at the `git-receive-pack` advertisement, before any ref is considered,
      # so a dry run gets the true 403/200 answer.
      #
      # It probes a `credprobe/` ref, never `heartbeat/drift-sweep`: HEAD here is main and
      # the lane branch has diverged (the flush squashes), so probing the real lane would be
      # rejected as non-fast-forward and a permission answer would be indistinguishable from
      # an ancestry answer. A ref that does not exist yet has no ancestry question to get
      # wrong. `--dry-run` creates nothing.
      #
      # It runs BEFORE `prepare`, deliberately: there is nothing to lose by answering the
      # credential question before any work is in the tree.
      - name: Preflight the push credential
        env:
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          probe() { git push --dry-run origin "HEAD:refs/heads/credprobe/drift-sweep" 2>&1; }

          if OUT=$(probe); then
            echo "[preflight] drift-sweep: push credential is authorized for this repository."
            exit 0
          fi
          echo "$OUT"

          # Only a CREDENTIAL answer is eligible for the swap. A network blip must NOT
          # silently re-point the credential — that would hide a different failure behind a
          # credential story, which is the same mistake as calling a rule rejection a race.
          if ! printf '%s' "$OUT" | grep -qiE 'denied to|Authentication failed|Invalid username or token|error: 403'; then
            echo "::warning title=drift-sweep preflight inconclusive::the probe failed, but not with a credential answer. Leaving the credential as-is; the real push below will report the true error."
            exit 0
          fi

          echo "::error title=drift-sweep PAT cannot push::ZETA_TELEMETRY_FLUSH_TOKEN was denied by the remote. FIX: grant that fine-grained PAT 'Contents: read and write' on Lucent-Financial-Group/Zeta. Falling back to GITHUB_TOKEN: the ledger still parks on the staging branch, but 'gate (required)' will NOT start on the flush PR (081M010H4KE)."

          # Swap the credential the way actions/checkout itself sets it — one
          # `--replace-all` of the extraheader, which is the key git actually authenticates
          # with. `git -c http.<url>.extraheader=` APPENDS rather than overrides, and
          # re-pointing the remote URL alone did not displace it in production (#10913).
          HDR_B64=$(printf 'x-access-token:%s' "$FALLBACK_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$HDR_B64"
          git config --local --replace-all "http.https://github.com/.extraheader" "AUTHORIZATION: basic $HDR_B64"

          # RE-PROBE. Without this the fallback is the vacuity class: a repair that is
          # applied and never checked looks identical to one that worked (#10913's fallback
          # ran, logged that it ran, and was denied under the same identity).
          if OUT2=$(probe); then
            echo "[preflight] drift-sweep: fallback credential verified against the remote; lane is DEGRADED but alive."
            {
              echo "### heartbeat/drift-sweep is running on the FALLBACK credential"
              echo ""
              echo "\`ZETA_TELEMETRY_FLUSH_TOKEN\` was denied by the remote; \`GITHUB_TOKEN\` is verified and in use."
              echo "The ledger still parks on the staging branch. \`gate (required)\` will NOT start on the flush PR until the PAT can push."
              echo "Fix: grant that fine-grained PAT **Contents: read and write** on this repository."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$OUT2"
          echo "::error title=drift-sweep has no working push credential::BOTH the PAT and GITHUB_TOKEN were denied. The tick still computes so the run's summary carries the answer, and the flush below will report the authoritative error."

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Configure committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync to origin tip (event-driven ticks race pushes)
        # The checkout is pinned to the TRIGGERING commit, which can predate the previous
        # sweep's bookkeeping, and reading the ledger from it double-mints tick numbers
        # (first observed: the 000070 add/add race). The tick must be computed from origin's
        # latest ledger.
        #
        # This stays a plain `reset --hard` and the staging `prepare` happens LATER, after
        # the retraction actuator. The actuator runs `git revert`, which refuses to operate
        # with a dirty index — and `prepare` leaves the lane's unlanded payload staged
        # exactly there. Preparing here would have broken the healer on every tick where a
        # previous flush PR had not yet landed, which is most of them.
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Run detectors (findings are data here, not failures)
        run: |
          set +e
          bunx markdownlint-cli2@0.22.1 "**/*.md" > /tmp/findings.txt 2>&1
          echo "markdownlint exit: $? ($(wc -l < /tmp/findings.txt) output line(s))"
          exit 0

      - name: Retraction actuator (sovereign push_retraction edge — 081KZHGP45V)
        # The hands of episode-protocol.ts. Consent: RFC round 2026-08-10
        # (Vera+Riven builder assents; Lior/Soraya conditions in the machine's
        # laws; operator word). ALL decisions are the state machine's — this
        # step gathers facts, steps the machine, executes commands. Runs
        # BEFORE this tick's sweep so openTicks reflects completed ticks.
        # Bot pushes don't trigger workflows: the actuator dispatches gate.yml
        # after pushing; post_push_gate reads check-runs by SHA next tick.
        # Safe-pattern: first-party context via env only.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --deepen=50 origin main
          bun src/Core.TypeScript/hygiene/retraction-actuator.ts

      - name: Detect build drift on main (BD001 — detector half of 081KZHGP45V)
        # Queries the latest COMPLETED gate push-run on main; any failed
        # build-and-test leg becomes a BD001 finding anchored to Zeta.sln
        # (tracked, so it passes the --tracked guard). BD001 carries the
        # tightest SLO budget in registry/drift-slo.yaml: a red main build
        # gets ONE tick of tolerance, then the SLO auto-files a P1 — this is
        # Vera's ratification clause ('true only while main stays green')
        # made mechanically watched. The auto-REVERT actuator (the healer
        # half of 081KZHGP45V) is deliberately not here: reverting main is
        # the most dangerous healer class and lands only through the
        # certification harness with fleet eyes.
        # Safe-pattern: first-party trusted context only, passed via env.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/gate.yml/runs?branch=main&event=push&status=completed&per_page=1" \
            | jq -r '.workflow_runs[0]')
          run_id=$(echo "$run_json" | jq -r '.id // empty')
          run_conclusion=$(echo "$run_json" | jq -r '.conclusion')
          
          if [ -z "$run_id" ]; then
            echo "no completed gate push-run found — no BD001 signal this tick"
          else
            if [ "$run_conclusion" == "success" ]; then
              echo "main build green (gate run $run_id conclusion success, ignoring any non-blocking failures)"
            else
              failed=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
                | jq -r '[.jobs[] | select((.name|startswith("build-and-test")) and .conclusion=="failure") | .name] | join("; ")')
              if [ -n "$failed" ]; then
                echo "Zeta.sln:1 BD001/main-build-red gate run $run_id: $failed" >> /tmp/findings.txt
                echo "BD001: main build drift detected ($failed, run $run_id)"
              else
                echo "main build green (gate run $run_id failed but not in build-and-test)"
              fi
            fi
          fi

      - name: Install dependencies (yaml parser for the SLO registry)
        run: bun install --frozen-lockfile

      # STAGING STARTS HERE, deliberately AFTER the retraction actuator.
      #
      # From this point on every step writes files that must reach `main`, so the tree moves
      # onto the lane's staging branch: start from origin's current tip (which the actuator
      # may have just moved) and union in whatever is still parked on
      # `heartbeat/drift-sweep` from a run whose flush PR has not landed yet. Without that
      # union a fast cadence would force-push over an unlanded tick — and because tick
      # numbering is `max existing + 1` derived from the ledger itself, it would then mint a
      # DUPLICATE number for it. The union is what keeps the phase clock monotonic across an
      # asynchronous flush.
      #
      # It cannot run earlier: `prepare` leaves the unlanded payload staged in the index, and
      # the retraction actuator's `git revert` refuses to run against a dirty index.
      - name: Prepare staging working tree
        run: bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts prepare --lane drift-sweep

      - name: Record the tick
        run: |
          git ls-files > /tmp/tracked.txt
          bun src/Core.TypeScript/hygiene/drift-ledger.ts sweep \
            --dir docs/drift-events --tracked /tmp/tracked.txt < /tmp/findings.txt
          bun src/Core.TypeScript/hygiene/drift-ledger.ts report --dir docs/drift-events

      - name: Certified markdown heal (gyroscope — measure, then stabilize)
        # The sweep stops being a stethoscope: after findings are captured
        # (measure-first, so the ledger records the drift), the CERTIFIED
        # markdown fixer heals it in the same tick's push. The entry point
        # re-certifies the healer's three laws on every invocation and exits
        # 2 touching nothing on failure (#10153) — certification IS the
        # write gate. Next tick measures the heal: every markdown class
        # converges at MTTH ~ 1 tick, continuously. Additive pattern: each
        # new certified healer = one more stabilized axis.
        run: |
          # SCOPE FIRST. `git ls-files '*.md'` is every tracked markdown file in the repo, and the
          # healer used to receive it whole — including paths `.markdownlint-cli2.jsonc` explicitly
          # excludes. On 2026-08-13 that rewrote 414 preserved PR-review archives with an MD032 fix,
          # the exact rule the config names as violating their verbatim contract. The ignore list
          # existed and was simply never consulted on the path that could write.
          mapfile -t files < <(git ls-files '*.md' | bun src/Core.TypeScript/hygiene/healers/md-heal-scope.ts)
          if [ "${#files[@]}" -gt 0 ]; then
            bun src/Core.TypeScript/hygiene/healers/md-fixer-certified.ts "${files[@]}"
            git add -u -- '*.md'
          fi

      - name: Certified memory reindex (gyroscope axis 3 — MEMORY.md cannot stale)
        # The second named subject of the healer workitem. Certification is
        # the write gate (gen(gen)==gen staleness detector + independent
        # trailing-space/code-span teeth); refuses to write on failure. The
        # 2026-07-08 closure incident — heals staling this very index — is
        # now impossible by construction: regeneration runs every tick.
        run: |
          bun src/Core.TypeScript/hygiene/healers/memory-reindex-certified.ts
          git add memory/MEMORY.md

      - name: SLO check — auto-file P1 workitems for breaching drift classes
        env:
          ZETA_WORKITEM_ACTOR: drift-sweep
        run: |
          bun src/Core.TypeScript/hygiene/drift-ledger.ts slo \
            --dir docs/drift-events --config registry/drift-slo.yaml --workitems workitems

      - name: Publish per-leg platform drift (the read surface for non-blocking legs)
        # Aaron 2026-08-19: "windows and mac are drift checks ... we don't want to
        # block on them." Non-blocking is only honest if the drift is SEEN, and the
        # two surfaces that existed both stop short: `gate (required)`'s summary is
        # per-run on a push run nobody opens, and BD001 above keys findings to
        # `Zeta.sln` so it cannot say WHICH platform drifted or how often. This fold
        # answers per-leg rate, clean streak, and coverage — the last of which is the
        # one that bites: 265 of the 300 most recent completed gate push runs were
        # `cancelled` before their legs ever ran, so a clean streak counted over
        # pushes rather than over EXECUTIONS is evidence of nothing.
        #
        # Incremental and idempotent: run records are keyed by run id and upserted,
        # so a tick costs one list call plus jobs for runs it has not already seen
        # (usually zero or one). Never fatal — it reports on legs that by decision
        # cannot block, so it must not be able to block either.
        continue-on-error: true
        # Safe-pattern: first-party trusted context via env only, never interpolated
        # into the shell. `GITHUB_*` is reserved by the runner, so the repo slug rides
        # under its own name and is passed as an argument.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          bun src/Core.TypeScript/ci/platform-drift-report.ts \
            --repo "$REPO" --out data/platform-drift.json --pages 1 --max-runs 500

      - name: Publish the MTTH fold for the Pages monitor panel
        run: |
          bun src/Core.TypeScript/hygiene/drift-ledger.ts report \
            --dir docs/drift-events --json > data/drift-mtth.json

      - name: Publish the drift genome fitness (society-evolution's ledger contract)
        # The gyroscope as a citizen of planning/society-evolution.ts:
        # tunables encoded on the society's 7-channel genome, fitness scored
        # from THIS ledger each tick, published for the generational loop to
        # select on. Measurement only — a genome that wants to become config
        # goes through the registry-change discipline.
        run: bun src/Core.TypeScript/hygiene/drift-genome.ts

      - name: Run one generation in shadow (selection over drift genomes)
        # society-evolution's loop, drift edition: current + 16 seeded
        # mutants scored by replaying THIS ledger under candidate budgets
        # (leak vs alarm objective); ranked population published. Seed =
        # latest tick — reproducible exploration each tick. Adoption of a
        # winner remains a registry consent act.
        run: bun src/Core.TypeScript/hygiene/drift-evolution.ts

      - name: Evaluate the proposer (persistent dominance -> consent letter)
        # 081KZSRBBAM: when the current genome has been strictly dominated
        # for K consecutive ticks, an at-most-once letter (keyed by genome
        # hex) lands in docs/letters/ carrying the registry diff + evidence.
        # Evolution proposes; the society disposes — this NEVER edits the
        # registry. Status published to data/drift-proposal.json every tick.
        run: bun src/Core.TypeScript/hygiene/drift-proposer.ts

      # HOW THE TICK LANDS — and why it no longer pushes at `main`.
      #
      # From 2026-08-13 to 2026-08-23 this step ran `git push` straight at `main` and was
      # refused every single time by ruleset "CI Gate", which requires `gate (required)` at
      # PUSH time with no bypass actors:
      #
      #     remote: - Required status check "gate (required)" is expected.
      #     ! [remote rejected]     main -> main (push declined due to repository rule violations)
      #
      # The refusal was swallowed by `git push || echo "push race — next tick re-records
      # (idempotent)"`, and that one line is the whole defect. It misfiled a PERMANENT rule
      # rejection as a TRANSIENT race: a race genuinely is re-recorded next tick, a ruleset
      # rejection fails identically forever. So the lane "recovered" 1,597 times from
      # something that was never going to resolve, concluding SUCCESS on every one, while
      # `docs/drift-events/` stayed frozen at tick 000247 and `data/platform-drift.json` at
      # run 32232815018. Ten days of a dashboard serving stale numbers from behind a green
      # check — the exact defect this whole surface exists to detect, committed inside the
      # detector. Filed as 081M0QPZD9C087G0R002W8QC2A.
      #
      # THE ROUTE, which is not new and is not invented here: park on the ungated
      # `heartbeat/drift-sweep` staging ref, then land via a PR with squash auto-merge armed,
      # so `gate` runs on the flush the way it runs on everything else. `tick-metrics`,
      # `society` and the three `agent-heartbeat` lanes have been landing this way for
      # months; `drift-sweep` was simply never migrated. The ruleset is untouched, no bypass
      # actor is added, and nothing is merged with `--admin`.
      #
      # AND IT FAILS NOW. `flush-via-staging.ts` exits 3 when the staging push or the PR call
      # fails, and this step has no `||` and no `continue-on-error`, so a lane that cannot
      # publish goes RED instead of green. That is a deliberate reversal of the old comment
      # here ("red runs would just be noise"): the noise argument is sound for a lost race
      # and false for a broken route, and treating them alike is what cost ten days. A
      # genuinely empty tick is still a clean no-op — `flush` returns 0 when nothing is
      # staged, so idempotency is preserved without pretending.
      #
      # NO `[skip ci]` IN THE MESSAGE. It was harmless when the push was rejected anyway;
      # here it would be fatal, suppressing `gate` on the PR head so the required check never
      # reports and the PR hangs unmergeable forever. `flush-via-staging.ts` refuses a skip
      # token rather than open a dead PR — see `assertNoSkipCi`.
      #
      # Guarded by `src/Core.TypeScript/hygiene/lint-drift-publication-lands.ts`, which
      # refuses a publication push at `main`, a swallowed publish failure, and a lane with no
      # credential capability probe. Prose rots; that lint is what holds this.
      - name: Flush the tick to main via staging branch + PR
        env:
          # ROLE: PR-CREATE. One role, one secret.
          #
          # The enterprise forbids the Actions identity from creating pull requests, so the
          # `gh` calls in this step authenticate as ZETA_PR_ARCHIVE_TOKEN — the credential the
          # role table in
          # docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md
          # assigns to `gh pr create`. The BRANCH PUSH is a different role and is already
          # authenticated by the persisted checkout credential (ZETA_TELEMETRY_FLUSH_TOKEN);
          # the `||` chain that stood here collapsed both roles plus GITHUB_TOKEN into one
          # variable and silently substituted whichever happened to be set.
          #
          # ABSENCE IS A NAMED REFUSAL, NOT A SUBSTITUTION. `openMergePR` refuses an empty
          # GH_TOKEN and names the secret and the exact scope
          # (src/Core.TypeScript/agent-heartbeats/merge-heartbeats-to-main.ts). The payload
          # still parks safely on the staging branch — nothing is lost — and the step goes
          # red rather than landing under the wrong authority.
          GH_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN }}
        run: |
          bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts flush \
            --lane drift-sweep \
            --paths docs/drift-events docs/letters workitems memory/MEMORY.md \
              data/drift-mtth.json data/drift-genome.json data/drift-evolution.json \
              data/drift-proposal.json data/platform-drift.json \
            --message "drift: record sweep tick + certified heals"

      # ══════════════════════════════════════════════════════════════════════════
      # main's gate-verdict drought — reported HERE because this lane SURVIVES it
      # ══════════════════════════════════════════════════════════════════════════
      #
      # THE CONDITION. `gate.yml` cancels its in-flight run on every merge to main
      # (per-ref concurrency, `cancel-in-progress`). When merges arrive faster than the
      # gate finishes, main accumulates commits whose only signal is `cancelled` — which
      # is neither a pass nor a fail, so every surface that folds gate outcomes finds
      # nothing and renders green. Measured 2026-08-23T17:35Z: last SUCCESS 10fbd9a4 at
      # 16:43:22Z (~52 min and ~20 commits earlier), last 8 runs = 6 cancelled + 2
      # running + 0 success, gate duration ~14 min, and three merges inside 24 seconds.
      #
      # WHY IT RUNS IN THIS WORKFLOW AND NOT ONLY IN `gate`. The same reporter runs in
      # gate.yml's `drift (loud)` job, and that copy is cancelled by exactly the
      # condition it reports — a detector living only inside `gate` is silent precisely
      # when it matters. This workflow has its own concurrency group with
      # `cancel-in-progress: false` and fires on every push to main, so it SURVIVES the
      # storm: measured during the one above, drift-sweep concluded `success` at
      # 17:30:37 → 17:34:32 while four consecutive gate runs were being cancelled.
      # One detector, two hosts with different concurrency groups. If both ever go
      # quiet the condition is invisible again — that limit is real and is stated in
      # src/Core.TypeScript/ci/verdict-drought.ts rather than papered over.
      #
      # `--report-only` — LOUD, AND THIS HOST NEVER GOES RED. drift-dashboard's roster
      # folds the latest run per workflow and fails when any is red, so failing this job
      # would cascade into a lane whose semantics are not this change's to alter. The
      # `::error::` annotation and the step summary are the signal here; the `drift
      # (loud)` host takes the non-zero exit, where a red X beside a green required
      # check is the established, reviewed pattern (#14283).
      #
      # It publishes NOTHING — no commit, no push, no artifact, and it does not go through
      # the flush lane above either. Loud lives in the RUN, where nothing has to land for
      # it to be seen. (When this step was written, the bookkeeping above was a raw
      # `git push origin main` that the "CI Gate" ruleset had been rejecting since
      # 2026-08-13 while the workflow reported green; main has since routed it through
      # `flush-via-staging.ts`. That fix is why the sentence changed — the reason for
      # publishing nothing did not: a drought reading is a fact about NOW, and parking it
      # for a later flush would add a staleness window to the one measurement whose whole
      # subject is staleness.)
      - name: main gate-verdict drought (loud, never red here)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          bun src/Core.TypeScript/ci/verdict-drought.ts \
            --repo "$REPO" --window 60 --report-only

