# Auto-rerun for runs whose TOOLCHAIN INSTALL STEP died on the apt wall budget — and nothing else.
#
# THE MEASURED PROBLEM (2026-08-25, 15:28Z-20:43Z; full derivation in
# docs/research/2026-08-25-one-apt-wall-budget-failure-wearing-six-job-names.md).
# Sixty of the window's failed runs were sampled and every failed job attributed to its
# failing step: 102 failed jobs, 17 of which died in the toolchain install step BEFORE the
# work the job is named for began — under six job names across four workflows (gate, CodeQL,
# helm-validate, k8s-argocd-health-test). One infrastructure failure wearing six names, and
# each instance costs a human or an agent a manual `gh run rerun --failed`.
#
# WHAT IT IS NOT. Not a stall, despite what linux.sh's own banner says. Read against job
# 97946436709 the three in-step attempts made continuous forward progress (247s/89s/45s
# slices, apt's archive cache carrying downloads across them) at ~1.1 MB/s against the
# ~14 MB/s the 420s budget was sized from. 561 MB at 1.1 MB/s needs ~510s of download; the
# budget is 420s. The job ran out of wall clock while succeeding slowly.
#
# WHY A RERUN AND NOT A BIGGER BUDGET. `audit-apt-budget-fits-job-timeout.ts` reports the
# tightest FITTING margin at 18 seconds (k8s-lane-partition.yml:plan, 420 + 10 + 152 = 582s
# against a 600s timeout). A +20s bump turns that audit red; a useful bump needs
# `timeout-minutes` edited across ~49 governed jobs. That is a cost decision with a human's
# name on it, not a silent change — it is written up as a recommendation in the research doc,
# not taken here. A rerun instead re-samples the one variable that differs between a 38s apt
# phase and a 420s-exhausted one: which runner draws which mirror path.
#
# THE SAFETY PROPERTY. rerun-cancelled-gate.yml re-runs `cancelled` and deliberately never
# `failure`, because re-running a genuine failure converts a real red into a flaky green.
# That refusal stands. What is added here is not "also retry failures" — it is a signature
# that is causally incapable of being about a pull request's content: the job's FIRST failing
# step is the toolchain installer AND its log carries linux.sh's own budget-exhaustion banner
# together with exit 124. A test failure, a lint finding, a type error, a build break: never.
# A run holding BOTH a stall and a real red is refused outright and reaches a human.
# `src/Core.TypeScript/ci/toolchain-install-stall.test.ts` pins that against real captured
# runs; six mutations of the predicate (including widening it to bare `failure`) each turn a
# test red.
#
# WHY A SWEEP RATHER THAN A `workflow_run` WATCHER — cost. `gate` alone failed 117 times in
# the measured 5h15m window (~535/day extrapolated); a per-run watcher at ~40s per evaluation
# is ~356 runner-min/day and scales WITH the failure rate, i.e. costs most exactly when CI is
# worst. This sweep costs the same whether nothing failed or fifty things did: 96 ticks/day at
# 17s MEASURED ON THE FIRST RUN (32907739489, 22:46:35Z-22:46:52Z, 45-minute window, 5 failed
# runs evaluated) is ~27 min/day, flat -- ~13x cheaper than (b), not the ~5x estimated before
# the workflow had ever executed. One tick covers every workflow that calls install.sh without
# a per-workflow roster to drift. The price is LATENCY, stated honestly: this repo has
# measured GitHub dropping ~16% of `*/15` slots with gaps of 12-43 minutes (p50 16, p90 27 —
# see heartbeat-liveness.yml), so worst-case time-to-rerun is ~8min (to fail) + ~43min (to the
# next tick) ~= 51 minutes. Against a human noticing hours later, that trade is not close.
#
# WHY NOT INSIDE THE FAILING JOB. Cheapest of all would be an `if: failure()` step in the job
# that already exists. Refused on supply-chain grounds: that job executes pull request code,
# and giving it `actions: write` hands a fork PR the ability to drive the Actions API.
#
# BOUNDS, and what happens when they are exhausted:
#   - ONE automatic rerun per run id, enforced by GitHub's own `run_attempt` counter, so the
#     ceiling needs no state of ours and survives losing every record we keep. Past it the run
#     stays RED with the mirror named in its own log.
#   - Six reruns per sweep. A degraded mirror hits dozens of runs at once, and re-running all
#     of them feeds the same wall a second helping of the same runners. Past the cap the sweep
#     stops and logs `toolchain-install-stall-cap-hit` — that is the signal this is an outage,
#     and an outage wants a human, not a retry.
#   - 120-minute staleness limit and a supersession check: an old or replaced run is history.
#
# VISIBILITY — fixing a symptom must not delete the evidence that the cause exists. Every
# evaluation that touches the signature emits one JSON line keyed `kind` / `reason`, and each
# sweep closes with a `toolchain-install-stall-sweep` aggregate carrying per-reason counts. The
# sweep writes NO files: a `$GITHUB_STEP_SUMMARY` table was drafted and removed, because a job
# summary is a file write onto a rendered Markdown page and CodeQL was right to flag API-derived
# data reaching it (`js/http-to-file-access`) — dismissing that alert would need a human in the
# code-scanning UI, which is the intervention this change exists to delete. Two counters:
#   gh run list --workflow rerun-toolchain-install-stall.yml --json databaseId   (sweep logs)
#   gh api '.../actions/workflows/gate.yml/runs?per_page=100' \
#     --jq '[.workflow_runs[] | select(.run_attempt > 1)] | length'              (reruns landed)
# Honest limit on the second: `rerun-cancelled-gate.yml` also produces run_attempt > 1, so it
# is an upper bound; the sweep's own `by_reason` counts are the per-cause figure.
# A RISING `toolchain-install-stall` count is a root-cause regression, not a reason to raise
# the cap here.
#
# DISCIPLINE (mirrors gate.yml / rerun-cancelled-gate.yml):
#   - Runner pinned to an explicit version, not -latest.
#   - Third-party actions SHA-pinned by full 40-char commit SHA.
#   - permissions: `actions: write` ONLY — the single scope needed to re-run a workflow. The
#     token cannot modify code, cannot approve anything, cannot read secrets it is not given.
#   - Every job carries timeout-minutes.
#   - Scheduled from the default branch: no pull request head is ever checked out or executed,
#     and no attacker-influenceable value (branch name, run title, job name) is interpolated
#     into a `run:` block. Everything crosses into the script as an env var or an API read.

name: rerun-toolchain-install-stall

on:
  schedule:
    # Every 15 minutes. See the latency note above: GitHub delivers this best-effort.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually re-run (unchecked = dry run, evaluate and report only)"
        type: boolean
        required: false
        default: false
      since_minutes:
        description: "Look back this many minutes of failed runs (filters on run creation time)"
        required: false
        default: "45"

permissions:
  actions: write

concurrency:
  # One sweep at a time. Safe to cancel a queued older one: the sweep holds no state and
  # recomputes everything from the API, so a newer tick strictly supersedes an older one.
  group: rerun-toolchain-install-stall
  cancel-in-progress: true

jobs:
  sweep:
    name: rerun toolchain-install stalls
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout (default branch — never a pull request head; see header)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/Core.TypeScript/ci
            package.json
          sparse-checkout-cone-mode: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Evaluate the toolchain-install-stall policy and apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # A scheduled tick always applies. A manual dispatch is dry-run unless asked,
          # so the policy can be evaluated against production history without touching
          # anything. Both arrive as env vars, never as `${{ }}` inside the script.
          SWEEP_APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply }}
          SWEEP_SINCE_MINUTES: ${{ inputs.since_minutes || '45' }}
        run: |
          set -euo pipefail
          args=(--since-minutes "$SWEEP_SINCE_MINUTES")
          if [ "$SWEEP_APPLY" = "true" ]; then args+=(--apply); fi
          bun src/Core.TypeScript/ci/rerun-toolchain-install-stall-cli.ts "${args[@]}"
