name: git-hotspot-cadence

# Weekly cadenced detector for git hotspots — files touched by many
# commits in a short window, which cause merge-cascade DIRTY-flips.
# Runs the audit-git-hotspots.ts detector and uploads the resulting
# markdown report as a workflow artifact. Per 081KQ8P5D0008QG0R001D8RCZ9 phase 2 (cadence
# wiring); phase 1 (the script itself) is already on disk at
# src/Core.TypeScript/hygiene/audit-git-hotspots.ts.
#
# Why weekly: hotspot patterns surface across multiple PRs, not
# per-PR — a daily report would show flapping noise. Weekly is the
# right cadence to catch genuine emerging hotspots without
# generating per-day distractions. Same cadence as
# budget-snapshot-cadence.yml.
#
# Why off-the-hour Sundays: GHA cron thundering-herd avoidance per
# .github/workflows/budget-snapshot-cadence.yml convention.
#
# What this workflow does NOT do (per 081KQ8P5D0008QG0R001D8RCZ9 explicit scope):
#   - Does NOT auto-file backlog rows for new hotspots — that is
#     phase 3 triage routing, a per-finding judgment call.
#   - Does NOT auto-migrate. Each detected hotspot is a per-hotspot
#     decision.
#   - Does NOT enforce a hard cap. The script prints a markdown
#     ranking; the maintainer / future-Otto reviews the artifact.
#
# Composes with src/Core.TypeScript/hygiene/audit-git-hotspots.ts (the detector),
# docs/backlog/P1/081KQ8P5D0008QG0R001D8RCZ9 (the row), 081KQ8P5D0008QG0R001BH93SA (BACKLOG.md migration),
# 081KQ8P5D0008QG0R003KFRGJ0 (MEMORY.md migration).
#
# Safe-pattern compliance: SHA-pinned actions, explicit minimum
# permissions, no user-authored context interpolated into run blocks,
# concurrency group, pinned runs-on, path-filter for self-test trigger.
# This workflow uses only github.run_id and github.ref in template
# expressions — no untrusted user-authored inputs.

on:
  schedule:
    # Weekly Sundays 16:43 UTC — off-the-hour weekend slot. Adjacent
    # to but not colliding with budget-snapshot-cadence (Sundays
    # 16:23 UTC).
    - cron: "43 16 * * 0"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/Core.TypeScript/hygiene/audit-git-hotspots.ts"
      - ".github/workflows/git-hotspot-cadence.yml"

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: git-hotspot-cadence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hotspot-audit:
    name: detect git hotspots (weekly)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history so the script can analyze the touch
          # window (default 60 days). Without fetch-depth: 0 the
          # detector only sees the most recent commit.
          fetch-depth: 0

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: slim

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        env:
          # TIER DECLARED, not detected (081M0K36K69087G0R003BYSCF8 applied beyond gate.yml).
          # Every payload step in this job is bun/git/gh only -- it touches no agda, ghc,
          # emscripten, llvm, pandoc, r-base, podman, qemu or opam. On a hosted ubuntu runner
          # the undeclared path is not adaptation: 16 GB always detects `full`, i.e. the whole
          # 388-package / 713.0 MiB apt manifest. slim is 149 packages / 139.7 MiB.
          # This is a RELIABILITY fix before it is a cost one: the mirror stalls land on the
          # biggest archives (pandoc 26.9 MB, r-base-core 27.1 MB), so fetch fewer and fewer
          # runs die at exit 124 inside the 420s apt budget.
          ZETA_HOST_TIER: slim
          # mise release-metadata calls authenticate (1000/hr) instead of anonymous (60/hr 403 flake)
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Run hotspot detector
        run: |
          mkdir -p hotspot-reports
          bun src/Core.TypeScript/hygiene/audit-git-hotspots.ts \
            --window 60d \
            --top 30 \
            --report hotspot-reports/git-hotspots.md

      - name: Upload hotspot report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: git-hotspot-report-${{ github.run_id }}
          path: hotspot-reports/
          if-no-files-found: warn
          retention-days: 90
