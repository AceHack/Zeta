# .github/workflows/zflash-harness-lint.yml
#
# 081KSNY2Z0008QG0R0008PN7RQ — zflash QEMU test-harness CI floor.
#
# This first workflow slice validates the fail-closed planning surface for
# the 5-scenario zflash QEMU matrix without requiring QEMU or nested KVM.
# Runtime QEMU execution remains opt-in from the CLI until the stateful
# scenarios are fully wired and cheap enough for PR-time CI.

name: zflash-harness-lint
#
# RENAMED 2026-08-01 (was `zflash-qemu-test`). It never invoked qemu — no `qemu-system`, no
# `qemu-img`, no qemu install anywhere in the file; the single job is `zflash-qemu-harness-dry-run`
# and it runs `bun test` on library files. Three consecutive green runs therefore meant "the
# harness invariants hold", NOT "a boot was validated" — and it is the workflow anyone would check
# when asking "is flashing tested?".
#
# The REAL boot coverage lives in `build-ai-cluster-iso.yml`: it installs qemu-system-x86 + ovmf,
# boots the built image, and captures serial logs as artifacts. That one is genuinely green.
#
# A green check that implies more than it tested is worse than no check. This name now matches
# what the job does.

on:
  schedule:
    # Weekly Sundays 15:17 UTC — off-the-hour weekend cadence. This keeps
    # the 081KSNY2Z0008QG0R0008PN7RQ dry-run floor watching runner-image/Bun/dependency drift
    # without paying for default-on QEMU execution.
    - cron: "17 15 * * 0"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/Core.TypeScript/zflash/test-harness/**"
      - "src/Core.TypeScript/zflash/test-harness/prepare-boot-image.ts"
      - "src/Core.TypeScript/zflash/test-harness/serial-markers.ts"
      - "src/Core.TypeScript/ci/qemu-boot-test.ts"
      - "src/Core.TypeScript/ci/qemu-full-install-test.ts"
      - "src/Core.TypeScript/ci/audit-installer-iso-content.ts"
      - "src/Core.TypeScript/zflash/**"
      - "docs/backlog/P1/081KSNY2Z0008QG0R0008PN7RQ-zflash-done-acceptance-criteria-qemu-test-harness-5-scenario.md"
      - ".github/workflows/zflash-harness-lint.yml"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "src/Core.TypeScript/zflash/test-harness/**"
      - "src/Core.TypeScript/zflash/test-harness/prepare-boot-image.ts"
      - "src/Core.TypeScript/zflash/test-harness/serial-markers.ts"
      - "src/Core.TypeScript/ci/qemu-boot-test.ts"
      - "src/Core.TypeScript/ci/qemu-full-install-test.ts"
      - "src/Core.TypeScript/ci/audit-installer-iso-content.ts"
      - "src/Core.TypeScript/zflash/**"
      - "docs/backlog/P1/081KSNY2Z0008QG0R0008PN7RQ-zflash-done-acceptance-criteria-qemu-test-harness-5-scenario.md"
      - ".github/workflows/zflash-harness-lint.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    name: zflash-qemu-harness-dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      - name: Test zflash library + file-backed invariants
        run: bun test src/Core.TypeScript/zflash/lib.test.ts src/Core.TypeScript/zflash/file-backed.test.ts src/Core.TypeScript/zflash/file-backed-runtime.test.ts src/Core.TypeScript/zflash/flash-usb-windows.test.ts

      - name: Test zflash QEMU harness invariants
        run: bun test src/Core.TypeScript/zflash/test-harness/

      - name: Validate zflash QEMU dry-run plan
        run: bun src/Core.TypeScript/zflash/test-harness/run.ts --dry-run

      - name: Validate zflash file-backed boot-image prep (unit-level)
        run: bun test src/Core.TypeScript/zflash/test-harness/prepare-boot-image.test.ts

      - name: Validate state-retention runtime fails closed by default
        run: |
          set +e
          bun src/Core.TypeScript/zflash/test-harness/run.ts --scenario reformat-with-retention zflash-qemu-retention-placeholder.iso > retention-runtime.json
          exit_code="$?"
          set -e
          cat retention-runtime.json
          if [ "$exit_code" -ne 1 ]; then
            echo "::error::expected retention runtime to exit 1 without ZFLASH_QEMU_RETENTION_EXECUTE=1; got $exit_code"
            exit 1
          fi
          if ! grep -Fq "fails closed" retention-runtime.json; then
            echo "::error::retention runtime output did not document the fail-closed opt-in guard"
            exit 1
          fi

      - name: Validate path-fork runtime fails closed by default
        run: |
          set +e
          bun src/Core.TypeScript/zflash/test-harness/run.ts --scenario reformat-from-scratch zflash-qemu-path-fork-placeholder.iso > path-fork-runtime.json
          exit_code="$?"
          set -e
          cat path-fork-runtime.json
          if [ "$exit_code" -ne 1 ]; then
            echo "::error::expected path-fork runtime to exit 1 without ZFLASH_QEMU_PATH_FORK_EXECUTE=1; got $exit_code"
            exit 1
          fi
          if ! grep -Fq "fails closed" path-fork-runtime.json; then
            echo "::error::path-fork runtime output did not document the fail-closed opt-in guard"
            exit 1
          fi
