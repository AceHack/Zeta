# .github/workflows/docker-windows-install-ps1-test.yml
#
# Slice 2c — CI for the Server-Core Docker test of tools/setup/install.ps1 (081KSKBP80008QG0R002J03WGA Windows
# parity). Mirrors docker-nixos-install-sh-test.yml but on a Windows host (Windows containers need
# one). Base + runner are a MATCHED PAIR: servercore:ltsc2025 on runs-on: windows-2025 (Windows
# Server 2025, the current LTSC). WebSearch 2026-05-31: actions/runner-images#11742 (windows-2025
# GA 2025-04-08; windows-latest already migrated to Server 2025) — see the Dockerfile for full pins.
#
# GATED (2026-05-31): harness reached green on windows-2025 (CI run #6, 15 min) + locally (Docker
# Desktop, Hyper-V isolation) — so triggers flip from dispatch-only to pull_request + push, matching
# the NixOS sibling's paths-filtered gating (explicit duplicated lists, NO YAML anchors — GitHub
# Actions is finicky with anchors). Paths mirror the Dockerfile COPY set (tools/setup, the windows
# smoke + persistence, .mise.toml, package.json) + the harness (orchestrator + Dockerfile dir) +
# build-context inputs (.dockerignore, bun.lock) + this workflow file. install-substrate PRs that
# touch none of these skip the heavy (~15-min) Windows-container build entirely. workflow_dispatch
# stays for manual reruns.
name: docker-windows-install-ps1-test

on:
  # ── THE TIME-DRIVEN ARM (added 2026-08-26). ──────────────────────────────────
  #
  # The triggers below this comment and the one above it catch DIFFERENT FAILURE
  # CLASSES, and that is why both exist. This is DV2.0 change-rate partitioning
  # applied to CI triggers: two causes with different arrival processes get two
  # triggers, not one compromise.
  #
  #   path filter (`pull_request` / `push`)  <-  OUR CHANGES. Event-driven: it
  #     fires the moment someone edits the installer, which is the fastest
  #     possible feedback and is tied directly to the cause.
  #
  #   `schedule:`  <-  UPSTREAM DRIFT. Time-driven, and NOTHING ELSE CAN CATCH
  #     IT. the Windows package sources install.ps1 reaches for all move with no commit in this repo, so a
  #     path filter never fires: there is nothing to filter on. Before this
  #     block, the only checks that prove the installer works from a bare
  #     machine ran solely when somebody happened to edit the installer.
  #
  # WHY THIS WORKFLOW AND NOT THE OTHERS. The rule applied was: schedule a check
  # iff its outcome can change WITH NO COMMIT -- i.e. it reaches outside the
  # repo. `installer-unit-tests` and `installer-repair-mode-existing-install` are
  # deliberately NOT scheduled: their inputs are all committed, so a cron would
  # re-run the same computation on the same bytes and could only ever report what
  # the last push already reported.
  #
  # WHY DAILY. The drift this catches is a mirror, a channel, or a runner image
  # moving -- a days-scale process, not an hours-scale one. Daily is the coarsest
  # cadence that still surfaces it inside one work-window, which is the stated
  # basis `factory-hygiene-audit-cadence.yml` already uses. (`mirror-to-fork.yml`
  # runs 6-hourly for a different reason -- it bounds staleness of a BACKUP -- so
  # its number is not the one to copy here, only its principle: a periodic
  # artefact, with the cadence chosen from what it is protecting against.)
  #
  # WHY THE MINUTE IS ODD. Off-the-hour and distinct per lane so the fleet's
  # scheduled runs do not pile onto one minute and get dropped together under
  # GitHub scheduler load. Avoids :00/:15/:30/:45 (heartbeat), :07/:37
  # (drift-sweep) and the */6 lanes at :13/:23/:41.
  #
  # THIS IS NON-BLOCKING AND STILL LOUD, and the loudness needs no wiring here.
  # `drift-dashboard-cadence.yml` enumerates every active workflow and derives its
  # expectation from this `on:` block: `expectationFromWorkflow`
  # (src/Core.TypeScript/forge-host/github/workflow-triggers.ts) turns a `cron:`
  # into `{{ kind: "periodic", periodSeconds }}` -- and it treats a workflow that is
  # BOTH scheduled and PR-triggered as `periodic`, "because the clock is the
  # stronger claim". `fold.ts` then reddens on FAILURE, on SILENCE
  # (age > 3x period, fold.ts:335), and on "declared to run every N and has NEVER
  # produced a verdict" (fold.ts:301). So a scheduled shield that quietly stops
  # running goes red -- which is the whole point, since a cron nobody reads is the
  # vacuity class wearing a schedule.
  schedule:
    - cron: "9 4 * * *"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      # Install dispatcher + per-OS scripts + shared library + the windows package manifest
      - 'tools/setup/**'
      # Pinned runtime versions read by mise — the IDENTICAL file Unix uses (symmetric)
      - '.mise.toml'
      # bun --frozen-lockfile inputs for the TS wrapper
      - 'package.json'
      - 'bun.lock'
      # Windows background-loop scheduled-task installer (COPYed into the image)
      - 'src/Core.TypeScript/persistence/windows/**'
      # The Docker harness itself (orchestrator + Dockerfile dir + container smoke)
      - 'src/Core.TypeScript/ci/docker-windows-install-ps1-test.ts'
      - 'src/Core.TypeScript/ci/dockerfiles/windows-install-ps1-test/**'
      - 'src/Core.TypeScript/ci/windows-install-ps1-smoke.ts'
      # .dockerignore affects build context for ALL docker builds
      - '.dockerignore'
      # This workflow file itself
      - '.github/workflows/docker-windows-install-ps1-test.yml'

  push:
    branches:
      - main
    paths:
      - 'tools/setup/**'
      - '.mise.toml'
      - 'package.json'
      - 'bun.lock'
      - 'src/Core.TypeScript/persistence/windows/**'
      - 'src/Core.TypeScript/ci/docker-windows-install-ps1-test.ts'
      - 'src/Core.TypeScript/ci/dockerfiles/windows-install-ps1-test/**'
      - 'src/Core.TypeScript/ci/windows-install-ps1-smoke.ts'
      - '.dockerignore'
      - '.github/workflows/docker-windows-install-ps1-test.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-test:
    name: docker-windows-install-ps1-test
    runs-on: windows-2025
    # servercore pull (cold) + scoop bootstrap + mise install of .mise.toml runtimes
    # (dotnet/python/java/bun/uv) is heavy on a cold runner; 45-min ceiling gives headroom.
    timeout-minutes: 45

    steps:
      # Zeta has >260-char filenames (dense persona/research naming); a fresh runner's git fails
      # checkout with "Filename too long" without long-path support.
      - name: Enable git long paths (Windows MAX_PATH)
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun (matches .mise.toml pin)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3

      - name: Install bun dependencies (for the TS wrapper)
        run: bun install --frozen-lockfile

      # Option B (2026-05-31 agent huddle): give the Windows-container `docker build` more scratch.
      # windows-2025 runners have a TIGHT C: (~30GB free) but a roomy D: (~140GB free) — and dockerd's
      # data-root + the Windows-container build scratch (the C:\Windows\SystemTemp\hcs... layer) default
      # to C:\ProgramData\docker, which the ~1GB ollama install overflowed (run 86a365916: "not enough
      # space on disk"). Repoint data-root to D:\docker so the build gets D:'s headroom -> install.ps1
      # can actually install the ollama binary in CI (option A already made it best-effort so a failure
      # won't brick install; this lets it SUCCEED + be validated). Documented for the dockerd Windows
      # SERVICE (which the runner uses): https://learn.microsoft.com/virtualization/windowscontainers/manage-docker/configure-docker-daemon
      # EMPIRICAL CAVEAT (huddle): the windowsfilter driver has thin/contradictory evidence on whether
      # it fully honors data-root for the hcs scratch — the diagnostics below (DockerRootDir + the
      # per-build install.ps1 ollama output) tell us if it worked; --windows-containers-default-data-root
      # is the backup flag if not. Refs: actions/runner-images #12609, #12744.
      - name: Relocate Docker data-root to D:\ (Windows-container build scratch headroom)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== drive free space (before) ==='
          Get-PSDrive C, D | Format-Table Name, @{ n = 'FreeGB'; e = { [math]::Round($_.Free / 1GB, 1) } }
          Stop-Service docker
          $cfgDir = 'C:\ProgramData\Docker\config'
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          New-Item -ItemType Directory -Force 'D:\docker' | Out-Null
          $cfg = Join-Path $cfgDir 'daemon.json'
          $o = if (Test-Path $cfg) { Get-Content $cfg -Raw | ConvertFrom-Json } else { [pscustomobject]@{} }
          $o | Add-Member -Force -NotePropertyName 'data-root' -NotePropertyValue 'D:\docker'
          $o | ConvertTo-Json -Depth 10 | Set-Content $cfg
          Write-Host '=== daemon.json ==='
          Get-Content $cfg
          Start-Service docker
          # The daemon may need a moment to accept connections after the restart.
          $root = $null
          for ($i = 0; $i -lt 15; $i++) { try { $root = (docker info --format '{{.DockerRootDir}}'); if ($root) { break } } catch {}; Start-Sleep -Seconds 2 }
          Write-Host "DockerRootDir = $root"
          if ($root -notlike 'D:*') { Write-Host "::warning::data-root did not relocate to D: (got '$root') — build may still hit C: disk" }

      # GITHUB_TOKEN forwards into the build (as MISE_GITHUB_TOKEN --build-arg) so mise install
      # authenticates to the GitHub API (5000/hr) instead of hitting the unauthenticated 60/hr -> 403.
      # Sibling fix to the 4 Unix shields (#6273). The legacy Windows builder has no BuildKit secret
      # mounts, so the driver uses --build-arg + redacts the value in its logged command; the image is
      # rmi'd in cleanup() so its history is discarded same-job. ZETA_INSTALL_FULL is NOT set here:
      # that var gates the Unix from-installer registry, which install.ps1 does not use. The top-level
      # `permissions: contents: read` is sufficient — mise only READS public release metadata; the
      # token just raises the rate limit.
      - name: Run Server-Core Docker install.ps1 test
        env:
          DOCKER_LOG_OUT_PATH: docker-windows-install-ps1-test.log
          DOCKER_BUILD_TIMEOUT_SEC: '2400'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun src/Core.TypeScript/ci/docker-windows-install-ps1-test.ts

      - name: Upload Docker test log (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-windows-install-ps1-test-log
          path: docker-windows-install-ps1-test.log
          if-no-files-found: warn
          retention-days: 7
