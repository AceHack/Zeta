    # round-30 semgrep elevation: codified rules (tsconfig strict mode)
    # without a gate aren't a control.
    name: lint (TS)
    timeout-minutes: 12
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Strict TypeScript analysis consumes only the repository's Bun runtime
      # and lockfile-managed dev dependencies. Do not download the complete
      # apt workstation/cluster manifest before this narrow check starts.
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install npm devDependencies (typescript@6.0.3 + eslint stack)
        # tsc lives in node_modules/.bin via the typescript devDep
