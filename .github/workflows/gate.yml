  cross-verify:
    # Enforce the trust-core cross-language byte-lock + golden-vector oracles + the Ace
    # package-manager suite. Previously only `lint (TS)` type-checked these, so a
    # regression to a committed golden vector, or a 4-language disagreement, could merge green.
    # This job runs the ASSERTIONS (assert-dont-skip): every tests/cross-verification/<primitive>/
    # oracle via src/Core.TypeScript/ci/cross-verify-all.ts (compare.ts = TS/F#/C#/Rust committed outputs vs the
    # canonical vectors = the non-Byzantine compile-time agreement, baked in; cross-verify.ts = the
    # TS golden-vector oracle) plus `bun test src/Core.TypeScript/ace/` and the Q# source-oracle tests. The
    # ORACLES assert COMMITTED outputs (no dotnet/rust/QDK toolchain needed); the ace suite installs
    # npm deps (z3-solver) + uses the runner node for its solver Z3 differential. This is the
    # ENFORCEMENT half of the canonical-primitive gate (proof + 4-language byte-lock); the proof half
    # is the formal-coverage cadence / lean-proof lane. NOTE: promoting this to a REQUIRED check
    # (branch protection) is a separate operator/devops step — until then it runs + shows on every PR
    # but does not block auto-merge.
    name: cross-verify (trust-core oracles + ace suite)
    timeout-minutes: 12
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The committed oracle comparisons, Ace suite, and Q# source oracles
      # intentionally do not execute the F#/Rust/QDK toolchains. Their actual
      # dependency graph is Bun plus the repository lockfile (including
      # z3-solver), so use that declared narrow graph instead of the full apt
      # workstation/cluster installation.
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install npm devDependencies (z3-solver for the ace solver Z3 differential, etc.)
        # The ace suite's solver.z3.test.ts spawns node to require('z3-solver') (assert-dont-skip:
        # it FAILS rather than skips if the dep is absent). --frozen-lockfile fails if the lockfile
        # is stale vs package.json (same discipline as lint-typescript).
        run: bun install --frozen-lockfile

      - name: Ace package-manager suite
        run: bun test src/Core.TypeScript/ace/

      - name: Q# source-owned reference oracles
        run: |
          bun test \
            src/Core.QSharp.ReferenceOracle/qsharp-golden.test.ts \
            src/Core.QSharp.ReferenceOracle/quantum-circuit.test.ts \
            src/Core.QSharp.ReferenceOracle/dbsp-operators.test.ts \
            src/Core.QSharp.ReferenceOracle/heat-signals.test.ts

      - name: Cross-language byte-lock + golden-vector oracles
        run: bun src/Core.TypeScript/ci/cross-verify-all.ts

      # The `.claude/rules/no-binary-in-proof-lineage.md` exception, enforced rather than
      # asserted. `src/wasm-dla/bytelock/` holds six committed `.wasm` substrate modules; they
      # are the artifact UNDER TEST, not golden vectors, and the rule now says so — but a
      # documented exception with no scope is a licence. This derives the allowed set from the
      # byte-lock runner's own roster and the build script's own declared outputs, so a new
      # binary in that directory is red until it is wired into both.
      #
      # Two of its checks are here rather than in `bytelock.yml` on purpose. That workflow is
      # `push: main` — POST-MERGE by construction — so the malformed-artefact guard that would
      # have caught `dla-canonical-zig.wasm` shipping as an `ar` archive could only ever fire
      # after the fact, and it did, for two weeks. The header check and the golden-vector text
      # check need no toolchain, so they belong on the pre-merge floor.
      - name: Proof-lineage binary exception (no-binary-in-proof-lineage.md)
        run: bun src/Core.TypeScript/hygiene/audit-proof-lineage-binaries.ts

      # Every zflash host arm must reach the ISO integrity gate before it writes to a block
      # device. Measured on main 2026-08-21: the manifest check existed in the macOS arm and
      # NOWHERE ELSE, so flash-usb-linux.ts and flash-usb-windows.ts wrote an image with no
      # integrity verification at all (081M0HG7X7B087G0R002A05DAP). A missing check is
      # invisible to a test suite — the arms that have one stay green, and the arms that lack
      # one have nothing to test — so only something that reads the call sites can see it.
      #
      # HERE rather than in build-ai-cluster-iso.yml on purpose, and this is the placement
      # that workflow's own note asked for. The ISO lane runs on a subset of pushes, and when
      # this step lived there and referenced a script that did not exist it silently killed
      # ISO production for every run (#13102). On the cross-verify floor it blocks every PR,
      # beside the other audits whose subject is "a check that did not run must never look
      # like a check that passed".
      - name: zflash host-arm parity (every arm verifies the ISO before writing)
        run: bun src/Core.TypeScript/hygiene/audit-flash-entrypoint-parity.ts

      # Every ArgoCD `targetRevision` must name a chart version upstream actually published.
      # Measured on main 2026-08-20: applications/oz pins ziti-controller at 1.4.5, a version
      # OpenZiti never shipped (their 1.x line ends at 1.3.4), so that Application can never
      # sync — invisible because `oz` is one of 26 of 45 Applications no CI lane exercises, so
      # nothing ever asked the registry for the chart (081M0JVD5YG087G0R002QDFR9H, #13313).
      #
      # OFFLINE. It resolves every coordinate against the checked-in snapshot
      # `published-chart-versions.json` and opens no socket, so this step cannot redden a PR
      # because a third-party registry is down — which is the only reason a resolvability
      # check survives past its first outage. The network half is `--refresh`, and it runs on
      # a schedule in chart-version-refresh.yml where it is allowed to fail loudly.
      - name: ArgoCD chart targetRevisions resolve (offline, against the committed snapshot)
        run: bun src/Core.TypeScript/hygiene/audit-chart-target-revisions.ts

      # ARE THE DEFERRAL REASONS STILL TRUE? Every reasoned-exclusion registry in the cluster
      # tree was audited for a reason being PRESENT and naming a lift condition, and by nothing
      # for the reason being TRUE. Measured twice on 2026-08-21: `temporal`'s reason cited a
      # baseline acknowledgement that had been deleted forty minutes earlier (#13472 -> #13483),
      # and `oz`'s cited a chart pin the tree had already corrected (#13313 -> #13471). Both
      # audits stayed green through both, because a false sentence with a `LIFTS WHEN:` clause
      # has every mechanical property those checks look for.
      #
      # HERE rather than in k8s-argocd-health-test.yml, and the placement is the point: this
      # checker resolves citations into `.github/workflows/` (a CI job a reason names) and into
      # the chart roster, so a PR that renames a job would never trigger a path-filtered cluster
      # workflow and would silently strand the reason that cites it. The cross-verify floor runs
      # on every PR. OFFLINE, ~1s, no sockets -- it reads the committed baseline, the committed
      # render snapshot and the committed roster.
      - name: ArgoCD deferral reasons — every cited anchor still holds (offline)
        run: bun src/Core.TypeScript/cluster/reason-truth.ts

      # A tracked source file holding a raw 0x00 byte reads as BINARY to grep/rg, so every
      # text audit silently skips it -- a check that did not run, looking exactly like one
      # that passed. `rg 'foldChain' key-epoch-ledger.ts` printed "binary file matches" and
      # exit 0 while ten real matches were invisible, in the revocation ledger of all files.
      # The \u0000 escape is byte-identical at runtime and keeps the file searchable, so the
      # rule is total and needs no allowlist. Ten tracked files failed this when written.
      - name: No raw NUL in tracked source (an audit must be able to read the file)
        run: bun src/Core.TypeScript/hygiene/audit-no-raw-nul-in-source.ts

      # Addison Cooper's Genesis concept vocabulary is published as a static page that is
      # hand-copied into a DIFFERENT repository (lucent-financial-group.github.io) — no build
      # step, no CI, nothing connecting it back here. It drifted exactly as you would expect:
      # four society-identity terms landed in docs/GLOSSARY.md on 2026-07-31 and never reached
      # the page, and nobody found out until Aaron asked.
      #
      # docs/CONCEPT-REGISTRY.md is now the single list. This step is what keeps it honest —
      # it fails when the registry and the page disagree in EITHER direction, including a
      # silently reworded definition, which is the case a term-name-only check would miss.
      - name: Concept registry vs published page (docs/CONCEPT-REGISTRY.md)
        run: bun src/Core.TypeScript/hygiene/audit-concept-registry-drift.ts

      # A filesystem EXISTENCE test whose result gates a later operation on the same
      # path. Check-then-use; TOCTOU; CWE-367. THREE instances landed on 2026-08-20, in
      # one day, from three INDEPENDENT agents, all in code that had already been
      # written and reviewed: cluster/restricted-namespace-workloads.test.ts
      # (readdir + statSync().isDirectory() + readFileSync),
      # cluster/storage-profiles.ts (existsSync -> readFileSync), and
      # hygiene/audit-chart-target-revisions.ts (three sites in one file). Each was
      # found by CodeQL one at a time, AFTER merge, because nothing in the tree looked
      # for the shape. The pattern READS as defensive and prevents nothing.
      #
      # HERE rather than in codeql.yml on purpose. CodeQL runs on a schedule and
      # reports into the security tab, so its verdict arrives after the merge that
      # caused it -- which is how all three shipped. This step is offline, needs no
      # database build, and blocks the PR.
      #
      # --baseline grandfathers the 288 pre-existing instances measured on main when
      # this landed (AUDIT-LIFECYCLE.md step 5: the gate has to be landable without a
      # 288-file cleanup first). NEW instances fail, and so does an edit that renames
      # the path expression at a grandfathered site. --min-files is the scan floor: an
      # audit that inspected nothing must not report success.
      - name: No check-then-use filesystem races (TOCTOU, CWE-367)
        run: |
          bun src/Core.TypeScript/hygiene/lint-check-then-use-file-races.ts \
            src/Core.TypeScript \
            --min-files 1500 \
            --baseline src/Core.TypeScript/hygiene/lint-check-then-use-file-races.baseline.json

      # Executes mumps_zeta_id.m (subset interpreter). compare.ts already pins
      # the committed JSON; this step runs the routine so a layout edit in the
      # .m file cannot hide behind a stale mumps-output.json.
      - name: Execute MUMPS zeta-id packer
        working-directory: tests/cross-verification/zeta-id
        run: bun run-mumps.ts

      # The six GENERATED bit-layout files vs docs/zeta-id-v1-layout.yaml, which the
      # zeta-id README named as an open hole: "There is no CI gate verifying the .gen
      # files match the YAML, so an edit without regeneration fails nowhere until a
      # codec stops compiling."
      #
      # The oracles above do not close it. compare.ts pins each oracle's COMMITTED
      # output to vectors.yaml, and CI independently re-executes five of the seven
      # (TS `bun test`, F#/C# `dotnet test`, Python `pytest`, MUMPS the step above).
      # Go and Rust are re-executed NOWHERE — this workflow runs only
      # `go test ./algebra/` and `cargo test … Core.Rust.Observe`. So a wrong constant
      # in zeta_id.gen.go or bit_layout.gen.rs sat behind a stale-but-agreeing output
      # JSON with every job green. This step is the independent reproduction for that
      # pair, and for the other four at no extra cost.
      - name: zeta-id generated layouts vs the layout YAML
        run: bun tests/cross-verification/zeta-id/gen-layout-drift.ts

      # Algebra-tower drift-check: the generated law-property tests must be
      # regenerable-identical from their IRs (codegen-law-drift), and the
      # generated laws must hold against the TS oracle instances. Covers the
      # semiring → ring → kleene tower (+ the orthogonal star-ring branch).
      # Pure bun/arithmetic — no go/python spawns (the cross-language law
      # cross-verify is a separate, local/toolchain-heavy lane).
      - name: Algebra-tower drift-check (semiring→ring→kleene + star-ring)
        run: |
          bun test \
            tests/cross-verification/_harness/codegen-law-drift.test.ts \
            tests/cross-verification/_harness/generated-semiring-laws.test.ts \
            tests/cross-verification/_harness/generated-ring-laws.test.ts \
            tests/cross-verification/_harness/generated-star-ring-laws.test.ts \
            tests/cross-verification/_harness/generated-kleene-laws.test.ts

  test-typescript-hermetic:
    # ══ TIER 1 OF 2: HERMETIC ═══════════════════════════════════════════════════════════
    #
    # A RED X HERE MEANS A REAL REGRESSION. That is the entire claim of this job, and it is
    # the property the tier split was built to establish. Nothing below depends on a venv,
    # a cluster, a container, a physical device, an attached ISO, or the invoking user's
    # home directory. Toolchain comes from install.sh, which is the same script a laptop and
    # a devcontainer run (GOVERNANCE §24), so a developer reproduces this verdict exactly.
    #
    # WHY THE SPLIT. MEASURED 2026-08-16 across the 53 most recent completed `gate` runs:
    # the old undivided `test (TS suite)` was red in 17 of them (32%), and in 15 of those the
    # ENTIRE cause was one deterministic test -- `folderSink -- entropy tracker wiring`, a
    # genuine regression that rode along across sixteen merges because this job sits outside
    # `gate (required)` and a red X nobody must clear is a red X nobody reads.
    #
    # The reason nobody read it was not in CI. MEASURED the same day on a FRESH CLONE of main
    # (macOS, `bun install` only), `bun test` gave 4 failures + 1 unhandled error and ZERO of
    # them were code defects: 4x cross-verify-ir (no Q# venv; no .NET SDK 10.0.302) and 1x
    # esp-inject (EPERM scandir ~/Downloads, thrown at module scope under macOS TCC). So the
    # SAME command was red-for-environment where people work and red-for-regression where it
    # mattered, with nothing in either output separating the two. The prior "this suite is
    # always red" is learned on the laptop and spent on the pull request. Splitting the tiers
    # is how that prior is retired: after this change, red here is red everywhere, for the
    # same reason.
    #
    # WHAT MOVED, AND WHERE IT WENT. Exactly the two files above, to
    # `test (TS environment-dependent)` below -- which still runs on every PR. Each is
    # declared with the NAME of the dependency it needs in
    # registry/environment-dependent-test-files.json, and
    # src/Core.TypeScript/hygiene/environment-dependent-test-files.ts is red if an exclusion
    # is undeclared, unattributed, or reached by no lane at all. Excluding a file from this
    # tier while nothing else runs it would be a deletion wearing a split's face; that is the
    # condition the checker exists to make unlandable.
    #
    # PROMOTION. This job is STILL absent from the `gate-required` needs list -- branch
    # protection is a treaty amendment, not a workflow edit. It is now the tier that is
    # eligible: adding `- test-typescript-hermetic` to `gate-required.needs` is the one-line
    # change, once the maintainer consents.
    #
    # THE GAP THIS CLOSES. Before this job, CI executed roughly 130 of the repo's 900-plus
    # `*.test.ts` files. Whole directories -- discovery/, planning/, browser-node/,
    # ferry-throttler/, model-backend/, oracle/, forge-host/ -- were never executed by any
    # workflow, so a PR touching them went green having run zero of their tests. Three live
    # instances on 2026-08-13 alone: a 32-test chaos harness whose four deliberately-pinned
    # known-broken behaviours were inert; the independent check that falsified a proposed
    # light-time remedy, never re-run; and a freshly-merged 21-test migration alongside a
    # drift gate referenced by no workflow, while main sat in drift and nothing reported it.
    # zflash-harness-lint.yml states the rule: a green check that implies more than it tested
    # is worse than no check. Work-item 081KZYPHESJ087G0R002EZ7A2H.
    #
    # WHY A BARE `bun test` AND NOT A LIST OF DIRECTORIES. Every filter list is a fresh copy
    # of the same defect: forge-host/ fell outside the previous globs precisely because
    # someone had to remember to add it. A bare invocation cannot have that bug -- a new
    # directory is covered the moment it exists. Deliberate exclusions therefore live in
    # exactly one place, the pathIgnorePatterns of a bunfig, and each one must carry a
    # written reason in a registry.
    # hygiene/unexecuted-test-files.ts enforces both halves and fails on an undeclared,
    # unreasoned, or stale entry.
    #
    # `--config=bunfig.hermetic.toml` DOES NOT BREAK THAT RULE, for the same reason: it is still a
    # bare, filter-less invocation, and the tier's exclusions are still a written list in a
    # bunfig under a registry-backed checker. bun has no exclude-filter form, so a second
    # config is the only way to say "everything except these" without reintroducing the
    # include-list defect. bunfig.hermetic.toml is asserted to be a strict superset of
    # bunfig.toml on every PR, so the two cannot drift apart in silence.
    #
    # WHY A SEPARATE JOB rather than a step inside `lint (TS)`. That job type-checks; folding
    # behaviour into it puts two different failures behind one red X, which is the attribution
    # problem the 2026-06-13 per-language lint split already solved once here. It also carries
    # a 12-minute cap sized for tsc, while this suite measured 256-346s locally on its own.
    #
    # WHY NOT SPLIT ACROSS PARALLEL JOBS. Per-job fixed cost here is the install.sh bootstrap
    # plus `bun install` -- 1-2 minutes even on a cache hit -- against roughly 7 minutes of
    # actual test time. N jobs multiply the fixed cost for a wall-clock saving that does not
    # pay. Revisit if the suite passes about 10 minutes.
    #
    # COST. About 9 minutes per run (setup plus tests) on ubuntu-24.04 at the 1x multiplier;
    # at roughly 250 gate runs per month that is on the order of 2,250 runner-minutes added.
    # It buys execution of ~770 files and ~9,000 assertions that today execute nowhere.
    #
    # RUNS, DOES NOT BLOCK. Deliberately absent from the `gate-required` needs list. The
    # 2026-08-01 drift-and-heal ADR narrowed the blocking floor to
    # registry/uncompensatable-floor.yaml after a priority-inversion incident; making ~770
    # long-unrun files blocking on day one would be that inversion again. Running them IS the
    # drift signal. Promotion to the floor is a separate treaty amendment, once this job has
    # a track record. The blocking subset is unchanged: build-and-test, cross-verify,
    # full-verify and lint (semgrep) keep their existing named steps and their floor status.
    name: test (TS hermetic)
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The hermetic tier is deliberately JavaScript-first. Its explicit SMT
      # binary realizer remains below; the full apt/mise workstation graph is
      # not an input to this suite and repeatedly consumed the job budget before
      # any hermetic assertion ran.
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install JavaScript dependencies from the locked graph
        run: bun install --frozen-lockfile

      # NO `uv sync` STEP HERE, ON PURPOSE. It provisioned the gitignored Q# venv at
      # src/Core.Python/.venv for cross-verify-ir, which is the single largest reason a
      # laptop run of this suite came back red: 4 of the 5 failures on a fresh clone. That
      # file now runs in `test (TS environment-dependent)`, which does the uv sync, and in
      # full-verify, which is in the required floor. A tier whose green depends on a venv
      # the reader has never created cannot be the tier whose red means a regression.

      - name: Verify npm devDependencies are installed
        # Several suites import devDependencies directly (z3-solver among them) and
        # assert-dont-skip when the dep is absent, so a missing install reads as a real
        # failure rather than a skip. The preceding frozen-lockfile install is the
        # sole dependency realization for this narrow job.
        run: test -d node_modules

      - name: Pin z3 4.16.0 and cvc5 1.3.4 (081KZZ27KJ8)
        # apt on ubuntu-24.04 is z3 4.8.12 / cvc5 1.1.2; two SMT certificates
        # soft-skip under that pair. Checksummed GitHub-release binaries go in
        # ~/.local/bin. No-op when PATH already meets the floor.
        run: bun src/Core.TypeScript/ace/setup-realizers/install-pinned-smt.ts

      - name: Tier manifest (what the hermetic tier deliberately does not run, and why)
        # Printed BEFORE the suite, pass or fail, so the log states the tier's own boundary
        # instead of leaving a reader to infer it from an absence. It also exits non-zero on
        # an undeclared, unattributed, or run-nowhere exclusion, which is the guard that
        # keeps the split from becoming a quiet mute list.
        run: bun src/Core.TypeScript/hygiene/environment-dependent-test-files.ts

      - name: Whole TypeScript suite (hermetic tier)
        # No path filters: see the header. Exclusions live in bunfig.hermetic.toml, and each
        # one is declared with a reason in registry/unexecuted-test-files.json (runs nowhere)
        # or registry/environment-dependent-test-files.json (runs in the tier below).
        run: bun --config=bunfig.hermetic.toml test

  test-typescript-environment:
    # ══ TIER 2 OF 2: ENVIRONMENT-DEPENDENT ══════════════════════════════════════════════
    #
    # A RED X HERE MEANS EITHER a real regression OR that this runner could not provide a
    # dependency the test needs. That ambiguity is exactly why these files are not in the
    # tier above -- it is not removed, it is CONCENTRATED, into a job whose name says so and
    # whose manifest names every dependency involved. Two red X's that mean different things
    # are readable; one red X that means either is not, and that was the state this replaced.
    #
    # THIS IS NOT A DUMPING GROUND, AND THE CHECKER MAKES THAT STRUCTURAL. Every file listed
    # below must appear in registry/environment-dependent-test-files.json with a non-empty
    # `dependency` naming the concrete missing thing (an SDK version, a venv, a device) and a
    # `reason` for why it cannot be assumed present. hygiene/environment-dependent-test-files
    # .ts is red if a hermetic-tier exclusion is undeclared, unattributed, listed in BOTH
    # registries, or -- the load-bearing one -- executed by no pull_request-lane invocation.
    # Moving a flaky test here to make it quiet does not work: it still runs, still here,
    # still red, and now with your name on the reason.
    #
    # WHY NOT `continue-on-error`. It renders a job green while it failed. An absent check
    # and a passing check must not look alike; that is the same defect as the one this whole
    # split exists to fix, so this job reports honestly and is simply not in the floor.
    #
    # THE FILE LIST IS EXPLICIT, unlike the tier above. Here that is correct rather than the
    # include-list defect the header of that job warns about: this is a hand-curated
    # exception set by construction, and the derivation in hygiene/environment-dependent-test
    # -files.ts reads THIS list out of the workflow to prove each registry entry actually
    # runs. A file silently dropped from this list becomes an "excluded from hermetic and run
    # by nothing" finding on the next PR.
    #
    # COST. Two files, seconds of test time; the minutes are the shared install.sh bootstrap
    # plus the uv sync that the hermetic tier no longer pays for.
    name: test (TS environment-dependent)
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
            ~/.rustup/toolchains/1.87.0-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
            ~/.cache/zeta/from-autotools-tarball/*.tgz
          key: install-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        # Same retry rationale as every other install.sh step in this file
        # (Aaron 2026-04-28 PR #23 mise+bun-1.3.13 502).
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if ./tools/setup/install.sh; then exit 0; fi
            [ "$attempt" = "5" ] && { echo "install.sh failed after 5 attempts"; exit 1; }
            case "$attempt" in
              1) backoff=10 ;;
              2) backoff=30 ;;
              3) backoff=60 ;;
              4) backoff=120 ;;
            esac
            echo "install.sh attempt $attempt failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
          done

      - name: QDK venv setup (uv sync)
        # The dependency that makes cross-verify-ir environment-dependent, provided here and
        # nowhere else in the TS lane. Same step full-verify runs, for the same reason: the
        # Q# lane executes through src/Core.Python/.venv/bin/python3 — a gitignored venv, not
        # a PATH tool. Without it that lane cannot run, and until the per-route floor landed
        # it went dark SILENTLY: six of seven lanes satisfied an aggregate `>= 6` floor on the
        # seventh's behalf, so the job reported a 7-language byte-lock it never checked. The
        # floor now names a dark lane and fails. uv comes from install.sh above.
        run: uv sync --project src/Core.Python

      - name: Install npm devDependencies
        run: bun install --frozen-lockfile

      - name: Tier manifest (which dependency each file below needs)
        run: bun src/Core.TypeScript/hygiene/environment-dependent-test-files.ts

      - name: Environment-dependent tests
        # Every path here is an entry in registry/environment-dependent-test-files.json, and
        # the checker above fails if a registry entry is not reached by an invocation in a
        # pull_request lane — i.e. if someone excludes a file from the hermetic tier and
        # forgets to add it here.
        run: |
          bun test \
            tests/cross-verification/_harness/cross-verify-ir.test.ts \
            src/Core.TypeScript/zflash/esp-inject.test.ts

  # ═══════════════════════════════════════════════════════════════════
  # Full Verification Gate — 7-language oracle + cost + proofs
  # ═══════════════════════════════════════════════════════════════════
  #
  # Runs the LIVE cross-language execution oracle (generates code in 7
  # languages, compiles each, executes, byte-compares outputs) plus the
  # algebraic law gate, cost analysis, and Rust/Go compilation.
  # Requires the FULL toolchain (all 7 runtimes + E-prover).
  # Fails if ANY tool is missing — no partial verification.
  full-verify:
    name: full-verify (7-lang oracle + cost + proofs)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: [path-filter]
    if: needs.path-filter.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + cargo + dotnet)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
            ~/.rustup/toolchains/1.87.0-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
            ~/.cache/zeta/from-autotools-tarball/*.tgz
          key: full-verify-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain (all 7 languages + E-prover)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if ./tools/setup/install.sh; then exit 0; fi
            [ "$attempt" = "5" ] && { echo "install.sh failed after 5 attempts"; exit 1; }
            backoff=$((attempt * 30))
            echo "install.sh attempt $attempt failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
          done

      - name: QDK venv setup (uv sync)
        run: uv sync --project src/Core.Python

      - name: Python tests (Core.Python — incl. T-1/12 + Brownian-experts lemma gate)
        run: uv run --project src/Core.Python pytest src/Core.Python/tests -q
        timeout-minutes: 5

      - name: Smoke check (all 7 toolchains functional)
        run: CI=true ./tools/setup/common/smoke-7-toolchains.sh

      - name: Install npm devDependencies
        run: bun install --frozen-lockfile

      - name: Rust tests (Core.Rust.Observe)
        run: cargo test --manifest-path src/Core.Rust.Observe/Cargo.toml

      - name: Go tests (Core.Go/algebra)
        run: go test ./algebra/
        working-directory: src/Core.Go

      - name: Cross-verify IR (7-language byte-lock oracle)
        run: bun test tests/cross-verification/_harness/cross-verify-ir.test.ts
        timeout-minutes: 5

      # The COMPLEMENT of the step above, not a duplicate of it. That one proves the
      # generated lanes agree WITH EACH OTHER, which a wrong IR satisfies just as well
      # as a right one — N lanes generated from one spec agreeing is one observation
      # counted N times. This one diffs the generated code against the HAND-WRITTEN
      # ports, which are the independent oracle, and so is the only thing here that can
      # falsify IR *adequacy*. It also fails by name on any IR-carrying primitive that
      # has no hand-written port at all.
      - name: IR-generated vs hand-written (independent-oracle check)
        run: bun test tests/cross-verification/_harness/ir-vs-handwritten.test.ts
        timeout-minutes: 5

      - name: Interface law oracle (per-directory)
        run: bun test tests/cross-verification/zeta-ir-v2/interfaces/cross-verify-interfaces.test.ts
        timeout-minutes: 5

      - name: Law proof gate (proof references exist + tests pass)
        run: bun test tests/cross-verification/_harness/law-proof-gate.test.ts
        timeout-minutes: 3

      - name: Cost tests (counter + envelope + growth)
        run: |
          bun test src/Core.TypeScript/algebra/cost-counter.test.ts
          bun test src/Core.TypeScript/algebra/cost-envelope.test.ts
          bun test src/Core.TypeScript/algebra/cost-growth-property.test.ts

      - name: Clifford cross-verify (Cl(3,0) geometric algebra)
        run: bun test tests/cross-verification/_harness/codegen-clifford.test.ts

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            PRIORITY="normal"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              PRIORITY="elevated-unattended"
            fi
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{
                \"text\": \"🚨 full-verify FAILED ($PRIORITY)\",
                \"blocks\": [{
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Job:* ${{ github.job }}\\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\\n*Trigger:* ${{ github.event_name }}\\n*Priority:* $PRIORITY\"
                  }
                }]
              }"
          fi

  # ═══════════════════════════════════════════════════════════════════
  # Merge Gate Roll-up — the ONE required status check for branch protection
  # ═══════════════════════════════════════════════════════════════════
  #
  # Branch protection requires a SINGLE status check name that always reports
  # (never skipped). This job collects the results of all blocking jobs and
  # reports pass/fail. Conditional jobs (full-verify, build-and-test) may be
  # skipped on docs-only PRs — that's fine (skipped = success here). But if
  # they RAN and FAILED, this job fails too, blocking merge.
  #
  # To enable: Repository Settings → Branches → main → Require status checks
  # → add "gate (required)" as the sole required check.
  gate-required:
    name: gate (required)
    runs-on: ubuntu-24.04
    # Was 1 minute, when this job was three seconds of `grep` over `toJSON(needs)`.
    # The scope summary below adds a sparse checkout, setup-bun, and one Actions-API
    # call. MEASURED on the first live run of this job's new shape (run 32207501412
    # attempt 2, job 95940135217): 12 s total -- checkout 2 s, setup-bun 2 s, summary
    # 3 s, verdict 0 s. The pre-land ESTIMATE in the landing PR was ~20 s, priced off
    # the ~11 s full checkouts the other jobs in this workflow take; the sparse +
    # `filter: blob:none` checkout is what closed the gap, and the number is corrected
    # here rather than left as the guess. So the whole cost of making this check say
    # what it covered is ~9 s per run.
    # 5 is a RUNAWAY CAP, not a budget: nothing in this job retries, polls, or waits
    # on anything that can hang open.
    timeout-minutes: 5
    if: always()
    # Job-scoped least privilege. The workflow default is `contents: read` and no
    # other job elevates; this one adds exactly one read scope for one call:
    #   contents: read -- sparse checkout of the summary script + this file
    #   actions:  read -- GET /actions/runs/<THIS run>/jobs, the only source of
    #                     PER-MATRIX-LEG results. The `needs` context collapses a
    #                     whole matrix to one value, which is precisely what kept the
    #                     Windows legs invisible. No write scope, no other repo, no
    #                     other run.
    permissions:
      contents: read
      actions: read
    # Machine-readable scope, so "which green was this" is answerable without
    # scraping a log. Empty when the summary step could not run -- see the
    # `continue-on-error` note on it.
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      floor-executed: ${{ steps.scope.outputs.floor-executed }}
      floor-skipped: ${{ steps.scope.outputs.floor-skipped }}
      nonblocking-failures: ${{ steps.scope.outputs.nonblocking-failures }}
    # ── THE FLIP (drift-and-heal ADR, Aaron 2026-08-01): blocking gates are
    # corporate mode; drift checks are sovereign mode. The gate now rolls up
    # ONLY the uncompensatable floor (registry/uncompensatable-floor.yaml):
    #   - build-and-test        (functional build/test breaks)
    #   - cross-verify/full-verify (treaty byte-lock golden vectors)
    #   - lint [semgrep]        (workflow supply-chain / script-injection)
    # Every hygiene/style lint below STILL RUNS on every PR and every main
    # push — that is the drift detection — it just no longer blocks unrelated
    # lanes (the 2026-07-08 priority inversion / 2026-08-01 six-rebuild race).
    # In-scope authors get their signal from the job's own red X and from
    # hygiene/scoped-lint.ts locally; heals converge via certified healers
    # (hygiene/healer-harness.ts). Re-adding a job to this list = adding to
    # the floor = treaty-amendment consent path.
    #
    # ── AMENDMENT 2026-08-17 (Aaron, explicit: "yes add lint (TS) to the
    # required floor"). `lint-typescript` re-enters the floor. The consent path
    # named above is why this comment exists rather than a silent list edit.
    #
    # ── AMENDMENT 2026-08-19 (Aaron, explicit: "we are moving away from anything
    # that blocks into drift checks instead"). SUBTRACTION this time, via the same
    # consent path: the `build-and-test` entry below stays in the floor but its
    # PLATFORM coverage narrows to Linux. The macOS leg joins the Windows legs under
    # `continue-on-error`, so a macos-26 build or test failure now reaches this
    # rollup as success. The needs: list is unchanged — what changed is inside the
    # matrix, which is exactly why the `Emit scope` step below exists: it names any
    # leg that failed non-blockingly, so a green here still says which green it is.
    # registry/uncompensatable-floor.yaml records the narrowed coverage in data.
    #
    # The evidence is this job's own header, twenty lines up from its `name:`:
    # it was created because "Slice 9 (PR #882) shipped a real TS2322 to main",
    # and it says "codified rules (tsconfig strict mode) without a gate aren't a
    # control." It was then taken off the blocking list by the drift-and-heal
    # flip — and on 2026-08-17 the identical class recurred, same error code:
    # TS2322 in `installer/usb-iserial-probe.ts` plus six TS2300s in
    # `zflash/test-harness/run.test.ts`, live on main, while `gate (required)`
    # reported SUCCESS (measured on PR #11268, merged 02:05:47Z with
    # `lint (TS)` FAILURE alongside a green gate).
    #
    # HONEST SCOPE — this does NOT close the case that produced it. Both PRs
    # behind the 2026-08-17 breakage were individually green; the duplicate
    # import existed only in the MERGED tree. A pre-merge floor checks each
    # branch against main-as-it-was, so a two-PR semantic collision is out of
    # its reach by construction. What this DOES close is the single-PR case: a
    # branch carrying its own type error can no longer merge past a red
    # `lint (TS)`. The collision class needs a merge queue, not a bigger floor,
    # and is deliberately left open here rather than papered over.
    #
    # Register note: the registry derives the floor as the ERASURE class, and a
    # type error is not erasure — it is fully reconstructible. This entry is
    # admitted on the adjacent `scoped-build-test-break` rationale (a break
    # downstream lanes consume this tick), not on erasure. Stated so the
    # registry's derivation stays honest rather than being quietly widened.
    #
    # ── WHICH GREEN IS THIS? (2026-08-19) ─────────────────────────────────────────
    # Treating `skipped` as success is correct -- the path filter legitimately skips
    # `full-verify` and the .NET build/test steps on a docs-only PR. But it made this
    # check's SUCCESS TWO-VALUED while publishing neither value: a green here is
    # either the full seven-language byte-lock or a materially smaller run, and to
    # anything reading check status -- including armed auto-merge, which is how most
    # things land here -- WALL-CLOCK DURATION WAS THE ONLY THING TELLING THEM APART.
    # That is the vacuity class at the rollup level: a check that did not run looks
    # exactly like a check that passed.
    #
    # The `Emit scope` step below therefore publishes WHICH floor jobs executed, which
    # were skipped, which steps were skipped inside the ones that ran, and which legs
    # failed non-blockingly -- to the step summary, to a warning/notice annotation, and
    # to this job's outputs. Skipping stays legitimate and nothing new blocks; the
    # green now carries its own scope.
    needs:
      - build-and-test
      - lint
      - lint-typescript
      - cross-verify
      - full-verify
    steps:
      # Sparse: two paths, no blobs, one commit. The full checkout other jobs take
      # measures ~11 s here; this one has no reason to pay for 36k files.
      - name: Checkout (summary script + this workflow only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src/Core.TypeScript/ci/gate-scope-summary.ts
            .github/workflows/gate.yml
          sparse-checkout-cone-mode: false

      # Bun only -- the summary script imports nothing but node built-ins, so this job
      # never runs install.sh (~2-4 min) for a ~1 s render.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Emit scope -- which floor jobs actually ran
        id: scope
        # OBSERVABILITY ONLY, AND DELIBERATELY NON-FATAL. The verdict is the next step
        # and its logic is untouched; this one must never be able to turn a green gate
        # red (or a red one green) because a summary failed to render or the API
        # hiccuped. A failure here shows as a visible red step inside a job whose
        # conclusion is still decided below.
        continue-on-error: true
        env:
          # The AUTHORITATIVE floor list: this is literally the `needs:` block above,
          # keyed by job id, with each result. Adding or removing a floor job updates
          # the summary with no edit to the script -- there is no second copy to drift.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[]' \
            | bun src/Core.TypeScript/ci/gate-scope-summary.ts

      - name: Check all gate jobs
        env:
          # Same value as above; printed by NAME here so the per-job verdict survives
          # even if the summary step could not run. `needs.*.result` (used below,
          # unchanged) is an unlabelled array -- it is what makes the verdict correct
          # and what made it unreadable.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # A job result is one of: success, failure, cancelled, skipped.
          # Skipped is acceptable (path-filter gated); failure/cancelled are not.
          echo "Floor job results (by name):"
          echo "${NEEDS_JSON}" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"' \
            || echo "${NEEDS_JSON}"
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::One or more gate jobs failed or were cancelled."
            exit 1
          fi
          echo "All gate jobs passed or were skipped (docs-only). ✓"
          echo "Scope of this green: see the \"gate (required)\" step summary --"
          echo "a skipped floor job means this green covers less than a full-scope green."
