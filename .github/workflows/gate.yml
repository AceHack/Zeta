# Zeta CI gate — Phase 1 per docs/research/ci-gate-inventory.md.
#
# Runs on every PR (opened / reopened / synchronize / ready_for_review)
# and every push to main, plus workflow_dispatch for manual triage.
#
# Discipline (design doc: docs/research/ci-workflow-design.md, human
# maintainer reviewed 2026-04-18; parity-swap landed round 32; matrix
# refresh 2026-04-24 per PR #375):
#   - Runners pinned to explicit versions (not -latest). Active build-
#     and-test matrix: macos-26, ubuntu-24.04, ubuntu-24.04-arm.
#     The ubuntu-slim low-memory verification leg moved to
#     `.github/workflows/low-memory.yml` per maintainer 2026-04-27
#     — too slow for per-PR gating; runs on every push to main +
#     nightly schedule (in practice every merge, since direct
#     pushes are blocked by branch protection).
#     Lint jobs pinned to ubuntu-24.04 (short-lived, OS-independent
#     work; bumped from 22.04 on 2026-04-28 per the human
#     maintainer's input + version-currency discipline —
#     ubuntu-latest = 24.04 since Jan 2025).
#     Windows AND macOS legs are non-blocking DRIFT CHECKS
#     (Aaron 2026-08-19 — quoted in full at the
#     `continue-on-error:` flag on `build-and-test`). They are not
#     "deferred", which is what this line said until 2026-08-19.
#     Cadence differs and that is deliberate: Windows runs
#     push-to-main only, macOS runs on EVERY PR — a drift check is
#     only worth its minutes where someone reads it, and the PR
#     checks list is the surface humans actually open. Measured
#     reason, not preference: of the last 500 completed gate push
#     runs only 82 (16.4%) executed their matrix at all — the rest
#     were cancelled by the concurrency group before any leg ran
#     (data/platform-drift.json, 2026-08-19). Push-only cadence
#     would have cut macOS observation by ~84%.
#   - Third-party actions SHA-pinned by full 40-char commit SHA;
#     trailing `# vX.Y.Z` comments for humans.
#   - permissions: contents: read at the workflow level; no job
#     elevates. The only secret referenced is the auto-generated
#     per-run secrets.GITHUB_TOKEN (see workflow-level env: block
#     below). setup/common/mise.sh intentionally masks this repo-
#     scoped token from mise/aqua cross-repo release lookups unless
#     a dedicated MISE_GITHUB_TOKEN or GITHUB_API_TOKEN is supplied.
#     The token inherits the read-only permissions; no write
#     escalation. Workflow-level scope chosen over per-step for DRY;
#     trade-off documented at the env: block.
#   - Concurrency: workflow-scoped; cancel-in-progress only for PR
#     events (main pushes queue so every main commit gets a record).
#   - fail-fast: false so one OS failure doesn't hide another.
#   - NuGet cache keyed on Directory.Packages.props hash; runner.os
#     prefixed so macOS + Linux caches don't collide.
#   - Rust toolchain cache (`install-v2-*` / `full-verify-v2-*`, added
#     2026-08-16). mise's rust backend wraps rustup, and its install dir
#     `~/.local/share/mise/installs/rust/1.87.0` is a SYMLINK to
#     `~/.cargo/bin` holding 0 bytes — the real toolchain (656 MB) lives
#     in `~/.rustup/toolchains/`, which was in NO cache path anywhere.
#     So a full `install-*` cache HIT still re-fetched
#     https://static.rust-lang.org/dist/channel-rust-1.87.0.toml on every
#     job (~50 s each) and took three PRs down on 2026-08-16 (#10903,
#     #10930, #10963) — each reported under the name of a lint that never
#     executed. Cached paths are `~/.rustup/toolchains/1.87.0-*`,
#     `settings.toml`, `update-hashes`, `~/.cargo`.
#     ONLY the pinned toolchain: the ubuntu-24.04 image already ships
#     `~/.rustup/toolchains/stable-*` (624 MB) that RUSTUP_TOOLCHAIN never
#     selects. Measured on the runner — whole-dir 1681 MB vs pinned-only
#     1486 MB against a 1270 MB baseline, i.e. +216 MB instead of +411 MB.
#     `1.87.0` here must stay in sync with `rust` in `.mise.toml`; a stale
#     glob degrades to the pre-2026-08-16 behaviour (CDN fetch), never to a
#     wrong toolchain. `!`-exclusion was tried and measured as INERT —
#     `path: ~/.rustup/toolchains` + `!~/.rustup/toolchains/stable-*`
#     stored the full 1681 MB, so the explicit glob is load-bearing.
#   - Three-way parity per GOVERNANCE §24: dev laptop, CI runner,
#     and (future) devcontainer all bootstrap via the same
#     `tools/setup/install.sh`. This makes TLC + Alloy jars, Lean/
#     elan, mise-pinned dotnet + python, and dotnet-tools available
#     on CI without a separate YAML-maintained list — the manifests
#     under `tools/setup/manifests/` are the single source of truth.
#   - `mise trust` policy: `.mise.toml` trust is ceremony that
#     becomes meaningful once branch-protection-on-main is live
#     (reviewer gate before any change lands). Until that flips,
#     `.mise.toml` changes get `threat-model-critic` reviewer-floor
#     cover per GOVERNANCE §20. See docs/security/V1-SECURITY-GOALS.md.

name: gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Workflow-level env: exposes GITHUB_TOKEN to steps that need the
# current repository token. It is not a valid general-purpose token
# for mise/aqua release lookups against other repositories: GitHub
# returns 404 for some public release-tag endpoints when queried with
# the repo-scoped Actions token. setup/common/mise.sh therefore masks
# GITHUB_TOKEN during `mise install` unless a dedicated
# MISE_GITHUB_TOKEN or GITHUB_API_TOKEN is provided. See
# https://mise.jdx.dev/dev-tools/github-tokens.html for mise's token
# priority order.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Dynamic matrix for build-and-test: pre-merge events (pull_request
  # and merge_group) get Linux-only (production build path, fast —
  # keeps PR checks and merge-queue runs short). Push-to-main /
  # workflow_dispatch get the full set including macos-26
  # (developer-experience verification) and the Windows experimental
  # legs. Standard GitHub-hosted runners are free for public repos so
  # the post-merge run has no cost downside.
  matrix-setup:
    name: matrix setup
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      os: ${{ steps.set.outputs.os }}
    steps:
      - id: set
        shell: bash
        run: |
          # Pre-merge (pull_request + merge_group): Linux + macos-26
          # (~5 min wall clock with macos in parallel). macos-26 runs on
          # every PR — moved back to per-PR cadence 2026-04-28 after
          # maintainer correction ("we pull out mac and codeql to merge
          # to main time instead of per pr, and then moved it back to
          # per pr"). The earlier per-merge-only split structurally
          # blocked the PR queue.
          #   CORRECTION 2026-08-19: this comment used to say macos-26 is
          #   "required by branch protection's required-status-checks".
          #   It is not, and has not been since the drift-and-heal flip:
          #   the `CI Gate` ruleset requires exactly ONE context,
          #   `gate (required)`. macos-26 blocked only transitively, by
          #   being a leg of `build-and-test` with no continue-on-error.
          #   As of 2026-08-19 it no longer blocks at all — the flag now
          #   covers it. The mechanism is still what anyone changing this
          #   has to reason about.
          # macos-26 STAYS on every PR even though it no longer blocks,
          # and the reason is coverage rather than habit. The two
          # post-merge surfaces that read drift legs
          # (drift-sweep.yml's BD001 detector and
          # platform-drift-report.ts) both query
          # `branch=main&event=push`, and 418 of the last 500 such runs
          # were CANCELLED by the concurrency group before a single leg
          # executed — 16.4% coverage (data/platform-drift.json,
          # 2026-08-19). The PR run is the one that reliably executes and
          # the one a human already has open. Moving macOS to push-only
          # would have been cheaper and would have made the check mostly
          # unobserved, which is the vacuity class.
          # Push-to-main / workflow_dispatch: full surface adds the two
          # Windows legs. Those are DRIFT CHECKS — non-blocking
          # permanently and by intent (Aaron 2026-08-19), not
          # experimental legs waiting to be promoted. The full statement,
          # quoted, is at the `continue-on-error:` flag on
          # `build-and-test`; read it before changing either this matrix
          # or that flag.
          if [ "${GH_EVENT}" = "pull_request" ] || [ "${GH_EVENT}" = "merge_group" ]; then
            echo 'os=["ubuntu-24.04","ubuntu-24.04-arm","macos-26"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-24.04","ubuntu-24.04-arm","macos-26","windows-2025","windows-11-arm"]' >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_EVENT: ${{ github.event_name }}

  # F# / .NET path filter for build-and-test step-gating (081KQGDBJ0008QG0R001MK4YPC).
  #
  # PR docs-only PRs (touching only docs/**, memory/**, openspec/**,
  # *.md at root, etc.) do NOT need to run F# install + dotnet build
  # + dotnet test — those steps take 5-10 minutes per OS-leg and
  # produce no signal on doc-only changes. This job emits a single
  # boolean `code` indicating whether code-substrate paths were
  # touched; build-and-test gates its expensive steps on it.
  #
  # Required-status-check compatibility: build-and-test STILL RUNS
  # on docs-only PRs (so the required check name is reported as
  # passing); only the heavy steps inside it are skipped. This avoids
  # tripping `code_quality severity:all` which reads skipped jobs as
  # failure rather than success.
  #
  # Default safety: any non-PR event (push to main, merge_group,
  # workflow_dispatch — no `schedule:` trigger is currently configured)
  # gets `code=true` via the fast-path step (no checkout needed).
  # Path-filter is a per-PR optimization, never a path that hides
  # a code change from main-tip CI.
  #
  # Job output composition (per Copilot review on PR #1185, 2026-05-02):
  # - Non-PR events: fast-path step `nonpr` writes `code=true` without
  #   any checkout — saves the full-history fetch on every push to main
  #   and every merge_group run.
  # - Pull-request events: checkout + git diff base..head + classify
  #   per the path-list below; `detect` step writes `code=true|false`.
  # - Job output `code` resolves via `||` to whichever step ran
  #   (GH Actions falsy-string fallback).
  path-filter:
    name: path filter
    runs-on: ubuntu-24.04
    # 5 min covers the full-history checkout (`fetch-depth: 0`) on
    # slow runners. The non-PR fast path runs in ~5 sec without any
    # checkout, well under the cap.
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code || steps.nonpr.outputs.code }}
    steps:
      # Fast-path for non-PR events: emit code=true without cloning
      # the repo. Push-to-main / merge_group / workflow_dispatch all
      # take this path — preserves the per-PR-optimization invariant
      # (path-filter is never the mechanism that hides a code change
      # from main-tip CI).
      - id: nonpr
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_EVENT: ${{ github.event_name }}
        run: |
          echo "Event ${GH_EVENT} (not pull_request) — emitting code=true (full build), no checkout needed."
          echo "code=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need both PR base and head shas for git diff. fetch-depth: 0
          # gets full history; the 5-minute job timeout above is sized
          # for this on slow runners.
          fetch-depth: 0

      - id: detect
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Diff base..head of the PR to enumerate changed files.
          CHANGED=$(git diff --name-only "${PR_BASE_SHA}" "${PR_HEAD_SHA}")
          echo "Changed files in PR:"
          # Two-space indent each line via parameter expansion (pure
          # bash; SC2001-clean — no `sed s/^/  /` shell-out).
          INDENTED=${CHANGED//$'\n'/$'\n'  }
          echo "  ${INDENTED}"

          # Pure-docs surfaces never trigger the F# build/test path:
          #   docs/**       — repo documentation (incl. backlog/, hygiene-history/, research/)
          #   memory/**     — in-repo memory files
          #   openspec/**   — behavioral specs (no F# touch)
          #   *.md at root  — README, AGENTS, GOVERNANCE, CLAUDE.md, etc.
          #   .claude/**    — skill / agent / rule definitions (text only)
          #   .github/ISSUE_TEMPLATE, .github/PULL_REQUEST_TEMPLATE — text only
          #   .gitignore / .gitattributes — text only
          #   *.txt / LICENSE — text only
          #   data/**       — generated telemetry served by Pages (tick shards + rollups,
          #                   drift / vault ledgers). NOT a build input: no .fs / .fsproj /
          #                   .cs / test file in the repo reads anything under data/
          #                   (verified 2026-08-13). Added when the telemetry lanes moved
          #                   off direct pushes to main onto flush PRs — every frame now
          #                   arrives as a PR, and running the full F# matrix on a JSON
          #                   frame that cannot affect it would saturate the queue for no
          #                   signal.
          #   demo/red/red-state.json — same: a regenerated dashboard snapshot.
          #
          # This narrows what the heavy STEPS run on; it does not narrow the gate. The
          # `gate (required)` check still runs and still reports on these PRs, and every
          # lint (semgrep included) is untouched. A diff touching code alongside data still
          # flips code=true — the allowlist is per-file, not per-PR.
          #
          # Anything else (incl. src/**, tests/**, tools/**, *.fs, *.fsproj,
          # *.csproj, .github/workflows/**, global.json, Directory.Packages.props,
          # Zeta.sln, .config/dotnet-tools.json) flips code=true.
          HAS_CODE="false"
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            case "${f}" in
              docs/*|memory/*|openspec/*|.claude/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md|.github/copilot-instructions.md)
                ;;
              data/*|demo/red/red-state.json)
                ;;
              .gitignore|.gitattributes|LICENSE|*.txt)
                ;;
              *.md)
                # Root-level markdown (README, AGENTS, GOVERNANCE,
                # CLAUDE.md, etc.) — non-build surface.
                case "${f}" in
                  */*) HAS_CODE="true" ;;  # under a subdir we don't recognize as docs-only
                  *) ;;                     # at repo root → docs surface
                esac
                ;;
              *)
                HAS_CODE="true"
                ;;
            esac
          done <<< "${CHANGED}"

          if [ "${HAS_CODE}" = "true" ]; then
            echo "Code-substrate path touched — emitting code=true (full build)."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only PR — emitting code=false (skip F# install/build/test)."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    # Final runner matrix (maintainer ask 2026-04-24): symmetric
    # across AceHack fork and LFG canonical — same legs run everywhere.
    # Standard GitHub-hosted runners are free for public repositories,
    # so the prior fork/LFG cost-opt split (which kept macOS off LFG)
    # no longer applies.
    #
    # BLOCKING legs (2) — the only platforms a red leg still stops:
    #   - ubuntu-24.04      Ubuntu 24.04 LTS x64 (4 CPU, 16 GB)
    #   - ubuntu-24.04-arm  Ubuntu 24.04 LTS arm64 (4 CPU, 16 GB)
    #
    # DRIFT-CHECK legs (3) — run, report, block nothing:
    #   - macos-26          macOS 26, Apple Silicon M1 (3 CPU, 7 GB)
    #                       every PR + every push to main
    #   - windows-2025      Windows Server 2025 x64 (4 CPU, 16 GB)
    #   - windows-11-arm    Windows 11 arm64 (4 CPU, 16 GB)
    #                       push to main / workflow_dispatch only
    #
    # Moved-to-nightly leg (per maintainer 2026-04-27):
    #   - ubuntu-slim       Ubuntu slim x64 (1 vCPU, 5 GB RAM;
    #                       15-minute HARD job cap). Too slow for
    #                       per-PR gating (~10+ min vs ~1.5 min on
    #                       ubuntu-24.04 — ~7× slower, often times
    #                       out at the runner-class cap). Goal of
    #                       the slim leg is verifying low-memory
    #                       compat — a per-merge + nightly cadence
    #                       satisfies that without bottlenecking PR
    #                       landing. Now runs via
    #                       `.github/workflows/low-memory.yml`
    #                       (push-to-main + 06:00 UTC schedule +
    #                       workflow_dispatch).
    #                       Reference:
    # https://github.blog/changelog/2026-01-22-1-vcpu-linux-runner-now-generally-available-in-github-actions/
    #
    # The Windows legs (added 2026-04-27 as "experimental"; reclassified
    # 2026-08-19 by the maintainer — see the note at `continue-on-error:`
    # below) run only on push-to-main / `workflow_dispatch`, NOT on
    # `pull_request` (and NOT on a schedule — this workflow has no
    # `schedule:` trigger, which several comments here claimed until
    # 2026-08-19). They carry `continue-on-error: true`
    # permanently and by intent: they are drift checks, deliberately
    # observed and deliberately non-blocking. "Experimental / while the
    # installer matures" was the old reading and is no longer the
    # reason — do not read the flag as a temporary accommodation.
    # macos-26 joined them 2026-08-19 (same flag, per-PR cadence kept).
    #
    # fail-fast: false so one leg's failure doesn't cancel the
    # others — we want the full signal across the matrix.
    #
    # Per-PR / per-merge cadence split:
    # - macos-26: developer-experience verification, NOT prod build.
    #   Runs on EVERY PR and every push-to-main. (The 2026-04-27
    #   per-merge-only split was reverted 2026-04-28 by maintainer
    #   correction — "we pull out mac and codeql to merge to main time
    #   instead of per pr, and then moved it back to per pr". This
    #   comment said "push-to-main + schedule + workflow_dispatch"
    #   until 2026-08-19; it had been wrong for nearly four months.)
    # - ubuntu-24.04 + ubuntu-24.04-arm: production build path; runs
    #   on every PR + push-to-main.
    # The matrix is built dynamically by `matrix-setup`: PR + merge_group
    # runs get Linux + macOS, push-to-main / workflow_dispatch get all
    # five.
    #
    # THE ASYMMETRY IS CLOSED (2026-08-19). This block used to say Windows
    # and macOS were NOT in the same state — Windows non-blocking, macOS
    # blocking transitively through `build-and-test`. It is now one state:
    # both are drift checks, both carry the flag below. The floor amendment
    # that closed it was authorized by Aaron the same day, verbatim:
    #
    #   "we are moving away from anything that blocks into drift checks
    #    instead."
    #
    # What that cost, stated rather than left to be discovered: macOS runs
    # PRE-merge, so unlike the Windows flip this one changes what can land.
    # A macOS-only break now merges. Last time that would have mattered:
    # run 32138908732 (2026-08-18), macos-26 the only failed leg and
    # `gate (required)` failure — under this file it would be a green gate
    # carrying a named non-blocking failure, and the break would be on main.
    # Measured frequency of that event: 1 failure in 82 executed push runs
    # (1.2%), clean streak 19, over 2026-08-15..2026-08-19
    # (data/platform-drift.json). For contrast the Linux leg that still
    # blocks, ubuntu-24.04, failed 2 (2.4%) over the same runs — macOS was
    # never the noisy leg, it was a quiet leg holding gate authority.
    # Work item: 081M0CPEH40087G0R0016GDSB6.
    name: build-and-test (${{ matrix.os }})
    timeout-minutes: 45
    needs: [matrix-setup, path-filter]
    # ── THIS FLAG IS A CLASSIFICATION, NOT AN ACCOMMODATION. DO NOT "FIX" IT. ───────
    #
    # Settled 2026-08-19 by the maintainer (Aaron), verbatim:
    #
    #   "windows and mac are drift checks, it's fine to check per pr if we want but we
    #    don't want to block on them. Also we are moving more and more away from PRs
    #    and more into sovereign mode without PRs."
    #
    # AMENDED 2026-08-19, same day, by Aaron directly — this is what moved macOS in:
    #
    #   "we are moving away from anything that blocks into drift checks instead."
    #
    # So: the Windows AND macOS legs are non-blocking PERMANENTLY AND BY INTENT. They
    # are drift checks — deliberately observed, deliberately not gates. This is the
    # steady state, not a tolerance being worked off, and narrowing this expression
    # would be reversing a maintainer decision, not cleaning up a leftover. If you
    # believe a platform should block, that is a floor amendment and it goes through
    # the consent path (the same one named at `gate-required`), not through an edit
    # here. The expression is pinned by a test —
    # src/Core.TypeScript/ci/gate-scope-summary.test.ts, "the drift-check platform set
    # is exactly what the maintainer classified" — so a silent narrowing fails there
    # rather than being discovered by a merge that should not have landed.
    #
    # WHAT THE FLAG ACTUALLY DOES, since it must stay legible. This job IS in the
    # `gate-required` floor, and the floor NAME NOW OVERSTATES ITS COVERAGE ON EVERY
    # PLATFORM BUT LINUX: a Windows or macOS build/test failure reaches
    # `gate (required)` as SUCCESS. What the floor still covers pre-merge is
    # ubuntu-24.04 and ubuntu-24.04-arm, and registry/uncompensatable-floor.yaml's
    # `scoped-build-test-break` entry says so in the data rather than only here.
    # MEASURED for Windows over the 152 completed `gate` runs carrying Windows legs
    # (2026-04-25..2026-08-19): windows-2025 failed 12 times (7.9%), windows-11-arm 9
    # (5.9%), 14 runs carried at least one (9.2%) — and in all 11 instances since
    # `gate-required` existed, the required check reported green beside the red leg.
    # One is committed as a fixture: run 31978270082, in
    # src/Core.TypeScript/ci/fixtures/gate-run-jobs-windows-failed.json. That fixture
    # is the empirical basis for the macOS half too: it proves the Actions API reports
    # a continue-on-error leg's conclusion as `failure` (not `skipped`, not `neutral`),
    # which is what every surface below derives from.
    #
    # THE OBLIGATION THAT COMES WITH "DON'T BLOCK" IS "THEN BE SEEN". A drift check
    # nobody reads is the vacuity class wearing a different hat. FOUR surfaces carry
    # it, and each is deliberate:
    #   0. The leg's OWN check run still concludes `failure` — a red X in the PR's
    #      checks list, next to a green `gate (required)`. Verified against the live
    #      API, not assumed: GET /commits/54492c95ec2e6e31105d698c7ef68d5884daaf38/
    #      check-runs reports `build-and-test (windows-2025)` conclusion=failure for
    #      the run above, while the same commit's `gate (required)` is success. This
    #      is the surface that makes the macOS flip safe, because macOS runs per-PR.
    #   1. `gate (required)`'s step summary + warning annotation names any leg that
    #      failed non-blockingly (src/Core.TypeScript/ci/gate-scope-summary.ts) —
    #      per-run, derived, knows no platform names. It needed no edit for macOS,
    #      which is the test that it was built generically rather than for Windows.
    #   2. `drift-sweep.yml`'s BD001 detector files a failed `build-and-test` leg on
    #      main into the drift ledger (docs/drift-events/) — but keyed to `Zeta.sln`,
    #      so WHICH leg is lost, and it reads one run, so it measures a level.
    #   3. src/Core.TypeScript/ci/platform-drift-report.ts folds the last N push runs
    #      into per-leg failure RATES, clean streaks, and — the number that turned out
    #      to matter — COVERAGE: of the 500 most recent completed push runs, 418 were
    #      `cancelled` before their legs ever ran (16.4% coverage). Published to
    #      data/platform-drift.json and rendered on data/monitor.html. It will
    #      reclassify `macos-26` from `blocking` to `non-blocking` the first time it
    #      fails beside a green rollup — that classification is OBSERVED, not read off
    #      this flag, so the ledger will disagree with this file until the evidence
    #      arrives. That is correct and deliberate; do not "fix" the ledger either.
    #
    # Surfaces 2 and 3 both query `branch=main&event=push`, i.e. 16.4% coverage. That
    # is why macOS keeps its per-PR cadence: surface 0 is the one that reliably fires.
    #
    # Decision record, with the measurements that informed it and the strategic context
    # (the move toward sovereign mode without PRs):
    # workitems/081M0BVAV2H087G0R000VXRYRQ-decide-whether-the-windows-build-and-test-legs-should-block.md
    # workitems/done/2026/08/081M0CPEH40087G0R0016GDSB6-make-the-macos-build-and-test-leg-non-blocking-floor-amendme.md
    #
    # Note if you are here to make the WINDOWS legs run per-PR: Aaron allowed it ("fine
    # to check per pr if we want") and it was PRICED and declined — ~355 PR gate runs/day
    # × ~21 runner-minutes ≈ 124 runner-hours/day for a check that by decision cannot
    # block. The reasoning is in the work item; re-open it there, not here. macOS is not
    # covered by that pricing: it was already running per-PR before this change, so
    # keeping it there costs zero additional minutes.
    continue-on-error: ${{ startsWith(matrix.os, 'windows-') || startsWith(matrix.os, 'macos-') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.matrix-setup.outputs.os) }}
    runs-on: ${{ matrix.os }}

    # Path-filter step-gating (081KQGDBJ0008QG0R001MK4YPC / 2026-05-02): when the PR
    # touches only docs/memory/openspec/etc., the heavy F# install +
    # dotnet build + dotnet test steps below are skipped. The job
    # itself still runs (status check name reports green) so
    # required-status-checks and `code_quality severity:all` see
    # success rather than "skipped". Cache + checkout steps are
    # cheap and unconditional. See `path-filter` job above for the
    # detection logic.
    steps:
      # Windows MAX_PATH (260) guard — MUST precede checkout. Zeta has memory/persona
      # files whose paths exceed 260 chars; without this, actions/checkout fails with
      # "Filename too long" before any setup runs (install.ps1 sets the same
      # core.longpaths for dev machines, but it runs POST-checkout so can't help CI).
      # Layer 1 (no admin): git prepends the extended-length prefix + bypasses MAX_PATH.
      - name: Enable git long paths (Windows; pre-checkout)
        if: startsWith(matrix.os, 'windows-')
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull_request ref is a synthetic merge commit. Its first parent
          # must be present for the PR-scoped markdown diff below.
          fetch-depth: 2

      - name: Path-filter result (081KQGDBJ0008QG0R001MK4YPC)
        shell: bash
        env:
          CODE_PATH: ${{ needs.path-filter.outputs.code }}
        run: |
          if [ "${CODE_PATH}" = "true" ]; then
            echo "Path filter: code=true — running full F# build/test."
          else
            echo "Path filter: code=false — docs-only PR, will skip F# install/build/test steps."
          fi

      # Cache keys include `runner.arch` in addition to `runner.os` so
      # Linux x64 (ubuntu-24.04, ubuntu-slim) and Linux arm64
      # (ubuntu-24.04-arm) do not share entries for arch-sensitive
      # paths. `runner.os` resolves to `Linux` on both arches, which
      # would otherwise cause wrong-arch restores (for example,
      # `~/.dotnet` with x64 binaries restored onto arm64). See
      # https://docs.github.com/en/actions/learn-github-actions/
      # contexts#runner-context for `runner.arch` values.
      - name: Cache .NET SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dotnet
          key: dotnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'tools/setup/common/dotnet.sh') }}

      - name: Cache mise runtimes (python only post round 32)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', '.mise.full.toml') }}

      - name: Cache elan (Lean 4 toolchain)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Core.TypeScript/ace/setup-realizers/from-elan.ts', 'tools/setup/manifests/from-elan') }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet
          # Keys on `Directory.Packages.props`. The `packages.lock.json`
          # ideal is round-33 Track B. No `restore-keys` — partial hit
          # would restore against different resolved versions.
          # `runner.arch` is included because some NuGet packages ship
          # native RID-specific assets (for example, runtime.linux-
          # x64.*).
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props') }}

      - name: Install toolchain via three-way-parity script (Unix; GOVERNANCE §24)
        # Single source of truth for Unix toolchain state. Installs:
        # .NET SDK (per global.json, via Microsoft's dotnet-install.sh
        # — round-32 refactor out of mise), python (mise-pinned),
        # elan (Lean manager), dotnet global tools, TLC + Alloy
        # verifier jars. shellenv.sh emits BASH_ENV into $GITHUB_ENV
        # so every subsequent bash `run:` step auto-sources the
        # managed shellenv file (SQLSharp-proven pattern).
        if: needs.path-filter.outputs.code == 'true' && startsWith(matrix.os, 'windows-') == false
        run: ./tools/setup/install.sh

      - name: Install toolchain via three-way-parity script (Windows; GOVERNANCE §24)
        # PowerShell does not execute the Git Bash dispatcher reliably when a workflow `run:` step
        # names install.sh directly. Call the native entrypoint so it can publish mise runtime bins
        # to GITHUB_PATH for the later bun/dotnet steps. CI must not register a desktop loop task.
        if: needs.path-filter.outputs.code == 'true' && startsWith(matrix.os, 'windows-')
        shell: pwsh
        run: ./tools/setup/install.ps1 -SkipLoopRegister

      - name: Guard — CodeAnalysis pins ≤ SDK Roslyn (CS9057, #9774 regression)
        # Fast pre-build backstop: a Microsoft.CodeAnalysis.* pin newer than the SDK's own
        # Roslyn makes generators unloadable (CS9057) — which reached main via #9774. Reads the
        # SDK's ACTUAL csc version (no heuristic), so it self-updates when the SDK is bumped.
        if: needs.path-filter.outputs.code == 'true'
        run: bun src/Core.TypeScript/hygiene/audit-codeanalysis-sdk-match.ts

      - name: Build (0 Warning(s) / 0 Error(s) required)
        # BASH_ENV (set by shellenv.sh during the install step) has
        # already pointed this shell at the managed shellenv file;
        # no explicit source needed.
        if: needs.path-filter.outputs.code == 'true'
        run: dotnet build Zeta.sln -c Release

      - name: Test
        if: needs.path-filter.outputs.code == 'true'
        # --blame-crash / --blame-hang-timeout: when the test host crashes or
        # hangs (the silent "MSB4181: VSTestTask returned false but did not log
        # an error" class — seen once on windows-11-arm), collect a crash dump
        # and a Sequence_*.xml naming the in-flight test, instead of a mystery.
        run: dotnet test Zeta.sln -c Release --no-build --verbosity normal --blame-crash --blame-hang-timeout 15m

      - name: Name the crashed/hung test (on failure)
        # Surface the blame Sequence_*.xml into the CI log so a host crash/hang
        # is diagnosable without artifact plumbing — turns "VSTestTask returned
        # false" into "test X was running when the host died". Cross-platform (bun).
        if: failure() && needs.path-filter.outputs.code == 'true'
        run: bun src/Core.TypeScript/ci/print-blame-sequences.ts

      - name: Skipped (docs-only PR)
        # Status-check passthrough: when the path filter said code=false,
        # the job still completes successfully so required-status-checks
        # see green. This step is the visible signal that the F# build
        # was skipped intentionally.
        if: needs.path-filter.outputs.code != 'true'
        run: echo "build-and-test skipped on docs-only PR (081KQGDBJ0008QG0R001MK4YPC path-filter)."

  lint:
    # FLOOR-ONLY semgrep (ratification reconciliation, Vera's signature
    # note 2026-08-08): this BLOCKING job scans `.semgrep-floor.yml` —
    # exactly the rules registry/uncompensatable-floor.yaml names for the
    # `workflow-supply-chain` entry (mutable action tags, untrusted event
    # data in run: lines). The registry is the literal source of truth for
    # what blocks; the other 15 rules run as non-blocking drift in
    # `lint (semgrep drift)` below (drift-and-heal ADR items 2+5, Accepted
    # 2026-08-08). Adding a rule HERE = adding to the floor = the
    # treaty-amendment consent path.
    #
    # Round 30 posture fix history: before this job existed, 14 rules were
    # codified but 0 gated the build. See docs/security/
    # THREAT-MODEL.md "mitigation validation" section + round-30
    # elevation design (docs/research/threat-model-elevation.md).
    name: lint (semgrep)
    # Repo-wide generic-mode Semgrep has grown past the old 10-minute
    # cap on cold runners (2026-06-12: CI canceled semgrep-core before
    # any findings were emitted). Keep the full ruleset and give the
    # scan enough wall clock instead of weakening coverage.
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    # Toolchain via three-way-parity install.sh (GOVERNANCE §24): same
    # semgrep version that dev laptops + devcontainers get, pinned in
    # `.mise.toml` as `pipx:semgrep`. No `actions/setup-python` here
    # — the host-portability invariant is to minimise GitHub-specific
    # surface so switching CI hosts is cheap, and to keep dev-machine
    # and build-machine setup as close as possible. Resolves Scorecard
    # PinnedDependenciesID #17 + #18 (pip install --upgrade pip + pip
    # install semgrep) by removing the unpinned pip-bootstrap surface
    # entirely.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
            ~/.rustup/toolchains/1.87.0-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
            ~/.cache/zeta/from-autotools-tarball/*.tgz
          key: install-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        # Single source of truth for toolchain state. mise installs
        # python + semgrep (the latter via the `pipx:semgrep` pin in
        # `.mise.toml`, which mise auto-routes through `uv tool install`
        # since uv is in the toolchain — see ADR
        # docs/DECISIONS/2026-04-27-uv-canonical-python-tool-manager.md).
        # shellenv.sh wires BASH_ENV so subsequent run: steps auto-
        # source the managed shellenv. Same pattern as build-and-test
        # job above.
        run: ./tools/setup/install.sh

      - name: Run Semgrep (floor rules only — seconds-fast floor check)
        # --error exits non-zero if any floor rule matches. Under
        # nation-state posture per round-30 elevation, a supply-chain
        # rule without a gate isn't a control — and per the ratified
        # drift ADR, a non-floor rule WITH a gate is a lock. Both
        # postures are honored by the split.
        run: semgrep --config .semgrep-floor.yml --error --metrics=off

  lint-semgrep-drift:
    # The full detector set (15 non-floor rules + the 2 floor rules for
    # one-stop reporting), NON-BLOCKING: this job is deliberately NOT in
    # the gate roll-up's needs — a finding here is drift (red X = signal,
    # measured by the ledger's MTTH, healed by lane owners), never a lock
    # on unrelated lanes. Split created at ADR ratification (Vera's
    # signature note; workitem 081KZHGP45608QG0R003J0A7G5).
    name: lint (semgrep drift)
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
            ~/.rustup/toolchains/1.87.0-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
            ~/.cache/zeta/from-autotools-tarball/*.tgz
          key: install-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        run: ./tools/setup/install.sh

      - name: Run Semgrep (full detector set — findings are drift, not locks)
        run: semgrep --config .semgrep.yml --config .semgrep-floor.yml --error --metrics=off

  lint-yaml-k8s:
    # YAML + Kubernetes-manifest validation over full-ai-cluster/k8s/** — the
    # GitOps surface ArgoCD deploys. Closes the gap that let a k8s Application land
    # with ZERO CI validation (only ArgoCD checked it, slowly, at cluster-sync).
    # yamllint = syntax/indentation/dup-key; kubeconform = k8s API-schema validation.
    # Aaron 2026-06-10 ("should we have a yaml/k8s lint gate? ... lets do that").
    #
    # REQUIRED as of 2026-08-14. It shipped ADVISORY (continue-on-error) under the
    # standing easing-in pattern, with the instruction to flip once clean for a few
    # rounds. That condition is met and was measured, not assumed: clean since
    # 2026-08-01, and 8 of 8 recent gate runs carrying this job report success. An
    # advisory check that has earned its promotion and never gets it is just a check
    # that cannot fail — which is the defect class this repo spent 2026-08-14 removing
    # (nine of them, including a k8s manifest validator that accepted tab indentation,
    # unterminated quotes and duplicate keys as "valid YAML"). The full dev-machine bootstrap is deliberately NOT run
    # here: this job only needs two lint tools, and install.sh pulls heavy proof/QEMU/R
    # substrate that can consume the whole advisory timeout before YAML is checked.
    name: lint (yaml/k8s)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    # No continue-on-error: this job now blocks the gate (see the note above).

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun (for the cluster-tree consumer audit)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # 081M00QCHWA087G0R000GKKRXD — the repo carries TWO declarations of one
      # cluster, and they collide on Application/argocd/zeta-root. Consolidation
      # has been deferred twice for the same reason: nobody could show the list
      # of things still reading the stale tree was COMPLETE (a 2026-08-16 pass
      # named two code consumers; there were nine). This audit derives that list
      # with `git grep` and fails when a NEW file couples to the stale tree, or
      # when the roster over-claims by naming a file that no longer does.
      #
      # It needs no network and no toolchain beyond bun + git, and it needs no
      # `bun install` (node builtins only). MEASURED 2026-08-17, warm: 0.9 s
      # wall for a full content scan of the 15,711 tracked files outside the
      # excluded prefixes. That is why it sits in this narrow job rather than
      # earning one of its own.
      - name: Cluster-tree consumer roster (no new coupling to the stale tree)
        run: bun src/Core.TypeScript/hygiene/audit-cluster-tree-consumers.ts

      # The audit above is only worth its slot if it can go red. The suite
      # plants each failure mode in a throwaway git tree and asserts exit 1 with
      # the specific reason, plus a control case asserting exit 0 so an audit
      # that failed unconditionally could not pass. MEASURED: 2.4 s, 8 cases.
      - name: Cluster-tree consumer roster — mutation suite (proves it goes red)
        run: bun test src/Core.TypeScript/hygiene/audit-cluster-tree-consumers.test.ts

      # ADDED 2026-08-21, and it relaxes this job's stated "node builtins only"
      # design ON PURPOSE. The observability-chain audit below parses Helm
      # `valuesObject` YAML, and the honest options were (a) install the `yaml`
      # package this repo already declares, or (b) hand-roll YAML extraction
      # with regexes. (b) was refused: a regex YAML reader that silently
      # mis-parses a nested block would produce a GREEN audit over a config it
      # never understood, which is precisely the false-green class this audit
      # exists to catch. Paying ~seconds of install to avoid inventing a
      # fragile parser is the correct trade. First observed as
      # `Cannot find package 'yaml'` in run 96651130473.
      - name: Install bun dependencies (the chain audit needs `yaml`)
        run: bun install --frozen-lockfile

      # 2026-08-20 — the observability chain was broken at every link and every
      # break was values-only, so helm template, kubeconform and yamllint were
      # all green on all of them. Measured on the tree as it shipped: Alloy had
      # three sinks and zero sources, its Loki sink named a Service the chart
      # does not render, and every alert routed to a receiver named "null".
      # This audit refuses all three classes. It needs no network and no helm:
      # Service names come from a rendered roster that is freshness-keyed to the
      # target Application, so a chart bump without --refresh fails as STALE
      # rather than asserting a stale render. MEASURED: 0.4 s, bun + yaml only.
      - name: Observability chain (no sink without a source, no alert into /dev/null)
        run: bun src/Core.TypeScript/hygiene/audit-observability-chain.ts

      # Proves the audit above can go red, including against the exact pre-fix
      # content of the tree. MEASURED: 22 tests, 40 assertions, 0.5 s.
      - name: Observability chain — mutation suite (proves it goes red)
        run: bun test src/Core.TypeScript/hygiene/audit-observability-chain.test.ts

      - name: Install narrow YAML lint tools
        run: |
          set -euo pipefail
          python3 -m venv .venv-yamllint
          .venv-yamllint/bin/python -m pip install --upgrade pip
          .venv-yamllint/bin/pip install yamllint==1.38.0
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$PWD/.venv-yamllint/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: yamllint (k8s manifests)
        # relaxed profile: structural correctness (indent/dup-key/syntax), not
        # cosmetic line-length — the manifests are machine-authored Helm values.
        # ALL manifest roots, not just full-ai-cluster. Measured 2026-08-01: 24 of 129
        # manifests (19%) — every file under infra/k8s and agentic-organization/deploy —
        # were never validated by anything. They reach a cluster via ArgoCD sync, so a
        # malformed one failed at APPLY time on real hardware instead of here. That is
        # the wrong place to find it once runners live on USB-provisioned nodes.
        run: yamllint -d relaxed full-ai-cluster/k8s/ infra/k8s/ agentic-organization/deploy/

      - name: kubeconform (k8s API-schema validation)
        # -ignore-missing-schemas: skip CRs we have no schema for; -skip:
        # skip repo-owned/third-party CRD kinds whose default-schema mirror paths
        # are either absent or transiently unavailable. Retry with backoff because
        # rate-limited schema downloads count as ERRORS, not missing schemas.
        # -strict: reject unknown fields on the manifests we DO have schemas for.
        # find-pipe so it recurses explicitly (portable across kubeconform versions).
        run: |
          crd_kinds="Application,Blueprint,CiliumL2AnnouncementPolicy,CiliumLoadBalancerIPPool,ClusterIssuer,ConstraintTemplate,Deployable,Gateway,HTTPRoute,Hat,HatConflict,HatCooldown,HatMaxBindings,HatMaxNew,HatNoCycle,HatPolicy,HatQuorum,HatWarmup,HelmChart,Policy"
          kc() {
            find full-ai-cluster/k8s infra/k8s agentic-organization/deploy -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 \
              | xargs -0 kubeconform -strict -ignore-missing-schemas -summary -schema-location default -skip "$crd_kinds"
          }
          kc || { echo "[yaml/k8s] retry in 30s (schema-registry rate limit?)"; sleep 30; kc; } \
             || { echo "[yaml/k8s] retry in 90s"; sleep 90; kc; }

  lint-shell:
    # Shellcheck on every bash script under tools/setup/ + tools/.
    # Round 33 static-analysis expansion (Aaron: "as much static
    # analysis as possible, match or surpass SQLSharp + scratch").
    # See openspec/specs/static-analysis/profiles/shell.md.
    name: lint (shellcheck)
    timeout-minutes: 12
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        # Comprehensive cache of everything `tools/setup/install.sh`
        # writes — keeps dev laptops and CI runners as close to the
        # same state as possible per the human maintainer's
        # 2026-04-28 input: dev setup and build-machine setup
        # should be as close to the same as possible; cache the
        # whole install/setup output rather than per-component.
        # Without comprehensive caching every CI run hits CDNs cold
        # (mise.run + GitHub releases for bun/shellcheck/actionlint +
        # NuGet + Lean toolchain). Transient 502s become avoidable
        # failures rather than first-run-only cost.
        # Cache key hashes BOTH .mise.toml (runtime versions) AND
        # tools/setup/** (install logic itself) so changes to either
        # invalidate cache → vanilla install path gets re-tested
        # whenever the install discipline changes.
        #
        # `~/.cache/zeta/from-autotools-tarball/*.tgz` added 2026-08-17.
        # That directory is where `from-autotools-tarball.ts` parks upstream
        # source tarballs — today only E prover 3.2.0, fetched from
        # `github.com/eprover/eprover/archive/refs/tags/`. It was NOT in this
        # list, so the "comprehensive cache" claim above was false for the one
        # component fetched straight from github.com rather than a CDN: every
        # ubuntu job re-downloaded it cold. On 2026-08-17 GitHub answered 429
        # and PRs #11470, #11472 and #11475 went red on `lint (tick-shard
        # relative-paths)` with `curl fetch failed (22)` — three PRs whose
        # diffs had nothing to do with a theorem prover. curl retried thirteen
        # times over five minutes and lost, because a rate-limit window is
        # longer than any retry budget worth spending; not fetching is the only
        # fix that scales.
        #
        # Two properties make this safe to cache rather than merely faster.
        # The key already hashes `tools/setup/**`, which contains the manifest
        # holding the URL and the sha256 pin, so a version bump cannot be
        # served a stale tarball — it lands on a different key. And the
        # realizer now verifies the pin on the RESTORED file too, not only on
        # a fresh download, so a corrupt or substituted entry is discarded
        # instead of compiled into the prover that signs our FOL proofs.
        # Only `*.tgz` is cached: the sibling `<key>-build/` extraction dirs
        # are rebuilt every run and would add hundreds of MB of churn.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
            ~/.rustup/toolchains/1.87.0-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
            ~/.cache/zeta/from-autotools-tarball/*.tgz
          key: install-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        # Installs shellcheck via mise (pinned in .mise.toml). Single
        # source of truth — the same version on dev laptops + CI
        # runners. Prior step relied on shellcheck shipping pre-
        # installed on ubuntu (any version), which broke parity (dev machines
        # may have a different version) and wouldn't survive newer
        # runner images like ubuntu-slim that don't ship shellcheck.
        # Note: install.sh is idempotent (detect-first-install-else-update);
        # safe to run on every CI invocation including cache-hit (it
        # short-circuits when tools are already present).
        # CI-level retry per the human maintainer's 2026-04-28
        # input: PR #23 (on AceHack) failed because mise's
        # internal 3-attempt retry exhausted on a github releases
        # CDN 502 for bun-1.3.13. CI runs are non-interactive so
        # retry is safe; dev runs stay interactive (user decides).
        # 5 attempts; backoff 10s/30s/60s/120s covers short-burst
        # through multi-minute CDN outages. The retry wrapper is
        # currently inline-duplicated across multiple jobs;
        # extracting to a composite action is a follow-up
        # improvement candidate.
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if ./tools/setup/install.sh; then exit 0; fi
            [ "$attempt" = "5" ] && { echo "install.sh failed after 5 attempts"; exit 1; }
            # Backoff: 10s, 30s, 60s, 120s — covers transient CDN
            # blips from short-burst-and-recover up to multi-minute
            # outages. Aaron 2026-04-28 input: bumped from 3 to 5
            # because PR #23's bun-1.3.13 502 burned all 3 prior
            # mise-internal retries and a 3-attempt wrapper on top
            # didn't add enough margin.
            case "$attempt" in
              1) backoff=10 ;;
              2) backoff=30 ;;
              3) backoff=60 ;;
              4) backoff=120 ;;
            esac
            echo "install.sh attempt $attempt failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
          done

      - name: Run shellcheck
        # Scope: Zeta's own scripts under `tools/setup/` only —
        # `src/Core.Lean4/.lake/packages/**` is Lean/Mathlib vendored
        # code not governed by Zeta standards.
        # Format: -f gcc for file:line:col:msg output parseable by
        # IDEs. Severity floor: style (catches everything including
        # style warnings; we can relax to warning if noise is high).
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find tools -name "*.sh" -type f \
              -not -path "src/Core.Lean4/.lake/*" \
              | sort
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell scripts found under tools/; skipping"
            exit 0
          fi
          echo "shellcheck targets:"
          printf '  %s\n' "${files[@]}"
          shellcheck --format=gcc --severity=style "${files[@]}"

  lint-bash-retirement-inventory:
    # Bash-retirement guard for the TypeScript/Bun migration trajectory:
    # Zeta-owned post-install repo scripts should not grow new `.sh`
    # entrypoints after Bucket B reached zero. The retained shell surface is
    # setup/bootstrap, launchd-bootstrap, and the Kiro loop wrapper only.
    #
    # ALSO runs the full hygiene unit-test suite (bun test
    # src/Core.TypeScript/hygiene/). Previously NO gate job ran it — only
    # two named hygiene tests + the lint scripts ran — so an incomplete
    # change (source allowlist updated, unit-test snapshot not) merged green
    # and left a test silently red for ~10 PRs (#8216 fix; this step closes
    # the gap). bun is already provisioned here, so it adds no extra install.
    name: lint (bash retirement inventory + hygiene unit tests)
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job executes lockfile-managed JavaScript plus tracked hygiene
      # tests only. The 553 MB workstation/cluster apt manifest timed out on a
      # live heartbeat PR before this guard ran; setup-bun + bun.lock is the
      # declared minimal boundary, while full setup remains for toolchain jobs.
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install JavaScript dependencies from the locked graph
        run: bun install --frozen-lockfile

      - name: Run bash-retirement inventory guard
        run: bun run hygiene:check-bash-retirement-inventory

      - name: Ambient-credential-hoist guard
        # Refuses any tracked executable surface that puts a credential into a
        # shell environment. An env var crosses `exec` regardless of the child's
        # code identity, so this is the one exposure no signature, keychain ACL,
        # IMA appraisal or TPM seal can gate — all four bind a secret to a
        # CALLER, and an inherited variable has already escaped that question.
        # It caught two live sites when first run (shellenv.sh:111 and
        # op-token-setup.sh:83); both are removed in the same change.
        # Exits 2 if it scans fewer files than its floor, so a scope regression
        # cannot report success the way `lint:markdown` did (#10712).
        run: bun run hygiene:no-ambient-credential-hoist

      - name: Decide-by-grep guard (a crash must not read as a pass)
        # Refuses `if TOOL ... | grep -q PAT; then fail; fi` in a workflow. A
        # pipeline's exit status is the LAST command's, so TOOL's status is
        # discarded; when TOOL dies on a signal (139 = 128+11 SIGSEGV, 134 =
        # 128+6 SIGABRT) it prints nothing, the grep matches nothing, and the
        # gate PASSES having checked nothing. Measured 2026-08-15: replaying
        # lean-proof.yml's axiom-audit step with a `lake` that SIGSEGVs on every
        # call exited 0 and printed "axiom audit clean (no sorryAx)" — 20 proof
        # gates green with no prover output at all.
        # Only the DENY polarity is flagged; `if ! ... | grep -q` is fail-closed.
        # Exits 2 if it scans fewer workflows than its floor, so a scope
        # regression cannot report success the way `lint:markdown` did (#10712).
        run: bun run hygiene:no-decide-by-grep

      - name: Scan-floor route audit (the floors are themselves enumerable)
        # Inventories every scan floor in the repo through four INDEPENDENT
        # recognizers and requires each to contribute at least one site. An
        # enumerating check is exactly the shape that goes blind — a rename or a
        # reworded failure message kills one recognizer while the other three keep
        # returning a plausible-looking inventory — so the floor here is
        # per-recognizer, never a total. Exits 3 naming the one that went dark.
        run: bun run hygiene:scan-floor-routes

      - name: Ambient-time-in-tests guard (no test verdict may depend on wall-clock)
        # A test that sleeps 10ms and then asserts is asserting that 10ms was enough on THIS
        # runner. MEASURED 2026-08-16: poll-pr-gate-batch.test.ts, 14 pure in-memory tests with
        # injected fakes and no I/O, ran 1366ms idle and 5.46s under load on the same machine
        # class -- a 4x spread on identical code -- and went red at exactly the 5000ms per-test
        # cap on six open PRs. Every one of those reds was false. In this repo's vocabulary a
        # real timer in a test is an undeclared ambient time channel: DST #4 and
        # noninterference #7, and the test-suite form of
        # local-time-never-enters-the-shared-fold.
        #
        # NOT a Semgrep or ESLint rule, though either could match the pattern. Their suppression
        # is an inline comment -- invisible in any roster, added by the same edit that
        # introduces the violation. This reads registry/wall-clock-test-allowlist.json, which
        # pins EXACT per-file occurrence counts, so a new sleep hiding behind a justified one
        # fails and so does a row that has gone stale. Same mechanism, and the same reason, as
        # tests/Tests.FSharp/DeterminismLint.Tests.fs uses for src/Core.
        #
        # Zero-delay yields stay legal: a setTimeout of 0 grants one event-loop turn on a fast
        # machine and one on a loaded one. It is a NON-ZERO delay that encodes a guess.
        #
        # Its own falsifier runs in the step below: audit-ambient-time-in-tests.test.ts feeds
        # the detector a deliberately-introduced ambient-time test and requires it to go red,
        # in both ratchet directions.
        run: bun run hygiene:no-ambient-time-in-tests
      - name: Hygiene unit-test suite (closes the per-PR coverage gap)
        # Runs every src/Core.TypeScript/hygiene/*.test.ts. These are
        # fixture/in-memory tests (no MEMORY.md / user-scope deps), so they
        # are CI-safe. This is what would have caught #8216's stale snapshot.
        run: bun test src/Core.TypeScript/hygiene/

      - name: Hardware-inventory cross-surface reconciliation (drift)
        # 081M00R59KS087G0R001W3837V. Hardware inventory lives on several surfaces
        # with different provenance (a ZetaId register, a human audit snapshot, an
        # operator declaration, machine self-registrations, SSH host keys) and
        # nothing reconciled them. This does NOT merge them — it checks the
        # invariants that hold ACROSS them (dangling machine references, one NIC
        # counted as two nodes, a surface that never says what it is, a snapshot
        # edited without moving its own counts, a declaration gone stale against
        # the probe surface) and reports the register-coverage gap.
        #
        # Drift, not a gate, by design: this job is not in the gate-required
        # roll-up, so a red here is signal, not a block (drift-and-heal ADR).
        # Divergences we deliberately hold open are ledgered in
        # inventory/reconciliation-open.json, and a ledger entry that no longer
        # reproduces fails too — a suppression cannot outlive its cause.
        run: bun run inventory:reconcile

      - name: Inventory read-model is derived, not drifted (081M00R59KS087G0R001W3837V)
        # `inventory/items.json` is a COMMITTED PROJECTION of `inventory/items/*.md`,
        # and it is the only inventory surface a reader actually sees — the Pages
        # viewer fetches it and never opens an item file. It has always had a
        # `--check` mode and NO workflow ran it: measured 2026-08-17, editing an
        # item's value_usd left `inventory:reconcile` green and all 23 inventory unit
        # tests passing while the published price stayed wrong.
        #
        # Third instance of the same class in this one job (the hygiene suite #8216,
        # the inventory unit tests one step down, now this): a check that exists,
        # can fail, and is wired to nothing reads exactly like a check that passed.
        run: bun run inventory:items-check

      - name: Inventory unit tests
        # These existed (generate-items-json.test.ts) and NO workflow ran them —
        # found while wiring the reconciliation check. Same shape as the #8216 gap
        # the hygiene step above closes, one directory over.
        run: bun test src/Core.TypeScript/inventory/

  lint-workflows:
    # actionlint catches .github/workflows/*.yml bugs: unknown
    # context refs, invalid runner labels, shellcheck-style warnings
    # on run: blocks, wrong action syntax. Round 33 static-analysis
    # expansion. See openspec/specs/static-analysis/profiles/
    # github-actions.md. This job installs only actionlint instead of running
    # the full install.sh bootstrap; otherwise apt proof/QEMU/R substrate can
    # consume the timeout before actionlint itself runs.
    name: lint (actionlint)
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        # -ignore 'unknown permission scope "administration"' is a
        # documented workaround for a known actionlint gap — the
        # `administration` permission IS valid in GitHub Actions
        # (used by .github/workflows/github-settings-drift.yml to
        # read rulesets + branch protection + security_and_analysis)
        # but actionlint v1.7.x has not yet added it to its allow-
        # list. Remove when actionlint catches up. See:
        # https://github.com/rhysd/actionlint/issues (search
        # "administration permission").
        run: actionlint -color -ignore 'unknown permission scope "administration"'

  lint-tick-history-order:
    # Validates that docs/hygiene-history/loop-tick-history.md
    # rows appear in non-decreasing chronological order
    # (specifically: the LAST row in the file is the latest
    # timestamp). This catches the recurring row-ordering bug
    # where the Edit tool's old_string=existing-line pattern
    # inserts the new row BEFORE the matched line, producing
    # reverse-chronological order. Maintainer 2026-04-26 asked for
    # structural prevention after the bug was caught at least
    # three times across recent ticks. The check is the
    # "fail-fast at commit/push time" mechanism that doesn't
    # rely on each agent's vigilance — Otto-339 anywhere-means-
    # anywhere applied to discipline-enforcement: enforce at
    # the layer that catches all paths, not at the input-tool
    # layer.
    name: lint (tick-history order)
    timeout-minutes: 12
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This order check reads one tracked Markdown file and runs one tracked
      # TypeScript script. It does not consume any host or cluster toolchain;
      # use the package-pinned Bun path so apt mirror stalls cannot suppress the
      # ordering verdict.
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install JavaScript dependencies from the locked graph
        run: bun install --frozen-lockfile

      - name: Run check-tick-history-order
        run: bun src/Core.TypeScript/hygiene/check-tick-history-order.ts

  lint-no-conflict-markers:
    # Fail if any committed file contains git merge-conflict markers
    # (`<<<<<<<`, `=======`, `>>>>>>>`). Maintainer 2026-04-26 ask:
    # *"maybe we should hygene for <<<<<<< HEAD and >>>>>>> ======= things
    # like that in our files incase we ever accidently botch a merge,
    # happens to the best of us humans too."*
    #
    # Per Otto-339 anywhere-means-anywhere: conflict markers in
    # substrate would shift weights wrongly when read by AI. Per
    # Otto-341 mechanism-not-vigilance: CI catches this regardless
    # of which agent / human / harness produced the merge. The
    # script self-allowlists files that legitimately document
    # merge-conflict resolution.
    name: lint (no conflict markers)
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
            ~/.rustup/toolchains/1.87.0-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
            ~/.cache/zeta/from-autotools-tarball/*.tgz
          key: install-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        # Provides bun via mise's pin in .mise.toml. Same pattern as
        # memory-index-duplicate-lint.yml (#1377) +
        # memory-reference-existence-lint.yml (#1378). shellenv.sh
        # wires BASH_ENV so subsequent run: steps auto-source the
        # managed shellenv with bun on PATH.
        run: ./tools/setup/install.sh

      - name: Run check-no-conflict-markers
        run: bun src/Core.TypeScript/hygiene/check-no-conflict-markers.ts

