  build-graph-completeness:
    # The acceptance gate on wiring job selection to `ace/build-graph.json`.
    #
    # An affected-set query is only sound if the graph is COMPLETE over the CI
    # domain: every target claims a leg, every leg resolves to a real job, every
    # job is claimed by a target. Break any of those and selecting jobs from the
    # graph SILENTLY SKIPS work -- and a job that should have run and did not is
    # indistinguishable from one that ran and passed.
    #
    # It found three real defects when written (2026-08-19), all live on main:
    #   * `lean-proof/build` and `tlaps-proof/tlaps` named jobs that do not exist
    #     (they are `type-check` and `prove`), so a wired graph would have skipped
    #     the Lean and TLA+ proofs entirely;
    #   * 35 Rust crates carried `legs: []` while `gate/lint-rust` demonstrably
    #     lints every crate under src/;
    #   * 18 jobs -- including lint-fsharp, lint-csharp and lint-rust -- were
    #     claimed by no target at all.
    #
    # BUN ONLY, on purpose, and the reason is this job's own subject matter: it
    # needs one 178 MB runtime, and `./tools/setup/install.sh` provisions the union
    # of every toolchain in the repo. Same rationale the lint-structural-hygiene
    # job below already states.
    name: lint (build-graph completeness)
    timeout-minutes: 5
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Graph is complete over the CI domain (fails closed)
        run: bun src/Core.TypeScript/hygiene/audit-build-graph-completeness.ts

      # Manifesto §1 for repo topology: `ace` may be the good resolution path and
      # may never be the only one. Guarded here rather than later because the guard
      # is free while `ace` is optional and unretrofittable once the fleet depends
      # on it. Rule: .claude/rules/clone-at-tag-stays-sufficient.md
      - name: Clone-at-a-tag is still sufficient (no ace-as-resolver)
        run: bun src/Core.TypeScript/hygiene/lint-clone-at-tag-is-sufficient.ts

      # A flake ref evaluates PURE by default, and pure-eval `builtins.pathExists`
      # on an absolute path returns FALSE rather than erroring (measured 2026-08-21,
      # Nix 2.34.6). Every full-ai-cluster module reading /etc/zeta guards its
      # readFile behind that pathExists, so a rebuild without --impure silently
      # reverts hostname / k3s join endpoint / segment address and DROPS the
      # operator's authorized SSH keys. Guarded here because the failure is silent.
      - name: Documented flake rebuilds still carry --impure (silent-revert guard)
        run: bun src/Core.TypeScript/hygiene/lint-nixos-rebuild-needs-impure.ts

      - name: Audit + selector unit tests (a check that cannot fail is not a check)
        run: |
          bun test \
            src/Core.TypeScript/hygiene/audit-build-graph-completeness.test.ts \
            src/Core.TypeScript/hygiene/lint-clone-at-tag-is-sufficient.test.ts \
            src/Core.TypeScript/hygiene/lint-nixos-rebuild-needs-impure.test.ts \
            src/Core.TypeScript/ci/affected-legs.test.ts

      # OBSERVE-ONLY. Nothing reads these outputs yet, and that is deliberate: the
      # derivation is published and compared against what the gate actually ran, so
      # it is checked against reality BEFORE any `if:` depends on it. Flipping the
      # guards on an unproven selector is the same class of mistake as trusting an
      # incomplete graph. The mapping is DERIVED here at run time and is never
      # hand-maintained in this file -- a second copy of the graph written as `if:`
      # expressions is how a wired graph becomes unwired again.
      - name: Affected legs for this change (observe-only, nothing consumes it)
        if: github.event_name == 'pull_request'
        run: |
          bun src/Core.TypeScript/ci/affected-legs.ts \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  lint-structural-hygiene:
    # Keep repository-structure guards that are still active after the
    # docs/backlog cutover. Legacy backlog-ID uniqueness/status checks are
    # intentionally not run here: new work-items are ZetaId-backed under
    # workitems/, while docs/backlog is frozen historical substrate.
    name: lint (structural hygiene)
    timeout-minutes: 5
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need merge-base history for manus commit-message leak scan.
          fetch-depth: 0

      # These repository-structure guards need Bun + Git only. Running the full
      # parity installer here lets unrelated compiler downloads consume this
      # job's five-minute budget before any guard executes.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Dangling tracked symlinks crash the GitHub Pages (Jekyll) build on realpath — invisible
      # to the test suites. Surfaced 2026-06-11: #7820 moved 31 dirs to db/ and nine relative
      # links dangled; Pages was red for hours on every push.
      - name: Run audit-dangling-symlinks (Pages/Jekyll guard)
        run: bun src/Core.TypeScript/hygiene/audit-dangling-symlinks.ts

      # docs/observe-events/ holds three filename schemes; only one of them (32-hex ZetaId)
      # carries no prefix, so a name that is hex-but-not-an-id is indistinguishable from an
      # id by shape. Three such names arrived 2026-08-09 from an id "mint" that did no
      # hashing, passed every `/^[0-9a-f]{32}$/` check in the repo, and produced a false
      # positive in a ZetaId audit (#10690). This decodes the version field instead of
      # trusting the regex, and carries a scan floor so it cannot pass by inspecting nothing.
      - name: Run audit-observe-event-filenames (ZetaId-vs-hex ambiguity guard)
        run: bun src/Core.TypeScript/hygiene/audit-observe-event-filenames.ts

      # 081KTSZN10008QG0R002J0GE0Z Reticulum-only clause: files marked SEALED-ROOM carry zero ambient-channel
      # tokens (fs/process/network/clock/entropy/Task.Run); falsifiers waive per-line, visibly.
      - name: Run audit-sealed-rooms (081KTSZN10008QG0R002J0GE0Z Reticulum-only lint half)
        run: bun src/Core.TypeScript/hygiene/audit-sealed-rooms.ts

      # 081KWMY831H — Manus/Lumen shell-wrapper must not leak into commit subjects.
      - name: Run lint-no-manus-commit-leak (081KWMY831H)
        run: bun src/Core.TypeScript/hygiene/lint-no-manus-commit-leak.ts

      # The four-oracle byte-lock pins field VALUES, not field NAMES — so two oracles
      # could declare the same schema id with different key sets and every existing
      # check stayed green. Live instance: PR #10722 gave TypeScript's
      # TemperatureReadout a required `fidelity` that F#'s does not have, both still
      # declaring `zeta.temperature.readout.v1`; the three suites that read that treaty
      # reported 51 pass / 0 fail / exit 0 with the divergence in place.
      # --min-schemas is a SCAN FLOOR: if a moved path or a changed glob makes the audit
      # inspect fewer schemas than stated, it exits non-zero instead of reporting
      # success — a check that did not run must not look like one that passed.
      - name: Run audit-schema-key-set-parity (cross-oracle schema key sets)
        run: bun src/Core.TypeScript/hygiene/audit-schema-key-set-parity.ts --min-schemas 6

      # Every Actions job must declare timeout-minutes. An unbounded job can hold a
      # runner until the 6h platform cap: on 2026-08-18 lint-autofix held a slot 90+
      # minutes and backlog-index-integrity 140.5, both stalled in install.sh on a hung
      # apt mirror. Slots never freed, concurrency cancelled the constituent lint jobs,
      # and gate (required) correctly read cancelled as failure — PRs went red with no
      # real defect. GitHub has no repo-level default job timeout and workflow defaults:
      # does not cover it, so per-job declaration is the only mechanism and this lint is
      # what keeps the class closed. Carries a scan floor so it cannot pass by
      # inspecting nothing.
      - name: Run lint-workflow-job-timeouts (unbounded-runner-slot guard)
        run: bun src/Core.TypeScript/hygiene/lint-workflow-job-timeouts.ts

      # A lane that COMPUTES a drift artifact must be able to PUBLISH it, and must fail when
      # it cannot. `drift-sweep` pushed its ledger at `main` from 2026-08-13, was refused
      # every run by the "CI Gate" ruleset, swallowed the refusal with
      # `git push || echo "push race"`, and concluded SUCCESS 1,597 times while
      # `docs/drift-events/` stayed frozen at tick 000247 — ten days of dashboard data
      # served from behind a green check (081M0QPZD9C087G0R002W8QC2A). The `||` is the
      # sharp part: it misfiled a PERMANENT rule rejection as a TRANSIENT race, so the lane
      # kept "recovering" from something that could never resolve.
      #
      # Three rules over lanes derived from content (never a hand-kept allowlist): no
      # publication push at `main`, no publish failure routed into a non-fatal handler, and
      # a real `git push --dry-run` capability probe — presence of a token is not capability,
      # which is the check that would have caught this on day one instead of day ten. The
      # `continue-on-error` half cannot be caught downstream at all: the REST jobs API
      # reports a swallowed STEP's conclusion as `success`, so static text is the only
      # channel that carries it.
      - name: Run lint-drift-publication-lands (stale-behind-green guard)
        run: bun src/Core.TypeScript/hygiene/lint-drift-publication-lands.ts

      # A workflow file GitHub will never read is not a check -- and it is worse than a
      # missing one, because a missing check is visibly missing. Live instance 2026-08-25:
      # agentic-organization/.github/workflows/ci.yml ran a 1,595-test suite and had never
      # executed once, because Actions reads only the ROOT .github/workflows/. The two
      # scaffold templates under src/Core.TypeScript/scaffold are exempt and SAID SO on
      # every run -- the exemption is derived from create-repo.ts sitting beside them, so
      # deleting that tool expires it rather than leaving an allowlist behind.
      - name: Run lint-no-nested-workflow-dirs (a workflow that never runs is not a check)
        run: bun src/Core.TypeScript/hygiene/lint-no-nested-workflow-dirs.ts

      # An ubuntu runner always has 16 GB, so an UNDECLARED host tier is not adaptation --
      # it is the constant `full`, i.e. 388 apt packages / 713.0 MiB on every run. Measured
      # 2026-08-25: ci-cache-paths-lint failed 5 of its last 20 runs, all five inside the
      # install step (exit 124, stalled on pandoc 26.9 MB and r-base-core 27.1 MB), while
      # the check NAMED "audit actions/cache paths vs git ls-files" never reached its audit.
      # This refuses SILENCE, never a particular tier: declaring `full` is a fine answer.
      - name: Run audit-install-tier-declared (undeclared apt payload guard)
        run: bun src/Core.TypeScript/hygiene/audit-install-tier-declared.ts

      - name: Workflow-shape guard falsifiers (a check that cannot fail is not a check)
        run: |
          bun test \
            src/Core.TypeScript/hygiene/lint-no-nested-workflow-dirs.test.ts \
            src/Core.TypeScript/hygiene/audit-install-tier-declared.test.ts

      # A privilege elevator resolved by NAME is substitutable by any writable directory
      # earlier on PATH, and planting one leaves NO GIT DIFF -- so review, AgencySignature
      # and byte-lock, all of which watch the repo, cannot see it. That was live on main as
      # a P1 (docs/BUGS.md, 2026-08-24): the shared biometric approval gate returned
      # ok:true from a shim that executed nothing. Deliberately NOT
      # `sonarjs/no-os-command-from-path` repo-wide: that rule was available and did not
      # catch this one -- it matches on the CALLEE, so a `run()` wrapper, an argv-prefix
      # array and a program held in a variable are all invisible to it.
      - name: Run lint-no-path-resolved-privilege-elevator (PATH-forgeable sudo guard)
        run: bun src/Core.TypeScript/hygiene/lint-no-path-resolved-privilege-elevator.ts

      - name: Elevator resolver + lint falsifiers (a check that cannot fail is not a check)
        run: |
          bun test \
            src/Core.TypeScript/privilege/elevator.test.ts \
            src/Core.TypeScript/hygiene/lint-no-path-resolved-privilege-elevator.test.ts \
            tools/setup/persona-keys/biometric.test.ts

      # Tsirelson's bound is S <= 2*sqrt(2) ~= 2.828 on the CHSH correlator, implemented at
      # src/Core/Tsirelson.fs. 1/(3*sqrt(2)) ~= 0.2357 is a DIFFERENT number: the image of
      # S = 2*sqrt(2) under the freely chosen linear map rho = S/12, adjudicated as a DESIGN
      # CHOICE. It is a legitimate design threshold and every current use of it is
      # behaviourally correct -- but every time the physicist's name got attached to it,
      # something broke. Z-3 and Z-5 were DEMOTED section-A -> section-B and the
      # Zeta-Conjecture keystone claim was REFUTED, all over this one constant.
      # Aaron 2026-08-23: "most 1/(3sqrt2) have turned out to be bugs."
      #
      # The 2026-08-01 response was a hand-propagated prose caveat. A prose sweep is a
      # SNAPSHOT: not idempotent, and it does not survive new files. Measured 2026-08-23, the
      # two 2026-07-16 sibling docs had drifted into DISAGREEING WITH EACH OTHER -- one
      # carried the banner, one did not, and neither could know. This guard is that same
      # correction expressed as a check instead of prose: the repo's own doctrine (prose rots,
      # a check does not) applied to its own correction.
      #
      # It refuses the NAME, never the NUMBER -- no value and no behaviour is in its scope.
      # Its caveat markers are DERIVED from the provenance doc, which it DISCOVERS by shape
      # rather than hardcoding, so renaming that doc reddens every stale citation instead of
      # silently disabling the guard. Sibling from the same 2026-08-01 audit:
      # lint-discharge-certificate-consistency.ts (in the lint (no empty dirs) job).
      - name: Run lint-tsirelson-constant-caveat (1/(3√2) is not a Tsirelson bound)
        run: bun src/Core.TypeScript/hygiene/lint-tsirelson-constant-caveat.ts

      # The guard above is only worth its runtime if it can still FIRE. Two of these tests
      # exist because earlier drafts of it were VACUOUS on the real tree -- markers that
      # green-lit the very files they were written for. Pinned so they cannot come back.
      - name: Tsirelson-caveat guard unit tests (a check that cannot fail is not a check)
        run: bun test src/Core.TypeScript/hygiene/lint-tsirelson-constant-caveat.test.ts

      # NOTE (2026-08-25): a `lint-no-direct-push-to-main` (PM001) check was wired in here
      # and has been withdrawn. Not because the defect it found was unreal — three lanes on
      # this branch are fixed BECAUSE of it — but because a check named "no direct push to
      # main" states a doctrine this repo has since decided against: #15313 designs the
      # heartbeat lane to push to `main` DIRECTLY, with a content-bound attestation and a
      # post-hoc audit instead of a gate. The surviving rule is "no UNATTESTED direct push",
      # which is `audit-heartbeat-lane-attestations.ts` in the `cross-verify` floor, not a
      # blanket ban. Its one mechanical finding that neither AH001 nor AH002 could see —
      # a skip token BUILT by `echo` into `git commit --file=-` — was folded into AH002
      # itself rather than shipped as a third overlapping check.

  lint-no-empty-dirs:
    # Fail if a committed directory has no files — almost always a
    # forgotten artefact (an agent-created skill folder without a
    # SKILL.md, a research folder with no report). Born round 35 after
    # Aaron: "we need a build script that will fail the build if it
    # detects an empty folder". Script under src/Core.TypeScript/lint/ respects
    # .gitignore and an explicit allowlist at
    # src/Core.TypeScript/lint/no-empty-dirs.allowlist. Upstream mirrors under
    # references/prior-art/** are excluded by the script itself.
    # No untrusted input used in run: — only a fixed repo path.
    name: lint (no empty dirs)
    timeout-minutes: 5
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This source-tree lint needs Bun + Git only. Running the full parity
      # installer here makes an unrelated Zig/Lean/QEMU download capable of
      # consuming the entire five-minute lint budget before the check starts.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Run no-empty-dirs
        run: bun src/Core.TypeScript/lint/no-empty-dirs.ts

      # 081M010W1BP087G0R002M2BNVW — Heat.fs decided "is this kind pressure?" twice, by two
      # independent routes that disagreed on kinds carrying both a forgetting and a pressure
      # token. That bit is the discriminator for the composition law (deferral composes,
      # destruction does not), so two answers defeat the point of the law being decidable.
      # #10804 collapsed both routes onto one ordered chain; this is the standing guard that a
      # second one cannot come back. PART A refuses a dual-token kind literal; PART B
      # DISCOVERS the single classifier — it never pins the name, because pinning `ofKind` is
      # exactly what made the first draft of this lint go red on a correct main — and refuses
      # a second decider, an inline substring probe, an orphan probe, and a membership split
      # between the two pressure tables. Every extraction route carries its own scan floor, so
      # a route that goes dark fails instead of reading OK.
      - name: Guard — one classifier for the heat deferral/destruction bit (081M010W1BP087G0R002M2BNVW)
        run: bun src/Core.TypeScript/hygiene/lint-heat-kind-classifier-agreement.ts

      - name: Guard — discharge rows may not contradict their own certificates
        # 2026-08-01: five rows were written "§A — DISCHARGED" while Z-2's own cited
        # certificate said status:"OPEN" (94.7% error vs a 25% threshold). The script
        # honestly reported failure; the register cell overrode it in prose. §A is the
        # frozen core, so a false row there is an integrity defect. This catches that
        # class MECHANICALLY — no judgement about whether a discharge is *good*, only a
        # refusal of rows that contradict (or are missing) their cited evidence.
        run: bun src/Core.TypeScript/hygiene/lint-discharge-certificate-consistency.ts

      - name: Guard — the child-floor jurisdiction registry (081M0TJXY32087G0R003TBTR7V)
        # The PREDICATE (protect children) is invariant; the THRESHOLD (~16-21) is a
        # jurisdictional parameter. `Safety/ChildFloorPolicy.lean` proves, for EVERY
        # registry, that no reading can lower the floor and that an unknown jurisdiction
        # denies — so a bad entry cannot break safety, it is simply refused and the
        # resolver falls through to the protective bound. That silence is why this lint
        # exists: a jurisdiction that believes it declared 15 would get 21 and never learn.
        # It also byte-locks the band across its three copies (Lean / TypeScript / JSON),
        # because three copies of a safety constant is a drift bug waiting to happen.
        run: bun src/Core.TypeScript/hygiene/lint-child-floor-registry.ts

      - name: Child-floor policy falsifiers (081M0TJXY32087G0R003TBTR7V)
        # The resolver's own test suite. It lives outside src/Core.TypeScript/hygiene/, so
        # the hygiene suite does not reach it and only the non-blocking bare `bun test` job
        # would — which is too far from the change for a SAFETY floor. Named here so it runs
        # on every PR beside the lint it belongs to. Its sabotage registries are the same
        # ones ChildFloorPolicy.lean §6 refuses, so the two oracles refuse the same attacks
        # rather than each passing their own.
        run: bun test src/Core.TypeScript/child-floor/

      - name: Guard — a golden-vector treaty may not claim a rule its vectors do not pin
        # PR #10759 was filed on the premise "the tie-break behaviour is byte-locked into
        # the four-oracle treaty." Measured, that premise was false: first-occurrence and
        # ordinal-minimum each changed 0 of 7 pinned vectors, because six of the seven had
        # no tie reaching quorum at all. "The treaty pinned a POINT; the prose claimed a
        # RULE." This is spec-side mutation testing — mutate the RULE, count the vectors
        # that change, and refuse a declared exclusion that changes zero. Cross-oracle byte
        # agreement (the treaty's other, real job) is deliberately NOT audited here.
        run: bun src/Core.TypeScript/hygiene/lint-treaty-rule-discrimination.ts

  lint-markdown:
    # markdownlint-cli2 on every .md file outside the ignore list in
    # .markdownlint-cli2.jsonc. Round 33 static-analysis expansion
    # (docs + specs + skills are a huge surface; drift is easy).
    # See openspec/specs/static-analysis/profiles/markdown.md.
    name: lint (markdownlint)
    timeout-minutes: 12
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull_request ref is a synthetic merge commit. Its first parent
          # must be present for the PR-scoped markdown diff below.
          fetch-depth: 2

      # This job needs Bun, markdownlint-cli2, and tracked TypeScript only.
      # Running the full workstation/cluster bootstrap made a 553 MB apt
      # manifest download capable of consuming its 12-minute job cap before
      # markdownlint began. `packageManager` pins this runtime and
      # `bun.lock` pins the linter; the full setup graph remains the path for
      # developer machines, cluster nodes, and jobs that consume its tools.
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install JavaScript dependencies from the locked graph
        run: bun install --frozen-lockfile

      - name: Run markdownlint (scoped to the PR's own diff on pull_request)
        # Drift-and-heal ADR item 4 (workitem 081KX3KA3ES08QG0R003TW3XDE, the
        # priority-inversion fix): on pull_request this job fails ONLY on
        # findings in files the PR itself touches; findings in unrelated files
        # print as out-of-scope drift (informational — the drift-sweep ledger
        # on main owns them, and the SLO auto-files work when they linger).
        # On push/main the whole tree still lints: that run IS the detector.
        # HEAD is the merge commit on pull_request, so HEAD^1..HEAD is exactly
        # this PR's changes against current main — no user-controlled ref
        # names touched (safe-pattern: first-party context only). The
        # `|| true` inside the group is load-bearing: the default shell is
        # `bash -e -o pipefail`, and the verdict must come from scoped-lint
        # (rightmost pipe stage), not the raw linter.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD > /tmp/changed-files.txt
            git ls-files > /tmp/tracked-files.txt
            { bunx --no-install markdownlint-cli2 "**/*.md" 2>&1 || true; } \
              | bun src/Core.TypeScript/hygiene/scoped-lint.ts \
                  --changed /tmp/changed-files.txt --tracked /tmp/tracked-files.txt
          else
            bunx --no-install markdownlint-cli2 "**/*.md"
          fi

  lint-typescript:
    # The TypeScript member of the per-language lint family (lint (F#) / (C#) /
    # (Go) / (Python) / (Rust) / (TS)). Strict typecheck on every TypeScript file
    # via `tsc --noEmit -p tsconfig.json`. Round 35 static-analysis expansion per 081KQDTYV0008QG0R000XFYDTT:
    # ESLint with typed-linting catches *most* TS issues but not all
    # assignability narrowings. Slice 9 (PR #882) shipped a real
    # TS2322 (`Type 'string' is not assignable to type "head" | ...`)
    # to main because gate.yml previously had `dotnet build` for F#/C#
    # but no tsc step for `tools/**/*.ts`. PR #887 fixed the bug; this
    # job is the missing gate that prevents the class. Same shape as
    # round-30 semgrep elevation: codified rules (tsconfig strict mode)
    # without a gate aren't a control.
    name: lint (TS)
    timeout-minutes: 12
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Strict TypeScript analysis consumes only the repository's Bun runtime
      # and lockfile-managed dev dependencies. Do not download the complete
      # apt workstation/cluster manifest before this narrow check starts.
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install npm devDependencies (typescript@6.0.3 + eslint stack)
        # tsc lives in node_modules/.bin via the typescript devDep
        # pinned in package.json + bun.lock. --frozen-lockfile fails
        # if the lockfile is out of date with package.json — same
        # discipline as bun's own CI patterns.
        run: bun install --frozen-lockfile

      - name: Run TypeScript type check (tsc --noEmit, via the orchestrator)
        # tsc ONLY. This step used to be named "Run TypeScript Lint Script" and
        # commented "Type check and lint checks" — no eslint, prettier or
        # stylelint runs here or anywhere in this job, and the runner itself used
        # to print that they had passed. Both statements are removed rather than
        # made true: wiring eslint on is a separate, measured decision
        # (workitem 081M0RBXF6J087G0R0023EX9X2 — 14,218 errors in one directory).
        # A step name is read as a claim about what ran; keep it to what runs.
        run: bun src/Core.TypeScript/lint/lint-typescript.ts

      # ESLint over the paths MEASURED CLEAN, and only those
      # (workitem 081M0RBXF6J087G0R0023EX9X2). eslint has been configured,
      # pinned and named in this workflow since day one while running nowhere;
      # `lint (twitch-ai app)` (b1967172d, 2026-08-23T23:24:02Z) was the first
      # path it actually ran on. This is the second, chosen by measurement
      # rather than taste.
      #
      # Repo-wide the config finds 19,685 errors over 2,500 files, so a blanket
      # `eslint .` would redden main by five figures. The roster in
      # `lint:eslint` is every directory that measured EXACTLY ZERO on
      # 6fb8f3149, minus `infra/k8s` — 102 files. `infra/k8s` measured zero too,
      # but it is the STALE cluster declaration awaiting deletion
      # (081M00QCHWA087G0R000GKKRXD): `audit-cluster-tree-consumers` went red on
      # this very PR because naming it in package.json was new coupling to a tree
      # whose roster must only SHRINK. Dropped rather than rostered — a lint
      # roster is not a reason to keep a doomed tree alive. It locks the standard in where it already holds
      # and costs nothing to satisfy today; the other ~19.6k errors stay a
      # measured list in the workitem, not a silenced one. No rule is disabled,
      # no path is ignored, nothing is downgraded to a warning.
      #
      # Widening = add a path to `lint:eslint` once it measures zero. The same
      # script is what a laptop and a devcontainer run (`bun run lint:eslint`),
      # so the three surfaces cannot drift.
      #
      # Cost: ~13s on this machine over 107 files (the typed-linting program
      # load dominates, not the file count), inside a job already provisioned
      # with bun + the eslint stack. No new job, no new runner, no new install.
      - name: ESLint over the measured-clean path roster
        run: bun run lint:eslint

  lint-twitch-ai:
    # twitch-ai is a self-contained Vite workspace (own tsconfig: lib DOM +
    # vite/client types, own bun.lock) that NO CI job ran — the app's real
    # build was invisible until someone ran it by hand
    # (workitems/081M0QF7ZVY087G0R003Q4Q18D; two main-is-red workitems came
    # out of that gap). The root `lint (TS)` reaches these files only
    # incidentally, under ROOT settings (bun types, no DOM), not the app's.
    # This job runs the workspace's OWN typecheck, the repo ESLint config
    # over the app tree — the first narrow-path slice of
    # workitems/081M0RBXF6J087G0R0023EX9X2 ("eslint configured, pinned and
    # named in CI but never invoked"; that workitem's own prescription is
    # "turn the tool on for a narrow path first and widen") — and the real
    # `vite build`.
    # Drift check, not floor: adding a job to `gate (required)`'s needs is a
    # treaty amendment (see the floor comment there); that decision stays
    # with the consent path.
    name: lint (twitch-ai app)
    timeout-minutes: 12
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install root devDependencies (the eslint stack)
        run: bun install --frozen-lockfile

      - name: Install app dependencies (the app's own lockfile)
        run: bun install --frozen-lockfile
        working-directory: src/apps/twitch-ai

      - name: Typecheck under the app's own tsconfig
        run: bun run typecheck
        working-directory: src/apps/twitch-ai

      - name: ESLint over the app tree (repo config; rc captured directly)
        run: bunx eslint src/apps/twitch-ai/src

      - name: Vite build (the app's real build, exactly what deploys)
        run: bun run build
        working-directory: src/apps/twitch-ai

  lint-identity-dla:
    # demo/identity-dla-site is a self-contained pnpm/Vite workspace (own
    # tsconfig, own pnpm-lock.yaml, packageManager pin) that NO PR-time job
    # checked — its tsc lived solely inside pages-deploy.yml, which is not a
    # required check. Measured cost of that gap: PR #14523 merged `*/` inside
    # a block comment in OracleWorm.tsx, every Pages deploy went red for ~2h
    # (10 consecutive failures across unrelated shas) and the live page
    # silently served a stale bundle. Workitem 081M0RN9FW3087G0R000EBT0HH;
    # the break itself was fixed in #14604 — this job is the standing half.
    # It runs the DEPLOY'S OWN build entry (install → check → pages vite
    # build), so the job and the deploy cannot drift apart; pnpm resolves
    # from the site's own packageManager pin inside that script. The Go WASM
    # oracle step degrades to a logged skip here (no ZETA_PAGES_REQUIRE_GO):
    # this job's subject is the site's TypeScript, and pages-deploy still
    # enforces the Go half where its setup-go step guarantees the toolchain.
    # Drift check, not floor: adding a job to `gate (required)`'s needs is a
    # treaty amendment (see the floor comment there); that decision stays
    # with the consent path.
    name: lint (identity-dla site)
    timeout-minutes: 12
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install root dependencies (the builder's imports)
        run: bun install --frozen-lockfile

      - name: Build the site exactly as pages-deploy does (install + check + pages build)
        run: bun ./src/Core.TypeScript/discovery/identity-dla-pages-build.ts

  lint-website:
    # src/Renderers/website is a second, forked copy of the identity-dla scaffold
    # (same "name": "identity-dla") that NOTHING checked. It appeared in
    # .github/dependabot.yml's npm `directories:` list and in NO workflow: before
    # this job, `grep -rn "Renderers/website" .github/` returned exactly one line,
    # the dependabot entry. Root tsconfig.json excludes "src/Renderers/website/**"
    # and the lint:eslint roster omits it, so the blocking `lint (TS)` job never
    # saw it either. Dependabot proposed version bumps against a tree with no
    # build, no typecheck, and no test.
    #
    # Measured cost of that gap: react-resizable-panels 3 -> 4 landed here, and v4
    # both renames the primitives (PanelGroup -> Group, PanelResizeHandle ->
    # Separator, no aliases) and drops the data-panel-group-direction attribute,
    # so every data-[panel-group-direction=vertical]:* utility silently became a
    # selector that can never match. The rename half is a type error this job
    # catches; the attribute half is not, and that asymmetry is why the file
    # carries its own explanatory comment rather than relying on CI alone.
    #
    # Shape is deliberately the sibling's, not a new one: same runner pin, same
    # pinned actions, install -> check -> vite build, no caching. It does NOT run
    # `pnpm build`, because that script chains `esbuild server/index.ts` and this
    # project has never had a server/ directory (only client/ was ever committed
    # from the scaffold) -- `pnpm build` therefore cannot succeed here, and a step
    # that always fails is as useless as one that cannot. `vite build` is the half
    # that has a subject.
    #
    # --frozen-lockfile is the load-bearing flag: it is what makes a Dependabot
    # bump that updates package.json without the lockfile fail here instead of
    # silently drifting. It only means something because pnpm-lock.yaml is now
    # committed; before this change the directory could not be installed at all
    # (pnpm.patchedDependencies named patches/wouter@3.7.1.patch, which was never
    # committed -> ENOENT, rc=254 on a clean clone).
    #
    # Drift check, not floor: this job is deliberately absent from
    # `gate (required)`'s needs, exactly as lint-identity-dla is. Adding it there
    # is a treaty amendment and stays with the consent path.
    name: lint (Renderers/website)
    timeout-minutes: 12
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install, typecheck and build under the site's own packageManager pin
        working-directory: src/Renderers/website
        run: |
          set -euo pipefail
          # Resolve pnpm from the site's own packageManager field rather than a
          # version hardcoded here, so the two cannot drift. Same reason the
          # sibling's builder script parses it instead of pinning in YAML.
          PNPM_VERSION="$(bun -e "console.log(JSON.parse(require('fs').readFileSync(process.cwd() + '/package.json', 'utf8')).packageManager.split('@')[1].split('+')[0])")"
          echo "pnpm pin from package.json: ${PNPM_VERSION}"
          bun x "pnpm@${PNPM_VERSION}" install --frozen-lockfile
          bun x "pnpm@${PNPM_VERSION}" run check
          bun x "pnpm@${PNPM_VERSION}" exec vite build

