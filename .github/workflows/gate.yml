            case "$attempt" in
              1) backoff=10 ;;
              2) backoff=30 ;;
              3) backoff=60 ;;
              4) backoff=120 ;;
            esac
            echo "install.sh attempt $attempt failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
          done

      - name: Install npm devDependencies (typescript@6.0.3 + eslint stack)
        # tsc lives in node_modules/.bin via the typescript devDep
