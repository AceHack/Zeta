  cross-verify:
    # Enforce the trust-core cross-language byte-lock + golden-vector oracles + the Ace
    # package-manager suite. Previously only `lint (TS)` type-checked these, so a
    # regression to a committed golden vector, or a 4-language disagreement, could merge green.
    # This job runs the ASSERTIONS (assert-dont-skip): every tests/cross-verification/<primitive>/
    # oracle via src/Core.TypeScript/ci/cross-verify-all.ts (compare.ts = TS/F#/C#/Rust committed outputs vs the
    # canonical vectors = the non-Byzantine compile-time agreement, baked in; cross-verify.ts = the
    # TS golden-vector oracle) plus `bun test src/Core.TypeScript/ace/` and the Q# source-oracle tests. The
    # ORACLES assert COMMITTED outputs (no dotnet/rust/QDK toolchain needed); the ace suite installs
    # npm deps (z3-solver) + uses the runner node for its solver Z3 differential. This is the
    # ENFORCEMENT half of the canonical-primitive gate (proof + 4-language byte-lock); the proof half
    # is the formal-coverage cadence / lean-proof lane.
    #
    # THIS JOB IS IN THE REQUIRED FLOOR. It is named in `gate-required.needs` below, and
    # `CI Gate` requires `gate (required)`, so a red here does block a merge. The note that
    # stood here until 2026-08-24 said the opposite — "promoting this to a REQUIRED check is
    # a separate operator/devops step ... it does not block auto-merge" — and it was false
    # for long enough to be believed: it was read on 2026-08-24 as evidence that the ace
    # drift gate was ungated, when a sabotage control proved the opposite. Adding a
    # `ProjectReference` to `clis/Zeta.Clis.fsproj` without regenerating
    # `src/Core.TypeScript/ace/build-graph.json` takes `bun test src/Core.TypeScript/ace/`
    # from 703 pass / 0 fail to 701 / 2, rc=1, and the two failures are the DRIFT GATE pair
    # — inside this job, inside the floor. A comment claiming a gate does not gate is the
    # same defect class as a gate that does not run, pointed the other way, so it is
    # corrected rather than left as folklore (081M0TK8DE8087G0R0001HSKHF).
    name: cross-verify (trust-core oracles + ace suite)
    timeout-minutes: 12
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The committed oracle comparisons, Ace suite, and Q# source oracles
      # intentionally do not execute the F#/Rust/QDK toolchains. Their actual
      # dependency graph is Bun plus the repository lockfile (including
      # z3-solver), so use that declared narrow graph instead of the full apt
      # workstation/cluster installation.
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install npm devDependencies (z3-solver for the ace solver Z3 differential, etc.)
        # The ace suite's solver.z3.test.ts spawns node to require('z3-solver') (assert-dont-skip:
        # it FAILS rather than skips if the dep is absent). --frozen-lockfile fails if the lockfile
        # is stale vs package.json (same discipline as lint-typescript).
        run: bun install --frozen-lockfile

      - name: Ace package-manager suite
        run: bun test src/Core.TypeScript/ace/

      - name: Q# source-owned reference oracles
        run: |
          bun test \
            src/Core.QSharp.ReferenceOracle/qsharp-golden.test.ts \
            src/Core.QSharp.ReferenceOracle/quantum-circuit.test.ts \
            src/Core.QSharp.ReferenceOracle/dbsp-operators.test.ts \
            src/Core.QSharp.ReferenceOracle/heat-signals.test.ts

      - name: Cross-language byte-lock + golden-vector oracles
        run: bun src/Core.TypeScript/ci/cross-verify-all.ts

      # The `.claude/rules/no-binary-in-proof-lineage.md` exception, enforced rather than
      # asserted. `src/wasm-dla/bytelock/` holds six committed `.wasm` substrate modules; they
      # are the artifact UNDER TEST, not golden vectors, and the rule now says so — but a
      # documented exception with no scope is a licence. This derives the allowed set from the
      # byte-lock runner's own roster and the build script's own declared outputs, so a new
      # binary in that directory is red until it is wired into both.
      #
      # Two of its checks are here rather than in `bytelock.yml` on purpose. That workflow is
      # `push: main` — POST-MERGE by construction — so the malformed-artefact guard that would
      # have caught `dla-canonical-zig.wasm` shipping as an `ar` archive could only ever fire
      # after the fact, and it did, for two weeks. The header check and the golden-vector text
      # check need no toolchain, so they belong on the pre-merge floor.
      - name: Proof-lineage binary exception (no-binary-in-proof-lineage.md)
        run: bun src/Core.TypeScript/hygiene/audit-proof-lineage-binaries.ts

      # Stage-0 minimization ratchet (081M0X2553J087G0R001VH0K64). `mise` installs `bun`, so
      # whatever installs `mise` cannot be written in `bun` — stage-0 shell is ESSENTIAL and
      # this check never argues with it. What it prices is the number of DOORS: shell files
      # that something outside the shell graph has to name. Internal helpers cost zero, so the
      # metric creates no pressure to merge scripts that split for a bootstrap-ordering reason.
      #
      # It is HERE and not in `lint (bash retirement inventory ...)` deliberately. That job is
      # not in `gate-required.needs`, so everything it runs blocks nothing — the existing shell
      # allowlist has been advisory the whole time it has been read as a guard. A ratchet that
      # cannot fail a merge is a number, not a ratchet, so it goes on the floor.
      - name: Stage-0 independence ratchet (doors, not file count)
        run: bun run hygiene:stage0-independence

      # THE VACUITY CLASS, INVERTED — a step that can never SUCCEED.
      #
      # `${{ steps.X.outputs.Y }}` with no writer interpolates to the empty string silently.
      # A step guarding on that value fails every run forever, and its error names the
      # PRODUCER, so the fault reads as a defect in that step. Live instance the day this
      # landed: `agent-heartbeat.yml`'s flush returned success on two paths without declaring
      # `skip`, so every backpressured tick — a HEALTHY outcome — reported as a broken flush.
      # Three agents diagnosed it as an auto-merge token-scope fault; that call was never
      # reached. The second of the two paths was found by this check, not by hand.
      - name: Step outputs have writers (a step that cannot succeed)
        run: bun src/Core.TypeScript/hygiene/audit-workflow-step-output-has-writer.ts

      # A REAL SHA THAT NOBODY CHOSE.
      #
      # Every third-party action is pinned to a SHA, which reads as supply-chain discipline
      # until you ask who checked the SHA. A 40-hex string is indistinguishable from a
      # fabricated one by shape, and two sites can pin one action at two SHAs indefinitely
      # while every review of either looks clean. Both happened here on 2026-08-25: an agent
      # nearly shipped an invented SHA for an action this repo does not use, and
      # `ruleset-apply.yml` landed `actions/upload-artifact` at a SHA a YEAR older than the
      # ten other sites. The roster makes the pin a value someone committed, not remembered.
      - name: Third-party actions match the SHA roster (AH007)
        run: bun src/Core.TypeScript/hygiene/audit-action-sha-roster.ts

      # A TASK ID THAT IS WELL-FORMED AND IDENTIFIES NOTHING.
      #
      # The AgencySignature gate validates `Task:` for placeholder-ness and SHAPE, never
      # existence — so an invented-but-well-formed ZetaId passes silently, and it is harder
      # to spot than a placeholder because it looks exactly right. The legacy `B-NNNN`
      # scheme has had this guard since `b-ref-resolve.ts`; the ZetaId scheme that REPLACED
      # it never got one, so the newer mandatory key was the less-checked one.
      #
      # Live instance the day this landed: `Task: 081M0X0JQGY087G0R000EBCPQ3`, written by
      # hand instead of minted, caught only because its author re-read his own trailer.
      - name: Task ZetaIds resolve to work-items (AH006)
        # PULL-REQUEST ONLY, and the `if:` is load-bearing rather than cosmetic.
        # `github.event.pull_request.body` is EMPTY on a push to `main`, and this audit
        # deliberately exits 2 on empty input ("NO INPUT — This is NOT a pass") so that a
        # check with nothing to check can never read as a check that passed. That refusal is
        # correct; wiring it into a job that also runs on push was not. The result was a
        # cross-verify red on every push to main whose exit code (2, not 1) said plainly it
        # was a check that never ran — and it was read as a pre-existing failure for hours.
        # A push has no PR body to validate; the commit trailer is validated separately.
        if: github.event_name == 'pull_request'
        env:
          # The PR body carries the AgencySignature block, and unlike `git log` it is present
          # on a SHALLOW checkout. The first wiring of this step piped `git log -50`, CI checks
          # out depth 1, and the audit passed having examined ZERO ids — the exact vacuity it
          # was written to catch, in its own wiring. It now exits 2 on empty input, so a
          # regression here goes red instead of green.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | bun src/Core.TypeScript/hygiene/audit-task-zetaid-resolves.ts --stdin

      # THE FALSIFIER FOR CREDENTIAL-ROLE COLLAPSE (AH003, 2026-08-25).
      #
      # `docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md`
      # names THREE credential roles with three secrets: dispatch, branch-push, PR-create. A
      # `${{ secrets.A || secrets.B || secrets.GITHUB_TOKEN }}` expression erases that table at
      # the point of use -- `||` selects on the left secret being EMPTY, so an absent scoped
      # credential is silently replaced by one with DIFFERENT authority and the step then fails
      # somewhere downstream naming the wrong subject. 25 such chains across 12 workflows had
      # accumulated behind per-step comments that described the ladder as the SAFE half.
      #
      # It is the SILENT selection this refuses, never the degradation itself: a probe + an
      # explicit `::warning` naming the secret and scope inside a `run:` block is good design
      # and is untouched (agent-heartbeat.yml keeps three of them).
      #
      # Distinct from `audit-workflow-write-token-consistency.ts` above, which asks whether a
      # forge-write step reaches A PAT. This asks whether it reaches THE RIGHT ONE, and only
      # that one. A step can satisfy that audit and still be a role collapse -- all 25 sites
      # did, which is why one check does not subsume the other.
      #
      # Offline (reads only committed workflow text, no sockets), so it belongs on the
      # pre-merge floor rather than post-merge.
      - name: Workflow credential role separation (one role, one secret)
        run: bun src/Core.TypeScript/hygiene/audit-workflow-credential-role-separation.ts

      # AH005 — a committed identity that GitHub resolves to somebody who is not us.
      #
      # `<username>@users.noreply.github.com` is the LEGACY plain noreply form and GitHub
      # resolves it DIRECTLY to whoever owns that username today. Two of our personas
      # shipped under it (15 commits and 2 commits), and both local-parts are live accounts
      # belonging to uninvolved private individuals. They are rendered in this repository's
      # Contributors sidebar, which aggregates trailer co-authors — note the REST
      # `/contributors` endpoint does NOT, which is why an earlier check of that endpoint
      # came back clean and under-reported the problem.
      #
      # The audit scans the SOURCES THAT GENERATE identities, never git history. The
      # offending commits are on `main` and correcting them would mean force-pushing the
      # default branch, so they stay. An audit pointed at history would be permanently red
      # over commits nobody may fix, and a check that can never go green gets disabled.
      #
      # HERE on the cross-verify floor because it is offline (reads only committed text, no
      # sockets, no DNS — the fabricated-namespace list is a closed enumeration rather than
      # a resolver for exactly that reason). Measured: ~1.4 s warm over 2,028 generator
      # files. Proven able to fail before it was wired: run against the pre-fix contents of
      # the same seven files it reports 7 findings and exits 1.
      - name: Co-author identity collision (AH005 — plain-username GitHub noreply form)
        run: bun src/Core.TypeScript/hygiene/audit-coauthor-identity-collides.ts

      # THE FALSIFIER FOR THE PR-ARCHIVE COVERAGE COLLAPSE (2026-08-25).
      #
      # `agent-heartbeat.yml`'s auto-merge steps hardcoded `secrets.GITHUB_TOKEN` while every
      # other credentialed step in that file used the PAT fallback chain. A merge armed with
      # GITHUB_TOKEN lands as `github-actions[bot]`; GitHub suppresses workflow triggers for
      # GITHUB_TOKEN-driven events, so `pull_request: closed` never fires and
      # pr-archive-on-merge.yml never runs — with NO failure anywhere, which is why it was
      # misdiagnosed as a credential problem several times. Measured 2026-08-21..25: 747 of
      # 765 (97.6%) eligible unarchived PRs were bot-merged; 530 of 539 (98.3%) archived ones
      # were user-merged.
      #
      # The defect is the INCONSISTENCY, not the instance — one step out of nine disagreeing
      # with its neighbours, which prose cannot hold. Offline (reads only committed workflow
      # text, no sockets), so it belongs on the pre-merge floor rather than post-merge.
      - name: Workflow write-token consistency (forge writes must reach the PAT)
        run: bun src/Core.TypeScript/hygiene/audit-workflow-write-token-consistency.ts

      # The falsifier for the PR-free heartbeat lane. Design:
      # docs/research/2026-08-25-pr-free-heartbeat-lane-attestation-instead-of-gate.md
      #
      # The lane's proposal is that a bypass actor on ruleset `CI Gate` (16134995) pushes
      # telemetry straight to `main`, skipping `gate (required)`, and that the lane verifies
      # ITSELF. A bypass actor is a permanent hole, so that self-verification has to be a
      # checkable fact rather than a claim -- this is the check. For every commit the lane
      # produced it requires a content-bound attestation (`Verification-Subject` is the
      # commit's own tree sha, so a COPIED attestation fails), a path allowlist, and a
      # change-mode check in which `append-only` means the pre-image is a byte PREFIX of the
      # post-image -- NOT `deletions == 0`, which `docs/github/prs/manifest.jsonl` satisfies
      # 13 times in 40 while inserting its rows in sorted order.
      #
      # HERE on the cross-verify floor because it is offline (no sockets, reads only committed
      # git objects) and because a bypass-lane guard must run on exactly the lane a path filter
      # would exclude. Collection is two-phase for CORRECTNESS, not speed: this job checks out
      # at fetch-depth 1, where the tip has no parent, so `git show --name-status` would report
      # the entire 45k-file tree as added and `<sha>^` would not resolve. Metadata alone decides
      # NOT-LANE, so a commit the audit does not judge never enters that path -- and where the
      # parent genuinely is unreachable it exits 2 rather than reading a missing object as a
      # violation. Measured on a full clone: 6.9 s for a 300-commit metadata-only window.
      #
      # HONEST STATE, so nobody quotes a green run as evidence: `cutoverIso` in the registry
      # is 2099-01-01 and the lane identity does not exist yet, so TODAY this returns clean
      # over 300 commits with all 300 classified NOT-LANE -- armed, and vacuous until step 4
      # of the design doc's section 12. It was proven able to fail against real history
      # first: with the cutover moved back and the current flush identity registered it
      # reports 290 violations of 300. The unit tests below are what keep it non-vacuous in
      # the meantime.
      - name: PR-free heartbeat lane attestations (armed; vacuous until the lane exists)
        run: bun src/Core.TypeScript/hygiene/audit-heartbeat-lane-attestations.ts --max 300

      - name: Heartbeat-lane audit unit tests (a check that cannot fail is not a check)
        run: bun test src/Core.TypeScript/hygiene/audit-heartbeat-lane-attestations.test.ts

      # Two commit-back-lane audits, both of which existed as code and NEITHER of which any
      # workflow invoked. `audit-push-without-rebase.ts` (AH001) shipped 2026-08-10 with a
      # named live instance and zero callers — the guard against a lane erasing its own
      # commit had never once executed in CI. An audit nothing runs is the vacuity class in
      # its purest form: it reads as protection and constrains nothing, which is exactly the
      # property both of these audits exist to refuse in other people's code.
      #
      # AH002 is the newer half. The `[skip ci]` refusal already lived inside
      # `flush-via-staging.ts`, where it protects every lane that ALREADY adopted the safe
      # route and is invisible to every lane that did not — so `lockfile-healer` pushed a
      # skip-token commit at `main` for eleven days while reporting 40/40 green, because its
      # `Commit and push` step is gated on drift being detected and no drift occurred. The
      # load-bearing path had never run under ruleset "CI Gate".
      - name: Commit-back lane can re-express its work (AH001)
        run: bun src/Core.TypeScript/hygiene/audit-push-without-rebase.ts

      - name: Commit-back lane can actually land (AH002)
        run: bun src/Core.TypeScript/hygiene/audit-skip-token-cannot-land.ts

      # AH003 — the archive lane's record actually reached `main`.
      #
      # The third instance of the same class as the two above, and the most expensive to date.
      # `pr-archive-on-merge.yml` was changed SEVENTEEN times; its recent runs read 12 success
      # / 8 skipped / 0 failures — green, while 1,290 `automation/pr-archive-*` refs sat on the
      # remote. Every check it had asked a PROXY question ("did the tool run", "did I create a
      # PR"), and its sibling `audit-archive-pr-lane.ts` takes `gh pr list` as its input, so it
      # is structurally blind to a ref that never had a PR at all — which is what these were.
      #
      # This one takes REFS as input and asks the only question that is the point: is the
      # record ON MAIN? It runs HERE, on the pre-merge floor and fatal, rather than as the
      # non-fatal warning its sibling gets inside the heartbeat tick. A lane that leaked
      # because one failure was tolerated does not get its falsifier installed as another
      # tolerated failure.
      #
      # It gates on a high-water mark that may only be lowered, so the pre-existing backlog
      # cannot hold the floor red while any NEW strand fails immediately. Deleting a stranded
      # ref does not make it pass — the record is still absent from main.
      - name: Archive lane record reached main (AH003)
        run: bun src/Core.TypeScript/hygiene/audit-orphaned-archive-refs.ts

      # The .NET SDK version is declared in TWO files and, until 2026-08-23, nothing checked
      # that they agreed: `global.json` carried `rollForward: latestPatch` (which reads like
      # automatic security uptake and is not — it only selects among ALREADY-INSTALLED SDKs)
      # while `.mise.toml`, the file that actually acquires the SDK, pinned it exactly. A
      # reader of one believed a property only the other could grant. `.mise.toml` is now the
      # single declared source and `global.json` a checked restatement, so the two can no
      # longer disagree silently. Text-only and offline — it runs where no SDK is installed,
      # unlike its runtime sibling `audit-codeanalysis-sdk-match.ts`, which reads the SDK's
      # own `csc -version` in the build job.
      - name: .NET SDK pin declared once (.mise.toml canonical, global.json restates)
        run: bun src/Core.TypeScript/hygiene/audit-dotnet-pin-parity.ts

      # The `.mise.toml` pins that OTHER files silently depend on. Two couplings, both of
      # which fail by being quiet: a stale `~/.rustup/toolchains/<v>-*` cache glob degrades
      # the offline path to a CDN fetch, a stale `.mise.full.toml` gives full-tier hosts a
      # different compiler from slim ones, and a zig bump leaves the COMMITTED byte-lock
      # `.wasm` unchanged — so the byte-lock still passes while the artifact stops being
      # reproducible from the pinned toolchain. Neither is reachable by a Dependabot
      # `ignore:`: `.mise.toml` is a manifest of no supported ecosystem, so an `ignore:`
      # naming them would suppress nothing while reading as protection. The site list is
      # discovered from the operative surfaces, so a new workflow with a stale glob is
      # caught the day it lands.
      - name: mise toolchain couplings (rust restatements · zig byte-lock provenance)
        run: bun src/Core.TypeScript/hygiene/audit-mise-toolchain-couplings.ts

      # Every zflash host arm must reach the ISO integrity gate before it writes to a block
      # device. Measured on main 2026-08-21: the manifest check existed in the macOS arm and
      # NOWHERE ELSE, so flash-usb-linux.ts and flash-usb-windows.ts wrote an image with no
      # integrity verification at all (081M0HG7X7B087G0R002A05DAP). A missing check is
      # invisible to a test suite — the arms that have one stay green, and the arms that lack
      # one have nothing to test — so only something that reads the call sites can see it.
      #
      # HERE rather than in build-ai-cluster-iso.yml on purpose, and this is the placement
      # that workflow's own note asked for. The ISO lane runs on a subset of pushes, and when
      # this step lived there and referenced a script that did not exist it silently killed
      # ISO production for every run (#13102). On the cross-verify floor it blocks every PR,
      # beside the other audits whose subject is "a check that did not run must never look
      # like a check that passed".
      - name: zflash host-arm parity (every arm verifies the ISO before writing)
        run: bun src/Core.TypeScript/hygiene/audit-flash-entrypoint-parity.ts

      # Every ArgoCD `targetRevision` must name a chart version upstream actually published.
      # Measured on main 2026-08-20: applications/oz pins ziti-controller at 1.4.5, a version
      # OpenZiti never shipped (their 1.x line ends at 1.3.4), so that Application can never
      # sync — invisible because `oz` is one of 26 of 45 Applications no CI lane exercises, so
      # nothing ever asked the registry for the chart (081M0JVD5YG087G0R002QDFR9H, #13313).
      #
      # OFFLINE. It resolves every coordinate against the checked-in snapshot
      # `published-chart-versions.json` and opens no socket, so this step cannot redden a PR
      # because a third-party registry is down — which is the only reason a resolvability
      # check survives past its first outage. The network half is `--refresh`, and it runs on
      # a schedule in chart-version-refresh.yml where it is allowed to fail loudly.
      - name: ArgoCD chart targetRevisions resolve (offline, against the committed snapshot)
        run: bun src/Core.TypeScript/hygiene/audit-chart-target-revisions.ts

      # NO MANIFEST IN THE PUBLIC TREE MAY REFERENCE AN IMAGE NOBODY OUTSIDE CAN PULL.
      # `applications/platform/blueprints-flowdent.yaml` shipped here for months naming
      # ghcr.io/flowdent/cloudservice and ghcr.io/flowdent/fd-webclient -- images out of
      # Flowdent/fd-core (private) and Flowdent/fd-webclient (internal), in an org with
      # public_repos: 0. An agent wrote to the wrong repository in a multi-repo setup and
      # nothing caught it; it took months and a partitioner that could not MEASURE the images
      # to surface it, and a human to remove it (#14250). This is that accident as a red check.
      #
      # Aaron 2026-08-23: "zeta should not have any private repo dependencies." The invariant is
      # ONE-WAY: Flowdent (closed) may depend on Zeta (open); Zeta may never depend on Flowdent.
      #
      # HERE, on the floor that runs on EVERY PR, rather than in k8s-lane-partition.yml: that
      # workflow's path filter watches full-ai-cluster/k8s only, and this check's scope is every
      # tracked YAML outside docs/references/.github -- infra/k8s, agentic-organization/deploy,
      # samples/, and whatever directory the next multi-repo accident lands in. A path filter is
      # exactly the wrong shape for a check whose whole job is to notice a manifest somewhere
      # nobody declared.
      #
      # OFFLINE. It resolves every reference against the committed measurement
      # `full-ai-cluster/k8s/image-source-provenance.json` and opens no socket; the network half
      # is `--refresh` and it runs weekly in chart-version-refresh.yml. MEASURED 2026-08-23:
      # 0.43s, 49 files parsed of 209 scanned.
      - name: No private-source image dependencies (offline, against the committed provenance)
        run: bun src/Core.TypeScript/cluster/image-source-provenance.ts

      # The check above is only worth its slot if it can go red. The suite reconstructs the two
      # FlowDent Blueprints in a throwaway git tree and asserts they are refused with the REMOVE
      # remedy, asserts bitnami/weaviate/ich777/postgres/kubevirt are NOT tripped, and asserts an
      # unresolvable package with no source label is refused rather than admitted. 35 cases;
      # 16 targeted mutants applied and byte-`cmp` verified before reading each result -- 15
      # landed and were all killed, and the 16th reported PATTERN NOT FOUND rather than a
      # result, which is the discipline working.
      - name: Private-source image dependencies — falsifiers (proves it goes red)
        run: bun test src/Core.TypeScript/cluster/image-source-provenance.test.ts

      # ARE THE DEFERRAL REASONS STILL TRUE? Every reasoned-exclusion registry in the cluster
      # tree was audited for a reason being PRESENT and naming a lift condition, and by nothing
      # for the reason being TRUE. Measured twice on 2026-08-21: `temporal`'s reason cited a
      # baseline acknowledgement that had been deleted forty minutes earlier (#13472 -> #13483),
      # and `oz`'s cited a chart pin the tree had already corrected (#13313 -> #13471). Both
      # audits stayed green through both, because a false sentence with a `LIFTS WHEN:` clause
      # has every mechanical property those checks look for.
      #
      # HERE rather than in k8s-argocd-health-test.yml, and the placement is the point: this
      # checker resolves citations into `.github/workflows/` (a CI job a reason names) and into
      # the chart roster, so a PR that renames a job would never trigger a path-filtered cluster
      # workflow and would silently strand the reason that cites it. The cross-verify floor runs
      # on every PR. OFFLINE, ~1s, no sockets -- it reads the committed baseline, the committed
      # render snapshot and the committed roster.
      - name: ArgoCD deferral reasons — every cited anchor still holds (offline)
        run: bun src/Core.TypeScript/cluster/reason-truth.ts

      # A tracked source file holding a raw 0x00 byte reads as BINARY to grep/rg, so every
      # text audit silently skips it -- a check that did not run, looking exactly like one
      # that passed. `rg 'foldChain' key-epoch-ledger.ts` printed "binary file matches" and
      # exit 0 while ten real matches were invisible, in the revocation ledger of all files.
      # The \u0000 escape is byte-identical at runtime and keeps the file searchable, so the
      # rule is total and needs no allowlist. Ten tracked files failed this when written.
      - name: No raw NUL in tracked source (an audit must be able to read the file)
        run: bun src/Core.TypeScript/hygiene/audit-no-raw-nul-in-source.ts

      # Addison Cooper's Genesis concept vocabulary is published as a static page that is
      # hand-copied into a DIFFERENT repository (lucent-financial-group.github.io) — no build
      # step, no CI, nothing connecting it back here. It drifted exactly as you would expect:
      # four society-identity terms landed in docs/GLOSSARY.md on 2026-07-31 and never reached
      # the page, and nobody found out until Aaron asked.
      #
      # docs/CONCEPT-REGISTRY.md is now the single list. This step is what keeps it honest —
      # it fails when the registry and the page disagree in EITHER direction, including a
      # silently reworded definition, which is the case a term-name-only check would miss.
      - name: Concept registry vs published page (docs/CONCEPT-REGISTRY.md)
        run: bun src/Core.TypeScript/hygiene/audit-concept-registry-drift.ts

      # docs/TECH-RADAR.md is 100+ rows of PROSE asserting facts about this repo, and prose
      # rots silently -- which is the whole reason it drifted. Soraya found two on 2026-08-22
      # and both were the same defect: a row asserted something, the repo moved, nothing could
      # notice. `fast-check` was pinned and imported by five test files with NO ROW AT ALL, so
      # the only property-testing row ("FsCheck 3 | Adopt") -- which is .NET -- silently stood
      # in for a TypeScript tool at a different maturity. And two rows cited paths that had
      # moved (tools/alloy/alloy.jar, tools/invariant-substrates/tally.ts).
      #
      # Two mechanically-decidable subclasses, both derived rather than hand-listed:
      #   A. every backticked repo path the radar cites must exist (`(planned)` opts a
      #      proposed artifact out);
      #   B. every root package.json devDependency statically imported by a tracked
      #      *.test.ts must be named in the radar. devDependencies is the MANIFEST's own
      #      declaration of "tooling not product"; "imported by a test" is the proxy for
      #      "part of how we verify". Runtime `dependencies` are deliberately out of scope --
      #      the radar is an evaluation register, not an SBOM, and a check that demanded a row
      #      for `pg` is one somebody disables.
      #
      # HERE on the cross-verify floor because it is offline (~1s, no sockets, reads only
      # committed files) and because the radar is edited by every lane -- a path-filtered
      # workflow would miss the PR that moves the file a row cites. Went red on main when
      # written -- 7 findings: 4 dead paths (specs/Spine.als, tools/alloy/alloy.jar,
      # docs/research/scratch-zeta-parity.md, tools/invariant-substrates/tally.ts) and 3
      # unringed devDependencies (fast-check, quantum-circuit, semver). Green after the
      # corrections, so no baseline file exists (AUDIT-LIFECYCLE.md's cleanup-to-zero path
      # -- the surface is a mutable markdown doc, so the residue was editable).
      #
      # STATED LIMIT: neither check can tell you a RING is wrong. TLA+ sat at Adopt with a
      # dark lane for seven weeks and this audit would have stayed green throughout. Lane
      # liveness is a different measurement.
      - name: Tech radar claims the repo can still support (paths resolve, in-use tools ringed)
        run: bun src/Core.TypeScript/hygiene/audit-tech-radar-claims.ts

      - name: Tech-radar audit unit tests (a check that cannot fail is not a check)
        run: bun test src/Core.TypeScript/hygiene/audit-tech-radar-claims.test.ts

      # A filesystem EXISTENCE test whose result gates a later operation on the same
      # path. Check-then-use; TOCTOU; CWE-367. THREE instances landed on 2026-08-20, in
      # one day, from three INDEPENDENT agents, all in code that had already been
      # written and reviewed: cluster/restricted-namespace-workloads.test.ts
      # (readdir + statSync().isDirectory() + readFileSync),
      # cluster/storage-profiles.ts (existsSync -> readFileSync), and
      # hygiene/audit-chart-target-revisions.ts (three sites in one file). Each was
      # found by CodeQL one at a time, AFTER merge, because nothing in the tree looked
      # for the shape. The pattern READS as defensive and prevents nothing.
      #
      # HERE rather than in codeql.yml on purpose. CodeQL runs on a schedule and
      # reports into the security tab, so its verdict arrives after the merge that
      # caused it -- which is how all three shipped. This step is offline, needs no
      # database build, and blocks the PR.
      #
      # --baseline grandfathers the 288 pre-existing instances measured on main when
      # this landed (AUDIT-LIFECYCLE.md step 5: the gate has to be landable without a
      # 288-file cleanup first). NEW instances fail, and so does an edit that renames
      # the path expression at a grandfathered site. --min-files is the scan floor: an
      # audit that inspected nothing must not report success.
      - name: No check-then-use filesystem races (TOCTOU, CWE-367)
        run: |
          bun src/Core.TypeScript/hygiene/lint-check-then-use-file-races.ts \
            src/Core.TypeScript \
            --min-files 1500 \
            --baseline src/Core.TypeScript/hygiene/lint-check-then-use-file-races.baseline.json

      # Executes mumps_zeta_id.m (subset interpreter). compare.ts already pins
      # the committed JSON; this step runs the routine so a layout edit in the
      # .m file cannot hide behind a stale mumps-output.json.
      - name: Execute MUMPS zeta-id packer
        working-directory: tests/cross-verification/zeta-id
        run: bun run-mumps.ts

      # The six GENERATED bit-layout files vs docs/zeta-id-v1-layout.yaml, which the
      # zeta-id README named as an open hole: "There is no CI gate verifying the .gen
      # files match the YAML, so an edit without regeneration fails nowhere until a
      # codec stops compiling."
      #
      # The oracles above do not close it. compare.ts pins each oracle's COMMITTED
      # output to vectors.yaml, and CI independently re-executes five of the seven
      # (TS `bun test`, F#/C# `dotnet test`, Python `pytest`, MUMPS the step above).
      # Go and Rust are re-executed NOWHERE — this workflow runs only
      # `go test ./algebra/` and `cargo test … Core.Rust.Observe`. So a wrong constant
      # in zeta_id.gen.go or bit_layout.gen.rs sat behind a stale-but-agreeing output
      # JSON with every job green. This step is the independent reproduction for that
      # pair, and for the other four at no extra cost.
      - name: zeta-id generated layouts vs the layout YAML
        run: bun tests/cross-verification/zeta-id/gen-layout-drift.ts

      # Algebra-tower drift-check: the generated law-property tests must be
      # regenerable-identical from their IRs (codegen-law-drift), and the
      # generated laws must hold against the TS oracle instances. Covers the
      # semiring → ring → kleene tower (+ the orthogonal star-ring branch).
      # Pure bun/arithmetic — no go/python spawns (the cross-language law
      # cross-verify is a separate, local/toolchain-heavy lane).
      - name: Algebra-tower drift-check (semiring→ring→kleene + star-ring)
        run: |
          bun test \
            tests/cross-verification/_harness/codegen-law-drift.test.ts \
            tests/cross-verification/_harness/generated-semiring-laws.test.ts \
            tests/cross-verification/_harness/generated-ring-laws.test.ts \
            tests/cross-verification/_harness/generated-star-ring-laws.test.ts \
            tests/cross-verification/_harness/generated-kleene-laws.test.ts

  test-typescript-hermetic:
    # ══ TIER 1 OF 2: HERMETIC ═══════════════════════════════════════════════════════════
    #
    # A RED X HERE MEANS THE CHECKED-OUT SOURCE OR ITS DECLARED TOOLCHAIN BASELINE IS BROKEN.
    # That is the property the tier split was built to establish. Nothing below depends on a
    # venv, a cluster, a container, a physical device, an attached ISO, or the invoking user's
    # home directory. CI declares ubuntu-24.04, pinned Bun, the frozen lockfile, and pinned SMT
    # binaries below; developers realize the broader supported baseline through install.sh.
    # "Hermetic" here is a failure-attribution boundary, not a bit-identical runner image --
    # hosted-image drift remains possible and must be named if it is ever the cause.
    #
    # WHY THE SPLIT. MEASURED 2026-08-16 across the 53 most recent completed `gate` runs:
    # the old undivided `test (TS suite)` was red in 17 of them (32%), and in 15 of those the
    # ENTIRE cause was one deterministic test -- `folderSink -- entropy tracker wiring`, a
    # genuine regression that rode along across sixteen merges because this job sits outside
    # `gate (required)` and a red X nobody must clear is a red X nobody reads.
    #
    # The reason nobody read it was not in CI. MEASURED the same day on a FRESH CLONE of main
    # (macOS, `bun install` only), `bun test` gave 4 failures + 1 unhandled error and ZERO of
    # them were code defects: 4x cross-verify-ir (no Q# venv; no .NET SDK 10.0.302) and 1x
    # esp-inject (EPERM scandir ~/Downloads, thrown at module scope under macOS TCC). So the
    # SAME command was red-for-environment where people work and red-for-regression where it
    # mattered, with nothing in either output separating the two. The prior "this suite is
    # always red" is learned on the laptop and spent on the pull request. Splitting the tiers
    # is how that prior is retired: after this change, red here is red everywhere, for the
    # same reason.
    #
    # WHAT MOVED, AND WHERE IT WENT. Exactly the two files above, to
    # `test (TS environment-dependent)` below -- which still runs on every PR. Each is
    # declared with the NAME of the dependency it needs in
    # registry/environment-dependent-test-files.json, and
    # src/Core.TypeScript/hygiene/environment-dependent-test-files.ts is red if an exclusion
    # is undeclared, unattributed, or reached by no lane at all. Excluding a file from this
    # tier while nothing else runs it would be a deletion wearing a split's face; that is the
    # condition the checker exists to make unlandable.
    #
    # PROMOTED 2026-08-25. This job is in the `gate-required` needs list under explicit
    # maintainer consent. The promotion is a floor amendment, not just a dependency edit;
    # registry/uncompensatable-floor.yaml and the drift-and-heal ADR record its rationale
    # and its narrow whole-tree exception to the usual diff-scoped rule.
    #
    # THE GAP THIS CLOSES. Before this job, CI executed roughly 130 of the repo's 900-plus
    # `*.test.ts` files. Whole directories -- discovery/, planning/, browser-node/,
    # ferry-throttler/, model-backend/, oracle/, forge-host/ -- were never executed by any
    # workflow, so a PR touching them went green having run zero of their tests. Three live
    # instances on 2026-08-13 alone: a 32-test chaos harness whose four deliberately-pinned
    # known-broken behaviours were inert; the independent check that falsified a proposed
    # light-time remedy, never re-run; and a freshly-merged 21-test migration alongside a
    # drift gate referenced by no workflow, while main sat in drift and nothing reported it.
    # zflash-harness-lint.yml states the rule: a green check that implies more than it tested
    # is worse than no check. Work-item 081KZYPHESJ087G0R002EZ7A2H.
    #
    # WHY A BARE `bun test` AND NOT A LIST OF DIRECTORIES. Every filter list is a fresh copy
    # of the same defect: forge-host/ fell outside the previous globs precisely because
    # someone had to remember to add it. A bare invocation cannot have that bug -- a new
    # directory is covered the moment it exists. Deliberate exclusions therefore live in
    # exactly one place, the pathIgnorePatterns of a bunfig, and each one must carry a
    # written reason in a registry.
    # hygiene/unexecuted-test-files.ts enforces both halves and fails on an undeclared,
    # unreasoned, or stale entry.
    #
    # `--config=bunfig.hermetic.toml` DOES NOT BREAK THAT RULE, for the same reason: it is still a
    # bare, filter-less invocation, and the tier's exclusions are still a written list in a
    # bunfig under a registry-backed checker. bun has no exclude-filter form, so a second
    # config is the only way to say "everything except these" without reintroducing the
    # include-list defect. bunfig.hermetic.toml is asserted to be a strict superset of
    # bunfig.toml on every PR, so the two cannot drift apart in silence.
    #
    # WHY A SEPARATE JOB rather than a step inside `lint (TS)`. That job type-checks; folding
    # behaviour into it puts two different failures behind one red X, which is the attribution
    # problem the 2026-06-13 per-language lint split already solved once here. It also carries
    # a 12-minute cap sized for tsc, while this suite measured 256-346s locally on its own.
    #
    # WHY NOT SPLIT ACROSS PARALLEL JOBS. Per-job fixed cost here is the install.sh bootstrap
    # plus `bun install` -- 1-2 minutes even on a cache hit -- against roughly 7 minutes of
    # actual test time. N jobs multiply the fixed cost for a wall-clock saving that does not
    # pay. Revisit if the suite passes about 10 minutes.
    #
    # COST. About 9 minutes per run (setup plus tests) on ubuntu-24.04 at the 1x multiplier;
    # at roughly 250 gate runs per month that is on the order of 2,250 runner-minutes added.
    # It buys execution of ~770 files and ~9,000 assertions that today execute nowhere.
    #
    # RUNS AND BLOCKS. The probation period produced the evidence the original split asked
    # for. PR #15352 merged with this job FAILURE beside a successful required rollup: a cold
    # Go compiler invocation exceeded a shared 15-second generated-code timeout, while the
    # durable outputs were never written. PR #15358 repaired that real repository defect,
    # but merged five minutes BEFORE this job reported success because the rollup did not
    # depend on it. PR #15395 then supplied a second post-repair green run before merge.
    # The environment-dependent tier remains non-blocking; only this dependency-closed,
    # reproducible behavior suite enters the floor.
    name: test (TS hermetic)
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The hermetic tier is deliberately JavaScript-first. Its explicit SMT
      # binary realizer remains below; the full apt/mise workstation graph is
      # not an input to this suite and repeatedly consumed the job budget before
      # any hermetic assertion ran.
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install JavaScript dependencies from the locked graph
        run: bun install --frozen-lockfile

      # NO `uv sync` STEP HERE, ON PURPOSE. It provisioned the gitignored Q# venv at
      # src/Core.Python/.venv for cross-verify-ir, which is the single largest reason a
      # laptop run of this suite came back red: 4 of the 5 failures on a fresh clone. That
      # file now runs in `test (TS environment-dependent)`, which does the uv sync, and in
      # full-verify, which is in the required floor. A tier whose green depends on a venv
      # the reader has never created cannot be the tier whose red means a regression.

      - name: Verify npm devDependencies are installed
        # Several suites import devDependencies directly (z3-solver among them) and
        # assert-dont-skip when the dep is absent, so a missing install reads as a real
        # failure rather than a skip. The preceding frozen-lockfile install is the
        # sole dependency realization for this narrow job.
        run: test -d node_modules

      - name: Pin z3 4.16.0 and cvc5 1.3.4 (081KZZ27KJ8)
        # apt on ubuntu-24.04 is z3 4.8.12 / cvc5 1.1.2; two SMT certificates
        # soft-skip under that pair. Checksummed GitHub-release binaries go in
        # ~/.local/bin. No-op when PATH already meets the floor.
        run: bun src/Core.TypeScript/ace/setup-realizers/install-pinned-smt.ts

      - name: Verify light-time endpoint-speed envelope certificates
        # The Lean module is reached by the F# build. This companion TypeScript test
        # executes the Z3 outcome sequence and the independent ephemeris fault control;
        # neither may be a documentation-only proof artifact.
        run: bun test src/Core.TypeScript/planning/light-time-endpoint-speed-envelope.test.ts src/Core.TypeScript/planning/orbital-independent-check.test.ts

      - name: Tier manifest (what the hermetic tier deliberately does not run, and why)
        # Printed BEFORE the suite, pass or fail, so the log states the tier's own boundary
        # instead of leaving a reader to infer it from an absence. It also exits non-zero on
        # an undeclared, unattributed, or run-nowhere exclusion, which is the guard that
        # keeps the split from becoming a quiet mute list.
        run: bun src/Core.TypeScript/hygiene/environment-dependent-test-files.ts

      - name: Whole TypeScript suite (hermetic tier)
        # No path filters: see the header. Exclusions live in bunfig.hermetic.toml, and each
        # one is declared with a reason in registry/unexecuted-test-files.json (runs nowhere)
        # or registry/environment-dependent-test-files.json (runs in the tier below).
        run: bun --config=bunfig.hermetic.toml test

  test-typescript-environment:
    # ══ TIER 2 OF 2: ENVIRONMENT-DEPENDENT ══════════════════════════════════════════════
    #
    # A RED X HERE MEANS EITHER a real regression OR that this runner could not provide a
    # dependency the test needs. That ambiguity is exactly why these files are not in the
    # tier above -- it is not removed, it is CONCENTRATED, into a job whose name says so and
    # whose manifest names every dependency involved. Two red X's that mean different things
    # are readable; one red X that means either is not, and that was the state this replaced.
    #
    # THIS IS NOT A DUMPING GROUND, AND THE CHECKER MAKES THAT STRUCTURAL. Every file listed
    # below must appear in registry/environment-dependent-test-files.json with a non-empty
    # `dependency` naming the concrete missing thing (an SDK version, a venv, a device) and a
    # `reason` for why it cannot be assumed present. hygiene/environment-dependent-test-files
    # .ts is red if a hermetic-tier exclusion is undeclared, unattributed, listed in BOTH
    # registries, or -- the load-bearing one -- executed by no pull_request-lane invocation.
    # Moving a flaky test here to make it quiet does not work: it still runs, still here,
    # still red, and now with your name on the reason.
    #
    # WHY NOT `continue-on-error`. It renders a job green while it failed. An absent check
    # and a passing check must not look alike; that is the same defect as the one this whole
    # split exists to fix, so this job reports honestly and is simply not in the floor.
    #
    # THE FILE LIST IS EXPLICIT, unlike the tier above. Here that is correct rather than the
    # include-list defect the header of that job warns about: this is a hand-curated
    # exception set by construction, and the derivation in hygiene/environment-dependent-test
    # -files.ts reads THIS list out of the workflow to prove each registry entry actually
    # runs. A file silently dropped from this list becomes an "excluded from hermetic and run
    # by nothing" finding on the next PR.
    #
    # COST. Two files, seconds of test time; the minutes are the shared install.sh bootstrap
    # plus the uv sync that the hermetic tier no longer pays for.
    name: test (TS environment-dependent)
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
            ~/.rustup/toolchains/1.87.0-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
            ~/.cache/zeta/from-autotools-tarball/*.tgz
          key: install-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'tools/setup/**', 'global.json', '!tools/setup/persona-keys/**', '!tools/setup/op-token-setup.*', '!tools/setup/secret-clip.sh', '!tools/setup/manus-smoke-test.ts', '!tools/setup/build-lumen-persona-package.ts') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        # Same retry rationale as every other install.sh step in this file
        # (Aaron 2026-04-28 PR #23 mise+bun-1.3.13 502).
        env:
          # TIER DECLARED, not detected. This job genuinely needs the wider payload:
          # environment-dependent tests are gated on the wide toolchain by design; the payload has not been measured down.
          # Recorded explicitly so the next reader sees a decision rather than a default;
          # audit-install-tier-declared.ts refuses silence, never a particular tier.
          ZETA_HOST_TIER: full
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if ./tools/setup/install.sh; then exit 0; fi
            [ "$attempt" = "5" ] && { echo "install.sh failed after 5 attempts"; exit 1; }
            case "$attempt" in
              1) backoff=10 ;;
              2) backoff=30 ;;
              3) backoff=60 ;;
              4) backoff=120 ;;
            esac
            echo "install.sh attempt $attempt failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
          done

      - name: QDK venv setup (uv sync)
        # The dependency that makes cross-verify-ir environment-dependent, provided here and
        # nowhere else in the TS lane. Same step full-verify runs, for the same reason: the
        # Q# lane executes through src/Core.Python/.venv/bin/python3 — a gitignored venv, not
        # a PATH tool. Without it that lane cannot run, and until the per-route floor landed
        # it went dark SILENTLY: six of seven lanes satisfied an aggregate `>= 6` floor on the
        # seventh's behalf, so the job reported a 7-language byte-lock it never checked. The
        # floor now names a dark lane and fails. uv comes from install.sh above.
        run: uv sync --project src/Core.Python

      - name: Install npm devDependencies
        run: bun install --frozen-lockfile

      - name: Tier manifest (which dependency each file below needs)
        run: bun src/Core.TypeScript/hygiene/environment-dependent-test-files.ts

      - name: Environment-dependent tests
        # Every path here is an entry in registry/environment-dependent-test-files.json, and
        # the checker above fails if a registry entry is not reached by an invocation in a
        # pull_request lane — i.e. if someone excludes a file from the hermetic tier and
        # forgets to add it here.
        run: |
          bun test \
            tests/cross-verification/_harness/cross-verify-ir.test.ts \
            src/Core.TypeScript/zflash/esp-inject.test.ts

  # ═══════════════════════════════════════════════════════════════════
  # Full Verification Gate — 7-language oracle + cost + proofs
  # ═══════════════════════════════════════════════════════════════════
  #
  # Runs the LIVE cross-language execution oracle (generates code in 7
  # languages, compiles each, executes, byte-compares outputs) plus the
  # algebraic law gate, cost analysis, and Rust/Go compilation.
  # Requires the FULL toolchain (all 7 runtimes + E-prover).
  # Fails if ANY tool is missing — no partial verification.
  full-verify:
    name: full-verify (7-lang oracle + cost + proofs)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: [path-filter]
    if: needs.path-filter.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + cargo + dotnet)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
            ~/.rustup/toolchains/1.87.0-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
            ~/.cache/zeta/from-autotools-tarball/*.tgz
          key: full-verify-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'tools/setup/**', 'global.json', '!tools/setup/persona-keys/**', '!tools/setup/op-token-setup.*', '!tools/setup/secret-clip.sh', '!tools/setup/manus-smoke-test.ts', '!tools/setup/build-lumen-persona-package.ts') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain (all 7 languages + E-prover)
        env:
          # TIER DECLARED, not detected. This job genuinely needs the wider payload:
          # the 7-language oracle: emscripten and llvm are tier=standard, and .mise.full.toml carries the k8s/WASM set that only tier=full merges.
          # Recorded explicitly so the next reader sees a decision rather than a default;
          # audit-install-tier-declared.ts refuses silence, never a particular tier.
          ZETA_HOST_TIER: full
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if ./tools/setup/install.sh; then exit 0; fi
            [ "$attempt" = "5" ] && { echo "install.sh failed after 5 attempts"; exit 1; }
            backoff=$((attempt * 30))
            echo "install.sh attempt $attempt failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
          done

      - name: QDK venv setup (uv sync)
        run: uv sync --project src/Core.Python

      - name: Python tests (Core.Python — incl. T-1/12 + Brownian-experts lemma gate)
        run: uv run --project src/Core.Python pytest src/Core.Python/tests -q
        timeout-minutes: 5

      - name: Smoke check (all 7 toolchains functional)
        run: CI=true ./tools/setup/common/smoke-7-toolchains.sh

      - name: Install npm devDependencies
        run: bun install --frozen-lockfile

      - name: Rust tests (Core.Rust.Observe)
        run: cargo test --manifest-path src/Core.Rust.Observe/Cargo.toml

      - name: Go tests (Core.Go/algebra)
        run: go test ./algebra/
        working-directory: src/Core.Go

      - name: Cross-verify IR (7-language byte-lock oracle)
        run: bun test tests/cross-verification/_harness/cross-verify-ir.test.ts
        timeout-minutes: 5

      # The COMPLEMENT of the step above, not a duplicate of it. That one proves the
      # generated lanes agree WITH EACH OTHER, which a wrong IR satisfies just as well
      # as a right one — N lanes generated from one spec agreeing is one observation
      # counted N times. This one diffs the generated code against the HAND-WRITTEN
      # ports, which are the independent oracle, and so is the only thing here that can
      # falsify IR *adequacy*. It also fails by name on any IR-carrying primitive that
      # has no hand-written port at all.
      - name: IR-generated vs hand-written (independent-oracle check)
        run: bun test tests/cross-verification/_harness/ir-vs-handwritten.test.ts
        timeout-minutes: 5

      - name: Interface law oracle (per-directory)
        run: bun test tests/cross-verification/zeta-ir-v2/interfaces/cross-verify-interfaces.test.ts
        timeout-minutes: 5

      - name: Law proof gate (proof references exist + tests pass)
        run: bun test tests/cross-verification/_harness/law-proof-gate.test.ts
        timeout-minutes: 3

      - name: Cost tests (counter + envelope + growth)
        run: |
          bun test src/Core.TypeScript/algebra/cost-counter.test.ts
          bun test src/Core.TypeScript/algebra/cost-envelope.test.ts
          bun test src/Core.TypeScript/algebra/cost-growth-property.test.ts

      - name: Clifford cross-verify (Cl(3,0) geometric algebra)
        run: bun test tests/cross-verification/_harness/codegen-clifford.test.ts

      # The Cayley-Dickson -> maximal-order ladder (A2 / D4 / E8). Wired HERE, and not left
      # sitting in src/ as an unrun file, because #14914 measured that a test nothing invokes
      # reads exactly like a passing one. Two prior reviews of this material (#15415, #15417)
      # both self-labelled `unmetered` for precisely that reason: their arithmetic lived in a
      # scratch worktree and nothing in the tree went red if it was wrong. This step is what
      # makes the successor document's numbers falsifiable -- the octavian completion count
      # (3, not 1), the six S_3 gluings, the split-condition witness, and the rank-16 control.
      # Runtime ~35s; the slow cases carry explicit per-test timeouts (bunfig's cap is 5000ms).
      - name: CD order ladder (banana-split factorisation falsifiers)
        run: bun test src/Core.TypeScript/research/banana-split/cd-order-ladder.test.ts
        timeout-minutes: 5

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            PRIORITY="normal"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              PRIORITY="elevated-unattended"
            fi
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{
                \"text\": \"🚨 full-verify FAILED ($PRIORITY)\",
                \"blocks\": [{
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Job:* ${{ github.job }}\\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\\n*Trigger:* ${{ github.event_name }}\\n*Priority:* $PRIORITY\"
                  }
                }]
              }"
          fi

  # ═══════════════════════════════════════════════════════════════════
  # Merge Gate Roll-up — the ONE required status check for branch protection
  # ═══════════════════════════════════════════════════════════════════
  #
  # Branch protection requires a SINGLE status check name that always reports
  # (never skipped). This job collects the results of all blocking jobs and
  # reports pass/fail. Conditional jobs (full-verify, build-and-test) may be
  # skipped on docs-only PRs — that's fine (skipped = success here). But if
  # they RAN and FAILED, this job fails too, blocking merge.
  #
  # To enable: Repository Settings → Branches → main → Require status checks
  # → add "gate (required)" as the sole required check.
  gate-required:
    name: gate (required)
    runs-on: ubuntu-24.04
    # Was 1 minute, when this job was three seconds of `grep` over `toJSON(needs)`.
    # The scope summary below adds a sparse checkout, setup-bun, and one Actions-API
    # call. MEASURED on the first live run of this job's new shape (run 32207501412
    # attempt 2, job 95940135217): 12 s total -- checkout 2 s, setup-bun 2 s, summary
    # 3 s, verdict 0 s. The pre-land ESTIMATE in the landing PR was ~20 s, priced off
    # the ~11 s full checkouts the other jobs in this workflow take; the sparse +
    # `filter: blob:none` checkout is what closed the gap, and the number is corrected
    # here rather than left as the guess. So the whole cost of making this check say
    # what it covered is ~9 s per run.
    # 5 is a RUNAWAY CAP, not a budget: nothing in this job retries, polls, or waits
    # on anything that can hang open.
    timeout-minutes: 5
    if: always()
    # Job-scoped least privilege. The workflow default is `contents: read` and no
    # other job elevates; this one adds exactly one read scope for one call:
    #   contents: read -- sparse checkout of the summary script + this file
    #   actions:  read -- GET /actions/runs/<THIS run>/jobs, the only source of
    #                     PER-MATRIX-LEG results. The `needs` context collapses a
    #                     whole matrix to one value, which is precisely what kept the
    #                     Windows legs invisible. No write scope, no other repo, no
    #                     other run.
    permissions:
      contents: read
      actions: read
    # Machine-readable scope, so "which green was this" is answerable without
    # scraping a log. Empty when the summary step could not run -- see the
    # `continue-on-error` note on it.
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      floor-executed: ${{ steps.scope.outputs.floor-executed }}
      floor-skipped: ${{ steps.scope.outputs.floor-skipped }}
      nonblocking-failures: ${{ steps.scope.outputs.nonblocking-failures }}
    # ── THE FLIP (drift-and-heal ADR, Aaron 2026-08-01): blocking gates are
    # corporate mode; drift checks are sovereign mode. The gate now rolls up
    # ONLY the recorded floor (registry/uncompensatable-floor.yaml):
    #   - build-and-test             (functional build/test breaks)
    #   - test-typescript-hermetic   (dependency-closed TypeScript behavior breaks)
    #   - cross-verify/full-verify   (treaty byte-lock golden vectors)
    #   - lint [semgrep]             (workflow supply-chain / script-injection)
    #   - lint-typescript            (TypeScript type breaks)
    # Every hygiene/style lint below STILL RUNS on every PR and every main
    # push — that is the drift detection — it just no longer blocks unrelated
    # lanes (the 2026-07-08 priority inversion / 2026-08-01 six-rebuild race).
    # In-scope authors get their signal from the job's own red X and from
    # hygiene/scoped-lint.ts locally; heals converge via certified healers
    # (hygiene/healer-harness.ts). Re-adding a job to this list = adding to
    # the floor = treaty-amendment consent path.
    #
    # ── AMENDMENT 2026-08-17 (Aaron, explicit: "yes add lint (TS) to the
    # required floor"). `lint-typescript` re-enters the floor. The consent path
    # named above is why this comment exists rather than a silent list edit.
    #
    # ── AMENDMENT 2026-08-19 (Aaron, explicit: "we are moving away from anything
    # that blocks into drift checks instead"). SUBTRACTION this time, via the same
    # consent path: the `build-and-test` entry below stays in the floor but its
    # PLATFORM coverage narrows to Linux. The macOS leg joins the Windows legs under
    # `continue-on-error`, so a macos-26 build or test failure now reaches this
    # rollup as success. The needs: list is unchanged — what changed is inside the
    # matrix, which is exactly why the `Emit scope` step below exists: it names any
    # leg that failed non-blockingly, so a green here still says which green it is.
    # registry/uncompensatable-floor.yaml records the narrowed coverage in data.
    #
    # ── AMENDMENT 2026-08-25 (Aaron, explicit: "lets try to get your hermetic
    # suite in and if we need to update drift policies do so").
    # `test-typescript-hermetic` enters the required floor after its probationary
    # non-blocking period. This is intentionally a narrow whole-tree exception to
    # the diff-scoped default: the suite is dependency-closed and reproducible, and
    # its bare `bun test` invocation is what prevents new test directories from
    # falling outside CI. The environment-dependent tier remains drift-only.
    #
    # The evidence is this job's own header, twenty lines up from its `name:`:
    # it was created because "Slice 9 (PR #882) shipped a real TS2322 to main",
    # and it says "codified rules (tsconfig strict mode) without a gate aren't a
    # control." It was then taken off the blocking list by the drift-and-heal
    # flip — and on 2026-08-17 the identical class recurred, same error code:
    # TS2322 in `installer/usb-iserial-probe.ts` plus six TS2300s in
    # `zflash/test-harness/run.test.ts`, live on main, while `gate (required)`
    # reported SUCCESS (measured on PR #11268, merged 02:05:47Z with
    # `lint (TS)` FAILURE alongside a green gate).
    #
    # HONEST SCOPE — this does NOT close the case that produced it. Both PRs
    # behind the 2026-08-17 breakage were individually green; the duplicate
    # import existed only in the MERGED tree. A pre-merge floor checks each
    # branch against main-as-it-was, so a two-PR semantic collision is out of
    # its reach by construction. What this DOES close is the single-PR case: a
    # branch carrying its own type error can no longer merge past a red
    # `lint (TS)`. The collision class needs a merge queue, not a bigger floor,
    # and is deliberately left open here rather than papered over.
    #
    # Register note: the registry derives the floor as the ERASURE class, and a
    # type error is not erasure — it is fully reconstructible. This entry is
    # admitted on the adjacent `scoped-build-test-break` rationale (a break
    # downstream lanes consume this tick), not on erasure. Stated so the
    # registry's derivation stays honest rather than being quietly widened.
    #
    # ── WHICH GREEN IS THIS? (2026-08-19) ─────────────────────────────────────────
    # Treating `skipped` as success is correct -- the path filter legitimately skips
    # `full-verify` and the .NET build/test steps on a docs-only PR. But it made this
    # check's SUCCESS TWO-VALUED while publishing neither value: a green here is
    # either the full seven-language byte-lock or a materially smaller run, and to
    # anything reading check status -- including armed auto-merge, which is how most
    # things land here -- WALL-CLOCK DURATION WAS THE ONLY THING TELLING THEM APART.
    # That is the vacuity class at the rollup level: a check that did not run looks
    # exactly like a check that passed.
    #
    # The `Emit scope` step below therefore publishes WHICH floor jobs executed, which
    # were skipped, which steps were skipped inside the ones that ran, and which legs
    # failed non-blockingly -- to the step summary, to a warning/notice annotation, and
    # to this job's outputs. Skipping stays legitimate and nothing new blocks; the
    # green now carries its own scope.
    #
    # ── A SKIPPED FLOOR JOB IS TWO DIFFERENT FACTS (2026-08-26) ───────────────────
    # The verdict step below used to be one grep for `failure|cancelled`, which made
    # `skipped` count as success. That is right for the path filter and wrong for the
    # OTHER thing that produces the same word: GitHub marks a job `skipped` when a job
    # it `needs:` did not succeed. So a red `path-filter` skipped BOTH `build-and-test`
    # and `full-verify`, and this check -- the sole required status, the one branch
    # protection consults -- reported SUCCESS with its two heaviest subjects never run.
    # Exactly the vacuity class this job's own header names, at the most expensive
    # possible place for it to sit.
    #
    # `matrix-setup` and `path-filter` join the list below for that reason, and only
    # that reason: `gate-skip-verdict.ts` cannot tell "the path filter said docs-only"
    # from "the path filter is dead" unless the roll-up can see the path filter's own
    # result, and `needs:` is the only channel that carries it.
    #
    # SAY PLAINLY WHAT THIS COSTS, because it is a change to what blocks. Since #15504
    # `gate-blocking-floor.ts` has DERIVED these two as inside the floor (transitively,
    # via `build-and-test`) -- but that derivation described the intent, not the
    # runtime, and the runtime disagreed: a red `path-filter` produced a GREEN gate.
    # So this is not merely making a fact visible. A red `matrix-setup` or `path-filter`
    # now blocks, where it previously did not. That is the fix, stated as an addition
    # rather than smuggled in as a clarification.
    #
    # What is NOT changed: no hygiene lint, no drift job, and no `continue-on-error`
    # leg gains blocking power. The uncompensatable floor above is untouched, and its
    # treaty-amendment consent path is not being used here -- these two jobs are the
    # floor's own prerequisites, not new members of it.
    needs:
      - matrix-setup
      - path-filter
      - build-and-test
      - lint
      - lint-typescript
      - cross-verify
      - full-verify
      - test-typescript-hermetic
    steps:
      # Sparse: two paths, no blobs, one commit. The full checkout other jobs take
      # measures ~11 s here; this one has no reason to pay for 36k files.
      - name: Checkout (summary script + this workflow only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src/Core.TypeScript/ci/gate-scope-summary.ts
            src/Core.TypeScript/ci/gate-blocking-floor.ts
            src/Core.TypeScript/ci/gate-skip-verdict.ts
            .github/workflows/gate.yml
          sparse-checkout-cone-mode: false

      # Bun only -- the summary script imports nothing but node built-ins, so this job
      # never runs install.sh (~2-4 min) for a ~1 s render.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Emit scope -- which floor jobs actually ran
        id: scope
        # OBSERVABILITY ONLY, AND DELIBERATELY NON-FATAL. The verdict is the next step
        # and its logic is untouched; this one must never be able to turn a green gate
        # red (or a red one green) because a summary failed to render or the API
        # hiccuped. A failure here shows as a visible red step inside a job whose
        # conclusion is still decided below.
        continue-on-error: true
        env:
          # The AUTHORITATIVE floor list: this is literally the `needs:` block above,
          # keyed by job id, with each result. Adding or removing a floor job updates
          # the summary with no edit to the script -- there is no second copy to drift.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[]' \
            | bun src/Core.TypeScript/ci/gate-scope-summary.ts

      - name: Check all gate jobs
        env:
          # Same value as above; printed by NAME here so the per-job verdict survives
          # even if the summary step could not run. `needs.*.result` (used below,
          # unchanged) is an unlabelled array -- it is what makes the verdict correct
          # and what made it unreadable.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # A job result is one of: success, failure, cancelled, skipped.
          #
          # `failure` and `cancelled` block, exactly as they always have. `skipped` is
          # the two-valued one, and the verdict script separates its two producers by
          # reading gate.yml: a skip is acceptable ONLY when the job declares a
          # job-level `if:` (a licence to skip -- `full-verify`'s path filter) AND
          # every job it `needs:` reported success. A `skipped` with a dead prerequisite
          # behind it now fails, which is the hole this closes.
          #
          # NOT a shell one-liner, deliberately: the rule needs gate.yml's own `needs:`
          # and `if:` declarations, and the alternative is a hand-written roster of
          # "jobs allowed to skip" that drifts silently in the permissive direction.
          # Falsifiers, including the mutation cases, live in gate-skip-verdict.test.ts.
          bun src/Core.TypeScript/ci/gate-skip-verdict.ts \
            --gate-yml .github/workflows/gate.yml

  # ═══════════════════════════════════════════════════════════════════
  # Drift, made LOUD — and still blocking nothing
  # ═══════════════════════════════════════════════════════════════════
  #
  # Aaron 2026-08-23: "we want drift to be LOUD so the red is immediately noticed, not a
  # whisper — just not blocking."
  #
  # NOTHING BELOW CHANGES WHAT BLOCKS. `gate (required)`'s `needs:` list is untouched,
  # the windows/macOS `continue-on-error` flag is untouched, and every hygiene lint keeps
  # exactly the (non-)blocking status it had. Adding either job below to the floor would
  # be a treaty amendment and is deliberately not done here.
  #
  # WHAT IT DOES CHANGE is that "non-blocking" stopped meaning "unnoticed". Measured
  # 2026-08-23 over every completed `gate` push run on main across 5.5 days (600 runs,
  # 368 cancelled before anything ran, 232 inspected): **124 job failures sat beside a
  # green `gate (required)`**, and only **32 of the 124 (26%)** reach any rate surface —
  # `platform-drift-report.ts` folds only names starting `build-and-test (`, so the
  # largest absorber, `test (TS hermetic)` at 47, is folded by nothing. Census committed
  # at src/Core.TypeScript/ci/fixtures/absorbed-failure-census-2026-08-23.json.
  # Worse, step-level `continue-on-error`
  # produces a GREEN job with a red step inside, which every one of those surfaces is
  # blind to by construction because they all read a JOB conclusion. Worst, the two
  # surfaces that carry drift over TIME had both stopped landing: `drift-sweep.yml`'s
  # push to main has been rejected by the "CI Gate" ruleset since 2026-08-13 and is
  # swallowed as a "push race", so 1,597 sweep runs concluded `success` while
  # `docs/drift-events/` stayed frozen at tick 000247.
  #
  # So loud lives in the RUN, where nothing has to be published for it to be seen: a red
  # X on a non-floor job, plus ::error::/::warning:: annotations, plus a step summary.
  # Full reasoning, the bands, and the anti-cry-wolf design: src/Core.TypeScript/ci/drift-loud.ts.

  # The specimen. One step fails on purpose, under `continue-on-error`, on every run,
  # forever — so this job concludes SUCCESS with a failed step inside. That is an exact
  # instance of the class that had no detector, and `drift-loud` below is required to
  # find it. If step-level detection ever breaks, the canary goes missing and the
  # reporter goes red with DETECTOR WENT QUIET.
  #
  # This is not decoration and it is not a test double: it is the falsifier that keeps an
  # observability layer from becoming the next thing that quietly stopped working — the
  # class this repo has now rediscovered three times. Do not "fix" the failing step.
  #
  # IT PAID FOR ITSELF ON ITS FIRST RUN (run 32651748761, 2026-08-23). `drift (loud)`
  # went red with DETECTOR WENT QUIET while this job was running two feet away, because
  # the REST jobs API reports a swallowed step's conclusion as `success` — the failing
  # step above reads `"conclusion": "success"` in
  # GET /actions/runs/32651748761/jobs. `outcome` is workflow-local and not on the REST
  # payload at all, so the class is not merely unsurfaced, it is UNREPRESENTABLE in the
  # data every earlier surface reads. The note further up this file that "the API reports
  # a continue-on-error leg's conclusion as `failure`" is true of JOBS and false of STEPS.
  # The channel that does carry it: GET /check-runs/97224512630/annotations returns
  # `annotation_level: "failure"` on a check run whose conclusion is `success`. That is
  # what the reporter reads now. A test would not have found this — only a live specimen
  # against the live API could.
  drift-canary:
    name: drift-canary
    runs-on: ubuntu-24.04
    # A runaway cap, not a budget: this job runs two `echo`s.
    timeout-minutes: 5
    if: always()
    steps:
      # The step name is load-bearing — `drift-loud` reports it verbatim, and the test
      # fixture in drift-loud.test.ts uses the same string.
      - name: drift canary -- deliberate non-blocking failure
        continue-on-error: true
        run: |
          echo "This step fails on purpose. It is the live specimen of a step-level"
          echo "continue-on-error swallow: this JOB will conclude success anyway, with"
          echo "no red X anywhere, which is exactly the class that had no detector."
          echo "The 'drift (loud)' job below must find it. If it does not, that job goes"
          echo "red — silence is what fails the check. See src/Core.TypeScript/ci/drift-loud.ts."
          exit 1
      - name: Explain the green
        run: |
          echo "This job's conclusion is SUCCESS and a step inside it FAILED."
          echo "That is not a bug here; it is the measurement."

  # The reporter. Reads the current run plus a BOUNDED window of recent completed `gate`
  # runs on main, classifies every absorbed failure, and is loud in proportion to how
  # persistent the drift is.
  drift-loud:
    name: drift (loud)
    runs-on: ubuntu-24.04
    # Was priced off `gate-required`, which measures ~12 s with the same sparse-checkout
    # + bun shape. This one adds up to ~60 Actions API calls, so 10 is a RUNAWAY CAP:
    # nothing here retries, polls, or waits on anything that can hang open.
    timeout-minutes: 10
    # `always()` — the whole point is to report when something went wrong, so a failed
    # floor job must not skip the surface that explains it.
    if: always()
    # `gate-required` is the last job in the workflow, so needing it is how this job
    # waits for everything else to reach a conclusion without enumerating a `needs:`
    # list that would drift from the real job set. It does NOT make this job part of
    # the floor — `needs` is a dependency edge, and only `gate-required`'s OWN `needs:`
    # list defines what blocks.
    needs: [gate-required, drift-canary]
    permissions:
      contents: read
      # One scope, for one call: GET /actions/runs/*/jobs, the only source of PER-STEP
      # conclusions. `needs` collapses a matrix to one value and never carries steps at
      # all, which is precisely what kept the step-level class invisible.
      actions: read
    steps:
      - name: Checkout (reporter + ledger only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src/Core.TypeScript/ci/drift-loud.ts
            src/Core.TypeScript/ci/verdict-drought.ts
            data/platform-drift.json
          sparse-checkout-cone-mode: false

      # Bun only — the reporter imports nothing but node built-ins, so this job never
      # runs `bun install` (~2-4 min) for a ~30 s fold.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Report drift, loudly
        # NO `continue-on-error` here, and that is the entire point of the job. A
        # non-zero exit is the LOUD signal Aaron asked for: it paints a red X on
        # `drift (loud)` in the checks list, next to a green `gate (required)`.
        #
        # It blocks nothing. `gate (required)` is the sole required status check
        # (Settings → Branches → main), its `needs:` list above does not contain this
        # job, and armed auto-merge reads required checks only. Verified against the
        # live API on the Windows legs, which have concluded `failure` beside a green
        # required check 11 times without stopping a merge.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          bun src/Core.TypeScript/ci/drift-loud.ts \
            --repo "$REPO" --run-id "$RUN_ID" --window 60 \
            --ledger data/platform-drift.json

      # THE SECOND HALF OF THE SAME QUESTION, and the half that had no detector at all.
      #
      # `drift-loud` above asks "which failures were absorbed?" -- a question about runs
      # that EXECUTED. It is silent, by construction, about a `main` on which nothing
      # executed: hand it a window of 60 cancelled runs and `subjects` is empty,
      # `sustained` is empty, and it prints `EXIT 0 -- no sustained drift`. It is not
      # wrong; it is reporting on a measurement that never happened.
      #
      # Measured 2026-08-23T17:35Z: the last SUCCESS on main was 10fbd9a4, 16:29:06Z ->
      # 16:43:22Z, ~52 minutes and ~20 commits earlier; of the last 8 gate runs, 6 were
      # cancelled and 2 were still running. `gate.yml`'s concurrency group cancels the
      # in-flight run on every merge, three merges landed inside 24 seconds, and a full
      # gate takes ~14 min -- so merges outran the gate by roughly an order of magnitude
      # and the commits in between carry NO verdict at all. `cancelled` reads as neither
      # pass nor fail, so nothing anywhere reported it.
      #
      # NOTHING ABOUT THE POLICY IS CHANGED HERE. The concurrency group, a merge queue,
      # and the flush cadences are the three options on the table and choosing between
      # them is a human call. This step makes the condition measurable so whichever is
      # chosen can be verified afterwards -- the same number, before and after.
      #
      # `if: always()` because the step above exits non-zero whenever ITS signal is loud,
      # and one loud detector must never mute the other.
      - name: Report main's gate-verdict drought, loudly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          bun src/Core.TypeScript/ci/verdict-drought.ts \
            --repo "$REPO" --window 60
