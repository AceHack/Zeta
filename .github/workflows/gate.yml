  lint-tick-shard-relative-paths:
    # Fail if any tick shard at docs/hygiene-history/ticks/YYYY/MM/DD/HHMMZ.md
    # contains a broken relative-path link (target resolves outside the repo
    # root or to a missing file). Tick shards live 5 directories below docs/,
    # so the count-the-`..` pattern is error-prone — the agent shipped 5-`..`
    # paths twice in one session (PR #3676 / PR #3679, 2026-05-16) where
    # `../../../../../.claude/rules/X.md` lands at `docs/.claude/...` instead
    # of repo root. Copilot caught both via review threads.
    #
    # Lifecycle: discovery #3676/#3679 → narrow fix #3680 → scanner #3692 →
    # filter + quality rounds #3692 (fixups) → baseline mechanism #3699 →
    # CI enforce gate (this job). The `--baseline` flag grandfathers
    # pre-existing findings recorded in audit-tick-shard-relative-paths.baseline.json
    # so historical residue in immutable shards doesn't block — new violations
    # still fail. Same shape as Stryker `--reset` or ESLint suppressions.
    name: lint (tick-shard relative-paths)
    timeout-minutes: 12
    # RAISED 5 -> 12 (2026-08-01). This job was CANCELLED by its own budget four times today.
    # It is not randomly flaky — it is systematically near the ceiling: the lint itself runs in
    # 120-158s, but the job first runs ./tools/setup/install.sh (the full three-way-parity
    # toolchain per GOVERNANCE §24), and a slightly slow install pushes the total past 300s.
    # Observed cancellations at 316s and 317s against a 300s budget.
    #
    # A cancelled job reports as a RED CHECK indistinguishable from a real failure, so this cost
    # four spurious reds and several rerun cycles on unrelated PRs today.
    #
    # DEEPER ISSUE, not fixed here: audit-tick-shard-relative-paths.ts imports ONLY node built-ins
    # (node:fs, node:path, node:child_process). It needs a JS runtime and nothing else, yet
    # installs an entire toolchain to get one. gate.yml runs install.sh in 64 jobs and setup-bun in
    # 2. Either caching install.sh's output or using setup-bun for runtime-only jobs would remove
    # this whole class — but the cache is already at 10.05GB of a 10GB ceiling, and §24 makes
    # install.sh the single install path, so both need a deliberate decision rather than a
    # drive-by change.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        run: ./tools/setup/install.sh

      - name: Run audit-tick-shard-relative-paths (--enforce --baseline)
        run: |
          bun src/Core.TypeScript/hygiene/audit-tick-shard-relative-paths.ts \
            --enforce \
            --baseline src/Core.TypeScript/hygiene/audit-tick-shard-relative-paths.baseline.json

  build-graph-completeness:
    # The acceptance gate on wiring job selection to `ace/build-graph.json`.
    #
    # An affected-set query is only sound if the graph is COMPLETE over the CI
    # domain: every target claims a leg, every leg resolves to a real job, every
    # job is claimed by a target. Break any of those and selecting jobs from the
    # graph SILENTLY SKIPS work -- and a job that should have run and did not is
    # indistinguishable from one that ran and passed.
    #
    # It found three real defects when written (2026-08-19), all live on main:
    #   * `lean-proof/build` and `tlaps-proof/tlaps` named jobs that do not exist
    #     (they are `type-check` and `prove`), so a wired graph would have skipped
    #     the Lean and TLA+ proofs entirely;
    #   * 35 Rust crates carried `legs: []` while `gate/lint-rust` demonstrably
    #     lints every crate under src/;
    #   * 18 jobs -- including lint-fsharp, lint-csharp and lint-rust -- were
    #     claimed by no target at all.
    #
    # BUN ONLY, on purpose, and the reason is this job's own subject matter: it
    # needs one 178 MB runtime, and `./tools/setup/install.sh` provisions the union
    # of every toolchain in the repo. Same rationale the lint-structural-hygiene
    # job below already states.
    name: lint (build-graph completeness)
    timeout-minutes: 5
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Graph is complete over the CI domain (fails closed)
        run: bun src/Core.TypeScript/hygiene/audit-build-graph-completeness.ts

      # Manifesto §1 for repo topology: `ace` may be the good resolution path and
      # may never be the only one. Guarded here rather than later because the guard
      # is free while `ace` is optional and unretrofittable once the fleet depends
      # on it. Rule: .claude/rules/clone-at-tag-stays-sufficient.md
      - name: Clone-at-a-tag is still sufficient (no ace-as-resolver)
        run: bun src/Core.TypeScript/hygiene/lint-clone-at-tag-is-sufficient.ts

      # A flake ref evaluates PURE by default, and pure-eval `builtins.pathExists`
      # on an absolute path returns FALSE rather than erroring (measured 2026-08-21,
      # Nix 2.34.6). Every full-ai-cluster module reading /etc/zeta guards its
      # readFile behind that pathExists, so a rebuild without --impure silently
      # reverts hostname / k3s join endpoint / segment address and DROPS the
      # operator's authorized SSH keys. Guarded here because the failure is silent.
      - name: Documented flake rebuilds still carry --impure (silent-revert guard)
        run: bun src/Core.TypeScript/hygiene/lint-nixos-rebuild-needs-impure.ts

      - name: Audit + selector unit tests (a check that cannot fail is not a check)
        run: |
          bun test \
            src/Core.TypeScript/hygiene/audit-build-graph-completeness.test.ts \
            src/Core.TypeScript/hygiene/lint-clone-at-tag-is-sufficient.test.ts \
            src/Core.TypeScript/hygiene/lint-nixos-rebuild-needs-impure.test.ts \
            src/Core.TypeScript/ci/affected-legs.test.ts

      # OBSERVE-ONLY. Nothing reads these outputs yet, and that is deliberate: the
      # derivation is published and compared against what the gate actually ran, so
      # it is checked against reality BEFORE any `if:` depends on it. Flipping the
      # guards on an unproven selector is the same class of mistake as trusting an
      # incomplete graph. The mapping is DERIVED here at run time and is never
      # hand-maintained in this file -- a second copy of the graph written as `if:`
      # expressions is how a wired graph becomes unwired again.
      - name: Affected legs for this change (observe-only, nothing consumes it)
        if: github.event_name == 'pull_request'
        run: |
          bun src/Core.TypeScript/ci/affected-legs.ts \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  lint-structural-hygiene:
    # Keep repository-structure guards that are still active after the
    # docs/backlog cutover. Legacy backlog-ID uniqueness/status checks are
    # intentionally not run here: new work-items are ZetaId-backed under
    # workitems/, while docs/backlog is frozen historical substrate.
    name: lint (structural hygiene)
    timeout-minutes: 5
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need merge-base history for manus commit-message leak scan.
          fetch-depth: 0

      # These repository-structure guards need Bun + Git only. Running the full
      # parity installer here lets unrelated compiler downloads consume this
      # job's five-minute budget before any guard executes.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Dangling tracked symlinks crash the GitHub Pages (Jekyll) build on realpath — invisible
      # to the test suites. Surfaced 2026-06-11: #7820 moved 31 dirs to db/ and nine relative
      # links dangled; Pages was red for hours on every push.
      - name: Run audit-dangling-symlinks (Pages/Jekyll guard)
        run: bun src/Core.TypeScript/hygiene/audit-dangling-symlinks.ts

      # docs/observe-events/ holds three filename schemes; only one of them (32-hex ZetaId)
      # carries no prefix, so a name that is hex-but-not-an-id is indistinguishable from an
      # id by shape. Three such names arrived 2026-08-09 from an id "mint" that did no
      # hashing, passed every `/^[0-9a-f]{32}$/` check in the repo, and produced a false
      # positive in a ZetaId audit (#10690). This decodes the version field instead of
      # trusting the regex, and carries a scan floor so it cannot pass by inspecting nothing.
      - name: Run audit-observe-event-filenames (ZetaId-vs-hex ambiguity guard)
        run: bun src/Core.TypeScript/hygiene/audit-observe-event-filenames.ts

      # 081KTSZN10008QG0R002J0GE0Z Reticulum-only clause: files marked SEALED-ROOM carry zero ambient-channel
      # tokens (fs/process/network/clock/entropy/Task.Run); falsifiers waive per-line, visibly.
      - name: Run audit-sealed-rooms (081KTSZN10008QG0R002J0GE0Z Reticulum-only lint half)
        run: bun src/Core.TypeScript/hygiene/audit-sealed-rooms.ts

      # 081KWMY831H — Manus/Lumen shell-wrapper must not leak into commit subjects.
      - name: Run lint-no-manus-commit-leak (081KWMY831H)
        run: bun src/Core.TypeScript/hygiene/lint-no-manus-commit-leak.ts

      # The four-oracle byte-lock pins field VALUES, not field NAMES — so two oracles
      # could declare the same schema id with different key sets and every existing
      # check stayed green. Live instance: PR #10722 gave TypeScript's
      # TemperatureReadout a required `fidelity` that F#'s does not have, both still
      # declaring `zeta.temperature.readout.v1`; the three suites that read that treaty
      # reported 51 pass / 0 fail / exit 0 with the divergence in place.
      # --min-schemas is a SCAN FLOOR: if a moved path or a changed glob makes the audit
      # inspect fewer schemas than stated, it exits non-zero instead of reporting
      # success — a check that did not run must not look like one that passed.
      - name: Run audit-schema-key-set-parity (cross-oracle schema key sets)
        run: bun src/Core.TypeScript/hygiene/audit-schema-key-set-parity.ts --min-schemas 6

      # Every Actions job must declare timeout-minutes. An unbounded job can hold a
      # runner until the 6h platform cap: on 2026-08-18 lint-autofix held a slot 90+
      # minutes and backlog-index-integrity 140.5, both stalled in install.sh on a hung
      # apt mirror. Slots never freed, concurrency cancelled the constituent lint jobs,
      # and gate (required) correctly read cancelled as failure — PRs went red with no
      # real defect. GitHub has no repo-level default job timeout and workflow defaults:
      # does not cover it, so per-job declaration is the only mechanism and this lint is
      # what keeps the class closed. Carries a scan floor so it cannot pass by
      # inspecting nothing.
      - name: Run lint-workflow-job-timeouts (unbounded-runner-slot guard)
        run: bun src/Core.TypeScript/hygiene/lint-workflow-job-timeouts.ts

  lint-no-empty-dirs:
    # Fail if a committed directory has no files — almost always a
    # forgotten artefact (an agent-created skill folder without a
    # SKILL.md, a research folder with no report). Born round 35 after
    # Aaron: "we need a build script that will fail the build if it
    # detects an empty folder". Script under src/Core.TypeScript/lint/ respects
    # .gitignore and an explicit allowlist at
    # src/Core.TypeScript/lint/no-empty-dirs.allowlist. Upstream mirrors under
    # references/prior-art/** are excluded by the script itself.
    # No untrusted input used in run: — only a fixed repo path.
    name: lint (no empty dirs)
    timeout-minutes: 5
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This source-tree lint needs Bun + Git only. Running the full parity
      # installer here makes an unrelated Zig/Lean/QEMU download capable of
      # consuming the entire five-minute lint budget before the check starts.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Run no-empty-dirs
        run: bun src/Core.TypeScript/lint/no-empty-dirs.ts

      # 081M010W1BP087G0R002M2BNVW — Heat.fs decided "is this kind pressure?" twice, by two
      # independent routes that disagreed on kinds carrying both a forgetting and a pressure
      # token. That bit is the discriminator for the composition law (deferral composes,
      # destruction does not), so two answers defeat the point of the law being decidable.
      # #10804 collapsed both routes onto one ordered chain; this is the standing guard that a
      # second one cannot come back. PART A refuses a dual-token kind literal; PART B
      # DISCOVERS the single classifier — it never pins the name, because pinning `ofKind` is
      # exactly what made the first draft of this lint go red on a correct main — and refuses
      # a second decider, an inline substring probe, an orphan probe, and a membership split
      # between the two pressure tables. Every extraction route carries its own scan floor, so
      # a route that goes dark fails instead of reading OK.
      - name: Guard — one classifier for the heat deferral/destruction bit (081M010W1BP087G0R002M2BNVW)
        run: bun src/Core.TypeScript/hygiene/lint-heat-kind-classifier-agreement.ts

      - name: Guard — discharge rows may not contradict their own certificates
        # 2026-08-01: five rows were written "§A — DISCHARGED" while Z-2's own cited
        # certificate said status:"OPEN" (94.7% error vs a 25% threshold). The script
        # honestly reported failure; the register cell overrode it in prose. §A is the
        # frozen core, so a false row there is an integrity defect. This catches that
        # class MECHANICALLY — no judgement about whether a discharge is *good*, only a
        # refusal of rows that contradict (or are missing) their cited evidence.
        run: bun src/Core.TypeScript/hygiene/lint-discharge-certificate-consistency.ts

      - name: Guard — a golden-vector treaty may not claim a rule its vectors do not pin
        # PR #10759 was filed on the premise "the tie-break behaviour is byte-locked into
        # the four-oracle treaty." Measured, that premise was false: first-occurrence and
        # ordinal-minimum each changed 0 of 7 pinned vectors, because six of the seven had
        # no tie reaching quorum at all. "The treaty pinned a POINT; the prose claimed a
        # RULE." This is spec-side mutation testing — mutate the RULE, count the vectors
        # that change, and refuse a declared exclusion that changes zero. Cross-oracle byte
        # agreement (the treaty's other, real job) is deliberately NOT audited here.
        run: bun src/Core.TypeScript/hygiene/lint-treaty-rule-discrimination.ts

  lint-markdown:
    # markdownlint-cli2 on every .md file outside the ignore list in
    # .markdownlint-cli2.jsonc. Round 33 static-analysis expansion
    # (docs + specs + skills are a huge surface; drift is easy).
    # See openspec/specs/static-analysis/profiles/markdown.md.
    name: lint (markdownlint)
    timeout-minutes: 12
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull_request ref is a synthetic merge commit. Its first parent
          # must be present for the PR-scoped markdown diff below.
          fetch-depth: 2

      # This job needs Bun, markdownlint-cli2, and tracked TypeScript only.
      # Running the full workstation/cluster bootstrap made a 553 MB apt
      # manifest download capable of consuming its 12-minute job cap before
      # markdownlint began. `packageManager` pins this runtime and
      # `bun.lock` pins the linter; the full setup graph remains the path for
      # developer machines, cluster nodes, and jobs that consume its tools.
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install JavaScript dependencies from the locked graph
        run: bun install --frozen-lockfile

      - name: Run markdownlint (scoped to the PR's own diff on pull_request)
        # Drift-and-heal ADR item 4 (workitem 081KX3KA3ES08QG0R003TW3XDE, the
        # priority-inversion fix): on pull_request this job fails ONLY on
        # findings in files the PR itself touches; findings in unrelated files
        # print as out-of-scope drift (informational — the drift-sweep ledger
        # on main owns them, and the SLO auto-files work when they linger).
        # On push/main the whole tree still lints: that run IS the detector.
        # HEAD is the merge commit on pull_request, so HEAD^1..HEAD is exactly
        # this PR's changes against current main — no user-controlled ref
        # names touched (safe-pattern: first-party context only). The
        # `|| true` inside the group is load-bearing: the default shell is
        # `bash -e -o pipefail`, and the verdict must come from scoped-lint
        # (rightmost pipe stage), not the raw linter.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD > /tmp/changed-files.txt
            git ls-files > /tmp/tracked-files.txt
            { bunx --no-install markdownlint-cli2 "**/*.md" 2>&1 || true; } \
              | bun src/Core.TypeScript/hygiene/scoped-lint.ts \
                  --changed /tmp/changed-files.txt --tracked /tmp/tracked-files.txt
          else
            bunx --no-install markdownlint-cli2 "**/*.md"
          fi

  lint-typescript:
    # The TypeScript member of the per-language lint family (lint (F#) / (C#) /
    # (Go) / (Python) / (Rust) / (TS)). Strict typecheck on every TypeScript file
    # via `tsc --noEmit -p tsconfig.json`. Round 35 static-analysis expansion per 081KQDTYV0008QG0R000XFYDTT:
    # ESLint with typed-linting catches *most* TS issues but not all
    # assignability narrowings. Slice 9 (PR #882) shipped a real
    # TS2322 (`Type 'string' is not assignable to type "head" | ...`)
