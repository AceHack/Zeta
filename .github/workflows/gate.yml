    # the layer that catches all paths, not at the input-tool
    # layer.
    name: lint (tick-history order)
    timeout-minutes: 12
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This order check reads one tracked Markdown file and runs one tracked
      # TypeScript script. It does not consume any host or cluster toolchain;
      # use the package-pinned Bun path so apt mirror stalls cannot suppress the
      # ordering verdict.
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

