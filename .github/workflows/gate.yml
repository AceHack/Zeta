  lint-fsharp:
    name: lint (F#)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
            ~/.rustup/toolchains/1.87.0-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
            ~/.cache/zeta/from-autotools-tarball/*.tgz
          key: install-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'tools/setup/**', 'global.json') }}
      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if ./tools/setup/install.sh; then exit 0; fi
            [ "$attempt" = "5" ] && { echo "install.sh failed after 5 attempts"; exit 1; }
            case "$attempt" in
              1) backoff=10 ;;
              2) backoff=30 ;;
              3) backoff=60 ;;
              4) backoff=120 ;;
            esac
            echo "install.sh attempt $attempt failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
          done
      - name: Run F# Lint Script
        run: bun src/Core.TypeScript/lint/lint-fsharp.ts

