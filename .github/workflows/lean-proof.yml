            --label "schema axiom audit" --deny 'sorryAx' \
            --message "SchemaEvolution's CLOSED theorems depend on sorryAx — a proof regressed (the declared research-target sorry is excluded from this audit)" \
            -- lake env lean /tmp/schema_axiom_audit.lean
          bun ../Core.TypeScript/hygiene/run-checked.ts \
            --label "findata axiom audit" --deny 'sorryAx' \
            --message "FinDataProcessing's 13 sorry-free declarations depend on sorryAx — the open obligation has leaked into the closed tower" \
            -- lake env lean /tmp/findata_axiom_audit.lean
          echo "Lean research-proof axiom audit clean (no sorryAx)."
