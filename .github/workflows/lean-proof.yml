            -- lake env lean /tmp/unbounded_axiom_audit.lean
          bun ../Core.TypeScript/hygiene/run-checked.ts \
            --label "childfloor axiom audit" --deny 'sorryAx' \
            --message "ChildFloor depends on sorryAx — the child-floor proof regressed to sorry/admit" \
            -- lake env lean /tmp/childfloor_axiom_audit.lean
          bun ../Core.TypeScript/hygiene/run-checked.ts \
            --label "childfloorpolicy axiom audit" --deny 'sorryAx' --deny 'ofReduceBool' \
            --message "ChildFloorPolicy depends on sorryAx or ofReduceBool — the child-floor policy's floor-cannot-be-disabled / unknown-fails-closed proofs regressed to sorry, or a witness switched to native_decide (which puts a compiler-trusting axiom in a SAFETY proof's axiom set)" \
