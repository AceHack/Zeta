name: lean-proof

# Type-checks the Lean 4 / Mathlib formalization package rooted at
# src/Core.Lean4/Lean4.lean. Per the math-proofs
# honest assessment (docs/research/2026-05-03-math-proofs-
# honest-assessment.md) the Lean proof is A-grade today
# hand-run (chain_rule_proposition_3_2 + Dop_LTI_commute) but
# was MISSING CI gating — peer reviewers expect "runs in CI"
# as the line for an A-grade artifact. This workflow closes
# that gap.
#
# Path-filtered to only run on changes that affect the Lean
# proof (the Lean source, the lake-manifest, the toolchain
# version pin, or this workflow itself). Runs out-of-band
# from gate.yml because Mathlib's lake cache is multi-GB and
# Lean toolchain setup is heavier than the existing
# build-and-test surface.
#
# Composes with:
#   - src/Core.Lean4/Lean4/DbspChainRule.lean (the artifact)
#   - docs/research/verification-registry.md (the registry
#     rows for chain_rule_proposition_3_2 + Dop_LTI_commute)
#   - docs/research/2026-05-03-math-proofs-honest-assessment.md
#     (this workflow closes the A-with-CI upgrade for A1+A2)
#   - .claude/skills/verification-drift-auditor/SKILL.md
#     (every CI fire is implicit drift-check input)
#
# Safe-pattern compliance (per FACTORY-HYGIENE row #43):
#   - SHA-pinned actions/checkout + actions/cache
#   - Explicit minimum permissions: contents: read
#   - No user-authored context; purely repo-file reads
#   - Concurrency group + pinned runs-on
#   - Path-filter narrows the trigger surface

on:
  pull_request:
    paths:
      - "src/Core.Lean4/**"
      - ".github/workflows/lean-proof.yml"
  push:
    branches: [main]
    paths:
      - "src/Core.Lean4/**"
      - ".github/workflows/lean-proof.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Workflow-level env: exposes GITHUB_TOKEN to steps that need the
# current repository token. It is not a valid general-purpose token
# for mise/aqua release lookups against other repositories: GitHub
# returns 404 for some public release-tag endpoints when queried with
# the repo-scoped Actions token. setup/common/mise.sh therefore masks
# GITHUB_TOKEN during `mise install` unless a dedicated
# MISE_GITHUB_TOKEN or GITHUB_API_TOKEN is provided. Same pattern as
# gate.yml (see workflow-level env: block there); inherits the
# workflow's permissions: contents: read — no write escalation.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: lean-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  type-check:
    name: type-check Lean proofs
    runs-on: ubuntu-24.04
    # Mathlib's lake cache get + the actual type-check is fast
    # (~2-5 min) on warm cache; cold cache (cache miss on first
    # run after lean-toolchain bump) can take 15-25 min.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mathlib's lake build cache. Keyed on lean-toolchain (which
      # binds the Mathlib version via lakefile.toml + lake-manifest)
      # so the cache busts cleanly when either changes. Without this
      # cache, every PR fetches + builds Mathlib from scratch which
      # is hours of CI time.
      - name: Cache lake (Mathlib oleans)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Core.Lean4/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('src/Core.Lean4/lean-toolchain', 'src/Core.Lean4/lakefile.toml', 'src/Core.Lean4/lake-manifest.json') }}
          # Restore-keys allow falling back to a partial cache on
          # cache-miss; lake exe cache get fills the gap. Faster than
          # cold-build of Mathlib.
          restore-keys: |
            lake-${{ runner.os }}-

      # elan toolchain. Same key shape as gate.yml's elan cache so
      # the two workflows share cache space efficiently.
      - name: Cache elan (Lean 4 toolchain)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Core.TypeScript/ace/setup-realizers/from-elan.ts', 'tools/setup/manifests/from-elan') }}

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        # Single source of truth for toolchain state. Installs elan
        # which provides lake + lean. Same pattern as gate.yml.
        run: ./tools/setup/install.sh

      - name: Fetch Mathlib pre-built oleans
        # Mathlib's CLI downloads pre-compiled .olean files from S3;
        # this skips the multi-hour Mathlib build. After cache get,
        # lake env lean type-checks the proof in ~30s.
        working-directory: src/Core.Lean4
        run: lake exe cache get

      - name: Set up bun (for the orphan guard)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Guard — no Lean module may escape the build silently
        working-directory: .
        # Runs BEFORE the build so a failure names the cause rather than showing a
        # green build over unchecked proofs. Three times a .lean file has sat outside
        # `lake build` because nothing imported it, and each time the escaped file was
        # broken (ImaginaryStack 2026-08-10: compile error + a `sorry` on a false
        # theorem; MenoBraidedRMatrix and GenSelfApplication 2026-08-13). Deliberate
        # exclusions stay legal — they go in src/Core.Lean4/ORPHANS.json with a reason.
        run: bun src/Core.TypeScript/hygiene/lean-orphan-modules.ts

      # 16 per-file `lake env lean <module>.lean` steps were removed here 2026-08-13.
      # Every one of them re-type-checked a module that `lake build` below already
      # compiles, now that Gen/Privacy/Safety are declared libs and in defaultTargets.
      # They were hand-maintained coverage standing in for the build graph — the graph
      # does it structurally, and `lean-orphan-modules.ts` above now proves nothing has
      # slipped out of it. ImaginaryStack/ToyModel keeps its own step: a namespace
      # collision with ErasureDistance keeps it out of the graph deliberately.
      - name: Build Lean package root
        # Lean4.lean imports the machine-checked codec modules
        # (DynamicValue, JsonCodec, CborCodec, YamlCodec) and the
        # DBSP proof module. `lake build` keeps the documented CI
        # contract honest: new imported proofs cannot silently drift
        # outside the workflow's fixed per-file type-check list.
        working-directory: src/Core.Lean4
        run: lake build

      - name: Type-check ImaginaryStack/ToyModel.lean
        # The Adinkra-as-generator / bulk-from-boundary toy lemma. Its `sorry`
        # placeholders were discharged 2026-06-05; this step keeps it honest
        # (type-checks the proof on every PR that touches src/Core.Lean4/**).
        working-directory: src/Core.Lean4
        run: lake env lean ImaginaryStack/ToyModel.lean

      - name: Guard — Lean research proofs are sorry-free (axiom audit)
        # `lake env lean` only WARNS on `sorry` (exit 0), so type-check alone
        # would not catch a regression. Print the axiom set of the headline
        # lemmas and fail if `sorryAx` appears — the rigorous sorry-free check.
        working-directory: src/Core.Lean4
        run: |
          printf '#print axioms lemma1_toy\n#print axioms reconstruction_property\n#print axioms code_covers_boundary\n' \
            | cat ImaginaryStack/ToyModel.lean - > /tmp/toymodel_axiom_audit.lean
          printf '#print axioms erasure_correctable_of_min_distance\n#print axioms recover_from_any_12_of_16\n#print axioms low_weight_codeword_of_uncorrectable\n#print axioms rsCode_min_distance\n#print axioms rsCode_corrects_any_4_erasures\n' \
            | cat ImaginaryStack/ErasureDistance.lean - > /tmp/erasure_axiom_audit.lean
          printf '#print axioms distinctness_forces_private\n#print axioms indiscernibles_collapse\n#print axioms key_alone_insufficient\n#print axioms no_private_collapses\n#print axioms commons_converges\n#print axioms absorb_stable\n#print axioms private_is_persistent_locus\n' \
            | cat Privacy/IdentityForcesPrivacy.lean - > /tmp/privacy_axiom_audit.lean
          printf '#print axioms Zeta.Privacy.finite_orbit_recurs\n#print axioms Zeta.Privacy.unbounded_needs_infinite\n#print axioms Zeta.Privacy.unbounded_with_finite_commons_needs_infinite_privacy\n' \
            | cat Privacy/UnboundedNeedsInfinitePrivacy.lean - > /tmp/unbounded_axiom_audit.lean
          printf '#print axioms Zeta.ChildFloor.denied_never_executed\n#print axioms Zeta.ChildFloor.executed_admit\n#print axioms Zeta.ChildFloor.binding_denied_never_executed\n#print axioms Zeta.ChildFloor.binding_respects_gate\n' \
            | cat Safety/ChildFloor.lean - > /tmp/childfloor_axiom_audit.lean
          printf '#print axioms Zeta.Bifurcation.reconcile_converges\n#print axioms Zeta.Bifurcation.reconcile_absorb\n' \
            | cat Safety/Bifurcation.lean - > /tmp/bifurcation_axiom_audit.lean
          printf '#print axioms Zeta.NonRegisterCollapse.non_collapse\n#print axioms Zeta.NonRegisterCollapse.distinctness_forces_standing\n#print axioms Zeta.NonRegisterCollapse.no_register_collapses\n' \
            | cat Safety/NonRegisterCollapse.lean - > /tmp/nrc_axiom_audit.lean
          printf '#print axioms Zeta.GenGenFixpoint.gen_preserves_eval\n#print axioms Zeta.GenGenFixpoint.gen_idempotent\n#print axioms Zeta.GenGenFixpoint.gen_gen_eq_gen\n#print axioms Zeta.GenGenFixpoint.gen_has_fixpoint\n#print axioms Zeta.GenGenFixpoint.gen_fixpoint_iff_image\n#print axioms Zeta.GenGenFixpoint.lawvere_fixpoint\n' \
            | cat Lean4/GenGenFixpoint.lean - > /tmp/gengen_axiom_audit.lean
          printf '#print axioms Zeta.CayleyDickson.doubled_isDoublyEven\n#print axioms Zeta.CayleyDickson.doubled_isSelfOrthogonal\n#print axioms Zeta.CayleyDickson.doubled_isRateHalf\n#print axioms Zeta.CayleyDickson.doubled_preserves_doubly_even_self_dual\n' \
            | cat Lean4/CayleyDicksonDoublyEven.lean - > /tmp/cd_doubly_even_axiom_audit.lean
          printf '#print axioms Zeta.BridgeFunctor.bridge_left_inv\n#print axioms Zeta.BridgeFunctor.bridge_right_inv\n#print axioms Zeta.BridgeFunctor.bridge_preserves_involution\n' \
            | cat Lean4/BridgeFunctor.lean - > /tmp/bridge_functor_axiom_audit.lean
          printf '#print axioms Zeta.CanonicalizerCorrect.eval_mul_mul\n#print axioms Zeta.CanonicalizerCorrect.eval_add_add\n#print axioms Zeta.CanonicalizerCorrect.eval_mul_add_mul\n#print axioms Zeta.CanonicalizerCorrect.eval_mul_add_add\n#print axioms Zeta.CanonicalizerCorrect.eval_mul_one\n#print axioms Zeta.CanonicalizerCorrect.eval_add_zero\n#print axioms Zeta.CanonicalizerCorrect.eval_mul_zero\n#print axioms Zeta.CanonicalizerCorrect.eval_xrotxor_fused\n#print axioms Zeta.CanonicalizerCorrect.evalOp_xrotxor_nil\n' \
            | cat Lean4/CanonicalizerCorrect.lean - > /tmp/canonicalizer_axiom_audit.lean
          printf '#print axioms Zeta.CostRecurrence.eqCount_eq_sum\n#print axioms Zeta.CostRecurrence.eqCount_closed_form\n#print axioms Zeta.CostRecurrence.eqCount_two_mul\n#print axioms Zeta.CostRecurrence.eqCount_le_sq\n#print axioms Zeta.CostRecurrence.cost_lax_of_subadd\n#print axioms Zeta.CostRecurrence.seqCost_lax_monoidal\n#print axioms Zeta.CostRecurrence.sharedCost_lax_monoidal\n#print axioms Zeta.CostRecurrence.sharedCost_strictly_lax\n' \
            | cat Lean4/CostRecurrence.lean - > /tmp/costrec_axiom_audit.lean
          printf '#print axioms Zeta.LandauerFloor.measure_preserves_total\n#print axioms Zeta.LandauerFloor.measure_heat_grows\n#print axioms Zeta.LandauerFloor.measure_heat_monotone\n#print axioms Zeta.LandauerFloor.branches_zero_heat\n#print axioms Zeta.LandauerFloor.adj_only_zero_heat\n#print axioms Zeta.LandauerFloor.larger_window_less_excess\n#print axioms Zeta.LandauerFloor.quasistatic_limit\n#print axioms Zeta.LandauerFloor.n_appends_from_n_branches\n' \
            | cat Lean4/LandauerFloor.lean - > /tmp/landauer_axiom_audit.lean

          # ── Added 2026-08-10: three files that were in NEITHER list ──────────────
          # Each audits ONLY declarations measured sorry-free on 2026-08-10, so these
          # are genuine regression gates rather than permanently-red steps. Files that
          # legitimately carry an OPEN obligation keep it; the closed theorems around
          # it are still protected, which is the whole point of auditing per-declaration
          # instead of per-file.
          printf '#print axioms degreeLT_mem_rsCode\n#print axioms phase_clock_recoverable_under_erasure\n' \
            | cat ImaginaryStack/PhaseClockErasure.lean - > /tmp/pce_axiom_audit.lean
          # `disjoint_deltas_commute` is a DECLARED research-target sorry and is excluded.
          printf '#print axioms empty_delta_identity\n#print axioms consolidate_idempotent\n' \
            | cat Lean4/SchemaEvolution.lean - > /tmp/schema_axiom_audit.lean
          # The 13 the file itself certifies sorry-free. Excluded by the file's own
          # accounting: logRatio_eq_mutualInfo_diff (the open obligation) and
          # dataProcessing (derived from it).
          printf 'open Zeta.FinDataProcessing\n#print axioms relEntropy_nonneg\n#print axioms gibbs_le\n#print axioms relEntropy_self\n#print axioms FinJointLogForm.mutualInfo_eq_logsum\n#print axioms MarkovChain.chan_le_one\n#print axioms MarkovChain.jointXZ_pY_eq\n#print axioms MarkovChain.jointXZ_pX_eq\n#print axioms MarkovChain.sum_out_z\n#print axioms MarkovChain.sum_out_y\n#print axioms MarkovChain.sum_qf_y\n#print axioms MarkovChain.sum_pf3_one\n#print axioms MarkovChain.sum_qf3_one\n#print axioms MarkovChain.pf3_zero_or_qf3_pos\n' \
            | cat Lean4/FinDataProcessing.lean - > /tmp/findata_axiom_audit.lean

          if lake env lean /tmp/toymodel_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::ToyModel depends on sorryAx — a proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/erasure_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::ErasureDistance depends on sorryAx — a proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/privacy_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::IdentityForcesPrivacy depends on sorryAx — a proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/unbounded_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::UnboundedNeedsInfinitePrivacy depends on sorryAx — a proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/childfloor_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::ChildFloor depends on sorryAx — the child-floor proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/bifurcation_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::Bifurcation depends on sorryAx — the reconciliation-convergence proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/nrc_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::NonRegisterCollapse depends on sorryAx — the non-register-collapse proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/gengen_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::GenGenFixpoint core proofs depend on sorryAx — a proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/cd_doubly_even_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::CayleyDicksonDoublyEven depends on sorryAx — a proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/bridge_functor_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::BridgeFunctor depends on sorryAx — a proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/canonicalizer_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::CanonicalizerCorrect depends on sorryAx — a fusion-correctness proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/costrec_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::CostRecurrence depends on sorryAx — the cost recurrence / lax-monoidal proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/landauer_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::LandauerFloor depends on sorryAx — the Landauer two-ledger / predictive-advantage proof regressed to sorry/admit"
            exit 1
          fi
          # ── Anti-vacuity guard (added 2026-08-10) ────────────────────────────────
          # Every audit below decides PASS by the ABSENCE of `sorryAx` in the output.
          # If a `#print axioms` names a declaration that does not resolve — renamed,
          # moved, or mis-qualified — Lean reports "Unknown constant", prints no axiom
          # line, and the grep finds no `sorryAx`. The step then PASSES while checking
          # nothing. A check that cannot fail is not a check.
          #
          # This was not hypothetical: the FinDataProcessing names above were initially
          # written unqualified and all 13 silently resolved to nothing. Caught by
          # counting the printed declarations instead of trusting the exit code.
          for f in /tmp/*_axiom_audit.lean; do
            if lake env lean "$f" 2>&1 | grep -q 'Unknown constant'; then
              echo "::error::$f names a declaration that does not resolve — the audit would pass vacuously"
              exit 1
            fi
          done

          if lake env lean /tmp/pce_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::PhaseClockErasure depends on sorryAx — a proof regressed to sorry/admit"
            exit 1
          fi
          if lake env lean /tmp/schema_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::SchemaEvolution's CLOSED theorems depend on sorryAx — a proof regressed (the declared research-target sorry is excluded from this audit)"
            exit 1
          fi
          if lake env lean /tmp/findata_axiom_audit.lean 2>&1 | grep -q 'sorryAx'; then
            echo "::error::FinDataProcessing's 13 sorry-free declarations depend on sorryAx — the open obligation has leaked into the closed tower"
            exit 1
          fi
          echo "Lean research-proof axiom audit clean (no sorryAx)."
