name: lean-proof

# Type-checks the Lean 4 / Mathlib formalization package rooted at
# src/Core.Lean4/Lean4.lean. Per the math-proofs
# honest assessment (docs/research/2026-05-03-math-proofs-
# honest-assessment.md) the Lean proof is A-grade today
# hand-run (chain_rule_proposition_3_2 + Dop_LTI_commute) but
# was MISSING CI gating — peer reviewers expect "runs in CI"
# as the line for an A-grade artifact. This workflow closes
# that gap.
#
# Path-filtered to only run on changes that affect the Lean
# proof (the Lean source, the lake-manifest, the toolchain
# version pin, or this workflow itself). Runs out-of-band
# from gate.yml because Mathlib's lake cache is multi-GB and
# Lean toolchain setup is heavier than the existing
# build-and-test surface.
#
# Composes with:
#   - src/Core.Lean4/Lean4/DbspChainRule.lean (the artifact)
#   - docs/research/verification-registry.md (the registry
#     rows for chain_rule_proposition_3_2 + Dop_LTI_commute)
#   - docs/research/2026-05-03-math-proofs-honest-assessment.md
#     (this workflow closes the A-with-CI upgrade for A1+A2)
#   - .claude/skills/verification-drift-auditor/SKILL.md
#     (every CI fire is implicit drift-check input)
#
# Safe-pattern compliance (per FACTORY-HYGIENE row #43):
#   - SHA-pinned actions/checkout + actions/cache
#   - Explicit minimum permissions: contents: read
#   - No user-authored context; purely repo-file reads
#   - Concurrency group + pinned runs-on
#   - Path-filter narrows the trigger surface

on:
  pull_request:
    paths:
      - "src/Core.Lean4/**"
      - ".github/workflows/lean-proof.yml"
  push:
    branches: [main]
    paths:
      - "src/Core.Lean4/**"
      - ".github/workflows/lean-proof.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Workflow-level env: exposes GITHUB_TOKEN to steps that need the
# current repository token. It is not a valid general-purpose token
# for mise/aqua release lookups against other repositories: GitHub
# returns 404 for some public release-tag endpoints when queried with
# the repo-scoped Actions token. setup/common/mise.sh therefore masks
# GITHUB_TOKEN during `mise install` unless a dedicated
# MISE_GITHUB_TOKEN or GITHUB_API_TOKEN is provided. Same pattern as
# gate.yml (see workflow-level env: block there); inherits the
# workflow's permissions: contents: read — no write escalation.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: lean-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  type-check:
    name: type-check Lean proofs
    runs-on: ubuntu-24.04
    # Mathlib's lake cache get + the actual type-check is fast
    # (~2-5 min) on warm cache; cold cache (cache miss on first
    # run after lean-toolchain bump) can take 15-25 min.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mathlib's lake build cache. Keyed on lean-toolchain (which
      # binds the Mathlib version via lakefile.toml + lake-manifest)
      # so the cache busts cleanly when either changes. Without this
      # cache, every PR fetches + builds Mathlib from scratch which
      # is hours of CI time.
      - name: Cache lake (Mathlib oleans)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Core.Lean4/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('src/Core.Lean4/lean-toolchain', 'src/Core.Lean4/lakefile.toml', 'src/Core.Lean4/lake-manifest.json') }}
          # Restore-keys allow falling back to a partial cache on
          # cache-miss; lake exe cache get fills the gap. Faster than
          # cold-build of Mathlib.
          restore-keys: |
            lake-${{ runner.os }}-

      # elan toolchain. Same key shape as gate.yml's elan cache so
      # the two workflows share cache space efficiently.
      - name: Cache elan (Lean 4 toolchain)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Core.TypeScript/ace/setup-realizers/from-elan.ts', 'tools/setup/manifests/from-elan') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        # Single source of truth for toolchain state. Installs elan
        # which provides lake + lean. Same pattern as gate.yml.
        env:
          # TIER DECLARED, not detected. This job genuinely needs the wider payload:
          # elan/lake plus the Mathlib olean fetch; the payload has not been measured down.
          # Recorded explicitly so the next reader sees a decision rather than a default;
          # audit-install-tier-declared.ts refuses silence, never a particular tier.
          ZETA_HOST_TIER: full
        run: ./tools/setup/install.sh

      - name: Fetch Mathlib pre-built oleans
        # Mathlib's CLI downloads pre-compiled .olean files from S3;
        # this skips the multi-hour Mathlib build. After cache get,
        # lake env lean type-checks the proof in ~30s.
        working-directory: src/Core.Lean4
        run: lake exe cache get

      - name: Set up bun (for the orphan guard)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Guard — no Lean module may escape the build silently
        working-directory: .
        # Runs BEFORE the build so a failure names the cause rather than showing a
        # green build over unchecked proofs. Three times a .lean file has sat outside
        # `lake build` because nothing imported it, and each time the escaped file was
        # broken (ImaginaryStack 2026-08-10: compile error + a `sorry` on a false
        # theorem; MenoBraidedRMatrix and GenSelfApplication 2026-08-13). Deliberate
        # exclusions stay legal — they go in src/Core.Lean4/ORPHANS.json with a reason.
        run: bun src/Core.TypeScript/hygiene/lean-orphan-modules.ts

      # 16 per-file `lake env lean <module>.lean` steps were removed here 2026-08-13.
      # Every one of them re-type-checked a module that `lake build` below already
      # compiles, now that Gen/Privacy/Safety are declared libs and in defaultTargets.
      # They were hand-maintained coverage standing in for the build graph — the graph
      # does it structurally, and `lean-orphan-modules.ts` above now proves nothing has
      # slipped out of it. ImaginaryStack/ToyModel keeps its own step: a namespace
      # collision with ErasureDistance keeps it out of the graph deliberately.
      - name: Build Lean package root
        # Lean4.lean imports the machine-checked codec modules
        # (DynamicValue, JsonCodec, CborCodec, YamlCodec) and the
        # DBSP proof module. `lake build` keeps the documented CI
        # contract honest: new imported proofs cannot silently drift
        # outside the workflow's fixed per-file type-check list.
        working-directory: src/Core.Lean4
        run: lake build

      - name: Type-check ImaginaryStack/ToyModel.lean
        # The Adinkra-as-generator / bulk-from-boundary toy lemma. Its `sorry`
        # placeholders were discharged 2026-06-05; this step keeps it honest
        # (type-checks the proof on every PR that touches src/Core.Lean4/**).
        working-directory: src/Core.Lean4
        run: lake env lean ImaginaryStack/ToyModel.lean

      - name: Guard — Lean research proofs are sorry-free (axiom audit)
        # `lake env lean` only WARNS on `sorry` (exit 0), so type-check alone
        # would not catch a regression. Print the axiom set of the headline
        # lemmas and fail if `sorryAx` appears — the rigorous sorry-free check.
        #
        # RUN THROUGH run-checked.ts, NOT THROUGH A PIPELINE (2026-08-15).
        # Every audit here used to read
        #     if lake env lean FILE 2>&1 | grep -q 'sorryAx'; then ... exit 1; fi
        # and a pipeline's exit status is the LAST command's, so `lean`'s status
        # was discarded. If `lean` dies on a signal — 139 = 128+11 SIGSEGV,
        # 134 = 128+6 SIGABRT — it prints nothing, `grep` finds nothing, the
        # `if` is false, and the step PASSES having proved nothing. Every gate
        # here decides by the ABSENCE of a string, which is exactly the class of
        # check a crash cannot fail.
        #
        # Measured, not argued: this step extracted verbatim from `main` and
        # replayed with a `lake` that does nothing but `kill -SEGV $$` exits 0
        # and prints "axiom audit clean (no sorryAx)". `lean` itself is in the
        # crash population (5 reports in one week on the maintainer's machine).
        # run-checked.ts refuses to interpret output from a process that did not
        # finish, and reports that as "no measurement" (exit 2), never as
        # "no findings" (exit 0).
        working-directory: src/Core.Lean4
        run: |
          printf '#print axioms lemma1_toy\n#print axioms reconstruction_property\n#print axioms code_covers_boundary\n' \
            | cat ImaginaryStack/ToyModel.lean - > /tmp/toymodel_axiom_audit.lean
          printf '#print axioms erasure_correctable_of_min_distance\n#print axioms recover_from_any_12_of_16\n#print axioms low_weight_codeword_of_uncorrectable\n#print axioms rsCode_min_distance\n#print axioms rsCode_corrects_any_4_erasures\n' \
            | cat ImaginaryStack/ErasureDistance.lean - > /tmp/erasure_axiom_audit.lean
          printf '#print axioms distinctness_forces_private\n#print axioms indiscernibles_collapse\n#print axioms key_alone_insufficient\n#print axioms no_private_collapses\n#print axioms commons_converges\n#print axioms absorb_stable\n#print axioms private_is_persistent_locus\n' \
            | cat Privacy/IdentityForcesPrivacy.lean - > /tmp/privacy_axiom_audit.lean
          printf '#print axioms Zeta.Privacy.finite_orbit_recurs\n#print axioms Zeta.Privacy.unbounded_needs_infinite\n#print axioms Zeta.Privacy.unbounded_with_finite_commons_needs_infinite_privacy\n' \
            | cat Privacy/UnboundedNeedsInfinitePrivacy.lean - > /tmp/unbounded_axiom_audit.lean
          printf '#print axioms Zeta.ChildFloor.denied_never_executed\n#print axioms Zeta.ChildFloor.executed_admit\n#print axioms Zeta.ChildFloor.binding_denied_never_executed\n#print axioms Zeta.ChildFloor.binding_respects_gate\n' \
            | cat Safety/ChildFloor.lean - > /tmp/childfloor_axiom_audit.lean
          # ── Added 2026-08-24 (081M0TJXY32087G0R003TBTR7V): the child-floor POLICY —
          # the jurisdiction-indexed threshold that instantiates ChildFloor's proven gate.
          # It lands WITH its gate, per the MenoBalancedTwist precedent: a new proof file
          # that is built but unaudited is a regression to `sorry` waiting to type-check
          # green. `no_registry_lowers_the_floor` and `unknown_denies_superset` are the two
          # load-bearing ones (no jurisdiction can disable the floor; unknown fails closed).
          printf '#print axioms Zeta.ChildFloorPolicy.resolve_lower_bound\n#print axioms Zeta.ChildFloorPolicy.resolve_upper_bound\n#print axioms Zeta.ChildFloorPolicy.resolve_unknown\n#print axioms Zeta.ChildFloorPolicy.resolveAll_lower_bound\n#print axioms Zeta.ChildFloorPolicy.resolveAll_upper_bound\n#print axioms Zeta.ChildFloorPolicy.resolveAll_ge_each\n#print axioms Zeta.ChildFloorPolicy.resolveAll_singleton\n#print axioms Zeta.ChildFloorPolicy.unknown_age_denies\n#print axioms Zeta.ChildFloorPolicy.deny_monotone\n#print axioms Zeta.ChildFloorPolicy.no_registry_lowers_the_floor\n#print axioms Zeta.ChildFloorPolicy.unknown_denies_superset\n#print axioms Zeta.ChildFloorPolicy.unknown_jurisdiction_denies_below_bandHigh\n#print axioms Zeta.ChildFloorPolicy.under_bandLow_never_executed\n#print axioms Zeta.ChildFloorPolicy.unknown_age_never_executed\n#print axioms Zeta.ChildFloorPolicy.unknown_jurisdiction_never_executes_below_bandHigh\n#print axioms Zeta.ChildFloorPolicy.denyIfEither_admit_iff\n#print axioms Zeta.ChildFloorPolicy.denyIfEither_deny_left\n#print axioms Zeta.ChildFloorPolicy.denyIfEither_deny_right\n#print axioms Zeta.ChildFloorPolicy.floor_survives_composition_left\n#print axioms Zeta.ChildFloorPolicy.floor_survives_composition_right\n#print axioms Zeta.ChildFloorPolicy.unknown_age_survives_composition\n' \
            | cat Safety/ChildFloorPolicy.lean - > /tmp/childfloorpolicy_axiom_audit.lean
          printf '#print axioms Zeta.Bifurcation.reconcile_converges\n#print axioms Zeta.Bifurcation.reconcile_absorb\n' \
            | cat Safety/Bifurcation.lean - > /tmp/bifurcation_axiom_audit.lean
          printf '#print axioms Zeta.NonRegisterCollapse.non_collapse\n#print axioms Zeta.NonRegisterCollapse.distinctness_forces_standing\n#print axioms Zeta.NonRegisterCollapse.no_register_collapses\n' \
            | cat Safety/NonRegisterCollapse.lean - > /tmp/nrc_axiom_audit.lean
          printf '#print axioms Zeta.GenGenFixpoint.gen_preserves_eval\n#print axioms Zeta.GenGenFixpoint.gen_idempotent\n#print axioms Zeta.GenGenFixpoint.gen_gen_eq_gen\n#print axioms Zeta.GenGenFixpoint.gen_has_fixpoint\n#print axioms Zeta.GenGenFixpoint.gen_fixpoint_iff_image\n#print axioms Zeta.GenGenFixpoint.lawvere_fixpoint\n' \
            | cat Lean4/GenGenFixpoint.lean - > /tmp/gengen_axiom_audit.lean
          printf '#print axioms Zeta.CayleyDickson.doubled_isDoublyEven\n#print axioms Zeta.CayleyDickson.doubled_isSelfOrthogonal\n#print axioms Zeta.CayleyDickson.doubled_isRateHalf\n#print axioms Zeta.CayleyDickson.doubled_preserves_doubly_even_self_dual\n' \
            | cat Lean4/CayleyDicksonDoublyEven.lean - > /tmp/cd_doubly_even_axiom_audit.lean
          printf '#print axioms Zeta.BridgeFunctor.bridge_left_inv\n#print axioms Zeta.BridgeFunctor.bridge_right_inv\n#print axioms Zeta.BridgeFunctor.bridge_preserves_involution\n' \
            | cat Lean4/BridgeFunctor.lean - > /tmp/bridge_functor_axiom_audit.lean
          printf '#print axioms Zeta.CanonicalizerCorrect.eval_mul_mul\n#print axioms Zeta.CanonicalizerCorrect.eval_add_add\n#print axioms Zeta.CanonicalizerCorrect.eval_mul_add_mul\n#print axioms Zeta.CanonicalizerCorrect.eval_mul_add_add\n#print axioms Zeta.CanonicalizerCorrect.eval_mul_one\n#print axioms Zeta.CanonicalizerCorrect.eval_add_zero\n#print axioms Zeta.CanonicalizerCorrect.eval_mul_zero\n#print axioms Zeta.CanonicalizerCorrect.eval_xrotxor_fused\n#print axioms Zeta.CanonicalizerCorrect.evalOp_xrotxor_nil\n' \
            | cat Lean4/CanonicalizerCorrect.lean - > /tmp/canonicalizer_axiom_audit.lean
          printf '#print axioms Zeta.CostRecurrence.eqCount_eq_sum\n#print axioms Zeta.CostRecurrence.eqCount_closed_form\n#print axioms Zeta.CostRecurrence.eqCount_two_mul\n#print axioms Zeta.CostRecurrence.eqCount_le_sq\n#print axioms Zeta.CostRecurrence.cost_lax_of_subadd\n#print axioms Zeta.CostRecurrence.seqCost_lax_monoidal\n#print axioms Zeta.CostRecurrence.sharedCost_lax_monoidal\n#print axioms Zeta.CostRecurrence.sharedCost_strictly_lax\n' \
            | cat Lean4/CostRecurrence.lean - > /tmp/costrec_axiom_audit.lean
          printf '#print axioms Zeta.LandauerFloor.measure_preserves_total\n#print axioms Zeta.LandauerFloor.measure_heat_grows\n#print axioms Zeta.LandauerFloor.measure_heat_monotone\n#print axioms Zeta.LandauerFloor.branches_zero_heat\n#print axioms Zeta.LandauerFloor.adj_only_zero_heat\n#print axioms Zeta.LandauerFloor.larger_window_less_excess\n#print axioms Zeta.LandauerFloor.quasistatic_limit\n#print axioms Zeta.LandauerFloor.n_appends_from_n_branches\n' \
            | cat Lean4/LandauerFloor.lean - > /tmp/landauer_axiom_audit.lean

          # ── Added 2026-08-14 (081KZZVC3DD087G0R0035SZN58): the Meno braided/balanced
          # pair. `MenoBraidedRMatrix` was wired into the build 2026-08-13 but never into
          # this audit, so a regression to `sorry` there would have type-checked green.
          # `MenoBalancedTwist` lands with its gate rather than after it. Names are fully
          # qualified because the audit lines are appended AFTER the files' `end`.
          printf '#print axioms Zeta.MenoBraided.selfBraiding_comp_eq_id\n#print axioms Zeta.MenoBraided.braidRinv_braidR\n#print axioms Zeta.MenoBraided.braidR_isSymmetric_iff_commute\n#print axioms Zeta.MenoBraided.braidR_not_symmetric_perm3\n#print axioms Zeta.MenoBraided.braidR_yangBaxter\n#print axioms Zeta.MenoBraided.conj_selfDistrib\n#print axioms Zeta.MenoBraided.mut_not_yangBaxter\n#print axioms Zeta.MenoBraided.braidR_yangBaxter_perm3_exhaustive\n' \
            | cat Lean4/MenoBraidedRMatrix.lean - > /tmp/meno_rmatrix_axiom_audit.lean
          printf '#print axioms Zeta.MenoBalanced.dbl_cocycle\n#print axioms Zeta.MenoBalanced.twist_assoc_consistent\n#print axioms Zeta.MenoBalanced.twist_tensor_of_id\n#print axioms Zeta.MenoBalanced.misread_axiom_forces_symmetry\n#print axioms Zeta.MenoBalanced.twist_tensor_ne_id_of_dbl_ne_id\n#print axioms Zeta.MenoBalanced.dbl_eq_id_of_twist_id\n#print axioms Zeta.MenoBalanced.twist_Vpow_succ\n#print axioms Zeta.MenoBalanced.twist_eq_on_Vpow\n#print axioms Zeta.MenoBalanced.twist_eq_of_eq_on_gen\n#print axioms Zeta.MenoBalanced.act_braid_relation_dihedral3\n#print axioms Zeta.MenoBalanced.act_nontrivial_dihedral3\n#print axioms Zeta.MenoBalanced.garside_relation_dihedral3\n#print axioms Zeta.MenoBalanced.mutant_theta_id_rejected\n#print axioms Zeta.MenoBalanced.mutant_half_twist_rejected\n#print axioms Zeta.MenoBalanced.mutant_single_braiding_rejected\n#print axioms Zeta.MenoBalanced.mutant_delta_fourth_rejected\n' \
            | cat Lean4/MenoBalancedTwist.lean - > /tmp/meno_balanced_axiom_audit.lean
          # ── Added 2026-08-15 (shadow/meno-associator-hexagons): the associator +
          # unitors + BOTH hexagons + the copy/discard degree argument. Landed with its
          # gate rather than after it, per the MenoBalancedTwist precedent above.
          printf '#print axioms Zeta.MenoMonoidal.assocInv_assoc\n#print axioms Zeta.MenoMonoidal.assoc_assocInv\n#print axioms Zeta.MenoMonoidal.pentagon\n#print axioms Zeta.MenoMonoidal.triangle\n#print axioms Zeta.MenoMonoidal.hexagon1_tuple\n#print axioms Zeta.MenoMonoidal.hexagon2_tuple\n#print axioms Zeta.MenoMonoidal.strict_assoc\n#print axioms Zeta.MenoMonoidal.strict_leftUnit\n#print axioms Zeta.MenoMonoidal.strict_rightUnit\n#print axioms Zeta.MenoMonoidal.act_append\n#print axioms Zeta.MenoMonoidal.act_act\n#print axioms Zeta.MenoMonoidal.cBlock_singleton\n#print axioms Zeta.MenoMonoidal.hexagon1_strict\n#print axioms Zeta.MenoMonoidal.hexagon2_strict\n#print axioms Zeta.MenoMonoidal.cBlock_singleton_eq_interp\n#print axioms Zeta.MenoMonoidal.cBlock_one_two_eq_interp\n#print axioms Zeta.MenoMonoidal.cBlock_two_one_eq_interp\n#print axioms Zeta.MenoMonoidal.interp_length\n#print axioms Zeta.MenoMonoidal.interp_invWord\n#print axioms Zeta.MenoMonoidal.interp_injective\n#print axioms Zeta.MenoMonoidal.no_hom_between_distinct_degrees\n#print axioms Zeta.MenoMonoidal.no_copy\n#print axioms Zeta.MenoMonoidal.no_discard\n#print axioms Zeta.MenoMonoidal.no_copy_lengthPreserving\n#print axioms Zeta.MenoMonoidal.oppR_yangBaxter\n#print axioms Zeta.MenoMonoidal.hexagon1_opp\n#print axioms Zeta.MenoMonoidal.hexagon2_opp_fails\n#print axioms Zeta.MenoMonoidal.hexagon1_swap\n#print axioms Zeta.MenoMonoidal.hexagon2_swap\n' \
            | cat Lean4/MenoMonoidalHexagons.lean - > /tmp/meno_hexagons_axiom_audit.lean
          # `MenoTwistCentrality` (081M00EZXN2087G0R003AY3WSJ) lands with its gate, as
          # `MenoBalancedTwist` did — a new proof file that is built but unaudited is a
          # regression to `sorry` waiting to type-check green.
          printf '#print axioms Zeta.MenoTwistCentrality.actAt_prod\n#print axioms Zeta.MenoTwistCentrality.actAtInv_prod\n#print axioms Zeta.MenoTwistCentrality.actWord_prod\n#print axioms Zeta.MenoTwistCentrality.linearize_fiber_invariant\n#print axioms Zeta.MenoTwistCentrality.linearize_not_scalar\n#print axioms Zeta.MenoTwistCentrality.fullTwist_moves\n#print axioms Zeta.MenoTwistCentrality.fullTwist_not_scalar\n#print axioms Zeta.MenoTwistCentrality.scalar_twist_forces_symmetry\n#print axioms Zeta.MenoTwistCentrality.generators_not_commute\n#print axioms Zeta.MenoTwistCentrality.PreTwist.natural_braiding\n#print axioms Zeta.MenoTwistCentrality.PreTwist.natural_braiding_inv\n#print axioms Zeta.MenoTwistCentrality.PreTwist.natural_tensor\n#print axioms Zeta.MenoTwistCentrality.PreTwist.natural_associator\n#print axioms Zeta.MenoTwistCentrality.PreTwist.natural_leftUnitor\n#print axioms Zeta.MenoTwistCentrality.PreTwist.natural_rightUnitor\n#print axioms Zeta.MenoTwistCentrality.PreTwist.natural_of_mem\n#print axioms Zeta.MenoTwistCentrality.PreTwist.toTwist\n#print axioms Zeta.MenoTwistCentrality.preTwist_id_forces_symmetry\n#print axioms Zeta.MenoTwistCentrality.Framed.dbl_one_one_ne_id\n#print axioms Zeta.MenoTwistCentrality.Framed.framedTwist\n#print axioms Zeta.MenoTwistCentrality.Framed.framedTwist_gen\n#print axioms Zeta.MenoTwistCentrality.Framed.framedTwist_two_ne_id\n#print axioms Zeta.MenoTwistCentrality.mutant_half_twist_not_central\n#print axioms Zeta.MenoTwistCentrality.mutant_block_swap_not_central\n#print axioms Zeta.MenoTwistCentrality.mutant_delta_fourth_ne_full_twist\n#print axioms Zeta.MenoTwistCentrality.fullTwist_central_dihedral3\n' \
            | cat Lean4/MenoTwistCentrality.lean - > /tmp/meno_centrality_axiom_audit.lean
          # ── Added 2026-08-22 (081M0N9SSJ1087G0R001WVSN9V): the ADAPTED PORT of
          # `Zeta23/LinAlg/` from anthropics/zeta-23-lean (Apache-2.0, (c) 2026 Anthropic
          # PBC) and OUR anti-vacuity witness for it. Ported code lands WITH its gate:
          # a port nothing audits is a `sorry` waiting to type-check green, and the fact
          # that upstream audited it does not audit it HERE, at OUR pin.
          printf '#print axioms RHLinalg.posIndex_eq_rank_of_posSemidef\n#print axioms RHLinalg.rtrace_eq_sum_eigenvalues\n#print axioms RHLinalg.sum_eigenvalues_reindex\n#print axioms RHLinalg.card_eigenvalues_reindex\n#print axioms RHLinalg.frobSq_hermitian_eq_sum_sq_eigenvalues\n#print axioms RHLinalg.normSqMatrix_mem_doublyStochastic_of_unitary\n#print axioms RHLinalg.re_trace_mul_eq_eigenvalue_bilinear\n#print axioms RHLinalg.bilinear_doublyStochastic_le_of_monovary\n#print axioms RHLinalg.vonNeumann_trace_ineq\n#print axioms RHLinalg.hermPosPart_sub_hermNegPart\n#print axioms RHLinalg.hermPosPart_posSemidef\n#print axioms RHLinalg.hermNegPart_posSemidef\n#print axioms RHLinalg.hermPosPart_mul_hermNegPart\n#print axioms RHLinalg.rtrace_sub_decomp\n#print axioms RHLinalg.posIndex_eq_max_finrank_posDefOn\n#print axioms RHLinalg.finrank_le_posIndex_of_posDefOn\n#print axioms RHLinalg.posIndex_conj_le\n#print axioms RHLinalg.posIndex_add_le\n#print axioms RHLinalg.rank_trace_ineq\n#print axioms RHLinalg.rank_trace_ineq_two\n#print axioms RHLinalg.weyl_posIndexAbove_le\n#print axioms RHLinalg.cauchySchwarz_count\n' \
            | cat Zeta23/LinAlg.lean - > /tmp/vonneumann_port_axiom_audit.lean
          # The witness is the check upstream's bar CANNOT perform: sorry-freeness says
          # nothing about whether the statement still means what it meant. W4 in
          # particular is a machine-checked REFUTATION of the swapped-pairing mutant.
          printf '#print axioms Zeta.VonNeumannTraceWitness.pair_of_sum_and_sumSq\n#print axioms Zeta.VonNeumannTraceWitness.eigenvalues₀_fin_two\n#print axioms Zeta.VonNeumannTraceWitness.evP\n#print axioms Zeta.VonNeumannTraceWitness.evQ\n#print axioms Zeta.VonNeumannTraceWitness.evS\n#print axioms Zeta.VonNeumannTraceWitness.evR\n#print axioms Zeta.VonNeumannTraceWitness.Pproj_Qmix_not_commute\n#print axioms Zeta.VonNeumannTraceWitness.trace_lt_bound_noncommuting\n#print axioms Zeta.VonNeumannTraceWitness.trace_eq_bound_aligned\n#print axioms Zeta.VonNeumannTraceWitness.trace_lt_bound_antialigned\n#print axioms Zeta.VonNeumannTraceWitness.mutant_swapped_pairing_false\n#print axioms Zeta.VonNeumannTraceWitness.vonNeumann_at_witness\n' \
            | cat Lean4/VonNeumannTraceWitness.lean - > /tmp/vonneumann_witness_axiom_audit.lean

          # ── Added 2026-08-10: three files that were in NEITHER list ──────────────
          # Each audits ONLY declarations measured sorry-free on 2026-08-10, so these
          # are genuine regression gates rather than permanently-red steps. Files that
          # legitimately carry an OPEN obligation keep it; the closed theorems around
          # it are still protected, which is the whole point of auditing per-declaration
          # instead of per-file.
          printf '#print axioms degreeLT_mem_rsCode\n#print axioms phase_clock_recoverable_under_erasure\n' \
            | cat ImaginaryStack/PhaseClockErasure.lean - > /tmp/pce_axiom_audit.lean
          # `disjoint_deltas_commute` is a DECLARED research-target sorry and is excluded.
          printf '#print axioms empty_delta_identity\n#print axioms consolidate_idempotent\n' \
            | cat Lean4/SchemaEvolution.lean - > /tmp/schema_axiom_audit.lean
          # The 13 the file itself certifies sorry-free. Excluded by the file's own
          # accounting: logRatio_eq_mutualInfo_diff (the open obligation) and
          # dataProcessing (derived from it).
          printf 'open Zeta.FinDataProcessing\n#print axioms relEntropy_nonneg\n#print axioms gibbs_le\n#print axioms relEntropy_self\n#print axioms FinJointLogForm.mutualInfo_eq_logsum\n#print axioms MarkovChain.chan_le_one\n#print axioms MarkovChain.jointXZ_pY_eq\n#print axioms MarkovChain.jointXZ_pX_eq\n#print axioms MarkovChain.sum_out_z\n#print axioms MarkovChain.sum_out_y\n#print axioms MarkovChain.sum_qf_y\n#print axioms MarkovChain.sum_pf3_one\n#print axioms MarkovChain.sum_qf3_one\n#print axioms MarkovChain.pf3_zero_or_qf3_pos\n' \
            | cat Lean4/FinDataProcessing.lean - > /tmp/findata_axiom_audit.lean

          bun ../Core.TypeScript/hygiene/run-checked.ts \
            --label "toymodel axiom audit" --deny 'sorryAx' \
            --message "ToyModel depends on sorryAx — a proof regressed to sorry/admit" \
            -- lake env lean /tmp/toymodel_axiom_audit.lean
          bun ../Core.TypeScript/hygiene/run-checked.ts \
            --label "erasure axiom audit" --deny 'sorryAx' \
            --message "ErasureDistance depends on sorryAx — a proof regressed to sorry/admit" \
            -- lake env lean /tmp/erasure_axiom_audit.lean
          bun ../Core.TypeScript/hygiene/run-checked.ts \
            --label "privacy axiom audit" --deny 'sorryAx' \
            --message "IdentityForcesPrivacy depends on sorryAx — a proof regressed to sorry/admit" \
