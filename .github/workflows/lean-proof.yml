            --message "The Zeta23/LinAlg port depends on sorryAx, or a name did not resolve at our pin — the ported §3 engine regressed or drifted" \
            -- lake env lean /tmp/vonneumann_port_axiom_audit.lean
          bun ../Core.TypeScript/hygiene/run-checked.ts \
            --label "vonneumann witness axiom audit" --deny 'sorryAx' --deny 'Unknown constant' \
            --message "VonNeumannTraceWitness depends on sorryAx, or a name did not resolve — the anti-vacuity witness for the von Neumann port regressed" \
            -- lake env lean /tmp/vonneumann_witness_axiom_audit.lean
          # ── Anti-vacuity guard (added 2026-08-10) ────────────────────────────────
          # Every audit below decides PASS by the ABSENCE of `sorryAx` in the output.
          # If a `#print axioms` names a declaration that does not resolve — renamed,
          # moved, or mis-qualified — Lean reports "Unknown constant", prints no axiom
          # line, and the grep finds no `sorryAx`. The step then PASSES while checking
          # nothing. A check that cannot fail is not a check.
          #
          # This was not hypothetical: the FinDataProcessing names above were initially
          # written unqualified and all 13 silently resolved to nothing. Caught by
          # counting the printed declarations instead of trusting the exit code.
          for f in /tmp/*_axiom_audit.lean; do
            bun ../Core.TypeScript/hygiene/run-checked.ts \
              --label "anti-vacuity $f" --deny 'Unknown constant' \
              --message "$f names a declaration that does not resolve — the audit would pass vacuously" \
              -- lake env lean "$f"
          done

          bun ../Core.TypeScript/hygiene/run-checked.ts \
            --label "pce axiom audit" --deny 'sorryAx' \
            --message "PhaseClockErasure depends on sorryAx — a proof regressed to sorry/admit" \
