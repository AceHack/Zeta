# Society heartbeat — evolutionary loop over the agent society.
#
# Runs SocietyEvolution.ts every 30 minutes:
#   1. Score each agent by calibration (CalibrationLedger)
#   2. Select top-k agents by fitness
#   3. Reproduce via AgentGenome.crossover + mutate
#   4. Replace bottom-k agents
#   5. Commit the new generation to docs/observe-events/
#
# This is the GitHub agent society's evolutionary loop — the society evolves
# in real time as agents heartbeat and accumulate calibration history.
#
# Transport: Git commits (the gitSalonTransport from gossip-mesh-transport.ts).
# Each generation is a G-set event: durable, foldable, composable.
#
# Connection to the DLA multi-oracle proof:
#   The society's D_f convergence mirrors the DLA oracle convergence.
#   Both demonstrate substrate-independence: the same eigenvector emerges
#   regardless of which agents (oracles) compute it.

name: society-heartbeat

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes (2x per agent-heartbeat cycle)
  workflow_dispatch:         # manual trigger for testing

permissions:
  contents: write       # push the staging branch
  pull-requests: write  # open/arm the flush PR

concurrency:
  group: society-heartbeat
  cancel-in-progress: false  # never cancel — each generation is a durable fact

jobs:
  evolve:
    name: Society evolution tick
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # ABSENCE IS A NAMED REFUSAL, NOT A SUBSTITUTION.
      #
      # The checkout below carries the BRANCH-PUSH role credential, and that role has no
      # substitute. The `|| secrets.GITHUB_TOKEN` rung this step replaces selected on the
      # secret being EMPTY and handed the lane a credential with DIFFERENT authority: the
      # push still succeeded, so the lane looked alive, and the failure surfaced later
      # under an error naming the wrong subject. It also trips GitHub's recursion guard —
      # actions taken with GITHUB_TOKEN do not trigger other workflows — so the degraded
      # lane silently stopped producing the events downstream jobs wait on.
      #
      # COST: one `test -z` on a bare runner, no checkout, no network. It buys one legible
      # line naming the exact secret and the exact scope instead of a downstream misread.
      - name: Assert the branch-push credential is present
        env:
          BRANCH_PUSH_TOKEN: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}
        run: |
          if [ -z "${BRANCH_PUSH_TOKEN:-}" ]; then
            echo "::error title=Missing ZETA_TELEMETRY_FLUSH_TOKEN::This lane holds the BRANCH-PUSH role and its credential is absent. There is no substitute: GITHUB_TOKEN carries different authority and its pushes do not trigger workflows. FIX: set repository secret ZETA_TELEMETRY_FLUSH_TOKEN on Lucent-Financial-Group/Zeta to a fine-grained PAT with Contents: read and write, Pull requests: read and write, Metadata: read. Role table: docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md"
            exit 1
          fi
          echo "branch-push credential present (role=branch-push secret=ZETA_TELEMETRY_FLUSH_TOKEN)"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          # THIS CHECKOUT'S CREDENTIAL IS THE ONE THAT PUSHES `heartbeat/society`.
          # This job has exactly ONE checkout and exactly ONE push: `flush-via-staging.ts
          # flush` runs `git push --force-with-lease origin HEAD:refs/heads/heartbeat/society`
          # with whatever credential the checkout persisted, and THAT push's actor is what
          # decides whether `gate (required)` ever runs on the flush PR. The `GH_TOKEN` on the
          # Flush step below is a different credential doing a different job (it is what `gh`
          # authenticates PR creation with) and it was never the missing half.
          #
          # WHY THE PAT (081M05G8D36087G0R0034D3QPA, 081M010H4KE): a `pull_request` run whose
          # triggering actor is `github-actions[bot]` is created and then immediately parked
          # — status `completed`, conclusion `action_required` — so it never executes and
          # never contributes a check to the PR's rollup.
          #
          # MEASURED ON THIS LANE, not inherited from the tick-metrics write-up. PR #10708,
          # head 46ec2994 (the 2026-08-17T00:21Z tick): ALL 36 `pull_request` runs read
          # `completed/action_required` with `actor=github-actions[bot]`, `gate` among them,
          # and the PR's rollup carried 6 check-runs and no gate row. 964 such parked runs on
          # 2026-08-16 alone. The PR has been open and unmergeable since 2026-08-14.
          #
          # AND THE CONTROL PAID OFF. #11034 treated tick-metrics and left this lane
          # byte-identical on purpose. Same-day real-tick reading, ~10 minutes apart:
          #   heartbeat/tick-metrics 00:14Z + 00:32Z (TREATED)   gate actor=AceHack, EXECUTES
          #   heartbeat/society      00:21Z (UNTREATED CONTROL)  gate actor=github-actions[bot], PARKED
          # One variable, two lanes, one repository, one hour. That is the attribution the
          # control existed to buy, and it is spent here.
          #
          # NOTE the earlier reading — "GITHUB_TOKEN pushes do not trigger workflows at all"
          # — is WRONG and must not be repeated: the run IS created, it is held. Same cure,
          # different mechanism.
          #
          # ROLE: BRANCH-PUSH. One role, one secret. docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md
          # assigns ZETA_TELEMETRY_FLUSH_TOKEN this role and only this role; the
          # PR-create role is ZETA_PR_ARCHIVE_TOKEN and the dispatch role is
          # ZETA_SOCIETY_DISPATCH_TOKEN. A `||` chain collapsed all three into one
          # variable, which is why the rung below is gone.
          #
          # WHAT THE REMOVED `|| secrets.GITHUB_TOKEN` RUNG COST. It selected on the
          # secret being EMPTY and silently substituted a credential with DIFFERENT
          # authority, so the lane kept running and failed somewhere downstream under an
          # error naming the wrong subject. Compounding it, GitHub's recursion guard means
          # actions taken with GITHUB_TOKEN do not trigger other workflows — so a degraded
          # lane ALSO stopped producing the events downstream jobs wait on, silently.
          # ABSENCE is now the assert step above: loud, and it names the secret and scope.
          # DENIAL remains the preflight's job below. Two distinct conditions, two
          # distinct reports — that separation is the fix.
          persist-credentials: true
          token: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}

      # THE FALSIFIER FOR THE CREDENTIAL, RUN IN PRODUCTION ON EVERY RUN.
      #
      # #10913 verified a credential fix against a STUBBED git and it failed on the first
      # real tick, because a stub models control flow and says nothing about which token git
      # actually authenticates with. So this is not a stub and not a mock: it is a real
      # `git push` to the real remote over the real network, with `--dry-run` so it updates
      # nothing. GitHub performs repository-write authorization at the `git-receive-pack`
      # advertisement, before any ref is considered, so a dry run gets the true 403/200
      # answer.
      #
      # It probes a `credprobe/` ref, never `heartbeat/society`: HEAD here is main and the
      # lane branch has diverged (the flush squashes), so probing the real lane would be
      # rejected as non-fast-forward and a permission answer would be indistinguishable from
      # an ancestry answer. A ref that does not exist yet has no ancestry question to get
      # wrong. `--dry-run` creates nothing.
      #
      # It runs BEFORE `prepare` and before the evolution tick, which is deliberate:
      # `prepare` checks out a new branch and merges, so a credential fault discovered after
      # it would be discovered with a generation's work in the tree. There is nothing to lose
      # by answering the credential question first.
      - name: Preflight the push credential
        env:
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          probe() { git push --dry-run origin "HEAD:refs/heads/credprobe/society" 2>&1; }

          if OUT=$(probe); then
            echo "[preflight] society: push credential is authorized for this repository."
            exit 0
          fi
          echo "$OUT"

          # Only a CREDENTIAL answer is eligible for the swap. A network blip or an
          # unexpected refusal must NOT silently re-point the credential — that would hide a
          # different failure behind a credential story.
          if ! printf '%s' "$OUT" | grep -qiE 'denied to|Authentication failed|Invalid username or token|error: 403'; then
            echo "::warning title=society preflight inconclusive::the probe failed, but not with a credential answer. Leaving the credential as-is; the real push below will report the true error."
            exit 0
          fi

          echo "::error title=society PAT cannot push::ZETA_TELEMETRY_FLUSH_TOKEN was denied by the remote. FIX: grant that fine-grained PAT 'Contents: read and write' on Lucent-Financial-Group/Zeta. Falling back to GITHUB_TOKEN: the lane keeps recording, but 'gate (required)' will NOT start on the flush PR (081M010H4KE)."

          # Swap the credential the way actions/checkout itself sets it — one
          # `--replace-all` of the extraheader, which is the key git actually authenticates
          # with. `git -c http.<url>.extraheader=` APPENDS rather than overrides, and
          # re-pointing the remote URL alone did not displace it in production (#10913), so
          # neither of those is used here.
          HDR_B64=$(printf 'x-access-token:%s' "$FALLBACK_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$HDR_B64"
          git config --local --replace-all "http.https://github.com/.extraheader" "AUTHORIZATION: basic $HDR_B64"

          # RE-PROBE. Without this the fallback is the vacuity class: a repair that is
          # applied and never checked looks identical to one that worked. #10913's fallback
          # ran, logged that it ran, and was denied under the same identity.
          if OUT2=$(probe); then
            echo "[preflight] society: fallback credential verified against the remote; lane is DEGRADED but alive."
            {
              echo "### heartbeat/society is running on the FALLBACK credential"
              echo ""
              echo "\`ZETA_TELEMETRY_FLUSH_TOKEN\` was denied by the remote; \`GITHUB_TOKEN\` is verified and in use."
              echo "Evolution events still land on the staging branch. \`gate (required)\` will NOT start on the flush PR until the PAT can push."
              echo "Fix: grant that fine-grained PAT **Contents: read and write** on this repository."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$OUT2"
          echo "::error title=society has no working push credential::BOTH the PAT and GITHUB_TOKEN were denied. This is worse than #10850 and the lane is about to fail its push. Not exiting here so the generation is still computed and the push reports the authoritative error."

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure committer
        run: |
          git config user.name "society[bot]"
          git config user.email "society[bot]@users.noreply.github.com"

      # docs/observe-events/ is ALREADY per-event ZetaId-keyed — one file per event, no
      # two writers on one path. There is nothing to shard here; the union of the staging
      # branch and main is a plain G-Set union (commutative, idempotent).
      - name: Prepare staging working tree
        run: bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts prepare --lane society

      - name: Run society evolution tick
        env:
          # Optional: set ZETA_REALTIME_URL in repo secrets to push evolution
          # events over WebSocket in real-time. §13 declared channel.
          ZETA_REALTIME_URL: ${{ secrets.ZETA_REALTIME_URL }}
        run: |
          # Run the society evolution script.
          # Exits 0 on success, non-zero on failure (non-fatal — the society
          # continues even if one evolution tick fails).
          #
          # `set -o pipefail` is LOAD-BEARING and must not be removed. Without it
          # the pipeline below reports `tail`'s status, which is always 0, so the
          # `|| echo` guard was DEAD CODE and a crashing runner was indistinguishable
          # from a healthy tick. That is this repo's own "never read exit status
          # through a pipe" rule, and it was violated here on main until 2026-08-20.
          # The failure stays non-fatal by design (`|| echo`), but it is now VISIBLE.
          set -o pipefail
          bun src/Core.TypeScript/planning/society-evolution-runner.ts \
            --event-dir docs/observe-events \
            --generations 1 \
            2>&1 | tail -10 || echo "[society] evolution tick failed (non-fatal)"

      # Lands via the ungated `heartbeat/society` staging branch + a squash-auto-merge PR,
      # not a direct push: ruleset "CI Gate" requires `gate (required)` on main at push
      # time with no bypass actors. Events are never lost if the PR is slow — they sit on
      # the staging branch and the next tick carries them plus any new ones.
      - name: Flush evolution events to main via staging branch + PR
        env:
          # ROLE: PR-CREATE. One role, one secret.
          #
          # The enterprise forbids the Actions identity from creating pull requests, so the
          # `gh` calls in this step authenticate as ZETA_PR_ARCHIVE_TOKEN — the credential the
          # role table in
          # docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md
          # assigns to `gh pr create`. The BRANCH PUSH is a different role and is already
          # authenticated by the persisted checkout credential (ZETA_TELEMETRY_FLUSH_TOKEN);
          # the `||` chain that stood here collapsed both roles plus GITHUB_TOKEN into one
          # variable and silently substituted whichever happened to be set.
          #
          # ABSENCE IS A NAMED REFUSAL, NOT A SUBSTITUTION. `openMergePR` refuses an empty
          # GH_TOKEN and names the secret and the exact scope
          # (src/Core.TypeScript/agent-heartbeats/merge-heartbeats-to-main.ts). The payload
          # still parks safely on the staging branch — nothing is lost — and the step goes
          # red rather than landing under the wrong authority.
          GH_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN }}
        run: |
          bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts flush \
            --lane society \
            --paths docs/observe-events \
            --message "society: evolution tick $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Autonomous evolutionary loop: score → select → crossover → mutate → replace.
          Transport: Git (gitSalonTransport). One generation per tick.

          Co-Authored-By: Kiro <noreply@kiro.dev>"

