name: Deploy to GitHub Pages

# Scaffold (081KR2E4K0008QG0R003VN9WC8): manual-dispatch only until the Astro build substrate
# (package.json `build` script + Astro dependency) lands. The auto-trigger
# on `push: main` is intentionally omitted so the not-yet-buildable scaffold
# does not fail on every merge to main. Re-enable the push trigger when the
# build substrate exists.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build with Astro
        run: bun run build # This will need to be configured in package.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6edf4629b9d6b # v3.0.1
        with:
          path: './dist' # Default Astro output directory

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db9016255d23f12663d6b1424a90c5535fef66 # v4.0.5
