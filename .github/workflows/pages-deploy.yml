name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Self-heal: heartbeat/metrics commits are pushed by the Actions token, which by
  # GitHub's anti-recursion rule do NOT trigger this workflow — yet they still disturb
  # the Pages deployment and 404 the /preview/ book subtree. A schedule tick redeploys
  # the current main artifact so the book link recovers on its own (build_type=workflow;
  # the legacy branch-builder is disabled). See the book-preview step below.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build static Pages artifact
        run: bun run pages:build
      - name: Add book preview (unlisted — noindex in <head>, not linked from the site, know-the-URL)
        run: |
          mkdir -p dist/preview/ybth-7q2m/en dist/preview/ybth-7q2m/id dist/preview/ybth-7q2m/vi dist/preview/ybth-7q2m/ko dist/preview/ybth-7q2m/th
          cp docs/books/you-born-at-the-hinge/site/index.zh.html dist/preview/ybth-7q2m/index.html
          cp docs/books/you-born-at-the-hinge/site/index.en.html dist/preview/ybth-7q2m/en/index.html
          cp docs/books/you-born-at-the-hinge/site/index.id.html dist/preview/ybth-7q2m/id/index.html
          cp docs/books/you-born-at-the-hinge/site/index.vi.html dist/preview/ybth-7q2m/vi/index.html
          cp docs/books/you-born-at-the-hinge/site/index.ko.html dist/preview/ybth-7q2m/ko/index.html
          cp docs/books/you-born-at-the-hinge/site/index.th.html dist/preview/ybth-7q2m/th/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
