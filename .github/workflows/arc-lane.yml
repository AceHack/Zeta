name: arc-lane

# ARC-AGI-3 LANE TESTS — a drift check, NOT a gate.
#
# WHY THIS IS NOT A GATE, and why that is a design constraint rather than a
# preference. `docs/design/2026-08-23-arc-agi-3-integration-design-chip8-chip9-
# atari-and-the-arena.md` §3.2 constraint 2 states it outright: "No gate job
# depends on it ... never a required check. `main`'s gate is green and this must
# not touch it." The reason is constraint 1: `arc-agi`/`arcengine` are a separate
# uv project precisely so that A RESOLUTION FAILURE IN THIS LANE CANNOT BREAK
# `uv sync --project src/Core.Python`. A required job here would hand that lane
# the power to block every PR in the repo — the exact coupling the split exists
# to prevent.
#
# So this workflow appears in NO `needs:` list, and `gate (required)` (gate.yml,
# floor = build-and-test / lint / lint-typescript / cross-verify / full-verify)
# neither waits for it nor sees it. Red here is information, not a stop —
# the same posture as `bytelock` and `drift (loud)`.
#
# ONE DEPARTURE FROM §3.2, STATED RATHER THAN SLIPPED IN. The design doc names
# the triggers as "workflow_dispatch (+ optional cron)". This also runs on
# `pull_request`, path-filtered to the lane. The doc's stated REASON is that the
# gate must not be touched, and a workflow outside every `needs:` list does not
# touch it — while post-merge-only feedback means a broken lane is found after
# it lands rather than before. If the maintainer wants the literal reading,
# delete the `pull_request:` block; nothing else changes.
#
# WHAT IS HARD HERE — LIVENESS, not the result. The hazard is this job going
# GREEN WHILE RUNNING NOTHING: a pytest that collects 0 tests exits 5, and a
# `uv sync` that silently resolves an empty project would leave a passing job
# that verified nothing. That is the false-green shape this repo has been bitten
# by before (the byte-lock "verified 0 of 10"). So the run asserts a floor on
# the collected-test count and fails when it is not met.

on:
  pull_request:
    paths:
      - "src/Arc.Python/**"
      - ".github/workflows/arc-lane.yml"
  push:
    branches: [main]
    paths:
      - "src/Arc.Python/**"
      - ".github/workflows/arc-lane.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: arc-lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arc-tests:
    name: arc lane (drift check)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
            ~/.rustup/toolchains/1.87.0-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
            ~/.cache/zeta/from-autotools-tarball/*.tgz
          key: install-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        env:
          # TIER DECLARED, not detected. This job genuinely needs the wider payload:
          # uv/python plus the ARC lane's own project sync; the payload has not been measured down.
          # Recorded explicitly so the next reader sees a decision rather than a default;
          # audit-install-tier-declared.ts refuses silence, never a particular tier.
          ZETA_HOST_TIER: full
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if ./tools/setup/install.sh; then exit 0; fi
            [ "$attempt" = "5" ] && { echo "install.sh failed after 5 attempts"; exit 1; }
            case "$attempt" in
              1) backoff=10 ;;
              2) backoff=30 ;;
              3) backoff=60 ;;
              4) backoff=120 ;;
            esac
            echo "install.sh attempt $attempt failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
          done

      - name: Sync the ARC lane's own uv project
        # `--project src/Arc.Python`, never a dependency of zeta-core: design
        # §3.2 constraint 1. If this resolution fails, only this job goes red.
        run: uv sync --project src/Arc.Python

      - name: Run the ARC lane tests
        env:
          # The floor that makes a green here mean something. Raise it when the
          # suite grows; a DROP is the signal — tests silently stopping to run
          # is the failure this exists to catch, and it looks exactly like
          # success without this check.
          #
          # FAIL-CLOSED, and verified rather than assumed: deleting this env
          # entry does NOT quietly disable the floor. `set -u` in the step below
          # makes the unbound variable exit non-zero, so the check cannot be
          # removed by accident without the job going red. (Measured: with the
          # variable unset the step exits 1.)
          ARC_MIN_TESTS: "88"
        run: |
          set -euo pipefail
          uv run --project src/Arc.Python pytest src/Arc.Python/tests -q --junitxml=/tmp/arc-junit.xml
          collected=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/arc-junit.xml").getroot()
          suites = root.findall("testsuite") or [root]
          print(sum(int(s.get("tests", 0)) for s in suites))
          PY
          )
          echo "collected ${collected} tests (floor ${ARC_MIN_TESTS})"
          if [ "${collected}" -lt "${ARC_MIN_TESTS}" ]; then
            echo "::error::LIVENESS FAILURE — only ${collected} tests ran, floor is ${ARC_MIN_TESTS}." >&2
            echo "A suite that stops running looks identical to a suite that passes." >&2
            exit 2
          fi

      - name: Report the hosted environments this key can see
        # RECONNAISSANCE, not play. The lane discovers real ARC environments but
        # still plays ZetaChase; before writing a play loop against 25 of them
        # it is worth seeing what they are. Keyless runs (every `pull_request`)
        # print an empty roster and pass — the same degradation as everything
        # else here, so this step is safe on the credential-free path.
        env:
          ARC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ARC_API_KEY || '' }}
        run: uv run --project src/Arc.Python python -m zeta_arc.play --list-environments

      - name: Play a scored episode (the lane's end-to-end smoke)
        # The unit tests can all pass while the loop itself is broken. This is
        # the whole pipeline — environment, perception, agent, scoring — and it
        # asserts the agent still clears every level rather than merely running.
        env:
          # THE KEY IS WITHHELD FROM `pull_request` ON PURPOSE, and this is a
          # security boundary rather than a tidiness preference.
          #
          # GitHub withholds secrets only from FORK pull requests. This repo's
          # PRs come from branches on the repo itself, so a `pull_request` run
          # here WOULD receive the real secret — and every agent in this repo
          # pushes branches and opens PRs. Any PR touching `src/Arc.Python/**`
          # could then add a step that prints it. Exposing a credential to
          # code that has not been reviewed yet is exactly backwards.
          #
          # So PRs run the OFFLINE path (no key -> `operation_mode_for` returns
          # OFFLINE, which is measured to make no request), and only
          # `push: main` and `workflow_dispatch` — where the code is already
          # merged or a human pressed the button — get the key.
          #
          # The cost is real and accepted: no hosted-environment feedback at PR
          # time. The lane still runs, because absence of a key degrades rather
          # than fails, and `test_play_mode.py` holds that.
          ARC_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ARC_API_KEY || '' }}
          # THE FALSIFIER FOR THE WIRING ITSELF. Without this the secret is
          # unfalsifiable: rename it, unset it, or typo it, and the lane simply
          # degrades to OFFLINE and the job stays GREEN — "verifying nothing"
          # wearing a success. On runs that are SUPPOSED to have the key, a
          # mode other than NORMAL means the secret did not arrive, and that is
          # a wiring fault worth surfacing. It costs nothing to say so here:
          # this workflow blocks no merge.
          EXPECT_ARC_KEY: ${{ github.event_name != 'pull_request' && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          uv run --project src/Arc.Python python -m zeta_arc.play --agent pixel --seed 4 \
            | tee /tmp/arc-play.json
          python3 - <<'PY'
          import json, os, sys
          # play.py logs to stderr; stdout is the JSON object.
          text = open("/tmp/arc-play.json").read()
          start = text.index("{")
          result = json.loads(text[start:])
          cleared, levels = result["levels_cleared"], result["levels"]
          mode, found = result["mode"], result["arcade_environments_discovered"]
          print(f"mode={mode} environments={found} levels_cleared={cleared} score={result['environment_score']}")
          if cleared < len(levels) or not all(l["solved"] for l in levels):
              unsolved = [l["level"] for l in levels if not l["solved"]]
              sys.exit(f"::error::the pixel agent no longer clears every level; unsolved={unsolved}")
          if os.environ["EXPECT_ARC_KEY"] == "yes" and mode != "NORMAL":
              sys.exit(
                  f"::error::ARC_API_KEY did not reach this run — mode is {mode!r}, expected "
                  "'NORMAL'. The lane degraded to OFFLINE and would otherwise have passed "
                  "silently. Check the repository secret is named exactly ARC_API_KEY."
              )
          if os.environ["EXPECT_ARC_KEY"] == "no" and mode != "OFFLINE":
              sys.exit(
                  f"::error::a pull_request run obtained mode {mode!r} — the credential is "
                  "reaching unreviewed code, which the env guard above exists to prevent."
              )
          PY

  arc-hosted-sweep:
    name: arc lane (hosted sweep)
    # A SEPARATE JOB, not another step on `arc-tests`, for two reasons that are
    # both about not letting this one hurt the other. It downloads and plays up
    # to 25 environments, so its runtime is bounded by a network we do not own —
    # sharing `arc-tests`'s 15-minute budget would let a slow roster turn the
    # drift check red for a reason that has nothing to do with drift. And it
    # cannot run at all on `pull_request`, where the credential is withheld, so
    # as a step it would be a permanently-skipped block inside a job that does
    # run.
    #
    # Still not a gate: `arc-lane` appears in no `needs:` list anywhere, and
    # adding a job to it does not change that. Red here is information.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
            ~/.rustup/toolchains/1.87.0-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
            ~/.cache/zeta/from-autotools-tarball/*.tgz
          key: install-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'tools/setup/**', 'global.json') }}

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        env:
          ZETA_HOST_TIER: full
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if ./tools/setup/install.sh; then exit 0; fi
            [ "$attempt" = "5" ] && { echo "install.sh failed after 5 attempts"; exit 1; }
            case "$attempt" in
              1) backoff=10 ;;
              2) backoff=30 ;;
              3) backoff=60 ;;
              4) backoff=120 ;;
            esac
            echo "install.sh attempt $attempt failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
          done

      - name: Sync the ARC lane's own uv project
        run: uv sync --project src/Arc.Python

      - name: Play every hosted environment this key can see
        env:
          ARC_API_KEY: ${{ secrets.ARC_API_KEY }}
          # THE PER-LEVEL CEILING, AND WHY IT IS NOT 800. The published
          # references run to 578 actions (DC22), so a full-budget sweep of 25
          # environments is tens of thousands of engine steps plus 25 downloads,
          # against a 30-minute wall. 200 is what fits, and it is BELOW the
          # largest reference — which means these are NOT leaderboard scores.
          #
          # That is stated in the output itself (`comparability`), not only
          # here, so the caveat travels with the number instead of being
          # reconstructable only by whoever reads this file. A truncated budget
          # does not measure an agent on a level it never reached; it prevents
          # it from reaching it, and those are different claims.
          ARC_SWEEP_MAX_ACTIONS: "200"
        run: |
          set -euo pipefail
          uv run --project src/Arc.Python python -m zeta_arc.play --play-hosted \
            --seed 4 --max-actions-per-level "${ARC_SWEEP_MAX_ACTIONS}" \
            | tee /tmp/arc-sweep.json
          python3 - <<'PY'
          import json, sys
          text = open("/tmp/arc-sweep.json").read()
          sweep = json.loads(text[text.index("{"):])
          seen, played = sweep["environments_seen"], sweep["environments_played"]
          print(
              f"mode={sweep['mode']} seen={seen} played={played} "
              f"failed={sweep['environments_failed']} "
              f"levels_cleared={sweep['levels_cleared_total']} "
              f"mean_score={sweep['mean_environment_score']}"
          )
          # WHY EACH LEVEL ENDED, counted across the whole roster. This is the
          # read that says whether the CEILINGS are wrong rather than the agent:
          # `level-budget` heavy means levels are defeating the policy, while
          # `episode-budget` heavy means runs are being cut off before the
          # levels ever get a fair attempt and raising the per-level budget
          # would change nothing.
          print(f"  ended: {sweep['ended_breakdown']}")
          for row in sweep["results"]:
              if "error" in row:
                  print(f"  {row['game_id']}: FAILED {row['error']} {row.get('detail','')}")
              else:
                  print(
                      f"  {row['game_id']}: cleared {row['levels_cleared']}"
                      f"/{row['levels_declared']} score {row['environment_score']}"
                      f" ({row['terminated']}; {row.get('ended_breakdown', {})})"
                      # ENGAGEMENT, so a zero score is readable. `inert` counts
                      # levels whose world never changed — a policy not playing
                      # at all, which no budget rise can fix. Zero inert with
                      # zero cleared is the opposite problem: it played and lost.
                      f" [inert {row.get('inert_levels', '?')}"
                      f", moved {row.get('cells_changed_total', '?')} cells]"
                  )
          # LIVENESS, the same failure this lane already guards against once.
          # A sweep that sees zero environments prints a tidy zero and exits 0 —
          # identical in shape to a sweep that played them all and scored
          # nothing. This job only runs where the credential IS supposed to
          # arrive, so an empty roster here is a wiring fault, not a result.
          if seen == 0:
              sys.exit(
                  "::error::the hosted roster is EMPTY on a run that has the "
                  "credential. Nothing was played, and without this check the "
                  "job would have reported that as a clean zero. Check the "
                  "ARC_API_KEY repository secret."
              )
          # A sweep where every environment errored is the second false-green:
          # 25 rows, all failures, mean score 0.0, exit 0.
          if played == 0:
              sys.exit(
                  f"::error::all {seen} environments failed to play. See the "
                  "per-environment errors above."
              )
          PY
