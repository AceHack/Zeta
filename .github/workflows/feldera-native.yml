# Compile Feldera's dbsp crate with factory rust on Linux and macOS,
# then time native Nexmark Q1/Q2 (100k events, 1 core).
#
# Not on every PR. Building dbsp is a cargo-minute bomb
# (Aaron 2026-09-01: do not clone Feldera on every PR). Triggers:
#   * workflow_dispatch
#   * pull_request / push-to-main path-filtered to THIS file
#
# Jobs:
#   native -- factory pin (mise 1.99.0-beta.3) x ubuntu + macos:
#             compile dbsp, then dbsp_nexmark Q1/Q2 100k / 1 core.
#   probe  -- 1.97.0 / 1.98.0 / beta x ubuntu + macos. workflow_dispatch
#             only (ICE already reproduced on GHA 33561885627).
# Windows is omitted: Feldera 0.342.0 `feldera-storage` uses
# `std::os::fd` / `libc::pread` (GHA windows-2025, E0432).
# Classifier: pass / ice / sigsegv / other. expect=ice must be the
# StarJoinFuncTrait Alias panic (rust-lang issue 159457 family).
#
# Pin: feldera/feldera 0.342.0 at 48312b69bde1af8ab8c6bc3551c9545897664b26
# Compile: cargo build --release -p dbsp with debuginfo=0.
# Nexmark: cargo bench -p dbsp_nexmark --bench nexmark -- --query q1 --query q2
#          --max-events 100000 --cpu-cores 1 --csv ...

name: feldera-native

on:
  pull_request:
    paths:
      - ".github/workflows/feldera-native.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/feldera-native.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: feldera-native-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_BENCH_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=0"
  RUSTUP_TOOLCHAIN: "1.99.0-beta.3"
  FELDERA_SHA: 48312b69bde1af8ab8c6bc3551c9545897664b26

jobs:
  native:
    name: native dbsp (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Zeta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh rustup toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/1.99.0-beta.3-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', '.mise.full.toml') }}

      - name: Restore apt archives
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain
        run: ./tools/setup/install.sh

      - name: Checkout feldera (pinned SHA; not a submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: feldera/feldera
          ref: ${{ env.FELDERA_SHA }}
          path: .feldera-native
          persist-credentials: false

      - name: rustc is factory 1.99.0-beta.3
        run: rustc -V

      - name: Compile dbsp Release (debuginfo=0)
        working-directory: .feldera-native
        run: cargo build --release -p dbsp

      - name: Nexmark Q1/Q2 100k 1-core (factory rust)
        working-directory: .feldera-native
        run: |
          set -euo pipefail
          echo "rustc $(rustc -V)"
          out="${GITHUB_WORKSPACE}/feldera-nexmark-out"
          mkdir -p "$out"
          cargo bench --locked -p dbsp_nexmark --bench nexmark -- \
            --query q1 --query q2 --max-events 100000 --cpu-cores 1 --no-progress \
            --csv "$out/feldera-nexmark.csv"
          {
            echo "### Feldera native Nexmark (factory 1.99.0-beta.3, 100k events, 1 core)"
            echo ""
            echo "- runner: \`${{ matrix.os }}\`"
            echo "- rustc: \`$(rustc -V)\`"
            echo ""
            echo '```csv'
            cat "$out/feldera-nexmark.csv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Feldera Nexmark CSV
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feldera-nexmark-${{ matrix.os }}
          path: feldera-nexmark-out/feldera-nexmark.csv
          if-no-files-found: error
          retention-days: 14

  # ubuntu + macos x 1.97.0 / 1.98.0 / beta. Probe rustc is NOT the
  # factory pin: interpolated RUSTUP_TOOLCHAIN, no rustup cache glob.
  probe:
    name: probe dbsp (${{ matrix.os }}, ${{ matrix.pair.rust }})
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        pair:
          - rust: "1.97.0"
            expect: ice
          - rust: "1.98.0"
            expect: ice
          - rust: beta
            expect: pass
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.pair.rust }}
    steps:
      - name: Checkout Zeta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo registry (probe rustc is not the factory glob)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: feldera-probe-${{ runner.os }}-${{ runner.arch }}-${{ matrix.pair.rust }}

      - name: Restore apt archives
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain
        run: ./tools/setup/install.sh

      - name: rustup install probe compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${{ matrix.pair.rust }}" --profile minimal --no-self-update
          rustc "+${{ matrix.pair.rust }}" -V

      - name: Checkout feldera (pinned SHA; not a submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: feldera/feldera
          ref: ${{ env.FELDERA_SHA }}
          path: .feldera-native
          persist-credentials: false

      - name: Compile dbsp and classify
        id: classify
        working-directory: .feldera-native
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.pair.rust }}
        run: |
          set +e
          {
            echo "=== rustc +${{ matrix.pair.rust }} ==="
            rustc "+${{ matrix.pair.rust }}" -V
            echo "=== cargo build --release -p dbsp ==="
            cargo "+${{ matrix.pair.rust }}" build --release -p dbsp
          } >"${GITHUB_WORKSPACE}/dbsp-build.log" 2>&1
          rc=$?
          set -e
          echo "rc=${rc}" >>"${GITHUB_OUTPUT}"
          cat "${GITHUB_WORKSPACE}/dbsp-build.log"

          log="${GITHUB_WORKSPACE}/dbsp-build.log"
          verdict=other
          if [ "${rc}" -eq 0 ]; then
            verdict=pass
          elif grep -q 'could not replace Alias' "${log}"; then
            verdict=ice
          elif grep -qiE 'SIGSEGV|segmentation fault|STATUS_ACCESS_VIOLATION|signal: 11' "${log}"; then
            verdict=sigsegv
          elif [ "${rc}" -eq 139 ] || [ "${rc}" -eq 11 ]; then
            verdict=sigsegv
          fi

          diagnosis=n/a
          if [ "${verdict}" = ice ]; then
            if grep -qE 'StarJoinFuncTrait|try_eagerly_replace_alias|first_method_vtable_slot' "${log}"; then
              diagnosis=match
            else
              diagnosis=ice-other
            fi
          fi

          expect='${{ matrix.pair.expect }}'
          echo "verdict=${verdict}" >>"${GITHUB_OUTPUT}"
          echo "diagnosis=${diagnosis}" >>"${GITHUB_OUTPUT}"
          {
            echo "### probe ${{ matrix.os }} / ${{ matrix.pair.rust }}"
            echo ""
            echo "- rustc: \`$(rustc "+${{ matrix.pair.rust }}" -V)\`"
            echo "- expect: \`${expect}\`"
            echo "- verdict: \`${verdict}\` (rc=${rc})"
            echo "- diagnosis: \`${diagnosis}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

          echo "PROBE os=${{ matrix.os }} rust=${{ matrix.pair.rust }} expect=${expect} verdict=${verdict} diagnosis=${diagnosis} rc=${rc}"

          if [ "${expect}" = pass ]; then
            if [ "${verdict}" != pass ]; then
              echo "expected pass, got ${verdict}" >&2
              exit 1
            fi
          elif [ "${expect}" = ice ]; then
            if [ "${verdict}" != ice ] || [ "${diagnosis}" != match ]; then
              echo "expected ice+match (StarJoinFuncTrait Alias panic), got verdict=${verdict} diagnosis=${diagnosis}" >&2
              echo "GHA did not confirm this-Mac diagnosis; do not treat 1.97/1.98 ICE as runner-reproduced." >&2
              exit 1
            fi
          else
            echo "unknown expect=${expect}" >&2
            exit 1
          fi

      - name: Upload dbsp log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbsp-${{ matrix.os }}-${{ matrix.pair.rust }}
          path: dbsp-build.log
          if-no-files-found: warn
