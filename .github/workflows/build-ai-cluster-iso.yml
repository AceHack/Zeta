# .github/workflows/build-ai-cluster-iso.yml
#
# Builds the AI-cluster installer ISO from full-ai-cluster/flake.nix's
# `installer-iso` package output. Sibling to build-installer-iso.yml
# (which targets the root flake's `infra/nixos/hosts/installer/`);
# this one targets the canonical AI-cluster substrate at
# `full-ai-cluster/usb-nixos-installer/`.
#
# Why two parallel workflows: the repo currently carries two installer
# substrates — `infra/` (older, root flake) and `full-ai-cluster/`
# (newer, dedicated AI-cluster bootstrap, with disko + hwloc +
# zeta-install helper baked in). Consolidating them into a single
# canonical path is a separate follow-up; this workflow makes the
# AI-cluster ISO downloadable from CI in the meantime.
#
# Triggers on PRs touching any of:
#   - `full-ai-cluster/flake.nix`
#   - `full-ai-cluster/flake.lock`
#   - `full-ai-cluster/usb-nixos-installer/**`
#   - `full-ai-cluster/nixos/modules/disko-shapes/**`
#     (because the installer references the disko shape at build time)
#   - this workflow file
# Also on push to main + workflow_dispatch.
#
# Discipline mirrors build-installer-iso.yml:
#   - Runner pinned to ubuntu-24.04 (not -latest)
#   - Third-party actions SHA-pinned with trailing # vX.Y.Z comments
#   - permissions: contents: read at workflow level
#   - Concurrency: workflow-scoped, cancel-in-progress only for PRs
#   - No github.event.* values interpolated into run: lines

name: build-ai-cluster-iso

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "full-ai-cluster/flake.nix"
      - "full-ai-cluster/flake.lock"
      - "full-ai-cluster/usb-nixos-installer/**"
      # Broadened 2026-05-26: was nixos/modules/disko-shapes/** only;
      # empirically missed rebuilds when iter-5.2 (#5103) + iter-5.2.2
      # (#5113) added new NixOS modules (injected-hostname.nix +
      # login-banner.nix). The maintainer 2026-05-26 downloaded an
      # older CI ISO that didn't have iter-5.2 substrate because the
      # filter missed the module changes. Broaden to all nixos/** +
      # tools/** under full-ai-cluster + the source-substrate audit tool.
      - "full-ai-cluster/nixos/**"
      - "src/Core.TypeScript/zflash/**"
      - "src/Core.TypeScript/ci/audit-installer-substrate.ts"
      - "src/Core.TypeScript/ci/audit-installer-iso-content.ts"
      - "src/Core.TypeScript/ci/qemu-boot-test.ts"
      - "src/Core.TypeScript/ci/qemu-x86-marker-image.ts"
      - "src/Core.TypeScript/ci/qemu-x86-discriminator-selftest.ts"
      - "src/Core.TypeScript/ci/qemu-full-install-test.ts"
      - "src/Core.TypeScript/ci/test-iter-54-install-flow.test.ts"
      - "src/Core.TypeScript/zflash/test-harness/**"
      - "src/Core.TypeScript/installer/zeta-creds-restore.ts"
      # Added 2026-06-20: the promoted phase-3 gate (QEMU_FIRST_SESSION_PHASE3)
      # exercises mise bootstrap + the first-session conductor + observe runtime
      # via zeta-install; without these the gate is skipped on bootstrap-only changes.
      - ".mise.toml"
      - "tools/setup/**"
      - "src/Core.TypeScript/observe/**"
      - ".github/workflows/build-ai-cluster-iso.yml"
  push:
    branches: [main]
    paths:
      - "full-ai-cluster/flake.nix"
      - "full-ai-cluster/flake.lock"
      - "full-ai-cluster/usb-nixos-installer/**"
      - "full-ai-cluster/nixos/**"
      # THE FIRST-BOOT MANIFEST TREE, added 2026-09-06
      # (081M1TVCV2Y087G0R0022QGM0Y). `k3s-first-boot-apply-order-eval-test.nix`
      # and `k3s-first-boot-roster.nix` READ these files, and this lane was the
      # only one that ran them -- so until now a change to a first-boot manifest
      # did not run the tests that read first-boot manifests. Measured: PR #16755
      # moved the ArgoCD chart K3S installs on metal first boot and this workflow
      # has no run for that branch.
      #
      # THIS IS THE DRIFT HALF, deliberately. It costs ~32 min and it CANNOT
      # block: `gate (required)` is the only required status check on `main`, so
      # these jobs are watched rather than gating. The fast half is
      # `first-boot-manifest-check.yml`, which evaluates the same flake in
      # minutes and answers a manifest edit without waiting for an ISO.
      #
      # SCOPED TO THE TREE THIS WORKFLOW BUILDS. It makes the full-ai-cluster ISO and
      # evaluates that flake, so it watches the manifests that flake's checks read. A
      # glob for manifests it never evaluates would spend 32 minutes proving nothing
      # about what changed.
      - "full-ai-cluster/k8s/bootstrap/**"
      # WP9 (081M33STPKN087G0R0004B5CAK): the single source
      # `k3s-registry-mirrors.nix` reads via `builtins.fromJSON`. `nixos/**`
      # below already covers a module edit; this covers a JSON-only edit,
      # which would otherwise trigger no lane that evaluates it.
      - "full-ai-cluster/k8s/registry-mirrors.json"
      - "src/Core.TypeScript/zflash/**"
      - "src/Core.TypeScript/ci/audit-installer-substrate.ts"
      - "src/Core.TypeScript/ci/audit-installer-iso-content.ts"
      - "src/Core.TypeScript/ci/qemu-boot-test.ts"
      - "src/Core.TypeScript/ci/qemu-x86-marker-image.ts"
      - "src/Core.TypeScript/ci/qemu-x86-discriminator-selftest.ts"
      - "src/Core.TypeScript/ci/qemu-full-install-test.ts"
      - "src/Core.TypeScript/ci/test-iter-54-install-flow.test.ts"
      - "src/Core.TypeScript/zflash/test-harness/**"
      - "src/Core.TypeScript/installer/zeta-creds-restore.ts"
      - ".mise.toml"
      - "tools/setup/**"
      - "src/Core.TypeScript/observe/**"
      - ".github/workflows/build-ai-cluster-iso.yml"
  workflow_dispatch:
    inputs:
      # Run ONLY the three-VM HA cluster job (081M10ZG61D087G0R001A70F0P follow-up).
      # A full dispatch also runs every dispatch-only step of `build` (scenario
      # 3/4, wifi ESP, keyfile, WP11 — several 90-100 min steps), which is the
      # wrong price for re-running one cluster test. Default false: a plain
      # dispatch is unchanged.
      only_cluster_ha:
        description: "Run only the 3-node HA cluster + replicated Longhorn job"
        type: boolean
        default: false
      # Symmetric to only_cluster_ha, for the same reason: a plain dispatch runs
      # every dispatch-only scenario (3/4, wifi ESP, keyfile, WP11), several of
      # them 90-100 min, so iterating on ONE of them costs hours of unrelated
      # QEMU. WP11 is the installed-disk first-boot k3s verify -- the lane that
      # answers "does Kubernetes come up on a real install", which is the one
      # under active diagnosis. Default false: a plain dispatch is unchanged.
      #
      # ALSO skips the seven always-on hermetic NixOS test steps that run
      # BEFORE the ISO is even built (control-plane cluster-init, node
      # platform fixes, agent join, cluster-CIDR/server-join eval, a second
      # control plane joins, dirty-disk fail-closed, cluster-online) plus the
      # push/workflow_dispatch-gated longhorn-volume-binds step -- MEASURED
      # (run 35965945581): a WP11-scoped dispatch spent its first ~25+ min
      # sitting in "k3s agent JOINS the server", nowhere near the ISO build,
      # none of which exercises the installed-disk boot path WP11 measures.
      # This is scoped to the WORKFLOW_DISPATCH TRIGGER ONLY -- the PR path
      # (pull_request) and push still run every one of those steps
      # unconditionally; a dispatch with only_wp11 is a deliberately narrowed
      # probe, not a weakening of the lane.
      #
      # HOW TO PASS IT (081M39CJP96087G0R001T4J2R3, WP29): a boolean input is
      # read below as `inputs.only_wp11`, and `gh workflow run` sends `-f`
      # values as STRINGS while `-F` sends typed values. Use:
      #
      #   gh workflow run build-ai-cluster-iso.yml --ref main -F only_wp11=true
      #
      # `docs/ops/WP11-SCOPED-DISPATCH.md` carries the same command plus how to
      # CONFIRM it took, which is the part worth doing: read the job's step
      # conclusions and require the dispatch-only steps to say `skipped`.
      only_wp11:
        description: "Run only the WP11 installed-disk first-boot k3s verify (also skips the pre-ISO-build NixOS test steps on a dispatch; PR/push runs are unaffected). Pass with `gh workflow run ... -F only_wp11=true` — -F, not -f, because -f sends a string"
        type: boolean
        default: false
  # WP11 — the installed-disk first-boot k3s verify step below (gated to
  # workflow_dispatch + schedule; see that step's own comment for why it is
  # not on the PR path) needs a way to run unattended. Daily, off the hour,
  # to avoid stacking with other cron lanes at :00.
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read
  # id-token: write moved to jobs.build.permissions per Copilot P1 finding on
  # PR #5417 — matches the repo pattern (.github/workflows/scorecard.yml
  # elevates id-token at job scope only, minimising blast radius if future
  # jobs added to this workflow).

concurrency:
  group: build-ai-cluster-iso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build-iso
    # Skipped only by an explicit `only_cluster_ha` dispatch; `inputs` is empty
    # on every other event, so PR/push/schedule/plain dispatch are unchanged.
    if: ${{ !inputs.only_cluster_ha }}
    runs-on: ubuntu-24.04
    # Cold-cache PR runs can exceed the old 90-minute budget while still
    # actively compiling Nix dependencies in `Build installer ISO` (run
    # 27902283517, 2026-06-21, cancelled at 90m during texinfo/binutils
    # builds). Keep manual dispatch roomier for hardware-oriented debugging,
    # and give PR/push enough budget to finish a real cold build instead of
    # cancelling useful work at the boundary.
    #
    # WP11 (2026-09-22): schedule/workflow_dispatch runs now also carry the
    # installed-disk first-boot k3s verify step (own timeout-minutes: 100,
    # on top of the existing dispatch-only scenario 3/4/wifi/keyfile steps
    # already budgeted at 90m each) — bumped from 240 to 330 so a cold ISO
    # build plus every dispatch-only step has room to finish rather than
    # racing the job-level clock. PR/push stays at 180 — the new step never
    # runs there.
    timeout-minutes: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '330' || '180') }}
    permissions:
      contents: read
      # 081KSKBP80008QG0R000Y2B7HC.1 cosign keyless OIDC — sigstore/Fulcio CA mints a short-lived
      # cert from the GitHub-issued OIDC token; Rekor transparency log records
      # the signature. No private key material is handled in this workflow.
      #
      # Real safety properties (tightened per Copilot P1 review on PR #5417):
      #   - Short-lived cert (Fulcio mints 10-min cert tied to this run)
      #   - Identity bound to workflow path + ref (verifier pins via
      #     --certificate-identity matching this file's path + ref)
      #   - Steps pinned to commit SHAs (cosign-installer at vetted release)
      # NOT a hard guarantee: any step in THIS job that can request the OIDC
      # token could in principle transmit it off-runner + use it to mint a
      # Fulcio cert + sign arbitrary blobs as THIS workflow's identity. The
      # mitigation is pinned + audited steps + job-scope id-token (not
      # workflow-wide; this block).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Preflight: source-substrate audit BEFORE the ~15-min Nix build.
      # Catches the class of bug the maintainer 2026-05-26 surfaced
      # (dropped iter-N modules silently producing stale ISO). Runs
      # in ~1s; fails fast if the substrate is incomplete.
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Audit installer substrate (source-level)
        run: bun src/Core.TypeScript/ci/audit-installer-substrate.ts

      # NOTE ON THE PARITY AUDIT THAT USED TO RUN HERE, and where it went.
      #
      # A step here once invoked src/Core.TypeScript/hygiene/audit-flash-entrypoint-parity.ts,
      # which did not exist -- the source half was held back while another PR was
      # in flight and the CI half landed alone in #13093. The step failed on a
      # missing file on every run, and because the ISO upload, the digest sidecar
      # and cosign signing are all gated behind it, ISO production stopped
      # entirely. #13102 removed it rather than stubbing it: a stub that always
      # passes is worse than no step, because it reports parity as CHECKED while
      # checking nothing.
      #
      # The gap it guarded was real -- the ISO integrity gate existed only in the
      # macOS arm, so flash-usb-linux.ts and flash-usb-windows.ts wrote an image
      # to a block device with no manifest verification at all. That is fixed
      # (081M0HG7X7B087G0R002A05DAP): the gate is one definition in
      # zflash/iso-integrity.ts and all three arms call it.
      #
      # The audit now exists and RUNS -- in gate.yml's cross-verify floor, beside
      # audit-proof-lineage-binaries.ts, which is where the note this replaces
      # said it belonged. It is not restored here: on the gate floor it blocks
      # every PR rather than only the pushes that touch the ISO lane, and it
      # cannot take ISO production down with it a second time.

      # Layer 2a (structural-behavioral) — asserts logical relationships
      # between iter-5.4 substrate elements (gh auth setup-git is INSIDE
      # the auth-success branch; SSH_KEY_ERR_FILE is wired AS stderr to
      # gh ssh-key list; iter-5.4.1 is gated on GH_AUTH_OK=1; etc.).
      # Stronger than the source-substrate audit (which just checks for
      # substring presence). Runs in ~150ms.
      - name: Iter-5.4 install-flow structural-behavioral test
        run: bun test src/Core.TypeScript/ci/test-iter-54-install-flow.test.ts

      - name: Install Nix
        # Upstream Nix only — no Determinate/FlakeHub login. Public flakes + cache.nixos.org
        # are sufficient; FlakeHub OIDC login flakes with "Transient authentication mechanism
        # error" and blocked build-iso on PR #8095 (2026-06-14).
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Show flake metadata
        working-directory: full-ai-cluster
        run: nix flake metadata --json | jq '{description, lastModified, revision}'

      - name: Check flake evaluates
        working-directory: full-ai-cluster
        # Eval-only check — catches typos, missing imports, undefined
        # attributes before paying for the build. Skip building checks
        # to keep this cheap.
        #
        # `--all-systems` added 2026-09-09 (081M244SY6K087G0R002WDBCZJ) for the reason
        # root-flake-check.yml and first-boot-manifest-check.yml already state in their
        # own words: without it "nix silently omits outputs incompatible with the runner
        # and still exits 0, which is a narrower vacuous green replacing a wider one."
        # MEASURED on this flake, same host, same tree, counted with the very pattern the
        # assertion below uses: 94 output lines without the flag, 189 with it. Cost
        # measured at the same time: 7 s -> 54 s. Twice the flake for 47 s, inside a job
        # that measures ~32 min.
        #
        # AND THE FLAG IS LOAD-BEARING, not cosmetic: replaying the assertion below
        # against both logs, the no-flag log FAILS on `gpu-node-label-preflight` — that
        # check hangs off `nixosConfigurations.worker-gpu` and is omitted outright when
        # nix restricts itself to the current system. One of the nine simply was not
        # evaluated, and nix still exited 0.
        run: |
          set -o pipefail
          nix flake check --no-build --all-systems --show-trace 2>&1 | tee /tmp/aic-flake-check.log

      - name: Assert the flake check actually checked something
        working-directory: full-ai-cluster
        # ANTI-VACUITY, copied from root-flake-check.yml, whose own comment says "anyone
        # adding a nix lane anywhere should copy this step, because the default failure
        # mode of a nix eval lane is a confident green over an empty check."
        # `nix flake check` exits 0 on a flake whose outputs it skipped entirely.
        #
        # THIS LANE DID NOT HAVE IT. Of the four nix eval lanes in this repository,
        # root-flake-check.yml and first-boot-manifest-check.yml carried the guard and the
        # two `Check flake evaluates` steps in THIS file carried neither it nor
        # `--all-systems` — so the oldest and most expensive nix lane was the one with the
        # weakest evidence behind its green.
        #
        # Format-independent on purpose: run 33023664270 taught that counting `^✅` reads
        # Determinate Nix 3.x presentation while upstream nix prints `checking flake
        # output '...'`, and the emoji-only version reported ZERO outputs while nix had
        # checked twenty.
        run: |
          checked=$(grep -cE '^(✅|checking |evaluating )' /tmp/aic-flake-check.log || true)
          echo "outputs checked: $checked"
          if [ "$checked" -eq 0 ]; then
            echo "::error title=full-ai-cluster flake check validated nothing::nix flake check exited 0 having checked ZERO outputs. An eval lane that evaluates nothing is indistinguishable from one that passed."
            exit 1
          fi
          # NAME THE CHECKS THIS STEP IS THE ONLY EVALUATOR OF. Eleven eval-only checks in
          # this flake are named individually by NO workflow step anywhere — their sole
          # coverage is this `nix flake check`. A green here that never reached them is a
          # green about some other output. Measured 2026-09-09: mutating
          # zeta-creds-to-k8s-eval-test.nix so every property fails makes
          # `nix flake check --no-build --all-systems` exit 1 in 61 s, which is what
          # earns the claim that this step covers them.
          #
          # `k3s-registry-mirrors-model` (WP9, 081M33STPKN087G0R0004B5CAK) and
          # `k8s-node-tunables-model` both added 2026-09-22, same pattern as the
          # other nine: no VM, no build, assertions fire at evaluation.
          # `k3s-etcd-peers-model` added 2026-09-23 (081M10ZG61D087G0R001A70F0P):
          # the opt-in etcd peer admission and the joining-server refusal.
          missing=""
          for c in zeta-creds-to-k8s-model tpm2-seal-prereqs-model host-seal-profile-model \
                   secure-boot-desired-state-model longhorn-node-preflight \
                   longhorn-disk-registration longhorn-common-default-disk-eval \
                   cilium-wireguard-preflight gpu-node-label-preflight \
                   k3s-registry-mirrors-model k8s-node-tunables-model \
                   k3s-etcd-peers-model; do
            grep -q "$c" /tmp/aic-flake-check.log || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Eval-only checks were not among the outputs evaluated::nix flake check never mentioned:$missing. These checks are named by no other step in any workflow, so this step is their only coverage. Either they were renamed or removed, or --all-systems omitted the system they live on. Either way this lane is green about something else."
            exit 1
          fi
          echo "all twelve eval-only checks were evaluated."

      # Regression test for the k3s --cluster-init token deadlock
      # (k3s-server.nix). Boots the control-plane k3s module in a QEMU VM
      # via nixosTest and asserts the Kubernetes API comes all the way up:
      # k3s.service reaches `active`, --cluster-init GENERATES the cluster
      # token, the kubeconfig is written, the API answers /readyz, and the
      # node registers. Pre-fix this would FAIL at wait_for_unit("k3s.service")
      # because the unit crash-looped on the token-read timeout.
      #
      # Runs early (before the ~15-min ISO build) so a broken k3s fails
      # fast. Hermetic — no internet, so it does NOT assert node Ready /
      # pods Running (those need the Cilium CNI image); that is an online
      # cluster-integration lane (081KSGS9H0008QG0R0011BC7T2 Slice 2+). ubuntu-24.04 runners
      # expose /dev/kvm; the nixosTest driver falls back to TCG if absent.
      # Skipped only on a WP11-scoped dispatch (only_wp11=true) -- the PR and
      # push paths run this step unconditionally, same as before.
      - name: NixOS test — k3s control-plane reaches active (token-deadlock regression)
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_wp11)
        working-directory: full-ai-cluster
        run: nix build .#checks.x86_64-linux.k3s-control-plane-cluster-init -L --print-build-logs --fallback

      # NODE-LEVEL platform fixes. This check existed in the flake since
      # PR #6966 and was invoked by NOTHING — `grep -rn platform-fixes
      # .github/workflows/` returned empty. So every regression it guards was
      # unguarded in CI: rpfilter off (the pod->host black-hole), open-iscsi
      # present, k3s --disable=local-storage, the loose rp_filter sysctl, and
      # the iscsiadm FHS shim that Longhorn's nsenter needs.
      #
      # That gap is the same shape as the bug it now catches: a signal that
      # reads green because nothing is actually checking. longhorn-manager
      # crash-looped 16495 times over 62 days on node-5b2dfa with every CI
      # lane green, because the one test that would have caught it never ran.
      #
      # Hermetic (no internet), ~2 min, so it runs early beside the other
      # fast node-level check rather than behind the ~15-min ISO build.
      # Skipped only on a WP11-scoped dispatch -- PR and push are unaffected.
      - name: NixOS test — node platform fixes are live (rpfilter/iscsi/storage flags)
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_wp11)
        timeout-minutes: 20
        working-directory: full-ai-cluster
        run: nix build .#checks.x86_64-linux.k3s-control-plane-platform-fixes -L --print-build-logs --fallback

      # TWO-NODE join proof (081KSNY2Z0008QG0R0008PN7RQ scenario 5, FIRST
      # blocker). Boots a server built from nixos/modules/k3s-server.nix and
      # an agent built from nixos/modules/k3s-agent.nix on ONE shared virtual
      # segment, hands over k3s's own node-token, and asserts that
      # nixos/modules/k3s-join-observer.nix writes the scenario's two contract
      # markers to the SERIAL console — the same channel the zflash harness
      # reads.
      #
      # This is the layer a Docker Compose test was proposed for on PR #10493,
      # done without Compose's drift surface: nixosTest IMPORTS the shipped
      # module files, so a wrong `--tls-san`, a closed 6443, or a drifted
      # marker string fails HERE. A Compose `command:` could only test its own
      # transcription of those flags.
      #
      # Hermetic — no internet, so the joined node stays NotReady and the test
      # asserts MEMBERSHIP, not readiness (readiness is the online lane
      # below). Runs before the ~15-min ISO build so a broken join fails fast.
      # Skipped only on a WP11-scoped dispatch -- PR and push are unaffected.
      - name: NixOS test — k3s agent JOINS the server (scenario 5 markers on serial)
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_wp11)
        timeout-minutes: 30
        working-directory: full-ai-cluster
        run: nix build .#checks.x86_64-linux.k3s-agent-join -L --print-build-logs --fallback

      # EVALUATION-ONLY checks, run here because NOTHING ELSE RAN THEM.
      #
      # `cluster-cidr-derivation` and `k3s-server-join-model` were added to
      # `flake.checks` by #15668 and were named by no workflow step in the
      # repository — `grep -rn 'cluster-cidr\|server-join' .github/workflows/`
      # returned empty. Their TypeScript twins under src/Core.TypeScript/hygiene/
      # DO run in the bun sweep, which is why the gap was survivable.
      #
      # CORRECTION, 2026-09-09 (081M244SY6K087G0R002WDBCZJ). This comment used to
      # continue "No lane runs `nix flake check` on this flake (the steps here name
      # each check individually), so both were checks that could not fail because
      # nothing invoked them." THAT WAS FALSE WHEN WRITTEN: the `Check flake
      # evaluates` step in this same job, ~60 lines above, runs
      # `nix flake check --no-build`, and an eval-only check's assertions fire
      # during EVALUATION — which is exactly what the flake's own comments say
      # about them. Measured: mutating zeta-creds-to-k8s-eval-test.nix so every
      # property fails makes `nix flake check --no-build --all-systems` exit 1 in
      # 61 s, naming the failed properties.
      #
      # The correction matters because the false sentence told a reader auditing
      # coverage that eval coverage did not exist when it did — and the real defect
      # was the opposite shape: the coverage existed and had NO ANTI-VACUITY GUARD,
      # so it could have stopped covering anything without a red X. The guard now
      # lives on that step. These two `nix build` lines stay as belt-and-braces
      # (they cost seconds and they name their subjects), with an honest reason.
      #
      # They cost no VM and their assertions fire during EVALUATION, so this is
      # seconds, not minutes.
      # Skipped only on a WP11-scoped dispatch -- PR and push are unaffected.
      - name: Nix eval checks — cluster CIDR derivation + server-join model (were unrun)
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_wp11)
        timeout-minutes: 10
        working-directory: full-ai-cluster
        run: |
          nix build .#checks.x86_64-linux.cluster-cidr-derivation -L --print-build-logs --fallback
          nix build .#checks.x86_64-linux.k3s-server-join-model -L --print-build-logs --fallback

      # TWO CONTROL PLANES, ONE CLUSTER. The agent-join step above boots a
      # server and an AGENT — which has no datastore, no etcd and no CA, so it
      # cannot exercise the path injected-server-join.nix was written for. A
      # role=server node given `--server` joins an ETCD cluster; that is a
      # different code path, and it is the one that failed on hardware.
      #
      # The assertion that carries this step is NOT node count. Two nodes that
      # each founded their own cluster are also both "up" — that is exactly the
      # state of the two machines on the maintainer's LAN, whose CA founding
      # epochs are twelve days apart. This asserts both nodes hold the SAME
      # cluster CA, which is the check that told those two apart.
      #
      # Hermetic (no internet -> no CNI -> nodes stay NotReady): membership and
      # CA identity, never readiness. ~1-2 min, budgeted from the measured 67 s
      # the two-node agent-join step costs on this runner.
      # Skipped only on a WP11-scoped dispatch -- PR and push are unaffected.
      - name: NixOS test — a second CONTROL PLANE joins (one cluster CA, not two)
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_wp11)
        timeout-minutes: 30
        working-directory: full-ai-cluster
        run: nix build .#checks.x86_64-linux.k3s-server-join -L --print-build-logs --fallback

      # THE DIRTY-DISK REFUSAL, on a real boot. k3s IGNORES
      # --cluster-init/--server/--token-file when an etcd datastore already
      # exists on disk, so a declarative join onto a dirty disk is a SILENT
      # no-op: flags parse, disk wins, `systemctl status k3s` stays green, and
      # the node resumes being the cluster it already was. It is the one
      # failure mode in this subsystem with no symptom at all.
      #
      # lint-k3s-datastore-preflight.test.ts already EXECUTES the refusal script
      # over fixtures and asserts every exit status. What it structurally cannot
      # reach is whether systemd honours `before` + `requiredBy` on a boot:
      # rewire that unit `wantedBy` and k3s starts anyway, the script still
      # exits 1, and every existing assertion still passes. This step asserts
      # the thing that mutation breaks — that k3s.service never started.
      # Skipped only on a WP11-scoped dispatch -- PR and push are unaffected.
      - name: NixOS test — dirty disk FAILS CLOSED (k3s must not start)
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_wp11)
        timeout-minutes: 30
        working-directory: full-ai-cluster
        run: nix build .#checks.x86_64-linux.k3s-datastore-preflight-fail-closed -L --print-build-logs --fallback

      # ZERO-LENGTH k3s CREDENTIALS SELF-HEAL, on a real boot. WP25
      # (081M38G8NGC087G0R001GEGEDK). `nixos/tests/k3s-agent-tls-self-heal.nix`
      # was wired into `flake.nix` (`k3s-agent-tls-self-heal`) but named by NO
      # workflow step -- the same gap this file's own history already has two
      # precedents for (see "node platform fixes" and "cluster CIDR
      # derivation" above): a check that only `nix flake check`/`nix build`
      # locally would ever run is a check CI never runs, and this repo
      # refuses that shape (a check that did not run must never look like one
      # that passed).
      #
      # k3s-agent-tls-self-heal.test.ts already EXECUTES the repair script
      # over fixture directories and proves the pure "which files get
      # removed" logic, including the allowlist regression this step's
      # sibling VM test also carries (a real WP25 CI run measured the
      # pre-allowlist revision removing 3243 legitimately zero-length files
      # from inside containerd's own image store in one boot -- see PR
      # #17608). What no fixture-directory test can reach is whether systemd
      # actually runs the ExecStartPre before k3s on a REAL boot, and whether
      # a REAL k3s regenerates the files and reaches active once they're
      # gone -- and whether the planted containerd-snapshot fixture survives
      # that same real boot. That is this step's job.
      #
      # Hermetic (no internet, no image pulls) and boots ONE node twice
      # (write real cert material, stop, truncate, restart) -- same shape and
      # cost class as "dirty disk FAILS CLOSED" immediately above; on the PR
      # path rather than gated to workflow_dispatch because it is cheap (see
      # the measured wall-clock this comment will carry once the first PR run
      # completes).
      #
      # SKIPPED ON A WP11-SCOPED DISPATCH, like every other NixOS step in this
      # job. This guard was missing when the step was added (WP25, now
      # stopped; the step was left with no owner and no branch in flight), so
      # every narrowed WP11 probe has been paying 3m 01s -- MEASURED on run
      # 36089766331 -- for a hermetic VM test that exercises nothing the
      # installed-disk first-boot lane measures. Trigger condition only; what
      # this step asserts is unchanged.
      - name: NixOS test — zero-length k3s credentials self-heal on boot
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_wp11)
        timeout-minutes: 30
        working-directory: full-ai-cluster
        run: nix build .#checks.x86_64-linux.k3s-agent-tls-self-heal -L --print-build-logs --fallback

      # 081M39CR74D087G0R002BEG2G4. The has-ever-bootstrapped sentinel guard.
      # k3s creates server/db and, if the machine is stopped in the first ~20s
      # of its FIRST boot, leaves it non-empty with no bootstrap data in it --
      # the one state k3s will not initialise into, so it refuses forever and
      # no reboot recovers (measured: run 35968222668, 58 restarts, 76 fatals,
      # on a real installed disk). A sentinel written only once k3s's own
      # /readyz has succeeded is what makes discarding such a datastore safe:
      # before it exists the datastore has never held anything, after it
      # exists the datastore is never touched again.
      #
      # THE DECISION LOGIC IS ALREADY PINNED OVER FIXTURES in
      # src/Core.TypeScript/hygiene/k3s-datastore-bootstrap-recovery.test.ts,
      # which runs on the bun path. This step exists for the two halves that
      # test structurally cannot reach, and both are the dangerous ones:
      #   1. that the sentinel unit's DEFAULT readyz command actually succeeds
      #      against a real k3s from inside its real unit -- if it silently
      #      never did, no sentinel would ever be written and every healthy
      #      datastore would look stillborn to the recovery script, inverting
      #      the guard into the data loss it exists to prevent;
      #   2. that a real, already-served datastore given a WRONG TOKEN emits
      #      the identical ambiguous fatal a stillborn one does -- the claim
      #      the whole module rests on, asserted in prose everywhere and
      #      measured only here -- and SURVIVES it.
      #
      # COST, MEASURED rather than estimated. Run 36089766331 (this step's
      # first wired run, which went red on a test-harness defect -- see the
      # test file's header on `wait_for_unit` against a poll loop): 4m 00s,
      # 03:30:43 -> 03:34:43, of which 121s was a timeout that a correct
      # predicate does not pay. Its sibling above, same shape, measured
      # 3m 01s on the same run. Budget it at the self-heal step's class.
      #
      # Hermetic (no internet, no image pulls); boots ONE node and restarts
      # k3s in place, same shape and cost class as the self-heal step above.
      #
      # SKIPPED ON A WP11-SCOPED DISPATCH, like the pre-ISO-build NixOS steps
      # above it. A hermetic VM test that boots k3s twice exercises nothing
      # the installed-disk first-boot lane measures, so leaving the guard off
      # would silently lengthen every narrowed probe -- MEASURED tonight by
      # WP29 at 15m 48s burned on exactly this omission, on one step. The PR
      # and push paths are unaffected and run this every time.
      - name: NixOS test — a datastore that has SERVED is never auto-discarded
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_wp11)
        timeout-minutes: 30
        working-directory: full-ai-cluster
        run: nix build .#checks.x86_64-linux.k3s-datastore-bootstrap-sentinel -L --print-build-logs --fallback

      # ONLINE end-to-end proof: boots the control-plane WITH internet,
      # installs Cilium for real, asserts the node reaches Ready + CoreDNS
      # Running. This is the gate that catches the full bring-up chain
      # (token deadlock + Cilium bootstrap + control-plane addressing) in
      # CI instead of on hardware. `--option sandbox false` lets the QEMU
      # user-mode NIC reach the internet to pull images (the nix sandbox
      # blocks network); the GitHub runner user is a trusted nix user, so
      # the flag is honored. ubuntu-24.04 exposes /dev/kvm. Budget ~20 min.
      # Skipped only on a WP11-scoped dispatch -- PR and push are unaffected.
      - name: NixOS test — cluster comes ALL the way up (online; node Ready + CoreDNS)
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.only_wp11)
        timeout-minutes: 35
        working-directory: full-ai-cluster
        run: nix build .#checks.x86_64-linux.k3s-cluster-online -L --print-build-logs --fallback --option sandbox false

      # STORAGE, end to end. The lane above proves the cluster comes up; it says
      # nothing about whether a stateful workload gets a disk. That distinction
      # is not academic: on node-5b2dfa longhorn-manager crash-looped 16495 times
      # over 62 days, the `longhorn` StorageClass was never created, and 20 PVCs
      # sat Pending — while every lane here was green, because no lane asked
      # "does a volume bind?". This one installs the REAL chart at the REAL
      # version with the REAL prod values and asserts manager Ready -> Node CR ->
      # StorageClass -> PVC Bound -> data read back through the mount.
      #
      # Gated to push + workflow_dispatch, matching the scenario-3/4 and wifi-ESP
      # convention: it needs internet and ~15-25 min on a cold runner, so PR runs
      # stay fast while main keeps the guarantee. Measured 162 s of test-script
      # time on a warm host; the runner cost is image pulls, not the assertions.
      # Already push/workflow_dispatch-gated (see above); now ALSO skipped on
      # a WP11-scoped dispatch specifically -- a push run is unaffected.
      - name: NixOS test — a longhorn PVC actually BINDS and data survives
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && inputs.only_wp11)
        timeout-minutes: 45
        working-directory: full-ai-cluster
        run: nix build .#checks.x86_64-linux.longhorn-volume-binds -L --print-build-logs --fallback --option sandbox false

      - name: Build installer ISO
        id: iso_build
        working-directory: full-ai-cluster
        run: nix build .#installer-iso --print-build-logs --fallback

      - name: The built ISO carries the name this repo chose
        working-directory: full-ai-cluster
        # 081KSGS9H0008QG0R00033DT02, closed 2026-09-06. `isoImage.isoName = lib.mkForce`
        # stopped naming the ISO when nixpkgs 25.11 moved to `system.build.image` +
        # normalized filenames, and every ISO this repo published shipped as
        # `nixos-minimal-*`. The workflow was fix-forwarded to accept BOTH names, which
        # kept the lane green and made the defect invisible for three months.
        #
        # THE ALIAS IS WHY IT HID. `isoImage.isoName` and `image.fileName` BOTH evaluate
        # to our value; only `image.baseName` reaches the derivation. Measured:
        #   image.fileName             = zeta-installer-25.11.iso
        #   system.build.isoImage.name = nixos-minimal-25.11...-x86_64-linux.iso
        # So reading the option back said "fixed" while the artifact said otherwise.
        #
        # This step asserts the ARTIFACT, not the option, so the next upstream option move
        # fails here instead of rotting for another three months. Its falsifiers are
        # `src/Core.TypeScript/ci/assert-iso-name.test.ts`.
        run: bun ../src/Core.TypeScript/ci/assert-iso-name.ts result/iso

      - name: Audit installer ISO content (cascade #4 — post-build floor)
        # Inspects the BUILT ISO via 7z list + asserts expected top-
        # level files (nix-store.squashfs, kernel, initrd, grub.cfg).
        # Complements the source-substrate audit preflight (cascade #1
        # at the start of this workflow) by catching the bug class
        # where the ISO build silently drops a file present in source.
        # 7z is available by default on ubuntu-24.04 runners.
        working-directory: full-ai-cluster
        run: |
          set -euo pipefail
          # Mirror the explicit 0/1+ candidate count check from the
          # later "Locate ISO + capture metadata" step (fix-fwd
          # Copilot finding on #5119). Under `set -u`, unbound
          # iso_candidates[0] would give an opaque "unbound variable"
          # error; explicit count check gives a clear workflow error.
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::Audit step: No installer ISO under result/iso/ (looked for zeta-installer-*.iso; the nixos-minimal-* fallback was removed with 081KSGS9H0008QG0R00033DT02's fix -- image.baseName now drives the name)" >&2
            ls -la result/iso/ >&2 || true
            exit 1
          fi
          if [ "${#iso_candidates[@]}" -gt 1 ]; then
            echo "::error::Audit step: Multiple installer ISOs under result/iso/; expected exactly one:" >&2
            printf '  %s\n' "${iso_candidates[@]}" >&2
            exit 1
          fi
          iso_abs="$(pwd)/${iso_candidates[0]}"
          cd ..
          # 7z source-of-truth:
          # (a) tools/setup/manifests/{brew,apt} declare p7zip /
          #     p7zip-full as the canonical dependency for ALL
          #     install.sh consumers per GOVERNANCE.md §24 (dev
          #     laptops, CI runners, devcontainer images).
          # (b) This SPECIFIC workflow does NOT invoke install.sh
          #     today; it relies on ubuntu-24.04 runner-image's
          #     default 7z pre-install (verified present on the
          #     standard image) as a shortcut so we skip the
          #     install.sh cost per workflow run.
          # If we drop the ubuntu-24.04 pin OR the runner-image
          # pre-install, the apt manifest already declares the dep
          # — either invoke install.sh here OR add an explicit
          # `sudo apt-get update && sudo apt-get install -y
          # p7zip-full` step before this line (the `-y` matters in
          # CI: without it apt-get prompts interactively and the
          # workflow run hangs).
          bun src/Core.TypeScript/ci/audit-installer-iso-content.ts --iso "$iso_abs"

      # QEMU boot smoke-test (USB cleanup PR 3 — 2026-05-26):
      # Boots the built ISO in QEMU/KVM with serial console capture +
      # asserts the installer's expected login prompt appears within
      # 5min. Catches the bug class where the ISO builds + audits pass
      # but the kernel/initrd combination fails to actually boot
      # (firmware mismatch; missing module; broken init; etc.). The
      # source-substrate audit (cascade #1) + ISO-content audit
      # (cascade #4) catch static issues; this catches dynamic
      # boot-time issues. Prior art: nixos/tests/installer.nix
      # (per Kestrel 2026-05-26 ferry pointer).
      #
      # ubuntu-24.04 runners support nested KVM (/dev/kvm); helper
      # falls back to TCG emulation when KVM unavailable.
      #
      # Security: this step uses no `github.event.*` interpolation in
      # `run:` lines; all inputs are filesystem paths from prior steps
      # of THIS workflow. The TS helper at src/Core.TypeScript/ci/qemu-boot-test.ts
      # takes the ISO path as a positional CLI arg (no shell expansion
      # of attacker-controllable strings).
      - name: Install QEMU + zflash toolchain (apt)
        # qemu-system-x86 for cascade #5 boot smoke-test
        # qemu-utils for qemu-img (cascade #6 Slice 1 virtual hard disk)
        # mtools for zflash file-backed ESP writes (081KSNY2Z0008QG0R0008PN7RQ scenario 1 bake)
        run: sudo apt-get update -y && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils mtools ovmf

      # 081KZETP6AT08QG0R003MG1VYN — prove the instrument BEFORE trusting it.
      #
      # Scenario 1 below is a blocking gate whose only input is the real
      # ISO, and the real ISO can only ever produce BOOTED. So until now
      # nothing on this lane exercised BOOT-FAILED or TIMEOUT, and the
      # x86_64 boot-stage ladder read a constant through NINETEEN
      # consecutive green runs (31964938508 … 31977504172, each printing
      # exactly one stage line: `stage → login`) without any check
      # noticing. Unit tests could not notice either: the defect was that
      # the strings we asserted on were not the strings the guest emits.
      #
      # This boots two 1MB synthetic images — one refused by the
      # firmware, one that runs and then makes no progress — and requires
      # them to land on DIFFERENT verdicts, each within a settle-time
      # bound so a verdict reached by running out of clock cannot pass as
      # one reached from evidence. Runs before scenario 1 so a blind
      # instrument fails here rather than mis-reporting the real ISO.
      #
      # ~30s. Advisory-free on purpose: if the discriminator is broken,
      # every downstream x86_64 boot verdict on this runner is untrusted.
      - name: 081KZETP6AT08QG0R003MG1VYN x86_64 boot-discriminator self-test
        run: bun src/Core.TypeScript/ci/qemu-x86-discriminator-selftest.ts

      - name: 081KSNY2Z0008QG0R0008PN7RQ scenario 1 — initial format (audit + zflash --test + QEMU boot)
        working-directory: full-ai-cluster
        run: |
          set -euo pipefail
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::081KSNY2Z0008QG0R0008PN7RQ scenario 1: No installer ISO under result/iso/" >&2
            exit 1
          fi
          iso_abs=$(readlink -f "${iso_candidates[0]}")
          echo "081KSNY2Z0008QG0R0008PN7RQ initial-format ISO: $iso_abs"
          bun ../src/Core.TypeScript/zflash/test-harness/run.ts --scenario initial-format "$iso_abs"

      # QEMU full-install test (cascade #6 Slice 1 — 081KSGS9H0008QG0R0011BC7T2):
      # Extends boot-test by attaching virtual hard disk + NAT internet,
      # waits for `[iter-5.3]` marker in serial log to verify nixos-install
      # + iter-4.2 + iter-5.2 substrate completed.
      #
      # Hard gate on push-to-main for scenarios 1 + 2. Scenario 2 green on
      # main after #8478 initrd virtio root fix (run 27602908527: phase-2
      # reached node-XXXXXX login:).
      #
      # Security: no github.event.* interpolation; ISO path comes from
      # prior workflow step's filesystem find.
      # 081KSNY2Z0008QG0R0008PN7RQ phase-3: first-session serial markers on scenario 2 (push +
      # workflow_dispatch). Society proof: run 27862943618 (2026-06-20).
      - name: 081KSNY2Z0008QG0R0008PN7RQ scenario 2 — boot + install substrate (081KSGS9H0008QG0R0011BC7T2 Slice 1)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 90
        working-directory: full-ai-cluster
        env:
          SERIAL_LOG_OUT_PATH: ${{ github.workspace }}/qemu-full-install-serial.log
          QEMU_FIRST_SESSION_PHASE3: "1"
        run: |
          set -euo pipefail
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::081KSNY2Z0008QG0R0008PN7RQ scenario 2: No installer ISO under result/iso/" >&2
            exit 1
          fi
          iso_abs=$(readlink -f "${iso_candidates[0]}")
          echo "081KSNY2Z0008QG0R0008PN7RQ boot-cluster-up ISO: $iso_abs"
          echo "Serial log out path: $SERIAL_LOG_OUT_PATH"
          bun ../src/Core.TypeScript/zflash/test-harness/run.ts --scenario boot-cluster-up "$iso_abs"

      # Restore decrypt is an independent qemu-full-install-test.ts run
      # (QEMU_UEFI_KEYFILE_RESTORE=1 does write+picker+decrypt itself). It is
      # NOT implied by the later wifi / phase-1 write / picker steps, so it
      # must run with budget left — measured run 32647553460 died with
      # restore still in_progress after those earlier dispatch jobs ate the
      # wall clock. Workflow_dispatch only — not on gate.
      #
      # 081M39CJP96087G0R001T4J2R3 (WP29) — THE `!inputs.only_wp11` HALF WAS
      # MISSING HERE while the sibling upload step below already carried it.
      # MEASURED on run 36044770870, dispatched with only_wp11: every other
      # dispatch-only step reported `skipped` and this one RAN, for 15m 48s,
      # and then `Upload UEFI keyfile restore serial log` — which DID have the
      # guard — skipped, so the failure it produced could not be read. Run
      # 36014672753 did exactly the same thing four hours earlier, and both
      # restore failures are therefore unrecoverable. A step that runs while
      # its log upload is skipped is a check nobody can read, so the two
      # conditions must AGREE, not merely both exist.
      - name: UEFI keyfile restore decrypt (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && !inputs.only_wp11
        timeout-minutes: 90
        working-directory: full-ai-cluster
        env:
          SERIAL_LOG_OUT_PATH: ${{ github.workspace }}/qemu-uefi-keyfile-restore-serial.log
          QEMU_UEFI_KEYFILE_RESTORE: "1"
        run: |
          set -euo pipefail
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::UEFI keyfile restore: No installer ISO under result/iso/" >&2
            exit 1
          fi
          iso_abs=$(readlink -f "${iso_candidates[0]}")
          echo "UEFI keyfile restore ISO: $iso_abs"
          echo "Serial log out path: $SERIAL_LOG_OUT_PATH"
          bun ../src/Core.TypeScript/ci/qemu-full-install-test.ts "$iso_abs"

      - name: Upload UEFI keyfile restore serial log
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.only_wp11
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-uefi-keyfile-restore-serial-log
          path: qemu-uefi-keyfile-restore-serial.log
          if-no-files-found: warn
          retention-days: 7

      # Opt-in ESP wifi → NM profile gate (no radio association claim) plus
      # guest USB iSerial (usb-storage serial=ZETA-QEMU-001). Workflow_dispatch
      # only — not on gate. ISO/cdrom cascade-5 does not assert iSerial.
      #
      # always(): restore sits BEFORE these siblings and is a hard fail
      # (measured run 32724820159: restore hung on picker TTY → wifi / write /
      # picker / scenarios 3–4 skipped). Keep restore itself without always()
      # so a restore red still fails the job. Keep all of this off gate.
      - name: 081KSGS9H0008QG0R003V23XNZ wifi ESP acceptance (workflow_dispatch only)
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.only_wp11
        timeout-minutes: 90
        working-directory: full-ai-cluster
        env:
          SERIAL_LOG_OUT_PATH: ${{ github.workspace }}/qemu-wifi-esp-serial.log
          QEMU_WIFI_ESP_PHASE1: "1"
          QEMU_USB_ISERIAL_PHASE1: "1"
          QEMU_FIRST_SESSION_PHASE3: "1"
        run: |
          set -euo pipefail
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::081KSGS9H0008QG0R003V23XNZ wifi ESP: No installer ISO under result/iso/" >&2
            exit 1
          fi
          iso_abs=$(readlink -f "${iso_candidates[0]}")
          echo "081KSGS9H0008QG0R003V23XNZ wifi ESP ISO: $iso_abs"
          echo "Serial log out path: $SERIAL_LOG_OUT_PATH"
          bun ../src/Core.TypeScript/ci/qemu-full-install-test.ts "$iso_abs"

      - name: Upload 081KSGS9H0008QG0R003V23XNZ wifi ESP serial log
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.only_wp11
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-wifi-esp-serial-log
          path: qemu-wifi-esp-serial.log
          if-no-files-found: warn
          retention-days: 7

      - name: UEFI keyfile install-time write (workflow_dispatch only)
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.only_wp11
        timeout-minutes: 90
        working-directory: full-ai-cluster
        env:
          SERIAL_LOG_OUT_PATH: ${{ github.workspace }}/qemu-uefi-keyfile-serial.log
          QEMU_UEFI_KEYFILE_PHASE1: "1"
        run: |
          set -euo pipefail
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::UEFI keyfile phase-1: No installer ISO under result/iso/" >&2
            exit 1
          fi
          iso_abs=$(readlink -f "${iso_candidates[0]}")
          echo "UEFI keyfile phase-1 ISO: $iso_abs"
          echo "Serial log out path: $SERIAL_LOG_OUT_PATH"
          bun ../src/Core.TypeScript/ci/qemu-full-install-test.ts "$iso_abs"

      - name: Upload UEFI keyfile phase-1 serial log
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.only_wp11
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-uefi-keyfile-serial-log
          path: qemu-uefi-keyfile-serial.log
          if-no-files-found: warn
          retention-days: 7

      - name: UEFI keyfile picker bind (workflow_dispatch only)
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.only_wp11
        timeout-minutes: 90
        working-directory: full-ai-cluster
        env:
          SERIAL_LOG_OUT_PATH: ${{ github.workspace }}/qemu-uefi-keyfile-picker-serial.log
          QEMU_UEFI_KEYFILE_PICKER: "1"
        run: |
          set -euo pipefail
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::UEFI keyfile picker: No installer ISO under result/iso/" >&2
            exit 1
          fi
          iso_abs=$(readlink -f "${iso_candidates[0]}")
          echo "UEFI keyfile picker ISO: $iso_abs"
          echo "Serial log out path: $SERIAL_LOG_OUT_PATH"
          bun ../src/Core.TypeScript/ci/qemu-full-install-test.ts "$iso_abs"

      - name: Upload UEFI keyfile picker serial log
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.only_wp11
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-uefi-keyfile-picker-serial-log
          path: qemu-uefi-keyfile-picker-serial.log
          if-no-files-found: warn
          retention-days: 7

      - name: 081KSNY2Z0008QG0R0008PN7RQ scenario 3 — reformat with retention (workflow_dispatch only)
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.only_wp11
        timeout-minutes: 90
        working-directory: full-ai-cluster
        env:
          ZFLASH_QEMU_RETENTION_EXECUTE: "1"
          ZFLASH_QEMU_RETENTION_RUN_DIR: ${{ github.workspace }}/b0891-retention-run
        run: |
          set -euo pipefail
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::081KSNY2Z0008QG0R0008PN7RQ scenario 3: No installer ISO under result/iso/" >&2
            exit 1
          fi
          iso_abs=$(readlink -f "${iso_candidates[0]}")
          echo "081KSNY2Z0008QG0R0008PN7RQ retention ISO: $iso_abs"
          echo "Retention run dir: $ZFLASH_QEMU_RETENTION_RUN_DIR"
          mkdir -p "$ZFLASH_QEMU_RETENTION_RUN_DIR"
          bun ../src/Core.TypeScript/zflash/test-harness/run.ts --scenario reformat-with-retention "$iso_abs"

      - name: 081KSNY2Z0008QG0R0008PN7RQ scenario 4 — path-fork migrate vs fresh (workflow_dispatch only)
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.only_wp11
        timeout-minutes: 90
        working-directory: full-ai-cluster
        env:
          ZFLASH_QEMU_PATH_FORK_EXECUTE: "1"
          ZFLASH_QEMU_PATH_FORK_BOOTSTRAP: "1"
          ZFLASH_QEMU_PATH_FORK_RUN_DIR: ${{ github.workspace }}/b0891-path-fork-run
        run: |
          set -euo pipefail
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::081KSNY2Z0008QG0R0008PN7RQ scenario 4: No installer ISO under result/iso/" >&2
            exit 1
          fi
          iso_abs=$(readlink -f "${iso_candidates[0]}")
          echo "081KSNY2Z0008QG0R0008PN7RQ path-fork ISO: $iso_abs"
          echo "Path-fork run dir: $ZFLASH_QEMU_PATH_FORK_RUN_DIR"
          mkdir -p "$ZFLASH_QEMU_PATH_FORK_RUN_DIR"
          bun ../src/Core.TypeScript/zflash/test-harness/run.ts --scenario reformat-from-scratch "$iso_abs"

      - name: Upload 081KSNY2Z0008QG0R0008PN7RQ retention serial logs
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.only_wp11
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b0891-retention-serial-logs
          path: b0891-retention-run/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload 081KSNY2Z0008QG0R0008PN7RQ path-fork serial logs
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.only_wp11
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b0891-path-fork-serial-logs
          path: b0891-path-fork-run/**/*.log
          if-no-files-found: warn
          retention-days: 7

      # WP11 — closes the literal "plug in the USB and run it" gap. Every
      # QEMU scenario above stops at a serial marker on the INSTALLER side
      # (ZETA CLUSTER NODE INSTALL COMPLETE) or, for scenario 2, a login
      # prompt on the installed disk with NO network
      # (`buildQemuDiskBootArgsPure`'s own comment explains why: a NIC on
      # that boot risks a UEFI PXE boot-order stall). Kubernetes/ArgoCD
      # health has never been checked past that point on the ACTUAL
      # installer -> installed-disk path (disko partitioning, hardware
      # config, zeta-install.sh host selection, tokens, the installed
      # configuration.nix's own import graph) — the closest existing
      # coverage, nixos/tests/k3s-first-boot-roster.nix, boots the k3s
      # modules directly in a nixosTest sandbox and never goes through the
      # installer at all.
      #
      # This step reboots the SAME installed disk a second time, now with a
      # user-mode NIC (image pulls need internet), and lets
      # zeta-first-boot-k3s-verify.nix's oneshot unit — gated OFF by default
      # via ConditionPathExists, only turned on by the
      # QEMU_K3S_FIRST_BOOT_PHASE=1 marker this step's own ISO bake writes —
      # watch k3s + the first-boot roster converge and print a JSON verdict
      # (six named checks) to serial. The TS harness also appends a
      # human-readable table + the raw JSON to $GITHUB_STEP_SUMMARY.
      #
      # Deliberately dispatch+schedule ONLY, not on the PR path: k3s +
      # ~2-3 GB of Helm-chart image pulls converging is budgeted 45-70 min by
      # the nixosTest lane that already asks this exact question
      # (k3s-first-boot-roster.nix's own header) — adding that to every PR
      # touching the installer/k3s paths would make the already-heaviest
      # ISO lane far slower for no benefit to the merge-gating question PRs
      # actually need answered. workflow_dispatch covers on-demand deep
      # verification; `schedule` (daily, 05:23 UTC) covers unattended drift
      # detection between deliberate dispatches.
      - name: WP11 — installed-disk first-boot k3s verify (workflow_dispatch/schedule only)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        timeout-minutes: 100
        working-directory: full-ai-cluster
        env:
          SERIAL_LOG_OUT_PATH: ${{ github.workspace }}/qemu-k3s-first-boot-verify-serial.log
          QEMU_K3S_FIRST_BOOT_PHASE: "1"
        run: |
          set -euo pipefail
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::WP11 k3s first-boot verify: No installer ISO under result/iso/" >&2
            exit 1
          fi
          iso_abs=$(readlink -f "${iso_candidates[0]}")
          echo "WP11 k3s first-boot verify ISO: $iso_abs"
          echo "Serial log out path: $SERIAL_LOG_OUT_PATH"
          bun ../src/Core.TypeScript/ci/qemu-full-install-test.ts "$iso_abs"

      - name: Upload WP11 k3s first-boot verify serial log
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-k3s-first-boot-verify-serial-log
          path: qemu-k3s-first-boot-verify-serial.log
          if-no-files-found: warn
          retention-days: 7

      # Upload serial log as workflow artifact regardless of test outcome
      # so debug post-mortem is always possible. `if: always()` because
      # failure case is the most interesting — successful runs have
      # nothing to debug. Per Copilot post-merge finding on PR #5379.
      - name: Upload QEMU full-install serial log
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-full-install-serial-log
          path: qemu-full-install-serial.log
          if-no-files-found: warn
          retention-days: 7

      # `!cancelled()` alone made this step run when `Build installer ISO` had
      # been SKIPPED, and it then failed with "No installer ISO found under
      # result/iso/" — an error about a MISSING ARTEFACT for a build that never
      # ran. On 2026-08-27 that turned one broken step (the two-control-plane
      # join test, which fails ahead of the build) into two red steps, and the
      # second one named a file instead of naming its cause. A step that reports
      # a missing output when the producing step was skipped is describing the
      # symptom of an earlier failure as if it were a defect of its own.
      #
      # Gating on the build's own outcome keeps the original intent — the QEMU
      # full-install gate below the build is flaky, and a SUCCESSFULLY BUILT ISO
      # must still upload when it trips — while making the downstream-ness
      # structural: no build, no ISO to locate, nothing to report. The job is
      # already red from whatever stopped the build.
      - name: Locate ISO + capture metadata
        if: ${{ !cancelled() && steps.iso_build.outcome == 'success' }}
        id: iso
        working-directory: full-ai-cluster
        run: |
          set -euo pipefail
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::No installer ISO found under result/iso/ (looked for zeta-installer-*.iso; the nixos-minimal-* fallback was removed with 081KSGS9H0008QG0R00033DT02's fix -- image.baseName now drives the name)" >&2
            ls -la result/iso/ >&2 || true
            exit 1
          fi
          if [ "${#iso_candidates[@]}" -gt 1 ]; then
            echo "::error::Multiple installer ISOs under result/iso/; expected exactly one:" >&2
            printf '  %s\n' "${iso_candidates[@]}" >&2
            exit 1
          fi
          iso_path_rel="${iso_candidates[0]}"
          iso_path_abs="$(pwd)/${iso_path_rel}"
          iso_name=$(basename "$iso_path_abs")
          iso_size=$(stat -c%s "$iso_path_abs" | numfmt --to=iec --suffix=B)
          iso_sha256=$(sha256sum "$iso_path_abs" | awk '{print $1}')
          # ADDED 2026-08-21. The digest above was written ONLY to $GITHUB_OUTPUT
          # and the step summary, so it existed for humans reading a run page and
          # for nothing else. `zflash` refuses to write an ISO whose integrity it
          # cannot establish (PR #13030), looking for `<iso>.sha256` beside the
          # image -- and CI produced no such file, so the gate refused EVERY
          # CI-built ISO and the flash path was hard-stopped.
          #
          # The manifest is written PER-ISO (`<iso>.sha256`) rather than as a bare
          # `SHA256SUMS`, deliberately: a well-known filename in a shared download
          # directory is a NAMESPACE COLLISION, not a manifest. Measured on the
          # maintainer's machine 2026-08-21 -- an unrelated `~/Downloads/SHA256SUMS`
          # belonging to Bitcoin Knots was found and parsed by the gate, which then
          # refused with `iso-not-in-manifest` while printing 28 bitcoin filenames.
          # A per-ISO sidecar cannot be hijacked that way.
          #
          # WRITTEN TO $RUNNER_TEMP, NOT BESIDE THE ISO. `result/iso/` is a
          # symlink into the read-only Nix store, so the first form of this
          # step -- `iso_sha256_path="${iso_path_abs}.sha256"` -- died with
          # `Permission denied` and took the whole build-iso job red.
          # MEASURED: run 32445604341 (2026-08-21), step `Locate ISO + capture
          # metadata`, on the very branch that added it. The sidecar's LOCATION
          # in CI is irrelevant to the gate; only its CONTENT is -- the digest
          # and the ISO's basename, which is what the operator ends up with
          # beside the image after downloading both artifacts.
          iso_sha256_path="${RUNNER_TEMP}/${iso_name}.sha256"
          printf '%s  %s\n' "$iso_sha256" "$iso_name" > "$iso_sha256_path"
          {
            echo "path=$iso_path_abs"
            echo "name=$iso_name"
            echo "size=$iso_size"
            echo "sha256=$iso_sha256"
            echo "sha256_path=$iso_sha256_path"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## AI-cluster installer ISO built"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| File   | \`$iso_name\` |"
            echo "| Size   | $iso_size |"
            echo "| SHA256 | \`$iso_sha256\` |"
            echo ""
            echo "Download from the **Artifacts** section of this workflow run."
            echo "Then \`dd if=<iso> of=/dev/<USB> bs=4M status=progress conv=fsync\`"
            echo "to flash the stick. (ISO is ~1.5–2 GiB.)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 081KSKBP80008QG0R000Y2B7HC.1 — sigstore/cosign keyless OIDC signing of the ISO blob.
      # Composes with 081KSKBP80008QG0R000Y2B7HC (sigstore artifact signing free-stuff substrate).
      #
      # Keyless model: GitHub OIDC token (from job-level id-token: write
      # permission above) is exchanged with Fulcio CA for a short-lived cert
      # bound to this workflow's identity. cosign then signs the ISO blob
      # with that cert + records the signature in the Rekor transparency log.
      # No long-lived private key material in this workflow.
      #
      # Verification (any consumer) — pin identity to THIS specific workflow
      # file + ref (tightened per Copilot P1 review on PR #5417; the broader
      # `^https://github.com/Lucent-Financial-Group/Zeta` prefix-regex would
      # accept signatures from any workflow in the repo, defeating the
      # workflow-identity binding):
      #
      #   cosign verify-blob \
      #     --bundle <iso>.bundle \
      #     --certificate-identity 'https://github.com/Lucent-Financial-Group/Zeta/.github/workflows/build-ai-cluster-iso.yml@refs/heads/main' \
      #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      #     <iso>
      #
      # For verifying signatures from feature branches OR tags, swap the
      # `@refs/heads/main` suffix accordingly:
      #   --certificate-identity '.../build-ai-cluster-iso.yml@refs/heads/<branch>'
      #   --certificate-identity '.../build-ai-cluster-iso.yml@refs/tags/<tag>'
      #
      # Security: inputs to cosign are filesystem paths from steps.iso.outputs
      # of THIS workflow (no github.event.* interpolation). Same discipline
      # as the QEMU boot-test step above.
      - name: Install cosign
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }} # run only after a built ISO was located
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        # Pin verified via gh API 2026-05-27:
        #   gh api repos/sigstore/cosign-installer/releases/latest
        #   tag: v4.1.2; published: 2026-05-07T01:27:27Z
        # Per .claude/rules/dep-pin-search-first-authority.md

      - name: Sign ISO with cosign (keyless OIDC + Fulcio + Rekor)
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }} # run only after a built ISO was located
        id: sign
        env:
          # Pass ISO path via env (not direct ${{ }} interpolation in run:)
          # per the workflow's existing security discipline.
          ISO_PATH: ${{ steps.iso.outputs.path }}
          ISO_NAME: ${{ steps.iso.outputs.name }}
        run: |
          set -euo pipefail
          # --yes: skip interactive Fulcio confirmation (CI is non-interactive)
          # Output emitted to runner temp and uploaded alongside the ISO artifact:
          #   <runner-temp>/<iso>.bundle - cosign bundle containing signature,
          #                                certificate, and transparency-log material.
          COSIGN_BUNDLE="${RUNNER_TEMP}/${ISO_NAME}.bundle"
          cosign sign-blob --yes \
            --bundle "${COSIGN_BUNDLE}" \
            "${ISO_PATH}"
          # Sanity: the verifier artifact must be present and non-empty.
          test -s "${COSIGN_BUNDLE}" || { echo "::error::Empty cosign bundle"; exit 1; }
          echo "bundle-path=${COSIGN_BUNDLE}" >> "$GITHUB_OUTPUT"
          {
            echo "## ISO signed via sigstore (cosign keyless OIDC)"
            echo ""
            echo "| Artifact | Path |"
            echo "|---|---|"
            echo "| Bundle | \`${ISO_NAME}.bundle\` |"
            echo ""
            echo "Verification command after downloading the ISO artifact and cosign bundle artifact:"
            echo ""
            echo "\`\`\`bash"
            echo "cosign verify-blob \\"
            echo "  --bundle '${ISO_NAME}.bundle' \\"
            echo "  --certificate-identity 'https://github.com/${GITHUB_WORKFLOW_REF}' \\"
            echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
            echo "  '${ISO_NAME}'"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ISO as workflow artifact
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }} # run only after a built ISO was located
        # Available for download from the workflow run page for ~90 days.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.iso.outputs.name }}
          path: ${{ steps.iso.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0 # ISO is already compressed; re-zipping wastes time

      - name: Upload the ISO digest manifest as a workflow artifact
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        # The keystone for the local flash path: `zflash` verifies the ISO against
        # this file BEFORE it touches a device, and refuses (exit 2) without it.
        # Uploaded separately from the ISO so an operator can fetch the manifest
        # cheaply, and so a missing manifest is visibly absent rather than silently
        # bundled. NOTE this proves INTEGRITY, never PROVENANCE -- the cosign bundle
        # below is the provenance half, and nothing local verifies it yet.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.iso.outputs.name }}.sha256
          path: ${{ steps.iso.outputs.sha256_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload cosign bundle as workflow artifact
        if: ${{ !cancelled() && steps.sign.outcome == 'success' }} # run only after signing produced a bundle
        # 081KSKBP80008QG0R000Y2B7HC.1 sibling upload — bundle alongside the ISO for consumers.
        # Separate artifact (not bundled with ISO) so consumers downloading
        # just the ISO do not pay the small extra cost; verifiers can grab it.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.iso.outputs.name }}.cosign
          path: ${{ steps.sign.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

  # ── 081KTSZN10008QG0R00349SM6P slice 1 (2026-06-11): the aarch64 ISO builds AND BOOTS in CI ──
  # Native aarch64 end-to-end on the ubuntu-24.04-arm runner: build the
  # aarch64 installer ISO from the SAME configuration (one source of
  # truth; only `system` differs), then boot it in qemu-system-aarch64
  # (-machine virt + EDK2 UEFI) and assert the zeta-installer login
  # prompt on the PL011 serial (ttyAMA0 — the installer's kernel params
  # list ttyS0 + ttyAMA0 so ONE config serves both arches). This is the
  # hardware axis joining the oracle cross-product (DST for hardware:
  # same image, same inputs, same bytes — emulated first, then the Pi).
  # Skips the k3s nixosTest checks (x86_64-gated in the flake).
  build-aarch64:
    name: build-iso-aarch64 + qemu-boot
    if: ${{ !inputs.only_cluster_ha }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Nix
        # Upstream Nix only — no Determinate/FlakeHub login. Public flakes + cache.nixos.org
        # are sufficient; FlakeHub OIDC login flakes with "Transient authentication mechanism
        # error" and blocked build-iso on PR #8095 (2026-06-14).
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Check flake evaluates
        working-directory: full-ai-cluster
        # `--all-systems` + the assertion below, for the same reason as the x86_64 job:
        # a nix eval lane's default failure mode is a confident green over an empty check.
        run: |
          set -o pipefail
          nix flake check --no-build --all-systems --show-trace 2>&1 | tee /tmp/aic-arm-flake-check.log

      - name: Assert the flake check actually checked something (aarch64)
        working-directory: full-ai-cluster
        run: |
          checked=$(grep -cE '^(✅|checking |evaluating )' /tmp/aic-arm-flake-check.log || true)
          echo "outputs checked: $checked"
          if [ "$checked" -eq 0 ]; then
            echo "::error title=full-ai-cluster flake check validated nothing (aarch64)::nix flake check exited 0 having checked ZERO outputs. An eval lane that evaluates nothing is indistinguishable from one that passed."
            exit 1
          fi

      - name: Build aarch64 installer ISO
        working-directory: full-ai-cluster
        run: nix build .#installer-iso --print-build-logs --fallback

      - name: The built ISO carries the name this repo chose
        working-directory: full-ai-cluster
        # 081KSGS9H0008QG0R00033DT02, closed 2026-09-06. `isoImage.isoName = lib.mkForce`
        # stopped naming the ISO when nixpkgs 25.11 moved to `system.build.image` +
        # normalized filenames, and every ISO this repo published shipped as
        # `nixos-minimal-*`. The workflow was fix-forwarded to accept BOTH names, which
        # kept the lane green and made the defect invisible for three months.
        #
        # THE ALIAS IS WHY IT HID. `isoImage.isoName` and `image.fileName` BOTH evaluate
        # to our value; only `image.baseName` reaches the derivation. Measured:
        #   image.fileName             = zeta-installer-25.11.iso
        #   system.build.isoImage.name = nixos-minimal-25.11...-x86_64-linux.iso
        # So reading the option back said "fixed" while the artifact said otherwise.
        #
        # This step asserts the ARTIFACT, not the option, so the next upstream option move
        # fails here instead of rotting for another three months. Its falsifiers are
        # `src/Core.TypeScript/ci/assert-iso-name.test.ts`.
        run: bun ../src/Core.TypeScript/ci/assert-iso-name.ts result/iso

      - name: Install QEMU (aarch64 system emulator + EDK2 UEFI firmware)
        run: sudo apt-get update -y && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64

      # ── Blocking on a BOOT BREAK, advisory on a BUDGET overrun ────────
      # `continue-on-error: true` used to sit here, and it made the step
      # report a green check while the boot proof failed — a check that
      # cannot fail. It is removed. But the step is NOT simply flipped to
      # blocking, because this lane is pure TCG (the ubuntu-24.04-arm
      # runners do not expose /dev/kvm) and a hard red on a slow runner
      # would buy a flaky lane instead of a proof.
      #
      # Instead the harness now distinguishes the two, so the POLICY can:
      #   exit 0 — BOOTED       -> pass
      #   exit 1 — BOOT-FAILED  -> FAIL the job (positive evidence the image
      #                           is broken: no bootable option, panic, or
      #                           the guest exited before the prompt)
      #   exit 3 — TIMEOUT      -> warn only (the guest was demonstrably
      #                           still progressing when the clock ran out)
      #
      # Honest limit, stated rather than papered over: a boot break that
      # manifests as a silent HANG past the bootloader still lands in the
      # advisory TIMEOUT bucket. This gate catches images that fail to
      # boot, not images that hang. The stage ladder printed in the log is
      # what makes that case visible to a reader; tightening it further
      # needs the CI boot to first land reliably under budget.
      - name: QEMU aarch64 boot smoke-test (081KTSZN10008QG0R00349SM6P slice 1 floor)
        working-directory: full-ai-cluster
        run: |
          set -euo pipefail
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::aarch64 QEMU boot test: No installer ISO under result/iso/" >&2
            exit 1
          fi
          iso_abs=$(readlink -f "${iso_candidates[0]}")
          echo "Booting aarch64 ISO: $iso_abs"

          rc=0
          bun ../src/Core.TypeScript/ci/qemu-boot-test.ts "$iso_abs" --arch aarch64 || rc=$?

          case "$rc" in
            0)
              echo "aarch64 QEMU boot: **BOOTED**" >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              echo "::warning::aarch64 QEMU boot: TIMEOUT -- the guest was still booting when the budget expired. This is a BUDGET result, not a boot failure; see the stage ladder in the step log for where the time went."
              {
                echo "aarch64 QEMU boot: **TIMEOUT (advisory)** -- budget exhausted while still booting."
                echo ""
                echo "This does NOT mean the image is broken. The harness reports BOOT-FAILED"
                echo "(exit 1) for that, and that DOES fail the job."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            4)
              # STALLED -- serial silent past the kernel handoff for the
              # stall window. This lane is measured INTERMITTENT: job
              # 95208551157 sat silent 4184s and never booted, job
              # 95218377728 booted in 192s, same image and runner type.
              #
              # ADVISORY, and it should stay advisory: on this evidence a
              # stall is at least as likely to be a starved runner as a
              # broken image, and blocking on it would red the ISO lane for
              # runner contention. The harness reports the silence as a
              # fact and does not diagnose it; BOOT-FAILED (exit 1) is the
              # bucket that carries positive evidence and that one blocks.
              echo "::warning::aarch64 QEMU boot: STALLED -- serial produced nothing for the stall window after the kernel handoff. This lane is intermittent (192s on a good run); the harness does not claim whether the guest hung or was starved."
              {
                echo "aarch64 QEMU boot: **STALLED (advisory)** -- silent past the EFI stub."
                echo ""
                echo "This lane is measured intermittent: 192s end-to-end on a good run, and one"
                echo "run silent for 4184s. Stopping early bounds the wasted runner time; it is"
                echo "not a diagnosis. See the stage ladder in the step log."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::aarch64 QEMU boot: BOOT-FAILED (harness exit $rc) -- positive evidence the ISO did not boot, not a slow runner."
              echo "aarch64 QEMU boot: **BOOT-FAILED** (harness exit $rc)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

      # ADDED 2026-08-21 -- PARITY with the x86_64 job, which has emitted a
      # digest since PR #13053. This job emitted NEITHER a digest NOR a
      # signature: its only artifact was the raw ISO, so `zflash`'s integrity
      # gate could never be satisfied for an arm64 image and an aarch64
      # operator was hard-stopped. Same shape as the x86_64 step, deliberately:
      # per-ISO `<iso>.sha256`, never a bare `SHA256SUMS`. The reason is
      # measured, not stylistic -- an unrelated `~/Downloads/SHA256SUMS`
      # belonging to Bitcoin Knots was found and parsed by the gate on the
      # maintainer's machine, which refused while printing 28 bitcoin
      # filenames. A well-known filename in a shared download directory is a
      # namespace collision, not a manifest.
      #
      # $RUNNER_TEMP, not beside the ISO: `result/iso/` is a symlink into the
      # read-only Nix store. Writing there is what reddened run 32445604341.
      - name: Locate aarch64 ISO + write the per-ISO digest manifest
        id: iso
        working-directory: full-ai-cluster
        run: |
          set -euo pipefail
          mapfile -t iso_candidates < <(find result/iso -maxdepth 1 -type f -name 'zeta-installer-*.iso' | sort)
          if [ "${#iso_candidates[@]}" -eq 0 ]; then
            echo "::error::aarch64: No installer ISO under result/iso/" >&2
            ls -la result/iso/ >&2 || true
            exit 1
          fi
          if [ "${#iso_candidates[@]}" -gt 1 ]; then
            echo "::error::aarch64: Multiple installer ISOs under result/iso/; expected exactly one:" >&2
            printf '  %s\n' "${iso_candidates[@]}" >&2
            exit 1
          fi
          iso_path_abs="$(pwd)/${iso_candidates[0]}"
          iso_name=$(basename "$iso_path_abs")
          iso_sha256=$(sha256sum "$iso_path_abs" | awk '{print $1}')
          iso_sha256_path="${RUNNER_TEMP}/${iso_name}.sha256"
          printf '%s  %s\n' "$iso_sha256" "$iso_name" > "$iso_sha256_path"
          {
            echo "path=$iso_path_abs"
            echo "name=$iso_name"
            echo "sha256=$iso_sha256"
            echo "sha256_path=$iso_sha256_path"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## AI-cluster installer ISO built (aarch64)"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| File   | \`$iso_name\` |"
            echo "| SHA256 | \`$iso_sha256\` |"
            echo ""
            echo "Download BOTH the ISO artifact and the \`.sha256\` artifact into the same"
            echo "directory. \`zflash\` refuses to write an ISO whose integrity it cannot"
            echo "establish, and the sidecar is what establishes it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aarch64 ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeta-installer-aarch64-iso
          path: full-ai-cluster/result/iso/*.iso
          retention-days: 14
          if-no-files-found: error

      - name: Upload the aarch64 ISO digest manifest as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Fixed name rather than the x86_64 job's `${{ steps.iso.outputs.name }}`.
          # The original reason was that both jobs built a `nixos-minimal-*` ISO whose
          # names could collide; as of 081KSGS9H0008QG0R00033DT02 they build
          # `zeta-installer-<release>-<system>.iso`, which already differs by arch. The
          # fixed name is KEPT anyway: it is stable across releases, which is what a
          # downstream consumer of this artifact wants, and it does not depend on a
          # filename this repo may rename again.
          name: zeta-installer-aarch64-iso.sha256
          path: ${{ steps.iso.outputs.sha256_path }}
          retention-days: 14
          if-no-files-found: error

  # THREE CONTROL PLANES, REPLICATED STORAGE, LOSE ONE — the first CLUSTER test.
  #
  # Every other nixosTest here boots one node, or two with no CNI. This job boots
  # three role=server members (embedded-etcd HA: one founds, two join through the
  # shipped injected-server-join.nix), brings them all Ready on the real Cilium,
  # installs Longhorn at the prod chart version with ONE test-only override
  # (3 replicas), proves the three replicas sit on three DISTINCT nodes, then
  # hard power-cuts the node holding a replica and the original write and
  # asserts: /readyz on both survivors, a quorum WRITE commits, and the data's
  # sha256 verifies from a pod on a surviving node with the volume `degraded`.
  # See full-ai-cluster/nixos/tests/k3s-ha-longhorn-cluster.nix.
  #
  # The etcd 2379/2380 admission it relies on is the PRODUCT's
  # (`zeta.k3sServer.etcdPeers`, modules/k3s-etcd-peers.nix) — the harness opens
  # no port of its own (081M10ZG61D087G0R001A70F0P was a harness that did).
  #
  # ITS OWN JOB, not a step in `build`, for two measured reasons: `build` already
  # spends its 180-min PR/push budget on the ISO and the single-node lanes, and
  # three 4 GiB guests need the whole 16 GiB of a fresh hosted runner rather
  # than one shared with a cold ISO build's nix store. It runs in parallel, so it
  # adds runner-minutes, not wall-clock.
  #
  # TIER: workflow_dispatch ONLY, until it has one green run on a hosted runner.
  # It was wired at longhorn-volume-binds' tier (push + schedule) and has not
  # yet passed there, so on push it would be a standing red on every
  # full-ai-cluster change. Measured on ubuntu-24.04 (16 GiB / 4 vCPU):
  #   run 35920509908  3 x 4096 MiB, all on root images: join + 3 Ready +
  #                    Longhorn on 3 nodes in 1476 s; PVC bind timed out —
  #                    etcd fdatasync > 1 s, applies up to 5.7 s, k3s restarts
  #                    on every server. Host RAM peak 14572 / 15989 MiB.
  #   run 35926193063  3 x 3584 MiB, /var/lib/rancher on a cache=unsafe disk:
  #                    3 Ready in 336 s, Longhorn in 1155 s; PVC bind timed out
  #                    again — 26847 slow-fdatasync warnings, k3s still
  #                    restarting. Host RAM peak 13213 / 15989 MiB.
  #   run 35930213010  + etcd db on tmpfs: slow-fdatasync gone (1 warning),
  #                    3 Ready at 329 s, Longhorn at 566 s — and the PVC bind
  #                    STILL timed out. 16825 `apply request took too long`
  #                    (2-5 s on read-only ranges, i.e. CPU, not disk) and 12
  #                    k3s exits on `leaderelection lost`. Host RAM 13156 MiB.
  # VERDICT from those three: three full control planes + the product Cilium
  # (envoy, hubble relay/ui) + Longhorn do NOT fit 4 hosted vCPUs; the guests'
  # 6 vCPUs starve each other past the leader-election renew deadline. This
  # needs a larger runner (8+ vCPU); relaxing the election timers would hide
  # the starvation rather than fix it. Restore push/schedule in the change
  # that records its first green run.
  # `only_cluster_ha` on a dispatch runs this job alone. Advisory either way:
  # `gate (required)` is the only required check on main.
  cluster-ha:
    name: k3s HA cluster + replicated Longhorn (3 VMs)
    # SKIPPED ON A WP11-SCOPED DISPATCH -- AT THE JOB LEVEL, DELIBERATELY, and
    # this is the one of the three orphaned steps that needed a DIFFERENT fix
    # rather than the step-level guard its siblings carry.
    #
    # Its lone NixOS step was ungated like the two in `build`, but gating the
    # STEP here would have been half a fix: this job is a 120-minute,
    # three-guest lane whose Checkout / Free runner disk / Install Nix /
    # memory-sampler steps are its own setup, and a skipped final step would
    # still have paid for all of it on a runner. The whole job is what a
    # narrowed probe must not start, so the condition belongs on the job.
    #
    # `github.event_name == 'workflow_dispatch'` alone admitted EVERY dispatch,
    # including `only_wp11=true` -- so a probe deliberately narrowed to the
    # installed-disk first-boot lane was also booting a 3-node HA cluster with
    # replicated Longhorn. The `only_cluster_ha` lane is unaffected (`&&`
    # short-circuits, and that input is orthogonal), and PR/push never reached
    # this job at all. Trigger condition only; what the step asserts is
    # unchanged.
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.only_wp11 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Three guests x 12 GiB qcow2 (sparse, but each fills with its own copy of
      # the Cilium + Longhorn images) plus the test closure. The hosted image's
      # preinstalled SDKs are dead weight for a nix-only job.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install Nix
        # Same pinned installer and settings as the `build` job.
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Start host memory sampler
        run: |
          nproc
          free -m
          ls -l /dev/kvm || echo "no /dev/kvm: the nixosTest driver will fall back to TCG"
          sample_host_memory() {
            while true; do
              echo "$(date +%s) $(free -m | awk '/Mem:/{print $3}')" >> "$RUNNER_TEMP/host-mem.log"
              sleep 10
            done
          }
          sample_host_memory >/dev/null 2>&1 &
          disown

      - name: NixOS test — 3-node HA cluster survives losing a replica-holding node
        timeout-minutes: 100
        working-directory: full-ai-cluster
        run: |
          start=$(date +%s)
          rc=0
          nix build .#checks.x86_64-linux.k3s-ha-longhorn-cluster -L --print-build-logs --fallback --option sandbox false || rc=$?
          echo "k3s-ha-longhorn-cluster: rc=$rc after $(( $(date +%s) - start )) s"
          exit "$rc"

      - name: Host resource budget (measured)
        if: always()
        run: |
          log="$RUNNER_TEMP/host-mem.log"
          if [ ! -s "$log" ]; then
            echo "::warning::host memory sampler recorded nothing; no budget measurement for this run"
            exit 0
          fi
          total=$(free -m | awk '/Mem:/{print $2}')
          peak=$(sort -k2 -n "$log" | tail -n1 | awk '{print $2}')
          samples=$(wc -l < "$log")
          {
            echo "### k3s-ha-longhorn-cluster host budget"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| host RAM total | ${total} MiB |"
            echo "| host RAM used, peak | ${peak} MiB |"
            echo "| samples (10 s) | ${samples} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "peak used ${peak} MiB of ${total} MiB over ${samples} samples"
          df -h /
