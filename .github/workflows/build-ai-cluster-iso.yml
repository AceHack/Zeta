      - name: Upload UEFI keyfile phase-1 serial log
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-uefi-keyfile-serial-log
