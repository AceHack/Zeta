            exit 1
          fi
          iso_abs=$(readlink -f "${iso_candidates[0]}")
          echo "UEFI keyfile picker ISO: $iso_abs"
          echo "Serial log out path: $SERIAL_LOG_OUT_PATH"
          bun ../src/Core.TypeScript/ci/qemu-full-install-test.ts "$iso_abs"

      - name: Upload UEFI keyfile picker serial log
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-uefi-keyfile-picker-serial-log
          path: qemu-uefi-keyfile-picker-serial.log
          if-no-files-found: warn
          retention-days: 7

      - name: 081KSNY2Z0008QG0R0008PN7RQ scenario 3 — reformat with retention (workflow_dispatch only)
        if: always() && github.event_name == 'workflow_dispatch'
        timeout-minutes: 90
        working-directory: full-ai-cluster
        env:
          ZFLASH_QEMU_RETENTION_EXECUTE: "1"
