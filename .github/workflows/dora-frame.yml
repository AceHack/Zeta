# Writes one real DORA frame to the org root site's live data, on a schedule.
#
# The org site (lucent-financial-group.github.io) serves data/metrics-history.json +
# data/metrics.json same-origin — the browser never calls the GitHub API. THIS job is the
# CI writer: it computes the frame from Zeta's own git+PR data (native access via
# GITHUB_TOKEN) and commits it into the pages repo. Append-only; the file IS the ledger.
#
# REQUIRED SECRET: PAGES_DEPLOY_TOKEN — a token (fine-grained PAT or classic, `contents:write`)
# scoped to Lucent-Financial-Group/lucent-financial-group.github.io. Without it the push step
# fails (the compute step still works, so you can inspect the frame in the run log).
name: dora-frame
on:
  schedule:
    - cron: "17 6 * * *" # daily ~06:17 UTC (off the :00 rush)
  workflow_dispatch: {} # manual "Run workflow" for an on-demand frame

concurrency:
  group: dora-frame
  cancel-in-progress: false

permissions:
  contents: read # reading Zeta's own PRs/commits via GITHUB_TOKEN

jobs:
  write-frame:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Zeta (full history for the 24h commit window)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compute the frame from Zeta git+PR data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          node tools/dora/compute-dora-frame.mjs --repo ${{ github.repository }} --window-hours 24 > /tmp/dora-frame.json
          echo "frame:"; cat /tmp/dora-frame.json

      - name: Clone the pages repo, apply the frame, commit + push
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "::warning::PAGES_DEPLOY_TOKEN not set — computed the frame but cannot push. Add the secret to enable live updates."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${PAGES_TOKEN}@github.com/Lucent-Financial-Group/lucent-financial-group.github.io.git" pages
          python3 tools/dora/apply-frame.py /tmp/dora-frame.json pages/data/metrics-history.json pages/data/metrics.json
          cd pages
          if git diff --quiet; then echo "no change this run"; exit 0; fi
          git config user.name "dora-frame[bot]"
          git config user.email "dora-frame@users.noreply.github.com"
          git commit -qam "data: DORA frame $(date -u +%Y-%m-%d) (auto)"
          git push -q origin HEAD
          echo "pushed live frame."
