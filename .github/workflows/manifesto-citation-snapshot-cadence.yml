name: manifesto-citation-snapshot-cadence

# Daily cadence for 081KS923C0008QG0R002BKAC95 manifesto-citation time-series. Runs
# `bun src/Core.TypeScript/hygiene/audit-manifesto-citations.ts --snapshot`,
# captures the resulting per-day JSON file under
# docs/hygiene-history/manifesto-citations/YYYY-MM-DD.json, and commits it
# DIRECTLY TO MAIN (fast-forward-safe, no branch, no PR).
# Mechanizes the deferred 5th acceptance criterion from 081KS923C0008QG0R002BKAC95
# (cron-cadence wiring).
#
# Composes with:
#  - .github/workflows/budget-snapshot-cadence.yml (sibling cadence — same commit-to-main shape)
#  - .github/workflows/context-cost-trend-cadence.yml (the commit-to-main reference pattern)
#  - .github/workflows/razor-cadence.yml (sibling daily-cadence)
#  - 081KRHWGX0008QG0R0016T9408 (constitutional-promotion readiness tracking — parent)
#  - 081KS923C0008QG0R002BKAC95 (citation time-series — this workflow ships its 5th criterion)
#  - src/Core.TypeScript/hygiene/audit-manifesto-citations.ts (the snapshot tool)
#
# Security note (safe-pattern compliance per
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
# ): this workflow consumes only first-party trusted context —
# secrets.GITHUB_TOKEN, github.repository, github.run_id, and the
# workflow_dispatch `note` input. Every expression value is passed
# via env: into run blocks and quoted there as "$VAR"; no expressions
# are interpolated directly inside run-block scripts. NOTE_INPUT is
# treated as untrusted (workflow_dispatch caller has dispatch
# permissions but input content is still sanitized via env:+quoted-
# substitution).
#
# HOW IT LANDS ON MAIN. It does not push to main. Ruleset "CI Gate" (16134995)
# makes `gate (required)` a required status check on main with `bypass_actors: []`,
# and a required check is evaluated at PUSH time against the pushed tip — so a
# commit that has never been through a check run is rejected before any check could
# start. This lane pushed `HEAD:main` anyway and had been failing on `GH013:
# Repository rule violations` on every scheduled run since 2026-08-19 (run
# 32558211949 and its predecessors). The ruleset is intended and is not to be
# weakened; the lane is what was out of date.
#
# The snapshot is now parked on the ungated staging branch
# `heartbeat/manifesto-citation-snapshot` and flushed via a PR with squash
# auto-merge armed, exactly as tick-metrics/society/red-state already do. That also
# retires the "Actions cannot create pull requests" constraint quoted above: the
# flush tool authenticates PR creation with a fine-grained PAT and degrades to
# parking-only (never data loss) when none is present.
# See src/Core.TypeScript/forge-host/github/flush-via-staging.ts.

on:
  schedule:
    # Daily 06:37 UTC — off-the-hour, before razor-cadence (09:17)
    # and outside budget cadence (Sundays 16:23).
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note to attach to this snapshot"
        required: false
        default: ""

permissions:
  contents: write       # push the staging branch
  pull-requests: write  # open/arm the flush PR

concurrency:
  group: manifesto-citation-snapshot-cadence
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    # 12 minutes, not 5: this job runs tools/setup/install.sh, so its timeout is
    # the CEILING on the installer's apt wall budget (audit-apt-budget-fits-job-
    # timeout.ts). At 5 minutes these three cadence jobs pinned that budget to
    # 150s fleet-wide, which left the first apt attempt 45s against a 38.2s
    # healthy cost — tight enough to false-fail a merely-slow mirror. A timeout
    # is a cap, not a reservation: this job finishes in ~2.5 min, so raising it
    # costs zero additional CI minutes on the healthy path.
    timeout-minutes: 12

    permissions:
      contents: write
      pull-requests: write

    steps:
      # ABSENCE IS A NAMED REFUSAL, NOT A SUBSTITUTION.
      #
      # The checkout below carries the BRANCH-PUSH role credential, and that role has no
      # substitute. The `|| secrets.GITHUB_TOKEN` rung this step replaces selected on the
      # secret being EMPTY and handed the lane a credential with DIFFERENT authority: the
      # push still succeeded, so the lane looked alive, and the failure surfaced later
      # under an error naming the wrong subject. It also trips GitHub's recursion guard —
      # actions taken with GITHUB_TOKEN do not trigger other workflows — so the degraded
      # lane silently stopped producing the events downstream jobs wait on.
      #
      # COST: one `test -z` on a bare runner, no checkout, no network. It buys one legible
      # line naming the exact secret and the exact scope instead of a downstream misread.
      - name: Assert the branch-push credential is present
        env:
          BRANCH_PUSH_TOKEN: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}
        run: |
          if [ -z "${BRANCH_PUSH_TOKEN:-}" ]; then
            echo "::error title=Missing ZETA_TELEMETRY_FLUSH_TOKEN::This lane holds the BRANCH-PUSH role and its credential is absent. There is no substitute: GITHUB_TOKEN carries different authority and its pushes do not trigger workflows. FIX: set repository secret ZETA_TELEMETRY_FLUSH_TOKEN on Lucent-Financial-Group/Zeta to a fine-grained PAT with Contents: read and write, Pull requests: read and write, Metadata: read. Role table: docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md"
            exit 1
          fi
          echo "branch-push credential present (role=branch-push secret=ZETA_TELEMETRY_FLUSH_TOKEN)"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # This checkout's credential is the one that pushes
          # `heartbeat/manifesto-citation-snapshot`, and its actor is what decides whether
          # `gate (required)` ever runs on the flush PR. See tick-metrics.yml for the
          # measurement behind it.
          #
          # ROLE: BRANCH-PUSH. One role, one secret. docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md
          # assigns ZETA_TELEMETRY_FLUSH_TOKEN this role and only this role; the
          # PR-create role is ZETA_PR_ARCHIVE_TOKEN and the dispatch role is
          # ZETA_SOCIETY_DISPATCH_TOKEN. A `||` chain collapsed all three into one
          # variable, which is why the rung below is gone.
          #
          # WHAT THE REMOVED `|| secrets.GITHUB_TOKEN` RUNG COST. It selected on the
          # secret being EMPTY and silently substituted a credential with DIFFERENT
          # authority, so the lane kept running and failed somewhere downstream under an
          # error naming the wrong subject. Compounding it, GitHub's recursion guard means
          # actions taken with GITHUB_TOKEN do not trigger other workflows — so a degraded
          # lane ALSO stopped producing the events downstream jobs wait on, silently.
          # ABSENCE is now the assert step above: loud, and it names the secret and scope.
          persist-credentials: true
          token: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN }}

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        env:
          # mise release-metadata calls authenticate (1000/hr) instead of anonymous (60/hr 403 flake)
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Verify required tooling
        run: |
          set -euo pipefail
          command -v bun >/dev/null

      - name: Configure committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Runs BEFORE the snapshot: `prepare` checks out a fresh branch off origin/main and
      # would discard a snapshot written ahead of it. It also unions in anything still
      # parked on the staging branch from a previous run whose flush PR has not landed.
      - name: Prepare staging working tree
        run: bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts prepare --lane manifesto-citation-snapshot

      - name: Run citation snapshot
        env:
          NOTE_INPUT: ${{ github.event.inputs.note || '' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bun src/Core.TypeScript/hygiene/audit-manifesto-citations.ts --snapshot
          if [ -n "${NOTE_INPUT:-}" ]; then
            echo "Note: $NOTE_INPUT"
          fi

      # No `Inspect diff` gate: `flush` stages the paths and returns a clean no-op when
      # nothing changed (idempotency, discipline #6). The old guard existed because the
      # daily snapshot is a NEW untracked file that `git diff --quiet` would miss; `git add`
      # inside the flush tool picks up untracked files under the given paths, so the
      # first-run-for-a-date case the guard was written for (PR #4758) stays covered.
      - name: Flush to main via staging branch + PR
        env:
          # ROLE: PR-CREATE. One role, one secret.
          #
          # The enterprise forbids the Actions identity from creating pull requests, so the
          # `gh` calls in this step authenticate as ZETA_PR_ARCHIVE_TOKEN — the credential the
          # role table in
          # docs/security/2026-08-17-society-heartbeat-token-boundary-and-gate-start-failure.md
          # assigns to `gh pr create`. The BRANCH PUSH is a different role and is already
          # authenticated by the persisted checkout credential (ZETA_TELEMETRY_FLUSH_TOKEN);
          # the `||` chain that stood here collapsed both roles plus GITHUB_TOKEN into one
          # variable and silently substituted whichever happened to be set.
          #
          # ABSENCE IS A NAMED REFUSAL, NOT A SUBSTITUTION. `openMergePR` refuses an empty
          # GH_TOKEN and names the secret and the exact scope
          # (src/Core.TypeScript/agent-heartbeats/merge-heartbeats-to-main.ts). The payload
          # still parks safely on the staging branch — nothing is lost — and the step goes
          # red rather than landing under the wrong authority.
          GH_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN }}
        run: |
          bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts flush \
            --lane manifesto-citation-snapshot \
            --paths docs/hygiene-history/manifesto-citations \
            --message "ops(081KS923C0008QG0R002BKAC95): daily manifesto-citation snapshot"
