name: manifesto-citation-snapshot-cadence

# Daily cadence for 081KS923C0008QG0R002BKAC95 manifesto-citation time-series. Runs
# `bun src/Core.TypeScript/hygiene/audit-manifesto-citations.ts --snapshot`,
# captures the resulting per-day JSON file under
# docs/hygiene-history/manifesto-citations/YYYY-MM-DD.json, and pushes
# a snapshot branch for the next maintainer/agent pass to land.
# Mechanizes the deferred 5th acceptance criterion from 081KS923C0008QG0R002BKAC95
# (cron-cadence wiring).
#
# Composes with:
#  - .github/workflows/budget-snapshot-cadence.yml (pattern reference)
#  - .github/workflows/razor-cadence.yml (sibling daily-cadence)
#  - 081KRHWGX0008QG0R0016T9408 (constitutional-promotion readiness tracking — parent)
#  - 081KS923C0008QG0R002BKAC95 (citation time-series — this workflow ships its 5th criterion)
#  - src/Core.TypeScript/hygiene/audit-manifesto-citations.ts (the snapshot tool)
#
# Security note (safe-pattern compliance per
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
# ): this workflow consumes only first-party trusted context —
# secrets.GITHUB_TOKEN, github.repository, github.run_id, and the
# workflow_dispatch `note` input. Every expression value is passed
# via env: into run blocks and quoted there as "$VAR"; no expressions
# are interpolated directly inside run-block scripts. NOTE_INPUT is
# treated as untrusted (workflow_dispatch caller has dispatch
# permissions but input content is still sanitized via env:+quoted-
# substitution).
#
# GitHub Actions permission limitation: this repository does not allow
# secrets.GITHUB_TOKEN to create pull requests. The workflow therefore
# publishes a branch and writes a run-summary handoff URL instead of
# calling `gh pr create`.

on:
  schedule:
    # Daily 06:37 UTC — off-the-hour, before razor-cadence (09:17)
    # and outside budget cadence (Sundays 16:23).
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note to attach to this snapshot"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: manifesto-citation-snapshot-cadence
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 1

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        env:
          # mise release-metadata calls authenticate (1000/hr) instead of anonymous (60/hr 403 flake)
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Verify required tooling
        run: |
          set -euo pipefail
          command -v bun >/dev/null

      - name: Run citation snapshot
        env:
          NOTE_INPUT: ${{ github.event.inputs.note || '' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bun src/Core.TypeScript/hygiene/audit-manifesto-citations.ts --snapshot
          if [ -n "${NOTE_INPUT:-}" ]; then
            echo "Note: $NOTE_INPUT"
          fi

      - name: Inspect diff
        id: diff
        run: |
          set -euo pipefail
          # Detect BOTH tracked changes AND new untracked files. The
          # daily snapshot is a NEW file (docs/hygiene-history/
          # manifesto-citations/YYYY-MM-DD.json) so `git diff --quiet`
          # alone would miss it on the first run for a date (per
          # Copilot P0 + Codex P1 catch on PR #4758). git status
          # --porcelain reports both modified-tracked and new-untracked.
          status_lines="$(git status --porcelain -- docs/hygiene-history/manifesto-citations/)"
          if [ -z "$status_lines" ]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "no diff (today's snapshot already committed)"
            exit 0
          fi
          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Publish snapshot branch
        if: steps.diff.outputs.changed == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          NOTE_INPUT: ${{ github.event.inputs.note || '' }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          ts="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          branch="ops/manifesto-citation-snapshot-${today}-run-${RUN_ID}"
          branch_url="https://github.com/${REPOSITORY}/tree/${branch}"
          compare_url="https://github.com/${REPOSITORY}/compare/main...${branch}?expand=1"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "snapshot branch already exists: $branch"
            {
              echo "## Manifesto citation snapshot branch already exists"
              echo
              echo "- Branch: \`$branch\`"
              echo "- Branch URL: $branch_url"
              echo "- Compare URL: $compare_url"
              echo
              echo "No PR was created from this workflow because GitHub Actions"
              echo "is not permitted to create pull requests in this repository."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/hygiene-history/manifesto-citations/

          {
            echo "ops(081KS923C0008QG0R002BKAC95): daily manifesto-citation snapshot $today"
            echo
            echo "Why:"
            echo "- Daily cadence per 081KS923C0008QG0R002BKAC95 acceptance criteria"
            echo "  (5th criterion: cron-cadence wiring; this commit"
            echo "  is the mechanization)."
            echo "- Composes with 081KRHWGX0008QG0R0016T9408 constitutional-promotion gate"
            echo "  measurement infrastructure."
            echo
            echo "What:"
            echo "- One JSON snapshot at"
            echo "  docs/hygiene-history/manifesto-citations/${today}.json"
            echo "  written by src/Core.TypeScript/hygiene/audit-manifesto-citations.ts"
            echo "  --snapshot."
            echo
            echo "Proof:"
            echo "- audit-manifesto-citations.ts ran in run $RUN_ID."
            echo "- Snapshot is per-day idempotent."
            echo
            echo "Limits:"
            echo "- Snapshots are signals; the gate decision is the"
            echo "  human maintainer's call per 081KRHWGX0008QG0R0016T9408 substrate-honest"
            echo "  framing."
            echo "- Snapshot strips citations[] array; ~2-3KB/day;"
            echo "  ~1MB/year tractable."
            if [ -n "${NOTE_INPUT:-}" ]; then
              echo
              echo "Note (from workflow_dispatch input):"
              # NOTE_INPUT is untrusted; embed as data-only via stdin/
              # printf. Double-quoted "$NOTE_INPUT" preserves content
              # without shell interpretation.
              printf '%s\n' "$NOTE_INPUT"
            fi
            echo
            echo "Agency-Signature-Version: 1"
            echo "Agent: manifesto-citation-snapshot-cadence-workflow"
            echo "Agent-Runtime: GitHub Actions"
            echo "Agent-Model: bash + bun + gh CLI"
            echo "Credential-Identity: github-actions[bot]"
            echo "Credential-Mode: dedicated-agent"
            echo "Human-Review: not-implied-by-credential"
            echo "Human-Review-Evidence: none"
            echo "Action-Mode: autonomous-fail-open"
            echo "Task: 081KS923C0008QG0R002BKAC95"
            echo "Co-authored-by: Otto <noreply@anthropic.com>"
          } | git commit --file=-

          git push -u origin "$branch"

          {
            echo "## Manifesto citation snapshot branch"
            echo
            echo "Daily manifesto-citation snapshot via the cadence"
            echo "workflow (run $RUN_ID, $ts)."
            echo
            echo "## What this branch adds"
            echo
            echo "- One JSON snapshot at"
            echo "  \`docs/hygiene-history/manifesto-citations/${today}.json\`"
            echo "  (per-surface metrics + totals; ~2-3KB)."
            echo
            echo "## Cadence policy"
            echo
            echo "Per 081KS923C0008QG0R002BKAC95 acceptance criteria (5th criterion: cron-"
            echo "cadence wiring). Composes with 081KRHWGX0008QG0R0016T9408 constitutional-"
            echo "promotion gate measurement infrastructure."
            echo
            echo "Authorized by 081KS923C0008QG0R002BKAC95 row + 081KRHWGX0008QG0R0016T9408 parent. Per-run"
            echo "trailer fields use Human-Review-Evidence=none per the"
            echo "validator consistency rule."
            echo
            echo "## Branch handoff"
            echo
            echo "- Branch: \`$branch\`"
            echo "- Branch URL: $branch_url"
            echo "- Compare URL: $compare_url"
            echo
            echo "No PR was created from this workflow because GitHub Actions"
            echo "is not permitted to create pull requests in this repository."
            echo "Next maintainer/agent pass should open or land the branch."
            if [ -n "${NOTE_INPUT:-}" ]; then
              echo
              echo "## Note (from workflow_dispatch input)"
              echo
              # NOTE_INPUT untrusted; embed as markdown body data-only
              # via printf. Body is then written to /tmp/...pr-body.md
              # and gh pr create reads it from the file; no shell
              # interpretation of NOTE_INPUT content.
              printf '%s\n' "$NOTE_INPUT"
            fi
            echo
            echo "Agency-Signature-Version: 1"
            echo "Agent: manifesto-citation-snapshot-cadence-workflow"
            echo "Agent-Runtime: GitHub Actions"
            echo "Agent-Model: bash + bun + gh CLI"
            echo "Credential-Identity: github-actions[bot]"
            echo "Credential-Mode: dedicated-agent"
            echo "Human-Review: not-implied-by-credential"
            echo "Human-Review-Evidence: none"
            echo "Action-Mode: autonomous-fail-open"
            echo "Task: 081KS923C0008QG0R002BKAC95"
            echo "Co-authored-by: Otto <noreply@anthropic.com>"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: No-change report
        if: steps.diff.outputs.changed == 'false'
        run: |
          set -euo pipefail
          echo "No diff — today's snapshot already exists on main."
          echo "Cadence run still healthy (idempotent per-day)."
