# Watchdog: does every open PR actually HAVE the one required check?
#
# THE DEFECT (measured 2026-08-24, work-item 081M0TK8DE8087G0R0001HSKHF).
# `CI Gate` is the only ruleset carrying a `required_status_checks` rule and it names
# exactly one context: `gate (required)`. So a PR for which `gate.yml` never produced a
# run has ZERO required checks — and every ordinary reading surface calls that green:
#
#     gh pr checks 14858            -> rc=0, 6 pass / 0 fail / 0 pending
#     gh pr checks 14858 --required -> rc=1, "no required checks reported"
#
# Both exit codes captured directly, not through a pipe. The bare form is the one a
# reader reaches for, and it answers a different question than the one being asked:
# "did everything that reported, pass" instead of "did everything that must report,
# pass". With nothing required reported, the two answers diverge completely and the
# wrong one is green. That is the standing "a check that did not run looks exactly like
# a check that passed" class, at the rollup-of-rollups level.
#
# IT IS NOT HYPOTHETICAL AND IT IS NOT RARE. Of the 42 open PRs on 2026-08-24, FOUR
# carried no `gate (required)` at all — #12058, #12066, #12321, #14858 — and #14858 had
# zero `gate.yml` runs for its branch, ever. It was authored specifically to report a
# drift gate that had gone silent, and its own PR was silent about a missing gate.
#
# WHY A CRON AND NOT A HOOK. The subject is a run that DOES NOT EXIST, so nothing the
# PR emits can carry the signal: `workflow_run` needs a run (which is why
# `rerun-cancelled-gate.yml` structurally cannot cover this — it fires on a gate run's
# completion), and a `pull_request` trigger is the very event that failed to fire.
# Level-triggered for the same reason `heartbeat-liveness.yml` is: this workflow's own
# cron slot can be dropped — measured 16% on this repo — and a level check that runs
# late still gives the right answer, where an edge check would miss the edge and go
# quiet, reproducing the bug it exists to catch.
#
# WHAT IT DELIBERATELY DOES NOT DO: re-run anything. A `workflow_dispatch` gate run's
# checks DO NOT enter a PR's statusCheckRollup and can never satisfy the required check
# — measured and removed in PR #11182 — so a dispatch belt here would burn a full matrix
# to move nothing. The only acts that make gate report are a fresh `pull_request` event
# (close/reopen, or a push), both of which are writes to somebody else's branch. This
# workflow reports; a human or the PR's owner decides.
#
# RUNS, BLOCKS NOTHING. It is absent from `gate (required)`'s needs list and adding it
# there would be a treaty amendment, not a workflow edit (drift-and-heal ADR,
# 2026-08-01). Its red is a red X plus an `::error::` annotation, per the drift-loud
# discipline: non-blocking must not mean unnoticed.
#
# COST. MEASURED: the script takes 8.7s wall against the live forge for 42 open PRs
# (one `gh pr list`, plus one `gh api` per rollup-absent PR — 4 today). With checkout
# and setup-bun the job is ~15s, billed as 1 minute. Hourly = 24 runs/day ≈ 730
# runner-minutes/month, on free public-repo runners; the scarcer resource is the
# scheduler queue this repo already saturates, which is why the cadence is hourly at an
# off-minute rather than joining the crowded */15 slots. For comparison,
# `test (TS hermetic)` alone is ~2,250 min/month.
#
# DISCIPLINE (mirrors gate.yml): runner pinned to an explicit version; third-party
# actions SHA-pinned by full 40-char commit SHA; least-privilege permissions, each with
# a stated purpose; every job carries timeout-minutes.

name: pr-gate-presence

on:
  schedule:
    # Off-minute and hourly. :00, :15, :30, :45 are already contended on this repo.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      min_age_min:
        description: "Minutes a PR must be open before a missing gate counts as stalled"
        required: false
        default: "20"

permissions:
  contents: read # sparse checkout of the one script below
  pull-requests: read # gh pr list --json statusCheckRollup — the candidate set
  actions: read # gh api .../workflows/gate.yml/runs — stalled vs merely queued

concurrency:
  group: pr-gate-presence
  # Safe to cancel: the job holds no state and writes nothing. Every run recomputes the
  # same level from scratch, so a newer check strictly supersedes a queued older one.
  cancel-in-progress: true

jobs:
  check:
    name: every open PR has gate (required)
    runs-on: ubuntu-24.04
    # 5 is a RUNAWAY CAP, not a budget: the measured run is 8.7s and nothing here polls,
    # waits, or retries beyond three transient-failure attempts.
    timeout-minutes: 5

    steps:
      - name: Checkout (the detector only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            src/Core.TypeScript/forge-host/github/required-check-started.ts
          sparse-checkout-cone-mode: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Every open PR has a gate run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Interpolated into an ENV VAR, never into the shell (BP-11): the dispatch input
          # is caller-controlled text. The script validates it and exits 2 on anything
          # that is not a non-negative number.
          MIN_AGE_MIN: ${{ github.event.inputs.min_age_min || '20' }}
        run: |
          set -euo pipefail
          # NOT piped. A pipe returns the LAST command's status, and this job's entire
          # subject is a status that was read wrong. Exit 2 (unmeasured — host failure or
          # a truncated listing) is deliberately distinct from exit 1 (measured absence).
          bun src/Core.TypeScript/forge-host/github/required-check-started.ts \
            --ref-prefix '' \
            --min-age-min "${MIN_AGE_MIN}"
