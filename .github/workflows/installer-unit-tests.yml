# Installer unit tests — the USB/zflash provisioning suite gate.
#
# WHY THIS EXISTS:
# `build-and-test` (the required floor) runs `dotnet test` (.NET) but NOT
# `bun test` — so the TypeScript installer suite (271 tests across 11 files:
# credential-binding, wifi-esp-to-nm, zeta-creds-*, zeta-hardware-detect,
# key-refusal-falsifier) was running nowhere in CI. These are the
# USB/zflash first-install + self-heal provisioning tests (trajectory
# docs/trajectories/usb-zflash-installer/); a regression in them is a
# regression in getting a node onto metal. This focused, path-filtered
# workflow closes that gap.
#
# ARCHITECTURE (post-2026-08-01 "THE FLIP", gate.yml gate-required note):
# blocking-floor additions are a treaty-amendment consent path, so this is
# deliberately a SEPARATE targeted workflow — same pattern as
# k8s-argocd-health-test.yml / keyring-dst1000.yml — NOT an entry in the
# gate-required needs: list. It runs on every PR/push that touches installer
# code and gives its own red X; it does not block unrelated lanes.
#
# SECURITY: only the SHA-pinned checkout action is used (per
# docs/security/GITHUB-ACTIONS-SAFE-PATTERNS.md); no attacker-controlled PR
# title/body/branch text is interpolated into any `run:` block.

name: installer-unit-tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/Core.TypeScript/installer/**"
      # Two tests in that directory read zeta-install.sh and execute blocks
      # extracted from it (disk-preflight-shell-parity.test.ts,
      # hardware-config-capture.test.ts). Without this path the installer
      # script could change the very logic they pin and this lane would not
      # run -- a check that did not run, looking like a check that passed.
      - "full-ai-cluster/usb-nixos-installer/zeta-install.sh"
      # The Touch ID sudo installer/verifier. Its PURE core (assess/render/parse)
      # is exercised here; the LIVE check can only run on a Mac, so the logic is
      # a total function over a facts record precisely so CI can still test it.
      - "tools/setup/touchid-sudo.ts"
      - "tools/setup/touchid-sudo-config.ts"
      - "tools/setup/touchid-sudo-config.test.ts"
      - ".github/workflows/installer-unit-tests.yml"
      - ".mise.toml"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
  push:
    branches: [main]
    paths:
      - "src/Core.TypeScript/installer/**"
      # Two tests in that directory read zeta-install.sh and execute blocks
      # extracted from it (disk-preflight-shell-parity.test.ts,
      # hardware-config-capture.test.ts). Without this path the installer
      # script could change the very logic they pin and this lane would not
      # run -- a check that did not run, looking like a check that passed.
      - "full-ai-cluster/usb-nixos-installer/zeta-install.sh"
      # The Touch ID sudo installer/verifier. Its PURE core (assess/render/parse)
      # is exercised here; the LIVE check can only run on a Mac, so the logic is
      # a total function over a facts record precisely so CI can still test it.
      - "tools/setup/touchid-sudo.ts"
      - "tools/setup/touchid-sudo-config.ts"
      - "tools/setup/touchid-sudo-config.test.ts"
      - ".github/workflows/installer-unit-tests.yml"
      - ".mise.toml"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer-tests:
    name: installer unit tests (bun)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache install.sh outputs (mise runtimes + dotnet tools + verifier jars)
        # The path list and key MUST stay byte-identical to gate.yml's
        # `install-v2-*` blocks: actions/cache identity is (key, version) and
        # the version is a hash of the path list, so any divergence silently
        # forks this into a SECOND ~1.5 GB entry under the same key.
        # Rust-path rationale lives in the gate.yml header comment.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin/mise
            ~/.local/share/mise
            ~/.cache/mise
            ~/.dotnet/tools
            ~/.elan
            ~/.config/zeta
            ~/.rustup/toolchains/1.87.0-*
            ~/.rustup/settings.toml
            ~/.rustup/update-hashes
            ~/.cargo
            ~/.cache/zeta/from-autotools-tarball/*.tgz
          key: install-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'tools/setup/**', 'global.json') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: slim

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        env:
          # TIER DECLARED, not detected (081M0K36K69087G0R003BYSCF8 applied beyond gate.yml).
          # Every payload step in this job is bun/git/gh only -- it touches no agda, ghc,
          # emscripten, llvm, pandoc, r-base, podman, qemu or opam. On a hosted ubuntu runner
          # the undeclared path is not adaptation: 16 GB always detects `full`, i.e. the whole
          # 388-package / 713.0 MiB apt manifest. slim is 149 packages / 139.7 MiB.
          # This is a RELIABILITY fix before it is a cost one: the mirror stalls land on the
          # biggest archives (pandoc 26.9 MB, r-base-core 27.1 MB), so fetch fewer and fewer
          # runs die at exit 124 inside the 420s apt budget.
          ZETA_HOST_TIER: slim
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      - name: Run installer unit tests
        run: bun test src/Core.TypeScript/installer/

      # Touch ID sudo: the durability logic that decides RED vs GREEN. This runs
      # on ubuntu, which is the point -- the verdict is a pure function of a
      # `PamFacts` record, so the OS-update-revert case can be pinned as a
      # fixture here rather than only being observable on a Mac after an update.
      - name: Run Touch ID sudo config tests
        run: bun test tools/setup/touchid-sudo-config.test.ts
