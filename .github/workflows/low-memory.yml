# Low-memory verification (ubuntu-slim).
#
# Runs a source-owned Core smoke graph on the 1-vCPU / 5GB-RAM
# `ubuntu-slim` runner class on every push to main (in practice
# every merge — direct pushes are blocked by branch protection) +
# nightly. Goal: detect drift that would break Zeta on
# resource-constrained environments before contributors hit it.
#
# Filename history: this file was originally `nightly-low-memory.yml`
# when its only trigger was the 06:00 UTC schedule. After the
# per-merge trigger landed (#44), maintainer 2026-04-27 flagged
# the filename as misleading: *"when it becomes per merge this
# won't be a good filename anymore"*. Renamed to `low-memory.yml`
# — describes the *purpose* (low-memory drift detection); the
# cadence (per-merge + nightly + manual) is a config detail that
# can change again without churning the filename.
#
# Why post-merge + nightly instead of per-PR (maintainer 2026-04-27):
#   The ubuntu-slim leg takes ~10+ minutes vs ~1.5 minutes on the
#   regular ubuntu-24.04 runner — ~7x slower — and frequently times
#   out at the 15-minute hard cap GitHub enforces on this runner
#   class. As a per-PR gate it bottlenecks landing without adding
#   proportional signal.
#
#   Maintainer 2026-04-27: "no reason we don't change that nightly
#   job for slim to just trigger on every merge to main, it's free
#   for open source projects." So the trigger surface is now:
#     1. push to main (every merge) — primary drift detection
#     2. daily 06:00 UTC schedule — catches weekend drift +
#        backstops if push triggers somehow miss
#     3. workflow_dispatch — manual ad-hoc verification
#   Standard GitHub-hosted runners are free for public repos
#   (per Otto-249 — standard runners free for public repos),
#   so the per-merge run has no cost downside.
#
# What this workflow does:
#   - push to main: runs on every push to main (in practice every
#     merge; primary trigger).
#   - Schedule: daily at 06:00 UTC (backstop for weekends + missed
#     pushes).
#   - workflow_dispatch: manual trigger for ad-hoc verification.
#   - Single ubuntu-slim leg matching gate.yml's install sequence,
#     then restoring/building/testing the Core.CSharp.Tests graph.
#     That graph exercises src/Core plus the C# wrapper/test surface
#     while staying inside ubuntu-slim's hard 15-minute job limit.
#     Full-solution build/test remains the normal gate's job.
#     ubuntu-slim was REMOVED from gate.yml's matrix when the
#     per-merge trigger landed (per Codex P2 review on LFG #644) so
#     we don't double-run the slim leg on every push.
#   - Failure = drift on low-memory runners. File a BACKLOG row;
#     does not block PRs in flight.
#
# Safe-pattern compliance (mirrors gate.yml):
#   - SHA-pinned actions (actions/checkout@de0fac2..., actions/cache@27d5ce7...)
#   - Explicit `permissions: contents: read` minimum
#   - Concurrency-grouped to avoid overlapping runs
#   - GITHUB_TOKEN exposed via env: for mise's aqua: backend
#     (read-only inheritance from workflow permissions). No
#     untrusted github.event.* fields are referenced anywhere
#     in this workflow.
#   - timeout-minutes set to 14 — one minute under the 15-minute
#     runner-class hard cap so the job fails gracefully (with a
#     proper Actions log) before the platform kills it.
#
# References:
#   - 1-vCPU runner availability: https://github.blog/changelog/2026-01-22-1-vcpu-linux-runner-now-generally-available-in-github-actions/

name: low-memory

on:
  push:
    branches: [main]
  schedule:
    - cron:
        "0 6 * * *" # 06:00 UTC daily (catches drift on
        # weekends / when no main commits land)
  workflow_dispatch: {}

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  # Per-commit concurrency group: every push to main gets its own slot
  # so no run is silently replaced by a newer one (per Codex P2 +
  # Copilot P1 review on LFG #644). On schedule/workflow_dispatch the
  # SHA is whatever main is pointing at when the run starts; two such
  # runs against the same SHA queue (cancel-in-progress: false) — the
  # right behaviour, since the second run has nothing new to check.
  group: low-memory-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test-low-memory:
    name: core-smoke (ubuntu-slim, low-memory)
    runs-on: ubuntu-slim
    timeout-minutes: 14 # fail gracefully before the 15-minute runner-class hard cap

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache .NET SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dotnet
          key: dotnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'tools/setup/common/dotnet.sh') }}

      # RESTORE-ONLY, deliberately — this lane READS the mise cache and never WRITES it.
      #
      # The entry is 825 MB (measured: `Cache Size: ~825 MB (865502705 B)`, run
      # 32549356483). Writing it back costs the 1-vCPU host real wall time INSIDE the
      # 14-minute cap: `Post Cache mise runtimes` measured 0-246s across 60 runs
      # (p90 90s, max 246s on run 32544861733), and it is where 2 of the 9 runs killed
      # at the cap actually died (32517981607, 122s into the save; 32540421350, 105s).
      #
      # The save buys this lane nothing, because `gate.yml:build-and-test` writes the
      # IDENTICAL key (same `path:`, same `hashFiles('.mise.toml', '.mise.full.toml')`,
      # same runner.os/arch) on the same `push: [main]` trigger, from a 4-vCPU host
      # where the write is cheap. Two writers, one key: the slow one was paying for a
      # cache the fast one already maintains.
      #
      # It is also the RIGHT writer to keep. gate runs at the full host tier, so the
      # entry it writes is a superset of what a slim host needs; the slim lane writing
      # it back replaces that superset with a subset, which the full-tier jobs then
      # have to re-install. Restore-only makes the tier split hold at the cache layer.
      #
      # COLD PATH — verified, not inferred (the case a warm-only measurement misses).
      # Run 32550223578 ran this exact step with a deliberately-unmatchable key so the
      # miss was guaranteed: restore 0s and `Cache not found for input keys: mise-
      # COLDTEST-...`, install 156s, build 155s, test 5s, job green in 343s of the 840s
      # cap (2.45x headroom) — and NO `Post Cache mise runtimes` step in the run at all.
      # A cold mise cache costs the same as today's cold path MINUS the write, never
      # more, because the write is the only thing this change removes.
      - name: Restore mise runtimes (never saved from this lane — see above)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/mise
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', '.mise.full.toml') }}

      - name: Cache elan (Lean 4 toolchain)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('src/Core.TypeScript/ace/setup-realizers/from-elan.ts', 'tools/setup/manifests/from-elan') }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}

      - name: Install toolchain via three-way-parity script (GOVERNANCE Section 24)
        # slim host declaration: this lane builds+tests only — standard/full-tier manifest
        # entries (stryker, analyzers, the diagnostics suite) are skipped LOUDLY by
        # dotnet-tools.sh. Workitem 081KTWQZY7F08QG0R0034KN17T (host tiers x package requires).
        #
        # THIS LINE IS NOW LOAD-BEARING FOR THE APT PHASE TOO
        # (081M0K36K69087G0R003BYSCF8). manifests/apt used to be installed in full on every
        # host — 388 packages / 713 MiB resolved — because linux.sh had no tier gate, and on
        # a 1-vCPU runner that phase measured 148s against ubuntu-24.04's 38s. It now honours
        # `tier=` the way macos.sh has always honoured it for brew, so this declaration
        # selects the 149-package / 139.7 MiB slim set. Delete the line and the lane goes
        # back over budget with nothing red to explain why —
        # src/Core.TypeScript/ci/apt-manifest-host-tier.test.ts asserts it is still here.
        #
        # WHAT THAT STOPS DETECTING, stated rather than discovered later: this lane no longer
        # proves the standard-tier packages (agda, emscripten, llvm, r-base, pandoc, podman,
        # qemu, opam) install on a 1-vCPU / 5 GB host. They are still installed and exercised
        # on every ubuntu-24.04 gate job, so the packages are covered; what is uncovered is
        # that specific pairing — and nothing in Zeta claims it, since manifests/brew has
        # declared those same tools out of scope for a slim host since 081KTWQZY7F.
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          ZETA_HOST_TIER: slim
        run: ./tools/setup/install.sh

      - name: Restore low-memory Core smoke graph
        run: >
          dotnet restore
          tests/Core.CSharp.Tests/Core.CSharp.Tests.csproj

      - name: Build low-memory Core smoke graph
        run: >
          dotnet build
          tests/Core.CSharp.Tests/Core.CSharp.Tests.csproj
          -c Release
          --no-restore

      - name: Test low-memory Core smoke graph
        run: >
          dotnet test
          tests/Core.CSharp.Tests/Core.CSharp.Tests.csproj
          -c Release
          --no-build
          --no-restore
          --verbosity normal
