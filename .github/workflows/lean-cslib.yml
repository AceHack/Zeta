name: lean-cslib

# Builds and audits the CSLib tower rooted at src/Core.Lean4.Cslib/CslibTower.lean.
#
# WHY THIS WORKFLOW EXISTS
# ------------------------
# Until 2026-09-11 `src/Core.Lean4.Cslib` had ZERO CI. It was rostered UNCOVERED in
# `hygiene/audit-build-graph-completeness.ts` ("Opt-in Mathlib-dependent library ...
# the lake cache is multi-GB") and carried `legs: []` in `ace/build-graph.json`, so
# nothing selected it and nothing built it. Its own lakefile pointed at "the opt-in
# workflow", which did not exist. Aaron 2026-09-11: "we need this cslib — all AI labs
# are contributing for AI research." An uncovered library that the whole field is
# contributing to is a cost, not a saving.
#
# WHY ITS OWN LANE RATHER THAN A SECOND JOB IN lean-proof.yml
# -----------------------------------------------------------
# The two Lean towers are on DIFFERENT toolchains — src/Core.Lean4 is
# leanprover/lean4:v4.30.0-rc1 (Mathlib 0c154d67), src/Core.Lean4.Cslib is v4.32.0-rc1
# (Mathlib 360da6fa). They therefore share NO olean cache at all: not one `.olean` from
# one tower is usable by the other. Folding this into lean-proof.yml would put both
# path filters on one trigger, so every src/Core.Lean4 change would restore and rebuild
# a Mathlib+cslib tree it cannot use, and vice versa. Two lanes, two path filters, two
# cache namespaces.
#
# WHY IT IS NOT ON `gate (required)`
# ----------------------------------
# MEASURED, not assumed (2026-09-11, Apple M-series / 10 cores / home connection;
# a 4-core hosted runner is slower and a runner's link to Azure is faster, so read
# these as the shape, and the workflow's own run summary as the number):
#
#   TRUE COLD -- no .lake, empty XDG cache, nothing but the checkout:
#     `lake exe cache get`  (dep clone + 8564 archives from Azure + decompress) ... 102 s
#     `lake build`          (cslib compiled from source, 2737 jobs) ................ 56 s
#     TOTAL ...................................................................... 158 s
#   WARM (.lake intact): `lake build` .............................................. 2 s
#   MATHLIB WARM, cslib rebuilt from source ....................................... 74 s
#
#   .lake, fully materialised .................... 7.4 GB
#     of which mathlib oleans ..................... 6.3 GB   (regenerated by `cache get`)
#     of which mathlib .git ....................... 500 MB
#     of which cslib's own build .................. 186 MB   (no CDN -- compiled here)
#   ~/.cache/mathlib for THIS pinned Mathlib rev ............ 430 MB
#
# AND THEN MEASURED ON THE REAL RUNNER -- run 34668990043, this lane's first, with every
# cache cold (ubuntu-24.04, 4 vCPU). Per step: checkout 13s · cache restores 0s (miss) ·
# apt-archive restore 4s · install.sh 103s · `lake exe cache get` 93s · setup-bun 1s ·
# `lake build` 188s · artifact guard <1s · FLP axiom audit 3s. TOTAL 406 s = 6m46s, cold,
# and green. `lake exe cache get` came in at 93s against 102s locally, so the local numbers
# above transfer; `lake build` is 188s against 56s, which is the 4-vCPU runner.
#
# The part worth someone's follow-up: install.sh at ZETA_HOST_TIER=full is 103 s, a quarter
# of the job, for a lane that needs elan and bun. The tier is declared `full` only because
# lean-proof.yml declares it (see the step below). Trimming it is a real measurement nobody
# has taken, and it is recorded in apt-job-timings.measured.json's row for this job too.
#
# TWO THINGS FOLLOW, and the first is the one that unblocked this lane.
#
# 1. "The lake cache is multi-GB" -- the roster's reason for zero CI -- was true of
#    `.lake` and false as a cost. From absolutely nothing the whole tower is 2m38s,
#    because `lake exe cache get` downloads pre-built oleans instead of compiling
#    Mathlib. The premise was about disk, and it was being used to decide about time.
#
# 2. It is the reason this workflow does NOT cache `.lake`. A 7.4 GB entry would take
#    ~74% of GitHub's 10 GB per-repo cache ceiling and evict every other cache in the
#    repo. What is cached is `~/.cache/mathlib`, 430 MB -- the compressed archive the
#    6.3 GB is decompressed out of.
#
#    Stated honestly, that cache buys AVAILABILITY, not many minutes: the cold path is
#    already 158 s, so the win is not depending on lakecache.blob.core.windows.net being
#    up on every PR, plus not hitting the Mathlib community's CDN on every push. If a
#    future measurement shows the save/restore costs more than it returns, delete it --
#    the lane is correct without it.
#
# Path-filtered and out-of-band, exactly like lean-proof.yml. Hard rule for the next
# person who is tempted to add it to the gate: it must be cached and measured first.
#
# KNOWN FLAKE, recorded rather than papered over. One of six local `lake build`
# invocations failed on `Cslib.Computability.Automata.NA.Concat`; the byte-identical
# rerun succeeded, and rebuilding that module alone takes 4.7 s at ~810 MB peak RSS.
# The failing run was the one competing with everything else on the machine, so this
# reads as resource exhaustion under parallel load rather than a content error -- READS
# AS, not measured: nothing here isolated the cause. No retry is wired in on purpose -- a blind retry around a build step turns a real
# regression into an intermittent one, which is the same vacuity class this lane exists to
# close. If it recurs on a hosted runner, the fix is `lake build -j<N>`, measured.
#
# Safe-pattern compliance (per FACTORY-HYGIENE row #43):
#   - SHA-pinned actions/checkout + actions/cache + oven-sh/setup-bun (all already on
#     the action-SHA roster; this workflow adds no new third-party action)
#   - Explicit minimum permissions: contents: read
#   - No user-authored context; purely repo-file reads
#   - Concurrency group + pinned runs-on + timeout-minutes
#   - Path-filter narrows the trigger surface
#
# ON leanprover/lean-action, WHICH WAS CHECKED AND DECLINED
# --------------------------------------------------------
# The community's standard action does elan install + `lake exe cache get` + build in
# one step. It is declined here for two repo-specific reasons, neither of which is a
# judgement about the action: (1) installing a toolchain outside `tools/setup/install.sh`
# breaks GOVERNANCE §24 three-way parity (laptop / CI / devcontainer read one manifest);
# (2) it would be a new third-party action, which `hygiene/audit-action-sha-roster.ts`
# treats as an explicit adoption act needing its own roster row and review. The steps
# below are what it would have done, using actions this repo has already adopted.

on:
  pull_request:
    paths:
      - "src/Core.Lean4.Cslib/**"
      - ".github/workflows/lean-cslib.yml"
  push:
    branches: [main]
    paths:
      - "src/Core.Lean4.Cslib/**"
      - ".github/workflows/lean-cslib.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Same shape and same caveat as lean-proof.yml: exposes the repo-scoped token to steps
# that need it; setup/common/mise.sh masks it during `mise install` because GitHub
# returns 404 for some public release-tag endpoints when queried with it. No write
# escalation — this inherits `permissions: contents: read` above.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: lean-cslib-${{ github.ref }}
  cancel-in-progress: false

jobs:
  type-check:
    name: type-check CSLib tower
    runs-on: ubuntu-24.04
    # Measured cold end-to-end at 158 s locally (see the table above), so 45 minutes is
    # not a guess about the build -- it is lean-proof.yml's 30 plus headroom for a hosted
    # runner's 4 cores, a cold apt payload, and the cslib compile, which has no CDN. A
    # timeout that trips here means something is wrong, not that the budget was tight.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The COMPRESSED mathlib olean cache, NOT `.lake`. See the size table above:
      # `.lake` is 7.4 GB and this is the 430 MB from which `lake exe cache get`
      # regenerates the 6.3 GB of oleans. Keyed on the three files that fix which Mathlib this is
      # (lean-toolchain, lakefile.toml, lake-manifest.json) so it busts exactly when the
      # pin moves. Family `cslib-mathlib` is distinct from lean-proof.yml's `lake`
      # family on purpose: different toolchain, different Mathlib, nothing shareable.
      - name: Cache mathlib olean archives (~/.cache/mathlib)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mathlib
          key: cslib-mathlib-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Core.Lean4.Cslib/lean-toolchain', 'src/Core.Lean4.Cslib/lakefile.toml', 'src/Core.Lean4.Cslib/lake-manifest.json') }}
          # A partial restore is still worth having: `lake exe cache get` fetches only
          # the archives that are missing, so an older entry turns a full download into
          # a delta. It can never substitute a wrong olean — each archive is addressed
          # by the content hash Mathlib itself computes.
          restore-keys: |
            cslib-mathlib-${{ runner.os }}-${{ runner.arch }}-

      # elan toolchain. Key expression copied VERBATIM from gate.yml / lean-proof.yml so
      # the three workflows share one namespace — `hygiene/audit-cache-key-namespace-parity.ts`
      # fails if two members of a family disagree, and a save whose key never matches a
      # restore is a cache that costs an upload every run and is never read.
      - name: Cache elan (Lean 4 toolchain)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Core.TypeScript/ace/setup-realizers/from-elan.ts', 'tools/setup/manifests/from-elan') }}

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # Same reason as every other ubuntu job: 561 MB of .deb against a mirror measured
        # at ~1.1 MB/s does not fit the installer's 420 s apt budget.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: full

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        env:
          # TIER DECLARED, not detected — `audit-install-tier-declared.ts` refuses silence.
          # `full` matches lean-proof.yml, which is the only other job that installs elan
          # and builds Mathlib, and is therefore the only evidence that exists about what
          # a Lean+Mathlib job needs. The payload has NOT been measured down for this lane
          # either; trimming it to `slim` is a real measurement somebody should take, and
          # taking it blind in the same PR that first turns this lane on would mean a red
          # run could not be attributed.
          ZETA_HOST_TIER: full
        run: ./tools/setup/install.sh

      - name: Fetch Mathlib pre-built oleans
        # This is the step that makes the "multi-GB, hours of Mathlib build" premise
        # false. It downloads pre-compiled .olean archives for the pinned Mathlib rev
        # (430 MB compressed -> 6.3 GB of oleans, 8564 files) instead of compiling
        # Mathlib. Measured at 102 s cold from a genuinely empty cache on a home
        # connection. `lake` resolves and fetches the dependency tree on the way.
        working-directory: src/Core.Lean4.Cslib
        run: lake exe cache get

      - name: Set up bun (for the audit steps)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Build the CSLib tower
        # `lake build` compiles cslib from source (2737 jobs; cslib has no CDN cache of
        # its own) and then CslibTower.lean on top of it.
        working-directory: src/Core.Lean4.Cslib
        run: lake build

      - name: Guard — the build produced artifacts, or this job proved nothing
        # A JOB THAT BUILDS NOTHING IS WORSE THAN NO JOB. `lake build` over an empty or
        # mis-declared library exits 0 having compiled nothing, and a green check over
        # zero work is the vacuity class in the place it costs most. Three assertions,
        # each naming a distinct way the lane could go hollow:
        #
        #   1. our own olean exists and is non-empty     — the declared lib really built
        #   2. cslib's FLP/Consensus olean exists        — the DEPENDENCY really built,
        #      not just our five-line file. This is the module the G1 Byzantine-fault
        #      lift extends, so it is the one whose absence would matter.
        #   3. cslib emitted a plausible NUMBER of oleans — a single stray file is not a
        #      library. The floor is deliberately well below the 156 measured on
        #      2026-09-11, so ordinary upstream churn does not trip it and a collapse does.
        working-directory: src/Core.Lean4.Cslib
        run: |
          set -euo pipefail
          own=.lake/build/lib/lean/CslibTower.olean
          dep=.lake/packages/cslib/.lake/build/lib/lean/Cslib/Computability/Distributed/FLP/Consensus.olean
          for f in "$own" "$dep"; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty — lake build reported success having produced no artifact"
              exit 1
            fi
          done
          n=$(find .lake/packages/cslib/.lake/build/lib/lean -name '*.olean' | wc -l | tr -d ' ')
          echo "cslib oleans built: $n (measured 156 on 2026-09-11); own lib: $(wc -c < "$own") bytes"
          if [ "$n" -lt 100 ]; then
            echo "::error::only $n cslib oleans — the dependency did not really build"
            exit 1
          fi

      - name: Guard — the tower reaches cslib's FLP/Consensus, sorry-free
        # WHY A POSITIVE ASSERTION AND NOT ONLY `--deny sorryAx`. Every audit that decides
        # by the ABSENCE of a string passes when the subject fails to resolve: a renamed or
        # moved declaration prints no axiom line, the denied pattern is absent, and the step
        # grades green having checked nothing. lean-proof.yml was bitten by exactly this
        # (13 FinDataProcessing names silently resolved to nothing) and carries an
        # anti-vacuity pass for it. So this step REQUIRES the axiom line to appear.
        #
        # The two names are the G1 targets: `Consensus.fault_mono` and the zero-fault
        # algorithm's `consensus_zero` are what the Byzantine-fault extension lifts. If the
        # cslib pin ever moves under us and they rename, this lane says so by name instead
        # of going quietly green.
        #
        # CslibTower.lean names the same two under `#check`, so `lake build` above already
        # fails on a dropped import or a renamed declaration — for anyone building by hand,
        # not only in CI. This step is the half that build cannot do: `#check` says a name
        # RESOLVES, and says nothing about whether its proof still stands. Only the axiom
        # set does that.
        #
        # Run through run-checked.ts, NEVER a pipeline: a pipeline's exit status is the LAST
        # command's, so a `lean` that dies on SIGSEGV (139) prints nothing, grep finds
        # nothing, and the check passes having proved nothing.
        working-directory: src/Core.Lean4.Cslib
        run: |
          set -euo pipefail
          printf 'import Cslib\n#print axioms Cslib.FLP.Consensus.fault_mono\n#print axioms Cslib.FLP.ZeroFaultAlg.consensus_zero\n' \
            > /tmp/cslib_flp_axiom_audit.lean
          bun ../Core.TypeScript/hygiene/run-checked.ts \
            --label "cslib FLP axiom audit" \
            --deny 'sorryAx' --deny 'Unknown constant' \
            --require 'Cslib.FLP.Consensus.fault_mono' \
            --require 'Cslib.FLP.ZeroFaultAlg.consensus_zero' \
            --message "the CSLib tower's FLP/Consensus anchors depend on sorryAx, or did not resolve at our pinned cslib rev (e0573fbc) — the G1 Byzantine-fault lift's foundation moved or regressed" \
            -- lake env lean /tmp/cslib_flp_axiom_audit.lean
          echo "CSLib tower stands: FLP/Consensus anchors resolve and are sorry-free at the pinned rev."
