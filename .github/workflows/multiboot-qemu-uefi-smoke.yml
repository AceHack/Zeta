# Optional QEMU UEFI menu-boot smoke — USB-IDENTITY-THREAT-MODEL §8.2.
#
# Assembles a tiny FAT multiboot image with a real grub-mkimage EFI and
# boots it under OVMF. Looks for ZETA-MULTIBOOT-UEFI-MENU on serial.
# Separate workflow (THE FLIP): not on gate (required). Path-filtered.
#
# SECURITY: only SHA-pinned checkout; no attacker-controlled PR
# title/body/branch text is interpolated into any `run:` block
# (docs/security/GITHUB-ACTIONS-SAFE-PATTERNS.md).

name: multiboot-qemu-uefi-smoke

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/Core.TypeScript/installer/multiboot/**"
      - ".github/workflows/multiboot-qemu-uefi-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/Core.TypeScript/installer/multiboot/**"
      - ".github/workflows/multiboot-qemu-uefi-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  uefi-menu-smoke:
    name: multiboot QEMU UEFI menu smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3

      - name: Install QEMU + OVMF + grub-mkimage + mtools
        run: sudo apt-get update -y && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils mtools ovmf grub-efi-amd64-bin

      - name: Run UEFI menu smoke
        env:
          MULTIBOOT_UEFI_SMOKE_REQUIRED: "1"
        run: bun src/Core.TypeScript/installer/multiboot/qemu-uefi-menu-smoke.ts
