name: memory-reference-existence-lint

# Every `](foo.md)` link target in memory/MEMORY.md MUST
# resolve to an actual file under memory/. Amara's 4th-ferry
# (PR #221 absorb) Determinize-stage item: prevent the
# retrieval-drift class where prose cites paths that don't
# exist.
#
# Third leg of memory-index hygiene:
#   1. PR #220 — every memory/*.md change updates MEMORY.md
#   2. AceHack #12 — MEMORY.md has no duplicate link targets
#   3. THIS workflow — every MEMORY.md link target resolves
#      to a real file
#
# Safe-pattern compliance (per FACTORY-HYGIENE row #43):
#   - SHA-pinned actions/checkout
#   - Explicit minimum permissions
#   - No user-authored context; purely repo-file reads
#   - Concurrency group + pinned runs-on
#
# See:
#   - src/Core.TypeScript/hygiene/audit-memory-references.ts (the tool)
#   - docs/aurora/2026-04-23-amara-memory-drift-alignment-
#     claude-to-memories-drift.md (Amara ferry)

on:
  pull_request:
    paths:
      - "memory/**"
      - "src/Core.TypeScript/hygiene/audit-memory-references.ts"
      - ".github/workflows/memory-reference-existence-lint.yml"
  push:
    branches: [main]
    paths:
      - "memory/**"
      - "src/Core.TypeScript/hygiene/audit-memory-references.ts"
      - ".github/workflows/memory-reference-existence-lint.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: memory-reference-existence-lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: lint memory/MEMORY.md reference-existence
    # Timeout basis: observed med 2.7m / max 5.9m (n=40); uncached install.sh headroom.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: slim

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        # Provides bun via mise's pin in .mise.toml. Same pattern as
        # gate.yml + memory-index-duplicate-lint.yml (#1377).
        env:
          # TIER DECLARED, not detected (081M0K36K69087G0R003BYSCF8 applied beyond gate.yml).
          # Every payload step in this job is bun/git/gh only -- it touches no agda, ghc,
          # emscripten, llvm, pandoc, r-base, podman, qemu or opam. On a hosted ubuntu runner
          # the undeclared path is not adaptation: 16 GB always detects `full`, i.e. the whole
          # 388-package / 713.0 MiB apt manifest. slim is 149 packages / 139.7 MiB.
          # This is a RELIABILITY fix before it is a cost one: the mirror stalls land on the
          # biggest archives (pandoc 26.9 MB, r-base-core 27.1 MB), so fetch fewer and fewer
          # runs die at exit 124 inside the 420s apt budget.
          ZETA_HOST_TIER: slim
          # mise release-metadata calls authenticate (1000/hr) instead of anonymous (60/hr 403 flake)
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      - name: run reference-existence lint
        shell: bash
        run: |
          set -euo pipefail
          bun src/Core.TypeScript/hygiene/audit-memory-references.ts --enforce
