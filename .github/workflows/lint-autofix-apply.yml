# .github/workflows/lint-autofix-apply.yml
#
# Mechanical lint auto-HEAL — REPORT half. Triggered by the read-only producer
# (lint-autofix.yml) completing; downloads the heal PATCH it emitted and renders
# it into the job summary for the PR author to apply locally.
#
# This job holds NO write privilege and performs NO checkout. That is the
# pwn-request defense in its strongest form: there is no privileged token in the
# job and no PR-controlled content on disk to act on. The artifact is the trust
# boundary and it carries data (a diff) that is only ever DISPLAYED, never
# applied and never executed.
# See docs/DECISIONS/2026-06-01-secure-github-actions-autofix-privilege-separation-two-job-split.md
#
# INVARIANT for future editors: never add a checkout, a build/test/install step,
# or `contents: write` to this job. Any one of them re-creates the pwn-request
# surface this split exists to remove.
#
# WHY THE PUSH PATH IS GONE (081M22QV1X0087G0R002XDFBPF, 2026-09-09). This job
# used to hold `contents: write`, check out `workflow_run.head_sha`, apply the
# patch and push — but ONLY when `head_branch == 'main'` ("heal the trunk,
# never someone else's branch"). That branch was unreachable by construction:
# the producer triggers on `pull_request` ONLY, this job additionally gates on
# `workflow_run.event == 'pull_request'`, and a pull_request's `head_branch` is
# the PR's source branch — which cannot be `main` in the same repository, and a
# fork's `main` is excluded by the same-repo gate below. So every run took the
# report path, while the job still requested write privilege and checked out
# PR-controlled content with a persisted credential (`persist-credentials`
# defaults to true; the producer sets it false, this job never did).
# Scorecard `DangerousWorkflowID` (critical, alert 560) named the checkout.
# Removing the dead push path removes the checkout, the credential and the
# write scope together. Trunk healing, if wanted, needs a `push:` trigger on
# the producer — a different design, not a resurrection of this branch.

name: lint-autofix-apply

on:
  workflow_run:
    workflows: [lint-autofix]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: lint-autofix-apply-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  apply-patch:
    name: mechanical lint auto-heal (apply patch)
    # Only on a successful same-repo pull_request produce-run. Same-repo gate
    # mirrors the producer; conclusion==success means a patch may exist.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # Timeout basis: no checkout and no install remain; the artifact download is
    # the only network step. 10m is generous against the observed 0.6m median.
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read-only: nothing is pushed (see WHY THE PUSH PATH IS GONE)
      actions: read # the artifact is read from the producer run via the Actions API (Copilot P0, #6393)
    steps:
      - name: Download the heal patch from the producer run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRODUCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/autofix"
          # The producer uploads the artifact ONLY when there were fixes. No
          # artifact means nothing to heal, so exit clean.
          if ! gh run download "$PRODUCE_RUN_ID" -n lint-autofix-patch -D "${RUNNER_TEMP}/autofix" 2>/dev/null; then
            echo "No heal patch artifact — nothing to report."
            echo "report=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "report=true" >> "$GITHUB_ENV"

      - name: Report the heal patch in the job summary
        if: env.report == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          patch="${RUNNER_TEMP}/autofix/autofix.patch"
          if [ ! -s "$patch" ]; then
            echo "Patch artifact empty — nothing to report."
            exit 0
          fi
          # Not silence: the finding is surfaced, it just does not seize the branch.
          #
          # Pushing to a PR branch starts a loop that blocks the PR it was trying to
          # help: the bot push is a `synchronize` event, which re-triggers the PR
          # workflows with `triggering_actor = github-actions[bot]`, and GitHub parks
          # bot-triggered runs as `action_required`. With a required status check that
          # run never reports, so the PR sits BLOCKED until a human approves a workflow
          # by hand. Observed on PR #10346: gate passed at 16:08, the heal pushed at
          # 16:13, and the PR was stuck behind an unapproved run from that moment on.
          # Every markdown-touching PR would do this.
          #
          # It is also a rewrite of the author branch that nobody asked for. On a PR
          # the honest output is a REPORT the author can apply.
          #
          # The patch is PR-CONTROLLED CONTENT, so it is HTML-escaped into a <pre>
          # block rather than fenced: a diff containing a fence marker would
          # otherwise break out of the fence and inject markdown into the summary.
          # The ampersand is substituted first so later entities are not
          # double-escaped.
          summary="${GITHUB_STEP_SUMMARY}"
          echo "### Markdown heal available (not pushed)" >> "$summary"
          echo "" >> "$summary"
          echo "This heal is REPORTED rather than pushed — a bot push here would" >> "$summary"
          echo "re-trigger the PR workflows as action_required and block the PR." >> "$summary"
          echo "" >> "$summary"
          echo "Apply locally with the certified markdown healer:" >> "$summary"
          echo "" >> "$summary"
          echo "    bun src/Core.TypeScript/hygiene/healers/md-fixer-certified.ts FILES" >> "$summary"
          echo "" >> "$summary"
          echo "Diff that would have been applied:" >> "$summary"
          echo "" >> "$summary"
          echo "<pre>" >> "$summary"
          head -200 "$patch" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' >> "$summary"
          echo "</pre>" >> "$summary"
          # Static notice text: HEAD_BRANCH is PR-controlled and a workflow
          # command must not interpolate untrusted data.
          echo "::notice title=Markdown heal available::Reported in the job summary; not pushed."
          echo "Reported heal for branch: ${HEAD_BRANCH}"
