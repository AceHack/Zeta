# Vocabulary hygiene — enforce uniqueness + keep the single-file index cache fresh.
# Date-agnostic vocab folders (grams/letters/shapes/colors/temperatures/travelers/words).
# Non-gating, paths-scoped + dispatch; SHA-pinned; ubuntu-24.04; concurrency-grouped.
name: vocab hygiene

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/grams/**'
      - 'docs/letters/**'
      - 'docs/shapes/**'
      - 'docs/colors/**'
      - 'docs/temperatures/**'
      - 'docs/travelers/**'
      - 'docs/VOCAB-INDEX.md'
      - 'tools/hygiene/vocab-uniqueness.ts'
      - 'tools/hygiene/build-vocab-index.ts'

concurrency:
  group: vocab-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: uniqueness + index freshness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: vocab uniqueness (one canonical home; symlinks resolve)
        run: bun tools/hygiene/vocab-uniqueness.ts
      - name: vocab index is fresh (the regenerated single-file cache)
        run: bun tools/hygiene/build-vocab-index.ts --check
