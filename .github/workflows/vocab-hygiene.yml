# Vocabulary (CoreDORA) hygiene — uniqueness + DAG + grams measure-view + master index + reified F#.
# Top-level /vocab (travelers own the repo, not CS conventions). Canonical = type homes (words/letters/
# shapes/colors/temperatures/personas); grams/ + travelers/ = symlink views (the DAG edges).
name: vocab hygiene

on:
  workflow_dispatch:
  push:
    paths:
      - 'vocab/**'

concurrency:
  group: vocab-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: CoreDORA — uniqueness + DAG + views + master index + F#
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: uniqueness + DAG (one canonical home; symlinks resolve into canonical; no cycles)
        run: bun vocab/gen/Uniqueness.ts
      - name: grams measure-view is fresh
        run: bun vocab/gen/GramsView.ts --check
      - name: master index is fresh (the single-file cache)
        run: bun vocab/gen/MasterIndex.ts --check
      - name: reified F# vocab is fresh (the math-team-facing types)
        run: bun vocab/gen/Reify.ts --check
      - name: framework loads the master index (the DST-load test)
        run: bun test vocab/gen/MasterIndex.test.ts
