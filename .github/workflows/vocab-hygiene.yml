# Vocabulary (CoreDORA) hygiene — uniqueness + grams measure-view freshness + master index
# freshness + the master-index load test. Canonical = type homes (words/letters/shapes/colors/
# temperatures/personas); grams/ = generated measure-view. Non-gating, paths-scoped + dispatch.
name: vocab hygiene

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/words/**'
      - 'docs/letters/**'
      - 'docs/shapes/**'
      - 'docs/colors/**'
      - 'docs/temperatures/**'
      - 'docs/personas/**'
      - 'docs/grams/**'
      - 'docs/travelers/**'
      - 'docs/VOCAB-INDEX.md'
      - 'tools/hygiene/*.ts'

concurrency:
  group: vocab-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: CoreDORA — uniqueness + views + master index
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: uniqueness (one canonical home; symlinks resolve; discriminator)
        run: bun tools/hygiene/vocab-uniqueness.ts
      - name: grams measure-view is fresh
        run: bun tools/hygiene/build-grams-view.ts --check
      - name: master index is fresh (the single-file cache)
        run: bun tools/hygiene/build-vocab-index.ts --check
      - name: framework loads the master index (the DST-load test)
        run: bun test tools/hygiene/vocab-master-index.test.ts
