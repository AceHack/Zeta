# .github/workflows/zflash-qemu-test.yml
#
# B-0891 — zflash QEMU test-harness CI floor.
#
# This first workflow slice validates the fail-closed planning surface for
# the 5-scenario zflash QEMU matrix without requiring QEMU or nested KVM.
# Runtime QEMU execution remains opt-in from the CLI until the stateful
# scenarios are fully wired and cheap enough for PR-time CI.

name: zflash-qemu-test

on:
  schedule:
    # Weekly Sundays 15:17 UTC — off-the-hour weekend cadence. This keeps
    # the B-0891 dry-run floor watching runner-image/Bun/dependency drift
    # without paying for default-on QEMU execution.
    - cron: "17 15 * * 0"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'tools/zflash/test-harness/**'
      - 'tools/ci/qemu-boot-test.ts'
      - 'tools/ci/qemu-full-install-test.ts'
      - 'tools/ci/audit-installer-iso-content.ts'
      - 'full-ai-cluster/tools/zflash.ts'
      - 'full-ai-cluster/tools/zflash-lib.ts'
      - 'docs/backlog/P1/B-0891-zflash-done-acceptance-criteria-qemu-test-harness-5-scenarios-initial-format-cluster-up-reformat-with-retention-reformat-from-scratch-cluster-joining-aaron-2026-05-28.md'
      - '.github/workflows/zflash-qemu-test.yml'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - 'tools/zflash/test-harness/**'
      - 'tools/ci/qemu-boot-test.ts'
      - 'tools/ci/qemu-full-install-test.ts'
      - 'tools/ci/audit-installer-iso-content.ts'
      - 'full-ai-cluster/tools/zflash.ts'
      - 'full-ai-cluster/tools/zflash-lib.ts'
      - 'docs/backlog/P1/B-0891-zflash-done-acceptance-criteria-qemu-test-harness-5-scenarios-initial-format-cluster-up-reformat-with-retention-reformat-from-scratch-cluster-joining-aaron-2026-05-28.md'
      - '.github/workflows/zflash-qemu-test.yml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    name: zflash-qemu-harness-dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3

      - name: Install bun dependencies
        run: bun install --frozen-lockfile

      - name: Test zflash QEMU harness invariants
        run: bun test tools/zflash/test-harness/

      - name: Validate zflash QEMU dry-run plan
        run: bun tools/zflash/test-harness/run.ts --dry-run

      - name: Validate state-retention runtime fails closed by default
        run: |
          set +e
          bun tools/zflash/test-harness/run.ts --scenario reformat-with-retention zflash-qemu-retention-placeholder.iso > retention-runtime.json
          exit_code="$?"
          set -e
          cat retention-runtime.json
          if [ "$exit_code" -ne 1 ]; then
            echo "::error::expected retention runtime to exit 1 without ZFLASH_QEMU_RETENTION_EXECUTE=1; got $exit_code"
            exit 1
          fi
          if ! grep -Fq "fails closed" retention-runtime.json; then
            echo "::error::retention runtime output did not document the fail-closed opt-in guard"
            exit 1
          fi
