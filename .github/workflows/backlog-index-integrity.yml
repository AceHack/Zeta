name: backlog-index-integrity

# Transition guard for the frozen legacy backlog substrate. Current work-items
# are ZetaId files under `workitems/`; this workflow only prevents accidental
# resurrection or drift in `docs/backlog/**` and `docs/BACKLOG.md`.
#
# Phase 1c per the BACKLOG-per-row-file ADR
# (docs/DECISIONS/2026-04-22-backlog-per-row-file-restructure.md
# §"Existing substrate Phase 1a prior work" → Phase 1c OWED).
# This workflow IS the lint-index gate; it wraps
# `generate-index.ts --check` rather than introducing a separate
# `src/Core.TypeScript/backlog/lint-index.sh` wrapper, since there is no
# pre-commit-hook framework currently wired up in this repo —
# the CI surface is the equivalent enforcement point.
#
# Note: until Phase 2 bulk-migration runs, `docs/BACKLOG.md` is
# still the monolithic authoritative file. Phase 2 will overwrite
# it with the generated index. This workflow becomes load-bearing
# at that point. Until then it primarily guards the per-row
# files themselves are well-formed (081KPYCJH0008QG0R003MDS51N example, 081KQ0YZ80008QG0R002T6TM7Z
# Otto-287 Noether) and skips the equivalence check.
#
# Safe-pattern compliance (mirrors memory-index-integrity.yml):
#   - SHA-pinned action versions (actions/checkout@de0fac2...)
#   - Explicit `permissions:` minimum
#   - Only first-party trusted context (github.sha) — no
#     user-authored text is referenced.
#   - Concurrency group + cancel-in-progress: false.
#   - runs-on: ubuntu-24.04 pinned.

on:
  pull_request:
    paths:
      - "docs/backlog/**"
      - "docs/BACKLOG.md"
      - "src/Core.TypeScript/backlog/**"
  push:
    branches: [main]
    paths:
      - "docs/backlog/**"
      - "docs/BACKLOG.md"
      - "src/Core.TypeScript/backlog/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backlog-index-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check frozen legacy backlog drift
    # Timeout basis: healthy med 2.7m / p90 4.7m (n=39); uncached install.sh, so one apt stall-and-recover fits.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        env:
          # mise release-metadata calls authenticate (1000/hr) instead of anonymous (60/hr 403 flake)
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup/install.sh

      # Recurrence guard for the chronic drift (2026-06-06): fail FAST on any per-row
      # file that's missing frontmatter or required id/status/title, or whose id
      # disagrees with its filename — the exact gaps that made generate-index emit
      # empty rows / lose descriptions. Only the index-poisoning checks (0 + 5); the
      # advisory style checks (1-4) are not gated here.
      - name: frontmatter schema lint (index-poisoning guard)
        run: bun src/Core.TypeScript/backlog/lint-frontmatter.ts --schema-only

      # 081KSXN940008QG0R002FWR9B2 cutover guard: docs/backlog/ is FROZEN to the grandfathered B-NNNN rows. New work-items
      # must be minted as conflict-free ZetaIds (src/Core.TypeScript/backlog/new-workitem.ts → workitems/), not added
      # as new consensus-allocated B-NNNN files. Fails on any B-NNNN id outside frozen-bnnnn-ids.json.
      - name: no-new-B-NNNN cutover guard (mint ZetaIds instead)
        run: bun src/Core.TypeScript/backlog/lint-no-new-bnnnn.ts

      # Falsifiability harness for the gate below. Its predecessor BANNED the
      # mention of a hyphenated legacy id, which made it vacuous: with no ref
      # allowed in tree, no STALE ref could exist, so it had no subject left to
      # catch. The replacement permits the reference and checks that it
      # resolves — a strictly larger claim, so these tests pin all of it: that
      # it fires on a ref pointing at nothing, that it passes a ref pointing at
      # something real, that alias-map presence alone is NOT resolution, and
      # that a legacy id in row frontmatter is still refused. They run BEFORE
      # the gate so a scope regression reports as a scope regression rather
      # than as a suspiciously green lint.
      - name: lint-b-refs-resolve falsifiability + boundary tests
        run: bun test src/Core.TypeScript/backlog/lint-b-refs-resolve.test.ts

      - name: legacy B-NNNN refs must resolve (naming is fine; dangling is not)
        run: bun src/Core.TypeScript/backlog/lint-b-refs-resolve.ts

      - name: verify per-row + index parity
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f docs/BACKLOG.md ]; then
            echo "ERROR: docs/BACKLOG.md is missing." >&2
            exit 1
          fi

          if ! head -5 docs/BACKLOG.md | grep -q "AUTO-GENERATED by src/Core.TypeScript/backlog/generate-index\|AUTO-GENERATED by tools/backlog/generate-index"; then
            echo "Phase pre-2 mode: verifying per-row files only." >&2
            bun src/Core.TypeScript/backlog/generate-index.ts --stdout > /dev/null
            echo "per-row files parseable + generator runs cleanly" >&2
            exit 0
          fi

          bun src/Core.TypeScript/backlog/generate-index.ts --check
