name: mux-swarm-tick

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:         # manual trigger

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mux-swarm-tick
  cancel-in-progress: false

jobs:
  swarm-tick:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Ollama (Free local LLM tier)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          # Pull the small, fast Qwen model that fits in runner RAM
          ollama pull qwen2.5:0.5b
          ollama list

      - name: Run Mux-Duplex Swarm Tick (4 Roles)
        env:
          ZETA_SWARM_USE_LOCAL_LLM: "1"
        run: |
          # Executes the Cartographer, Pilot, Recursive Composer, and Chronologist simultaneously.
          bun src/Core.TypeScript/swarm/swarm-controller.ts
