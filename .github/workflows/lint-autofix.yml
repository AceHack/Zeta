# .github/workflows/lint-autofix.yml
#
# Mechanical lint auto-HEAL — PRODUCE half (read-only). Runs the deterministic
# --fix tools on a PR and emits the resulting diff as an ARTIFACT. It does NOT
# commit/push — it has `contents: read` and no privilege to abuse, so executing
# the PR's own code (install.sh / bun install lifecycle scripts) here is harmless.
# The privileged half that applies the patch is a SEPARATE workflow
# (lint-autofix-apply.yml, on: workflow_run) which never executes PR code.
#
# This two-job privilege separation is the pwn-request defense — see the ADR
# docs/DECISIONS/2026-06-01-secure-github-actions-autofix-privilege-separation-two-job-split.md
# (the principle: no single job holds BOTH privilege AND untrusted execution; the
# artifact is the trust boundary — this job emits DATA, the apply job consumes DATA).
#
# Mechanical only (no intelligence): the repo's safe MD032/MD026 fixer
# (`src/Core.TypeScript/hygiene/fix-markdown-md032-md026.ts`). Full
# `markdownlint-cli2 --fix` is intentionally NOT used — MD018 turns line-leading
# `#4 (item ref)` into an ATX heading, and MD037 mangles math/star prose
# (`ρ* and` → `ρ*and`). Those rules stay as gate *checks*; only blank-line and
# heading-punctuation heals are applied. prettier --write remains deferred.

name: lint-autofix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.md'
      - '.github/workflows/lint-autofix.yml'
      - '.github/workflows/lint-autofix-apply.yml'

permissions:
  contents: read

concurrency:
  group: lint-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  produce-patch:
    name: mechanical lint auto-heal (produce patch)
    # Same-repo PRs only (forks get read-only + no secrets anyway; this keeps the
    # produce/apply pair scoped to trusted-fleet branches). Skip our own heal
    # commits (loop guard).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    # Timeout basis: healthy med 4.6m; uncached install.sh, so one apt stall-and-recover fits.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the immutable PR head commit (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Immutable head SHA, not the moving branch ref — the patch is produced
          # against the exact commit the apply job checks out (determinism / TOCTOU
          # fix, Copilot P1 #6393).
          ref: ${{ github.event.pull_request.head.sha }}
          # Do NOT persist the git token: this job runs PR code (install.sh / bun
          # lifecycle scripts), so it must expose no credential to that code
          # (CodeQL "checkout of untrusted code in trusted context", #6393). It is
          # read-only and produces only a patch artifact — it never needs to push.
          persist-credentials: false

      - name: Restore apt archives (root fix for the exit-124 install-step class)
        # 561 MB of .deb per ubuntu job against a mirror measured at ~1.1 MB/s is
        # ~510s of download inside a 420s budget, which is why this step's install
        # died at exit 124 under six different job names. This restores the archives
        # and exports ZETA_APT_ARCHIVES_DIR, so the install below is unchanged.
        # docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
        uses: ./.github/actions/apt-archive-cache
        with:
          tier: slim

      - name: Install toolchain via three-way-parity script (GOVERNANCE §24)
        # Same install path + retry as gate.yml so the heal uses the SAME
        # mise-pinned markdownlint-cli2 / bun the gate uses (version parity).
        # Pass only mise's read-only GitHub release-metadata token, matching
        # memory-index-* lints. The privileged apply workflow remains separate
        # and still executes no PR-controlled code.
        env:
          # TIER DECLARED, not detected (081M0K36K69087G0R003BYSCF8 applied beyond gate.yml).
          # Every payload step in this job is bun/git/gh only -- it touches no agda, ghc,
          # emscripten, llvm, pandoc, r-base, podman, qemu or opam. On a hosted ubuntu runner
          # the undeclared path is not adaptation: 16 GB always detects `full`, i.e. the whole
          # 388-package / 713.0 MiB apt manifest. slim is 149 packages / 139.7 MiB.
          # This is a RELIABILITY fix before it is a cost one: the mirror stalls land on the
          # biggest archives (pandoc 26.9 MB, r-base-core 27.1 MB), so fetch fewer and fewer
          # runs die at exit 124 inside the 420s apt budget.
          ZETA_HOST_TIER: slim
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if ./tools/setup/install.sh; then break; fi
            [ "$attempt" = "5" ] && { echo "install.sh failed after 5 attempts"; exit 1; }
            case "$attempt" in
              1) backoff=10 ;;
              2) backoff=30 ;;
              3) backoff=60 ;;
              4) backoff=120 ;;
            esac
            echo "install.sh attempt $attempt failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
          done

      - name: Safe mechanical markdown heal (MD032/MD026 only)
        # Full `markdownlint-cli2 --fix` is UNSAFE here (MD018/MD037 false fixes).
        # Heal only blank-lines-around-lists + heading trailing-punctuation via the
        # idempotent repo fixer — through the CERTIFIED entry point
        # (081KX3KA3F0 write-access gate): the runner re-certifies the healer
        # against the three harness laws (idempotence, closure-as-subset,
        # convergence) over the 2026-07-08 incident corpus on every run, and
        # refuses to write anything (exit 2) if certification fails. The first
        # certification run caught a live closure violation in this very fixer
        # (wrapped code-span split) — the gate is not ceremonial.
        # Gate still enforces the full rule set on check.
        run: |
          set -euo pipefail
          # SCOPE FIRST. `git ls-files '*.md'` is every tracked markdown file in the repo, and the
          # healer used to receive it whole — including paths `.markdownlint-cli2.jsonc` explicitly
          # excludes. On 2026-08-13 that rewrote 414 preserved PR-review archives with an MD032 fix,
          # the exact rule the config names as violating their verbatim contract. The ignore list
          # existed and was simply never consulted on the path that could write.
          mapfile -t files < <(git ls-files '*.md' | bun src/Core.TypeScript/hygiene/healers/md-heal-scope.ts)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No markdown files tracked."
            exit 0
          fi
          bun src/Core.TypeScript/hygiene/healers/md-fixer-certified.ts "${files[@]}"

      # prettier --write (TS/JSON auto-format) is DEFERRED to a follow-up: it is
      # not a required gate, and doing it correctly needs a deliberate pass on
      # scope + a .prettierignore + running from the repo ROOT (package.json /
      # bun.lock live at the root, NOT src/Core.TypeScript — Copilot review of
      # #6393, 2026-06-01). Safe MD032/MD026 heal ships here; prettier joins once
      # its scoping is designed.

      - name: Compute heal patch
        id: patch
        run: |
          set -euo pipefail
          git diff > autofix.patch
          if [ -s autofix.patch ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
            echo "Heal patch produced ($(wc -l < autofix.patch) lines)."
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            echo "No mechanical lint fixes needed — already clean."
          fi

      - name: Upload heal patch (data handed to the privileged apply job)
        if: steps.patch.outputs.has_patch == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-autofix-patch
          path: autofix.patch
          retention-days: 1
          if-no-files-found: error
