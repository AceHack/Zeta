name: ruleset-apply

# The WRITE half of ruleset-as-code reconciliation.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM github-settings-drift.yml
# -------------------------------------------------------------
# The plan (read-only) half rides the existing drift workflow, which is
# `pull_request`-triggered. This job holds a credential that can edit
# repository administration, and a workflow reachable from a pull request must
# never hold that. Splitting the triggers is the only reliable way to keep the
# write credential off any code path an untrusted PR can reach — so the two
# halves live apart on purpose, not by oversight.
#
# TRIGGERS: push to `main` touching the desired state, plus manual dispatch.
# Never `pull_request`, never `pull_request_target`, never `issue_comment`.
#
# THE HUMAN CONTROL IS PR REVIEW, NOT A UI CLICK
# ----------------------------------------------
# This is the point of the whole design: converging live rulesets requires no
# human to click anything in the GitHub settings UI. What a human does is
# review a diff to a JSON file. By the time this workflow runs, the change has
# already been reviewed, versioned, and merged — and a widening change has
# additionally been approved by a committed, content-hashed approval file.
#
# WHAT THIS WORKFLOW CANNOT DO
# ----------------------------
# It cannot create or delete a ruleset (the reconciler has no such code path),
# and it cannot touch a ruleset absent from `manifest.json`'s allowlist. It
# CAN, with a compromised token, do anything `administration: write` permits —
# the in-tree file constrains the RECONCILER, not the TOKEN. See
# docs/operations/RULESET-RECONCILIATION.md §"The privilege question".

on:
  push:
    branches: [main]
    paths:
      - "docs/operations/rulesets/**"
      - "src/Core.TypeScript/hygiene/reconcile-rulesets.ts"
      - "src/Core.TypeScript/hygiene/ruleset-model.ts"
  workflow_dispatch: {}

# GITHUB_TOKEN gets nothing beyond reading the tree. The administration
# credential arrives as a separate secret, never as a token permission —
# `administration` is not a GITHUB_TOKEN scope at all.
permissions:
  contents: read

concurrency:
  group: ruleset-apply
  cancel-in-progress: false

jobs:
  apply:
    name: apply ruleset desired state
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: refuse to run without an admin credential
        env:
          HAS_TOKEN: ${{ secrets.RULESET_ADMIN_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::RULESET_ADMIN_TOKEN is not configured — refusing to run."
            echo "A reconciler that silently no-ops without its credential is a check that did not run."
            echo "See docs/operations/RULESET-RECONCILIATION.md for the one-time bootstrap."
            exit 1
          fi

      # Plan first, and print it, so the applied diff is in the run log
      # regardless of what happens next. Exit 1 here just means "work to do".
      - name: plan
        env:
          GH_TOKEN: ${{ secrets.RULESET_ADMIN_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          bun src/Core.TypeScript/hygiene/reconcile-rulesets.ts --repo "$GH_REPO"
          rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::plan failed or refused (exit $rc) — not applying"
            exit "$rc"
          fi
          exit 0

      - name: apply and verify
        env:
          GH_TOKEN: ${{ secrets.RULESET_ADMIN_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bun src/Core.TypeScript/hygiene/reconcile-rulesets.ts \
            --repo "$GH_REPO" --apply --rollback-out "$RUNNER_TEMP/ruleset-rollback"

      # The rollback snapshots are the pre-apply live state. They are the
      # difference between a reversible change and a one-way door, so they are
      # retained even when the apply succeeded.
      - name: upload rollback snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ruleset-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/ruleset-rollback
          if-no-files-found: ignore
          retention-days: 90
