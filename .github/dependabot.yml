version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps:"
    # Group related NuGet updates into a single PR. Rationale:
    # ungrouped per-package PRs add noise to the drain queue when
    # several packages bump in the same week — every System.* /
    # Microsoft.* package bump on a .NET monthly servicing roll
    # would otherwise open as its own PR within hours of the
    # others, multiplying CI runs and human review for what is
    # effectively a single coordinated change. Grouping cuts the
    # queue depth and lets a single CI run validate the cluster.
    # Major bumps still open as individual PRs so they get
    # scrutiny.
    groups:
      # System.* / Microsoft.* runtime libraries usually bump together
      # on .NET servicing rolls (e.g., 10.0.6 to 10.0.7 across
      # System.Numerics.Tensors / System.IO.Hashing / etc.).
      # `Microsoft.NET.Test.Sdk` ships on the same monthly .NET
      # servicing cadence (its 18.x track follows .NET 10), so it
      # belongs in the runtime rollup — bundling avoids two PRs that
      # would land within hours of each other.
      # `Microsoft.Z3` is the Microsoft Research SMT solver — its
      # release cadence is independent of .NET (its 4.x track ships on
      # solver-team timelines), so we exclude it; it falls through to
      # the catch-all `nuget-minor-patch` group.
      dotnet-runtime:
        patterns:
          - "System.*"
          - "Microsoft.*"
        exclude-patterns:
          - "Microsoft.Z3"
        update-types:
          - "patch"
          - "minor"
      # F# / xUnit / FsCheck / analyzer ecosystem.
      fsharp-and-tooling:
        patterns:
          - "FSharp.*"
          - "FsCheck*"
          - "xunit*"
          - "Meziantou.*"
          - "Mono.*"
        update-types:
          - "patch"
          - "minor"
      # Catch-all minor/patch group for anything else; majors still
      # open as individual PRs.
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

    # Microsoft.CodeAnalysis.* is NOT an ordinary dependency: it is coupled to
    # the SDK pinned in `.mise.toml` (restated in global.json). A generator built
    # against a Roslyn newer than the SDK's cannot be LOADED -- CS9057 -- so the
    # bump does not fail at runtime, it fails the build outright.
    #
    # Measured 2026-08-22 on PR #13590: the SDK's Roslyn was 5.6.0 and the
    # group proposed Microsoft.CodeAnalysis.CSharp and .Analyzers at 5.9.0.
    # `Guard -- CodeAnalysis pins <= SDK Roslyn` refused it on every platform,
    # taking nine unrelated and perfectly good bumps down with it, because the
    # group lands as one PR.
    #
    # RESOLVED 2026-08-25 -- and read this before concluding the entry is spent.
    # The SDK moved 10.0.303 -> 10.0.400, a FEATURE-band roll, and its bundled
    # Roslyn moved with it: 5.6.0-2.26377.103 -> 5.9.0-1.26379.115 (measured off
    # `<sdk>/Roslyn/bincore/csc.dll`, not inferred). The pins are now 5.9.0 --
    # the very version #13590 proposed. So the bot was proposing the RIGHT
    # version at the WRONG time, which is exactly the failure this entry exists
    # to catch: it could see the package feed and could not see the SDK.
    #
    # THE ENTRY THEREFORE STAYS, and its rationale is now stronger rather than
    # spent. "LIFTS WHEN the SDK's Roslyn >= the pin you want" was never a
    # one-shot condition to be discharged and deleted -- it recurs at every
    # feature band. The next Roslyn minor (5.10 / 6.x) will reach the feed
    # before the SDK that can load it reaches this repo, and the bot will
    # propose it with the same confidence and the same wrongness. What the
    # 2026-08-25 roll demonstrated is the intended lifecycle completing once:
    # bot notifies, guard refuses the half-fix, human carries SDK + pins in ONE
    # commit. Deleting the entry now would remove the refusal and keep only the
    # notification.
    #
    # Patches inside the SDK's Roslyn line stay allowed -- those are the safe
    # half and there is no reason to hand-carry them.
    #
    # HOW TO LIFT IT FOR A SPECIFIC BUMP: move the SDK in `.mise.toml` first,
    # measure the new csc version, and raise these pins in the SAME commit. The
    # two can then never disagree -- which is precisely what this ignore stops a
    # bot from doing on its own schedule.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # FsCheck.Xunit.v3's own version number understates what it requires.
      # Measured 2026-08-22 from the published nuspecs:
      #
      #   3.3.4 (held) -> xunit.v3.extensibility.core  3.0.1
      #   3.4.0        -> xunit.v3.extensibility.core  [4.0.0, 5.0.0)
      #
      # We pin xunit.v3 at 3.2.2, so a MINOR bump of FsCheck.Xunit.v3 demands a
      # MAJOR migration of xunit v3 -> v4. Dependabot grades it minor because its
      # own version is minor; the transitive requirement is not, and NU1608 fires
      # as an error under Warning-As-Error -- taking eight unrelated bumps in the
      # same group down with it (PR #13653, red on every platform).
      #
      # Adopting xunit v4 is a test-framework migration across every test project,
      # not a dependency chore.
      #
      # LIFTS WHEN: xunit.v3 is deliberately moved to the 4.x line. That bump and
      # this one belong in the same change, so the constraint can never be half
      # satisfied -- which is exactly what a bot on a weekly schedule cannot know.
      #
      # CORRECTION 2026-08-22: this was first written as `FsCheck.Xunit.v3`
      # alone and it did NOT work. #13676 landed at 11:52:06Z; Dependabot opened
      # #13696 at 12:13:18Z -- 21 minutes later, with the ignore live -- still
      # carrying FsCheck.Xunit.v3 3.4.0.
      #
      # The ignore was on the wrong end of the coupling. FsCheck.Xunit.v3 3.4.0
      # requires `FsCheck [3.4.0]` EXACTLY, so the two move as a locked pair:
      # #13696 bumps FsCheck 3.3.4 -> 3.4.0, and FsCheck.Xunit.v3 cannot stay
      # behind. Ignoring the follower cannot stop the leader dragging it.
      # Hence the family pattern.
      - dependency-name: "FsCheck*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps:"
    # Group third-party action SHA-pins into a single PR per week
    # rather than one PR per action. Same rationale as the nuget
    # group above — minor/patch action bumps are coordinated
    # often enough that bundling them cuts queue depth without
    # losing review signal.
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # ---------------------------------------------------------------------------
  # ECOSYSTEM COVERAGE, added 2026-08-23 (workitem 081M0Q9Y686087G0R000QK0H1R).
  #
  # Until this commit Dependabot pointed at TWO ecosystems, `nuget` and
  # `github-actions`, and the toolchain-currency audit
  # (docs/research/2026-08-23-toolchain-currency-audit-and-tech-radar-ring-drift.md)
  # found the shape of the consequence: §2.5 checked every NuGet pin against
  # api.nuget.org and they were ALL at latest, while §2.4 found `typescript` a
  # whole MAJOR behind, `z3-solver` a major behind, and two crypto packages two
  # minors behind. Where the bot was pointed, nothing drifted. Where it was not,
  # everything did. That is as clean a control as this repo has produced, and it
  # says the mechanism works and was simply not aimed.
  #
  # `directory:` (singular) is kept on the two pre-existing entries so their
  # history and grouping are untouched; the new entries use `directories:`
  # (plural, glob-capable) because the alternative is 36 near-identical cargo
  # blocks that drift from each other.
  # ---------------------------------------------------------------------------

  # bun — the four directories that actually carry a `bun.lock`. Every CI lane
  # installs with `bun install --frozen-lockfile`, so `bun.lock` is the
  # authoritative lockfile and the `bun` ecosystem (not `npm`) is the one that
  # maintains it.
  #
  # Known, pre-existing, NOT fixed here: the repo ROOT carries THREE lockfiles
  # for one manifest — `bun.lock`, `bun.lockb` and `package-lock.json`. Only
  # `bun.lock` is read by CI; the other two are vestigial and will now visibly
  # fall behind. That is a real inconsistency and it is better seen than hidden,
  # but resolving it is a separate change with its own verification.
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/full-ai-cluster/platform-controller"
      - "/full-ai-cluster/portal"
      - "/full-ai-cluster/portal/web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps:"
    groups:
      bun-minor-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # typescript 6.0.3 -> 7.0.2 is a MAJOR and it is not a dependency chore:
      # every `bun test`, every `tsc` invocation in `lint (TS)`, and the four-
      # oracle TypeScript byte-lock all run through it. It is held here so the
      # minor/patch group can flow WITHOUT dragging a compiler major behind it —
      # which is the same failure the FsCheck entry below records.
      #
      # LIFTS WHEN: the TS 7 migration is done as its own change, with the
      # byte-lock vectors re-verified. Tracked: 081M0QJYR80087G0R000F2YVF5.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # npm — the package.json directories whose lockfile is npm's or pnpm's, plus
  # the ones that carry no lockfile at all (the `npm` ecosystem reads a bare
  # manifest; the `bun` ecosystem is documented against `bun.lock`, so pointing
  # it at a lockless directory would be a declaration that quietly does nothing).
  - package-ecosystem: "npm"
    directories:
      - "/agentic-organization"
      - "/demo/identity-dla-site"
      - "/genesis/_src"
      - "/src/Core.TypeScript/*"
      - "/src/Renderers/website"
      - "/src/apps/twitch-ai"
      - "/tools/setup/persona-keys"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps:"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # cargo — 36 independent crates under src/Core.Rust.*, each with its own
  # Cargo.toml and Cargo.lock. One glob rather than 36 blocks.
  #
  # NOTE ON SCOPE, because it is the thing most likely to be misread: this
  # updates CRATE DEPENDENCIES. It does not, and cannot, touch the rust
  # COMPILER pin — that lives in `.mise.toml`, which is not a manifest of any
  # ecosystem Dependabot supports. See the note at the bottom of this file.
  - package-ecosystem: "cargo"
    directories:
      - "/src/Core.Rust.*"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps:"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # gomod — three modules.
  #
  # `/src/wasm-dla/bytelock` is BYTE-LOCK COUPLED and is the one to read twice:
  # `bytelock.yml` BUILDS the Go substrate in CI rather than committing it (the
  # `.claude/rules/no-binary-in-proof-lineage.md` preference), then compares its
  # trajectory against `testdata/golden-seed-*.json`. So a dependency bump that
  # changes the emitted wasm turns that lane RED — loudly, pre-merge, on the PR
  # that caused it. It is deliberately NOT ignored: the coupling here already
  # has a working falsifier, and adding an `ignore:` would trade a loud failure
  # for a silent stale pin. Contrast the zig substrate, whose module is
  # COMMITTED and therefore does not move when its compiler pin does — that one
  # needs a check, and now has one (see the bottom note).
  - package-ecosystem: "gomod"
    directories:
      - "/src/Core.Go"
      - "/src/wasm-dla/bytelock"
      - "/full-ai-cluster/k8s/applications/hat-system/operator"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps:"
    groups:
      gomod-minor-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # uv — `src/Core.Python/` uses uv with a committed `uv.lock`, so the correct
  # ecosystem is `uv` and NOT `pip`: the pip ecosystem would edit
  # `pyproject.toml` and leave `uv.lock` behind it, and `uv sync --frozen`
  # would then refuse the tree. (GA for version updates 2025-03, for security
  # updates 2025-12.)
  - package-ecosystem: "uv"
    directory: "/src/Core.Python"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps:"
    groups:
      uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # dotnet-sdk — watches `global.json`.
  #
  # This entry exists because the claim "global.json is not a package manifest,
  # so no bot can watch it" is FALSE, and acting on it is what let a 10-CVE
  # security roll sit unnoticed for twelve days. `dotnet-sdk` is a documented
  # Dependabot ecosystem (>= .NET Core 3.1) and `global.json` is exactly what it
  # reads. The claim was checked before it was written down here.
  #
  # READ THIS BEFORE "FIXING" ITS PR: a Dependabot PR from this entry will be
  # RED, by construction, and that is the design rather than a defect. As of
  # 2026-08-23 `.mise.toml` is the SINGLE DECLARED SOURCE of the SDK version and
  # `global.json` is a restatement held equal by
  # `src/Core.TypeScript/hygiene/audit-dotnet-pin-parity.ts`. Dependabot can
  # edit `global.json` and cannot edit `.mise.toml`, so its PR will move one
  # half of a two-file fact and the parity check will say so by name.
  #
  # That is worth more than silence: the bot supplies the NOTIFICATION and the
  # exact version, a human or agent supplies the coupled one-line edit, and the
  # check refuses to let the half-fix merge. The alternative on offer was
  # nothing watching at all, which is how this bump was found by hand.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps:"

  # ---------------------------------------------------------------------------
  # WHAT NO DEPENDABOT ENTRY CAN COVER — and why there is no `ignore:` for it.
  #
  # The brief for this change asked for `ignore:` entries guarding two
  # semver-invisible couplings: rust <-> the `1.87.0-*` rustup cache globs, and
  # zig <-> the byte-locked `.wasm` under `src/wasm-dla/bytelock/`. They are not
  # here, and the reason is that they could not do anything.
  #
  # An `ignore:` suppresses an update DEPENDABOT WOULD OTHERWISE PROPOSE. Both
  # of those pins live in `.mise.toml`, which is not a manifest of any supported
  # ecosystem — there is no `mise` ecosystem, and while SchemaStore lists a
  # `rust-toolchain` ecosystem it reads `rust-toolchain.toml`, a file this repo
  # does not have. So Dependabot proposes nothing for either, and an `ignore:`
  # naming them would suppress nothing: a guard that cannot fire, sitting where
  # a reader would take it for protection. That is the vacuity class this repo
  # lints for elsewhere, and writing one here to satisfy the request would have
  # been the request satisfied and the coupling still unguarded.
  #
  # The guard is therefore a CHECK, where it can actually fail:
  # `src/Core.TypeScript/hygiene/audit-mise-toolchain-couplings.ts`, on the
  # `cross-verify` floor. It derives every restatement of the rust and zig pins
  # from `.mise.toml` itself and reddens when they disagree — including
  # `.mise.full.toml`, which independently pins rust and which the audit's
  # two-file description of this coupling did not mention.
  #
  # The other uncoverable pins — `src/Core.Lean4/lean-toolchain`, and the mise
  # tool versions generally — have no ecosystem either. The answer for those is
  # a scheduled currency report that prints the delta, not a bot that does not
  # exist; tracked in 081M0Q9Y686087G0R000QK0H1R.
  # ---------------------------------------------------------------------------
