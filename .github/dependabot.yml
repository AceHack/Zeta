version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps:"
    # Group related NuGet updates into a single PR. Rationale:
    # ungrouped per-package PRs add noise to the drain queue when
    # several packages bump in the same week — every System.* /
    # Microsoft.* package bump on a .NET monthly servicing roll
    # would otherwise open as its own PR within hours of the
    # others, multiplying CI runs and human review for what is
    # effectively a single coordinated change. Grouping cuts the
    # queue depth and lets a single CI run validate the cluster.
    # Major bumps still open as individual PRs so they get
    # scrutiny.
    groups:
      # System.* / Microsoft.* runtime libraries usually bump together
      # on .NET servicing rolls (e.g., 10.0.6 to 10.0.7 across
      # System.Numerics.Tensors / System.IO.Hashing / etc.).
      # `Microsoft.NET.Test.Sdk` ships on the same monthly .NET
      # servicing cadence (its 18.x track follows .NET 10), so it
      # belongs in the runtime rollup — bundling avoids two PRs that
      # would land within hours of each other.
      # `Microsoft.Z3` is the Microsoft Research SMT solver — its
      # release cadence is independent of .NET (its 4.x track ships on
      # solver-team timelines), so we exclude it; it falls through to
      # the catch-all `nuget-minor-patch` group.
      dotnet-runtime:
        patterns:
          - "System.*"
          - "Microsoft.*"
        exclude-patterns:
          - "Microsoft.Z3"
        update-types:
          - "patch"
          - "minor"
      # F# / xUnit / FsCheck / analyzer ecosystem.
      fsharp-and-tooling:
        patterns:
          - "FSharp.*"
          - "FsCheck*"
          - "xunit*"
          - "Meziantou.*"
          - "Mono.*"
        update-types:
          - "patch"
          - "minor"
      # Catch-all minor/patch group for anything else; majors still
      # open as individual PRs.
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

    # Microsoft.CodeAnalysis.* is NOT an ordinary dependency: it is coupled to
    # the SDK pinned in global.json. A generator built against a Roslyn newer
    # than the SDK's cannot be LOADED -- CS9057 -- so the bump does not fail at
    # runtime, it fails the build outright.
    #
    # Measured 2026-08-22 on PR #13590: the SDK's Roslyn was 5.6.0 and the
    # group proposed Microsoft.CodeAnalysis.CSharp and .Analyzers at 5.9.0.
    # `Guard -- CodeAnalysis pins <= SDK Roslyn` refused it on every platform,
    # taking nine unrelated and perfectly good bumps down with it, because the
    # group lands as one PR.
    #
    # Patches inside the SDK's Roslyn line stay allowed -- those are the safe
    # half and there is no reason to hand-carry them.
    #
    # LIFTS WHEN: global.json's SDK moves to a Roslyn line >= the pin you want.
    # That bump is deliberate and belongs with the SDK change in one commit, so
    # the two can never disagree -- which is precisely what this ignore stops a
    # bot from doing on its own schedule.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # FsCheck.Xunit.v3's own version number understates what it requires.
      # Measured 2026-08-22 from the published nuspecs:
      #
      #   3.3.4 (held) -> xunit.v3.extensibility.core  3.0.1
      #   3.4.0        -> xunit.v3.extensibility.core  [4.0.0, 5.0.0)
      #
      # We pin xunit.v3 at 3.2.2, so a MINOR bump of FsCheck.Xunit.v3 demands a
      # MAJOR migration of xunit v3 -> v4. Dependabot grades it minor because its
      # own version is minor; the transitive requirement is not, and NU1608 fires
      # as an error under Warning-As-Error -- taking eight unrelated bumps in the
      # same group down with it (PR #13653, red on every platform).
      #
      # Adopting xunit v4 is a test-framework migration across every test project,
      # not a dependency chore.
      #
      # LIFTS WHEN: xunit.v3 is deliberately moved to the 4.x line. That bump and
      # this one belong in the same change, so the constraint can never be half
      # satisfied -- which is exactly what a bot on a weekly schedule cannot know.
      #
      # CORRECTION 2026-08-22: this was first written as `FsCheck.Xunit.v3`
      # alone and it did NOT work. #13676 landed at 11:52:06Z; Dependabot opened
      # #13696 at 12:13:18Z -- 21 minutes later, with the ignore live -- still
      # carrying FsCheck.Xunit.v3 3.4.0.
      #
      # The ignore was on the wrong end of the coupling. FsCheck.Xunit.v3 3.4.0
      # requires `FsCheck [3.4.0]` EXACTLY, so the two move as a locked pair:
      # #13696 bumps FsCheck 3.3.4 -> 3.4.0, and FsCheck.Xunit.v3 cannot stay
      # behind. Ignoring the follower cannot stop the leader dragging it.
      # Hence the family pattern.
      - dependency-name: "FsCheck*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps:"
    # Group third-party action SHA-pins into a single PR per week
    # rather than one PR per action. Same rationale as the nuget
    # group above — minor/patch action bumps are coordinated
    # often enough that bundling them cuts queue depth without
    # losing review signal.
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
