name: apt archive cache
description: >-
  Restore (and, in a post step, save) apt's `.deb` archive directory so a job's
  toolchain install reuses bytes already fetched instead of re-downloading them
  from the Ubuntu mirror. Linux-only; a no-op everywhere else.

# WHY THIS EXISTS
# ---------------
# `tools/setup/install.sh` fetched 561 MB of `.deb` on EVERY ubuntu job. On
# 2026-08-25 the archive mirror delivered ~1.1 MB/s against the ~14 MB/s the
# installer's 420s apt budget was sized from, so 17 jobs across four workflows
# died at exit 124 inside the install step — six different red job names, one
# infrastructure fault. Neither more retry (three attempts already share ONE
# deadline) nor a bigger budget (the tightest fitting job has 18s of margin)
# can fix a download that does not fit. Removing the download can.
#
# Derivation, measurements, key design and the size arithmetic:
#   docs/research/2026-08-26-caching-var-cache-apt-archives-is-the-root-fix-for-the-apt-wall-budget-class.md
# Predecessor (the diagnosis this acts on):
#   docs/research/2026-08-25-one-apt-wall-budget-failure-wearing-six-job-names-and-why-more-retry-cannot-fix-it.md
#
# SAFETY — measured, and one half of it came out other than expected
# ------------------------------------------------------------------
# STALE VERSIONS CANNOT BE SUBSTITUTED. `apt-get update` still runs on every
# install, so resolution always comes from a freshly fetched index; apt then
# asks the archive directory for ONE exact filename per package,
# `<name>_<version>_<arch>.deb`. A superseded `.deb` is not preferred over the
# current one — it is never asked for. Measured on ubuntu:24.04: a planted
# `jq_0.0.1-1_*.deb` and a wrong-arch file were both left untouched while the
# resolved version installed from cache at `Need to get 0 B`.
#
# APT DOES NOT RE-HASH THE CACHE. This is the part worth reading twice, because
# the obvious assumption is wrong: a file already in the archive directory is
# accepted on FILENAME AND SIZE. Truncate one and apt re-downloads it (measured).
# Corrupt one in place at the same length and apt does not notice — it hands the
# file to dpkg, whose decompressor checksum refuses it ("zstd error: Restored
# data doesn't match checksum", rc=100). The property is therefore "a poisoned
# cache cannot install silently", not "apt validates the cache", and that
# distinction decides what the containment has to do.
#
# THE CONTAINMENT IS GITHUB'S SCOPING. A cache entry is scoped to the branch
# that wrote it; the default branch's entries are readable from other branches,
# never the reverse. So a pull request cannot write bytes that `main` — or any
# other pull request — will read. What a pull request can poison is its own
# later runs, on a runner that is already executing that pull request's code.
#
# Transcripts for all of the above: §3 of the research doc.

inputs:
  tier:
    description: >-
      The ZETA_HOST_TIER this job's install step declares. It is part of the
      cache key because the tier decides the package set: `slim` resolves 149
      packages / 139.7 MiB, `full` resolves 388 / 713.0 MiB. Passing a tier
      that disagrees with the install step would key a `slim` payload under a
      `full` name and hand the next full-tier job a half-empty cache — never
      incorrect, just useless, and silently so. That disagreement is what
      `src/Core.TypeScript/ci/apt-archive-cache.test.ts` refuses.
    required: true
  enabled:
    description: >-
      Set to "false" to skip restore and save entirely. For install-shield
      lanes whose SUBJECT is a cold `install.sh` run — warming their cache
      would replace the thing under test with a constant.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # The key is DERIVED from the host and the resolved inputs, never written
    # by hand into 44 workflow files. Components, and why each is in:
    #
    #   distro+codename  `.deb`s are per-suite. A noble archive must never be
    #                    offered to a jammy job (`libicu74` vs `libicu70`).
    #   dpkg arch        amd64 and arm64 archives are different files.
    #   tier             decides the package set (see the input above).
    #   manifest hash    `manifests/apt` is the package list and
    #                    `common/host-tier.sh` is the filter that turns it into
    #                    the resolved set; either changing means a different
    #                    set, so the key must change with them.
    #   ISO week         the ROTATION. A cache entry is immutable once written,
    #                    so a fully deterministic key would freeze the archive
    #                    at whatever versions existed the first time and slowly
    #                    decay as Ubuntu published updates. Rotating weekly,
    #                    with `restore-keys` falling back to the previous
    #                    entry, gives the rolling shape: restore last week's,
    #                    fetch only what changed, save the union.
    - id: key
      if: inputs.enabled == 'true' && runner.os == 'Linux'
      shell: bash
      # `inputs.tier` reaches the script through the ENVIRONMENT, never through
      # `${{ }}` spliced into the script body. Nothing here is
      # attacker-controlled today, but a `run:` block that interpolates an
      # input is the template-injection SHAPE, and the shape is what a reviewer
      # and a scanner have to re-adjudicate every time they meet it.
      env:
        ZETA_TIER_INPUT: ${{ inputs.tier }}
      run: |
        set -euo pipefail
        case "${ZETA_TIER_INPUT}" in
          slim|standard|full) : ;;
          *)
            echo "error: tier must be slim|standard|full (got '${ZETA_TIER_INPUT}')" >&2
            exit 1
            ;;
        esac
        dir="${HOME}/.cache/zeta/apt-archives"
        mkdir -p "$dir"

        suite="unknown"
        if [ -r /etc/os-release ]; then
          # shellcheck disable=SC1091
          . /etc/os-release
          suite="${ID:-unknown}-${VERSION_CODENAME:-${VERSION_ID:-unknown}}"
        fi
        arch="$(dpkg --print-architecture 2>/dev/null || uname -m)"

        # sha256 over the two files that decide the resolved package set.
        # Truncated to 16 hex chars: the key is a cache NAMESPACE, not an
        # integrity check. Nothing about whether a `.deb` may be used is
        # decided here — see the header for what actually decides that.
        manifest_hash="$(cat tools/setup/manifests/apt tools/setup/common/host-tier.sh \
                          | sha256sum | cut -c1-16)"

        # THE TIER IS NORMALISED DOWN TO THE ONE THAT CHANGES THE ANSWER.
        #
        # The resolved set for tier T is every manifest entry of rank <= T. So
        # two tiers resolve the SAME set whenever no entry sits between them —
        # and today none does: `manifests/apt` carries 22 untagged (slim) and
        # 13 `tier=standard` entries and NOT ONE `tier=full`, so `full` and
        # `standard` are the same 388 packages. Keying on the requested tier
        # would store that identical ~561 MB payload twice, under two names,
        # against a 10 GB repo-wide budget that is already contended.
        #
        # So: walk down from the requested rank to the highest rank actually
        # PRESENT in the manifest. Derived from the manifest, never asserted —
        # the day someone adds a `tier=full` entry, the two keys separate again
        # on their own (and the manifest hash above moves in the same commit,
        # so no stale entry is inherited across the change).
        want_rank=0
        case "${ZETA_TIER_INPUT}" in standard) want_rank=1 ;; full) want_rank=2 ;; esac
        eff_rank="$(awk -v want="$want_rank" '
          { sub(/#.*$/, ""); gsub(/^[ \t]+|[ \t]+$/, "") }
          NF == 0 { next }
          { r = 0
            for (i = 1; i <= NF; i++) {
              if ($i == "tier=standard") r = 1
              else if ($i == "tier=full") r = 2
            }
            if (r <= want && r > max) max = r }
          END { print max + 0 }
        ' tools/setup/manifests/apt)"
        case "$eff_rank" in 2) eff_tier=full ;; 1) eff_tier=standard ;; *) eff_tier=slim ;; esac
        if [ "$eff_tier" != "${ZETA_TIER_INPUT}" ]; then
          echo "↻ cache tier ${ZETA_TIER_INPUT} → ${eff_tier}: manifests/apt has no entry" \
               "between them, so both tiers resolve the same package set."
        fi

        # ISO-8601 week-based year + week, so the boundary is a Monday and
        # never straddles a year end the way %Y%V does.
        epoch="$(date -u +%G-w%V)"

        prefix="apt-archives-v1-${suite}-${arch}-${eff_tier}"
        {
          echo "dir=$dir"
          echo "key=${prefix}-${manifest_hash}-${epoch}"
          echo "restore-prefix-exact=${prefix}-${manifest_hash}-"
          echo "restore-prefix-any=${prefix}-"
        } >> "$GITHUB_OUTPUT"

        # install.sh reads this and passes it to apt as Dir::Cache::archives.
        # Exported to the JOB, so the ordinary `run: ./tools/setup/install.sh`
        # step needs no edit of its own.
        echo "ZETA_APT_ARCHIVES_DIR=$dir" >> "$GITHUB_ENV"

    # `actions/cache` (not restore+save) because the save has to happen AFTER
    # the install step, and its post step is the only hook a composite action
    # has at that point. Consequence, stated rather than discovered: the post
    # step does not save when the job fails, so a run that dies mid-fetch does
    # not seed the cache. Successful runs seed it, which is enough — the class
    # this addresses is jobs failing BECAUSE the cache is cold, and one green
    # run per (suite, arch, tier, package set, week) ends that for all of them.
    - name: apt archive cache
      if: inputs.enabled == 'true' && runner.os == 'Linux'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
        # Ladder, most specific first. The second rung is deliberate: a change
        # to `manifests/apt` must not cold-start the whole fleet, and the
        # `.deb`s for the packages that did NOT change are still exactly the
        # files apt will ask for.
        restore-keys: |
          ${{ steps.key.outputs.restore-prefix-exact }}
          ${{ steps.key.outputs.restore-prefix-any }}
