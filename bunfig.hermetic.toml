# bunfig.hermetic.toml — the HERMETIC TIER of the TypeScript suite.
#
# WHERE THE WORD COMES FROM, AND HOW MUCH OF IT WE ACTUALLY CLAIM.
#
# "Hermetic" is BORROWED, not coined here, and the borrowing was never written down — this
# paragraph is the anchor `.claude/rules/anchor-to-human-prior-art.md` asks for.
#
# In software it is Google's term of art, from Blaze and then Bazel, and it is now standard
# across that family (Buck, Pants; the Nix world uses it more or less interchangeably with
# "pure"). Bazel's definition: a build is hermetic when it is INSENSITIVE TO THE STATE OF THE
# MACHINE — same inputs, same outputs, nothing ambient able to influence the result. The point
# was never speed. It was that a failure should MEAN something: if a build can go red because
# of your laptop, a red build has stopped being information. That is exactly the argument the
# measurement below makes, arrived at independently and then given its proper name.
#
# The older sense is the metaphor the software one keeps. A HERMETIC SEAL is an airtight one,
# named for Hermes Trismegistus — the Greek Hermes fused with the Egyptian Thoth, patron
# figure of alchemy — because alchemists were credited with fusing a glass vessel shut so that
# nothing could get in or out. A hermetic build is that vessel: sealed against its environment.
#
# AND THE CAVEAT, because the name promises more than this file delivers. Bazel's hermeticity
# is STRONGER than ours: it sandboxes each action, hash-pins every input, and can cut network
# access per action. Ours is hermetic in the INPUTS sense only — a declared baseline of
# `./tools/setup/install.sh` + `bun install --frozen-lockfile`, plus pinned Bun and pinned SMT
# binaries in CI. The tests are NOT individually sandboxed and nothing here stops one reaching
# the network if it wants to. So: sealed against the host's CONFIGURATION, not against
# everything. Read the name as the stronger guarantee and you will trust this tier with
# properties it does not have.
#
# WHAT THIS FILE BUYS. `bun --config=bunfig.hermetic.toml test` is red when the checked-out
# source or its declared toolchain baseline is broken. Not if you have never run `uv sync`.
# Not if you have no .NET SDK. Not if macOS refuses your process access to ~/Downloads. The
# failure-attribution boundary is the whole point: a red hermetic check is actionable without
# first provisioning an external service, device, or user-owned file.
#
# WHY IT WAS NEEDED. MEASURED 2026-08-16 over the 53 most recent completed `gate` runs:
# `test (TS suite)` was red in 17 (32%), and in 15 of those the entire cause was ONE
# deterministic test — a real regression that rode along for sixteen merges. MEASURED the
# same day on a fresh clone of main (macOS, `bun install` only): the same `bun test` gave
# 4 failures + 1 unhandled error, and not one of them was a code defect. So the same command
# was red-for-environment where people work and red-for-source/toolchain where it mattered, with
# nothing in either output telling them apart. The prior "this suite is always red" is
# learned on the laptop and spent on the pull request.
#
# WHERE THE LINE IS DRAWN, EXACTLY. For a developer, hermetic means reproducible from a fresh
# checkout plus
#
#     ./tools/setup/install.sh   &&   bun install --frozen-lockfile
#
# and nothing else. CI realizes the narrower inputs this suite actually consumes directly in
# `.github/workflows/gate.yml`: ubuntu-24.04, pinned Bun, the frozen lockfile, and pinned SMT
# binaries. It deliberately stopped running the full workstation installer in PR #13836 after
# that bootstrap repeatedly exhausted the job budget before any assertion ran. `install.sh`
# remains the repo's supported developer baseline (GOVERNANCE §24), while the workflow is the
# CI baseline. Anything a test needs BEYOND those baselines — a `uv sync` venv, a cluster, a
# container, an attached device, a file in the user's home directory — makes that test's
# verdict a fact about the host, and belongs in the tier named for that.
#
# LIMIT: "hermetic" here names failure attribution, not an immutable runner image or
# bit-reproducible build. GitHub can revise the software preinstalled on `ubuntu-24.04`; if
# that changes a verdict, the failure is declared-toolchain drift and must be reported as such.
#
# THE LINE WAS MEASURED, NOT ASSUMED. 2026-08-16, same fresh clone, `bun test` run twice:
#   - with the machine's ordinary PATH (an install.sh-shaped environment):  5 failures,
#     confined to the 2 files excluded below.
#   - with PATH stripped to /usr/bin:/bin:/usr/sbin:/sbin plus bun (NO install.sh toolchain
#     at all):                                                            49 failures,
#     spread across git-, python3-, go-, rustc-, dotnet- and solver-dependent suites.
# The second number is the cost of drawing the line below install.sh instead of at it: it
# would move roughly a dozen more files out of the blocking-eligible tier, including the
# cross-language law and Clifford byte-lock suites, and buy a property nobody needs — this
# repo does not support a checkout without install.sh. Recorded here rather than left as an
# unstated judgement call, because a future reader will otherwise re-litigate it from scratch.
#
# WHY A SECOND CONFIG RATHER THAN FILTERS IN THE WORKFLOW. `bun test` positional arguments
# are INCLUDE filters; bun has no exclude form. `pathIgnorePatterns` is the one place this
# repo writes down "bun must not discover this", and it already carries a discipline: every
# entry declared with a written reason in a registry, enforced by a checker that fails on an
# undeclared, unreasoned, or stale entry. This is that mechanism at one more tier.
#
# HOW THE TWO CONFIGS RELATE — enforced, not conventional:
#
#     ignores(bunfig.hermetic.toml)  ==  ignores(bunfig.toml)  ∪  registry paths
#
# by src/Core.TypeScript/hygiene/environment-dependent-test-files.ts, which is red on a
# dropped base pattern, an undeclared addition, an addition whose entry names no dependency,
# and — the load-bearing one — an addition that no pull_request-lane `bun test` executes.
# Excluding a file from the hermetic tier while nothing else runs it is not a tier split, it
# is a deletion wearing a split's face. THE DUPLICATION BELOW IS DELIBERATE AND GUARDED: the
# two lists are compared as sets on every PR, so they cannot drift apart in silence, and a
# generated config would trade a checked duplication for an unchecked generator.
#
# THE SETTINGS BELOW ARE COPIED VERBATIM FROM bunfig.toml. Read the reasoning there — in
# particular why there is NO `[test] timeout` key (bun 1.3.14 does not implement it; the
# effective per-test cap is 5000 ms and a slow-by-nature test carries its own explicit
# timeout at the call site). Guarded by hygiene/bunfig-declares-no-test-timeout.test.ts.

[install]
auto = "disable"
exact = true
saveTextLockfile = true

[test]
coverageSkipTestFiles = true
pathIgnorePatterns = [
  # ── Identical to bunfig.toml. Set equality is asserted on every PR. ──────────────
  "**/BenchmarkDotNet.Artifacts/**",
  "**/TestResults/**",
  "**/artifacts/**",
  "**/node_modules/**",
  "src/Core.TypeScript/service/persona-health.test.ts",
  "src/Core.TypeScript/shadow/shadow-observer.test.ts",
  "src/Core.TypeScript/backlog/empty-queue-pickup.test.ts",
  "src/Core.TypeScript/health/factory-health-monitor.test.ts",
  "tools/setup/persona-keys/frost-share-adapter.hardware.test.ts",
  "**/docs/recovered-orphan-branches-2026-05/**",
  "**/references/prior-art/**",
  "**/bin/**",
  "**/obj/**",
  "**/.lake/**",
  "**/.git/**",
  "tools/lean4/.lake/**",
  "tools/alloy/**",
  "tools/tla/**",
  # PLAYWRIGHT SPECS ARE A DIFFERENT RUNNER, NOT A DIFFERENT TIER.
  # `uat/` holds acceptance specs driven by `playwright/test` against a live server, and
  # `bun test` collects `*.spec.ts` as readily as `*.test.ts` -- so adding one Playwright file
  # silently enrolled it in the bun suite. It failed exactly as it was built to:
  # "APP_DIR is not set: acceptance has no service to run against, WHICH IS NOT A PASS",
  # thrown at module load, which bun counts as the run's `1 error`.
  #
  # The refusal is correct and stays. What was wrong is that bun collected it at all.
  #
  # This goes in BOTH configs on purpose. The hermetic-only list below is for tests that a
  # DIFFERENT bun lane still runs, and `environment-dependent-test-files.ts` is red on an
  # entry "that no pull_request-lane `bun test` executes" -- excluding a file from one tier
  # while nothing else runs it is "a deletion wearing a split's face". No bun lane should ever
  # run a Playwright spec, so this is a wrong-runner exclusion rather than a tier split, and
  # set equality between the two configs is preserved with no registry entry.
  "uat/**",

  # ── HERMETIC-TIER ONLY. Each runs in `test (TS environment-dependent)` and is
  #    declared, with the NAME of the dependency it needs, in
  #    registry/environment-dependent-test-files.json. ──────────────────────────────
  "tests/cross-verification/_harness/cross-verify-ir.test.ts",
  "src/Core.TypeScript/zflash/esp-inject.test.ts",
  "src/Core.TypeScript/research/signed-probit-ep-cross-verify.test.ts",
  "src/Core.TypeScript/research/lexical-geometric-receipt-cross-verify.test.ts",
]
coveragePathIgnorePatterns = [
  "**/BenchmarkDotNet.Artifacts/**",
  "**/TestResults/**",
  "**/artifacts/**",
  "**/node_modules/**",
  "**/docs/recovered-orphan-branches-2026-05/**",
  "**/references/prior-art/**",
  "**/bin/**",
  "**/obj/**",
  "**/.lake/**",
  "**/.git/**",
  "tools/lean4/.lake/**",
  "tools/alloy/**",
  "tools/tla/**",
]
