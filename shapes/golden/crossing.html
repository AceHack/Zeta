<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>shape-crossing</title>
  <style>
    :root {
      --c0: #000000;
      --c1: #d62828;
      --c2: #2a9d2a;
      --c3: #d6c828;
      --c4: #2828d6;
      --c5: #d628d6;
      --c6: #28c8d6;
      --c7: #f0f0f0;
    }
    body { background: #101418; margin: 0; display: grid; place-items: center; min-height: 100vh; }
    svg { width: min(96vw, 960px); image-rendering: pixelated; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes appear { to { opacity: 1; } }
    polyline:hover { stroke-width: 7; filter: brightness(1.6); }
    @media (prefers-reduced-motion: reduce) { polyline { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; } }
    #strand-0 { stroke-dasharray: 360; stroke-dashoffset: 360; animation: draw 600ms linear 0ms forwards; }
    #strand-1 { stroke-dasharray: 144; stroke-dashoffset: 144; animation: draw 600ms linear 180ms forwards; }
    #strand-1-r1 { stroke-dasharray: 144; stroke-dashoffset: 144; animation: draw 600ms linear 360ms forwards; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" data-cartridge="shape-crossing">
  <polyline id="strand-0" fill="none" stroke="#d62828" stroke-width="4" points="245,65 405,265" />
  <polyline id="strand-1" fill="none" stroke="#2828d6" stroke-width="4" points="405,65 341,145" />
  <polyline id="strand-1-r1" fill="none" stroke="#2828d6" stroke-width="4" points="309,185 245,265" />
</svg>
</body>
</html>
