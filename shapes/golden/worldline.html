<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>shape-worldline</title>
  <style>
    :root {
      --c0: #000000;
      --c1: #d62828;
      --c2: #2a9d2a;
      --c3: #d6c828;
      --c4: #2828d6;
      --c5: #d628d6;
      --c6: #28c8d6;
      --c7: #f0f0f0;
    }
    body { background: #101418; margin: 0; display: grid; place-items: center; min-height: 100vh; }
    svg { width: min(96vw, 960px); image-rendering: pixelated; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes appear { to { opacity: 1; } }
    polyline:hover { stroke-width: 7; filter: brightness(1.6); }
    @media (prefers-reduced-motion: reduce) { polyline { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; } }
    #path { stroke-dasharray: 540; stroke-dashoffset: 540; animation: draw 600ms linear 0ms forwards; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" data-cartridge="shape-worldline">
  <polyline id="path" fill="none" stroke="#2a9d2a" stroke-width="4" points="85,305 95,295 105,285 115,275 125,265 135,255 145,245 155,235 165,225 175,215 185,205 195,195 205,185 215,175 225,165 235,155 245,145 255,135 265,125 275,115 285,105 295,95 305,85 315,75 325,65 335,55 345,45 355,35" />
</svg>
</body>
</html>
