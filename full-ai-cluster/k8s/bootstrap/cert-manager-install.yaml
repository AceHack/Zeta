# cert-manager bootstrap install. K3S HelmChart CR — runs at first
# boot AFTER Cilium, BEFORE Vault. Vault needs TLS certs for its
# API; cert-manager provides them.

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart: cert-manager
  repo: https://charts.jetstack.io
  version: v1.16.2
  targetNamespace: cert-manager
  createNamespace: true
  valuesContent: |-
    crds:
      enabled: true
    replicaCount: 1
    webhook: { replicaCount: 1 }
    cainjector: { replicaCount: 1 }
    prometheus:
      enabled: true
      servicemonitor: { enabled: false }
