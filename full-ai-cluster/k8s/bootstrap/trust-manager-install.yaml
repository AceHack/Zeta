# Trust Manager bootstrap install. K3S HelmChart CR — runs AFTER
# cert-manager + Vault. Distributes CA bundles to every namespace.

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: trust-manager
  namespace: kube-system
spec:
  chart: trust-manager
  repo: https://charts.jetstack.io
  version: v0.15.0
  targetNamespace: cert-manager   # trust-manager lives in cert-manager ns
  createNamespace: false   # cert-manager-install.yaml already created it
  valuesContent: |-
    crds: { enabled: true }
    replicaCount: 1
    defaultPackage: { enabled: false }
    app:
      trust:
        # MUST MATCH k8s/applications/trust-manager/Application.yaml, which
        # carries the full reasoning: trust-manager v0.15.0 resolves Bundle
        # sources from exactly one namespace and creates its Secrets-reading
        # Role only there, and ziti-controller's Bundle sources a Secret minted
        # into `openziti`. Two surfaces install this chart -- this one at k3s
        # first boot, the Application at sync-wave -45 -- and they share a Helm
        # release name and namespace, so a disagreement here would have the two
        # reconcilers flipping the flag against each other.
        #
        # `openziti` is created before this file is applied by
        # k8s/bootstrap/openziti-namespace.yaml (lexically earlier than
        # trust-manager-install.yaml in the k3s deploy controller's apply order,
        # and pinned as such by nixos/tests/k3s-first-boot-apply-order-eval-test.nix).
        namespace: openziti
