# SPIRE bootstrap install. K3S HelmChart CR — runs BEFORE Trust Manager
# (Trust Manager distributes SPIRE's CA bundle).
#
# CORRECTED 2026-08-20 (Dejan). This header used to read "runs AFTER Vault
# (SPIRE chains to Vault as upstream CA)". That was never true of this file:
# there is no `upstreamAuthority` key below — `grep -c upstreamAuthority`
# returns 0 — so the SPIRE server issues from its OWN self-signed CA
# (`caSubject` below is that CA's subject). The ArgoCD twin at
# k8s/applications/spire/Application.yaml carries the Vault block COMMENTED
# OUT with "uncomment after vault is healthy". A comment describing a
# dependency the manifest does not have is worse than no comment: it is what
# made Vault look load-bearing at bootstrap when nothing consumes it.
# Vault is no longer in the bootstrap roster at all (see k3s-server.nix).
# Before wiring `upstreamAuthority.vault` here, see
# docs/research/2026-08-20-hsm-tpm-into-vault-and-cert-manager-yes-for-tpm-but-not-through-vault-openbao-is-the-answer.md

# SPIRE CRDs (ClusterSPIFFEID, ClusterFederatedTrustDomain, ClusterStaticEntry)
# MUST be installed before the spire chart — the hardened chart ships them as a
# SEPARATE spire-crds chart (Helm CRD best-practice), and `spire` renders
# ClusterSPIFFEID objects that fail "no matches for kind" without them. k3s'
# helm-controller retries the spire install until these land.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: spire-crds
  namespace: kube-system
spec:
  chart: spire-crds
  repo: https://spiffe.github.io/helm-charts-hardened/
  # 0.5.0 -> 0.6.1 on 2026-09-06, to EQUAL k8s/applications/spire-crds/Application.yaml.
  # The two install the same Helm release -- K3S at first boot, then the Application adopts
  # it -- so a split pin means the cluster upgrades its own CRDs in an early sync wave,
  # underneath a spire chart (0.24.2 on both sides, correct) that is coming up against them.
  #
  # MEASURED before bumping, `helm template` at both versions:
  #   same three CRDs (clusterspiffeids, clusterfederatedtrustdomains, clusterstaticentries)
  #   same served version, v1alpha1, in all three
  #   openAPIV3Schema property diff: 0 removed, 0 added, in all three
  # So the API surface is byte-identical in the sense that matters, which is what made this
  # the cheapest of the four divergences to close: nothing to re-render, nothing to migrate.
  version: 0.6.1
  targetNamespace: spire
  createNamespace: true
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: spire
  namespace: kube-system
spec:
  chart: spire
  repo: https://spiffe.github.io/helm-charts-hardened/
  version: 0.24.2
  targetNamespace: spire
  createNamespace: true
  valuesContent: |-
    global:
      spire:
        clusterName: zeta
        trustDomain: zeta.local
        recommendations:
          enabled: false
    spire-server:
      caSubject:
        country: US
        commonName: zeta-spire-ca
        organization: Zeta
      persistence:
        type: pvc
        size: 5Gi
        storageClass: zeta-local-path
      # PINNED 2026-09-22. `spire-lib.kubectl-image` (charts/spire-lib/templates/_helpers.tpl
      # in chart 0.24.2) derives this hook image's tag from `.Capabilities.KubeVersion.Version`
      # whenever `tools.kubectl.image.tag` is empty -- its own default. K3S reports
      # `v1.35.7+k3s1`, the helper strips that to `v1.35.7`, and `rancher/kubectl:v1.35.7` has
      # never been published (Docker Hub 404; confirmed live on GitHub Actions run
      # 35687536936: helm-install-spire's post-install-job ErrImagePull/NotFound-loops
      # forever). `rancher/kubectl:v1.35.6` IS published, multi-arch (linux/amd64 +
      # linux/arm64 verified via the Docker Hub tags API), and is the newest tag that exists --
      # so pin here rather than let the chart derive a tag from a cluster version the image
      # publisher hasn't caught up to yet. Four hook templates read this same value
      # (post-install, post-upgrade, pre-delete twice); pinning it once here fixes all four.
      # Mirrored at k8s/applications/spire/Application.yaml (the ArgoCD twin) -- keep both in
      # sync, see bootstrap-application-pin-parity.
      tools:
        kubectl:
          image:
            tag: v1.35.6
    spire-agent:
      workloadAttestors:
        k8s: { enabled: true, skipKubeletVerification: false }
        unix: { enabled: true }
    spiffe-csi-driver:
      enabled: true
    spiffe-oidc-discovery-provider:
      enabled: false   # broken pre-delete hook deadlocks uninstall; not needed
