# full-ai-cluster/k8s/bootstrap/argocd-install.yaml
#
# K3S HelmChart CR (`helm.cattle.io/v1`) — K3S's Helm Controller
# resolves the chart at install time and applies the rendered
# manifests. This is the native K3S pattern for "install Helm
# chart at boot." Plain-resources format that
# `services.k3s.manifests` actually understands.

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  chart: argo-cd
  repo: https://argoproj.github.io/argo-helm
  # 7.7.10 -> 10.6.0 on 2026-09-01, i.e. ArgoCD v2.13.2 -> v3.5.2. This pin and
  # the one in k8s/applications/argocd/Application.yaml MUST move together: the
  # Application adopts this installation, so a drift makes ArgoCD try to change
  # its own version on first reconcile, in the earliest sync wave.
  #
  # MEASURED before bumping, not assumed. `helm template` with THIS FILE'S exact
  # values at both versions:
  #   both render clean; 45 resources -> 50
  #   the five new ones are all NetworkPolicy (application-controller, dex-server,
  #     redis, repo-server, server) -- ADDITIONS, and nothing was removed
  #   every value we set still takes effect at 10.6.0: global.domain appears,
  #     server.service.type is ClusterIP, server.insecure reaches
  #     argocd-cmd-params-cm, and notifications.enabled=false still renders zero
  #     notifications resources
  # A chart that renders is not a cluster that reconciles, so the k8s lanes are
  # what actually clear this; the render is what says the VALUES survived, which
  # is the half a major chart bump usually breaks.
  # 10.6.0 -> 10.7.0 on 2026-09-03: same ArgoCD v3.5.2 (Helm 4), pinned EQUAL to
  # applications/argocd/Application.yaml so bootstrap and self-management agree and
  # no wave -90 self-upgrade happens mid-bring-up. The kind lane's bootstrap
  # (dev-cluster/use-cases.ts) moved from 7.7.10 (v2.13.2, Helm 3) the same day --
  # that one was the seaweedfs `fromToml` cached-render failure.
  # 10.7.0 -> 10.7.2 on 2026-09-04: a PURE CHART bump -- appVersion is v3.5.2 at both,
  # checked against the live repo index, so ArgoCD itself does not move. All FOUR pin sites
  # move together (this Application, k8s/bootstrap/argocd-install.yaml, and the kind and k3d
  # bootstraps in dev-cluster/use-cases.ts) because 2026-09-03 made them EQUAL on purpose: a
  # bootstrap behind the self-managed Application means a mid-run self-upgrade, which is
  # exactly the failure that cached the seaweedfs manifest error.
  version: 10.8.0
  targetNamespace: argocd
  createNamespace: false   # argocd-namespace.yaml creates it explicitly
  valuesContent: |-
    global:
      domain: argocd.zeta.local
    server:
      service:
        type: ClusterIP   # ingress lands separately
      # Requests live HERE, inside the one `server:` block, not in a second one
      # at the foot of this file: YAML duplicate keys are LAST-WINS AND SILENT,
      # so a second `server:` would have deleted `service.type` without a word.
      # The other four components' requests sit at the foot because their blocks
      # are there; the rationale for all five is written once, beside `controller:`.
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
    configs:
      params:
        server.insecure: true   # TLS terminated upstream once ingress lands
      cm:
        # RESTORES Application-CRD health assessment, removed upstream in ArgoCD
        # 1.8 (argo-cd docs/operator-manual/upgrading/1.7-1.8.md, "Application CRD
        # health check has been removed... You might need to restore it if you are
        # using app-of-apps pattern and orchestrating synchronization using sync
        # waves"). WITHOUT this key, gitops-engine has NO health check registered
        # for argoproj.io/Application at all, so every child Application under
        # zeta-root (root-application.yaml) is treated as immediately "Healthy"
        # the moment it is APPLIED -- sync waves among the ~50 child Applications
        # then only order the ArgoCD-side apply of the Application resource
        # itself; they never wait for the workload underneath a wave to actually
        # converge before the next wave starts.
        #
        # OPT-IN, NOT GLOBAL -- A DELIBERATE MODIFICATION OF THE UPSTREAM LUA,
        # AND THE REASON IS AN ARCHITECT REVIEW (081M33T23ZQ087G0R002ZYRHDG),
        # not upstream's own text. The upstream snippet above (the lines inside
        # the `if obj.metadata...` guard below, byte-identical to the upgrade
        # note) makes health assessment ATTACH TO EVERY Application uniformly.
        # Turning that on for the whole ~50-Application roster converts it into
        # a GLOBAL wave gate: sync-wave progression waits for EVERY earlier
        # wave's Application to be Healthy before starting the next wave, no
        # matter whether anything downstream actually depends on it. Measured
        # against the real tree, that is not a safe default:
        #   - `platform` (wave -20) pulls a PRIVATE image via `ghcr-pull`,
        #     which nothing mints outside the dev/CI harness (metal gap,
        #     workitem 081M33TN49G087G0R000X5ZJ75) -- ImagePullBackOff forever.
        #   - `openbao` (wave -60) comes up SEALED by design; PKCS#11
        #     auto-unseal is not wired for metal (openbao/Application.yaml,
        #     openbao-unseal-sidecar.ts: "HONEST SCOPE -- SHAMIR / KIND ONLY.
        #     Metal auto-unseal is PKCS#11 ... blocked on a same-libc OpenBao
        #     image") -- sealed forever without a human-run unseal ceremony.
        #   - `cdi`/`kubevirt`/`ollama`/`vllm` are declared manual-sync
        #     (manual-sync-policy.ts) -- never auto-synced, so honest health is
        #     "Missing" forever.
        # ANY ONE of those, gated globally, freezes every wave after it --
        # cluster-wide, on every fresh install. So health is propagated to
        # wave ordering ONLY for a child Application explicitly annotated
        # `zeta.io/gates-later-waves: "true"` -- a SMALL, machine-checked set
        # of CRD/webhook PROVIDERS that (a) a later wave genuinely depends on
        # and (b) are verified to reach Healthy on a fresh metal boot with no
        # operator ceremony and no unminted secret
        # (crd-provider-consumer-order.ts: `GATING_PROVIDER_APPS`, `deriveGatingFindings`).
        # Every OTHER Application reports synthetic Healthy here -- wave
        # ordering never waits on it -- while its REAL health is UNCHANGED and
        # fully visible everywhere a human or `argocd app get` actually looks
        # (the ArgoCD UI, `kubectl get application`, this lua's input `obj`
        # itself): this only changes what feeds wave PROGRESSION, never what
        # is reported about the Application.
        #
        # MUST STAY IN LOCKSTEP with `configs.cm` in
        # full-ai-cluster/k8s/applications/argocd/Application.yaml AND THE
        # OTHER DECLARED CLUSTER TREE'S mirrored bootstrap file
        # (audit-argocd-pin-parity.ts's own HELMCHART_PIN_FILES roster --
        # not spelled out by path here: that second tree is the stale one
        # 081M00QCHWA087G0R000GKKRXD is retiring, and cluster-tree-consumers.json
        # refuses a new literal reference to it from a full-ai-cluster manifest)
        # -- same reasoning as the version pin above: this bootstrap installs ArgoCD first, the
        # Application then adopts it, and a divergent argocd-cm between the
        # two would flip health semantics on ArgoCD's very first self-managed
        # reconcile. `audit-argocd-pin-parity.ts`'s health-lua parity check
        # fails if any of the three loses this key or they disagree.
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Healthy"
          hs.message = "non-gating: health not propagated to wave ordering (zeta.io/gates-later-waves not set)"
          if obj.metadata ~= nil and obj.metadata.annotations ~= nil and obj.metadata.annotations["zeta.io/gates-later-waves"] == "true" then
            -- Upstream lua, verbatim, from argo-cd docs/operator-manual/upgrading/1.7-1.8.md.
            hs.status = "Progressing"
            hs.message = ""
            if obj.status ~= nil then
              if obj.status.health ~= nil then
                hs.status = obj.status.health.status
                if obj.status.health.message ~= nil then
                  hs.message = obj.status.health.message
                end
              end
            end
          end
          return hs
        # WP26 follow-up (081M38GCTFX087G0R003MMTXJE): the chart's OWN
        # default `resource.exclusions` excludes `discovery.k8s.io/
        # {Endpoints,EndpointSlice}` for a stated reason ("never child
        # objects of managed resources that need to be presented in the
        # resource tree") that does not hold for cilium -- MEASURED: cilium
        # is the only Application (of 42) whose `status.conditions` carries
        # `ExcludedResourceWarning: Resource discovery.k8s.io/EndpointSlice
        # cilium-ingress is excluded in the settings`, and the app that
        # reads `health=Progressing with no classified pod issue
        # attributed to it` in every triggered first-boot-replica run with
        # every DaemonSet/Deployment it owns reading Healthy by the book.
        #
        # HONEST REGISTER: a well-evidenced HYPOTHESIS, not a proven fix --
        # see the full derivation on the mirrored key in
        # full-ai-cluster/k8s/applications/argocd/Application.yaml, which
        # this key MUST STAY IN LOCKSTEP with (same reasoning as the
        # health-lua key above).
        #
        # `Endpoints` (deprecated core/v1) stays excluded; every OTHER
        # chart-default exclusion is reproduced verbatim -- a narrowing of
        # the default by exactly one kind, never a blanket reversion. The
        # chart's own `resource.customizations.ignoreResourceUpdates.
        # discovery.k8s.io_EndpointSlice` default (unconditional, not shown
        # here) keeps diff noise suppressed once this resource is tracked.
        resource.exclusions: |
          - apiGroups:
            - ''
            kinds:
            - Endpoints
          - apiGroups:
            - coordination.k8s.io
            kinds:
            - Lease
          - apiGroups:
            - authentication.k8s.io
            - authorization.k8s.io
            kinds:
            - SelfSubjectReview
            - TokenReview
            - LocalSubjectAccessReview
            - SelfSubjectAccessReview
            - SelfSubjectRulesReview
            - SubjectAccessReview
          - apiGroups:
            - certificates.k8s.io
            kinds:
            - CertificateSigningRequest
          - apiGroups:
            - cert-manager.io
            kinds:
            - CertificateRequest
          - apiGroups:
            - cilium.io
            kinds:
            - CiliumIdentity
            - CiliumEndpoint
            - CiliumEndpointSlice
          - apiGroups:
            - kyverno.io
            - reports.kyverno.io
            - wgpolicyk8s.io
            kinds:
            - PolicyReport
            - ClusterPolicyReport
            - EphemeralReport
            - ClusterEphemeralReport
            - AdmissionReport
            - ClusterAdmissionReport
            - BackgroundScanReport
            - ClusterBackgroundScanReport
            - UpdateRequest
    notifications:
      enabled: false
    dex:
      enabled: false   # SSO wires in via a Sealed Secret + values patch
    redis-ha:
      enabled: false   # single-control-plane bootstrap
    # ── RESOURCE REQUESTS — the GitOps engine must not be BestEffort ──────────
    #
    # MEASURED 2026-09-25 from dispatch 36097310492 (WP11, real installed disk,
    # 05:32:14 -> 07:02:27). Verdicts 1-6 all green at 152s. The Application
    # roster then peaked at 25/35 Synced+Healthy at t=1214s and went BACKWARDS
    # to 13/35 by t=3007s, flat across the last four samples 723s apart.
    #
    # THE BACKWARDS CURVE RULES OUT "IT NEEDS LONGER", WHICH IS THE PART THAT IS
    # MEASURED. Convergence that LOSES ground is not convergence that is slow, so
    # no timeout increase and no extra wall clock reaches it — more time made it
    # worse.
    #
    # WHICH MECHANISM PRODUCED THE FALL: eviction was the first answer here and it
    # is REFUTED. Recorded rather than quietly replaced, because the refutation is
    # more useful than the guess was.
    #
    # An earlier draft of this comment asserted "what goes backwards is what gets
    # EVICTED". Dispatch 36097310492's own 2857-line serial says otherwise:
    #   evicted / OOMKilled / MemoryPressure / oom_reaper / "Out of memory"  = 0
    # and the crosstab of the 102 unconverged rows puts the regression on the
    # SYNC axis, not the health axis:
    #   22  sync=Unknown    health=Healthy   <- comparison failed, WORKLOAD FINE
    #   25  sync=OutOfSync  health=Healthy
    #    0  sync=Synced     health=Missing   <- the eviction signature, absent
    # 47 of 102 rows sat at health=Healthy, and six of the final twelve read
    # "Failed to load TARGET state" while the LIVE state was read successfully.
    # The pods were UP; ArgoCD could not render what they should be.
    #
    # SO THE EVIDENCE NAMES THE RENDERER, FROM THE CLUSTER SIDE, and it agrees
    # with what this file measured from the manifest side. Three substrates now
    # name the same organ: the manifests (no requests at either pin site), the
    # installed disk (19 DeadlineExceeded on manifest generation, 7 `failed to
    # get server version`), and the Docker replica (leader-election timeouts
    # under load, WP26). Different methods, one starved control plane.
    #
    # AND THE MEMORY OVER-COMMIT HAS NOT BEEN TESTED YET, which is the part to
    # carry forward. The roster over-commits this guest's RAM at both rungs
    # (1.47x dev, 2.09x metal) and that did NOT bite in this run -- because only
    # 35 of 49 Applications were ever created, `zeta-root` itself never having
    # completed a comparison. The roster never reached its full memory demand.
    #
    #   THE CPU STARVATION PREVENTED THE MEMORY OVER-COMMIT FROM MANIFESTING.
    #
    # So this fix makes a FALSIFIABLE PREDICTION, stated before the next run
    # rather than explained after it: the failure mode should MOVE, not vanish.
    # More Applications deploy, and memory becomes the next wall. If the next
    # dispatch shows pressure or eviction where this one showed none, that is
    # this change working and the 1.47x arriving on schedule -- not a new defect,
    # and not a reason to read the fix as failed.
    #
    #
    # WHAT IS MEASURED RATHER THAN INFERRED: every ArgoCD container was
    # BestEffort. This file and k8s/applications/argocd/Application.yaml between
    # them set not one `resources` key, and argo-cd 10.8.0 ships `resources: {}`
    # for every component. Rendering BOTH value sets at the pinned chart
    # confirmed it — nine containers, zero requests, no exceptions.
    #
    # THE CPU HALF, in cgroup terms. Kubernetes maps a request to a share
    # (MilliCPUToShares: max(2, m*1024/1000)); an ABSENT request takes the floor
    # of 2, which is cgroup-v2 weight 1. Against the committed roster in
    # rendered-resource-requests.snapshot.json that puts the whole ArgoCD
    # control plane at weight 1 of 507 at the `metal` rung — 0.20% of the
    # 4-vCPU WP11 guest, about 8 millicores, shared across SEVEN pods. A
    # repo-server rendering 49 Applications' Helm charts on 8 millicores is the
    # `DeadlineExceeded ... failed to generate manifest` that 19 of the 100
    # unconverged rows reported. The deadline was not too short; the renderer
    # was handed 0.2% of the machine.
    #
    # THE FINDING WAS NOT MISSING, IT WAS UNACTED. `missing-resource-requests.ts`
    # has printed `full-ai-cluster/argocd` as ACTIONABLE row #1 since 2026-09-04,
    # and its own header names argocd in the BestEffort set in so many words. A
    # check nobody acts on is one step past a check nobody reads.
    #
    # REQUESTS ONLY, NO LIMITS, deliberately. A CPU limit throttles the renderer,
    # which is the opposite of the intent; a memory limit OOM-kills the very
    # controller that would have to recover from it. What is bought here is a
    # SCHEDULING reservation plus a cgroup share — precisely what
    # storage-profiles.json's $comment_devCpuFloor says a request is, and
    # nothing here lowers a ceiling because none of these components has one.
    #
    # WHY IT COSTS A LARGE NODE NOTHING AND SAVES A SMALL ONE. 750m / 1408Mi is
    # 4.7% of CPU and 2.2% of RAM on the SMALLEST registered ClusterNode
    # (node-ad1efd: 16 logical cores, 62942Mi measured — single-node-readiness.ts
    # reads it). On the 4-vCPU guest it is the difference between ArgoCD holding
    # a reservation and ArgoCD standing first in the eviction queue. And ArgoCD
    # is installed by THIS bootstrap, before any roster Application exists, so
    # it claims that capacity on an EMPTY node: the reservation is actually
    # available at the moment it is taken.
    #
    # THE TRADE, STATED RATHER THAN HIDDEN. On a node whose requests already
    # exceed capacity, 750m reserved here is 750m the roster cannot have, so
    # some workload reaches `Insufficient cpu` sooner than it does today. That
    # is the intended direction and not a side effect: a Pending application pod
    # is recoverable — ArgoCD retries it — while a starved ArgoCD is not,
    # because nothing else drives convergence at all. The engine that has to do
    # the recovering must not be the first thing to lose.
    #
    # Governed by `resourceClaims` rows in full-ai-cluster/k8s/storage-profiles.json
    # (full-ai-cluster/argocd/{repo-server,controller,server,redis,applicationset}).
    # These literals ARE the `metal` rung, so `--resource-profile metal --verify`
    # reproduces them byte-for-byte, and the `dev` rung lowers CPU only — memory
    # is incompressible and an under-request there recreates this exact defect.
    controller:
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
    repoServer:
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
    redis:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
    # `applicationSet.enabled` USED TO LIVE HERE AND WAS REMOVED 2026-09-25: it is
    # INERT at argo-cd 10.8.0. The chart's values.yaml has no `applicationSet.enabled`
    # key and templates/argocd-applicationset/deployment.yaml carries no `{{- if }}`
    # guard at all -- the controller renders unconditionally. The key was real at
    # 7.7.10 and the 7.7.10 -> 10.6.0 bump orphaned it; nothing noticed because
    # `inert-valuesobject-keys.ts` scans Application valuesObjects and this bootstrap
    # file is not one. It surfaced only when the Application was made to mirror this
    # file for real, which is the parity repair doing its job on its first run.
    # Removing it is a no-op on the render, verified by diffing before and after.
    applicationSet:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
