# full-ai-cluster/k8s/bootstrap/root-application.yaml
#
# App-of-Apps root. K3S auto-applies after ArgoCD is running.
# ArgoCD then watches `k8s/applications/` for Application CRs and
# reconciles everything declared there.
#
# Adding a workload to the cluster:
#   1. mkdir full-ai-cluster/k8s/applications/<name>/
#   2. Author Application.yaml + any supporting manifests
#   3. git commit + push to main
#   4. ArgoCD picks it up on the next sync (~3 min)
#
# Either/or gating: some directories ship multiple alternatives
# (e.g. gitlab/ vs forgejo/, ollama/ vs vllm/). The root App-of-Apps
# picks them ALL up — gating happens at the per-Application
# `syncPolicy` level. Default-on apps keep an `automated:` block;
# alternatives omit it (manual sync only via `argocd app sync`).
# Each alternative's Application.yaml header names the swap procedure.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zeta-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Lucent-Financial-Group/Zeta
    targetRevision: main
    path: full-ai-cluster/k8s/applications
    directory:
      recurse: true
      # Only pick up Application CRs (one per workload directory).
      # Supporting manifests in the same dirs are reconciled by the
      # specific app's Application, not by the root.
      include: '{*/Application.yaml,Application.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # ONE FIELD OF ONE CHILD IS NOT ROOT'S: `Application/gitlab`'s helm parameters.
  # They carry GitLab's external URL when an install-time public domain is set, and only
  # the node knows that domain -- so `platform-public-tls` (rendered by
  # nixos/modules/injected-public-tls.nix) merge-patches them in, and root must neither
  # report that as drift nor selfHeal it away. With no public domain the field is simply
  # absent and gitlab/Application.yaml's valuesObject (the LAN default) applies.
  # 081M3K253BR087G0R001151P2A; pinned by cluster/public-tls.test.ts (d).
  #
  # AND THREE KEYS OF ITS valuesObject: the GitLab LAN address. It is the last address of the
  # LoadBalancer range the installer resolved (docs/ops/INSTALL-TIME-CONFIG.md row 6), which only
  # the node knows, so `cilium-lb-ipam-pool` (k8s/lb-ipam/) merge-patches exactly these three
  # leaves -- a merge patch merges objects key by key, so it touches nothing else in
  # valuesObject -- and root must neither report that as drift nor selfHeal it back to the
  # sentinel. Disjoint from the parameters above, so the two Jobs can never clobber each other.
  # Pinned by cluster/lb-ipam-pool.test.ts.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: gitlab
      namespace: argocd
      jsonPointers:
        - /spec/source/helm/parameters
        - /spec/source/helm/valuesObject/global/hosts/gitlab/name
        - /spec/source/helm/valuesObject/global/hosts/registry/name
        - /spec/source/helm/valuesObject/global/zeta/lanAddress
    # Forgejo, the same shape (docs/ops/INSTALL-TIME-CONFIG.md row 28): its public URL is the
    # helm parameters `platform-public-tls`'s Job `forgejo-public-hosts` merge-patches in when an
    # install-time public domain is set; with none the field is absent and the in-cluster URL in
    # forgejo/Application.yaml applies. Pinned by cluster/forgejo-public.test.ts.
    - group: argoproj.io
      kind: Application
      name: forgejo
      namespace: argocd
      jsonPointers:
        - /spec/source/helm/parameters
    # THE INSTALL-TIME STORAGE PROFILE (docs/ops/INSTALL-TIME-CONFIG.md row 29). When
    # /etc/zeta/storage-profile names a rung other than the committed one, the
    # `zeta-storage-profile` Application's per-Application Jobs merge-patch that rung's SIZE
    # (and, for the rungs that change them, pod-count and retention) leaves into the Applications
    # below, and root must neither report that as drift nor selfHeal it back to the committed rung.
    # GENERATED -- `bun src/Core.TypeScript/cluster/storage-profile-install.ts --write` rewrites
    # exactly this region from k8s/storage-profiles.json, and storage-profile-install.test.ts
    # fails when it is not byte-for-byte what the generator emits. THE COST, STATED: these leaves
    # are installation-owned. A later commit that edits one of them in source control does not
    # reach a cluster that already synced these Applications; the way to resize is the
    # install-time profile (grow it, never shrink: Kubernetes refuses to shrink a PVC).
    # ZETA-STORAGE-PROFILE-IGNORE-BEGIN
    - group: argoproj.io
      kind: Application
      name: cockroachdb
      namespace: argocd
      jsonPointers:
        - /spec/source/helm/valuesObject/statefulset/replicas
        - /spec/source/helm/valuesObject/storage/persistentVolume/size
    - group: argoproj.io
      kind: Application
      name: hindsight
      namespace: argocd
      jsonPointers:
        - /spec/source/helm/valuesObject/postgresql/persistence/size
    - group: argoproj.io
      kind: Application
      name: kube-prometheus-stack
      namespace: argocd
      jsonPointers:
        - /spec/source/helm/valuesObject/alertmanager/alertmanagerSpec/storage/volumeClaimTemplate/spec/resources/requests/storage
        - /spec/source/helm/valuesObject/grafana/persistence/size
        - /spec/source/helm/valuesObject/prometheus/prometheusSpec/retentionSize
        - /spec/source/helm/valuesObject/prometheus/prometheusSpec/storageSpec/volumeClaimTemplate/spec/resources/requests/storage
    - group: argoproj.io
      kind: Application
      name: mimir
      namespace: argocd
      jsonPointers:
        - /spec/source/helm/valuesObject/compactor/persistentVolume/size
        - /spec/source/helm/valuesObject/ingester/persistentVolume/size
        - /spec/source/helm/valuesObject/store_gateway/persistentVolume/size
    - group: argoproj.io
      kind: Application
      name: nats
      namespace: argocd
      jsonPointers:
        - /spec/source/helm/valuesObject/config/cluster/replicas
        - /spec/source/helm/valuesObject/config/jetstream/fileStore/pvc/size
    - group: argoproj.io
      kind: Application
      name: ollama
      namespace: argocd
      jsonPointers:
        - /spec/source/helm/valuesObject/persistentVolume/size
    - group: argoproj.io
      kind: Application
      name: openziti-controller
      namespace: argocd
      jsonPointers:
        - /spec/source/helm/valuesObject/persistence/size
    - group: argoproj.io
      kind: Application
      name: redis
      namespace: argocd
      jsonPointers:
        - /spec/source/helm/valuesObject/replica/persistence/size
        - /spec/source/helm/valuesObject/replica/replicas
    - group: argoproj.io
      kind: Application
      name: tempo
      namespace: argocd
      jsonPointers:
        - /spec/source/helm/valuesObject/persistence/size
    - group: argoproj.io
      kind: Application
      name: vllm
      namespace: argocd
      jsonPointers:
        - /spec/source/kustomize/patches
    - group: argoproj.io
      kind: Application
      name: weaviate
      namespace: argocd
      jsonPointers:
        - /spec/source/helm/valuesObject/storage/size
    # ZETA-STORAGE-PROFILE-IGNORE-END
  syncPolicy:
    # Unbounded retry (limit -1, backoff capped at 5m). ArgoCD's automated-sync default is 5 attempts
    # (~2.5 min) and it never re-attempts a revision whose sync already failed, so a control-plane blip
    # longer than that would strand THE ROOT -- and with it every Application it creates -- SyncFailed.
    # Pinned by src/Core.TypeScript/cluster/application-retry-unbounded.test.ts.
    retry:
      limit: -1
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
