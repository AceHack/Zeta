# full-ai-cluster/k8s/bootstrap/cilium-install.yaml
#
# K3S HelmChart CR — K3S's Helm Controller installs Cilium at
# first boot. This is the only thing that gets a CNI running before
# ArgoCD's own pods need to schedule (chicken-and-egg avoidance).
#
# After cluster is up, the ArgoCD Cilium Application at
# k8s/applications/cilium/Application.yaml adopts the running
# install and reconciles ongoing changes.

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cilium
  namespace: kube-system
spec:
  chart: cilium
  repo: https://helm.cilium.io
  version: 1.16.5
  targetNamespace: kube-system
  # bootstrap: install BEFORE the cluster has a CNI. K3S's helm-controller
  # runs bootstrap charts' install Job with the tolerations + host
  # networking needed to schedule onto the NotReady node
  # (node.kubernetes.io/not-ready:NoSchedule). Without this the
  # helm-install-cilium pod sits Pending forever — Cilium can't install
  # because the node isn't Ready, and the node can't become Ready because
  # Cilium (the CNI) isn't installed. Empirically caught on node-bc8d77
  # (2026-06-06): helm-install-cilium stuck Pending ~9 min on the taint.
  bootstrap: true
  valuesContent: |-
    kubeProxyReplacement: true
    # CLUSTER IDENTITY for Cilium ClusterMesh. Both values are derived from the
    # same `clusterName` the CIDR above comes from, so two clusters built from
    # two checkouts with different names get distinct ids without an allocator
    # (manifesto §1). Cilium's cluster id is EIGHT BITS (1..255), which is why
    # the derivation is collision-RESISTANT and never collision-free -- see
    # `src/Core.TypeScript/cluster/cluster-cidr.ts` for the birthday bound and
    # the detect-and-rename mitigation. Setting these does NOT enable
    # ClusterMesh; no `clustermesh` block is declared anywhere in this tree.
    cluster:
      name: zeta
      id: 31
    # Reach the API server by the stable name `control-plane`. On the
    # control-plane node this resolves to 127.0.0.1 via /etc/hosts
    # (k3s-server.nix) — the API is local, so the control-plane's own
    # Cilium agent uses the loopback endpoint. The API cert is SAN'd for
    # `control-plane` via --tls-san. (Was the dangling
    # `control-plane.zeta.local`, which nothing could resolve.)
    # MULTI-NODE TODO: workers need `control-plane` -> the CP's LAN IP;
    # see the note in k3s-server.nix (inject /etc/hosts at install time).
    k8sServiceHost: control-plane
    k8sServicePort: 6443
    # POD CIDR IS DERIVED, NOT CHOSEN HERE. It must equal k3s'
    # `--cluster-cidr`, which `nixos/modules/k3s-server.nix` now takes from
    # `zeta.cluster.podCidr` -- a pure function of `clusterName` in
    # `full-ai-cluster/cluster-identity.json` (currently "zeta" -> 10.143.0.0/17).
    # `nixos/modules/cluster-network.nix` ASSERTS that this file mentions the
    # derived value, so changing the cluster identity without updating here
    # fails the build instead of producing pods whose addresses nothing routes.
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList: [ "10.143.0.0/17" ]
    bpf:
      masquerade: true
    routingMode: native
    ipv4NativeRoutingCIDR: "10.143.0.0/17"
    autoDirectNodeRoutes: true
    hubble:
      enabled: true
      relay: { enabled: true }
      ui: { enabled: true }
      metrics:
        enabled: [ dns, drop, tcp, flow, icmp, http ]
        enableOpenMetrics: true
    operator:
      replicas: 1
    # Cilium Service Mesh — L7 routing/mTLS/observability without
    # a sidecar (replaces Istio in this stack).
    l7Proxy: true
    envoy:
      enabled: true
    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: true
    gatewayAPI:
      enabled: true
    ingressController:
      enabled: true
      loadbalancerMode: shared
      default: true
