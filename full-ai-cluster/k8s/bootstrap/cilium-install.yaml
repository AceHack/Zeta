# full-ai-cluster/k8s/bootstrap/cilium-install.yaml
#
# K3S HelmChart CR — K3S's Helm Controller installs Cilium at
# first boot. This is the only thing that gets a CNI running before
# ArgoCD's own pods need to schedule (chicken-and-egg avoidance).
#
# After cluster is up, the ArgoCD Cilium Application at
# k8s/applications/cilium/Application.yaml adopts the running
# install and reconciles ongoing changes.

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cilium
  namespace: kube-system
spec:
  chart: cilium
  repo: https://helm.cilium.io
  version: 1.16.5
  targetNamespace: kube-system
  # bootstrap: install BEFORE the cluster has a CNI. K3S's helm-controller
  # runs bootstrap charts' install Job with the tolerations + host
  # networking needed to schedule onto the NotReady node
  # (node.kubernetes.io/not-ready:NoSchedule). Without this the
  # helm-install-cilium pod sits Pending forever — Cilium can't install
  # because the node isn't Ready, and the node can't become Ready because
  # Cilium (the CNI) isn't installed. Empirically caught on node-bc8d77
  # (2026-06-06): helm-install-cilium stuck Pending ~9 min on the taint.
  bootstrap: true
  valuesContent: |-
    kubeProxyReplacement: true
    # Reach the API server by the stable name `control-plane`. On the
    # control-plane node this resolves to 127.0.0.1 via /etc/hosts
    # (k3s-server.nix) — the API is local, so the control-plane's own
    # Cilium agent uses the loopback endpoint. The API cert is SAN'd for
    # `control-plane` via --tls-san. (Was the dangling
    # `control-plane.zeta.local`, which nothing could resolve.)
    # MULTI-NODE TODO: workers need `control-plane` -> the CP's LAN IP;
    # see the note in k3s-server.nix (inject /etc/hosts at install time).
    k8sServiceHost: control-plane
    k8sServicePort: 6443
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList: [ "10.42.0.0/16" ]
    bpf:
      masquerade: true
    routingMode: native
    ipv4NativeRoutingCIDR: "10.42.0.0/16"
    autoDirectNodeRoutes: true
    hubble:
      enabled: true
      relay: { enabled: true }
      ui: { enabled: true }
      metrics:
        enabled: [ dns, drop, tcp, flow, icmp, http ]
        enableOpenMetrics: true
    operator:
      replicas: 1
    # Cilium Service Mesh — L7 routing/mTLS/observability without
    # a sidecar (replaces Istio in this stack).
    l7Proxy: true
    envoy:
      enabled: true
    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: true
    gatewayAPI:
      enabled: true
    ingressController:
      enabled: true
      loadbalancerMode: shared
      default: true
