# Vault bootstrap install. K3S HelmChart CR — runs AFTER cert-manager
# (Vault TLS certs come from cert-manager), BEFORE SPIRE + ESO
# (both depend on Vault being available).

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: vault
  namespace: kube-system
spec:
  chart: vault
  repo: https://helm.releases.hashicorp.com
  version: 0.29.1
  targetNamespace: vault
  createNamespace: true
  valuesContent: |-
    global:
      enabled: true
      tlsDisable: false
    server:
      ha:
        enabled: false   # single replica at bootstrap; bump to 3 + raft later
        replicas: 1
      dataStorage:
        enabled: true
        storageClass: longhorn
        size: 20Gi
      auditStorage:
        enabled: true
        storageClass: longhorn
        size: 10Gi
    injector:
      enabled: true
      replicas: 1
    ui:
      enabled: true
      serviceType: ClusterIP
