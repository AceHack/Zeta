# External Secrets Operator bootstrap install. K3S HelmChart CR —
# runs AFTER Vault, BEFORE ArgoCD. ArgoCD's own initial admin
# password (and other bootstrap secrets) can be sourced from Vault
# via ESO once both are healthy.

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: external-secrets
  namespace: kube-system
spec:
  chart: external-secrets
  repo: https://charts.external-secrets.io
  version: 0.10.7
  targetNamespace: external-secrets
  createNamespace: true
  valuesContent: |-
    installCRDs: true
    replicaCount: 1
    webhook: { replicaCount: 1 }
    certController: { replicaCount: 1 }
