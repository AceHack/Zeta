# External Secrets Operator bootstrap install. K3S HelmChart CR —
# runs BEFORE ArgoCD. Installs the OPERATOR AND ITS CRDs ONLY.
#
# CORRECTED 2026-08-20 (Dejan). This header used to read "runs AFTER Vault".
# ESO does not need Vault to install: no SecretStore/ClusterSecretStore
# exists anywhere in this tree (the Vault-backed one in the ArgoCD twin is
# commented out), and ArgoCD's admin password comes from the argo-cd chart's
# own generated secret, not from Vault. So ESO comes up with zero configured
# stores and syncs nothing — which is fine, and is what "runs AFTER Vault"
# was obscuring. Vault is ArgoCD-owned now (sync-wave -60, before ESO's -40);
# the store gets wired there, not here.

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: external-secrets
  namespace: kube-system
spec:
  chart: external-secrets
  repo: https://charts.external-secrets.io
  # 0.10.7 -> 2.10.0 on 2026-09-06, to EQUAL k8s/applications/external-secrets/Application.yaml.
  # The LAST of the four first-boot pin divergences (081M1TSKEWA087G0R0029759E3), and the one
  # its own acknowledgement said to treat as a MIGRATION rather than a bump because 0.x -> 2.x
  # is a major line.
  #
  # MEASURED with THIS FILE's valuesContent at both versions, comparing kind/name pairs:
  #   34 objects -> 44; NOTHING REMOVED
  #   all ten additions are new generator CRDs (grafanas, sshkeys, quayaccesstokens, ...)
  #   CRDs 15 -> 25; all three Deployments still at replicas 1, so every value lands
  #
  # THE MAJOR-VERSION RISK IS REAL BUT IT IS NOT IN THE RENDER -- it is in the SERVED API
  # VERSIONS, which a rendered-object diff does not show:
  #   0.10.7   externalsecrets/secretstores/clustersecretstores: v1alpha1 + v1beta1 served
  #   2.10.0   v1 served+storage, and **v1beta1 served: false**
  # Nothing in this tree creates such an object today (checked: the only
  # `external-secrets.io/v1beta1` is inside a COMMENT), so nothing breaks -- but that comment
  # was instructions, and following them would have produced an object the API server refuses.
  # It is corrected to v1 in the same change; every field it uses exists in the v1 schema.
  version: 2.10.0
  targetNamespace: external-secrets
  createNamespace: true
  valuesContent: |-
    installCRDs: true
    replicaCount: 1
    # EQUAL to k8s/applications/external-secrets/Application.yaml (shared Helm release).
    priorityClassName: system-cluster-critical
    webhook: { replicaCount: 1, priorityClassName: system-cluster-critical }
    certController: { replicaCount: 1, priorityClassName: system-cluster-critical }
