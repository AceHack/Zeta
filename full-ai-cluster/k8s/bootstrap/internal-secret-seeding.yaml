# ═════════════════════════════ zeta-blob-store (SHARED, 4 namespaces) ═══════
# ONE value (this Job's own CSPRNG draw), FOUR namespaces, IDENTICAL stringData
# in every namespace -- exactly DEV_BLOB_STORE_SECRET's shape in
# dev-cluster/lib.ts, whose `keys(value)` function is likewise
# namespace-independent. seaweedfs reads `seaweedfs_s3_config`; loki/mimir
# expand `BLOB_STORE_SECRET_KEY`; gitlab reads `connection` (Rails
# consolidated object storage) and `config` (container registry storage
# driver). `draw-entropy` runs ONCE, draws ONE value, and writes every
# templated fragment that embeds it to the shared tmpfs volume -- so all four
# `kubectl create` steps below read the SAME value off disk instead of each
# drawing (and disagreeing on) their own, which is the single shared draw
# `applyDevSharedSecrets` requires (081M1S6Z5S3087G0R000GEPSS2).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seed-blob-store
  namespace: object-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-blob-store
  namespace: object-store
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-blob-store
  namespace: object-store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-blob-store
subjects:
  - kind: ServiceAccount
    name: seed-blob-store
    namespace: object-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-blob-store
  namespace: loki
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-blob-store
