---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-blob-store
  namespace: gitlab
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-blob-store
  namespace: gitlab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-blob-store
subjects:
  - kind: ServiceAccount
    name: seed-blob-store
    namespace: object-store
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-blob-store
  namespace: object-store
  annotations:
    zeta.io/metal-first-boot-secret-seed: "true"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: seed-blob-store
      restartPolicy: Never
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: kubecache
          emptyDir: {}
        - name: entropy
          emptyDir: { medium: Memory }
      initContainers:
        - name: draw-entropy
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              SECRET=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
              printf '%s' "$SECRET" > /work/BLOB_STORE_SECRET_KEY
              cat > /work/seaweedfs_s3_config.json <<JSON
              {"identities":[{"name":"anvAdmin","credentials":[{"accessKey":"zeta-blob-store","secretKey":"$SECRET"}],"actions":["Admin","Read","Write"]}]}
              JSON
              cat > /work/connection.yaml <<CONN
              provider: AWS
              region: us-east-1
              host: blob-store-seaweedfs-all-in-one.object-store.svc:8333
              endpoint: http://blob-store-seaweedfs-all-in-one.object-store.svc:8333
              path_style: true
              aws_access_key_id: zeta-blob-store
              aws_secret_access_key: $SECRET
              CONN
              cat > /work/config.yaml <<CFG
              s3:
                accesskey: zeta-blob-store
                secretkey: $SECRET
                region: us-east-1
                regionendpoint: http://blob-store-seaweedfs-all-in-one.object-store.svc:8333
                bucket: gitlab-registry
                secure: false
                v4auth: true
              CFG
          volumeMounts:
            - { name: entropy, mountPath: /work }
        - name: seed-object-store
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
            - { name: entropy, mountPath: /work, readOnly: true }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - zeta-blob-store
            - -n
            - object-store
            - --from-file=seaweedfs_s3_config=/work/seaweedfs_s3_config.json
            - --from-file=BLOB_STORE_SECRET_KEY=/work/BLOB_STORE_SECRET_KEY
            - --from-file=connection=/work/connection.yaml
            - --from-file=config=/work/config.yaml
        - name: seed-loki
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
            - { name: entropy, mountPath: /work, readOnly: true }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - zeta-blob-store
            - -n
            - loki
            - --from-file=seaweedfs_s3_config=/work/seaweedfs_s3_config.json
            - --from-file=BLOB_STORE_SECRET_KEY=/work/BLOB_STORE_SECRET_KEY
            - --from-file=connection=/work/connection.yaml
            - --from-file=config=/work/config.yaml
        - name: seed-mimir
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
            - { name: entropy, mountPath: /work, readOnly: true }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - zeta-blob-store
            - -n
            - mimir
            - --from-file=seaweedfs_s3_config=/work/seaweedfs_s3_config.json
            - --from-file=BLOB_STORE_SECRET_KEY=/work/BLOB_STORE_SECRET_KEY
            - --from-file=connection=/work/connection.yaml
            - --from-file=config=/work/config.yaml
      containers:
        - name: seed-gitlab
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
            - { name: entropy, mountPath: /work, readOnly: true }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - zeta-blob-store
            - -n
            - gitlab
            - --from-file=seaweedfs_s3_config=/work/seaweedfs_s3_config.json
            - --from-file=BLOB_STORE_SECRET_KEY=/work/BLOB_STORE_SECRET_KEY
            - --from-file=connection=/work/connection.yaml
            - --from-file=config=/work/config.yaml

# ═════════════════════════════ redis-auth (SHARED, 2 namespaces) ════════════
# ONE value, TWO namespaces -- Valkey's `auth.usersExistingSecret: redis-auth`
# (namespace `redis`) and the Orleans silo's `secretKeyRef` (namespace
# `orleans`, `optional: true` today because `orleans/statefulset.yaml` keeps
# replicas at 0 -- see DEV_REDIS_AUTH_SECRET in dev-cluster/lib.ts, the same
# shape, same two namespaces). `draw-entropy` runs once; both `kubectl create`
# steps read the same tmpfs file.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seed-redis-auth
  namespace: redis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-redis-auth
  namespace: redis
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-redis-auth
  namespace: redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-redis-auth
subjects:
  - kind: ServiceAccount
    name: seed-redis-auth
    namespace: redis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-redis-auth
  namespace: orleans
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-redis-auth
  namespace: orleans
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-redis-auth
subjects:
  - kind: ServiceAccount
    name: seed-redis-auth
    namespace: redis
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-redis-auth
  namespace: redis
  annotations:
    zeta.io/metal-first-boot-secret-seed: "true"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: seed-redis-auth
      restartPolicy: Never
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: kubecache
          emptyDir: {}
        - name: entropy
          emptyDir: { medium: Memory }
      initContainers:
        - name: draw-entropy
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /work/password
          volumeMounts:
            - { name: entropy, mountPath: /work }
        - name: seed-redis
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
            - { name: entropy, mountPath: /work, readOnly: true }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - redis-auth
            - -n
            - redis
            - --from-literal=username=default
            - --from-file=password=/work/password
      containers:
        - name: seed-orleans
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
            - { name: entropy, mountPath: /work, readOnly: true }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - redis-auth
            - -n
            - orleans
            - --from-literal=username=default
            - --from-file=password=/work/password
