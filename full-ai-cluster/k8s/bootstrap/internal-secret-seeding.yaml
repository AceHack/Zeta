---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-blob-store
  namespace: mimir
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-blob-store
  namespace: mimir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-blob-store
subjects:
  - kind: ServiceAccount
    name: seed-blob-store
