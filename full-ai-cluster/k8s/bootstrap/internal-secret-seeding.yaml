# ═════════════════════════════ zeta-blob-store (SHARED, 4 namespaces) ═══════
# ONE value (this Job's pod UID), FOUR namespaces, IDENTICAL stringData in
# every namespace -- exactly DEV_BLOB_STORE_SECRET's shape in dev-cluster/lib.ts,
# whose `keys(value)` function is likewise namespace-independent. seaweedfs
# reads `seaweedfs_s3_config`; loki/mimir expand `BLOB_STORE_SECRET_KEY`;
# gitlab reads `connection` (Rails consolidated object storage) and `config`
# (container registry storage driver). All four containers below run in ONE
# pod, so `$(BLOB_SECRET)` resolves to the SAME UID in every one of them --
# the single shared draw `applyDevSharedSecrets` requires (081M1S6Z5S3087G0R000GEPSS2).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seed-blob-store
  namespace: object-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-blob-store
  namespace: object-store
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-blob-store
  namespace: object-store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-blob-store
subjects:
  - kind: ServiceAccount
    name: seed-blob-store
    namespace: object-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-blob-store
  namespace: loki
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-blob-store
  namespace: loki
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-blob-store
subjects:
  - kind: ServiceAccount
    name: seed-blob-store
    namespace: object-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-blob-store
  namespace: mimir
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-blob-store
  namespace: mimir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-blob-store
subjects:
  - kind: ServiceAccount
    name: seed-blob-store
    namespace: object-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-blob-store
  namespace: gitlab
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-blob-store
  namespace: gitlab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-blob-store
subjects:
  - kind: ServiceAccount
    name: seed-blob-store
    namespace: object-store
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-blob-store
  namespace: object-store
  annotations:
    zeta.io/metal-first-boot-secret-seed: "true"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: seed-blob-store
      restartPolicy: Never
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: kubecache
          emptyDir: {}
      initContainers:
        - name: seed-object-store
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
            - name: BLOB_SECRET
              valueFrom:
                fieldRef: { fieldPath: metadata.uid }
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - zeta-blob-store
            - -n
            - object-store
            - '--from-literal=seaweedfs_s3_config={"identities":[{"name":"anvAdmin","credentials":[{"accessKey":"zeta-blob-store","secretKey":"$(BLOB_SECRET)"}],"actions":["Admin","Read","Write"]}]}'
            - --from-literal=BLOB_STORE_SECRET_KEY=$(BLOB_SECRET)
            - "--from-literal=connection=provider: AWS\nregion: us-east-1\nhost: blob-store-seaweedfs-all-in-one.object-store.svc:8333\nendpoint: http://blob-store-seaweedfs-all-in-one.object-store.svc:8333\npath_style: true\naws_access_key_id: zeta-blob-store\naws_secret_access_key: $(BLOB_SECRET)\n"
            - "--from-literal=config=s3:\n  accesskey: zeta-blob-store\n  secretkey: $(BLOB_SECRET)\n  region: us-east-1\n  regionendpoint: http://blob-store-seaweedfs-all-in-one.object-store.svc:8333\n  bucket: gitlab-registry\n  secure: false\n  v4auth: true\n"
        - name: seed-loki
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
            - name: BLOB_SECRET
              valueFrom:
                fieldRef: { fieldPath: metadata.uid }
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - zeta-blob-store
            - -n
            - loki
            - '--from-literal=seaweedfs_s3_config={"identities":[{"name":"anvAdmin","credentials":[{"accessKey":"zeta-blob-store","secretKey":"$(BLOB_SECRET)"}],"actions":["Admin","Read","Write"]}]}'
            - --from-literal=BLOB_STORE_SECRET_KEY=$(BLOB_SECRET)
            - "--from-literal=connection=provider: AWS\nregion: us-east-1\nhost: blob-store-seaweedfs-all-in-one.object-store.svc:8333\nendpoint: http://blob-store-seaweedfs-all-in-one.object-store.svc:8333\npath_style: true\naws_access_key_id: zeta-blob-store\naws_secret_access_key: $(BLOB_SECRET)\n"
            - "--from-literal=config=s3:\n  accesskey: zeta-blob-store\n  secretkey: $(BLOB_SECRET)\n  region: us-east-1\n  regionendpoint: http://blob-store-seaweedfs-all-in-one.object-store.svc:8333\n  bucket: gitlab-registry\n  secure: false\n  v4auth: true\n"
        - name: seed-mimir
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
            - name: BLOB_SECRET
              valueFrom:
                fieldRef: { fieldPath: metadata.uid }
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - zeta-blob-store
            - -n
            - mimir
            - '--from-literal=seaweedfs_s3_config={"identities":[{"name":"anvAdmin","credentials":[{"accessKey":"zeta-blob-store","secretKey":"$(BLOB_SECRET)"}],"actions":["Admin","Read","Write"]}]}'
            - --from-literal=BLOB_STORE_SECRET_KEY=$(BLOB_SECRET)
            - "--from-literal=connection=provider: AWS\nregion: us-east-1\nhost: blob-store-seaweedfs-all-in-one.object-store.svc:8333\nendpoint: http://blob-store-seaweedfs-all-in-one.object-store.svc:8333\npath_style: true\naws_access_key_id: zeta-blob-store\naws_secret_access_key: $(BLOB_SECRET)\n"
            - "--from-literal=config=s3:\n  accesskey: zeta-blob-store\n  secretkey: $(BLOB_SECRET)\n  region: us-east-1\n  regionendpoint: http://blob-store-seaweedfs-all-in-one.object-store.svc:8333\n  bucket: gitlab-registry\n  secure: false\n  v4auth: true\n"
      containers:
        - name: seed-gitlab
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
            - name: BLOB_SECRET
              valueFrom:
                fieldRef: { fieldPath: metadata.uid }
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - zeta-blob-store
            - -n
            - gitlab
            - '--from-literal=seaweedfs_s3_config={"identities":[{"name":"anvAdmin","credentials":[{"accessKey":"zeta-blob-store","secretKey":"$(BLOB_SECRET)"}],"actions":["Admin","Read","Write"]}]}'
            - --from-literal=BLOB_STORE_SECRET_KEY=$(BLOB_SECRET)
            - "--from-literal=connection=provider: AWS\nregion: us-east-1\nhost: blob-store-seaweedfs-all-in-one.object-store.svc:8333\nendpoint: http://blob-store-seaweedfs-all-in-one.object-store.svc:8333\npath_style: true\naws_access_key_id: zeta-blob-store\naws_secret_access_key: $(BLOB_SECRET)\n"
            - "--from-literal=config=s3:\n  accesskey: zeta-blob-store\n  secretkey: $(BLOB_SECRET)\n  region: us-east-1\n  regionendpoint: http://blob-store-seaweedfs-all-in-one.object-store.svc:8333\n  bucket: gitlab-registry\n  secure: false\n  v4auth: true\n"

# ═════════════════════════════ redis-auth (SHARED, 2 namespaces) ════════════
# ONE value, TWO namespaces -- Valkey's `auth.usersExistingSecret: redis-auth`
# (namespace `redis`) and the Orleans silo's `secretKeyRef` (namespace
# `orleans`, `optional: true` today because `orleans/statefulset.yaml` keeps
# replicas at 0 -- see DEV_REDIS_AUTH_SECRET in dev-cluster/lib.ts, the same
# shape, same two namespaces).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seed-redis-auth
  namespace: redis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-redis-auth
  namespace: redis
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-redis-auth
  namespace: redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-redis-auth
subjects:
  - kind: ServiceAccount
    name: seed-redis-auth
    namespace: redis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-redis-auth
  namespace: orleans
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-redis-auth
  namespace: orleans
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-redis-auth
subjects:
  - kind: ServiceAccount
    name: seed-redis-auth
    namespace: redis
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-redis-auth
  namespace: redis
  annotations:
    zeta.io/metal-first-boot-secret-seed: "true"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: seed-redis-auth
      restartPolicy: Never
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: kubecache
          emptyDir: {}
      initContainers:
        - name: seed-redis
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
            - name: REDIS_PASSWORD
              valueFrom:
                fieldRef: { fieldPath: metadata.uid }
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - redis-auth
            - -n
            - redis
            - --from-literal=username=default
            - --from-literal=password=$(REDIS_PASSWORD)
      containers:
        - name: seed-orleans
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
            - name: REDIS_PASSWORD
              valueFrom:
                fieldRef: { fieldPath: metadata.uid }
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - redis-auth
            - -n
            - orleans
            - --from-literal=username=default
            - --from-literal=password=$(REDIS_PASSWORD)
