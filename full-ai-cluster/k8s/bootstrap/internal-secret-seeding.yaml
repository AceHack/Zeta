# Metal first-boot INTERNAL secret seeding — WP14 (081M343EEP8087G0R000BAF6QF),
# hardened WP16 (mint the CSPRNG local-checks/PR#17505/#17509 opened).
#
# ── THE GAP THIS CLOSES ──────────────────────────────────────────────────────
# `first-boot-replica.ts` run 35700790207 (real NixOS k3s roster, in Docker,
# ArgoCD syncing `k8s/applications/`) found `CreateContainerConfigError` for
# hindsight, loki, mimir and opensearch -- all a missing Secret. Tracing every
# `*existingSecret` / `secretKeyRef` / `envFrom` the AUTO-SYNCED catalog names
# (see the table in `full-ai-cluster/INJECTION-POINTS.md` "Metal internal
# secret seeding"), six credentials are INTERNAL (random values used only
# BETWEEN in-cluster components -- never operator-supplied) and NOTHING on a
# real metal/USB install ever creates them:
#
#   grafana-admin-credentials   monitoring   kube-prometheus-stack admin login
#   ziti-admin-credentials      openziti     OpenZiti controller admin login
#   opensearch-admin-credentials opensearch  OPENSEARCH_INITIAL_ADMIN_PASSWORD
#   forgejo-initial-admin       forgejo      Forgejo init-container admin acct
#   zeta-blob-store             object-store, loki, mimir, gitlab (ONE value)
#   redis-auth                  redis, orleans (ONE value)                 -- orleans replicas
#                                                                              are 0 today, so
#                                                                              this is not yet
#                                                                              live there, but the
#                                                                              redis Application
#                                                                              itself needs it now
#
# `src/Core.TypeScript/cluster/dev-cluster/lib.ts` already mints every one of
# these for dev/CI (`DEV_BOOTSTRAP_SECRETS` + `DEV_SHARED_SECRETS` minus
# `DEV_HINDSIGHT_LLM_SECRET`, which is EXTERNAL -- a real LLM API key, not a
# credential this cluster can draw for itself; see INJECTION-POINTS.md for
# that gap and the `ghcr-pull` gap, both operator-supplied and already
# tracked). This file is the METAL twin: same names, same namespaces, same
# key shapes (cross-checked against `dev-cluster/lib.ts` by
# `internal-secret-seeding.test.ts` so the two cannot silently drift), applied
# by the k3s first-boot manifest roster (`nixos/modules/k3s-server.nix`)
# BEFORE ArgoCD exists, so every Secret is already in place the moment the
# consuming Application syncs.
#
# ── MECHANISM: NO SHELL IN THE PRIVILEGED CONTAINER, GET-THEN-CREATE REPLACED
#    BY CREATE-ONLY ─────────────────────────────────────────────────────────
# `registry.k8s.io/kubectl:v1.32.3` is already pinned and vetted in this repo
# (`k8s/applications/hat-system/gatekeeper-crd-wait.yaml`) and is distroless --
# `ENTRYPOINT ["/bin/kubectl"]`, no shell, no `cp`, no `sh -c`. That rules out
# the obvious `kubectl get secret X || kubectl create secret X` idiom, and
# ruled out every image already resolvable/provenance-ledgered in this tree
# offering a shell as the ONE container this manifest previously ran.
#
# The fix is that a conditional GET was never required: `kubectl create` (not
# `apply`, not `replace`) FAILS on an existing object instead of overwriting
# it -- which is exactly "mint only if absent, never overwrite". Each Job
# below runs ONCE per cluster lifetime (the k3s deploy controller re-applies
# the SAME unchanged Job object on every reboot, which is a no-op -- it never
# recreates a Job whose name it already wrote to etcd), so the ordinary case
# never even reaches the AlreadyExists path; if it ever does (a manual re-run
# after manifest surgery, say), the container fails loudly and the existing
# Secret is untouched, which is the safe outcome, not a bug.
#
# ── RANDOMNESS: A CSPRNG READ THAT NEVER APPEARS IN ANY API OBJECT ──────────
# WP14 drew randomness from each Job's pod UID (the pod's own server-generated
# v4 UUID identity field) via the Downward API. THAT WAS WEAK: a pod UID is
# readable by anyone with `get`/`list` on Pods in the namespace, and it also
# shows up in Kubernetes events, audit logs, controller logs and
# `kubectl describe` -- so the "secret" was derivable by anyone who could see
# the completed Job's pod (Job pods persist until their TTL, see below). And a
# UUIDv4's ~122 bits of entropy come from the apiserver's ID generator, which
# is not a CSPRNG designated for secret material.
#
# WP16 replaces the Downward API draw with a `/dev/urandom` read that happens
# INSIDE the pod and is written ONLY to an in-memory (`emptyDir: {medium:
# Memory}`, i.e. tmpfs -- never touches a disk) volume shared between
# containers of the SAME pod. Nothing about the drawn value is ever placed in
# a Pod spec, an env var, a Job/Pod annotation, an arg Kubernetes itself
# echoes back (events, `kubectl describe`), or a log line -- the value's ONLY
# existence outside the target Secret is the tmpfs file, which is destroyed
# when the pod terminates.
#
# One `draw-entropy` initContainer per Job (per independently-keyed
# credential) runs FIRST, reads 32 bytes from `/dev/urandom`, hex-encodes them
# (64 hex chars, 256 bits -- more than double a UUIDv4's ~122 bits) and writes
# the result -- and, for the two SHARED credentials below, every templated
# config fragment that embeds it -- to the `entropy` tmpfs volume. Every
# later init/container in the SAME pod (one pod -> one shared entropy draw,
# same reasoning WP14 used for the pod UID, just sourced from a real CSPRNG
# instead) mounts that volume READ-ONLY and passes `--from-file=<key>=<path>`
# to `kubectl create secret generic` -- so the secret value is read by
# `kubectl` directly off a file descriptor and is NEVER an argv token, NEVER
# an env var, and NEVER printed. `kubectl create secret generic` does not
# echo `stringData` back to stdout on success either way.
#
# `draw-entropy` is the ONLY container in this manifest with a shell
# (`busybox`, pinned by tag AND digest below -- it needs `/bin/sh`, `head`,
# `od`, `tr`, `cat`; the pinned `kubectl` image is deliberately shell-less so
# there is exactly one place in this file capable of running arbitrary shell,
# and that place never touches the apiserver: it carries no ServiceAccount
# token mount capability beyond what the pod already has, and its own RBAC
# grant, like every container here, is `create` on `secrets` only).
#
# RBAC is a Role PER NAMESPACE, `verbs: ["create"]` on `secrets` ONLY -- no
# `get`, no `list`, no `update`, no `delete`. A ServiceAccount can create
# exactly the one named Secret shape in exactly the namespace(s) its own
# credential touches, and nothing else.
#
# Namespaces are declared HERE, self-contained, even where another bootstrap
# file also creates one (`openziti-namespace.yaml` creates `openziti`) --
# `internal-secret-seeding.yaml` sorts BEFORE `openziti-namespace.yaml` in the
# k3s deploy controller's lexical submission order (see
# `k3s-first-boot-apply-order-eval-test.nix`), so a Role scoped to `openziti`
# needs the namespace to already exist within THIS file's own apply, not a
# later one. Namespace creation is idempotent; the duplication costs nothing.
#
# ── JOB POD LIFETIME ─────────────────────────────────────────────────────
# `ttlSecondsAfterFinished: 300` (tightened from WP14's 86400): a completed
# Job's pod is exactly the object that could leak a v4-UUID-derived secret via
# `kubectl describe`/events, so it should not linger. Under the CSPRNG design
# above the pod no longer carries the secret value in its spec at all, but the
# tighter TTL is kept anyway -- defense in depth, and a completed seed Job's
# pod has no further use five minutes after `kubectl create` exits.
#
# NEVER LOGGED: no container here prints the drawn value. `kubectl create
# secret generic` does not echo `stringData` back to stdout on success, and
# `draw-entropy`'s script never `echo`s or `cat`s the value to its own stdout.

apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: openziti
---
apiVersion: v1
kind: Namespace
metadata:
  name: opensearch
---
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: v1
kind: Namespace
metadata:
  name: object-store
---
apiVersion: v1
kind: Namespace
metadata:
  name: loki
---
apiVersion: v1
kind: Namespace
metadata:
  name: mimir
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: v1
kind: Namespace
metadata:
  name: redis
---
apiVersion: v1
kind: Namespace
metadata:
  name: orleans

# ═════════════════════════════ grafana-admin-credentials ════════════════════
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seed-grafana-admin
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-grafana-admin
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-grafana-admin
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-grafana-admin
subjects:
  - kind: ServiceAccount
    name: seed-grafana-admin
    namespace: monitoring
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-grafana-admin
  namespace: monitoring
  annotations:
    zeta.io/metal-first-boot-secret-seed: "true"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: seed-grafana-admin
      restartPolicy: Never
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: kubecache
          emptyDir: {}
        - name: entropy
          emptyDir: { medium: Memory }
      initContainers:
        - name: draw-entropy
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /work/admin-password
          volumeMounts:
            - { name: entropy, mountPath: /work }
      containers:
        - name: seed
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
            # kube-prometheus-stack's `grafana.admin.existingSecret` reader --
            # see DEV_GRAFANA_ADMIN_SECRET in dev-cluster/lib.ts.
            - { name: entropy, mountPath: /work, readOnly: true }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - grafana-admin-credentials
            - -n
            - monitoring
            - --from-literal=admin-user=admin
            - --from-file=admin-password=/work/admin-password

