# Metal first-boot INTERNAL secret seeding — WP14 (081M343EEP8087G0R000BAF6QF).
#
# ── THE GAP THIS CLOSES ──────────────────────────────────────────────────────
# `first-boot-replica.ts` run 35700790207 (real NixOS k3s roster, in Docker,
# ArgoCD syncing `k8s/applications/`) found `CreateContainerConfigError` for
# hindsight, loki, mimir and opensearch -- all a missing Secret. Tracing every
# `*existingSecret` / `secretKeyRef` / `envFrom` the AUTO-SYNCED catalog names
# (see the table in `full-ai-cluster/INJECTION-POINTS.md` "Metal internal
# secret seeding"), six credentials are INTERNAL (random values used only
# BETWEEN in-cluster components -- never operator-supplied) and NOTHING on a
# real metal/USB install ever creates them:
#
#   grafana-admin-credentials   monitoring   kube-prometheus-stack admin login
#   ziti-admin-credentials      openziti     OpenZiti controller admin login
#   opensearch-admin-credentials opensearch  OPENSEARCH_INITIAL_ADMIN_PASSWORD
#   forgejo-initial-admin       forgejo      Forgejo init-container admin acct
#   zeta-blob-store             object-store, loki, mimir, gitlab (ONE value)
#   redis-auth                  redis, orleans (ONE value)                 -- orleans replicas
#                                                                              are 0 today, so
#                                                                              this is not yet
#                                                                              live there, but the
#                                                                              redis Application
#                                                                              itself needs it now
#
# `src/Core.TypeScript/cluster/dev-cluster/lib.ts` already mints every one of
# these for dev/CI (`DEV_BOOTSTRAP_SECRETS` + `DEV_SHARED_SECRETS` minus
# `DEV_HINDSIGHT_LLM_SECRET`, which is EXTERNAL -- a real LLM API key, not a
# credential this cluster can draw for itself; see INJECTION-POINTS.md for
# that gap and the `ghcr-pull` gap, both operator-supplied and already
# tracked). This file is the METAL twin: same names, same namespaces, same
# key shapes (cross-checked against `dev-cluster/lib.ts` by
# `internal-secret-seeding.test.ts` so the two cannot silently drift), applied
# by the k3s first-boot manifest roster (`nixos/modules/k3s-server.nix`)
# BEFORE ArgoCD exists, so every Secret is already in place the moment the
# consuming Application syncs.
#
# ── MECHANISM: NO SHELL, NO NEW IMAGE, GET-THEN-CREATE REPLACED BY CREATE-ONLY ─
# `registry.k8s.io/kubectl:v1.32.3` is already pinned and vetted in this repo
# (`k8s/applications/hat-system/gatekeeper-crd-wait.yaml`) and is distroless --
# `ENTRYPOINT ["/bin/kubectl"]`, no shell, no `cp`, no `sh -c`. That rules out
# the obvious `kubectl get secret X || kubectl create secret X` idiom, and
# ruled out every image already resolvable/provenance-ledgered in this tree
# offering a shell (introducing a brand new image would need a fresh
# `image-resolvability.json` / `image-source-provenance.json` entry, both
# MEASURED-not-guessed files this change should not have to touch).
#
# The fix is that a conditional GET was never required: `kubectl create` (not
# `apply`, not `replace`) FAILS on an existing object instead of overwriting
# it -- which is exactly "mint only if absent, never overwrite". Each Job
# below runs ONCE per cluster lifetime (the k3s deploy controller re-applies
# the SAME unchanged Job object on every reboot, which is a no-op -- it never
# recreates a Job whose name it already wrote to etcd), so the ordinary case
# never even reaches the AlreadyExists path; if it ever does (a manual re-run
# after manifest surgery, say), the container fails loudly and the existing
# Secret is untouched, which is the safe outcome, not a bug.
#
# RANDOMNESS, WITHOUT A SHELL AND WITHOUT `/dev/urandom`: each Job's pod UID
# (`metadata.uid`, a server-generated v4 UUID, ~122 bits of entropy) is
# injected via the Downward API into an env var, and Kubernetes' native
# `$(VAR_NAME)` command/arg expansion (kubelet substitutes this BEFORE exec --
# https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/,
# no shell involved) splices it into `--from-literal=...=$(VAR)`. One POD per
# independently-keyed credential, because every container in a pod shares that
# pod's one UID -- so a shared credential (`zeta-blob-store`, `redis-auth`)
# uses MULTIPLE CONTAINERS in ONE pod (same UID -> same value in every
# namespace), and each independent credential gets its OWN Job (own pod, own
# UID, own value). Never logged, never written to the tree, never repeated
# across two credentials by construction.
#
# RBAC is a Role PER NAMESPACE, `verbs: ["create"]` on `secrets` ONLY -- no
# `get`, no `list`, no `update`, no `delete`. A ServiceAccount can create
# exactly the one named Secret shape in exactly the namespace(s) its own
# credential touches, and nothing else.
#
# Namespaces are declared HERE, self-contained, even where another bootstrap
# file also creates one (`openziti-namespace.yaml` creates `openziti`) --
# `internal-secret-seeding.yaml` sorts BEFORE `openziti-namespace.yaml` in the
# k3s deploy controller's lexical submission order (see
# `k3s-first-boot-apply-order-eval-test.nix`), so a Role scoped to `openziti`
# needs the namespace to already exist within THIS file's own apply, not a
# later one. Namespace creation is idempotent; the duplication costs nothing.
#
# NEVER LOGGED: no container here prints the drawn value. `kubectl create
# secret generic` does not echo `stringData` back to stdout on success.

apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: openziti
---
apiVersion: v1
kind: Namespace
metadata:
  name: opensearch
---
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: v1
kind: Namespace
metadata:
  name: object-store
---
apiVersion: v1
kind: Namespace
metadata:
  name: loki
---
apiVersion: v1
kind: Namespace
metadata:
  name: mimir
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: v1
kind: Namespace
metadata:
  name: redis
---
apiVersion: v1
kind: Namespace
metadata:
  name: orleans

# ═════════════════════════════ grafana-admin-credentials ════════════════════
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seed-grafana-admin
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-grafana-admin
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-grafana-admin
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-grafana-admin
subjects:
  - kind: ServiceAccount
    name: seed-grafana-admin
    namespace: monitoring
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-grafana-admin
  namespace: monitoring
  annotations:
    zeta.io/metal-first-boot-secret-seed: "true"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: seed-grafana-admin
      restartPolicy: Never
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: kubecache
          emptyDir: {}
      containers:
        - name: seed
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
            # kube-prometheus-stack's `grafana.admin.existingSecret` reader --
            # see DEV_GRAFANA_ADMIN_SECRET in dev-cluster/lib.ts.
            - name: ADMIN_PASSWORD
              valueFrom:
                fieldRef: { fieldPath: metadata.uid }
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - grafana-admin-credentials
            - -n
            - monitoring
            - --from-literal=admin-user=admin
            - --from-literal=admin-password=$(ADMIN_PASSWORD)

