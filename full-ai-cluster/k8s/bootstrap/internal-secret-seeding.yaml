# ═════════════════════════════ opensearch-admin-credentials ═════════════════
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seed-opensearch-admin
  namespace: opensearch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-opensearch-admin
  namespace: opensearch
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-opensearch-admin
  namespace: opensearch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-opensearch-admin
subjects:
  - kind: ServiceAccount
    name: seed-opensearch-admin
    namespace: opensearch
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-opensearch-admin
  namespace: opensearch
  annotations:
    zeta.io/metal-first-boot-secret-seed: "true"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: seed-opensearch-admin
      restartPolicy: Never
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: kubecache
          emptyDir: {}
        - name: entropy
          emptyDir: { medium: Memory }
      initContainers:
        - name: draw-entropy
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          command: ["/bin/sh", "-c"]
          args:
            # WP19c (081M34QTS06087G0R0015D7X5W): a pure lowercase-hex password
            # -- this file's shape for every OTHER credential -- deterministically
            # FAILS OpenSearch Security's own admin-password strength check.
            # `install_demo_configuration.sh` (org.opensearch.security.tools.
            # democonfig.Installer) validates against
            # `(?=.*[A-Z])(?=.*[^a-zA-Z\d])(?=.*[0-9])(?=.*[a-z]).{8,}` --
            # uppercase AND a non-alphanumeric special character are BOTH
            # required, and `od -An -tx1` can never produce either (its
            # alphabet is exactly `0-9a-f`). Measured directly: run 35744676325
            # captured the container's own `--previous` log via stage 8's
            # `collectCrashLoopDiagnostics` --
            #   "Password <64 lowercase hex chars> failed validation:
            #   \"Password does not match validation regex\" ... must contain
            #   at least one uppercase letter, one lowercase letter, one
            #   digit, and one special character" -- and the entrypoint exits
            # non-zero right after, which is the crash loop
            # opensearch-cluster-master-0 was stuck in on EVERY boot, power
            # cut or not (docs.opensearch.org/latest/security/configuration/
            # demo-configuration/; opensearch-project/security#4081 records
            # the demo installer's validation as its own, separate from the
            # runtime plugins.security.restapi.password_validation_regex
            # setting). FIXED BY MINTING A COMPLIANT CREDENTIAL, NOT BY
            # WEAKENING OPENSEARCH'S POSTURE -- same discipline this repo's
            # own Application.yaml precedent already named for the missing-
            # password issue that preceded this one.
            #
            # Two extra CSPRNG bytes, each hex-mapped through a 16-symbol
            # target alphabet via `tr` (bijective, no entropy lost) to
            # GUARANTEE one uppercase letter and one special character are
            # present -- never left to chance the way relying on the body's
            # own alphabet would. The 31-byte (248-bit) hex body keeps digit
            # and lowercase coverage the same way every other secret here
            # does (astronomically likely already; not the failure mode being
            # fixed). `cat` concatenates with no separator -- none of the
            # three files carries a trailing newline (`tr -d ' \n'` strips
            # `od`'s own).
            - |
              set -eu
              head -c 1 /dev/urandom | od -An -tx1 | tr -d ' \n' | tr '0123456789abcdef' 'ABCDEFGHIJKLMNOP' > /work/admin-password-upper
              head -c 1 /dev/urandom | od -An -tx1 | tr -d ' \n' | tr '0123456789abcdef' '!@#$%^&*()-_=+.,' > /work/admin-password-special
              head -c 31 /dev/urandom | od -An -tx1 | tr -d ' \n' > /work/admin-password-body
              cat /work/admin-password-upper /work/admin-password-special /work/admin-password-body > /work/admin-password
          volumeMounts:
            - { name: entropy, mountPath: /work }
      containers:
        - name: seed
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
            # OpenSearch >= 2.12 refuses to boot with the security plugin on
            # and no OPENSEARCH_INITIAL_ADMIN_PASSWORD -- see
            # DEV_OPENSEARCH_ADMIN_SECRET in dev-cluster/lib.ts.
            - { name: entropy, mountPath: /work, readOnly: true }
          command: ["/bin/kubectl"]
          args:
            - create
            - secret
            - generic
            - opensearch-admin-credentials
            - -n
            - opensearch
            - --from-literal=admin-user=admin
            - --from-file=admin-password=/work/admin-password

