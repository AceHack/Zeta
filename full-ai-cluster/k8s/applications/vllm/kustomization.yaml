# Kustomize base for the `vllm` Application. It lists exactly the manifests the Application's old
# `directory.include` applied, and exists so the install-time storage profile can patch the
# `vllm-cache` claim's size through the Application's `spec.source.kustomize.patches`
# (full-ai-cluster/k8s/storage-profile/, docs/ops/INSTALL-TIME-CONFIG.md row 29).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
