# Open Policy Agent (Gatekeeper) — admission policy.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
  name: open-policy-agent
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://open-policy-agent.github.io/gatekeeper/charts
    chart: gatekeeper
    # 3.18.1 -> 3.23.1 on 2026-09-01. Rendered at BOTH versions with this
    # Application's own valuesObject: no value stopped taking effect and no
    # resource was removed. Safe as an INSTALL version -- see the batch PR for
    # why a fresh cluster does not walk this chart's upgrade path.
    targetRevision: 3.23.1
    helm:
      releaseName: gatekeeper
      valuesObject:
        replicas: 1   # single control-plane node; bump for HA once workers exist
        controllerManager:
          metricsPort: 8888
          # Never let admission control touch system/infra namespaces — these
          # carry the control plane, CNI, storage and GitOps that gatekeeper
          # itself depends on. Defence-in-depth alongside the fail-open policy.
          exemptNamespaces:
            - kube-system
            - kube-node-lease
            - kube-public
            - gatekeeper-system
            - cilium
            - longhorn-system
            - argocd
            - zeta-platform   # platform control plane (portal + controller); carries the gatekeeper ignore label
            - flowdent        # tenant workload namespace (Flowdent services + db)
        # FAIL-OPEN, not fail-closed. With failurePolicy: Fail the validating
        # webhook intercepts EVERY write cluster-wide — including k3s's own
        # cluster-scoped CRD updates (e.g. addons.k3s.cattle.io). If gatekeeper
        # has no ready endpoints (pods still starting, or any outage) those
        # writes are rejected and k3s aborts controller startup → the whole
        # control plane crash-loops. Observed on node-09485d (2026-06-07): 41
        # k3s restarts in 10 min, API permanently 503, cluster bricked. A
        # policy engine must never be able to take down the API server, so it
        # fails OPEN (admit when the engine is unreachable). Namespaced policy
        # enforcement still applies whenever gatekeeper is up (the normal case).
        validatingWebhookFailurePolicy: Ignore
        mutatingWebhookFailurePolicy: Ignore
        # THE THIRD WEBHOOK, WHICH THE TWO KEYS ABOVE DO NOT REACH.
        #
        # The stated guarantee above -- "a policy engine must never be able to
        # take down the API server, so it fails OPEN" -- was FALSE for the one
        # webhook that gates namespace creation, and false in the direction the
        # node-09485d incident is cited to prevent.
        #
        # The chart ships THREE webhooks in its ValidatingWebhookConfiguration.
        # `validatingWebhookFailurePolicy` sets the first two. The third,
        # `check-ignore-label.gatekeeper.sh`, reads its own key --
        # `validatingWebhookCheckIgnoreFailurePolicy` -- which the chart
        # defaults to `Fail`, and which nothing in this tree overrode. Its rules
        # are core apiGroup, `resources: [namespaces]`, `operations: [CREATE,
        # UPDATE]`, `scope: '*'`, with a namespaceSelector that excludes only
        # the release namespace.
        #
        # WHY THAT IS A COLD-BOOT PROBLEM SPECIFICALLY. Gatekeeper is sync-wave
        # -25. Once its ValidatingWebhookConfiguration lands but before its pods
        # are Ready, a `Fail` policy makes the API server REJECT every namespace
        # CREATE cluster-wide -- and `CreateNamespace=true` is on the root sync
        # options plus ~40 Applications, with explicit Namespace documents at
        # waves at or above -25. `controllerManager.exemptNamespaces` does not
        # help: those become --exempt-namespace process flags, not webhook
        # selectors, so they cannot admit anything while the process is down.
        #
        # HONEST BOUND: this is a WINDOW, and ArgoCD retries, so a cold cluster
        # may well converge through it. What is not in doubt is that the
        # property this file states in prose was not the property it configured.
        # Setting it costs nothing when gatekeeper is up -- the Constraints all
        # scope to society.zeta.io Hat/HatBinding, so nothing else is being
        # policed by this webhook anyway.
        validatingWebhookCheckIgnoreFailurePolicy: Ignore
  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
