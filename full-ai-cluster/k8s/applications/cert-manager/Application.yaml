# cert-manager — TLS cert provisioning for the cluster.
# Installed by K3S at bootstrap (BEFORE Vault — Vault needs TLS
# certs for its API). ArgoCD then adopts and reconciles ongoing.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
    # OPT-IN HEALTH GATING (081M33T23ZQ087G0R002ZYRHDG). cert-manager provides
    # cert-manager.io/acme.cert-manager.io CRDs genuinely consumed by later
    # waves (openziti-controller's Certificates/Issuers, platform's
    # ClusterIssuer, trust-manager's Bundle sourcing). Verified metal-safe:
    # zero Secret/existingSecret references anywhere in this Application, not
    # declared manual-sync, self-issues its own webhook CA (no external
    # credential), and bootstrap-installed (cert-manager-install.yaml applies
    # it before ArgoCD exists, so it has a long head start to be Ready).
    zeta.io/gates-later-waves: "true"
  name: cert-manager
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    # v1.16.2 -> v1.21.1 on 2026-09-01. Rendered at BOTH versions with this
    # Application's own valuesObject; it loses only Role/RoleBinding cert-manager-tokenrequest. The SIX CRDs the first
    # diff called removed were a FALSE POSITIVE: the newer chart quotes metadata.name
    # and the older does not, so an unstripped compare read every quoted resource as
    # removed-and-re-added. All six render at both versions.
    targetRevision: v1.21.1
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
        # Enable the Gateway API integration so cert-manager can solve ACME
        # HTTP-01 via http01.gatewayHTTPRoute and auto-provision certs for
        # Gateway listeners (zeta-public-gateway → portal-tls, install-time; see k8s/public-tls/). Requires the Gateway
        # API CRDs. Cilium does NOT ship them (gatewayAPI.enabled consumes them).
        # Metal first-boot applies full-ai-cluster/k8s/bootstrap/gateway-api-crds.yaml
        # as aa-gateway-api-crds. Kind --cni cilium and k3d bring-up apply the
        # same file. Without it, cert-manager crash-loops
        # "the Gateway API CRDs do not seem to be present".
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          kind: ControllerConfiguration
          enableGatewayAPI: true
        replicaCount: 1
        # LIVENESS STALL TOLERANCE (081M3TS67PE087G0R002ZZ1XYT). Chart defaults:
        # controller timeout 15s x 8 failures (kill budget 80s, just under the
        # 120s floor); webhook timeout 1s x 3 failures (a RUNNING webhook is
        # killed after 21s of slow /livez). The constrained first-boot replica
        # (run 36685251210) measured cert-manager-webhook in CrashLoopBackOff
        # and the controller/cainjector restarting; every Certificate and
        # webhook in the roster waits on these. Controller: 12 failures ->
        # budget 10+11*10 = 120s. Webhook keeps its 60s startup delay; timeout
        # 5s x 8 failures -> budget 60+7*10 = 130s, stall tolerance 75s.
        livenessProbe:
          enabled: true
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 15
          successThreshold: 1
          failureThreshold: 12
        webhook:
          replicaCount: 1
          livenessProbe:
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 8
        cainjector:
          replicaCount: 1
        prometheus:
          enabled: true
          servicemonitor:
            enabled: false   # enabled once kube-prometheus-stack lands
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # CRDs precious — no prune
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
