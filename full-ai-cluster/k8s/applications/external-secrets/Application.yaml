# External Secrets Operator (ESO) — sync secrets from Vault (and
# other external stores) into Kubernetes Secrets for consumption
# by workloads that can't natively talk to Vault.
#
# Pairs with Vault: ESO's ClusterSecretStore points at the Vault
# service, and workloads declare ExternalSecret CRs that ESO
# materializes as Kubernetes Secret objects.
#
# Installed AFTER Vault is healthy (ESO needs a working Vault to
# sync from).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
  name: external-secrets
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # 0.10.7 -> 2.10.0 on 2026-09-01. Rendered at BOTH versions with this
    # Application's own valuesObject: no value stopped taking effect and no
    # resource was removed. Safe as an INSTALL version -- see the batch PR for
    # why a fresh cluster does not walk this chart's upgrade path.
    targetRevision: 2.10.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        resources:
          requests: { cpu: 25m, memory: 96Mi }
        replicaCount: 1
        # ESSENTIAL TIER: `system-cluster-critical`, a built-in class (it exists on every
        # substrate, so there is no apply-order hazard) that outranks the default priority 0
        # every optional app runs at. Under node pressure the scheduler preempts for, and the
        # kubelet declines to evict, external-secrets (all three Deployments; the webhook gates every ExternalSecret) before any optional workload.
        # Pinned by cluster/essential-priority.test.ts.
        priorityClassName: system-cluster-critical
        webhook:
          priorityClassName: system-cluster-critical
          replicaCount: 1
          resources:
            requests: { cpu: 10m, memory: 48Mi }
        certController:
          priorityClassName: system-cluster-critical
          replicaCount: 1
          resources:
            requests: { cpu: 10m, memory: 48Mi }
        # ClusterSecretStore for Vault (lands as a separate manifest
        # after vault + ESO are both healthy):
        #   apiVersion: external-secrets.io/v1        <- v1, NOT v1beta1: at the pinned
        #                                                  2.10.0 v1beta1 is `served: false`,
        #                                                  so a v1beta1 object is refused.
        #   kind: ClusterSecretStore
        #   metadata: { name: vault-backend }
        #   spec:
        #     provider:
        #       vault:
        #         server: "https://vault.vault.svc.cluster.local:8200"
        #         path: "secret"
        #         version: "v2"
        #         auth:
        #           kubernetes:
        #             mountPath: "kubernetes"
        #             role: "external-secrets"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
