# Dapr — distributed actor runtime #3.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: dapr
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://dapr.github.io/helm-charts/
    chart: dapr
    # 1.14.4 -> 1.18.3 on 2026-09-01. Rendered at BOTH versions with this
    # Application's own valuesObject: no value stopped taking effect and no
    # resource was removed. Safe as an INSTALL version -- see the batch PR for
    # why a fresh cluster does not walk this chart's upgrade path.
    targetRevision: 1.18.3
    helm:
      releaseName: dapr
      valuesObject:
        global:
          ha: { enabled: false }   # bump once multi-control-plane
        dapr_placement:
          replicaCount: 1
          resources:
            requests: { cpu: 25m, memory: 64Mi }
        dapr_operator:
          resources:
            requests: { cpu: 50m, memory: 96Mi }
        dapr_sentry:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
        dapr_sidecar_injector:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
        dapr_scheduler:
          resources:
            requests: { cpu: 25m, memory: 128Mi }
        # Actors persistence: configure a Redis/CockroachDB state
        # store via a Dapr Component once those land. Example:
        # configuration:
        #   metricSpec:
        #     enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: dapr-system
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .status.terminatingReplicas
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
