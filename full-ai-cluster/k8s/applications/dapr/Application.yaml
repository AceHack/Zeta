# Dapr — distributed actor runtime #3.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: dapr
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://dapr.github.io/helm-charts/
    chart: dapr
    # 1.14.4 -> 1.18.3 on 2026-09-01. Rendered at BOTH versions with this
    # Application's own valuesObject: no value stopped taking effect and no
    # resource was removed. Safe as an INSTALL version -- see the batch PR for
    # why a fresh cluster does not walk this chart's upgrade path.
    targetRevision: 1.18.3
    helm:
      releaseName: dapr
      valuesObject:
        global:
          ha: { enabled: false }   # bump once multi-control-plane
        # LIVENESS STALL TOLERANCE (081M3TS67PE087G0R002ZZ1XYT). Every dapr control-plane
        # component renders `initialDelaySeconds: 180, periodSeconds: 10,
        # failureThreshold: 5` and the chart templates expose NO timeoutSeconds, so a
        # RUNNING pod is killed after (5-1)*10+1 = 41s of slow /healthz answers. The
        # constrained first-boot replica (run 36685251210, 4 vCPU) logged kubelet kills
        # of dapr-operator, dapr-sentry and a dapr-scheduler-server replica. The one
        # lever the chart gives is the threshold: 12 -> (12-1)*10+1 = 111s. The 180s
        # startup delay is the chart's own and is left alone.
        dapr_placement:
          replicaCount: 1
          resources:
            requests: { cpu: 10m, memory: 64Mi }
          livenessProbe:
            initialDelaySeconds: 180
            periodSeconds: 10
            failureThreshold: 12
        dapr_operator:
          resources:
            requests: { cpu: 25m, memory: 96Mi }
          livenessProbe:
            initialDelaySeconds: 180
            periodSeconds: 10
            failureThreshold: 12
        dapr_sentry:
          resources:
            requests: { cpu: 10m, memory: 64Mi }
          livenessProbe:
            initialDelaySeconds: 180
            periodSeconds: 10
            failureThreshold: 12
        dapr_sidecar_injector:
          resources:
            requests: { cpu: 10m, memory: 64Mi }
          livenessProbe:
            initialDelaySeconds: 180
            periodSeconds: 10
            failureThreshold: 12
        dapr_scheduler:
          resources:
            requests: { cpu: 10m, memory: 128Mi }
          livenessProbe:
            initialDelaySeconds: 180
            periodSeconds: 10
            failureThreshold: 12
        # Actors persistence: configure a Redis/CockroachDB state
        # store via a Dapr Component once those land. Example:
        # configuration:
        #   metricSpec:
        #     enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: dapr-system
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .status.terminatingReplicas
  syncPolicy:
    # Unbounded retry (limit -1, backoff capped at 5m). ArgoCD's automated-sync default is 5 attempts
    # (~2.5 min) and it never re-attempts a revision whose sync already failed, so a control-plane blip
    # longer than that strands the Application SyncFailed for good. Pinned for every automated
    # Application by src/Core.TypeScript/cluster/application-retry-unbounded.test.ts.
    retry:
      limit: -1
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
    automated: { prune: true, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
