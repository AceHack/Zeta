# Cilium — CNI + KPR + Hubble + Cilium Service Mesh + BPF MASQUERADE.
# Replaces K3S's default flannel + kube-proxy (disabled in k3s-server.nix).
# Istio removed — Cilium Service Mesh provides the same L7 capabilities
# (mTLS, traffic shifting, observability) natively atop the CNI.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
    # OPT-IN HEALTH GATING (081M33T23ZQ087G0R002ZYRHDG) — NOT ANNOTATED HERE,
    # AND THAT IS DELIBERATE, NOT AN OMISSION.
    #
    # Cilium IS a real CRD provider (cilium.io CRDs cilium-lb-ipam consumes:
    # CiliumLoadBalancerIPPool, CiliumL2AnnouncementPolicy) and would otherwise
    # be a strong gating candidate — it's the CNI-floor invariant every later
    # Application already assumes (derive-sync-waves.ts), zero Secret refs,
    # not manual-sync, bootstrap-installed.
    #
    # But static safety (no secrets, not manual-sync) is NOT the bar. The bar
    # is OBSERVED Healthy on the real bootstrap path (architect review, PR
    # #17477, 2026-09-22): the first-boot-replica.yml lane (real k3s in
    # Docker, src/Core.TypeScript/cluster/first-boot-replica.ts) showed only
    # 3 Applications after 480s on THIS branch while gating was on cilium —
    # argocd Healthy, cilium stuck Synced/Progressing, zeta-root
    # OutOfSync/Progressing — vs. ~50 on main ungated. Worse: even on main,
    # UNGATED, run 35696323545 showed the cilium Application itself staying
    # Synced/Progressing for 15+ minutes while every cilium pod was Running —
    # some child resource under gitops-engine's default Cilium health check
    # never reaches Ready even though the workload is up. Root cause not yet
    # identified; a separate investigation is tracking which resource.
    #
    # So: no gating annotation on cilium until that resource is found AND a
    # first-boot-replica run demonstrates cilium reaching real Healthy. See
    # the evidence table in crd-provider-consumer-order.ts
    # (GATING_EVIDENCE / requireObservedHealthyEvidence) — gating invariant
    # (d) now refuses this annotation on any app without a recorded
    # first-boot-replica PASS, so re-adding it here without that evidence
    # fails CI, not just review.
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    # 1.16.5 -> 1.20.1 on 2026-09-01. Rendered at BOTH versions with this
    # Application's own valuesObject; it loses only Endpoints/cilium-ingress. 1.16 reached EOL 2026-02-03 -- about seven
    # months with no security patches, on the CNI -- which is the reason to move.
    # Bootstrap HelmChart `cilium-install.yaml` matches this pin as of 2026-09-04
    # (no live cluster; first-boot may jump). Do not re-split once a cluster is running.
    targetRevision: 1.20.1
    helm:
      releaseName: cilium
      valuesObject:
        kubeProxyReplacement: true
        # Cluster identity for ClusterMesh, derived from the same `clusterName`
        # as the CIDR. Must match the bootstrap manifest or the two reconcilers
        # disagree about who this cluster IS.
        cluster:
          name: zeta
          id: 31
        k8sServiceHost: control-plane
        k8sServicePort: 6443
        # POD CIDR IS DERIVED. It must equal k3s' `--cluster-cidr`, which
        # `nixos/modules/k3s-server.nix` takes from `zeta.cluster.podCidr`, a
        # pure function of `clusterName` in `full-ai-cluster/cluster-identity.json`
        # (currently "zeta" -> 10.143.0.0/17). THIS FILE IS THE ONE THAT BITES: ArgoCD
        # reconciles it from git with selfHeal, so a stale value here is not a
        # disagreement, it is re-applied over the bootstrap manifest on every
        # sync. `nixos/modules/cluster-network.nix` asserts this file mentions
        # the derived value.
        ipam:
          mode: cluster-pool
          operator:
            clusterPoolIPv4PodCIDRList: [ "10.143.0.0/17" ]
            # EXPLICIT, in lockstep with the bootstrap HelmChart twin
            # (k8s/bootstrap/cilium-install.yaml) — see its comment. The
            # single-node --kubelet-arg=max-pods=220 budget in k3s-server.nix
            # / k3s-agent.nix relies on this node getting a /24 (254 usable
            # addresses) from cluster-pool IPAM, which is the chart default at
            # 1.20.1 but is now stated rather than inherited so a future chart
            # bump cannot shrink it out from under the pod-count budget.
            clusterPoolIPv4MaskSize: 24

        # BPF MASQUERADE (required by the spec).
        bpf:
          masquerade: true

        # Routing: native routing is faster than VXLAN encapsulation
        # when the underlying network supports it.
        routingMode: native
        ipv4NativeRoutingCIDR: "10.143.0.0/17"
        autoDirectNodeRoutes: true

        # L2 announcements: ARP-advertise LoadBalancer/externalIP addresses on the
        # LAN so type=LoadBalancer services (from cilium-lb-ipam) are actually
        # reachable. The CiliumL2AnnouncementPolicy (zeta-l2-announce) is inert
        # without this flag — LB IPs were assigned but unreachable on node-5b2dfa.
        l2announcements:
          enabled: true
        # L2 leader-election leases are API-heavy; raise the client rate limit
        # (Cilium docs recommendation when l2announcements is on).
        k8sClientRateLimit:
          qps: 50
          burst: 100

        # Hubble (observability + Hubble Relay + Hubble UI).
        hubble:
          enabled: true
          relay:
            enabled: true
          ui:
            enabled: true
          metrics:
            enabled:
              - dns
              - drop
              - tcp
              - flow
              - icmp
              - http
            enableOpenMetrics: true
            serviceMonitor:
              enabled: false   # enabled once kube-prometheus-stack lands

        operator:
          replicas: 1   # bump to 2 once a second control-plane exists

        # Cilium Service Mesh — L7-aware policy + mTLS + traffic
        # management without a sidecar (Envoy embedded in the
        # Cilium agent).
        l7Proxy: true
        envoy:
          enabled: true
        encryption:
          enabled: true
          type: wireguard      # node-to-node encryption
          nodeEncryption: true
        # Authentication via SPIRE workload identities (configured
        # after spire/Application.yaml is healthy).
        authentication:
          mutual:
            spire:
              enabled: false   # flip to true once SPIRE is up

        # Gateway API support — replaces the Istio Gateway role.
        gatewayAPI:
          enabled: true

        # Ingress controller — Cilium can serve as ingress directly,
        # removing the need for ingress-nginx as a separate workload.
        ingressController:
          enabled: true
          loadbalancerMode: shared
          default: true

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false   # never prune Cilium — too load-bearing
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
