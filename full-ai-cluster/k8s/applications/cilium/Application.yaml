# Cilium — CNI + KPR + Hubble + Cilium Service Mesh + BPF MASQUERADE.
# Replaces K3S's default flannel + kube-proxy (disabled in k3s-server.nix).
# Istio removed — Cilium Service Mesh provides the same L7 capabilities
# (mTLS, traffic shifting, observability) natively atop the CNI.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-80"
    # OPT-IN HEALTH GATING (081M33T23ZQ087G0R002ZYRHDG). Cilium provides
    # cilium.io CRDs cilium-lb-ipam consumes (CiliumLoadBalancerIPPool,
    # CiliumL2AnnouncementPolicy) and IS the pod-networking precondition every
    # later Application already assumes (the CNI-floor invariant in
    # derive-sync-waves.ts). Verified metal-safe: zero Secret/existingSecret
    # references anywhere in this Application (collectSecretReferences /
    # collectRawSecretReferences both empty), not declared manual-sync, and
    # bootstrap-installed (cilium-install.yaml applies it before ArgoCD
    # exists at all, so it has the longest possible head start to be Ready).
    # crd-provider-consumer-order.ts's gating invariants (a)/(b) check this
    # annotation stays justified.
    # UNGATED 2026-09-22 (architect): the first-boot replica (real k3s bootstrap path)
    # observed this Application Synced/PROGRESSING for 15+ min with every cilium pod
    # Running (run 35696323545), and with this gate on only 3 Applications synced in
    # 480s (PR #17477's replica run). A provider that is not OBSERVED to reach Healthy
    # must not gate every later wave. Re-add once the Progressing resource is found
    # (investigation: branch claude/why-argo-apps-stay-progressing).
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    # 1.16.5 -> 1.20.1 on 2026-09-01. Rendered at BOTH versions with this
    # Application's own valuesObject; it loses only Endpoints/cilium-ingress. 1.16 reached EOL 2026-02-03 -- about seven
    # months with no security patches, on the CNI -- which is the reason to move.
    # Bootstrap HelmChart `cilium-install.yaml` matches this pin as of 2026-09-04
    # (no live cluster; first-boot may jump). Do not re-split once a cluster is running.
    targetRevision: 1.20.1
    helm:
      releaseName: cilium
      valuesObject:
        kubeProxyReplacement: true
        # Cluster identity for ClusterMesh, derived from the same `clusterName`
        # as the CIDR. Must match the bootstrap manifest or the two reconcilers
        # disagree about who this cluster IS.
        cluster:
          name: zeta
          id: 31
        k8sServiceHost: control-plane
        k8sServicePort: 6443
        # POD CIDR IS DERIVED. It must equal k3s' `--cluster-cidr`, which
        # `nixos/modules/k3s-server.nix` takes from `zeta.cluster.podCidr`, a
        # pure function of `clusterName` in `full-ai-cluster/cluster-identity.json`
        # (currently "zeta" -> 10.143.0.0/17). THIS FILE IS THE ONE THAT BITES: ArgoCD
        # reconciles it from git with selfHeal, so a stale value here is not a
        # disagreement, it is re-applied over the bootstrap manifest on every
        # sync. `nixos/modules/cluster-network.nix` asserts this file mentions
        # the derived value.
        ipam:
          mode: cluster-pool
          operator:
            clusterPoolIPv4PodCIDRList: [ "10.143.0.0/17" ]
            # EXPLICIT, in lockstep with the bootstrap HelmChart twin
            # (k8s/bootstrap/cilium-install.yaml) — see its comment. The
            # single-node --kubelet-arg=max-pods=220 budget in k3s-server.nix
            # / k3s-agent.nix relies on this node getting a /24 (254 usable
            # addresses) from cluster-pool IPAM, which is the chart default at
            # 1.20.1 but is now stated rather than inherited so a future chart
            # bump cannot shrink it out from under the pod-count budget.
            clusterPoolIPv4MaskSize: 24

        # BPF MASQUERADE (required by the spec).
        bpf:
          masquerade: true

        # Routing: native routing is faster than VXLAN encapsulation
        # when the underlying network supports it.
        routingMode: native
        ipv4NativeRoutingCIDR: "10.143.0.0/17"
        autoDirectNodeRoutes: true

        # L2 announcements: ARP-advertise LoadBalancer/externalIP addresses on the
        # LAN so type=LoadBalancer services (from cilium-lb-ipam) are actually
        # reachable. The CiliumL2AnnouncementPolicy (zeta-l2-announce) is inert
        # without this flag — LB IPs were assigned but unreachable on node-5b2dfa.
        l2announcements:
          enabled: true
        # L2 leader-election leases are API-heavy; raise the client rate limit
        # (Cilium docs recommendation when l2announcements is on).
        k8sClientRateLimit:
          qps: 50
          burst: 100

        # Hubble (observability + Hubble Relay + Hubble UI).
        hubble:
          enabled: true
          relay:
            enabled: true
          ui:
            enabled: true
          metrics:
            enabled:
              - dns
              - drop
              - tcp
              - flow
              - icmp
              - http
            enableOpenMetrics: true
            serviceMonitor:
              enabled: false   # enabled once kube-prometheus-stack lands

        operator:
          replicas: 1   # bump to 2 once a second control-plane exists

        # Cilium Service Mesh — L7-aware policy + mTLS + traffic
        # management without a sidecar (Envoy embedded in the
        # Cilium agent).
        l7Proxy: true
        envoy:
          enabled: true
        encryption:
          enabled: true
          type: wireguard      # node-to-node encryption
          nodeEncryption: true
        # Authentication via SPIRE workload identities (configured
        # after spire/Application.yaml is healthy).
        authentication:
          mutual:
            spire:
              enabled: false   # flip to true once SPIRE is up

        # Gateway API support — replaces the Istio Gateway role.
        gatewayAPI:
          enabled: true

        # Ingress controller -- OFF, and this was the whole reason this Application
        # read Progressing forever on any install without a LoadBalancer range.
        #
        # `ingressController.enabled: true` renders Service kube-system/cilium-ingress,
        # `type: LoadBalancer`. ArgoCD's Service health (gitops-engine health_service.go)
        # is Progressing until `status.loadBalancer.ingress` is populated, and that needs a
        # Cilium LB-IPAM pool -- which is INSTALL-TIME configuration
        # (docs/ops/INSTALL-TIME-CONFIG.md row 3, k8s/lb-ipam/) and legitimately absent when
        # the operator supplied no range. So `cilium` -- the CNI, wave -80 -- was
        # Synced+Progressing with every one of its pods Running. MEASURED, three times:
        #   * k3d lane, run 35924216557: "every workload healthy (agent DS 1/1, operator 1/1),
        #     but the `cilium-ingress` LoadBalancer sat at EXTERNAL-IP <pending> for 42 min
        #     with `cilium-lb-pool: No resources found`" (k8s-lane-partition.yml records it).
        #   * first-boot replica, run 36831938019 (main, unconstrained): cilium
        #     `Synced`+`Progressing`, `conditions: []`, "no classified pod issue attributed".
        #   * WP11 installed disk, run 36832486494: cilium Synced+Progressing at t=3221s.
        # (An earlier hypothesis blamed an ExcludedResourceWarning on the cilium-ingress
        # EndpointSlice, workitem 081M3BF6P31, and argocd/Application.yaml stopped excluding
        # that kind. In run 36831938019 the warning is GONE -- `conditions: []` -- and cilium
        # is still Synced+Progressing with no pod to blame. The warning was a symptom of the
        # same Service, not the cause.)
        #
        # NOTHING USES IT. This tree exposes everything through Gateway API (gatewayAPI
        # above; platform/gateway.yaml; gitlab's `gitlab-lan` Gateway) and no Ingress of class
        # `cilium` exists: gitlab renders `ingress.enabled: false`, longhorn's is off. So the
        # Service spent one of the installer's few dozen LoadBalancer addresses on a listener
        # nobody dials -- the same waste game-hosting/gmod/service.yaml documents for
        # gmod-sftp, which is ClusterIP for that reason.
        #
        # Gateway API still gets its LoadBalancer Service (one per Gateway, created by the
        # operator, not rendered here), and THAT one is correctly Progressing-until-addressed:
        # it is the thing a pool exists for. Re-enable only together with an Ingress that needs
        # it AND a pool the lane can supply. k8s/bootstrap/cilium-install.yaml carries the same
        # value (they share a Helm release; cilium-ingress-disabled.test.ts pins both).
        ingressController:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # WP26 (081M38GCTFX087G0R003MMTXJE) -- THE SAME `randAlphaNum`-CLASS DRIFT
  # weaviate/Application.yaml already fixed, for cilium's own three
  # self-signed-TLS Secrets. MEASURED offline (no cluster involved, same
  # method as weaviate's own investigation): rendered this Application's own
  # valuesObject against chart 1.20.1 TWICE and diffed. `cilium-ca`
  # (ca.crt/ca.key), `hubble-relay-client-certs` (ca.crt/tls.crt/tls.key) and
  # `hubble-server-certs` (ca.crt/tls.crt/tls.key) differ completely between
  # the two renders -- fresh self-signed CA + leaf certs every invocation.
  # Everything else rendered is otherwise unaffected.
  #
  # LIVE CONFIRMATION (run 35965954133): the application-controller's own log
  # shows repeated partial self-heal syncs -- `SelfHealAttemptsCount` at 7 and
  # climbing -- touching ONLY these three Secrets every cycle ("Tasks
  # (dry-run)" listing exactly `Secret:cilium-ca`, `Secret:
  # hubble-relay-client-certs`, `Secret:hubble-server-certs`, nothing else),
  # each one logged `serverside-applied` then immediately re-triggering
  # "Requesting app refresh caused by object update". This is the mechanism
  # holding the Application at Progressing/OutOfSync-on-a-loop even though
  # every DaemonSet/Deployment reads Healthy by the book (generation ==
  # observedGeneration, every replica Ready -- checked directly, run
  # 35954645236) with no pod-level crash-loop anywhere.
  #
  # SAME REMEDY weaviate already uses, same vendor citation (argo-cd
  # docs/user-guide/diffing.md: "A Helm chart is using a template function
  # such as `randAlphaNum` ... `ignoreDifferences` is the mechanism it names
  # for it"). Scoped to exactly these three Secrets' `/data` keys -- nothing
  # else in this chart's output is affected. `RespectIgnoreDifferences` does
  # NOT require dropping ServerSideApply (weaviate's own Application.yaml
  # comment already established this from the sync.go source, unrelated to
  # apply mode), so ServerSideApply stays on here.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: cilium-ca
      jsonPointers:
        - /data/ca.crt
        - /data/ca.key
    - group: ""
      kind: Secret
      name: hubble-relay-client-certs
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - group: ""
      kind: Secret
      name: hubble-server-certs
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
  syncPolicy:
    automated:
      prune: false   # never prune Cilium — too load-bearing
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
