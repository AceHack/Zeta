# full-ai-cluster/k8s/applications/argocd/Application.yaml
#
# ArgoCD self-management. ArgoCD was already installed by the K3S
# bootstrap manifests (full-ai-cluster/k8s/bootstrap/argocd-install.yaml);
# this Application adopts the existing installation so subsequent
# chart upgrades / value tweaks land via git → ArgoCD instead of
# requiring a bootstrap-manifest edit + K3S server restart.
#
# Sync wave -90: must be in the EARLY wave so ArgoCD reconciles
# itself before reconciling other apps. If a chart bump here would
# break ArgoCD, having it land first means downstream apps don't
# get half-reconciled by a broken ArgoCD mid-wave.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-90"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    # Keep aligned with full-ai-cluster/k8s/bootstrap/argocd-install.yaml
    # `spec.version`. A drift between the bootstrap version and this
    # self-management version would cause ArgoCD to immediately try to
    # downgrade/upgrade itself on first reconcile — wedge risk in the
    # earliest sync wave.
    #
    # 7.7.10 -> 10.6.0 on 2026-09-01 (ArgoCD v2.13.2 -> v3.5.2), moved in the SAME
    # commit as the bootstrap pin for exactly the reason above. The render
    # evidence lives beside that pin rather than being restated here, so there is
    # one copy of it to go stale.
    # 10.7.0 -> 10.7.2 on 2026-09-04: a PURE CHART bump -- appVersion is v3.5.2 at both,
    # checked against the live repo index, so ArgoCD itself does not move. All FOUR pin sites
    # move together (this Application, k8s/bootstrap/argocd-install.yaml, and the kind and k3d
    # bootstraps in dev-cluster/use-cases.ts) because 2026-09-03 made them EQUAL on purpose: a
    # bootstrap behind the self-managed Application means a mid-run self-upgrade, which is
    # exactly the failure that cached the seaweedfs manifest error.
    targetRevision: 10.8.0
    helm:
      releaseName: argocd
      valuesObject:
        # Mirror the bootstrap values so adopting this Application is
        # a no-op transition. Subsequent value changes happen here.
        global:
          domain: argocd.zeta.local
        server:
          service:
            type: ClusterIP   # ingress lands separately
        configs:
          params:
            server.insecure: true   # TLS terminated upstream once ingress lands
          cm:
            # MUST STAY IN LOCKSTEP with `configs.cm` in
            # full-ai-cluster/k8s/bootstrap/argocd-install.yaml AND THE OTHER
            # DECLARED CLUSTER TREE'S mirrored bootstrap file
            # (audit-argocd-pin-parity.ts's own HELMCHART_PIN_FILES roster,
            # via declared-cluster-trees.ts -- not spelled out by path here on
            # purpose: that second tree is the stale one 081M00QCHWA087G0R000GKKRXD
            # is retiring, and cluster-tree-consumers.json refuses a NEW
            # literal reference to it from a full-ai-cluster manifest) -- see
            # the full explanation on the full-ai-cluster bootstrap copy (the OPT-IN
            # redesign, 081M33T23ZQ087G0R002ZYRHDG: gating on EVERY
            # Application converts one never-Healthy app -- platform's
            # unminted ghcr-pull, openbao's sealed state, any manual-sync app
            # -- into a whole-cluster stall). Restores Application-CRD health
            # assessment (removed upstream in ArgoCD 1.8; argo-cd
            # docs/operator-manual/upgrading/1.7-1.8.md, quoted verbatim
            # inside the annotation guard below), which sync-wave gating for
            # Applications annotated `zeta.io/gates-later-waves: "true"`
            # depends on. `audit-argocd-pin-parity.ts`'s health-lua parity
            # check fails on drift across all three copies.
            resource.customizations.health.argoproj.io_Application: |
              hs = {}
              hs.status = "Healthy"
              hs.message = "non-gating: health not propagated to wave ordering (zeta.io/gates-later-waves not set)"
              if obj.metadata ~= nil and obj.metadata.annotations ~= nil and obj.metadata.annotations["zeta.io/gates-later-waves"] == "true" then
                -- Upstream lua, verbatim, from argo-cd docs/operator-manual/upgrading/1.7-1.8.md.
                hs.status = "Progressing"
                hs.message = ""
                if obj.status ~= nil then
                  if obj.status.health ~= nil then
                    hs.status = obj.status.health.status
                    if obj.status.health.message ~= nil then
                      hs.message = obj.status.health.message
                    end
                  end
                end
              end
              return hs
            # WP26 follow-up (081M38GCTFX087G0R003MMTXJE): the chart's OWN
            # default `resource.exclusions` (argo-cd/values.yaml, this
            # chart's pinned version) excludes `discovery.k8s.io/
            # {Endpoints,EndpointSlice}` for a stated reason: "never child
            # objects of managed resources that need to be presented in the
            # resource tree." cilium is the ONE Application in this
            # 42-app roster where that assumption does not hold -- MEASURED:
            # cilium is the only app (of 42, most of which also own a
            # Service and therefore an EndpointSlice) whose
            # `status.conditions` carries
            # `ExcludedResourceWarning: Resource discovery.k8s.io/
            # EndpointSlice cilium-ingress is excluded in the settings`, and
            # cilium is the app that reads `health=Progressing with no
            # classified pod issue attributed to it` in every triggered
            # first-boot-replica run -- every DaemonSet/Deployment it owns
            # reads Healthy by the book (generation==observedGeneration,
            # every replica Ready, zero restarts) with nothing else to
            # explain the stuck health.
            #
            # HONEST REGISTER: this override is a well-evidenced HYPOTHESIS,
            # not a proven fix -- gitops-engine's `state.go` removes excluded
            # resources from `targetObjs` BEFORE health aggregation runs, so
            # the causal path from "excluded" to "stuck Progressing" is not
            # confirmed at the source level; only the correlation (unique
            # among 42 apps, present in every run) is. Re-including
            # `discovery.k8s.io/EndpointSlice` in ArgoCD's tracking is the
            # cheapest way to let the replica lane's own live evidence
            # settle it: if cilium reaches Healthy, the hypothesis holds; if
            # it reads a genuinely unhealthy EndpointSlice instead, that is
            # still strictly better than the current unattributable silence;
            # if neither changes, this override should be reverted.
            #
            # `Endpoints` (the deprecated core/v1 API) stays excluded --
            # nothing in this cluster reads it, and it is still the same
            # high-churn object class the chart's own comment warns about.
            # Every OTHER chart-default exclusion (Leases, Authn/Authz
            # review kinds, CertificateSigningRequest/CertificateRequest,
            # cilium.io's OWN internal CiliumIdentity/CiliumEndpoint/
            # CiliumEndpointSlice, Kyverno reporting kinds) is reproduced
            # verbatim below -- this is a NARROWING of the default list by
            # exactly one kind, never a blanket "track everything" reversion
            # (`resourceExclusionsAdditional` is append-only for ADDING
            # exclusions, so removing one kind requires restating the whole
            # list rather than a one-line diff against the chart default).
            #
            # The high-churn/UI-clutter cost the chart's exclusion exists to
            # avoid does NOT reappear un-mitigated: the SAME chart version
            # unconditionally ships
            # `resource.customizations.ignoreResourceUpdates.
            # discovery.k8s.io_EndpointSlice` (jsonPointers: /metadata,
            # /endpoints, /ports) as its own default key, independent of
            # `resource.exclusions` -- so once EndpointSlice is tracked,
            # ArgoCD still ignores per-poll endpoint/port churn for diff
            # purposes; only HEALTH computation newly sees the resource.
            #
            # MUST STAY IN LOCKSTEP with `configs.cm` in
            # full-ai-cluster/k8s/bootstrap/argocd-install.yaml (same
            # reasoning as the health-lua key above: this bootstrap installs
            # ArgoCD first, this Application then adopts it, and a
            # divergent argocd-cm between the two would flip exclusion
            # semantics on ArgoCD's very first self-managed reconcile).
            resource.exclusions: |
              - apiGroups:
                - ''
                kinds:
                - Endpoints
              - apiGroups:
                - coordination.k8s.io
                kinds:
                - Lease
              - apiGroups:
                - authentication.k8s.io
                - authorization.k8s.io
                kinds:
                - SelfSubjectReview
                - TokenReview
                - LocalSubjectAccessReview
                - SelfSubjectAccessReview
                - SelfSubjectRulesReview
                - SubjectAccessReview
              - apiGroups:
                - certificates.k8s.io
                kinds:
                - CertificateSigningRequest
              - apiGroups:
                - cert-manager.io
                kinds:
                - CertificateRequest
              - apiGroups:
                - cilium.io
                kinds:
                - CiliumIdentity
                - CiliumEndpoint
                - CiliumEndpointSlice
              - apiGroups:
                - kyverno.io
                - reports.kyverno.io
                - wgpolicyk8s.io
                kinds:
                - PolicyReport
                - ClusterPolicyReport
                - EphemeralReport
                - ClusterEphemeralReport
                - AdmissionReport
                - ClusterAdmissionReport
                - BackgroundScanReport
                - ClusterBackgroundScanReport
                - UpdateRequest
        notifications:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false        # never let ArgoCD prune itself
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Ignore the resources-finalizer the bootstrap installer
      # already added — preserves the existing release.
      - ApplyOutOfSyncOnly=true
