# Mimir — long-term metrics storage. Complements kube-prometheus-stack
# which keeps recent metrics; Mimir holds the long tail for trend
# analysis. Object storage via shared in-cluster MinIO (default) or
# SeaweedFS — see k8s/object-store/BLOB-STORE-CONTRACT.md.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: mimir
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: mimir-distributed
    # 5.5.1 -> 6.2.0 on 2026-09-01. HELD EARLIER THE SAME DAY AND NOW RELEASED, because
    # the blocker was never this chart.
    #
    # Chart 6.x declares `kubeVersion: ^1.32.0-0`. The bump was reverted when
    # audit-observability-chain refused to render it -- against a KUBE_VERSION literal of
    # 1.31.0 that nothing derived and nobody had checked. The cluster ships k3s 1.35.6.
    #
    # #16296 replaced that literal with full-ai-cluster/k8s/kubernetes-version.json,
    # derived from this repo's own flake lock. MEASURED after it merged: mimir 6.2.0
    # renders cleanly at 1.35.6 with this Application's own valuesObject. The constraint
    # was real and simply did not apply to us.
    #
    # The rest of the earlier reading stands: this loses the four mimir-nginx resources
    # (chart 6.x drops the bundled nginx gateway for `gateway.*`; we never configured
    # nginx and nothing in the tree references it), and `minio.enabled: false` below is
    # still load-bearing -- this chart defaults it TRUE.
    targetRevision: 6.2.0
    helm:
      releaseName: mimir
      valuesObject:
        metaMonitoring:
          serviceMonitor: { enabled: false }
        minio:
          enabled: false
        global:
          # `-config.expand-env=true` on every component is what makes the three
          # `${BLOB_STORE_SECRET_KEY}` references below resolve. WITHOUT IT mimir would
          # authenticate with the literal characters -- a silent S3 auth failure rather
          # than a crash, which is why the env var and the flag must land together
          # (081M1S6Z5S3087G0R000GEPSS2).
          extraEnvFrom:
            - secretRef:
                name: zeta-blob-store

        mimir:
          structuredConfig:
            blocks_storage:
              backend: s3
              s3:
                endpoint: blob-store-seaweedfs-all-in-one.object-store.svc:8333
                bucket_name: mimir-tsdb
                access_key_id: zeta-blob-store
                # expanded at runtime from the minted Secret; see the global block above
                secret_access_key: ${BLOB_STORE_SECRET_KEY}
                insecure: true
            alertmanager_storage:
              backend: s3
              s3:
                endpoint: blob-store-seaweedfs-all-in-one.object-store.svc:8333
                bucket_name: mimir-ruler
                access_key_id: zeta-blob-store
                # expanded at runtime from the minted Secret; see the global block above
                secret_access_key: ${BLOB_STORE_SECRET_KEY}
                insecure: true
            ruler_storage:
              backend: s3
              s3:
                endpoint: blob-store-seaweedfs-all-in-one.object-store.svc:8333
                bucket_name: mimir-ruler
                access_key_id: zeta-blob-store
                # expanded at runtime from the minted Secret; see the global block above
                secret_access_key: ${BLOB_STORE_SECRET_KEY}
                insecure: true
        # ALL THREE VOLUMES BELOW ARE SIZE CUTS, 50Gi -> 16Gi, WITH NO POD CUT.
        # None of these pod counts is ours to cut anyway: mimir-distributed
        # 5.5.1 renders 3 ingesters and 3 store-gateways from zone-aware
        # replication defaults this file never mentions (values.yaml
        # ingester.replicas=3 / store_gateway.replicas=1, both zone-aware over
        # 3 zones; templates/_helpers.tpl:568 gives ceil(replicas/zones) per
        # zone), so the real cost of these three lines is 16x3 + 16x3 + 16x1 =
        # 112 GiB, not 48. That under-count is recorded in
        # full-ai-cluster/k8s/storage-profiles.json, which carries the pod
        # counts with their chart evidence.
        #
        # NO RETENTION GOVERNOR IS NEEDED HERE, and that is a real answer rather
        # than an omission: none of these volumes holds history. Long-term
        # blocks live in object storage (blocks_storage.backend: s3 above ->
        # in-cluster MinIO), so all three are WORKING SPACE and shrinking them
        # costs headroom, never data:
        #   ingester        the in-flight head block before it ships to S3. At
        #                   16Gi an upload or compaction backlog fills the
        #                   volume sooner and writes are rejected until it
        #                   drains. Nothing already shipped is affected.
        #   store_gateway   a CACHE of block index-headers fetched from object
        #                   storage. Pure latency: long-range queries re-fetch.
        #   compactor       compaction scratch. If a tenant's block set outgrows
        #                   it, compaction stalls and query performance decays;
        #                   the blocks stay in object storage, uncompacted.
        # The bound that DOES govern history is MinIO's, and it is not on this
        # StorageClass.
        ingester:
          persistentVolume:
            storageClass: longhorn
            size: 16Gi
        store_gateway:
          persistentVolume:
            storageClass: longhorn
            size: 16Gi
        compactor:
          persistentVolume:
            storageClass: longhorn
            size: 16Gi
        # DECLARED so the ladder can price it. mimir-distributed 6.2.0 turns the
        # INGEST-STORAGE architecture on by default -- `kafka.enabled: true` plus
        # `ingest_storage.enabled: true` in the chart's own values -- so writes now
        # route through a bundled StatefulSet that 5.5.1 did not render at all.
        #
        # These are the CHART'S OWN numbers (`cpu: 1`, `memory: 1Gi`), written out
        # so a row can govern them rather than to change what renders at metal. The
        # dev rung then floors the CPU like every other row does; memory is left
        # alone because it is a ceiling, not a share.
        #
        # WHETHER WE WANT INGEST-STORAGE AT ALL IS STILL OPEN, and this block does
        # not settle it: opting back out means setting BOTH `kafka.enabled: false`
        # and `ingest_storage.enabled: false`, and the chart notes the two paths
        # need different ingester-zone counts (2 vs 3), so it is not a one-line
        # revert. Declaring the cost is what makes that choice measurable.
        kafka:
          resources:
            requests:
              cpu: 1
              memory: 1024Mi
        # LIVENESS KILL BUDGET -- WIDENED, NOT A startupProbe. MEASURED (rendered this
        # Application at 6.2.0): `overrides-exporter` has no `startupProbe` key in
        # `templates/overrides-exporter/overrides-exporter-dep.yaml` -- only
        # `{{ toYaml .Values.overrides_exporter.livenessProbe }}`, which without an
        # override here renders the chart's own default (`initialDelaySeconds: 45`, no
        # periodSeconds/failureThreshold -> kubelet defaults 10s/3 -> 65s kill budget).
        # Not individually vetted at WP15's 2026-09-22 catalog audit; ranked here as a
        # known slow starter (WP18 category b, ★ in the audit tool's own
        # KNOWN_SLOW_STARTERS) -- mimir's other components (distributor/ingester/ruler)
        # were observed restarting repeatedly across every CI run examined 2026-09-22,
        # though the audit tool cannot currently price their kill budget (their
        # rendered livenessProbe fields are non-numeric after Helm's own templating --
        # a separate finding, out of this PR's scope) so overrides-exporter is the one
        # mimir container this audit can actually act on.
        #
        # failureThreshold: 18 (chart's own initialDelaySeconds/httpGet unchanged,
        # periodSeconds defaults to 10) -> kill budget 45+17*10=215s.
        overrides_exporter:
          livenessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 45
            failureThreshold: 18
  destination:
    server: https://kubernetes.default.svc
    namespace: mimir
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
