# Mimir — long-term metrics storage. Complements kube-prometheus-stack
# which keeps recent metrics; Mimir holds the long tail for trend
# analysis. Object storage via shared in-cluster MinIO (default) or
# SeaweedFS — see k8s/object-store/BLOB-STORE-CONTRACT.md.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: mimir
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: mimir-distributed
    targetRevision: 5.5.1
    helm:
      releaseName: mimir
      valuesObject:
        metaMonitoring:
          serviceMonitor: { enabled: false }
        minio:
          enabled: false
        mimir:
          structuredConfig:
            blocks_storage:
              backend: s3
              s3:
                endpoint: blob-store.object-store.svc:9000
                bucket_name: mimir-tsdb
                access_key_id: zeta-blob-store
                secret_access_key: zeta-blob-store-dev-secret
                insecure: true
            alertmanager_storage:
              backend: s3
              s3:
                endpoint: blob-store.object-store.svc:9000
                bucket_name: mimir-ruler
                access_key_id: zeta-blob-store
                secret_access_key: zeta-blob-store-dev-secret
                insecure: true
            ruler_storage:
              backend: s3
              s3:
                endpoint: blob-store.object-store.svc:9000
                bucket_name: mimir-ruler
                access_key_id: zeta-blob-store
                secret_access_key: zeta-blob-store-dev-secret
                insecure: true
        ingester:
          persistentVolume:
            storageClass: longhorn
            size: 50Gi
        store_gateway:
          persistentVolume:
            storageClass: longhorn
            size: 50Gi
        compactor:
          persistentVolume:
            storageClass: longhorn
            size: 50Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: mimir
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
