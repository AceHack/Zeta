# postgres-shared — the general-purpose PostgreSQL for the owner's own workloads and for
# any in-cluster app that wants a database and does not need one of its own.
# A CloudNativePG `Cluster`, instantiated from `k8s/examples/cnpg-postgres-ha.yaml`,
# ON BY DEFAULT on a fresh install, with continuous backup to the in-cluster SeaweedFS.
#
# ── WHAT A CONSUMER USES ─────────────────────────────────────────────────────
#   namespace   postgres-shared
#   Service     postgres-shared-rw.postgres-shared.svc:5432   the primary: use this
#               postgres-shared-r .postgres-shared.svc:5432   any instance
#               postgres-shared-ro.postgres-shared.svc:5432   REPLICAS ONLY -- with
#                                                             `instances: 1` it has NO
#                                                             endpoints; do not point
#                                                             anything at it until the
#                                                             Cluster has >= 2 instances
#   Secret      postgres-shared-app   in THIS namespace, minted by the operator in the
#               same act that creates the role. Keys: username, password, dbname, host,
#               port, uri, jdbc-uri, pgpass. Database `app`, owner role `app`.
#   Superuser   NOT exposed (`enableSuperuserAccess` is left at its default, false).
# A workload in another namespace cannot mount a Secret across namespaces. Copy the
# values it needs (kubectl get secret postgres-shared-app -n postgres-shared -o yaml,
# re-created in the consumer's namespace) or, better, give that consumer ITS OWN role
# and database with a CNPG `Database` CR (as temporal/postgres/database.yaml does) --
# one credential per consumer is the property worth keeping. TLS is on with the
# cluster's own CA (Secret postgres-shared-ca); clients that verify need `ca.crt`.
#
# ── WHY THIS EXISTS WHEN #17767 SAID "ONE CLUSTER PER APPLICATION" ───────────
# That change measured the tree (2026-09-30) and shipped only the TEMPLATE, on the
# argument that an always-on shared cluster is an appointed hub (manifesto section 1)
# costing requests on every install. The maintainer's goal is the opposite default: a
# rebuilt install whose first boot already has his infra Postgres running. Both stand.
# The structural answer to the hub objection is that this Cluster is OPTIONAL TO EXIT:
# nothing in the tree depends on it, temporal keeps its own `temporal-postgres`, and
# every other consumer is free to run its own Cluster from the same template. A
# convenience everyone may route around is an oracle that was chosen, not a hub that was
# appointed (itron-hub-patent-boundary-p2p-is-the-upgrade: exit, not degree).
#
# ── SIZING: THREE INSTANCES ON METAL, ONE ON THE CI RUNG, AND WHAT THAT COSTS ─
# The committed tree is the `metal` rung, and it carries `instances: 3` (one primary + two
# streaming replicas), `enablePDB: true` and `primaryUpdateMethod: switchover`: the owner's goal
# is clusters of pods, and a Postgres that is already replicated is the one that is still
# there when a node joins or a pod is lost. The CI/dev rung serves ONE instance, through
# rung-overrides.yaml entry `postgres-shared/single-instance-dev` (the repo's existing
# per-rung field override -- the same ladder the resource requests are on), because a hosted
# runner is a single 4-vCPU node and three Postgres pods would spend three times its share
# for a replica set that cannot spread. The three fields travel together: a PodDisruptionBudget
# on a lone primary hangs `kubectl drain` forever and a switchover has no replica to promote;
# postgres-shared-cluster.test.ts fails if `instances`, `enablePDB`, `primaryUpdateMethod`, the
# ledger row's `pods` and the dev override ever disagree.
#
# THE COST, STATED HONESTLY. On the ONE-node install this tree ships to today, three instances
# are 3x the memory (3 x 512Mi requested, 1Gi limit each, plus a ~64Mi Barman sidecar apiece),
# 3 x 250m CPU requested, and THREE 20Gi PVCs on one disk. The anti-affinity is `preferred`, not
# `required`, so all three co-locate -- and they STAY there: each replica's PVC is node-local
# (zeta-block-local), so a node that joins later does not pull an existing replica across; it
# receives only pods the operator creates afterwards. That is not high availability against
# losing the NODE, and this Application is acknowledged as nominal redundancy in
# single-node-budget.json (`acknowledgedFalseRedundancy`) exactly as cockroachdb, nats and
# redis are. What it IS: safe (the same data on three pods is never less safe than one),
# resilient to a lost or crashing POD (a replica is promoted without waiting for a restart or
# a PVC reattach), a working rolling-update path, and a topology that is already correct the
# moment nodes exist. CONTINUOUS BACKUP with point-in-time recovery -- below -- is what
# survives a logical error. Requests/limits are governed rows in storage-profiles.json
# (`full-ai-cluster/postgres-shared/postgres`, dev and metal rungs; `pods` is the instance
# count), not a number in a manifest only. temporal's `temporal-postgres` is a separate
# Cluster with its own decision and is unchanged.
#
# ── WHAT BACKUP DOES AND DOES NOT PROTECT ───────────────────────────────────
# Base backup daily + WAL continuously, to bucket `zeta-backups` in the in-cluster
# SeaweedFS (objectstore.yaml), 14-day recovery window. That is a REAL backup: a bad
# DELETE replicates to replicas in milliseconds, and it does not reach the archive's
# earlier base backups. It does NOT protect against losing the NODE: SeaweedFS's volume
# is a node-local PVC on the same disk as this database. Off-node durability needs a
# second node or an external store, and the maintainer ruled out external services here.
# An honest "backed up" in this tree means "survives a logical error and a lost pod",
# not "survives the machine".
#
# ── ORDERING ────────────────────────────────────────────────────────────────
# wave 5, after: cloudnativepg (-70; the Cluster/ScheduledBackup CRDs + webhook),
# cnpg-barman-cloud (-65; the ObjectStore CRD + the plugin the Cluster names), seaweedfs
# (-5; the S3 gateway and the `zeta-backups` bucket its chart's createBuckets job
# makes), kube-prometheus-stack (0; the PodMonitor CRD). The backup credential
# (Secret postgres-backup-s3) is minted at first boot by bootstrap/internal-secret-seeding.yaml,
# BEFORE ArgoCD exists, so it is in place for every wave. All four edges are declared,
# with citations, in sync-wave-dependency-graph.yaml.
#
# ── HEALTH ──────────────────────────────────────────────────────────────────
# ArgoCD (v3.x) ships a built-in health check for `postgresql.cnpg.io/Cluster`
# (resource_customizations/postgresql.cnpg.io/Cluster/health.lua, present at v3.2.0):
# phase "Cluster in healthy state" -> Healthy; "Setting up primary" and friends ->
# Progressing; "Waiting for user action" -> Degraded. This tree's argocd-cm overrides
# only the Application kind, so the built-in applies and nothing needs adding. Note
# what Healthy does NOT cover: a failing WAL archiver leaves the phase healthy. Watch the
# Cluster's `ContinuousArchiving` condition (and `kubectl cnpg status postgres-shared`).
#
# ── DEV LANE ────────────────────────────────────────────────────────────────
# Deferred from the dev/CI lane with temporal (DEFAULT_ROOT_DEV_CATALOG.excludeGlob): it
# needs ghcr.io pulls the lane has no token for, the plugin, and a cert-manager mTLS
# handshake, none of which the 4-vCPU runner has room or credentials to prove. The
# reason and its lift condition are in argocd-health-test.ts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: postgres-shared
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://github.com/Lucent-Financial-Group/Zeta
    targetRevision: main
    path: full-ai-cluster/k8s/applications/postgres-shared
    directory:
      # The CRs, NOT this Application.yaml itself (no recursion) and NOT README.md.
      include: '{cluster,objectstore,scheduledbackup,podmonitor}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres-shared
  syncPolicy:
    automated:
      # NEVER prune: pruning the Cluster CR deletes the PVCs the data lives on.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Cluster/ScheduledBackup (cloudnativepg), ObjectStore (cnpg-barman-cloud) and
      # PodMonitor (kube-prometheus-stack) are all custom kinds from OTHER Applications;
      # crd-provider-consumer-order.ts requires a consumer of a non-gating provider to
      # defer rather than SyncFail when the CRD is a beat late.
      - SkipDryRunOnMissingResource=true
    # UNBOUNDED retry, because this Application consumes CRDs it does not own. With no `retry`
    # block ArgoCD gives up after 5 attempts and never re-attempts an automated sync for a
    # revision whose sync already failed, so losing a race against the operator's webhook or CRD
    # (or against an API server that is restarting under first-boot load) is PERMANENT -- the
    # measured shape on `platform` (WP11 run 36221053730) and the reason it carries the same
    # block. limit -1 keeps retrying with backoff capped at 5m.
    retry:
      limit: -1
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
