# Agent memory — per-persona durable, Longhorn-backed memory volumes.
#
# A StatefulSet whose volumeClaimTemplates bind one `longhorn` PVC per
# replica, giving AI-agent memory that survives pod restart, reschedule, and
# node failure. The App-of-Apps root (k8s/bootstrap/root-application.yaml)
# picks up this Application.yaml; this Application then reconciles the
# namespace + service + statefulset in this directory.
#
# Complements the `hindsight` Application (semantic/vector memory service,
# also Longhorn-backed). This one is the raw file-memory substrate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # After longhorn (sync-wave -15) so the `longhorn` StorageClass exists
    # before these PVCs are created.
    argocd.argoproj.io/sync-wave: "10"
  name: agent-memory
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Lucent-Financial-Group/Zeta
    targetRevision: main
    path: full-ai-cluster/k8s/applications/agent-memory
    directory:
      # Apply the manifests, NOT this Application.yaml itself (no recursion).
      include: '{namespace,service,statefulset}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-memory
  syncPolicy:
    automated:
      # NEVER prune persistent memory — losing the PVC means losing the
      # agent's memory. Manual delete only.
      prune: false
      selfHeal: true
    # ServerSideApply DELIBERATELY ABSENT (work item 081M3JFZ59B087G0R0014NP4J7)
    # -- the headscale/spire class (argo-cd#11143). MEASURED live on a fresh
    # bare-metal install: this Application sat OutOfSync/Healthy with ONE
    # OutOfSync resource, StatefulSet/agent-memory, while the controller re-ran
    # "serverside-applied ... successfully synced" every ~5 min (selfHeal
    # churn, never converged). The live volumeClaimTemplates[0] carries
    # `apiVersion: v1`, `kind: PersistentVolumeClaim`, `spec.volumeMode:
    # Filesystem` and `status.phase: Pending`, none written in statefulset.yaml.
    # Declaring them there cannot close it: ArgoCD's SSA-predicted object also
    # gains `metadata.creationTimestamp: null` downstream of the manifest AND of
    # any ignoreDifferences rule (spire/Application.yaml, measured 2x2).
    # headscale -- structurally identical, SSA dropped -- is Synced on the same
    # node. Client-side apply is free here: the StatefulSet is ~4KB, far under
    # the 262144-byte last-applied-configuration cap. Refused offline by
    # src/Core.TypeScript/cluster/ssa-volumeclaimtemplate-drift.test.ts.
    syncOptions:
      - CreateNamespace=true
