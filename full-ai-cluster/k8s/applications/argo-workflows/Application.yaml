# Argo Workflows — DAG job scheduler. Drives AI pipelines + batch jobs.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # ServerSideDiff=true, 2026-09-22 -- fixes perpetual OutOfSync on
    # CustomResourceDefinition/workfloweventbindings.argoproj.io and
    # .../workflowtasksets.argoproj.io (live run 35713533700; the same two CRDs
    # named the app's ONLY diffs in the resource-level dump).
    #
    # NOT the same fix as cockroachdb/headscale/hindsight/nats/opensearch/weaviate
    # (dropping ServerSideApply): that fix is UNAVAILABLE here. MEASURED, this
    # chart's own `crds.full: false` render at 2.0.4: the largest CRD,
    # workflowtasksets.argoproj.io, is 227552 bytes JSON-encoded -- already 87% of
    # the 262144-byte last-applied-configuration cap BEFORE accounting for the
    # `kubectl.kubernetes.io/last-applied-configuration` annotation embedding a
    # second, near-equal-sized copy of the object as a string inside its own
    # annotations (the mechanism the cap is measured against;
    # spire/Application.yaml's own note: "CRD schemas are the resources that
    # genuinely approach that cap"). Client-side apply would fail outright here,
    # not merely drift.
    #
    # ROOT CAUSE IS THE SAME FAMILY, ONE LAYER UP FROM VolumeClaimTemplates.
    # These CRDs (files/crds/minimal/argoproj.io_workflowtasksets.yaml etc,
    # static, deterministic -- two renders diff byte-identical) declare no
    # `spec.conversion` and no `spec.preserveUnknownFields`; both are DEFAULTED by
    # the API server on a v1 CustomResourceDefinition when omitted
    # (`conversion.strategy: None`, `preserveUnknownFields: false`). Under
    # ServerSideApply, ArgoCD's local diff runs the desired object through the
    # same internal conversion the real API server applies -- argo-cd#11143,
    # apelisse (Kubernetes SIG API Machinery) 2023-01-24: "the apiserver does lots
    # of conversions internally ... with server-side apply, the conversion acts
    # exactly as a default ... they end up appearing in the dry-run output" -- so
    # the predicted-live object carries fields the desired manifest never had.
    #
    # THE UPSTREAM-DOCUMENTED FIX FOR THIS EXACT MISMATCH, not a workaround
    # invented here: ServerSideDiff replaces ArgoCD's local conversion-emulation
    # with an actual dry-run request to the API server
    # (https://argo-cd.readthedocs.io/en/stable/user-guide/diff-strategies/#server-side-diff),
    # so the predicted object IS what the API server would produce, not a guess at
    # it. Confirmed by multiple independent reporters on argo-cd#11143 and #24791
    # closing this identical defect (javydekoning: "Confirmed, adding annotation
    # ... Fixes this for me"; jg-tecso: "this work for me"). Stable since ArgoCD
    # 3.1.0 (this cluster runs chart argo-cd 10.8.0, well past that floor) -- no
    # longer beta, per pjiang-dev on the same thread.
    #
    # WHAT IT COSTS: an extra dry-run apply request per resource per diff
    # (heavier than the local prediction ServerSideApply alone does), scoped to
    # THIS Application only via the annotation rather than cluster-wide via
    # argocd-cm, so no other Application's diff cost changes.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  name: argo-workflows
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    # 0.42.5 -> 2.0.3 on 2026-09-01, WITH crds.full: false. Both halves matter.
    #
    # A first pass REFUSED this bump on the observation that 2.0.3 renders ZERO
    # CustomResourceDefinitions where 0.42.5 renders eight -- which would leave the
    # cluster unable to hold a Workflow at all. The observation was right and the
    # conclusion was wrong: chart 2.x ships FULL CRDs (`crds.full: true`, its default)
    # through a pre-install/pre-upgrade hook Job that server-side-applies them, so they
    # never appear in a plain `helm template`.
    #
    # WE TAKE THE DECLARATIVE PATH INSTEAD. `crds.full: false` templates the CRDs as
    # ordinary manifests -- eight of them, matching 0.42.5 exactly -- which ArgoCD applies
    # like anything else. The hook path would work too, but it trades declarative
    # manifests for a privileged Job doing server-side apply at PreSync, and a Job that
    # fails leaves an Application that can never sync.
    #
    # THE COST IS STATED RATHER THAN OMITTED: the minified CRDs carry
    # `x-kubernetes-preserve-unknown-fields`, so Workflow specs get less schema
    # validation from the API server than the full CRDs would give. That is a real
    # trade -- weaker field validation in exchange for CRDs our tooling can SEE. The
    # lane partitioner, the storage ledger and kubeconform all read the render, and a CRD
    # delivered by a hook Job is invisible to every one of them.
    targetRevision: 2.0.4
    helm:
      releaseName: argo-workflows
      valuesObject:
        crds:
          # DECLARATIVE, not the hook Job. See the note at targetRevision: with
          # `full: true` (the chart default) the CRDs ship via a pre-install Job doing
          # server-side apply, so `helm template` renders NONE of them and every tool
          # that reads the render is blind to them. `false` templates all eight as
          # ordinary manifests, matching what 0.42.5 rendered.
          full: false
          install: true
          keep: true
        controller:
          workflowDefaults:
            spec:
              activeDeadlineSeconds: 86400
              ttlStrategy: { secondsAfterCompletion: 604800 }
              podGC: { strategy: OnPodCompletion }
          parallelism: 50
        server:
          authModes: [ server ]
        executor:
          image: { tag: "" }
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
