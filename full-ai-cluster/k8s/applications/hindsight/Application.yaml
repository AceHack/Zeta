# Hindsight (vectorize-io) — agent persistent memory system for any
# in-cluster agent runtime that needs memory persistence.
# Real chart wired: OCI Helm chart at ghcr.io/vectorize-io/charts/hindsight.
#
# Consumer agents reach Hindsight via:
#   HINDSIGHT_URL=http://hindsight-api.hindsight.svc.cluster.local
# NOT `hindsight.hindsight.svc` -- MEASURED 2026-08-22 against chart 0.3.0:
# `templates/api-service.yaml` names the Service `{{ fullname }}-api`, and with
# releaseName `hindsight` on chart `hindsight` the fullname helper collapses to
# `hindsight`, so the three rendered Services are `hindsight-api`,
# `hindsight-control-plane` and `hindsight-postgresql`. There has never been one
# called plain `hindsight`.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: hindsight
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: ghcr.io/vectorize-io/charts
    chart: hindsight
    targetRevision: 0.9.2 # latest published by vectorize-io
    helm:
      releaseName: hindsight
      valuesObject:
        # Bundled PostgreSQL for storage. Swap to false +
        # api.database.url for an external CockroachDB/Postgres
        # backing store once the cluster's CockroachDB Application
        # is healthy.
        # THE LLM API KEY, BY REFERENCE ONLY -- the Secret is never in git.
        #
        # Aaron 2026-09-07 made the call this file asked for ("the decision that
        # is not mine to make"): ESO on metal plus a minted dev Secret. So the
        # Application names ONE Secret and only the PROVENANCE differs -- CI
        # mints it at bring-up (`DEV_HINDSIGHT_LLM_SECRET`, the same mechanism
        # that mints Grafana's admin credential), metal resolves it through an
        # ExternalSecret. The dev lane is therefore allowed to diverge from metal
        # on secret provenance, and only on that.
        #
        # THE OLD BLOCK BELOW SAID THIS WAS BLOCKED ON FIVE LAYERS. Two of those
        # do not apply, MEASURED against the pinned chart 0.9.2 rather than
        # inherited from the 0.3.0 notes:
        #
        #   - `postgres-password` DOES NOT need to move into this Secret.
        #     api-deployment.yaml:49 reads it under `{{- if not
        #     .Values.postgresql.enabled }}` -- the EXTERNAL-postgres path only --
        #     and postgresql-statefulset.yaml:33 takes the bundled password from
        #     `.Values.postgresql.auth.password` as a plain value, never from a
        #     Secret. We run the bundled Postgres, so suppressing the chart's
        #     Secret costs it nothing.
        #   - SUPPRESSING templates/secret.yaml COSTS NOTHING ELSE. It renders
        #     `api.secrets`, `controlPlane.secrets` and that external
        #     `postgres-password`. This valuesObject sets none of the three, so
        #     the object it would have produced is empty of keys.
        #
        # WHAT IS STILL TRUE, and is why the metal half is not done here: a
        # ClusterSecretStore and an ExternalSecret still do not exist in either
        # tree. Metal must not be brought up against this line until they do --
        # `envFrom` on an absent Secret holds the api AND worker pods in
        # CreateContainerConfigError, which is the two-pods-worse outcome the
        # earlier note correctly warned about. CI is safe because CI mints it.
        #
        # AND THE CI VALUE IS A PLACEHOLDER. The app's boot check is
        # presence-only, so a drawn value clears the crash loop and no LLM call
        # will succeed. Healthy in CI means the process runs -- never that
        # extraction works. Do not read this lane as covering that path.
        existingSecret: hindsight-llm-api-key
        postgresql:
          # OFF `ankane/pgvector:latest`, WHICH IS ARCHIVED. Docker Hub reports that
          # repository `status_description: archived` with no push since 2023-10-11, and
          # the chart still defaults to it at 0.9.2 -- so the version bump does NOT fix
          # this and saying otherwise would be the "behind is not unmaintained" error in
          # reverse. `pgvector/pgvector` is the maintained successor (pushed 2026-08-13).
          #
          # ON THE POSTGRES MAJOR, stated because it is the thing a reader would
          # reasonably assume was checked and it was not: `ankane/pgvector`s tags are
          # pgvector EXTENSION versions (v0.5.1, ...), not PG majors, so the base major
          # of the image being replaced is UNDETERMINED here. That is tolerable only
          # because there is no data to migrate -- hindsight has never reached Healthy
          # in any lane (it is in APPLIED_BUT_UNASSERTED_REASONS) and its dev PVC is
          # recreated per cluster. IF hindsight is ever promoted with persisted data,
          # changing this tag becomes a dump/restore and must be treated as one.
          image:
            repository: pgvector/pgvector
            tag: pg17-trixie
            pullPolicy: IfNotPresent
          enabled: true
          # NOT `primary.persistence.*` -- that is the BITNAMI postgresql
          # subchart layout, and this chart is not that chart. hindsight 0.3.0
          # ships its OWN StatefulSet (templates/postgresql-statefulset.yaml:69)
          # reading `postgresql.persistence.size` / `.storageClass`, so a
          # `.primary` level lands on keys nothing reads.
          #
          # MEASURED 2026-08-21, and the inert form was not merely optimistic:
          # `helm template` at this pin rendered the chart default 8Gi with NO
          # storageClassName, and a blank class binds the cluster DEFAULT class
          # -- `zeta-local-path`, rancher.io/local-path, reclaimPolicy: DELETE
          # (full-ai-cluster/nixos/modules/local-storage.nix). The
          # semantic-memory Postgres was on node-local delete-on-reclaim disk
          # for as long as this file said `longhorn`. Re-rendered after the
          # move: 10Gi, storageClassName "longhorn".
          persistence:
            storageClass: longhorn
            # SIZE CUT, NOT A POD CUT: 20Gi -> 10Gi, one primary either way.
            #
            # THE CUT TO REVISIT FIRST if this box gains room. This is the
            # semantic-memory Postgres, so the bound is on how much agent
            # memory can be retained before the database refuses writes. There
            # is no eviction policy to move alongside it -- Postgres does not
            # age rows out on its own -- so the governor here is whatever
            # retention the application implements, and today that is nothing.
            # The failure is loud (writes fail) rather than silent, and
            # manifesto section 5 makes filling it a memory-preservation
            # surface rather than a performance one.
            size: 10Gi

        api:
          # LLM provider Hindsight uses for its own entity/relation extraction
          # (separate from a consumer-agent's LLM choice).
          #
          # NOT `api.llm.*` -- MEASURED 2026-08-22 by rendering chart 0.3.0 from
          # this very valuesObject. The chart has no `api.llm` key anywhere:
          # `templates/api-deployment.yaml` builds the api container's env from
          # exactly three sources -- the computed `HINDSIGHT_API_DATABASE_URL`,
          # a `range` over `.Values.api.env`, and a `range` over
          # `.Values.api.secrets`. The old `api.llm: {provider, existingSecret}`
          # block rendered NOTHING: the container carried two env vars, and the
          # provider this file has claimed since PR #4913 never reached it.
          env:
            # Merges with the chart default `HINDSIGHT_API_LLM_MODEL:
            # openai/gpt-oss-120b`; Helm deep-merges maps, so naming one key
            # here does not drop the other.
            HINDSIGHT_API_LLM_PROVIDER: groq

            # WORKER ID -- READ FROM THE APP'S OWN SOURCE, not guessed. PR #17505's
            # soak-phase log carried this warning verbatim
            # (vectorize-io/hindsight `hindsight_api/utils.py::warn_if_container_default_worker_id`,
            # fetched via `gh api search/code` 2026-09-22 since the wall in
            # `.claude/rules/cleanroom-two-team-separation.md` governs OUR PRIOR ART, not a
            # public upstream dependency's own log message we are configuring against):
            #
            #   WARNING: HINDSIGHT_API_WORKER_ID is not set and Hindsight appears to be
            #   running inside kubernetes. The worker id is defaulting to the container
            #   hostname, which CHANGES every time the container is recreated. When that
            #   happens, tasks left in 'processing' under the old hostname are never
            #   recovered -- consolidation and other async operations can get stuck
            #   indefinitely. Set HINDSIGHT_API_WORKER_ID to a STABLE value (e.g. the
            #   compose service name or StatefulSet pod name) to avoid this.
            #
            # `worker.enabled` is false (chart default, unset here), so there is no
            # dedicated worker StatefulSet -- the chart's OWN fix (worker-statefulset.yaml
            # sets HINDSIGHT_API_WORKER_ID from the StatefulSet pod name via the downward
            # API) does not apply to us; the internal worker runs embedded in THIS `api`
            # Deployment pod, which the chart never assigns an id at all.
            #
            # NOT the downward-API pod name suggested for a StatefulSet: `api` is a
            # Deployment, and a Deployment's pod name is only stable ACROSS CONTAINER
            # RESTARTS within one Pod object (kubelet restarts the container in place;
            # `metadata.name` does not change) -- it is NOT stable across POD recreation
            # (a rolling update, an eviction, a reschedule create a new Pod with a new
            # random suffix), which is exactly the "container recreation" the warning
            # names as the failure trigger. Wiring the downward API here would silently
            # carry the same defect one layer down. A literal static value is what the
            # warning's own suggested fix means by "stable": it survives Pod recreation,
            # not merely container restart.
            #
            # Safe today because `api.replicaCount` above is 1 -- exactly one worker
            # ever holds this id at once, so there is no multi-worker collision, only the
            # single-worker recovery hazard the warning describes.
            #
            # REVISIT IF `api.replicaCount` (or `worker.enabled`) EVER CHANGES: a second
            # `api` replica sharing this literal id WOULD be the multi-worker collision
            # (two processes claiming tasks under one id), and at that point this needs
            # either a dedicated `worker.enabled: true` StatefulSet (which gets its id
            # for free) or a per-replica downward-API value the Deployment does not
            # provide today (e.g. `POD_IP`, which the chart does not read as a worker id).
            HINDSIGHT_API_WORKER_ID: hindsight-api-0

          # THE API KEY IS STILL NOT WIRED, and that is deliberate rather than
          # overlooked. The chart offers TWO ways in, MEASURED 2026-08-22 by
          # reading hindsight-0.3.0's own templates, and neither is one line:
          #
          #   (a) TOP-LEVEL `existingSecret: <name>` (a bare string). The api
          #       AND control-plane deployments both render
          #       `envFrom: [secretRef: {name}]` under it, so the Secret's KEY
          #       NAMES become the env var names -- the key must be literally
          #       `HINDSIGHT_API_LLM_API_KEY`, never `api-key`. It also
          #       SUPPRESSES the chart's own Secret outright
          #       (`{{- if not .Values.existingSecret }}` at the top of
          #       templates/secret.yaml), so once set it is the ONLY secret
          #       source for the whole release: an external Postgres would have
          #       to put `postgres-password` in that same object.
          #   (b) `api.secrets: {KEY: value}` with NO existingSecret, which
          #       makes the chart mint `hindsight-secret` from the values. It
          #       needs the plaintext key IN GIT. Not an option, named so the
          #       next reader does not rediscover it as one.
          #
          # SO (a), AND IT IS BLOCKED ON FIVE MISSING LAYERS, NOT ONE. Setting
          # it today makes things strictly WORSE: `envFrom` against a Secret
          # that does not exist holds a pod in CreateContainerConfigError, and
          # here that is TWO pods, trading a silently-absent key for two
          # containers that cannot start. What has to exist first, each line
          # measured rather than assumed:
          #
          #   1. THE KEY ITSELF. A Groq API key is nowhere in this repo and
          #      cannot be -- it is a credential only the maintainer holds.
          #   2. A VAULT HOLDING IT. On metal Vault has NEVER been initialised
          #      (applications/vault/TOPOLOGY.md section 2: "Vault has never
          #      been initialised, holds no secrets, and has no live
          #      consumers"), and its init is a gated human ceremony behind the
          #      biometric gate. In CI, #13391's ephemeral init is scoped to
          #      UNSEALING ONLY: cluster/ephemeral-vault-init.ts runs
          #      `operator init` -> `operator unseal` x3 -> `token revoke
          #      -self`, and greps clean for `auth enable`, `policy write` and
          #      `kv put`. So CI ends with an unsealed, EMPTY Vault and no token
          #      -- it is not a secrets path, and its own header says a module
          #      that grows a way to persist material "must be deleted, not
          #      amended".
          #   3. A KUBERNETES AUTH MOUNT + policy + an `external-secrets` role,
          #      so ESO can authenticate. Nothing in either tree creates one.
          #   4. A ClusterSecretStore. NO MANIFEST in full-ai-cluster or infra
          #      declares one; `grep -rn "kind: ClusterSecretStore"` finds only
          #      prose -- a commented-out sketch inside
          #      applications/external-secrets/Application.yaml, and this block.
          #      (Stated that way on purpose: "the grep returns nothing" stopped
          #      being true the moment this comment was written, and a claim
          #      that its own text falsifies is how a measured line rots.) This
          #      tree has the ESO controller and no store for it to read.
          #   5. The ExternalSecret itself -- which would be the tree's FIRST.
          #      Same shape: no manifest declares one, and the only occurrences
          #      of the string are prose here and in full-ai-cluster/README.md.
          #      Only then does the one-line `existingSecret:
          #      hindsight-llm-api-key` go in at the TOP level of this
          #      valuesObject.
          #
          # THE DECISION THAT IS NOT MINE TO MAKE, stated so it can be made:
          # layers 2-4 are an architectural first for this repo, and the CI/metal
          # split is the substance of it. On metal the answer is plausibly
          # "Vault + k8s auth, once the gated ceremony has been run". In CI there
          # is no Vault worth reading from and no key to put in one, so an
          # ExternalSecret would fail closed on every dev lane unless the dev
          # bring-up mints a Secret directly -- which is what
          # `applyDevBootstrapSecrets` already does for Grafana's admin
          # credential, and is the nearest in-tree precedent. Choosing between
          # "one mechanism, gated on Vault everywhere" and "ESO on metal + a
          # minted dev Secret" is a maintainer call: it decides whether the dev
          # lane is allowed to diverge from metal on secret provenance.
          #
          # LIFTS WHEN: a ClusterSecretStore exists and resolves, an
          # ExternalSecret in namespace `hindsight` projects the key under the
          # name `HINDSIGHT_API_LLM_API_KEY`, and the dev lane has a source for
          # the same Secret (minted or otherwise) -- at which point, and not
          # before, `existingSecret: hindsight-llm-api-key` goes in at the top
          # level of valuesObject. Adding it earlier is the half-wired case
          # above and costs two pods.
          #
          # Database URL is computed by the chart from the bundled postgresql
          # above (`hindsight.databaseUrl` in _helpers.tpl). To point at an
          # external CockroachDB/Postgres instead, set `postgresql.enabled:
          # false` plus `postgresql.external.{host,port,database,username}` and
          # supply `postgres-password` through the same top-level
          # `existingSecret`; the chart reads no `api.database` key.

          # Service Hermes reaches Hindsight on. NOT a top-level `service:` --
          # chart 0.3.0 has no such key; it reads `api.service.{type,port,
          # targetPort}` and `controlPlane.service.*`. The top-level block this
          # replaces rendered nothing, so the api Service kept the chart default
          # port 8888 while every doc in the repo said 80.
          #
          # `port` is what the ClusterIP answers on; `targetPort` stays at the
          # chart default 8888 (the container port, referenced by NAME in the
          # Service template). The control plane's own
          # `HINDSIGHT_CP_DATAPLANE_API_URL` is built from this same value, so
          # it follows the change automatically.
          service:
            type: ClusterIP
            port: 80

          # LIVENESS KILL BUDGET -- WIDENED, WP15 (2026-09-22).
          #
          # MEASURED on PR #17505's "live kind included" job
          # (`gh api repos/.../actions/jobs/<id>/logs`): the post-Healthy soak phase
          # caught `hindsight-api-... [api] restartCount 1 -> 2` with
          # `Liveness probe failed: Get "http://...:8888/health/live": connect:
          # connection refused` while the container was still starting -- it runs
          # alembic migrations at boot, and the kubelet killed it before that
          # finished. Not a flake: the chart's own liveness default
          # (`initialDelaySeconds: 30, periodSeconds: 10, failureThreshold: 3`)
          # gives a kill budget of `30 + (3-1)*10 = 50s` from container start to
          # first restart, and migrations plus interpreter/model-cache warmup on a
          # busy node routinely exceed that.
          #
          # NO `startupProbe` KEY EXISTS in this chart at 0.9.2 -- MEASURED by
          # extracting it (`helm pull oci://ghcr.io/vectorize-io/charts/hindsight
          # --version 0.9.2 --untar`) and grepping every template:
          # `templates/api-deployment.yaml` renders exactly `livenessProbe` and
          # `readinessProbe` from `.Values.api.livenessProbe` / `.readinessProbe`,
          # nothing else. So the kubelet-holds-liveness-until-startup-succeeds
          # mechanism this rule's own repo convention prefers is UNAVAILABLE here;
          # the only lever the chart exposes is widening the liveness probe itself.
          #
          # `readinessProbe` is deliberately UNTOUCHED: it gates traffic, not the
          # container's life, and the chart's own comment already gets this right
          # (readiness hits `/health`, which checks the database; liveness hits
          # `/health/live`, which does not). A slow-starting pod should stay OUT of
          # the Service without being killed for it -- that is exactly what
          # `readinessProbe.initialDelaySeconds: 10, failureThreshold: 3` already
          # does, and it needs no change.
          #
          # Helm deep-merges maps (same note as `api.env` above), so naming only
          # `failureThreshold` here keeps the chart's `httpGet`, `initialDelaySeconds`,
          # `periodSeconds` and `timeoutSeconds` defaults. New kill budget:
          # `30 + (30-1)*10 = 320s` (~5.3 min) -- generous enough to absorb a
          # migration run plus warmup under load, while still killing a
          # genuinely-wedged process inside the soak window's own longer horizon.
          livenessProbe:
            failureThreshold: 30

        # CONTROL PLANE'S OWN LIVENESS -- WIDENED FOR THE SAME REASON, NARROWER
        # MARGIN. Not part of PR #17505's measured failure (that log only showed
        # `api` restarting) -- caught instead by `liveness-kill-budget.ts`'s
        # catalog-wide audit run against this same chart while fixing `api`.
        # `templates/controlplane-deployment.yaml` renders
        # `{{- toYaml .Values.controlPlane.livenessProbe | nindent 10 }}` -- an
        # ACTUAL values coordinate (unlike `postgresql`'s liveness below, which
        # this chart hardcodes into its StatefulSet template with no `toYaml`
        # in sight -- there is nothing to override there, so postgresql stays
        # in the audit's leave-in-a-workitem set instead).
        #
        # Chart default: `tcpSocket: {port: 3000}, initialDelaySeconds: 30,
        # periodSeconds: 10, failureThreshold: 3` -- kill budget
        # `30 + (3-1)*10 = 50s`. control-plane is Node/Next.js, not a migration
        # runner, so it does not need `api`'s 320s margin -- `failureThreshold:
        # 15` gives `30 + 14*10 = 170s`, comfortably above the 120s floor
        # `liveness-kill-budget.ts` gates on without matching a budget this
        # container's own startup profile does not justify.
        controlPlane:
          livenessProbe:
            failureThreshold: 15

  destination:
    server: https://kubernetes.default.svc
    namespace: hindsight
  syncPolicy:
    automated:
      prune: false # never prune — memory store is precious
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
