# Temporal (TS workers) — distributed cron #2.
#
# ── THE DATASTORE IS A CLOUDNATIVEPG POSTGRESQL, AND HERE IS WHY ─────────────
# Both persistence stores — `default` and `visibility` — live on the CNPG
# `Cluster` `temporal-postgres` in this namespace, declared by the sibling
# Application `temporal/postgres/Application.yaml` (wave 5, before this one).
# Temporal's docs list PostgreSQL as a TESTED store for BOTH, and the chart at
# 0.59.0 branches on `postgres12` for the schema tool (`templates/server-job.yaml`:
# `update-schema --schema-dir /etc/temporal/schema/postgresql/v12/<store>/versioned`).
#
# HISTORY, kept because the reasoning is load-bearing. Until 2026-09-27 both stores
# pointed at the CockroachDB already in the cluster (chosen 2026-08-21 over
# Cassandra, which at this pin ships no visibility schema at all). That never
# converged on a fresh install, for three reasons, measured on the USB install
# node-5b2dfa (temporal Synced/Degraded):
#   * no `temporal` SQL user existed to carry the seeded password;
#   * CockroachDB is TLS-only and its client CA was never in this namespace;
#   * the VISIBILITY schema cannot apply to CockroachDB:
#     `schema/postgresql/v12/visibility/versioned/v1.2/advanced_visibility.sql`
#     (temporal v1.27.2) opens `CREATE EXTENSION IF NOT EXISTS btree_gin;`
#     (cockroachdb/cockroach#51992, unimplemented) and uses a plpgsql
#     `convert_ts(...)` inside `GENERATED ALWAYS AS (...) STORED` columns
#     (CockroachDB known limitation #122945).
# The third is not fixable by configuration, which is what decided it. The
# CloudNativePG operator (`applications/cloudnativepg`) was added for exactly this
# and for gitlab. CockroachDB is NOT removed — it keeps its other users.
#
# ── CREDENTIALS: ONE SOURCE OF TRUTH ─────────────────────────────────────────
# `existingSecret: temporal-postgres-app` for BOTH stores. CNPG generates that
# Secret from the Cluster's `bootstrap.initdb` (owner `temporal`) and sets the
# SAME password on the role, so the value the pods read and the value the database
# checks cannot diverge. The chart reads key `password` (0.59.0 `_helpers.tpl`
# `temporal.persistence.sql.secretKey`: `password` whenever `existingSecret` is
# set). The former first-boot seeding Job for `temporal-{default,visibility}-store`
# is removed — it minted a password no database role ever carried. Checked by
# `src/Core.TypeScript/cluster/temporal-datastore.test.ts`.
#
# ── TLS: ENCRYPTED, SERVER IDENTITY NOT VERIFIED — A CHOSEN, NAMED GAP ───────
# CNPG serves TLS by default with its own self-signed CA. `sql.tls.enabled: true`
# with `enableHostVerification: false` makes temporal's postgres plugin connect
# with `sslmode=require`: the link is encrypted, the server certificate is not
# checked. Verifying it (`verify-full`) needs `temporal-postgres-ca`'s `ca.crt` in
# four server Deployments AND the schema Job, and that Secret also carries
# `ca.key` — mounting it wholesale would hand the CA's private key to every
# temporal pod. Not done here; the traffic never leaves the pod network.
# LIFTS WHEN: `ca.crt` alone reaches this namespace's pods (a trust-manager Bundle,
# or `items: [ca.crt]`-scoped volumes via server/admintools `additionalVolumes`),
# `caFile` is set below and `enableHostVerification` flips to true.
#
# ── SCHEMA: THE CHART'S JOB, AGAINST DATABASES CNPG ALREADY CREATED ──────────
# `schema.createDatabase.enabled: false` — CNPG creates both databases (initdb for
# `temporal`, a `Database` CR for `temporal_visibility`), and role `temporal` has
# no CREATEDB, so `temporal-sql-tool create-database` could only fail. The
# `setup-*` and `update-*` init containers still run, per store, every revision.
#
# ── WHAT HAPPENS WHEN THE DATABASE IS UNAVAILABLE ────────────────────────────
# Temporal keeps NO local durable state — no PVC, no StatefulSet here. Every
# workflow, task queue and timer lives in `temporal-postgres`. So when it is down:
#   * frontend/history/matching/worker stay up but their persistence calls fail;
#     the frontend returns UNAVAILABLE and the server retries on a backoff. In-flight
#     workflows STALL and resume once the store returns.
#   * on a COLD start with the instance not yet accepting connections, the
#     `temporal-schema-N` Job's `setup-default-store` init container fails and the
#     Job retries (restartPolicy OnFailure, `schema.setup.backoffLimit` 100). That
#     covers the gap between the Cluster CR existing (wave 5) and its pod being
#     Ready — a sync wave orders creation, not readiness.
#
# ── STORAGE: ZERO PVCs IN THIS RENDER ────────────────────────────────────────
# `helm template` at 0.59.0 with these values renders Deployments, Services,
# ConfigMaps and one Job — no PersistentVolumeClaim, no StatefulSet. The disk
# temporal's data lives on is claimed by the CNPG operator on behalf of
# `temporal/postgres/cluster.yaml` (10Gi, node-local `zeta-block-local`, per CNPG's
# local-storage guidance) and is declared there, not here. So temporal still has NO row in
# `full-ai-cluster/k8s/storage-profiles.json`, and direction 2 of
# `rendered-storage-claims.ts` still turns any future PVC in THIS render into a
# red gate.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: temporal
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://go.temporal.io/helm-charts
    chart: temporal
    targetRevision: 0.59.0
    helm:
      releaseName: temporal
      valuesObject:
        server:
          replicaCount: 1
          # Applies to all FOUR server Deployments (frontend, history, matching,
          # worker): server-deployment.yaml:156 is
          # `default $.Values.server.resources $serviceValues.resources`, and no
          # per-service `resources` is set below, so this one value x4.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          config:
            persistence:
              defaultStore: default
              default:
                driver: sql
                sql:
                  driver: postgres12
                  # The CNPG primary (`temporal/postgres/cluster.yaml`).
                  host: temporal-postgres-rw.temporal.svc
                  port: 5432
                  database: temporal
                  user: temporal
                  # No password in git, and none minted here: CNPG generates this
                  # Secret for role `temporal` from the Cluster's initdb (see the
                  # CREDENTIALS note in the header). The chart creates no Secret
                  # when `existingSecret` is set (server-secret.yaml guards on it).
                  existingSecret: temporal-postgres-app
                  # sslmode=require — see the TLS note in the header.
                  tls:
                    enabled: true
                    enableHostVerification: false
                  maxConns: 20
                  maxIdleConns: 20
                  maxConnLifetime: 1h
              visibility:
                driver: sql
                sql:
                  driver: postgres12
                  host: temporal-postgres-rw.temporal.svc
                  port: 5432
                  # A SEPARATE database on the SAME cluster, owned by the same
                  # role: `temporal/postgres/database.yaml`.
                  database: temporal_visibility
                  user: temporal
                  existingSecret: temporal-postgres-app
                  tls:
                    enabled: true
                    enableHostVerification: false
                  maxConns: 10
                  maxIdleConns: 10
                  maxConnLifetime: 1h
        web:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        admintools:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
        schema:
          # CNPG creates both databases; role `temporal` has no CREATEDB, so the
          # chart's `create-*-store` init containers could only fail. See header.
          createDatabase:
            enabled: false
          # The schema Job's FOUR init containers (setup + update, per store) run
          # sequentially, so the pod's effective request is max(init) = this one
          # value, not four of them.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        # Every bundled subchart OFF. `cassandra` and `elasticsearch` are the
        # two that matter: leaving either on adds a stateful service (and, for
        # elasticsearch, 3 x 1000m/2048Mi — which is the whole of the 3000m /
        # 6144Mi this app used to be charged in storage-profiles.json's
        # ungovernedRequests, measured from chart defaults nobody had rendered
        # against THIS Application's values).
        cassandra:
          enabled: false
        mysql:
          enabled: false
        postgresql:
          enabled: false
        elasticsearch:
          enabled: false
        prometheus:
          enabled: false
        grafana:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    # Unbounded retry (limit -1, backoff capped at 5m). ArgoCD's automated-sync default is 5 attempts
    # (~2.5 min) and it never re-attempts a revision whose sync already failed, so a control-plane blip
    # longer than that strands the Application SyncFailed for good. Pinned for every automated
    # Application by src/Core.TypeScript/cluster/application-retry-unbounded.test.ts.
    retry:
      limit: -1
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
    automated: { prune: true, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
