# Temporal (TS workers) — distributed cron #2.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: temporal
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://go.temporal.io/helm-charts
    chart: temporal
    targetRevision: 0.59.0
    helm:
      releaseName: temporal
      valuesObject:
        server:
          replicaCount: 1
        cassandra:
          enabled: false
        elasticsearch:
          enabled: false
        prometheus:
          enabled: false
        grafana:
          enabled: false
        # CockroachDB (via its ArgoCD app) is the persistence layer.
        # Wire after cockroachdb/Application.yaml comes up:
        # server:
        #   config:
        #     persistence:
        #       default:
        #         driver: sql
        #         sql:
        #           driver: postgres12
        #           host: cockroachdb-public.cockroachdb.svc.cluster.local
        #           port: 26257
        #           database: temporal
        #           user: root
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
