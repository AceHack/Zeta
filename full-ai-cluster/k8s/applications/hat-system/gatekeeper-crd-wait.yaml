# ArgoCD Sync hook: wait for Gatekeeper to register Constraint CRDs after
# ConstraintTemplates (wave 1) before Constraints (wave 3) apply.
#
# Without this, cold-start sync fails with "could not find
# constraints.gatekeeper.sh/HatWarmup" even when sync-waves are set.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatekeeper-crd-wait
  namespace: hat-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hat-system-gatekeeper-crd-wait
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["templates.gatekeeper.sh"]
    resources: ["constrainttemplates"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hat-system-gatekeeper-crd-wait
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hat-system-gatekeeper-crd-wait
subjects:
  - kind: ServiceAccount
    name: gatekeeper-crd-wait
    namespace: hat-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-gatekeeper-hat-constraint-crds
  namespace: hat-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: gatekeeper-crd-wait
      restartPolicy: Never
      # REQUIRED, not defensive. This namespace sets
      # pod-security.kubernetes.io/enforce: restricted (namespace.yaml), and
      # this pod template carried no securityContext at all -- so the pod was
      # REJECTED AT ADMISSION and this Job could never run. Measured in CI:
      #   pods "wait-gatekeeper-hat-constraint-crds-..." is forbidden:
      #   violates PodSecurity "restricted:latest": allowPrivilegeEscalation
      #   != false, unrestricted capabilities, runAsNonRoot != true,
      #   seccompProfile
      # all four at once. Matches the fields the sibling deployment.yaml
      # already sets, so the namespace has one shape rather than two.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      # readOnlyRootFilesystem is NOT one of the four things `restricted`
      # requires -- it is carried over from deployment.yaml as defence in
      # depth. It costs kubectl its writable discovery cache under $HOME,
      # so the cache is pointed at an emptyDir instead. Without this the fix
      # would trade an admission failure for a runtime one.
      volumes:
        - name: kubecache
          emptyDir: {}
      containers:
        - name: wait
          # WAS `bitnami/kubectl:1.32.3`, WHICH IS A 404 -- A LIVE BUG, NOT ONLY
          # A MEASUREMENT ONE. Bitnami withdrew its free versioned tags from
          # Docker Hub; `docker.io/bitnami/kubectl` still answers `tags/list` but
          # every entry is `latest`, `latest-metadata`, or a cosign
          # `sha256-...`/`.sig`/`.att` artifact. So this Job's only container
          # could not be pulled, and the Job that gates every hat
          # ConstraintTemplate would have sat in ImagePullBackOff. Measured
          # 2026-08-23: HTTP 404 for the tag, and `bitnamilegacy/kubectl:1.32.3`
          # -- the archive Bitnami moved the free catalogue to, same tag --
          # resolves at 111,998,161 compressed bytes.
          #
          # `registry.k8s.io/kubectl:v1.32.3` WAS THE OBVIOUS BETTER PIN AND IS
          # NOT USABLE HERE, checked rather than assumed. It resolves (18,750,205
          # bytes, 6x smaller, upstream-maintained rather than a frozen archive),
          # but its config blob reads `ENTRYPOINT ["/bin/kubectl"]` on the
          # distroless `go-runner` base -- there is no shell in it. The script
          # below is `/bin/bash -ec` with arrays, `seq` and `pipefail`, so that
          # image would trade a pull failure for an exec failure. Moving to it
          # means rewriting this Job as a shell-free wait, which is a real
          # improvement and a separate change.
          image: bitnamilegacy/kubectl:1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
          volumeMounts:
            - name: kubecache
              mountPath: /tmp/kubecache
          command:
            - /bin/bash
            - -ec
            - |
              set -o pipefail
              KINDS=(HatCooldown HatMaxBindings HatConflict HatQuorum HatWarmup HatMaxNew HatNoCycle)
              TEMPLATES=(hatcooldown hatmaxbindings hatconflict hatquorum hatwarmup hatmaxnew hatnocycle)
              echo "waiting for hat ConstraintTemplates to exist..."
              for t in "${TEMPLATES[@]}"; do
                for i in $(seq 1 150); do
                  if kubectl get constrainttemplate "$t" >/dev/null 2>&1; then
                    echo "  constrainttemplate/$t present"
                    break
                  fi
                  sleep 2
                done
              done
              echo "waiting for hat constraint CRDs (Established)..."
              for kind in "${KINDS[@]}"; do
                for i in $(seq 1 150); do
                  name="$(kubectl get crd -o jsonpath="{range .items[?(@.spec.names.kind=='${kind}')]}{.metadata.name}{end}")"
                  if [ -n "$name" ]; then
                    kubectl wait --for=condition=Established "crd/${name}" --timeout=120s
                    echo "  ${kind} -> ${name}"
                    break
                  fi
                  sleep 2
                done
              done
              echo "all hat Gatekeeper constraint CRDs ready"
