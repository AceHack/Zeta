# Conflict-of-interest — reject HatBinding if the wearer already
# holds a hat listed in Hat.spec.throttles.conflictsWith of the
# hat being bound (or vice-versa).

apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: hatconflict
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  crd:
    spec:
      names:
        kind: HatConflict
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package hatconflict

        violation[{"msg": msg}] {
          input.review.kind.kind == "HatBinding"
          input.review.operation == "CREATE"
          wearer := input.review.object.spec.wearer.spiffeID
          target_name := input.review.object.spec.hat

          target_hat := data.inventory.cluster["society.zeta.io/v1alpha1"]["Hat"][target_name]
          conflict_name := target_hat.spec.throttles.conflictsWith[_]

          some ns
          some name
          existing := data.inventory.namespace[ns]["society.zeta.io/v1alpha1"]["HatBinding"][name]
          existing.spec.wearer.spiffeID == wearer
          existing.spec.hat == conflict_name
          # A HatBinding carries NO status until the operator first reconciles it
          # (the controller switches on `case "", PhasePending`). `x.status.phase
          # != "Revoked"` is then UNDEFINED, not true, and an unreconciled binding
          # silently dropped out of this rule -- with the operator down, forever.
          # Found by executing the Rego (gator, 2026-09-23); `object.get` defaults
          # the missing phase to "" so an unreconciled binding counts as held.
          object.get(existing, ["status", "phase"], "") != "Revoked"

          msg := sprintf(
            "wearer %v cannot bind hat %v while holding conflicting hat %v",
            [wearer, target_name, conflict_name],
          )
        }

        # THE REVERSE DIRECTION. The rule above reads only the INCOMING hat's
        # `conflictsWith`, so a one-sided declaration was enforced in one
        # binding order and not the other -- and this file's own header has
        # claimed "(or vice-versa)" since it was written.
        #
        # MEASURED 2026-09-19 on the committed seed hats. `policy-admin`
        # declares `conflictsWith: [executor, hat-designer]`; neither names it
        # back. So:
        #   bind executor, then policy-admin  -> policy-admin's list holds
        #                                        executor            -> DENIED
        #   bind policy-admin, then executor  -> executor's list is
        #                                        [hat-designer]      -> ALLOWED
        # Same pair, opposite outcome, decided by arrival order. An
        # anti-collusion control a wearer can defeat by choosing which hat to
        # take first is not a control.
        #
        # This rule asks the EXISTING hat's declaration instead, so the pair is
        # refused whichever arrives second. Both rules are kept: Rego violations
        # are a union, a symmetric pair is simply caught twice, and deleting
        # either one silently restores half the hole.
        violation[{"msg": msg}] {
          input.review.kind.kind == "HatBinding"
          input.review.operation == "CREATE"
          wearer := input.review.object.spec.wearer.spiffeID
          target_name := input.review.object.spec.hat

          some ns
          some name
          existing := data.inventory.namespace[ns]["society.zeta.io/v1alpha1"]["HatBinding"][name]
          existing.spec.wearer.spiffeID == wearer
          # Same unreconciled-binding default as the rule above.
          object.get(existing, ["status", "phase"], "") != "Revoked"

          existing_hat := data.inventory.cluster["society.zeta.io/v1alpha1"]["Hat"][existing.spec.hat]
          existing_hat.spec.throttles.conflictsWith[_] == target_name

          msg := sprintf(
            "wearer %v cannot bind hat %v while holding %v, which declares it conflicting",
            [wearer, target_name, existing.spec.hat],
          )
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: HatConflict
metadata:
  name: hat-conflict-default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  match:
    kinds:
      - apiGroups: ["society.zeta.io"]
        kinds: ["HatBinding"]
