# No supervisor cycles — Hat.spec.supervises forms a DAG. A cycle
# (A supervises B supervises A) would let one wearer pair self-deal
# revocations + probations. Reject Hat create/update if it would
# create a cycle.

apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: hatnocycle
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  crd:
    spec:
      names:
        kind: HatNoCycle
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package hatnocycle

        # `supervises` edges as an adjacency object over the POST-write catalog.
        # Rego forbids recursive rules (rego_recursion_error), so transitive
        # reachability is `graph.reachable`, not a self-calling helper.
        edges(catalog) = out {
          out := {node: supervised |
            catalog[node]
            supervised := {target | target := catalog[node].spec.supervises[_]}
          }
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "Hat"
          {"CREATE", "UPDATE"}[input.review.operation]
          new_hat := input.review.object
          name := new_hat.metadata.name

          existing := data.inventory.cluster["society.zeta.io/v1alpha1"]["Hat"]
          catalog := object.union(existing, {name: new_hat})

          sup := new_hat.spec.supervises[_]
          graph.reachable(edges(catalog), {sup})[name]

          msg := sprintf(
            "supervisor cycle: hat %v would supervise %v which transitively supervises %v",
            [name, sup, name],
          )
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: HatNoCycle
metadata:
  name: hat-no-cycle-default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  match:
    kinds:
      - apiGroups: ["society.zeta.io"]
        kinds: ["Hat"]
