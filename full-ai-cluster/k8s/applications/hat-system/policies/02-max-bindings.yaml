# Max bindings per wearer — caps simultaneous hats one SPIFFE
# identity can hold. Prevents authority accumulation.

apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: hatmaxbindings
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  crd:
    spec:
      names:
        kind: HatMaxBindings
      validation:
        openAPIV3Schema:
          type: object
          properties:
            maxBindingsPerWearer:
              type: integer
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package hatmaxbindings

        violation[{"msg": msg}] {
          input.review.kind.kind == "HatBinding"
          input.review.operation == "CREATE"
          wearer := input.review.object.spec.wearer.spiffeID

          existing := [b |
            some ns
            some name
            b := data.inventory.namespace[ns]["society.zeta.io/v1alpha1"]["HatBinding"][name]
            b.spec.wearer.spiffeID == wearer
            # A HatBinding carries NO status until the operator first reconciles it
            # (the controller switches on `case "", PhasePending`). `x.status.phase
            # != "Revoked"` is then UNDEFINED, not true, and an unreconciled binding
            # silently dropped out of this rule -- with the operator down, forever.
            # Found by executing the Rego (gator, 2026-09-23); `object.get` defaults
            # the missing phase to "" so an unreconciled binding counts as held.
            object.get(b, ["status", "phase"], "") != "Revoked"
          ]
          count(existing) >= input.parameters.maxBindingsPerWearer

          msg := sprintf(
            "wearer %v already holds %v hats; max is %v",
            [wearer, count(existing), input.parameters.maxBindingsPerWearer],
          )
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: HatMaxBindings
metadata:
  name: hat-max-bindings-default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  match:
    kinds:
      - apiGroups: ["society.zeta.io"]
        kinds: ["HatBinding"]
  parameters:
    maxBindingsPerWearer: 3
