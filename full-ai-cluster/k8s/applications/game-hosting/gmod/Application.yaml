# Garry's Mod base-test game server (PLATFORM-ARCHITECTURE.md §3.2). The
# App-of-Apps root picks up this Application.yaml; it reconciles the namespace +
# statefulset + service in this directory. This single hand-written instance
# becomes the template the `GameServer` controller stamps out per server.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"   # after longhorn + cilium-lb-ipam
  name: gmod
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://github.com/Lucent-Financial-Group/Zeta
    targetRevision: main
    path: full-ai-cluster/k8s/applications/game-hosting/gmod
    directory:
      include: '{namespace,statefulset,service}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: game-hosting
  syncPolicy:
    automated:
      prune: false      # never auto-delete a game server + its world volume
      selfHeal: true
    # ServerSideApply DELIBERATELY ABSENT (work item 081M3JFZ59B087G0R0014NP4J7)
    # -- same class as agent-memory/headscale/spire (argo-cd#11143): a
    # StatefulSet with volumeClaimTemplates under SSA reads OutOfSync forever on
    # the defaulted `apiVersion`/`kind`/`volumeMode`/`status` of the claim
    # template plus the `metadata.creationTimestamp: null` ArgoCD's prediction
    # adds, which no manifest field or ignore rule can reach. Live: StatefulSet/
    # gmod was this Application's only OutOfSync resource. This change touches
    # only the sync option -- the pod securityContext/volumes are untouched.
    # The StatefulSet is ~4KB, far under the 262144-byte cap client-side apply's
    # last-applied-configuration is subject to.
    syncOptions:
      - CreateNamespace=true
