# External entry point for the GMod server. type=LoadBalancer → Cilium LB-IPAM
# assigns an IP from the pool (needs the cilium-lb-ipam app). Players connect to
# <LB-IP>:27015. (Public-internet reachability is a separate physical layer —
# see PLATFORM-ARCHITECTURE.md §4.1: a home/NAT IP won't serve public players.)
apiVersion: v1
kind: Service
metadata:
  name: gmod
  namespace: game-hosting
  labels:
    app.kubernetes.io/name: gmod
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local   # preserve client IP; keep traffic on this node
  selector:
    app.kubernetes.io/name: gmod
  ports:
    - { name: game-udp, port: 27015, targetPort: 27015, protocol: UDP }
    - { name: game-tcp, port: 27015, targetPort: 27015, protocol: TCP }
---
# Separate Service for SFTP (different IP/port lifecycle from the game port).
#
# CLUSTER-INTERNAL BY DEFAULT. SFTP is opt-in (statefulset.yaml: with no `gmod-sftp-keys` ConfigMap
# the sidecar idles and nothing listens on :22), but this Service used to be a LoadBalancer
# unconditionally, so a fresh install spent one of the LoadBalancer pool's addresses (the installer
# resolves a range of at most a few dozen) on a port that answers nothing. ClusterIP takes none.
# To open it on the LAN as well, at the same time as creating the keys ConfigMap:
#   kubectl -n game-hosting patch svc gmod-sftp -p '{"spec":{"type":"LoadBalancer"}}'
# (the Application ignores that field's drift: see gmod/Application.yaml `ignoreDifferences`).
# Until then: kubectl -n game-hosting port-forward svc/gmod-sftp 2222:2222
apiVersion: v1
kind: Service
metadata:
  name: gmod-sftp
  namespace: game-hosting
  labels:
    app.kubernetes.io/name: gmod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gmod
  ports:
    - { name: sftp, port: 2222, targetPort: 22, protocol: TCP }
