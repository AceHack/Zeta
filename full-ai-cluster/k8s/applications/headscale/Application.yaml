# full-ai-cluster/k8s/applications/headscale/Application.yaml
#
# NO HELM CHART. ArgoCD reconciles the YAML in this directory directly, which is
# the shape ten other applications here already use (agent-memory, cdi,
# cilium-lb-ipam, deepseek-coder, hat-system, kubevirt, orleans, platform,
# qwen-coder, vllm).
#
# WHY THIS ONE LEFT HELM, recorded because "we dropped the chart" is the kind of
# decision that looks arbitrary a year later:
#
#   gabe565/headscale, the original pin, went DORMANT -- 563 days with no upstream
#   publish. Dormancy is a hard failure here, not a warning: staying on
#   unmaintained infrastructure is the same class of defect as a red check.
#
#   The repoint to codeberg.org/wrenix/helm-charts headscale 1.0.19 was measured
#   and correct at the chart level -- `helm pull` returns a digest, the chart
#   renders 12 resources against our values, `server_url` survives the render, and
#   inert-valuesobject-keys.ts does not flag it. It still came back
#   OutOfSync/Missing on the live kind lane, and what remained after those
#   eliminations was ArgoCD-side resolution of a BARE-HOST OCI `repoURL` with no
#   repository registration anywhere in this tree (ArgoCD v3.5.2).
#
#   That form has never been exercised by the dev included-proof. Three other apps
#   use it -- forgejo, arc-runner-set, hindsight -- and all three are deferred for
#   reasons that have NOTHING to do with OCI (a missing GitHub App credential; a
#   standby Git host that ships manual-sync by design; blockers the lane cannot
#   reach). So it is a coincidence that no OCI chart is asserted, NOT evidence the
#   form is broken -- an earlier draft of this comment claimed the pattern was
#   suspicious, which was a co-occurrence read as structure.
#
#   And wrenix publishes OCI only: its classic Helm index is empty (`entries: {}`).
#   So the choice was to debug an unproven transport, or to own ~90 lines of YAML
#   for a single-replica service whose config we want direct control over anyway.
#
# THE STANDING RULE THIS FOLLOWS (Aaron 2026-09-05): prefer the third-party chart;
# own the deployment ourselves only when our requirements cannot get in through
# the app-of-apps. Here the requirement that could not get in was the plainest one
# -- that it sync at all on the dev rung.
#
# What owning it buys, beyond the transport: headscale's config schema changes
# across releases (this app has already been bitten once, 2026-08-22, when an
# entire `config:` block was INERT because the chart had no such key and the
# container ran with no server_url from any source). A ConfigMap we write cannot
# be inert -- there is no values schema between us and the file.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after core infra (longhorn/cilium) at wave 0
  name: headscale
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Lucent-Financial-Group/Zeta
    targetRevision: main
    path: full-ai-cluster/k8s/applications/headscale
    directory:
      # An INCLUDE glob, not `recurse: true` + an exclude. Both express the same
      # set today, but the repo's renderers walk `directory.include` to find which
      # manifests an Application actually syncs -- so the recurse form renders as
      # NOTHING to them and every governed row prices a workload that, as far as
      # the tooling can see, does not exist. Caught by rendered-resource-requests
      # reporting "0m / 0Mi" for an app whose statefulset plainly declares 100m.
      include: '{namespace,configmap,service,statefulset}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: headscale
  # ServerSideApply DELIBERATELY ABSENT -- same class as cockroachdb and the spire
  # precedent (spire/Application.yaml). This is a git-directory Application, not a
  # Helm one, so there is no chart to mis-render: the drift is the bare
  # `statefulset.yaml` in this directory, whose `volumeClaimTemplates[0]` sets only
  # name/accessModes/storageClassName/resources.requests.storage (36 lines total,
  # JSON-encoded well under 1KB). The defaulted `apiVersion`/`kind`/`status`/
  # `metadata.creationTimestamp` ArgoCD's ServerSideApply-emulated diff introduces
  # are a property of the LIVE StatefulSet's embedded PersistentVolumeClaim
  # template going through the API server's internal conversion (argo-cd#11143),
  # not of Helm -- so a hand-written manifest hits it identically. With this
  # Application's single StatefulSet 55x under the 262144-byte
  # last-applied-configuration cap, dropping ServerSideApply is free.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
