# CockroachDB — distributed SQL. Backs Temporal + GitLab + Forgejo
# + any workload wanting strong consistency + horizontal scale.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: cockroachdb
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://charts.cockroachdb.com/
    chart: cockroachdb
    targetRevision: 14.0.5
    helm:
      releaseName: cockroachdb
      valuesObject:
        statefulset:
          replicas: 3
        storage:
          persistentVolume:
            enabled: true
            # SIZE CUT, NOT A POD CUT. 100Gi -> 48Gi per member; `replicas: 3`
            # above is UNTOUCHED. This claim was the single biggest line in the
            # catalogue at 300 GiB, and that 300 was 100 x 3 -- so the cheap way
            # to shrink it was to drop to one member. That was refused: a
            # 1-member CockroachDB has no Raft quorum, no replication and no
            # survivable failure, and trading a real guarantee for disk we
            # actually have would be a bad deal. (The `minimal` rung DOES drop
            # to 1 and says so; it is for a ~300 GiB box, not this one.)
            #
            # WHAT 48Gi COSTS: store capacity per member -- user data plus
            # indexes plus MVCC garbage before the node hits its store limit.
            # Nothing about durability or availability changes.
            #
            # Owned by full-ai-cluster/k8s/storage-profiles.json (profile
            # `measured`). Edit the profile and re-apply, not this line. Note
            # Kubernetes can GROW a PVC but cannot SHRINK one: this number is
            # only free to move DOWN before the volume exists.
            # SHRINKING THIS DOES NOT FREE A BYTE OF RUNNER DISK, and it is the first
            # thing anyone reaches for. On the dev/CI substrate this class resolves to
            # `rancher.io/local-path`, whose node-side provisioner script (see
            # full-ai-cluster/nixos/modules/local-storage.nix) is `mkdir -m 0777 -p
            # "$VOL_DIR"` -- a directory, with no quota and no reference to the requested
            # size at all. A PVC there consumes the bytes WRITTEN and nothing more, so
            # this number is a scheduling reservation on Longhorn (metal) and is not
            # bytes on a runner. What actually fills a runner is CONTAINER IMAGES: run
            # `bun src/Core.TypeScript/cluster/image-footprint.ts --report` for the
            # measured per-app ranking, and `runner-disk.ts --measure` for the disk.
            size: 48Gi
            storageClass: longhorn
        init:
          # THE DEADLOCK THIS ONE LINE BREAKS, and it is not a dev-only defect --
          # it is why NO 3-replica CockroachDB under this chart has ever come up
          # healthy under ArgoCD, on any substrate.
          #
          # MEASURED (run 32519516070): cockroachdb-0/1/2 Running on bound PVCs
          # for 38 minutes with every readiness probe returning 503, and NO
          # `cockroachdb-init` Job anywhere in the namespace. A multi-node
          # CockroachDB serves nothing until `cockroach init` has been run once,
          # so 503 is the correct behaviour of an un-init'ed cluster, not a bug
          # in the pods.
          #
          # THE CHART ALREADY SHIPS THE FIX and it never gets to run. cockroachdb
          # 14.0.5 templates/job.init.yaml renders `cockroachdb-init` whenever
          # `conf.join` is empty and `single-node` is false -- both true below --
          # and annotates it `helm.sh/hook: post-install,post-upgrade`. ArgoCD
          # maps those to its PostSync phase, and PostSync runs only after every
          # Sync-phase resource is SYNCED **AND HEALTHY**
          # (gitops-engine pkg/sync/sync_context.go: a non-hook task stays
          # `running` until `health.GetResourceHealth` says Healthy, and
          # `setRunningPhase` literally prints "waiting for healthy state of").
          # The StatefulSet cannot be healthy until the pods are Ready; the pods
          # cannot be Ready until init runs; init is the thing waiting for
          # health. Circular, and it never resolves.
          #
          # WHY THIS ANNOTATION IS THE WHOLE FIX. gitops-engine
          # pkg/sync/hook/hook.go `Types()` reads `argocd.argoproj.io/hook`
          # first and, in its own comment, "we ignore Helm hooks if we have Argo
          # hook" -- so naming the Argo hook REPLACES the Helm post-install
          # mapping rather than fighting it, and the Job moves into the Sync
          # phase alongside the StatefulSet it is unblocking. No YAML key is
          # duplicated: `helm.sh/hook` still renders and is simply not consulted.
          #
          # RUNNING IT TWICE IS SAFE, which is the requirement for a hook that
          # re-runs on every sync. The chart's command is a `while true` loop
          # that breaks on EITHER "Cluster successfully initialized" OR "cluster
          # has already been initialized", so a second run against a live store
          # observes the second string and exits 0. It never re-initialises and
          # never touches data. Delete policy resolves to `BeforeHookCreation`
          # (DeletePolicies() UNIONs the Argo and Helm annotations, and the Helm
          # one already says before-hook-creation), so each sync replaces the
          # previous Job object rather than accumulating them.
          #
          # WHAT FAILURE LOOKS LIKE NOW, since it must not be silent: an init
          # that cannot succeed leaves the hook Running, ArgoCD reports "waiting
          # for completion of hook batch/Job/cockroachdb-init", and the proof
          # fails on its timeout naming the hook. Before this line the same
          # situation reported a Progressing StatefulSet and named nothing.
          jobAnnotations:
            argocd.argoproj.io/hook: Sync
        conf:
          single-node: false
          cache: 25%
          max-sql-memory: 25%
        tls:
          enabled: true
          certs:
            selfSigner:
              enabled: true
              caProvided: false
        prometheus:
          enabled: true # for kube-prometheus-stack scrape
  destination:
    server: https://kubernetes.default.svc
    namespace: cockroachdb
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
