# Loki — log aggregation. Object storage via shared in-cluster MinIO
# (default) or SeaweedFS — see k8s/object-store/BLOB-STORE-CONTRACT.md.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: loki
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    # 18.11.7 -> 18.12.1 on 2026-09-04: a PURE CHART bump -- appVersion is 3.7.7 at both,
    # checked against the live index of grafana-community (NOT grafana: that repo's `loki` is
    # Grafana Enterprise Logs on a 7.x series, a different chart entirely, and comparing
    # against it would have read as 11 major versions ahead).
    targetRevision: 18.12.1
    helm:
      releaseName: loki
      valuesObject:
        global:
          # -config.expand-env=true is what makes `${BLOB_STORE_SECRET_KEY}` above a
          # reference rather than a literal string. WITHOUT IT loki would authenticate
          # with the seven characters `${BLOB` -- a silent auth failure, not a crash.
          extraArgs:
            - -config.expand-env=true
          extraEnvFrom:
            - secretRef:
                name: zeta-blob-store
        deploymentMode: SimpleScalable
        minio:
          enabled: false
        loki:
          auth_enabled: false
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index: { prefix: loki_index_, period: 24h }
          storage:
            type: s3
            bucketNames: { chunks: loki-chunks, ruler: loki-ruler }
            s3:
              endpoint: blob-store-seaweedfs-all-in-one.object-store.svc:8333
              accessKeyId: zeta-blob-store
              # EXPANDED AT RUNTIME from the minted Secret, never committed
              # (081M1S6Z5S3087G0R000GEPSS2). `global.extraArgs` below turns on
              # `-config.expand-env=true`, which is the mechanism this chart's own values
              # documentation names for exactly this: "Such environment variables can be then
              # stored in a separate Secret and injected via the global.extraEnvFrom value."
              secretAccessKey: ${BLOB_STORE_SECRET_KEY}
              insecure: true
              s3ForcePathStyle: true
        write: { replicas: 1 }
        read:  { replicas: 1 }
        backend: { replicas: 1 }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        # STARTUP PROBES -- ALL THREE CONTAINERS BELOW HAVE THE COORDINATE. MEASURED
        # (helm pull loki 18.12.1 --untar): none of the three had an override in this
        # Application before, so each rendered its chart default liveness with no
        # startupProbe:
        #   - lokiCanary (DaemonSet/loki-canary, container canary): 35s
        #   - gateway.metrics (Deployment/loki-gateway, container exporter -- the
        #     nginx access-log exporter sidecar): 50s
        #   - sidecar (StatefulSet/loki-backend, container loki-sc-rules -- the rules
        #     ConfigMap/Secret watcher sidecar): 90s
        # None individually vetted at WP15's 2026-09-22 catalog audit; loki is a known
        # slow starter (WP18 category b) and all three are sidecars/daemons that can be
        # scheduled and start probing before the object-store-backed main containers
        # they watch are reachable, under first-boot pod/image pressure.
        #
        # Kubelet holds `livenessProbe` off entirely until `startupProbe` first
        # succeeds. periodSeconds 10, failureThreshold 30 -> startup kill budget
        # 0+29*10=290s for each; the chart's own (unchanged) liveness resumes once
        # startup succeeds.
        lokiCanary:
          startupProbe:
            httpGet: { path: /metrics, port: http-metrics }
            periodSeconds: 10
            failureThreshold: 30
        gateway:
          metrics:
            startupProbe:
              httpGet: { path: /metrics, port: http-metrics }
              periodSeconds: 10
              failureThreshold: 30
        sidecar:
          startupProbe:
            enabled: true
            httpGet: { path: /healthz, port: http-sidecar }
            periodSeconds: 10
            failureThreshold: 30
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .status.terminatingReplicas
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
