# Loki — log aggregation.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.18.0
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: SimpleScalable
        loki:
          auth_enabled: false
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index: { prefix: loki_index_, period: 24h }
          storage:
            type: s3
            # TODO: point at an in-cluster S3 (MinIO, SeaweedFS) or
            # external S3-compatible storage. For now, bucket lives
            # in a placeholder values-set you wire after picking
            # object-storage backend.
            bucketNames: { chunks: loki-chunks, ruler: loki-ruler }
        write: { replicas: 2 }
        read:  { replicas: 2 }
        backend: { replicas: 2 }
        chunksCache: { enabled: true }
        resultsCache: { enabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
