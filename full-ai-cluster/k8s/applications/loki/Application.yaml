# Loki — log aggregation. Object storage via shared in-cluster MinIO
# (default) or SeaweedFS — see k8s/object-store/BLOB-STORE-CONTRACT.md.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: loki
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.18.0
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: SimpleScalable
        minio:
          enabled: false
        loki:
          auth_enabled: false
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index: { prefix: loki_index_, period: 24h }
          storage:
            type: s3
            bucketNames: { chunks: loki-chunks, ruler: loki-ruler }
            s3:
              endpoint: blob-store.object-store.svc:9000
              accessKeyId: zeta-blob-store
              secretAccessKey: zeta-blob-store-dev-secret
              insecure: true
              s3ForcePathStyle: true
        write: { replicas: 1 }
        read:  { replicas: 1 }
        backend: { replicas: 1 }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .status.terminatingReplicas
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
