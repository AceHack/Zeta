# CDI (Containerized Data Importer) — imports VM disk images into PVCs.
# KubeVirt's companion: KubeVirt runs the guest, CDI is how the guest's
# disk gets populated (Windows ISOs, virtio drivers, golden images).
#
# WHY THIS EXISTS: same story as the sibling kubevirt Application — CDI
# was installed by hand on node-5b2dfa (2026-07-12) and existed nowhere
# in git, so nothing about the Windows-guest pipeline was reproducible
# from the USB installer.
#
# Vendored VERBATIM from the upstream release
#   https://github.com/kubevirt/containerized-data-importer/releases/download/v1.65.0/cdi-operator.yaml
# (no official Helm chart; pins the exact bytes running today —
# quay.io/kubevirt/cdi-operator:v1.65.0, confirmed against the live
# deployment). It creates the `cdi` namespace itself.
#
# "VERBATIM" IS NOW CHECKED, NOT ASSERTED. That word used to be a promise in
# this comment and nothing re-measured it. `src/Core.TypeScript/cluster/
# vendored-upstream-parity.ts` sha256s cdi-operator.yaml against the digest of
# the pinned release asset above on every CI run of the cluster plan job
# (offline; `--fetch` also re-checks what the URL serves today, because a
# release asset can be replaced in place). It also refuses any file this
# Application's `directory.include` glob applies that is not classified as
# upstream's bytes or ours — cdi-cr.yaml is classified OURS, and it genuinely
# is: upstream's cdi-cr.yaml is a 309-byte stub.
#
# WHY THIS IS NOT A CHART REFERENCE. Aaron's standing preference is to
# reference upstream and override with our own values rather than vendor.
# Upstream offers nothing to reference: containerized-data-importer v1.65.0
# ships two YAML release assets and no Helm chart (measured 2026-08-23 against
# the release's asset list). Where upstream publishes a chart — 33 of the 47
# Applications in this tree — we reference it at a pinned version and override
# via valuesObject. This is the exception, and the parity check is what keeps
# it a cache of a pinned URL rather than a fork.
#
# NO automated sync — DELIBERATE, same reasoning as kubevirt: this adopts
# a live operator underneath running production guests. Sync by hand once
# after reading the diff:
#   argocd app diff cdi
#   argocd app sync cdi
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # MOVED -5 -> 50 (081M1...WP3, resource.customizations.health.argoproj.io_Application
    # gate). This is a declared manual-sync Application (see the annotation
    # below): nothing ever auto-syncs it, so its honest live health on a fresh
    # cluster is "Missing" forever, until a human runs `argocd app sync cdi`.
    # Once Application-CRD health assessment is restored in argocd-cm (this same
    # change), sync-wave gating starts WAITING for each wave's Applications to
    # be Healthy before starting the next wave -- globally, across the whole
    # zeta-root sync, regardless of the dependency graph. A manual-sync app
    # sitting at any wave OTHER than the last would therefore wedge every
    # automated Application behind it forever. Nothing in this tree depends ON
    # cdi (sync-wave-dependency-graph.yaml has no `dependsOn: [cdi]` edge and no
    # manifest here references a kubevirt.io/cdi.kubevirt.io CRD), so moving it
    # to the tail is free. Matches the same convention already used by the
    # other two manual-sync Applications, ollama/vllm (both wave 50).
    # `derive-sync-waves.ts`'s manual-sync-floor check refuses if this ever
    # drifts below the automated-Application ceiling again.
    argocd.argoproj.io/sync-wave: "50"   # LAST wave -- manual-sync; see comment above
    # Machine-readable form of the header above, read by
    # src/Core.TypeScript/cluster/manual-sync-policy.ts. The comment states the
    # intent to humans; this states it to the checkers, which otherwise cannot
    # tell a deliberate omission from a forgotten one.
    zeta.io/sync-policy: manual
    zeta.io/sync-policy-reason: Adopts a CDI operator installed by hand on
      node-5b2dfa, the box running three production Windows guests. An automated
      sync could roll cdi-operator under live VM disk imports. Sync it by hand
      after reading argocd app diff cdi. SCOPE - this is a constraint on THAT
      CLUSTER, not on these bytes. CDI needs no virtualization at all, so it is
      testable independently of kubevirt, and the vendored operator plus CR are
      deployed and asserted to reach phase Deployed on every run of the
      live-kind-virt job in .github/workflows/k8s-argocd-health-test.yml, driven
      by src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.ts.
  name: cdi
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://github.com/Lucent-Financial-Group/Zeta
    targetRevision: main
    path: full-ai-cluster/k8s/applications/cdi
    directory:
      include: '{cdi-operator,cdi-cr}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: cdi
  syncPolicy:
    # No `automated:` block — see the header. Manual sync only.
    syncOptions: [ ServerSideApply=true ]
