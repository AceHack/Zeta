# Longhorn — distributed block storage. Stateful workloads land here
# (Postgres for GitLab, CockroachDB data dirs, Weaviate, etc.).
# Local-path storage (NixFlake module) covers stateless workloads.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
  name: longhorn
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.7.2
    helm:
      releaseName: longhorn
      valuesObject:
        # The pre-upgrade checker Job is an UPGRADE-only hook; on a fresh
        # install it deadlocks (its pod needs the ServiceAccount the blocked
        # sync would create) and stalls the whole Longhorn sync -> no
        # `longhorn` StorageClass -> every dependent PVC hangs Pending.
        preUpgradeChecker:
          jobEnabled: false
        defaultSettings:
          defaultDataPath: /var/lib/longhorn
          # Honour the per-node disk set that nixos/modules/longhorn-disks.nix
          # publishes as the node.longhorn.io/default-disks-config annotation.
          # WITHOUT this, Longhorn ignores that annotation outright and every
          # node falls back to defaultDataPath alone -- i.e. the boot disk only,
          # with any extra NVMe sitting idle. The three parts (label, annotation,
          # this setting) are all required; none works alone.
          createDefaultDiskLabeledNodes: true
          # Single control-plane node today. A replica count > the number of
          # schedulable nodes leaves every volume permanently "Degraded"
          # (Longhorn can't place the extra replicas), which surfaces as
          # unhappy PVCs on a fresh single-node install. Keep this == node
          # count; bump to 2 (then 3) as workers join for real HA.
          defaultReplicaCount: 1
        persistence:
          defaultClass: false
          defaultClassReplicaCount: 1   # match defaultReplicaCount (single-node)
          reclaimPolicy: Retain
        ingress:
          enabled: false   # turn on after cert-manager + ingress-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # never prune storage
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
