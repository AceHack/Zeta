# Longhorn — distributed block storage. Stateful workloads land here
# (Postgres for GitLab, CockroachDB data dirs, Weaviate, etc.).
# Local-path storage (NixFlake module) covers stateless workloads.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
  name: longhorn
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    # 1.7.2 -> 1.12.1 on 2026-09-01. Rendered at BOTH versions with this
    # Application's own valuesObject; it loses only Service/longhorn-conversion-webhook, consolidated upstream. Highest
    # blast radius in the tree, so it was checked against our own valuesObject -- and a
    # flashed machine has no volumes to migrate.
    targetRevision: 1.12.1
    helm:
      releaseName: longhorn
      valuesObject:
        # The pre-upgrade checker Job is an UPGRADE-only hook; on a fresh
        # install it deadlocks (its pod needs the ServiceAccount the blocked
        # sync would create) and stalls the whole Longhorn sync -> no
        # `longhorn` StorageClass -> every dependent PVC hangs Pending.
        preUpgradeChecker:
          jobEnabled: false
        defaultSettings:
          defaultDataPath: /var/lib/longhorn
          # Honour the per-node disk set that nixos/modules/longhorn-disks.nix
          # publishes as the node.longhorn.io/default-disks-config annotation.
          # WITHOUT this, Longhorn ignores that annotation outright and every
          # node falls back to defaultDataPath alone -- i.e. the boot disk only,
          # with any extra NVMe sitting idle. The three parts (label, annotation,
          # this setting) are all required; none works alone.
          createDefaultDiskLabeledNodes: true
          # THE REQUEST THE LEDGER CANNOT SEE (081M3TS67PE087G0R002ZZ1XYT).
          # Longhorn creates one instance-manager pod per node at RUNTIME, requesting
          # `guaranteedInstanceManagerCPU` percent of the node's TOTAL ALLOCATABLE CPU --
          # chart 1.12.1 values.yaml / README: "The default value is
          # {"v1":"12","v2":"12"}". No manifest in this tree renders that pod, so no
          # `resourceClaims` row, snapshot or budget has ever counted it. On the
          # smallest registered node (16000m, 15250m allocatable after the 750m of
          # kube+system reservations in k3s-server.nix) 12% is 1830m: the committed
          # `metal` roster (13215m before the platform controllers were priced) plus
          # that pod was already 15045m of 15250m, and pricing the controllers would
          # have tipped it over -- the last pods to schedule go Pending, forever. The
          # pod is a REQUEST, not a limit, so lowering it costs scheduling weight under
          # contention and nothing else; 5% is 762m on that node (roster 14015m + 762m
          # = 14777m, 473m spare -- still tight). A JSON STRING, not a map: the chart
          # accepts either (`longhorn.multiTypeSetting` quotes a string and toJson's a
          # map, to the same ConfigMap value), but its schema lists this key as a leaf,
          # so `inert-valuesobject-keys.ts` refuses `.v1` / `.v2` children as inert.
          # defaultSettings only take effect on first install, which is the case this
          # tree exists for. Guarded by platform-controllers-requests.test.ts.
          guaranteedInstanceManagerCPU: '{"v1":"5","v2":"5"}'
          # Single control-plane node today. A replica count > the number of
          # schedulable nodes leaves every volume permanently "Degraded"
          # (Longhorn can't place the extra replicas), which surfaces as
          # unhappy PVCs on a fresh single-node install. Keep this == node
          # count; bump to 2 (then 3) as workers join for real HA.
          defaultReplicaCount: 1
        persistence:
          defaultClass: false
          defaultClassReplicaCount: 1   # match defaultReplicaCount (single-node)
          reclaimPolicy: Retain
        ingress:
          enabled: false   # turn on after cert-manager + ingress-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # never prune storage
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
