# SeaweedFS — THE S3-compatible blob store for this cluster.
#
# It became the only one on 2026-09-01, when minio/ was removed. MinIO's
# community edition repository was ARCHIVED in February 2026 -- read-only, no
# active development, NO SECURITY PATCHES, no pre-built OSS binaries -- and its
# chart repo had published nothing since 2025-01-02 (newest 5.4.0, appVersion
# RELEASE.2024-12-18T13-15-44Z, verified live against charts.min.io). An
# unpatched object store is a security posture, not a staleness metric.
#
# SeaweedFS is Apache 2.0 (no AGPL exposure), actively published -- 4.45.0 landed
# 2026-09-01 -- and serves the same S3 API surface, which is why this migration is
# an ENDPOINT CHANGE and nothing more. Loki and Mimir now address the Service
# below directly.
# See full-ai-cluster/k8s/object-store/BLOB-STORE-CONTRACT.md.
#
# allInOne mode: single pod with embedded master/volume/filer/S3 gateway.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  name: seaweedfs
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    # 4.33.0 -> 4.45.0 on 2026-09-01. THIS CLOSES AN UNPATCHED HIGH CVE IN THE PIN
    # WE WERE SHIPPING: CVE-2026-77611 / GHSA-9x53-cjpr-m682, CVSS 7.1, published
    # 2026-08-21, vulnerable range `< 4.39` -- an authenticated S3 object-scope
    # bypass where a SCOPED principal can overwrite an object outside its permitted
    # key prefix via PutObjectAcl on a nested key.
    #
    # The uncomfortable part, recorded rather than smoothed: minio was removed from
    # this tree days earlier FOR HAVING UNPATCHED HIGH ADVISORIES, and its
    # replacement was sitting on one. Nobody chose that -- the CVE published after
    # the replacement was designed -- and it is exactly the argument for checking
    # upstream health on a schedule rather than only at swap time.
    #
    # Exposure was LOW AND THE REASON IS CHECKABLE, which is why this is a bump and
    # not an incident: the bypass needs a scoped identity to escape FROM, and the
    # valuesObject below defines exactly one principal, `admin`, with full access.
    # There is no restricted identity for it to victimise. That is a reason it was
    # not an emergency, never a reason to leave it.
    #
    # MEASURED before bumping -- `helm template` at both versions with the exact
    # valuesObject below: both render; 9 -> 10 resources; the single addition is
    # Secret/blob-store-seaweedfs-s3-secret (the S3 credential becomes a real Secret
    # instead of being inlined); nothing removed. Every value still takes effect --
    # all five buckets render, the PVC is still 20Gi on zeta-local-path under the
    # same claimName, auth is still on, master/volume/filer stay disabled.
    #
    # WATCH ON FIRST DEPLOY: seaweedfs changed its S3 identity loader to fail CLOSED
    # rather than open when zero identities load. That is the safer direction, but
    # it turns a silently-permissive misconfiguration into a hard failure, so
    # smoke-test createBuckets/auth rather than assuming.
    targetRevision: 4.45.0
    helm:
      # Must differ from minio in object-store; keeps Service blob-store-seaweedfs-all-in-one.
      releaseName: blob-store-seaweedfs
      valuesObject:
        master: { enabled: false }
        volume: { enabled: false }
        filer: { enabled: false }
        s3:
          enabled: false
          # THE SECRET IS MINTED, NOT COMMITTED (081M1S6Z5S3087G0R000GEPSS2). This block used
          # to carry `credentials.admin.secretKey` as a literal, in a PUBLIC repository, and
          # it reached the rendered Secret twice -- as `admin_secret_access_key` and inside
          # the generated `seaweedfs_s3_config` identities JSON.
          #
          # `existingConfigSecret` REPLACES the generated document entirely, so the chart no
          # longer mints its own identities: `applyDevSharedSecrets` draws one value per
          # cluster and writes the same `seaweedfs_s3_config` into object-store, plus the
          # matching env var into loki and mimir. One draw, four presenters.
          #
          # The chart's own `anvReadOnly` identity goes with the generated document. Nothing
          # consumed it and it was `randAlphaNum` per render, so fewer identities here is the
          # correct outcome rather than a regression.
          existingConfigSecret: zeta-blob-store
        allInOne:
          enabled: true
          data:
            type: persistentVolumeClaim
            size: 20Gi
            storageClass: zeta-block-local
          s3:
            enabled: true
            enableAuth: true
            createBuckets:
              - name: loki-chunks
              - name: loki-ruler
              - name: mimir-tsdb
              - name: mimir-ruler
              - name: zeta-backups
              # GitLab's bundled minio subchart is disabled (gitlab/Application.yaml,
              # 2026-09-22 -- both its images are gone from Docker Hub); GitLab's consolidated
              # object storage and the container registry now address this store instead.
              # Bucket names match the gitlab chart's own defaults
              # (`charts/gitlab/values.yaml` lfs/artifacts/uploads/packages `bucket:` keys) so
              # nothing in gitlab/Application.yaml needs an override to match them; the
              # registry has no chart default, so `gitlab-registry` follows the `gitlab-*`
              # naming already used by the other three.
              - name: git-lfs
              - name: gitlab-artifacts
              - name: gitlab-uploads
              - name: gitlab-packages
              - name: gitlab-registry
  destination:
    server: https://kubernetes.default.svc
    namespace: object-store
  # 081M39EMBRW087G0R001RHMEDJ -- THE THIRD INSTANCE of the randAlphaNum-class
  # drift already fixed for weaviate and cilium (this Application's own
  # census: 4 of 44 render non-deterministically). `templates/sftp/
  # sftp-secret.yaml` mints admin/readonly/public_user SFTP passwords + an
  # ed25519 private key fresh on every `helm template` invocation -- MEASURED
  # offline via a two-render diff of `blob-store-seaweedfs-sftp-secret`
  # (5 of ~1500 rendered lines differ, every credential and the config JSON
  # that embeds them).
  #
  # The chart's own `helm.sh/hook: pre-install,pre-upgrade` +
  # `helm.sh/resource-policy: keep` on this Secret is NOT protection against
  # this: `pre-install,pre-upgrade` maps to ArgoCD's PreSync phase (unlike a
  # `test` hook, which gitops-engine's helm-hook mapper does not recognize
  # and therefore never applies at all -- confirmed the OPPOSITE case for
  # gitlab's test-runner Pod, left unfixed for that reason). PreSync hooks
  # DO run on every sync, and `resource-policy: keep` only stops Helm's own
  # uninstall from deleting the object -- it says nothing about ArgoCD
  # re-applying a freshly-randomized render over it on the next PreSync.
  #
  # SAME REMEDY as weaviate/cilium, same vendor citation (argo-cd
  # docs/user-guide/diffing.md's `randAlphaNum` entry). Scoped to exactly
  # this Secret's 5 data keys.
  #
  # NAMED RISK, not hidden: `RespectIgnoreDifferences=true` is now used by
  # THREE Applications in this roster (cilium, weaviate, and this one) and
  # is the strongest open lead on why cilium/weaviate stay stuck
  # `Progressing` even once their own resync loops stop (081M38GCTFX087G0R003MMTXJE
  # -- `grep -rl RespectIgnoreDifferences` matched exactly those two files
  # before this change, and no other app in the roster shows that symptom).
  # Adding a third instance is a deliberate bet that the credential-churn
  # bug (confirmed, live, security-relevant) outweighs a possible-but-
  # unconfirmed stuck-health repeat; watch this Application's health in the
  # next triggered first-boot-replica run as the check on that bet.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: blob-store-seaweedfs-sftp-secret
      jsonPointers:
        - /data/admin_password
        - /data/readonly_password
        - /data/public_user_password
        - /data/seaweedfs_sftp_config
        - /data/seaweedfs_sftp_ssh_private_key
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true ]
