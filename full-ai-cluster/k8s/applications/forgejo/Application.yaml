# Forgejo — self-hosted Git. Lighter than GitLab, and NOT its standby.
#
# BOTH GIT HOSTS RUN. Aaron 2026-09-05: "gitlab and forgejo we will be testing both
# over time so we want both up, neither is standby." This header used to say the
# opposite -- "only one should run at a time" -- and prescribe a swap procedure that
# moved the `automated:` block from gitlab to here.
#
# THE "ONLY ONE AT A TIME" CLAIM WAS NEVER MECHANICAL, which is why retiring it costs
# nothing. The two Applications target DIFFERENT namespaces (`forgejo` and `gitlab`),
# share no object, and collide over no name. What the claim was really about is
# budget, and the budget answers it: MEASURED from
# `src/Core.TypeScript/cluster/rendered-resource-requests.snapshot.json`, at both the
# dev and metal rungs --
#
#   forgejo   100m /   128Mi /  1 pod
#   gitlab   2375m /  5605Mi / 15 pods
#
# -- so running Forgejo alongside GitLab costs 4% of GitLab's CPU and 2% of its
# memory. The cheap half of an either/or pair is not worth an either/or.
#
# gitlab's totals moved 2525m/5733Mi/17 -> 2375m/5605Mi/15 on 2026-09-22 when its
# bundled minio subchart was disabled (both minio/minio and minio/mc were withdrawn
# from Docker Hub); the percentages above are unchanged to the nearest point.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  name: forgejo
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    # OCI registry, NOT a classic Helm index. `https://code.forgejo.org/forgejo-helm/`
    # is an organisation page -- its index.yaml is a 404 -- and upstream publishes
    # only to OCI: `helm install forgejo oci://code.forgejo.org/forgejo-helm/forgejo`.
    # ArgoCD's declarative form takes the registry host+path with NO `oci://` scheme;
    # ArgoCD supplies it. See https://argo-cd.readthedocs.io/en/stable/user-guide/helm/
    # ("note: the oci:// syntax is not included"). Same shape as arc-controller/,
    # arc-runner-set/ and hindsight/ in this tree.
    #
    # Chart 17.1.5 -> Forgejo 15.0.7, the newest tag. The previous pin `9.0.6` was
    # never published: that registry's 169 tags hold exactly one 9.x, `9.0.0`.
    #
    # Keep repoURL/chart/targetRevision on ADJACENT lines. `pinnedChartVersion` in
    # src/Core.TypeScript/cluster/storage-profiles.ts finds the pin by probing at
    # most three lines either side of `chart:`, and it returns "" rather than
    # failing when it cannot -- so a comment wedged between them would silently
    # unpin this app from the resource catalogue's acknowledgement key.
    repoURL: code.forgejo.org/forgejo-helm
    chart: forgejo
    targetRevision: 17.1.5
    helm:
      releaseName: forgejo
      valuesObject:
        gitea:
          admin:
            existingSecret: forgejo-initial-admin
        persistence:
          enabled: true
          size: 20Gi
          storageClass: zeta-local-path   # or longhorn for HA
        # NO `postgresql:` key -- deliberately, and this is a BEHAVIOUR CHANGE.
        #
        # This manifest used to carry `postgresql.enabled: true` ("ships its own
        # postgres; swap to CockroachDB later"). That value never worked on any
        # published chart:
        #   * charts 9.x-13.x DO have the key, but ship `postgresql-ha.enabled: true`
        #     by default, and the chart refuses both at once -- `helm template` dies
        #     with "Only one of postgresql or postgresql-ha can be enabled at the
        #     same time". So the old values did not render even at a real 9.x pin.
        #   * chart 14.0.0 REMOVED the postgresql and postgresql-ha subcharts
        #     outright, so at 14+ the key does not exist and Helm would silently
        #     drop it -- a value that reads as configuration and constrains nothing.
        # Upstream's stated reason for the removal is Bitnami ending its free image
        # catalogue, and that is measurable rather than merely cited: chart 13.0.1
        # renders `docker.io/bitnami/postgresql:17.5.0-debian-12-r18`, which now
        # returns HTTP 404 from Docker Hub. Pinning below 14 to keep the bundled
        # database would therefore buy an ImagePullBackOff, not a database.
        #
        # So the chart's own default stands: DB_TYPE=sqlite3 on the PVC above.
        # STILL OPEN, and a maintainer decision rather than one to guess here: whether
        # this host gets an external PostgreSQL (`gitea.config.database.*`) or the
        # CockroachDB the old comment pointed at. What CHANGED on 2026-09-06 is the
        # consequence of leaving it open: this Application now auto-syncs, so sqlite3
        # on the PVC above is what actually runs rather than what would run if anyone
        # ever synced it. That is a real posture with a real limitation -- one writer,
        # no replication, backed by the 20Gi local-path volume -- and it is now being
        # exercised instead of merely described.
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    # `prune: false`, matching gitlab. A Git host holds the only copy of whatever has
    # been pushed to it, so an Application-level prune is the one reconciliation this
    # workload must never perform automatically. `selfHeal` is safe and wanted: it
    # restores drifted Deployments without touching the PVC.
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
