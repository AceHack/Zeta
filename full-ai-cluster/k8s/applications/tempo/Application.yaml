# Tempo — distributed traces.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: tempo
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: 2.3.0
    helm:
      releaseName: tempo
      valuesObject:
        tempo:
          # REQUESTS DECLARED, because the chart ships `resources: {}` and an unset request
          # is not a small request: it is BestEffort, cpu.weight 2 (the cgroup floor). On a
          # contended first boot that is a trace store the scheduler may evict first and the
          # CPU scheduler starves, which is how a healthy-looking tempo misses its own
          # liveness probe (the measured mechanism in usb-installer-first-boot-reliability
          # RESUME §1: pressure -> slow -> probe timeout -> SIGKILL). Requests only, no
          # limits, on purpose: a memory limit turns an ingest burst into an OOM kill of the
          # one pod holding the WAL, and a CPU limit throttles the compactor.
          resources:
            requests:
              cpu: 12m
              memory: 256Mi
          storage:
            trace:
              backend: local
              local:
                path: /var/tempo/traces
        persistence:
          enabled: true
          storageClassName: zeta-block-replicated
          # SIZE CUT, NOT A POD CUT: 50Gi -> 20Gi, one pod either way.
          #
          # ITS GOVERNOR DOES NOT MOVE WITH IT, and this is the one cut in this
          # round where that is true, so it is stated rather than glossed. The
          # tempo chart 1.18.0 ships `tempo.retention: 24h` (values.yaml:57),
          # rendered as the compactor's `block_retention` (templates line 155),
          # and this file leaves it at that default. Retention is therefore a
          # TIME window that cannot see the disk: shrinking the volume does not
          # shorten it, it means 24h of traces has less room to fit in.
          #
          # It is left at 24h deliberately. Cutting it to a number that fits
          # 20Gi would need this cluster's trace span rate, which nobody here
          # has measured -- and inventing a window and calling it a requirement
          # is the failure this whole ladder exists to avoid. The residual risk
          # is named instead: if 24h of traces exceeds 20Gi, the local backend
          # fills and writes fail. Traces are the least load-bearing data in
          # this cluster, which is why that is an acceptable thing to leave
          # measured-later rather than guessed-now.
          size: 20Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: tempo
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
