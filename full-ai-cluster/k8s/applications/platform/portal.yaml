# The Zeta portal — the human+agent UI + room-service. A StatefulSet (NOT a
# Deployment) because it owns the DURABLE Room/event log: a Longhorn-backed
# volumeClaimTemplate -> `longhorn` StorageClass, re-bound to the same volume
# across pod restart / reschedule / node failure. That append-only log is the
# persistent collaboration + agent-memory substrate (Memory Preservation #5) —
# the same StatefulSet+PVC->longhorn pattern as agent-memory, here for Rooms.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
  namespace: zeta-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
# Reads + operates the platform resources it renders. The deploy wizard creates
# Deployables and the builder creates Blueprints; the resource console edits
# config/lifecycle. The durable Room log lives on the PVC, not the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portal
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
rules:
  - apiGroups: ["platform.zeta.io"]   # the deploy wizard creates; console edits config/lifecycle
    resources: ["deployables"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["platform.zeta.io"]   # the Blueprint Builder saves blueprints
    resources: ["blueprints"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["platform.zeta.io"]   # admin: read + apply tenants (set quotas)
    resources: ["tenants"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]   # admin + console: capacity, usage, pods, events
    resources: ["nodes", "pods", "namespaces", "resourcequotas", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]   # live logs (pod log subresource)
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]   # live CPU/memory usage
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]   # lifecycle: rollout-restart the workload
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portal
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portal
subjects:
  - kind: ServiceAccount
    name: portal
    namespace: zeta-platform
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: portal
  namespace: zeta-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/part-of: zeta-platform
spec:
  serviceName: portal
  replicas: 1   # single-writer of the Room log; the volume is the source of truth
  selector:
    matchLabels: { app.kubernetes.io/name: portal }
  template:
    metadata:
      labels: { app.kubernetes.io/name: portal }
      # OPT IN TO SCRAPING. The Alloy DaemonSet keeps only pods carrying
      # prometheus.io/scrape=true (see the annotated_pods relabel rules in
      # applications/alloy) and forwards them to Mimir. Before this block no
      # Zeta workload was scraped by anything -- the path existed and had no
      # users. The port and path below MUST answer: an annotated pod that
      # serves nothing shows DOWN and reads as instrumented, which is worse
      # than an unannotated one. src/metrics.ts is what makes them true.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: portal
      # The image below lives in a PRIVATE GHCR package -- one of the two this
      # Application runs. An anonymous manifest GET against it takes HTTP 401, a
      # credentialed one takes HTTP 200 (measured 2026-08-21).
      # Without this reference the kubelet pulls anonymously and the pod sits in
      # ImagePullBackOff on EVERY substrate -- which is why the metal platform
      # control plane has never started either. `imagePullSecrets` is a
      # LocalObjectReference, so `ghcr-pull` is resolved in THIS namespace
      # (`zeta-platform`) and nowhere else.
      #
      # WHO CREATES IT. dev/CI: `applyDevRegistryPullSecret` at bring-up, from a
      # token in the environment (`DEV_GHCR_PULL_SECRET` in dev-cluster/lib.ts).
      # METAL: NOBODY YET -- it is operator-supplied secret material under the
      # constitutional rail in `full-ai-cluster/INJECTION-POINTS.md`, or the
      # packages are made public and this reference becomes inert. Until one of
      # those happens this line does not fix metal; it makes metal's failure the
      # same named, locatable one as CI's instead of a bare 401.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000   # own the Longhorn rooms volume
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: portal
          image: ghcr.io/lucent-financial-group/zeta-portal:latest
          imagePullPolicy: Always   # :latest is rebuilt by CI — re-pull on (re)start so a rollout gets the new image
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: "8080" }
            - { name: ZETA_ROOMS_DIR, value: /var/lib/zeta-rooms }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: rooms
              mountPath: /var/lib/zeta-rooms
          readinessProbe:
            httpGet: { path: /api/catalog, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
  # The durable Room/event log — one Longhorn-backed volume, re-bound across
  # restarts. THIS is the StatefulSet PVC -> storageClass the design needs.
  volumeClaimTemplates:
    - metadata:
        name: rooms
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: zeta-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: portal
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: portal }
  ports:
    - { name: http, port: 80, targetPort: http }
    # A separately NAMED service port for the same container port, so the
    # ServiceMonitor selects by name rather than by number. The portal serves
    # its exposition on the one HTTP listener it has; splitting the name is
    # what lets the scrape config say what it means.
    - { name: metrics, port: 8080, targetPort: http }
---
# Publish the portal on the shared Cilium Gateway (HTTPS via cert-manager). The
# hostname is a placeholder — set it to your domain.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
  namespace: zeta-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  parentRefs:
    - { name: zeta-gateway, namespace: zeta-platform }
  hostnames: ["portal.zeta.example.com"]
  rules:
    - backendRefs:
        - { name: portal, port: 80 }
