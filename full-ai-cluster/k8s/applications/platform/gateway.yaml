# zeta-gateway — the shared LAN Cilium Gateway the portal (and any WebApp
# HTTPRoute) publishes on. Cilium gives this Gateway a LoadBalancer Service that
# pulls an IP from the cilium-lb-ipam pool.
#
# LAN ONLY, NO HOSTNAME, NO TLS — deliberately (081M3JG74G0087G0R001XJC837).
# This file used to carry an HTTPS listener with `hostname: portal.example.com
# # ← CHANGE` and a `cert-manager.io/cluster-issuer` annotation, and the platform
# Application also applied two Let's Encrypt ClusterIssuers with
# `email: you@example.com`. A generic installer never changes a file, so every
# install applied the placeholders; the ACME server refused the account, the
# issuers never went Ready, and ArgoCD waited on them forever — nothing after
# them in `platform` (controller, portal, this Gateway, the monitoring objects,
# the Blueprints) was ever applied.
#
# Public TLS is now INSTALL-TIME CONFIGURATION and lives in its own Application:
# when the operator supplies an ACME email + public domain (zflash
# `--acme-email/--public-domain`, or the prompt at the start of the install),
# nixos/modules/injected-public-tls.nix hands k3s the `platform-public-tls`
# Application, which owns the issuers and a separate public Gateway serving
# portal.<domain> on :80/:443 (full-ai-cluster/k8s/public-tls/). With no values,
# none of that exists and this Gateway is the whole ingress story.
# See full-ai-cluster/INJECTION-POINTS.md §10.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zeta-gateway
  namespace: zeta-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  gatewayClassName: cilium
  listeners:
    # :80 — plain HTTP, any Host header. Game servers do NOT use this — they are
    # raw UDP via their own LoadBalancer Services.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: All }
