# The platform controller — the generic reconcile Cell. Watches Deployable CRs,
# resolves the referenced Blueprint, renders Kubernetes objects with the generic
# engine, and server-side-applies them. This is the mechanical reconcile only;
# intelligent ops (diagnose/repair/optimize) is the Persona/agent layer (see
# COLLABORATION-MODEL.md). Runs after the CRDs (sync-wave -20).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-controller
  namespace: zeta-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
# It reconciles into tenant namespaces and manages the child workloads/networking
# the engine emits — scoped to exactly those kinds, nothing more.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-controller
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
rules:
  - apiGroups: ["platform.zeta.io"]
    resources: ["deployables", "blueprints", "tenants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["platform.zeta.io"]
    resources: ["deployables/status", "tenants/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["platform.zeta.io"]
    resources: ["policies"]   # the tenant reconcile writes a default Policy per namespace
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]   # read Secret/ConfigMap referenced by a Deployable's envFrom — read-only, never create
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]   # tenant provisioning: namespace + quota + limits
    resources: ["namespaces", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]   # tenant isolation
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]   # admin: read cluster capacity + per-namespace usage
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-controller
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-controller
subjects:
  - kind: ServiceAccount
    name: platform-controller
    namespace: zeta-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-controller
  namespace: zeta-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: platform-controller
    app.kubernetes.io/part-of: zeta-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: platform-controller }
  template:
    metadata:
      labels: { app.kubernetes.io/name: platform-controller }
    spec:
      serviceAccountName: platform-controller
      # The image below lives in a PRIVATE GHCR package -- one of the two this
      # Application runs. An anonymous manifest GET against it takes HTTP 401, a
      # credentialed one takes HTTP 200 (measured 2026-08-21).
      # Without this reference the kubelet pulls anonymously and the pod sits in
      # ImagePullBackOff on EVERY substrate -- which is why the metal platform
      # control plane has never started either. `imagePullSecrets` is a
      # LocalObjectReference, so `ghcr-pull` is resolved in THIS namespace
      # (`zeta-platform`) and nowhere else.
      #
      # WHO CREATES IT. dev/CI: `applyDevRegistryPullSecret` at bring-up, from a
      # token in the environment (`DEV_GHCR_PULL_SECRET` in dev-cluster/lib.ts).
      # METAL: NOBODY YET -- it is operator-supplied secret material under the
      # constitutional rail in `full-ai-cluster/INJECTION-POINTS.md`, or the
      # packages are made public and this reference becomes inert. Until one of
      # those happens this line does not fix metal; it makes metal's failure the
      # same named, locatable one as CI's instead of a bare 401.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: controller
          image: ghcr.io/lucent-financial-group/zeta-platform-controller:latest
          imagePullPolicy: Always   # :latest is rebuilt by CI — re-pull on (re)start so a rollout gets the new image
          env:
            # Emit lifecycle Events into the durable Room log (best-effort).
            - { name: ROOM_SERVICE_URL, value: "http://portal.zeta-platform.svc.cluster.local" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
