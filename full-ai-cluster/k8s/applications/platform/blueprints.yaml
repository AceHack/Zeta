# Starter Blueprint LIBRARY — pure DATA. Each entry is a new deployable "type"
# the platform supports, added with ZERO new controller code. This is the
# concrete proof of "super generic but configurable and buildable on top of":
# a game server, a web app, and a database are all just Blueprints the same
# engine renders. Add more by appending YAML here (or letting tenants create
# their own Blueprint CRs).
---
# Garry's Mod — the game-server base test. Stateful (world + addons persist),
# UDP game port exposed on the LAN, an SFTP sidecar for the FTP-root workflow,
# and the image's own steamcmd install. A Deployable referencing this needs only a name.
apiVersion: platform.zeta.io/v1alpha1
kind: Blueprint
metadata:
  name: gmod
  namespace: zeta-platform
spec:
  category: game
  stateful: true
  # WAS `:gmod`, WHICH IS A 404 -- THE PUBLISHER'S TAG IS `garrysmod`.
  # MEASURED 2026-08-23, not guessed: `ghcr.io/v2/ich777/steamcmd/tags/list`
  # returns 94 tags and `gmod` is not among them; `garrysmod` is, and it is the
  # only Garry's-Mod-shaped entry there. The `GAME_ID: 4020` below is Steam's
  # Garry's Mod Dedicated Server appid, so the tag and the install agree. Until
  # now this Blueprint named an image nobody publishes: a Deployable referencing
  # it would ImagePullBackOff, and `measure-lane-footprints.ts` could not size
  # it, which is part of why the whole `platform` Application sat in the
  # partitioner's CANNOT BE PRICED quarantine.
  image: ghcr.io/ich777/steamcmd:garrysmod
  # NO `install:`, `command:` OR `args:` — the image installs and runs itself
  # (workitem 081M0QB1ZCV087G0R001P9YCPX). The old install line called
  # `/opt/steamcmd/steamcmd.sh`, which is in no layer of this image. Its
  # Entrypoint `/opt/scripts/start.sh` (as root) chowns /serverdata, drops to
  # the `steam` user and runs `start-server.sh`, which downloads steamcmd into
  # STEAMCMD_DIR (/serverdata/steamcmd), runs `app_update ${GAME_ID}` into
  # SERVER_DIR (/serverdata/serverfiles), then execs
  # `srcds_run -game ${GAME_NAME} ${GAME_PARAMS} -console +port ${GAME_PORT}`.
  # Overriding `command:` skipped all of that. The contract was read from the
  # image's own config and layers; evidence in
  # full-ai-cluster/platform-controller/src/blueprint.test.ts.
  env:
    GAME_ID: "4020"
    GAME_NAME: "garrysmod"
    GAME_PARAMS: "+maxplayers ${MAXPLAYERS} +gamemode ${GAMEMODE} +map ${MAP}"
    GAME_PORT: "${PORT}"
    VALIDATE: "${VALIDATE}"
  ports:
    - { name: game, port: 27015, protocol: UDP }
  # SERVER_DIR, not DATA_DIR: a volume over /serverdata would hide the image's
  # empty `steamcmd/` directory, and start-server.sh wgets into it without a
  # mkdir. So steamcmd is re-fetched on each pod start; the game files persist.
  storage: { size: "20Gi", mountPath: /serverdata/serverfiles }
  resources: { cpu: "2", memory: "4Gi" }
  variables:
    - { name: PORT, default: "27015", description: "UDP game port" }
    - { name: MAP, default: "gm_construct" }
    - { name: GAMEMODE, default: "sandbox" }
    - { name: MAXPLAYERS, default: "16" }
    - { name: VALIDATE, default: "true", description: "`true` makes steamcmd validate the install on every start (the old install line always validated)" }
  # SFTP IS OPT-IN (same pattern as game-hosting/gmod, PR #17722). atmoz needs a
  # user spec and, for a key-only user, at least one key file — without either
  # it crash-loops and holds the pod unready. So the sidecar idles ("SFTP
  # disabled") until the OPTIONAL per-server ConfigMap `<name>-sftp-keys` holds
  # a key, then execs atmoz. `zeta::99:100` = key-only, uid/gid of the data
  # owner (the ich777 start.sh chowns DATA_DIR to UID=99 GID=100). Enable with:
  #   kubectl -n <ns> create configmap <name>-sftp-keys --from-file=operator.pub=$HOME/.ssh/id_ed25519.pub
  # Guard: full-ai-cluster/platform-controller/src/blueprint.test.ts
  sidecars:
    - name: sftp
      image: atmoz/sftp:alpine
      command: ["/bin/sh", "-c"]
      args:
        - |
          KEYS=/home/zeta/.ssh/keys
          if ! ls "$KEYS"/* >/dev/null 2>&1; then
            echo "SFTP disabled: no public key in $KEYS (ConfigMap ${RESOURCE_NAME}-sftp-keys absent/empty); waiting"
            until ls "$KEYS"/* >/dev/null 2>&1; do sleep 30; done
          fi
          exec /entrypoint zeta::99:100
      mountDataAt: /home/zeta/data
      configMaps:
        - { name: "${RESOURCE_NAME}-sftp-keys", mountPath: /home/zeta/.ssh/keys, optional: true }
  defaultExpose: lan
---
# Generic web app — stateless, single HTTP port, routable on a public host via
# the Cilium Gateway + cert-manager TLS. The "host my site/UI" type.
apiVersion: platform.zeta.io/v1alpha1
kind: Blueprint
metadata:
  name: web
  namespace: zeta-platform
spec:
  category: web
  stateful: false
  # WAS `nginx:1.27-alpine`, WHICH NEVER SERVED. That image's config declares
  # `ExposedPorts {"80/tcp"}` and runs as root, while this Blueprint -- and so the
  # rendered containerPort, Service targetPort and HTTPRoute backend -- says 8080.
  # The pod would be Running with nothing listening on the port every route points
  # at. MEASURED 2026-10-01 from the registry config blobs (linux/amd64), not from
  # a README: library/nginx:1.27-alpine -> ExposedPorts 80/tcp, no User;
  # nginxinc/nginx-unprivileged:1.29-alpine -> ExposedPorts 8080/tcp, User 101.
  # The unprivileged variant is the one that listens on 8080 by design (it cannot
  # bind a port below 1024 as uid 101), so the port below stays and the image moves.
  # 1.29-alpine is already pulled for mimir's gateway, so it adds no new image.
  # Guard: full-ai-cluster/platform-controller/src/blueprint.test.ts
  image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine
  ports:
    - { name: http, port: 8080, web: true }
  # READINESS ON THE DECLARED PORT. Without a probe a port/image mismatch like the
  # one above is invisible: the pod reads Ready while serving nothing, and the
  # Service and HTTPRoute send traffic into a closed port.
  probe:
    readiness: { httpGet: { path: /, port: 8080 }, initialDelaySeconds: 2, periodSeconds: 10 }
  resources: { cpu: "250m", memory: "256Mi" }
  defaultExpose: public
---
# PostgreSQL — stateful, TCP, persistent storage, cluster-internal only.
apiVersion: platform.zeta.io/v1alpha1
kind: Blueprint
metadata:
  name: postgres
  namespace: zeta-platform
spec:
  category: database
  stateful: true
  image: postgres:16-alpine
  env:
    POSTGRES_DB: "${DB}"
    POSTGRES_USER: "${USER}"
    PGDATA: /var/lib/postgresql/data/pgdata
  # NO DEFAULT PASSWORD, and no plaintext one. This used to be a `PASSWORD` variable defaulting to
  # `change-me`, so every instance that did not set one ran with the same known password, in the
  # clear in its pod spec. The password now comes from a Secret NAMED FOR THE INSTANCE
  # (`<instance>-credentials`, key `password`): if the operator has not created it the pod stops at
  # CreateContainerConfigError naming exactly that Secret -- loud, and never a shared password.
  #   kubectl -n <ns> create secret generic <instance>-credentials \
  #     --from-literal=password="$(head -c 24 /dev/urandom | base64 | tr -d '/+=')"
  envFrom:
    - { name: POSTGRES_PASSWORD, secret: "${RESOURCE_NAME}-credentials", key: password }
  ports:
    - { name: sql, port: 5432, protocol: TCP }
  storage: { size: "20Gi", mountPath: /var/lib/postgresql/data }
  resources: { cpu: "1", memory: "1Gi" }
  variables:
    - { name: DB, default: "app" }
    - { name: USER, default: "app" }
  defaultExpose: cluster
---
# Plain pod / worker — stateless, no ports, no exposure. The "just run my
# container" type (batch jobs, background workers, agents).
apiVersion: platform.zeta.io/v1alpha1
kind: Blueprint
metadata:
  name: worker
  namespace: zeta-platform
spec:
  category: app
  stateful: false
  image: busybox:1.36
  command: ["/bin/sh", "-c", "echo worker running; sleep infinity"]
  resources: { cpu: "100m", memory: "128Mi" }
  defaultExpose: none
---
# Unturned dedicated server (SteamCMD app 1110390). UDP 27015 + query ports.
apiVersion: platform.zeta.io/v1alpha1
kind: Blueprint
metadata:
  name: unturned
  namespace: zeta-platform
spec:
  category: game
  stateful: true
  image: ghcr.io/ich777/steamcmd:unturned
  # NO `install:`, `command:` OR `args:` — same contract as `gmod` above
  # (workitem 081M0QB1ZCV087G0R001P9YCPX): the image's own start.sh fetches
  # steamcmd, installs GAME_ID into /serverdata/serverfiles, installs RocketMod
  # (image default ROCKET_MOD=true), then execs
  # `Unturned_Headless.x86_64 -nographics ${GAME_PARAMS} -port:${GAME_PORT} -sv`.
  # GAME_PARAMS carries the three tokens the old `args:` handed to
  # ServerHelper.sh; whether Unturned honours each of them on this launch path
  # is not verified here.
  env:
    GAME_ID: "1110390"
    GAME_PARAMS: "+InternetServer/${SERVERNAME} +map/${MAP} +Max_Players/${MAXPLAYERS}"
    GAME_PORT: "27015"
    VALIDATE: "${VALIDATE}"
  ports:
    - { name: game, port: 27015, protocol: UDP }
    - { name: query, port: 27016, protocol: UDP }
    - { name: query2, port: 27017, protocol: UDP }
  # SERVER_DIR, not DATA_DIR — see `gmod`.
  storage: { size: "10Gi", mountPath: /serverdata/serverfiles }
  resources: { cpu: "2", memory: "3Gi" }
  variables:
    - { name: SERVERNAME, default: "Zeta" }
    - { name: MAP, default: "PEI" }
    - { name: MAXPLAYERS, default: "24" }
    - { name: VALIDATE, default: "true", description: "`true` makes steamcmd validate the install on every start (the old install line always validated)" }
  # SFTP opt-in, key-only as the data owner 99:100 — see `gmod`.
  sidecars:
    - name: sftp
      image: atmoz/sftp:alpine
      command: ["/bin/sh", "-c"]
      args:
        - |
          KEYS=/home/zeta/.ssh/keys
          if ! ls "$KEYS"/* >/dev/null 2>&1; then
            echo "SFTP disabled: no public key in $KEYS (ConfigMap ${RESOURCE_NAME}-sftp-keys absent/empty); waiting"
            until ls "$KEYS"/* >/dev/null 2>&1; do sleep 30; done
          fi
          exec /entrypoint zeta::99:100
      mountDataAt: /home/zeta/data
      configMaps:
        - { name: "${RESOURCE_NAME}-sftp-keys", mountPath: /home/zeta/.ssh/keys, optional: true }
  defaultExpose: lan
---
# Arma Reforger dedicated server — Steam app 1874900.
#
# THE APP IS REAL AND HAS A LINUX SERVER. Steam app-info for 1874900, read
# 2026-08-23: name "Arma Reforger Server", type Tool, oslist `windows,linux`,
# with depot 1874902 declaring `oslist: linux`. So the thing this Blueprint
# deploys exists; only the container reference was wrong.
#
# WAS `ghcr.io/ich777/steamcmd:armareforger`, AND THAT PUBLISHER HAS NO FIX.
# The sibling `gmod` defect had one (`:gmod` -> `:garrysmod`); this one does
# not, measured rather than assumed:
#   GET ghcr.io/v2/ich777/steamcmd/tags/list?n=1000  -> 94 tags, and the only
#     arma-family entries are `arma3` and `arma3exilemod`
#   manifests for `armareforger`, `arma-reforger`, `reforger` -> HTTP 404 each
#   gh api /users/ich777/packages?package_type=container -> 98 packages, none
#     Arma Reforger; the Docker Hub account carries the same set
# Substituting a nearby ich777 tag stays REFUSED (workitem
# 081M0QB1ZCV087G0R001P9YCPX measured that the game tags share only their first
# two layers, so they are different images, not one base with four entrypoints).
#
# THE REPLACEMENT, PINNED BY DIGEST. `ghcr.io/acemod/arma-reforger` is public,
# pulls anonymously, and measures 55,712,029 compressed bytes on linux/amd64 via
# `measureImage` in src/Core.TypeScript/cluster/measure-lane-footprints.ts — the
# same function that priced every other image in lane-footprints.json.
# Provenance is the image's OWN label, not a README claim:
#   org.opencontainers.image.source = https://github.com/acemod/docker-reforger
# (ACE Mod, MIT, 117 stars, active). Tags `latest` and `sha-cd226c0` resolve to
# the SAME digest, and `cd226c0` is the tip commit of that repo's default branch
# (2026-07-30) — so this digest is the latest version, and the tag is kept
# alongside it only so a reader can see which commit built it. The digest is
# what the registry is asked for; `:latest` alone is unmeasurable in principle.
# The corroboration that this is the right game: the image's own config sets
# `STEAM_APPID=1874900`, the identical appid this Blueprint used to hand to
# steamcmd. Image and Blueprint agree independently — the same check that
# validated `garrysmod` against `+app_update 4020`.
#
# NO `install:`, `command:` OR `args:` — DELIBERATE, NOT AN OMISSION.
# The old install line ran `/opt/steamcmd/steamcmd.sh`, a path that exists in no
# image in this file: ich777's images fetch steamcmd at runtime into
# `/serverdata/steamcmd`, and this one ships it at `/steamcmd/steamcmd.sh`.
# This image installs and launches itself. Its Cmd is `python3 /app/launch.py`,
# read out of the layer: it runs `/steamcmd/steamcmd.sh +force_install_dir
# /reforger +login anonymous +app_update $STEAM_APPID validate +quit`, writes
# `/reforger/Configs/docker_generated.json` from the environment below, then
# execs `./ArmaReforgerServer` in `/reforger`. Overriding `command:` would skip
# both the install and the config generation, so the correct fix for the path
# mismatch here is to stop issuing the command at all and configure by env.
# (`gmod` and `unturned` above got the same treatment in a later change of
# workitem 081M0QB1ZCV087G0R001P9YCPX: their ich777 images are driven by their
# own `/opt/scripts/start.sh` + `GAME_ID`, so they too issue no command.)
apiVersion: platform.zeta.io/v1alpha1
kind: Blueprint
metadata:
  name: arma-reforger
  namespace: zeta-platform
spec:
  category: game
  stateful: true
  image: ghcr.io/acemod/arma-reforger:sha-cd226c0@sha256:90883ce2f3d8b3b5b132ae7f4b3377afdc9e6be7e7c8cb1a290f8bd7b39d079c
  # Every name below is from the image's documented environment contract
  # (github.com/acemod/docker-reforger README) and its own config blob defaults.
  env:
    STEAM_APPID: "1874900"
    GAME_NAME: "${SERVERNAME}"
    GAME_SCENARIO_ID: "${SCENARIO}"
    GAME_MAX_PLAYERS: "${MAXPLAYERS}"
    SERVER_BIND_PORT: "${GAME_PORT}"
    SERVER_PUBLIC_PORT: "${GAME_PORT}"
    SERVER_A2S_PORT: "17777"
    ARMA_CONFIG: "${CONFIG}"
  ports:
    - { name: game, port: 2001, protocol: UDP }
    - { name: query, port: 17777, protocol: UDP }
  # /reforger is the image's WorkingDir and its steamcmd `+force_install_dir`;
  # Configs/ and workshop/ both live under it, so one volume covers the lot.
  storage: { size: "15Gi", mountPath: /reforger }
  resources: { cpu: "4", memory: "6Gi" }
  variables:
    - { name: SERVERNAME, default: "Zeta Reforger", description: "server name in the browser (GAME_NAME)" }
    - { name: SCENARIO, default: "{ECC61978EDCC2B5A}Missions/23_Campaign.conf", description: "GAME_SCENARIO_ID — the image's own documented default scenario id" }
    - { name: MAXPLAYERS, default: "32" }
    - { name: CONFIG, default: "docker_generated", description: "ARMA_CONFIG — `docker_generated` regenerates the config from these variables; any other value is a filename under /reforger/Configs used as-is" }
    - { name: GAME_PORT, default: "2001" }
  # SFTP opt-in — see `gmod`. The user is 1000:1000 (the pod fsGroup), NOT the
  # data owner: this image has no `User`, so it runs as root and its files are
  # 0:0, and SFTP is not served as root. Read access is via the fsGroup; write
  # access to files the game created is NOT guaranteed.
  sidecars:
    - name: sftp
      image: atmoz/sftp:alpine
      command: ["/bin/sh", "-c"]
      args:
        - |
          KEYS=/home/zeta/.ssh/keys
          if ! ls "$KEYS"/* >/dev/null 2>&1; then
            echo "SFTP disabled: no public key in $KEYS (ConfigMap ${RESOURCE_NAME}-sftp-keys absent/empty); waiting"
            until ls "$KEYS"/* >/dev/null 2>&1; do sleep 30; done
          fi
          exec /entrypoint zeta::1000:1000
      mountDataAt: /home/zeta/data
      configMaps:
        - { name: "${RESOURCE_NAME}-sftp-keys", mountPath: /home/zeta/.ssh/keys, optional: true }
  defaultExpose: lan
