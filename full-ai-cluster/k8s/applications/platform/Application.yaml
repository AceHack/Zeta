# Zeta platform — the base resource vocabulary the portal + agents operate on.
# The GENERIC core: Blueprint (a declarative run-recipe — DATA) + Deployable (an
# instance). One engine (platform-controller) renders any Blueprint into concrete
# Kubernetes objects, so new deployable TYPES are added as data, not code. The
# typed facades GameServer/App/WebApp stay as ergonomic sugar over the same core.
# Plus Policy (agent scope), with AI woven into every type by design (the `ai`
# block: a persona operates each resource within a Policy, with a collaboration
# Room). See PLATFORM-ARCHITECTURE.md + COLLABORATION-MODEL.md.
#
# This installs the CRDs (the contract), a starter Blueprint library (gmod, web,
# postgres, worker), the default Policy, and the reconcile controller. The portal
# UI that renders these is a later build (COLLABORATION-MODEL.md §10). Headlamp
# shows them as soon as the CRDs register.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-20"   # CRDs early — before anything that creates these resources
  name: platform
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://github.com/Lucent-Financial-Group/Zeta
    targetRevision: main
    path: full-ai-cluster/k8s/applications/platform
    directory:
      include: '{namespace,crd-policy,crd-gameserver,crd-app,crd-webapp,crd-blueprint,crd-deployable,crd-tenant,policy-default,blueprints,controller,portal,clusterissuer,gateway,monitoring}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: zeta-platform
  syncPolicy:
    automated:
      prune: false      # never auto-delete the platform CRDs / default Policy
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # CRDs: server-side apply handles large schemas + ordering
    # UNBOUNDED retry, because this Application consumes a CRD it does not own.
    # monitoring.yaml's ServiceMonitor + PrometheusRule are monitoring.coreos.com
    # kinds that kube-prometheus-stack installs at wave 0, and this Application
    # syncs at -20. SkipDryRunOnMissingResource defers only the DRY RUN; the real
    # apply is still rejected until the CRD exists. With no `retry` block ArgoCD
    # gives up after 5 attempts, and an automated sync is never re-attempted for
    # a revision whose sync already failed -- so on a pinned-revision install,
    # losing that race is permanent.
    # MEASURED, WP11 installed-disk run 36221053730 (2026-09-26): `platform`
    # sync=OutOfSync health=Degraded, "Failed last sync attempt to [ea6524e1...]:
    # one or more synchronization tasks completed unsuccessfully (retried 5
    # times)" at t=3216s, with kube-prometheus-stack long since installed. A race
    # against another Application's render time is not a capacity question; it
    # can be lost on any box.
    # limit -1 keeps retrying with backoff capped at 5m, so the sync lands on the
    # first attempt after the CRD registers. Registered order finding:
    # derive-sync-waves.ts ORDER_ADJUDICATION_PENDING["platform -> kube-prometheus-stack"].
    retry:
      limit: -1
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
