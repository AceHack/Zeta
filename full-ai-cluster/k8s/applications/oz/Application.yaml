# OZ → OpenZiti. Zero-trust overlay network with per-connection
# authentication + L4 mTLS.
#
# OpenZiti splits into multiple components; this Application installs
# the controller. Add ziti-router/Application.yaml in a sibling dir
# when the first edge router lands.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: openziti-controller
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://docs.openziti.io/helm-charts/
    chart: ziti-controller
    # 3.1.1, CORRECTED 2026-08-21 FROM A PIN THAT NAMED NOTHING.
    #
    # `1.4.5` was fictional: openziti's repository has published 96
    # ziti-controller versions and that is not one of them (its 1.x line ends at
    # 1.3.4; `1.4.2` exists there only as an *appVersion*, which is not a
    # coordinate Helm can resolve). ArgoCD could never fetch it, so this
    # Application has never been able to sync. Recorded by
    # `audit-chart-target-revisions.ts`, whose acknowledgement this replaces.
    #
    # WHY 3.1.1 AND NOT THE NEWEST -- the breaking-change surface, MEASURED
    # 2026-08-21 by `helm pull` + `helm template` of 1.3.4, 2.1.2, 3.1.1 and
    # 3.2.1 against THIS Application's own valuesObject:
    #
    #   * every one of the four renders the SAME storage contract -- one
    #     PersistentVolumeClaim named `ziti-controller`, 3Gi, storageClassName
    #     longhorn -- so the catalogue row for this app is unaffected by the
    #     choice, and `not drop-in for the pinned values` (the reason the
    #     earlier acknowledgement gave for deferring) does not hold for any of
    #     the keys this manifest actually sets.
    #   * 3.2.1 is the newest, and it is a SERVER MAJOR: appVersion 1.7.2 ->
    #     2.0.1 (OpenZiti v2). It also makes `cluster.mode` a required value --
    #     templating fails outright without it, where 3.1.1 defaults it to
    #     `standalone`. Two operator decisions, neither of them ours to make in
    #     a storage-verification change.
    #   * 3.1.1 is the newest chart still on appVersion 1.7.2, so it is the
    #     furthest forward this can move without changing which ziti runs.
    #   * what changed on the way to 3.x and does NOT touch us, listed so the
    #     claim is checkable rather than reassuring: 2.x dropped the bundled
    #     `ingress-nginx` / `cert-manager` / `trust-manager` subcharts (this
    #     cluster provides all three itself), and 3.x replaced
    #     `highAvailability` with `cluster` and removed `trustDomain`. This
    #     manifest sets none of those keys.
    #
    # WHAT A RENDER CANNOT TELL YOU, said out loud: that the ziti 1.7.2 server
    # behaves identically under chart 3.1.1 as under 1.3.4 is NOT established
    # here. Only the manifest surface and the rendered objects were compared.
    targetRevision: 3.1.1
    helm:
      releaseName: ziti-controller
      valuesObject:
        ctrlPlane:
          service:
            type: ClusterIP
        clientApi:
          # REQUIRED BY EVERY PUBLISHED VERSION, and its absence is why
          # correcting the pin alone would not have made this app renderable --
          # it would only have moved the failure from `helm pull` to `helm
          # template`. All of 1.3.4 / 2.1.2 / 3.1.1 fail with "You must set
          # .Values.clientApi.advertisedHost". So the fictional pin was MASKING
          # a second, independent defect in this manifest.
          #
          # PLACEHOLDER, exactly like headscale's `server_url`: set this to the
          # real DNS name edge clients dial before anything enrols against it. A
          # wrong advertisedHost is not a render error, it is a fabric that
          # nobody outside the cluster can reach.
          advertisedHost: ziti-controller.zeta.local
          service:
            type: ClusterIP
        persistence:
          enabled: true
          storageClass: longhorn
          # SIZE CUT, NOT A POD CUT: 5Gi -> 3Gi, one pod either way. Small
          # service state. Like headscale this row exists so the profile total
          # covers the whole tree, not because 2 GiB was worth recovering.
          size: 3Gi
        # Admin credential sourced from a Secret rather than generated by the
        # chart.
        #
        # THIS BLOCK USED TO BE INERT. It read `adminSecret: {name, key}`, and
        # `adminSecret` is not a key ziti-controller has ever had -- not in
        # 1.3.4, not in 3.2.1. The chart reads `useCustomAdminSecret` +
        # `customAdminSecretName` (values.yaml:198,210), so the declaration
        # never reached the chart and the controller would have run on a
        # chart-generated random password instead. Same failure class as
        # hindsight's `postgresql.primary.*` and nats' top-level `cluster:`.
        useCustomAdminSecret: true
        customAdminSecretName: ziti-admin-credentials
        # THE SECRET'S KEYS ARE FIXED BY THE CHART, and they are not `password`.
        # deployment.yaml reads `admin-user` and `admin-password` by name, so
        # the creation command below is part of the fix, not documentation of
        # it. Create the secret BEFORE this app syncs:
        #   kubectl -n openziti create secret generic ziti-admin-credentials \
        #     --from-literal=admin-user=admin \
        #     --from-literal=admin-password="$(openssl rand -hex 24)"
        # Or use a Sealed Secret committed to Git so the credential is
        # reproducible from the cluster definition.
        #
        # IN THE DEV/CI LANE THAT SECRET IS MINTED, NOT TYPED (2026-08-22). It
        # is `DEV_ZITI_ADMIN_SECRET` in
        # src/Core.TypeScript/cluster/dev-cluster/lib.ts, applied per cluster by
        # `applyDevBootstrapSecrets` before the app-of-apps root syncs, drawn
        # fresh and never committed -- the same mechanism kube-prometheus-stack
        # uses for Grafana's `existingSecret`. `argocd-health-test.test.ts`
        # asserts that name against this manifest, so renaming it here without
        # renaming it there goes red. Nothing under `dev-cluster/` is read by
        # ArgoCD, so the mint reaches dev/CI clusters only; on metal the command
        # above is still the path.
        #
        # AND `useCustomAdminSecret` IS NOT NEGOTIABLE DOWNWARD. Setting it
        # false hands the job to ziti-controller's `templates/secrets.yaml`,
        # which builds the password from `lookup` with a `randAlphaNum 32`
        # fallback. ArgoCD's repo-server templates with NO cluster access, so
        # `lookup` is always empty and the fallback always draws -- MEASURED
        # 2026-08-22: two `helm template` runs of this chart against these
        # values with `useCustomAdminSecret: false` differ in `admin-password`.
        # With `selfHeal: true` above, that is the controller's admin credential
        # rotating on every reconcile. A pre-existing Secret is the ONLY
        # deterministic option this chart offers.
        #
        # A SECOND NONDETERMINISTIC SECRET IS STILL HERE AND IS *NOT* FIXED BY
        # THIS. Measured 2026-08-22 at exactly these values: two `helm template`
        # runs of ziti-controller 3.1.1 differ in ONE line, and it is not the
        # admin credential -- it is `ziti-controller-trust-domain`.
        # `_helpers.tpl:253 getTrustDomain` falls through
        # `cluster.trustDomain` -> legacy `trustDomain` -> an existing Secret via
        # `lookup` -> `printf "spiffe://%s" (randAlphaNum 32)`, and with all
        # three sources empty under ArgoCD's lookup-less repo-server the last
        # arm always fires.
        #
        # WHAT WAS PREDICTED FROM THAT, AND WHAT WAS THEN MEASURED -- the
        # correction is left in because the overreach is the instructive part.
        # This note first said the Application "sits OutOfSync and `selfHeal:
        # true` rewrites the SPIFFE trust domain on every reconcile". That was
        # DERIVED, not observed, and the first live run refuted it: in run
        # 32569702770 (`live kind included Synced+Healthy proof`)
        # openziti-controller reported `Synced` + `Healthy` on all four samples
        # over the ~7 minutes it was up, and never once OutOfSync. The most
        # likely reason is that ArgoCD's repo-server CACHES generated manifests
        # per revision, so the random value is drawn once and reused rather than
        # redrawn each reconcile -- but that explanation is itself unmeasured
        # and is written here as a candidate, not a finding.
        #
        # SO THE HONEST CLAIM IS NARROWER THAN THE FIRST ONE. What is measured:
        # the render is nondeterministic (two local `helm template` runs at
        # these values differ in exactly this line). What is NOT measured: any
        # ArgoCD-level churn. The exposure is that whenever the manifest IS
        # re-rendered -- a new revision, a cache eviction, a repo-server restart
        # -- the trust domain can change under a controller that has already
        # issued identities against the old one. Nothing observed says that has
        # happened; nothing observed says it cannot.
        #
        # IT IS LEFT OPEN ON PURPOSE. The fix is one value -- `cluster:
        # {trustDomain: spiffe://<name>}` -- but the value IS the fabric's
        # identity namespace, every certificate chains to it, and rotating it on
        # a controller that has already issued identities invalidates them. That
        # is an operator decision of the same class as `advertisedHost` above,
        # and unlike `advertisedHost` the chart does not force it, so nothing
        # here needs to guess one. LIFTS WHEN: the operator names the trust
        # domain -- which also makes the render deterministic and retires the
        # exposure above outright. (An `ignoreDifferences` entry scoped to
        # `data.trustDomain` would only hide a diff that has not been observed,
        # so it is the weaker option and would be treating a symptom nobody has
        # seen.)
  destination:
    server: https://kubernetes.default.svc
    namespace: openziti
  syncPolicy:
    automated:
      prune: false # never prune — would break the trust fabric
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
