apiVersion: v1
kind: Service
metadata:
  name: orleans-silo
  namespace: orleans
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: orleans-silo }
  ports:
    - { name: silo, port: 11111, targetPort: silo }
    - { name: gateway, port: 30000, targetPort: gateway }
---
apiVersion: v1
kind: Service
metadata:
  name: orleans-gateway
  namespace: orleans
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: orleans-silo }
  ports:
    - { name: gateway, port: 30000, targetPort: gateway }
---
apiVersion: v1
kind: Service
metadata:
  name: orleans-dashboard
  namespace: orleans
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: orleans-silo }
  ports:
    - { name: http, port: 8080, targetPort: dashboard }
