# Orleans Silo StatefulSet.
#
# The image is REAL as of 2026-09-01 -- full-ai-cluster/orleans-silo/ builds it and
# build-platform-images.yml publishes it (081M0QB1Q6Z087G0R00091JH3Q). This header
# used to say replicas start at 0 until you publish a real silo image, which was an
# honest statement of a real gap and is no longer the gap.
#
# Replicas stay at 0 for a DIFFERENT and still-open reason: the `redis-auth` secret
# this pod projects does not exist in the tree yet -- the redis Application says
# `create via Sealed Secret / Vault`. Bump to >= 1 once that secret is provisioned.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orleans-silo
  namespace: orleans
spec:
  serviceName: orleans-silo
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: orleans-silo }
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orleans-silo
        orleans.io/serviceId: zeta
        orleans.io/clusterId: zeta-prod
    spec:
      serviceAccountName: orleans-silo
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: orleans-silo }
      containers:
        - name: silo
          image: ghcr.io/lucent-financial-group/zeta-orleans-silo:latest
          ports:
            - { name: silo, containerPort: 11111 }
            - { name: gateway, containerPort: 30000 }
            - { name: dashboard, containerPort: 8080 }
          env:
            - { name: ORLEANS_SERVICE_ID, value: zeta }
            - { name: ORLEANS_CLUSTER_ID, value: zeta-prod }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            # The ConfigMap NAMES the secret (clustering.passwordSecret) but a
            # ConfigMap cannot carry a credential, so the projection happens here.
            # It was missing until 2026-09-01: the silo would have read an endpoint
            # it had no password for and failed to form membership, while the TCP
            # readiness probe on the gateway port could still have reported Ready.
            # optional: true so a cluster running Redis WITHOUT auth still starts;
            # the silo passes an empty password through as empty rather than as
            # "no auth", so a wrong secret fails loudly instead of silently
            # connecting to an unauthenticated Redis.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-auth, key: password, optional: true }
          volumeMounts:
            - { name: config, mountPath: /etc/orleans, readOnly: true }
          # BLOCK STYLE, not flow. `requests: { cpu: ..., memory: ... }` is valid YAML
          # and equivalent, and the rung overlay writer cannot rewrite a value inside
          # a flow mapping -- rendered-resource-requests reported the row as
          # `unoverlayable-row`: "names a coordinate this renderer cannot express, so
          # its rung was never written into the render -- a rung the render never sees
          # would agree with every rung equally". That is a rung ladder that cannot
          # fail, which is why the style matters here and would not elsewhere.
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          # STARTUP PROBE -- our own manifest, so the coordinate is free: no chart to
          # dig through, just add the key. Kept liveness's own tcpSocket check but let
          # the kubelet withhold it until startup succeeds once, instead of widening
          # liveness's own window.
          #
          # WHY: orleans-silo was observed CRASHLOOP(CrashLoopBackOff) in the
          # 2026-09-22 first-boot-replica run (real k3s roster, artifact
          # first-boot-replica-report from run 35700790207) -- also ★ known slow
          # starter (JVM-adjacent .NET cluster membership warmup per the audit tool's
          # own classification). Silo membership formation (joining the Orleans
          # cluster via the shared clustering table) can outrun the 60s liveness
          # window (30 + (3-1)*15) under first-boot pod/image pressure.
          #
          # periodSeconds 10, failureThreshold 30 -> startup kill budget
          # 0+29*10=290s; steady-state liveness (60s) is untouched.
          startupProbe:   { tcpSocket: { port: silo }, periodSeconds: 10, failureThreshold: 30 }
          livenessProbe:  { tcpSocket: { port: silo }, initialDelaySeconds: 30, periodSeconds: 15 }
          readinessProbe: { tcpSocket: { port: gateway }, initialDelaySeconds: 10, periodSeconds: 5 }
      volumes:
        - { name: config, configMap: { name: orleans-config } }
