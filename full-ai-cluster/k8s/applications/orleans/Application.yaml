# Orleans — distributed actor runtime / "distributed cron" #1.
#
# Orleans doesn't have an official Helm chart. The pattern is to
# build a custom Silo image embedding your grain code and deploy it
# as a StatefulSet. This Application points at the manifests in
# the same directory; bump replicas to >=1 and replace the image
# once you have a published silo image.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: orleans
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Lucent-Financial-Group/Zeta
    targetRevision: main
    path: full-ai-cluster/k8s/applications/orleans
    directory:
      include: '{namespace,rbac,configmap,service,statefulset}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: orleans
  syncPolicy:
    # Unbounded retry (limit -1, backoff capped at 5m). ArgoCD's automated-sync default is 5 attempts
    # (~2.5 min) and it never re-attempts a revision whose sync already failed, so a control-plane blip
    # longer than that strands the Application SyncFailed for good. Pinned for every automated
    # Application by src/Core.TypeScript/cluster/application-retry-unbounded.test.ts.
    retry:
      limit: -1
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
