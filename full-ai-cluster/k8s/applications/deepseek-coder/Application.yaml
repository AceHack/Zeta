# Deepseek Coder — model deploy via Ollama OR vLLM.
#
# This Application is structural — the model itself is pulled by
# whichever serving stack you chose (Ollama via the `models.pull:`
# in its Helm values, OR vLLM via its `--model` arg). This
# Application just declares the namespace + an info ConfigMap so
# operators can grep for the model deploy via the same tooling.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  name: deepseek-coder
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://github.com/Lucent-Financial-Group/Zeta
    targetRevision: main
    path: full-ai-cluster/k8s/applications/deepseek-coder
    directory:
      include: '{namespace,configmap}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: models
  syncPolicy:
    # Unbounded retry (limit -1, backoff capped at 5m). ArgoCD's automated-sync default is 5 attempts
    # (~2.5 min) and it never re-attempts a revision whose sync already failed, so a control-plane blip
    # longer than that strands the Application SyncFailed for good. Pinned for every automated
    # Application by src/Core.TypeScript/cluster/application-retry-unbounded.test.ts.
    retry:
      limit: -1
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
    automated: { prune: true, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
