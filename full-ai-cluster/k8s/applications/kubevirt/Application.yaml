# KubeVirt — runs VMs as first-class k8s workloads. Carries the Flowdent
# Windows guests (fd-windows, fd-win-flowdent-*), which are production.
#
# WHY THIS EXISTS: KubeVirt was installed by hand on node-5b2dfa
# (2026-07-12) and existed NOWHERE in git. A fresh USB install produced a
# cluster with no virtualisation layer at all, so the Windows guests were
# unreproducible — recoverable only by someone redoing the install by
# hand. This Application is that capability written down.
#
# The operator manifest is vendored VERBATIM from the upstream release
#   https://github.com/kubevirt/kubevirt/releases/download/v1.8.4/kubevirt-operator.yaml
# rather than tracked via a chart, because KubeVirt publishes no official
# Helm chart and vendoring the exact bytes is what makes this 1:1 with
# what is running (quay.io/kubevirt/virt-operator:v1.8.4, confirmed
# against the live deployment). Same precedent as
# k8s/bootstrap/gateway-api-crds.yaml. It creates the `kubevirt`
# namespace itself, so CreateNamespace is not set.
#
# "VERBATIM" IS NOW CHECKED, NOT ASSERTED — and this file's word carried more
# weight than most, because `full-ai-cluster/k8s/single-node-budget.json`
# REFUSES to edit the virt-operator replica count on the strength of it
# ("would make the checked-in copy diverge from the cluster it documents").
# `src/Core.TypeScript/cluster/vendored-upstream-parity.ts` sha256s
# kubevirt-operator.yaml against the digest of the pinned release asset above
# on every CI run of the cluster plan job, so that refusal now rests on a
# check rather than on a sentence. kubevirt-cr.yaml is classified OURS, and
# genuinely is: upstream's is a 322-byte stub with no sync-wave annotation.
#
# WHY THIS IS NOT A CHART REFERENCE. KubeVirt v1.8.4's release ships virtctl
# binaries and raw YAML — no Helm chart, no kustomize base (measured
# 2026-08-23 against the release's asset list). Nor does the CR help: the
# KubeVirt CRD's `spec.customizeComponents.patches` reaches the components the
# operator DEPLOYS (virt-api / virt-controller / virt-handler), never
# virt-operator's own Deployment, which is what this file creates.
#
# NO automated sync — DELIBERATE. This adopts an operator with three
# running production VMs on it. An automated sync (or selfHeal) could
# roll virt-operator -> virt-handler and disturb live guests on first
# reconcile. Sync it by hand once, off-hours, after reading the diff:
#   argocd app diff kubevirt
#   argocd app sync kubevirt
# Turn on `automated: { prune: false, selfHeal: true }` only once a sync
# has been observed to be a genuine no-op.
#
# FRESH INSTALLS ARE NOT LEFT WITHOUT IT (2026-09-30). The manual-sync
# declaration above is about THAT cluster, but it sits in the one tree every
# cluster syncs, so a freshly flashed node inherited it and came up with no
# virtualisation layer at all -- this Application `Missing` forever, nothing on
# first boot ever running `argocd app sync`. Rather than delete the protection
# (an `automated:` block) this tree keeps the declaration and adds the one act it
# was missing: `zeta-virt-first-sync.service`
# (nixos/modules/zeta-virt-first-sync.nix, imported by the server role) starts ONE
# ordinary sync of this Application and of `cdi`, ONCE, and ONLY where
# `kubevirts.kubevirt.io` does not already exist -- so a cluster that already runs
# the operator is never touched. On a host with no /dev/kvm it additionally sets
# the CR's `useEmulation` (a cluster it synced itself, never an adopted one).
# After that this is a manual-sync Application again. Decision logic and every
# branch: zeta-virt-first-sync.sh + src/Core.TypeScript/hygiene/zeta-virt-first-sync.test.ts.
# A Windows-guest template lives in full-ai-cluster/k8s/examples/kubevirt-windows-vm.yaml
# (NOT applied, and kept outside this tree so no audit prices it; see its header).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    # MOVED -5 -> 50 (081M1...WP3, resource.customizations.health.argoproj.io_Application
    # gate). Same reasoning as cdi/Application.yaml, its bring-up sibling:
    # kubevirt is a declared manual-sync Application, so its honest live health
    # on a fresh cluster is "Missing" forever. Once Application-CRD health
    # assessment is restored, sync-wave gating waits GLOBALLY for each wave to
    # be Healthy before the next wave starts, so leaving a manual-sync app at an
    # early wave would wedge every automated Application after it. Nothing
    # depends on kubevirt today (no `dependsOn: [kubevirt]` edge, no manifest in
    # this tree references a kubevirt.io CRD), so moving it to the tail costs
    # nothing. Matches ollama/vllm's existing wave-50 convention for manual-sync
    # apps; `derive-sync-waves.ts`'s manual-sync-floor check enforces it stays there.
    argocd.argoproj.io/sync-wave: "50"   # LAST wave -- manual-sync; see comment above
    # Machine-readable form of the header above, read by
    # src/Core.TypeScript/cluster/manual-sync-policy.ts. The comment states the
    # intent to humans; this states it to the checkers, which otherwise cannot
    # tell a deliberate omission from a forgotten one.
    zeta.io/sync-policy: manual
    zeta.io/sync-policy-reason: Adopts a virt-operator installed by hand on
      node-5b2dfa, which carries three running production Windows guests. An
      automated sync or selfHeal could roll virt-operator into virt-handler and
      disturb live guests. Sync it by hand, off-hours, after reading argocd app
      diff kubevirt. SCOPE - this is a constraint on THAT CLUSTER, not on these
      bytes, and it is not a claim that KubeVirt is untestable. An ephemeral kind
      cluster has no guests to disturb, so the vendored operator plus CR are
      deployed and asserted Available on every run of the live-kind-virt job in
      .github/workflows/k8s-argocd-health-test.yml, driven by
      src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.ts, which applies
      the documented useEmulation patch on top because GitHub-hosted runners are
      not guaranteed a /dev/kvm.
  name: kubevirt
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://github.com/Lucent-Financial-Group/Zeta
    targetRevision: main
    path: full-ai-cluster/k8s/applications/kubevirt
    directory:
      include: '{kubevirt-operator,kubevirt-cr}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: kubevirt
  syncPolicy:
    # No `automated:` block — see the header. Manual sync only.
    syncOptions: [ ServerSideApply=true ]
