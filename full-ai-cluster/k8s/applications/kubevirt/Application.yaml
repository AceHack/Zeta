# KubeVirt — runs VMs as first-class k8s workloads. Carries the Flowdent
# Windows guests (fd-windows, fd-win-flowdent-*), which are production.
#
# WHY THIS EXISTS: KubeVirt was installed by hand on node-5b2dfa
# (2026-07-12) and existed NOWHERE in git. A fresh USB install produced a
# cluster with no virtualisation layer at all, so the Windows guests were
# unreproducible — recoverable only by someone redoing the install by
# hand. This Application is that capability written down.
#
# The operator manifest is vendored VERBATIM from the upstream release
#   https://github.com/kubevirt/kubevirt/releases/download/v1.8.4/kubevirt-operator.yaml
# rather than tracked via a chart, because KubeVirt publishes no official
# Helm chart and vendoring the exact bytes is what makes this 1:1 with
# what is running (quay.io/kubevirt/virt-operator:v1.8.4, confirmed
# against the live deployment). Same precedent as
# k8s/bootstrap/gateway-api-crds.yaml. It creates the `kubevirt`
# namespace itself, so CreateNamespace is not set.
#
# NO automated sync — DELIBERATE. This adopts an operator with three
# running production VMs on it. An automated sync (or selfHeal) could
# roll virt-operator -> virt-handler and disturb live guests on first
# reconcile. Sync it by hand once, off-hours, after reading the diff:
#   argocd app diff kubevirt
#   argocd app sync kubevirt
# Turn on `automated: { prune: false, selfHeal: true }` only once a sync
# has been observed to be a genuine no-op.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # virtualisation before workloads that need VMs
    # Machine-readable form of the header above, read by
    # src/Core.TypeScript/cluster/manual-sync-policy.ts. The comment states the
    # intent to humans; this states it to the checkers, which otherwise cannot
    # tell a deliberate omission from a forgotten one.
    zeta.io/sync-policy: manual
    zeta.io/sync-policy-reason: Adopts a virt-operator installed by hand on
      node-5b2dfa, which carries three running production Windows guests. An
      automated sync or selfHeal could roll virt-operator into virt-handler and
      disturb live guests. Sync it by hand, off-hours, after reading argocd app
      diff kubevirt. SCOPE - this is a constraint on THAT CLUSTER, not on these
      bytes, and it is not a claim that KubeVirt is untestable. An ephemeral kind
      cluster has no guests to disturb, so the vendored operator plus CR are
      deployed and asserted Available on every run of the live-kind-virt job in
      .github/workflows/k8s-argocd-health-test.yml, driven by
      src/Core.TypeScript/cluster/kubevirt-cdi-emulation-test.ts, which applies
      the documented useEmulation patch on top because GitHub-hosted runners are
      not guaranteed a /dev/kvm.
  name: kubevirt
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://github.com/Lucent-Financial-Group/Zeta
    targetRevision: main
    path: full-ai-cluster/k8s/applications/kubevirt
    directory:
      include: '{kubevirt-operator,kubevirt-cr}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: kubevirt
  syncPolicy:
    # No `automated:` block — see the header. Manual sync only.
    syncOptions: [ ServerSideApply=true ]
