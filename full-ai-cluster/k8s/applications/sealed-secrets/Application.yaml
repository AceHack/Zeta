# Sealed Secrets — encrypted secrets in Git, decrypted by the
# controller at apply time.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
  name: sealed-secrets
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    # repoURL CORRECTED 2026-08-21. `bitnami-labs.github.io/sealed-secrets`
    # 404s -- the chart moved to the `bitnami` org. ArgoCD could not fetch this
    # chart at all; verified by fetching the old index.yaml (HTTP 404) and the
    # new one (serves the chart, 2.16.2 still present). This was never a version
    # problem, which is why the URL and the bump are separable.
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    # 2.16.2 (Nov 2024, appVersion 0.27.2) -> 2.19.3 (2026-08-20, appVersion
    # 0.39.1), read from the new index. Same chart major; the app moves 0.27 ->
    # 0.39.
    #
    # STATED, NOT VERIFIED: sealed-secrets keeps its controller keypair in a
    # Secret that survives upgrades, so existing SealedSecrets should still
    # decrypt. Nothing here proves that -- no cluster ran this upgrade, and the
    # only real check is a live one: after rollout, an existing SealedSecret
    # must still reconcile into its Secret. If it does not, the sealing key was
    # lost, which is the one failure that matters for this chart.
    targetRevision: 2.19.3
    helm:
      releaseName: sealed-secrets
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        keyrenewperiod: 720h   # 30 days
        resources:
          requests: { cpu: 25m, memory: 48Mi }
        # LIVENESS STALL TOLERANCE (081M3TS67PE087G0R002ZZ1XYT). Chart default
        # is timeout 1s / period 10s / failureThreshold 3: a RUNNING controller
        # is killed after 21s of slow /healthz answers. The constrained
        # first-boot replica (run 36685251210, 4 vCPU) measured this container
        # in CrashLoopBackOff. This chart exposes the full probe, so widen it:
        # timeout 5s, 12 failures at a 10s period -> kill budget 10+11*10 =
        # 120s, running-stall tolerance 115s. Readiness is left strict -- a
        # slow controller should leave the Service, not be restarted.
        livenessProbe:
          enabled: true
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 12
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # never prune — would orphan secrets
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
