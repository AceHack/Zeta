    # API server only warns on the shadowed env var). It also closes the other two OutOfSync rows
    # seen live -- StatefulSets gitlab-postgresql / gitlab-redis-master, the SSA
    # volumeClaimTemplates prediction drift (argo-cd#11143) documented in
