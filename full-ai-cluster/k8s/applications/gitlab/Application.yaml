            # --- runner authentication token ----------------------------------------------
            # Creates (or finds) ONE instance runner `zeta-cluster` through GitLab's own service
            # object in the toolbox pod -- no admin personal access token is ever minted, so none
            # can leak or outlive this Job -- and writes its glrt- token into the Secret the
            # runner chart already reads. Idempotent: an existing token is left alone, and an
            # existing `zeta-cluster` runner is reused rather than duplicated. The token is never
            # printed: it moves from the exec's stdout into a shell variable and a tmpfs file.
            # The runner takes UNTAGGED jobs as well as its two tags (`run_untagged: true`): the
            # first `.gitlab-ci.yml` anyone writes has no `tags:`, and a tags-only runner leaves
            # that pipeline Pending forever with a perfectly healthy runner -- the failure that
            # reads as "CI does not work". The Rails call is retried (see the script's RETRIES
            # note) because one attempt turned a single cold-start blip into a permanent
            # crash-loop; the retry budget is wall-clock and sits inside activeDeadlineSeconds.
            # NON-BLOCKING by design: any failure prints the operator step and exits 0, because a
            # failed Sync hook would block every later gitlab sync (upgrades included) over the
            # one optional component; the runner then crash-loops exactly as it did before.
            - apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: gitlab-runner-token
                namespace: gitlab
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: gitlab-runner-token
                namespace: gitlab
              rules:
                - apiGroups: [apps]
                  resources: [deployments]
                  resourceNames: [gitlab-toolbox]
                  verbs: [get]
                - apiGroups: [""]
                  resources: [pods]
                  verbs: [get, list]
                - apiGroups: [""]
                  resources: [pods/exec]
                  verbs: [create]
                - apiGroups: [""]
                  resources: [secrets]
                  resourceNames: [gitlab-gitlab-runner-secret]
                  verbs: [get, patch]
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: gitlab-runner-token
                namespace: gitlab
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: gitlab-runner-token
              subjects:
                - kind: ServiceAccount
                  name: gitlab-runner-token
                  namespace: gitlab
            - apiVersion: batch/v1
              kind: Job
              metadata:
                name: gitlab-runner-token
                namespace: gitlab
                annotations:
                  # Sync phase, wave 5: after every wave-0 object (toolbox, webservice,
                  # migrations) is Healthy, before the runner Deployment (wave 10).
                  argocd.argoproj.io/hook: Sync
                  argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
                  argocd.argoproj.io/sync-wave: "5"
              spec:
                backoffLimit: 1
                activeDeadlineSeconds: 900
                template:
                  spec:
                    serviceAccountName: gitlab-runner-token
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65534
                      seccompProfile: { type: RuntimeDefault }
                    volumes:
                      - name: tmp
                        emptyDir: { medium: Memory }
                    containers:
                      - name: mint
                        # The chart's OWN kubectl image (bash + kubectl), resolved by the chart's own
                        # helper -- the ONE deliberate template expression in these extraObjects -- so
                        # it is exactly the image the shared-secrets Job runs and moves with every
                        # chart/gitlabVersion bump instead of going stale as a literal tag. It adds
                        # nothing to the image set.
                        image: '{{ include "gitlab.kubectl.image" . }}'
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities: { drop: [ALL] }
                        env:
                          - { name: HOME, value: /tmp }
                        volumeMounts:
                          - { name: tmp, mountPath: /tmp }
                        resources:
                          requests: { cpu: 50m, memory: 64Mi }
                        command: ["/bin/bash", "-c"]
                        args:
                          - |
                            set -uo pipefail
                            SECRET=gitlab-gitlab-runner-secret
                            # RETRIES: wave 5 means every wave-0 object reported Healthy, but a Ready
                            # toolbox pod can still fail its first `gitlab-rails runner` (Rails boot
                            # under a cold node, a connection pool still warming). ONE attempt turned
                            # any such blip into a runner that crash-loops for good, so the call is
                            # retried on a wall-clock budget that stays inside activeDeadlineSeconds
                            # (900): a Job the deadline KILLS is a FAILED sync hook, which is exactly
                            # what the exit-0 below exists to avoid. Both knobs are env-overridable
                            # only so the falsifier does not have to wait 10 minutes.
                            MAX_ATTEMPTS=${MINT_MAX_ATTEMPTS:-40}
                            GIVE_UP_AFTER=${MINT_GIVE_UP_AFTER_SECONDS:-720}
                            operator_step() {
                              echo "runner token NOT minted: $1"
                              echo "Operator step: Admin > CI/CD > Runners > New instance runner (tags kubernetes,zeta-cluster), then"
                              echo "  kubectl -n gitlab patch secret $SECRET --type merge -p '{\"stringData\":{\"runner-token\":\"<glrt-...>\",\"runner-registration-token\":\"\"}}'"
                              echo "  kubectl -n gitlab rollout restart deploy/gitlab-gitlab-runner"
                              exit 0
                            }
                            current=$(kubectl -n gitlab get secret "$SECRET" -o jsonpath='{.data.runner-token}') || operator_step "cannot read Secret $SECRET"
                            if [ -n "$current" ]; then echo "runner-token already present in $SECRET; nothing to do"; exit 0; fi
                            read -r -d '' RUBY <<'RB'
                            root = User.find_by_username('root') || raise('no root user')
                            runner = Ci::Runner.instance_type.find_by(description: 'zeta-cluster')
                            unless runner
                              result = Ci::Runners::CreateRunnerService.new(user: root, params: { runner_type: 'instance_type', description: 'zeta-cluster', tag_list: %w[kubernetes zeta-cluster], run_untagged: true }).execute
                              raise(result.message.to_s) unless result.success?
                              runner = result.payload[:runner]
                            end
                            token = runner.token.to_s
                            if token.empty?
                              runner.reset_token!
                              token = runner.token.to_s
                            end
                            print "\n" + token
                            RB
                            run_rails() {
                              if command -v timeout >/dev/null 2>&1; then timeout 150 kubectl "$@"; else kubectl "$@"; fi
                            }
                            attempt=0
                            token=""
                            while [ -z "$token" ]; do
                              attempt=$((attempt + 1))
                              out=$(run_rails -n gitlab exec deploy/gitlab-toolbox -c toolbox -- gitlab-rails runner "$RUBY" 2>/tmp/rails.err)
                              token=$(printf '%s\n' "$out" | grep -o 'glrt-[A-Za-z0-9_-]*' | tail -n 1)
                              [ -n "$token" ] && break
                              if [ "$attempt" -ge "$MAX_ATTEMPTS" ] || [ "$SECONDS" -ge "$GIVE_UP_AFTER" ]; then
                                tail -n 5 /tmp/rails.err
                                operator_step "no glrt- token from deploy/gitlab-toolbox after $attempt attempts"
                              fi
                              echo "attempt $attempt: no glrt- token yet; retrying"
                              sleep 15
                            done
                            printf '{"data":{"runner-token":"%s","runner-registration-token":""}}' "$(printf '%s' "$token" | base64 | tr -d '\n')" > /tmp/patch.json
                            kubectl -n gitlab patch secret "$SECRET" --type merge --patch-file /tmp/patch.json >/dev/null || operator_step "patching $SECRET was refused"
                            echo "minted a glrt- runner token into $SECRET"
          # LIVENESS KILL BUDGET -- WIDENED, NOT A startupProbe: MEASURED (helm pull
          # gitlab 8.7.0 --untar) that charts/gitlab-runner/templates/deployment.yaml
          # renders `livenessProbe` with no `startupProbe` key anywhere in the
          # subchart. Chart default (`initialDelaySeconds: 60, periodSeconds: 10,
          # failureThreshold: 3`, kill budget 80s) is generous already but GitLab as a
          # whole is a known slow starter (WP18 category b) and the runner's readiness
          # depends on the GitLab instance it registers against being reachable.
          # `livenessProbe.failureThreshold` is the values coordinate (default 3).
          #
          # failureThreshold: 20 (chart's own initialDelaySeconds/periodSeconds
          # unchanged) -> kill budget 60+19*10=250s.
          livenessProbe:
            failureThreshold: 20
        # LIVENESS KILL BUDGET for gitlab-shell -- THE CHART EXPOSES A COORDINATE, ONE
        # NESTING LEVEL DEEPER THAN registry/postgresql/redis/gitlab-runner ABOVE.
        # MEASURED (helm pull gitlab 8.7.0 --untar): gitlab-shell is a subchart of the
        # UMBRELLA CHART'S OWN "gitlab" subchart (charts/gitlab/charts/gitlab-shell/),
        # not of the top-level umbrella directly -- so its values coordinate from this
        # Application's valuesObject is `gitlab.gitlab-shell.*`, not `gitlab-shell.*`.
        # (`gitlab-exporter` and `kas` live at the same nesting; both were checked and
        # found to have NO values coordinate at all -- see the allowlist entries for
        # both in liveness-kill-budget.ts.)
        #
        # charts/gitlab/charts/gitlab-shell/templates/deployment.yaml renders
        # `deployment.livenessProbe.failureThreshold` (chart default 3, kill budget
        # 30s: initialDelaySeconds 10 + (3-1)*periodSeconds 10) with no `startupProbe`
        # key in this subchart either.
        #
        # failureThreshold: 20 (chart's own initialDelaySeconds/periodSeconds
        # unchanged) -> kill budget 10+19*10=200s.
        #
        # REPLICA BOUNDS -- THE CHART'S HPAs ARE SIZED FOR A CLUSTER, THIS IS ONE NODE.
        # MEASURED (helm template, 8.7.0): webservice, registry and gitlab-shell render
        # HorizontalPodAutoscalers with minReplicas 2, and webservice/sidekiq/registry/shell all
        # maxReplicas 10. k3s ships metrics-server, so those HPAs are LIVE. Three consequences on
        # one node: (1) the floor is TWO webservice pods at 2.5 GiB of memory request each --
        # a 5.2 GiB webservice tier against a budget row that counted one; (2) first-boot GitLab
        # is CPU-hot (migrations, seeding, asset compile), which is exactly the signal that
        # scales sidekiq (2 GiB each) toward ten pods = 20 GiB of requests the node does not
        # have -- the failure is Pending pods and kernel OOM kills, on the node that also runs
        # every other app; (3) the rendered Deployments carry no `replicas`, so any budget
        # arithmetic over them silently reads "1" while the cluster runs more.
        # `minReplicas` is the floor the HPA enforces, so 1 is the honest single-node value;
        # `maxReplicas` is a ceiling, kept at 2 where a second pod is still useful headroom
        # (webservice, sidekiq) and 1 where more pods add nothing on one node (registry,
        # shell). Raise them together with the node, not instead of it.
        # Coordinates: webservice/sidekiq/gitlab-shell are subcharts of the umbrella's own
        # `gitlab` chart (so `gitlab.<name>.minReplicas`); registry nests under `hpa`.
        # Falsifier: cluster/gitlab-runner-bringup.test.ts (h).
        #
        # ROLLOUTS MUST NOT NEED SPARE CAPACITY -- `deployment.strategy` IS maxSurge 0 / maxUnavailable 1 ON EVERY
        # DEPLOYMENT HERE (webservice, sidekiq, gitlab-shell, registry below, the runner above).
        # MEASURED LIVE, run 36881451548, on a 4-vCPU node already holding GitLab at 3160m of 4000m requested: the
        # install-time address pin re-renders this Application after its first sync, so a FRESH install rolls every
        # component once, and the Deployment default (RollingUpdate, maxSurge 25%) starts the NEW pod before it
        # stops the old one. sidekiq asks 900m; 840m was free; the surge pod sat `Pending: 0/1 nodes are available:
        # 1 Insufficient cpu` for 14 minutes, the rollout hit its progress deadline, the Application went Degraded,
        # and the operation never reached the exposure wave -- so the LAN Gateway was never created at the pinned
        # address. A single-replica workload on one node gains nothing from surge (there is no second node for the
        # old pod to keep serving from, and its memory/CPU request is counted twice while both exist); it costs a
        # stall whenever headroom < one pod. maxSurge 0 stops the old pod first, which needs no headroom at all.
        # Falsifier: gitlab-exposure.test.ts (g).
        gitlab:
          migrations:
            # See `global.job.nameSuffixOverride` above: a fixed Job name needs a Job that can be replaced.
            annotations:
              argocd.argoproj.io/sync-options: "Force=true,Replace=true"
          gitaly:
