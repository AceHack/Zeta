# GitLab CE — self-hosted Git. Heavier than Forgejo; pick one.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  name: gitlab
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://charts.gitlab.io/
    chart: gitlab
    targetRevision: 8.11.8
    helm:
      releaseName: gitlab
      valuesObject:
        global:
          edition: ce
          # A FIXED JOB-NAME SUFFIX -- THE MIGRATIONS JOB WAS RENAMED ON EVERY VALUES CHANGE, AND `prune: false`
          # LEFT EVERY OLD ONE BEHIND, SO A HEALTHY GITLAB READ `OutOfSync` FOREVER.
          #
          # MEASURED on the owner's real node 20:53 after first boot: `gitlab OutOfSync/Healthy`, and two
          # Completed migrations pods (`gitlab-migrations-39fcdbd`, 11m old, and `-52e7f78`, 4m old).
          # Mechanism (charts/gitlab/templates/_helpers.tpl `gitlab.jobNameSuffix`): the suffix is a hash of the
          # chart version, app version and EVERY value, so the install-time address pin -- which re-renders this
          # Application -- renames the Job; ArgoCD creates the new one, and the old one, being a live resource
          # with no desired twin and `prune: false`, is reported "requires pruning" forever. The same hash is the
          # reason the lane (gitlab-live-proof) measured `OutOfSync` after a clean, finished install.
          #
          # `global.job.nameSuffixOverride` is the chart's own, documented answer for Argo CD: the name stops
          # depending on the values. That alone trades one problem for another -- a Job's pod template is
          # IMMUTABLE, so the next values/image change (an upgrade, or the pin itself) would be refused with a
          # `field is immutable` error on a Job that now has the same name. So the Job is ALSO annotated
          # `Force=true,Replace=true` (`gitlab.migrations.annotations` below): when it differs, ArgoCD deletes and
          # recreates it, which is exactly the chart's intent for the hash -- "run again whenever GitLab changes".
          # The same suffix names the `gitlab-shared-secrets` hook Jobs (hook-succeeded + before-hook-creation),
          # which only ever stabilises them. Leftovers from the hashed days are removed by Job
          # `gitlab-migrations-gc` (extraObjects, PostSync). Falsifier: gitlab-exposure.test.ts (h).
          job:
            nameSuffixOverride: zeta
          # EXTERNAL URL -- WHAT A LAN CLIENT CAN ACTUALLY REACH, WITH NO DNS.
          #
          # This was `domain: gitlab.zeta.local` with the chart's default `https: true`, so GitLab
          # advertised https://gitlab.gitlab.zeta.local (clone URLs, OAuth redirects, the
          # registry's token realm, the runner's CI_SERVER_URL) -- a name nothing on the LAN
          # resolves, over TLS nothing terminates. MEASURED 2026-09-27 on a fresh node: the only
          # objects carrying that name were three Ingresses of class `gitlab-nginx`, which no
          # controller serves (the cluster's one IngressClass is `cilium`), so GitLab was
          # reachable from nowhere outside the cluster.
          #
          # UNSET (no install-time public domain) -- THE LAN DEFAULT: GitLab is served by its own
          # hostname-less Gateway `gitlab-lan` (`gitlab-runner.extraObjects` below) whose
          # LoadBalancer address is PINNED to the LAST address of the cluster's LB pool -- the
          # install-time range the installer resolved (zflash --lb-pool / prompt;
          # docs/ops/INSTALL-TIME-CONFIG.md row 6). LB-IPAM allocates lowest-first, so the pin
          # does not race automatic allocations. An address is the only identity a LAN client
          # reaches without DNS, and pinning it is what lets GitLab know its own URL at render time:
          #   web       http://<last pool address>/
          #   registry  <last pool address> (same address; `/v2/` routes to the registry -- GitLab
          #             serves nothing under /v2/). Plain HTTP: docker clients need it listed
          #             under `insecure-registries`.
          # THE ADDRESS IS NOT IN THIS FILE. The three places that carry it below hold the RFC 5737
          # documentation address 192.0.2.250 -- a sentinel that means "no LoadBalancer range was
          # resolved" and that no network can route, so it can never be mistaken for a real
          # endpoint (the old literal was a home subnet's address and was applied on every LAN).
          # When a range IS resolved, `cilium-lb-ipam-pool` (k8s/lb-ipam/) carries Job
          # `gitlab-lan-address`, which merge-patches `global.hosts.gitlab.name`,
          # `global.hosts.registry.name` and `global.zeta.lanAddress` of THIS Application's
          # valuesObject; bootstrap/root-application.yaml ignores exactly those paths so selfHeal
          # keeps them. The Gateway's `addresses` below READS `global.zeta.lanAddress`, so the
          # three can never disagree.
          # A dedicated Gateway rather than a route on `zeta-gateway`: that Gateway's single
          # hostname-less :80 listener is the portal's catch-all, and two catch-all routes on
          # one listener cannot both win.
          #
          # `domain` only feeds the chart's ASSEMBLED names for things this install neither runs
          # nor exposes (pages, smartcard, minio, the e-mail sender domain): RFC 2606 `.invalid`
          # says exactly that -- it is guaranteed never to resolve, instead of looking like a name
          # somebody forgot to register.
          #
          # SET (install-time public domain) -- `platform-public-tls` merge-patches this
          # Application's `spec.source.helm.parameters` to gitlab.<domain> / registry.<domain> over
          # https (full-ai-cluster/k8s/public-tls/resources.yaml, Job `gitlab-public-hosts`), and
          # bootstrap/root-application.yaml ignores exactly that field so selfHeal keeps it.
          # Helm parameters override this valuesObject, so these values are the UNSET state only.
          # Keep `spec.source.helm.parameters` ABSENT here (public-tls.test.ts pins it).
          hosts:
            domain: gitlab.invalid
            https: false
            gitlab: { name: "192.0.2.250" }     # sentinel; the resolved LB range replaces it
            registry: { name: "192.0.2.250" }   # sentinel; the resolved LB range replaces it
          # Read by the `gitlab-lan` Gateway below through the runner subchart's `tpl`.
          zeta:
            lanAddress: "192.0.2.250"            # sentinel; the resolved LB range replaces it
          # KAS (GitLab agent for Kubernetes) is OFF: its only exposure was the unserved
          # `gitlab-kas` Ingress, nothing in this cluster registers an agent, and it was two more
          # always-on pods. Re-enable together with a route for it.
          kas:
            enabled: false
          ingress:
            # NO INGRESS. Nothing serves class `gitlab-nginx`, and an Ingress with no controller
            # never gets an address -- ArgoCD's health check then holds the whole sync at
            # Progressing ("waiting for healthy state of networking.k8s.io/Ingress/gitlab-kas and
            # 2 more resources", measured live). Exposure is Gateway API, see `extraObjects`.
            enabled: false
            # `configureCertmanager: false` IS THE VALUE THAT MAKES THIS APP
            # RENDER, measured 2026-08-21. Without it gitlab 8.7.0 refuses to
            # template at all: charts/certmanager-issuer/templates/cert-manager.yml:14
            # does `required ... "Please set certmanager-issuer.email"`, and
            # `certmanager.install: false` below does NOT suppress that -- it
            # skips installing cert-manager while still asking the issuer
            # subchart to configure an ACME issuer. Two different switches.
            #
            # NOT INVENTED HERE: the sibling `infra/k8s/applications/gitlab/`
            # Application pins the same chart at the same 8.7.0 and already
            # carries this key, which is exactly why that one renders (and
            # accounts for 76 GiB) while this one produced nothing at all.
            configureCertmanager: false
            tls: { enabled: false }   # turn on after cert-manager
          initialRootPassword:
            secret: gitlab-initial-root-password
            key: password
          # BUNDLED MINIO IS OFF -- ITS TWO IMAGES ARE GONE FROM DOCKER HUB.
          #
          # `charts/minio` (this chart's own bundled subchart, gated ENTIRELY on
          # `global.minio.enabled` -- every template under it, verified against every
          # file in `charts/minio/templates/`, opens with `{{- if .Values.global.minio.enabled
          # -}}`) defaults to `enabled: true` and pulls `minio/minio:RELEASE.2017-12-28T01-21-00Z`
          # (the deployment) and `minio/mc:RELEASE.2018-07-13T00-53-22Z` (the create-buckets Job).
          # MEASURED 2026-09-22, same finding as PR #17475 (image-resolvability) and PR #17479
          # (registry-mirror-coverage): both tags -- and every OTHER tag in both repositories --
          # 401 "authentication required" from `registry-1.docker.io` with a valid anonymous pull
          # token (control test against `library/alpine:latest` with the same token flow
          # succeeded, so this is the repository, not the token). Docker Hub confirms the removal
          # dates to ~2026-09-11, coincident with MinIO's community-edition Docker Hub deprecation
          # -- the SAME upstream event `object-store/BLOB-STORE-CONTRACT.md` already documents for
          # the cluster's own former `minio/` Application (archived repo, no security patches,
          # replaced by SeaweedFS 2026-09-01). A first-boot sync of this Application with the
          # bundled subchart enabled ImagePullBackOffs on both, and the create-buckets Job that
          # the Rails app's object storage depends on never completes.
          #
          # A verified alternative image was checked and rejected: GitLab's own upstream image
          # mirror (`registry.gitlab.com/gitlab-org/cloud-native/mirror/images/...`) carries no
          # `minio` project at all -- `GET .../groups/gitlab-org/projects?search=minio&include_subgroups=true`
          # returns an empty list. `quay.io/minio/minio` and `quay.io/minio/mc` DO still resolve
          # (both linux/amd64 + linux/arm64), but their newest tags are RELEASE.2025-09-07 and
          # RELEASE.2025-08-13 respectively -- no release since, consistent with the same
          # archival BLOB-STORE-CONTRACT.md records (Feb 2026, no further development, no security
          # patches). Repointing the bundled subchart at quay.io would re-import the exact
          # unpatched-object-store posture the cluster already paid down once for its shared
          # store; it is not "maintained", only "still pullable".
          #
          # So GitLab is pointed at the SAME in-cluster SeaweedFS every other object-storage
          # consumer here uses (loki/Application.yaml, mimir/Application.yaml,
          # object-store/BLOB-STORE-CONTRACT.md) via the chart's own documented "consolidated
          # object storage" form -- one connection, all types (lfs/artifacts/uploads/packages)
          # unless overridden per type, none are here. `appConfig.objectStorage.configuration` in
          # `charts/gitlab/templates/_objectStorage.tpl` renders the CONSOLIDATED
          # `object_store.connection` block only when `.config.connection` is set (below) --
          # `global.minio.enabled: false` above removes the automatic minio-connection fallback
          # branch in that same template, which is why disabling minio and configuring the
          # connection are one change, not two.
          minio:
            enabled: false
          appConfig:
            object_store:
              enabled: true
              # PROXY EVERY DOWNLOAD THROUGH WORKHORSE, NEVER A PRESIGNED REDIRECT. Same failure
              # class as `registry.storage.redirect` below: a presigned URL names the in-cluster
              # SeaweedFS endpoint, which a browser outside the cluster cannot resolve (artifacts,
              # LFS, uploads, packages downloaded by the owner). The chart's default is already
              # `true` (values.yaml) for the consolidated block and every typed store; it is
              # pinned here so a chart bump cannot silently flip it. Pinned by gitlab-exposure.test.ts.
              proxy_download: true
              connection:
                # `key` defaults to "connection" (charts/gitlab/templates/_objectStorage.tpl
                # `gitlab.appConfig.objectStorage.mountSecrets`) -- named anyway so the
                # secret's shape is legible from this file without opening the chart.
                secret: zeta-blob-store
                key: connection
        # Disable bundled components — cluster has its own.
        certmanager:    { install: false }
        nginx-ingress:  { enabled: false }
        prometheus:     { install: false }
        # THE CHART'S UPGRADE CHECK IS OFF -- UNDER ARGOCD IT DEADLOCKS EVERY FRESH INSTALL.
        #
        # MEASURED 2026-09-27 on a fresh bare-metal install (no previous GitLab): Job
        # `gitlab-gitlab-upgrade-check` failed every retry with the single line "Please follow
        # the upgrade documentation at https://docs.gitlab.com/ee/update/#upgrade-paths", and
        # the app sat OutOfSync/Missing "waiting for completion of hook batch/Job/...upgrade-check".
        #
        # Why (helm pull gitlab 8.7.0 --untar): templates/upgrade_check_hook.yaml is a
        # `helm.sh/hook: pre-upgrade` Job mounting the `gitlab-gitlab-chart-info` ConfigMap
        # (`optional: true`), and templates/_runcheck.tpl exits 1 when `/chart-info/gitlabVersion`
        # is absent. chart-info (templates/chart-info.yaml) is an ORDINARY resource, not a hook.
        # Under Helm this is correct -- `helm install` never runs a pre-upgrade hook. ArgoCD maps
        # BOTH pre-install and pre-upgrade onto PreSync, which runs on the FIRST sync too, before
        # the Sync phase creates chart-info; the failed PreSync hook then blocks the Sync phase, so
        # chart-info is never created and every retry fails identically. Not a version mismatch:
        # GITLAB_VERSION=17.7.0 / CHART_VERSION=8.7.0 pass the same script once chart-info exists.
        #
        # The chart has no values coordinate for the Job's hook annotation, so the check cannot be
        # moved to a phase where it means something; disabling it is the only values-level fix.
        # This drops the in-cluster guard on FUTURE `targetRevision` bumps (it would have read the
        # previous sync's chart-info then). That guard now runs on the PR instead:
        # src/Core.TypeScript/cluster/gitlab-upgrade-path-guard.ts (helm-validate.yml, `charts`
        # job) renders the base pin's chart-info and the new chart's own runcheck, executes the
        # script offline, and fails the PR if it refuses the jump -- or if the bump is a downgrade.
        #
        # Falsifier: src/Core.TypeScript/cluster/upgrade-only-hook-first-sync.test.ts -- red if any
        # upgrade-only hook in this render reads a non-hook object of the same render; it also runs
        # the chart's own runcheck offline (forced on) to prove the failure above, and goes red if a
        # future chart version stops failing closed -- the cue to re-enable the check.
        upgradeCheck:   { enabled: false }
        gitlab-runner:
          install: true
          # IN-CLUSTER URL, NOT THE EXTERNAL ONE. Measured live: the runner registered against
          # the external URL (then https://gitlab.gitlab.zeta.local) and PANICked on DNS. Talking
          # to the webservice Service (Workhorse, :8181) never depends on DNS, TLS, the Gateway or
          # the install-time domain; `clone_url` below keeps job checkouts in-cluster too.
          gitlabUrl: http://gitlab-webservice-default.gitlab.svc:8181
          # AUTHENTICATION-TOKEN FLOW. The registration-token flow is disabled by default since
          # GitLab 17 (and removed in 18); the runner chart switches its register script to the
          # glrt- form only when `runnerRegistrationToken` is PRESENT AND EMPTY
          # (charts/gitlab-runner/templates/_helpers.tpl `gitlab-runner.isAuthToken`) -- that
          # branch drops --tag-list/--run-untagged/--locked, which GitLab refuses alongside a
          # glrt- token. The token itself is minted in-cluster by Job `gitlab-runner-token`
          # (extraObjects below) into the chart's own Secret `gitlab-gitlab-runner-secret`.
          # Tags now live on the runner record (set by that Job), not in these values.
          runnerRegistrationToken: ""
          # An auth-token runner is a record created ONCE; the chart's default preStop
          # `unregister --all-runners` on every pod stop is the registration-token-era lifecycle.
          unregisterRunners: false
          # THE RUNNER MUST NOT BE BESTEFFORT. The chart ships `resources: {}`, so the manager pod
          # was the first thing the kubelet evicts under node pressure -- and an evicted manager
          # re-registers against a GitLab that is itself slow to answer. Requests only (a limit
          # on the manager is the OOM-kill lottery the budget notes warn about).
          resources:
            requests: { cpu: 50m, memory: 64Mi }
          # JOBS RUN ON THIS ONE NODE, beside GitLab itself (~6 GiB of requests). The chart default
          # is 10 concurrent jobs, which on a single-node install is an OOM kill of GitLab
          # waiting for a busy pipeline. It is one `concurrent =` line to raise on a bigger machine.
          #
          # 2, NOT 4 -- MEASURED 2026-10-02 on the owner's real node (node-5b2dfa, root fs only ~119 GiB,
          # imagefs eviction at 15% free = ~19 GiB): four parallel kaniko/dotnet/node pipelines briefly
          # pushed imagefs free space under 15%, the node set DiskPressure=True, tainted itself
          # `node.kubernetes.io/disk-pressure:NoSchedule`, and ~150 pods were evicted. Disk, not CPU or
          # memory, is what a burst of image-heavy jobs exhausts on this box, and the measured top job
          # (a kaniko build) was 1.8 GB of ephemeral storage. Two jobs at the 8 GiB per-job ceiling below
          # is 16 GiB worst case; four was 32 GiB against a node that begins evicting at ~19 GiB free.
          # Pinned (<= 2) by cluster/gitlab-runner-bringup.test.ts (b).
          concurrent: 2
          # Stop the old manager before starting the new one (see the `strategy` note on `gitlab:` below):
          # no spare capacity needed, and never two managers polling GitLab for the same jobs.
          strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
          # Created only after the token Job (wave 5) has run, so the first pod reads a real
          # token instead of burning its 30 register attempts on an empty one and crash-looping.
          deploymentAnnotations:
            argocd.argoproj.io/sync-wave: "10"
          runners:
            privileged: false
            # The chart default, plus `clone_url` (see gitlabUrl above). This REPLACES the
            # chart's `runners.config`, whose only other content is a minio cache block gated on
            # `global.minio.enabled`, which is false here.
            #
            # JOB PODS CARRY REQUESTS TOO. Without them every CI job (build container + helper)
            # is BestEffort: evicted first, and invisible to the scheduler's arithmetic, so ten
            # parallel jobs "fit" on a node they do not. These are reservations, not limits.
            config: |
              [[runners]]
                clone_url = "http://gitlab-webservice-default.gitlab.svc:8181"
                [runners.kubernetes]
                image = "ubuntu:22.04"
                cpu_request = "100m"
                memory_request = "256Mi"
                helper_cpu_request = "25m"
                helper_memory_request = "32Mi"
                # EPHEMERAL STORAGE IS BOUNDED PER JOB, so ONE runaway job is evicted by the kubelet
                # (`Pod ephemeral local storage usage exceeds the total limit of containers`) instead
                # of the whole node going under DiskPressure. The limit is the build container's
                # writable layer + logs + this pod's emptyDirs (the /builds workspace), summed over the
                # pod's containers: 6Gi build + 2Gi helper = 8Gi per job.
                #
                # WHY 6Gi: the measured heaviest job on the real node was a kaniko build at 1.8 GB, so
                # 6Gi is ~3x that headroom -- a normal pipeline is nowhere near it, a layer-cache
                # runaway hits it. The REQUEST (1Gi) is the scheduler's reservation, so `concurrent`
                # jobs cannot all land on a node that cannot hold them. Keys verified against
                # gitlab-runner v17.6.0 common/config.go (the chart's appVersion at gitlab 8.7.0):
                # `ephemeral_storage_{request,limit}` and `helper_ephemeral_storage_{request,limit}`.
                # Jobs may not raise these: the `*_overwrite_max_allowed` keys are deliberately unset.
                ephemeral_storage_request = "1Gi"
                ephemeral_storage_limit = "6Gi"
                helper_ephemeral_storage_request = "64Mi"
                helper_ephemeral_storage_limit = "2Gi"
          # EXTRA OBJECTS OF THE GITLAB RELEASE. The umbrella chart has no values coordinate that
          # adds arbitrary objects; the runner subchart's `extraObjects`
          # (charts/gitlab-runner/templates/extra-manifests.yaml, rendered through `tpl` -- so no
          # double braces below except the one deliberate image helper call) is the one that does, and it keeps these objects in the same
          # ArgoCD Application, sync and prune scope as the Services they route to.
          extraObjects:
            # --- ephemeral-storage backstop for EVERY pod in this namespace ---------------
            # The runner config above sets explicit per-job ephemeral-storage requests/limits; this
            # LimitRange is the backstop for anything in `gitlab` that names none (a job whose pod
            # spec is hand-written, and GitLab's own pods), so no pod here is ever the unbounded
            # one. It is applied at wave -1, ahead of the pods it defaults: a LimitRange only
            # mutates pods admitted AFTER it exists.
            #
            # `default` (the LIMIT) 6Gi is the same figure as the runner's build container, ~3x the
            # measured 1.8 GB kaniko build (node-5b2dfa, 2026-10-02); GitLab's own pods are far
            # below it (the whole node's pod ephemeral total was ~4 GB at the time of the pressure
            # event). `defaultRequest` is deliberately SMALL (256Mi): it is a scheduler reservation
            # charged to every container here, and a large default would reserve more of a ~119 GiB
            # root filesystem for GitLab's idle pods than the jobs it protects the node from.
            #
            # NO ResourceQuota, on purpose: a quota on `limits.ephemeral-storage` makes the API
            # server REJECT a GitLab pod that would exceed it, and the namespace's own pods cannot be
            # told apart from job pods by a quota -- a quota that stops a CI burst would also stop
            # Gitaly from restarting. The bound that matters is per-pod (above) times `concurrent`.
            # Falsifier: cluster/gitlab-runner-bringup.test.ts (i).
            - apiVersion: v1
              kind: LimitRange
              metadata:
                name: gitlab-ephemeral-storage
                namespace: gitlab
                annotations:
                  argocd.argoproj.io/sync-wave: "-1"
              spec:
                limits:
                  - type: Container
                    defaultRequest:
                      ephemeral-storage: 256Mi
                    default:
                      ephemeral-storage: 6Gi
            # --- LAN exposure (see global.hosts above) ------------------------------------
            # EXPOSURE IS CREATED BY A POSTSYNC HOOK FROM THE LIVE ADDRESS -- IT IS NOT RENDERED BY THIS RELEASE.
            #
            # The Gateway and its two HTTPRoutes used to be rendered here, reading `global.zeta.lanAddress`. That
            # cannot work, and it was measured to fail three ways on the production pin path:
            #   * run 36871713092: in wave 0 the Gateway (sentinel address, assignable by no pool) held every later
            #     wave, so the token Job and the runner were NEVER CREATED;
            #   * moved to wave 20 (#17835), the runner chain came up -- but run 36951220893 showed the operation
            #     reaching wave 20 with the sentinel anyway and waiting on `Gateway/gitlab-lan` for 27 minutes;
            #   * a retry does not help (run 36955944272, a stale-render gate that failed the operation eight
            #     times in a row): ArgoCD re-renders a running operation from the source it captured when it
            #     STARTED, and the install-time Job can only patch this Application AFTER it exists -- after the
            #     first sync has begun. An operation that began with the sentinel finishes with the sentinel.
            # So nothing rendered from this Application's values can be trusted to carry the pin, and anything the
            # operation WAITS on that depends on the pin deadlocks it. Exposure is the only thing that is both.
            #
            # So the operation neither renders nor waits on it. A PostSync hook Job (below) reads the address
            # from the LIVE Application -- always current, even inside a stale operation -- and applies the Gateway
            # and routes from the template in ConfigMap `gitlab-exposure`; a hook completes when ITS Job does, not
            # when the Gateway is Programmed. With no resolved LB range (the address is still the sentinel) it
            # creates nothing: no Gateway is the honest state, and GitLab stays reachable in-cluster. The
            # operation completes, the pin makes the Application OutOfSync, and ArgoCD's next operation rolls
            # GitLab onto the real hosts; the hook runs again and re-applies the same objects (idempotent).
            # Falsifier: gitlab-exposure.test.ts (a)(c)(f) -- they RUN the hook script against a stub kubectl.
            #
            # The objects are therefore not tracked by ArgoCD (no tracking annotation, nothing to prune, nothing to
            # read OutOfSync). A node that already carries them from the previous release has them tracked by this
            # Application; the hook removes the tracking annotation so they stop reading "requires pruning".
            - apiVersion: v1
              kind: ConfigMap
              metadata:
                name: gitlab-exposure
                namespace: gitlab
              data:
                # `@LAN_ADDRESS@` is the one token; the hook substitutes the live address. Cilium LB-IPAM honours
                # spec.addresses (IPAddress type only); the address IS the resolved range's last address.
                exposure.yaml: |
                  apiVersion: gateway.networking.k8s.io/v1
                  kind: Gateway
                  metadata:
                    name: gitlab-lan
                    namespace: gitlab
                  spec:
                    gatewayClassName: cilium
                    addresses:
                      - { type: IPAddress, value: "@LAN_ADDRESS@" }
                    listeners:
                      - name: http
                        protocol: HTTP
                        port: 80
                        allowedRoutes:
                          namespaces: { from: Same }
                  ---
                  apiVersion: gateway.networking.k8s.io/v1
                  kind: HTTPRoute
                  metadata:
                    name: gitlab-web
                    namespace: gitlab
                  spec:
                    parentRefs:
                      - { name: gitlab-lan }
                    rules:
                      - matches:
                          - path: { type: PathPrefix, value: / }
                        backendRefs:
                          - { name: gitlab-webservice-default, port: 8181 }
                  ---
                  apiVersion: gateway.networking.k8s.io/v1
                  kind: HTTPRoute
                  metadata:
                    name: gitlab-registry
                    namespace: gitlab
                  spec:
                    parentRefs:
                      - { name: gitlab-lan }
                    rules:
                      # Longest prefix wins, so the registry API is carved out of the web route.
                      - matches:
                          - path: { type: PathPrefix, value: /v2/ }
                        backendRefs:
                          - { name: gitlab-registry, port: 5000 }
            - apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: gitlab-exposure
                namespace: gitlab
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: gitlab-exposure
                namespace: gitlab
              rules:
                - apiGroups: [gateway.networking.k8s.io]
                  resources: [gateways, httproutes]
                  verbs: [get, list, create, patch, update]
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: gitlab-exposure
                namespace: gitlab
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: gitlab-exposure
              subjects:
                - kind: ServiceAccount
                  name: gitlab-exposure
                  namespace: gitlab
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
