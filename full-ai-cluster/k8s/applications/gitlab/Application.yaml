# GitLab CE — self-hosted Git. Heavier than Forgejo; pick one.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  name: gitlab
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://charts.gitlab.io/
    chart: gitlab
    targetRevision: 8.7.0
    helm:
      releaseName: gitlab
      valuesObject:
        global:
          edition: ce
          hosts:
            domain: gitlab.zeta.local
          ingress:
            # `configureCertmanager: false` IS THE VALUE THAT MAKES THIS APP
            # RENDER, measured 2026-08-21. Without it gitlab 8.7.0 refuses to
            # template at all: charts/certmanager-issuer/templates/cert-manager.yml:14
            # does `required ... "Please set certmanager-issuer.email"`, and
            # `certmanager.install: false` below does NOT suppress that -- it
            # skips installing cert-manager while still asking the issuer
            # subchart to configure an ACME issuer. Two different switches.
            #
            # NOT INVENTED HERE: the sibling `infra/k8s/applications/gitlab/`
            # Application pins the same chart at the same 8.7.0 and already
            # carries this key, which is exactly why that one renders (and
            # accounts for 76 GiB) while this one produced nothing at all.
            configureCertmanager: false
            tls: { enabled: false }   # turn on after cert-manager
          initialRootPassword:
            secret: gitlab-initial-root-password
            key: password
          # BUNDLED MINIO IS OFF -- ITS TWO IMAGES ARE GONE FROM DOCKER HUB.
          #
          # `charts/minio` (this chart's own bundled subchart, gated ENTIRELY on
          # `global.minio.enabled` -- every template under it, verified against every
          # file in `charts/minio/templates/`, opens with `{{- if .Values.global.minio.enabled
          # -}}`) defaults to `enabled: true` and pulls `minio/minio:RELEASE.2017-12-28T01-21-00Z`
          # (the deployment) and `minio/mc:RELEASE.2018-07-13T00-53-22Z` (the create-buckets Job).
          # MEASURED 2026-09-22, same finding as PR #17475 (image-resolvability) and PR #17479
          # (registry-mirror-coverage): both tags -- and every OTHER tag in both repositories --
          # 401 "authentication required" from `registry-1.docker.io` with a valid anonymous pull
          # token (control test against `library/alpine:latest` with the same token flow
          # succeeded, so this is the repository, not the token). Docker Hub confirms the removal
          # dates to ~2026-09-11, coincident with MinIO's community-edition Docker Hub deprecation
          # -- the SAME upstream event `object-store/BLOB-STORE-CONTRACT.md` already documents for
          # the cluster's own former `minio/` Application (archived repo, no security patches,
          # replaced by SeaweedFS 2026-09-01). A first-boot sync of this Application with the
          # bundled subchart enabled ImagePullBackOffs on both, and the create-buckets Job that
          # the Rails app's object storage depends on never completes.
          #
          # A verified alternative image was checked and rejected: GitLab's own upstream image
          # mirror (`registry.gitlab.com/gitlab-org/cloud-native/mirror/images/...`) carries no
          # `minio` project at all -- `GET .../groups/gitlab-org/projects?search=minio&include_subgroups=true`
          # returns an empty list. `quay.io/minio/minio` and `quay.io/minio/mc` DO still resolve
          # (both linux/amd64 + linux/arm64), but their newest tags are RELEASE.2025-09-07 and
          # RELEASE.2025-08-13 respectively -- no release since, consistent with the same
          # archival BLOB-STORE-CONTRACT.md records (Feb 2026, no further development, no security
          # patches). Repointing the bundled subchart at quay.io would re-import the exact
          # unpatched-object-store posture the cluster already paid down once for its shared
          # store; it is not "maintained", only "still pullable".
          #
          # So GitLab is pointed at the SAME in-cluster SeaweedFS every other object-storage
          # consumer here uses (loki/Application.yaml, mimir/Application.yaml,
          # object-store/BLOB-STORE-CONTRACT.md) via the chart's own documented "consolidated
          # object storage" form -- one connection, all types (lfs/artifacts/uploads/packages)
          # unless overridden per type, none are here. `appConfig.objectStorage.configuration` in
          # `charts/gitlab/templates/_objectStorage.tpl` renders the CONSOLIDATED
          # `object_store.connection` block only when `.config.connection` is set (below) --
          # `global.minio.enabled: false` above removes the automatic minio-connection fallback
          # branch in that same template, which is why disabling minio and configuring the
          # connection are one change, not two.
          minio:
            enabled: false
          appConfig:
            object_store:
              enabled: true
              connection:
                # `key` defaults to "connection" (charts/gitlab/templates/_objectStorage.tpl
                # `gitlab.appConfig.objectStorage.mountSecrets`) -- named anyway so the
                # secret's shape is legible from this file without opening the chart.
                secret: zeta-blob-store
                key: connection
        # Disable bundled components — cluster has its own.
        certmanager:    { install: false }
        nginx-ingress:  { enabled: false }
        prometheus:     { install: false }
        gitlab-runner:
          install: true
          runners: { privileged: false, tags: "kubernetes,zeta-cluster" }
          # LIVENESS KILL BUDGET -- WIDENED, NOT A startupProbe: MEASURED (helm pull
          # gitlab 8.7.0 --untar) that charts/gitlab-runner/templates/deployment.yaml
          # renders `livenessProbe` with no `startupProbe` key anywhere in the
          # subchart. Chart default (`initialDelaySeconds: 60, periodSeconds: 10,
          # failureThreshold: 3`, kill budget 80s) is generous already but GitLab as a
          # whole is a known slow starter (WP18 category b) and the runner's readiness
          # depends on the GitLab instance it registers against being reachable.
          # `livenessProbe.failureThreshold` is the values coordinate (default 3).
          #
          # failureThreshold: 20 (chart's own initialDelaySeconds/periodSeconds
          # unchanged) -> kill budget 60+19*10=250s.
          livenessProbe:
            failureThreshold: 20
        # LIVENESS KILL BUDGET for gitlab-shell -- THE CHART EXPOSES A COORDINATE, ONE
        # NESTING LEVEL DEEPER THAN registry/postgresql/redis/gitlab-runner ABOVE.
        # MEASURED (helm pull gitlab 8.7.0 --untar): gitlab-shell is a subchart of the
        # UMBRELLA CHART'S OWN "gitlab" subchart (charts/gitlab/charts/gitlab-shell/),
        # not of the top-level umbrella directly -- so its values coordinate from this
        # Application's valuesObject is `gitlab.gitlab-shell.*`, not `gitlab-shell.*`.
        # (`gitlab-exporter` and `kas` live at the same nesting; both were checked and
        # found to have NO values coordinate at all -- see the allowlist entries for
        # both in liveness-kill-budget.ts.)
        #
        # charts/gitlab/charts/gitlab-shell/templates/deployment.yaml renders
        # `deployment.livenessProbe.failureThreshold` (chart default 3, kill budget
        # 30s: initialDelaySeconds 10 + (3-1)*periodSeconds 10) with no `startupProbe`
        # key in this subchart either.
        #
        # failureThreshold: 20 (chart's own initialDelaySeconds/periodSeconds
        # unchanged) -> kill budget 10+19*10=200s.
        gitlab:
          gitlab-shell:
            deployment:
              livenessProbe:
                failureThreshold: 20
        # Container registry's object storage is a SEPARATE config surface from
        # `global.appConfig.object_store` above -- `charts/registry` is a Go binary, not the
        # Rails app, and reads its own `storage.secret`/`storage.key` (default "config"),
        # mounted at `/config/storage/config` and spliced into the rendered `storage:` block by
        # the chart's own entrypoint script (`charts/registry/templates/deployment.yaml` +
        # `_helper_create_buckets.sh`-adjacent config template). Same SeaweedFS endpoint, same
        # shared `zeta-blob-store` credential, different secret key holding the registry's own
        # `storage.s3.*` YAML shape (`gitlab-registry` bucket, `secure: false` -- in-cluster,
        # no TLS -- `v4auth: true`).
        registry:
          storage:
            secret: zeta-blob-store
            key: config
          # LIVENESS KILL BUDGET -- WIDENED, NOT A startupProbe: MEASURED
          # (charts/registry/templates/deployment.yaml) that this container renders
          # `deployment.livenessProbe.failureThreshold` (chart default 3, kill budget
          # 25s: initialDelaySeconds 5 + (3-1)*periodSeconds 10) with no `startupProbe`
          # key in the registry subchart.
          #
          # failureThreshold: 20 (chart's own initialDelaySeconds/periodSeconds
          # unchanged) -> kill budget 5+19*10=195s.
          deployment:
            livenessProbe:
              failureThreshold: 20
        # THE FOUR BUNDLED BITNAMI IMAGES, RE-POINTED AT `bitnamilegacy`.
        #
        # This Application was the largest entry in the partitioner's CANNOT BE
        # PRICED quarantine: 16 of its 20 rendered images measure fine, and four
        # -- all from the bundled `postgresql` and `redis` subcharts -- returned
        # HTTP 404. Bitnami withdrew its free versioned tags from Docker Hub, and
        # this is the same withdrawal `forgejo/Application.yaml` already records
        # (chart 13.0.1 rendering `bitnami/postgresql:17.5.0-debian-12-r18`,
        # likewise a 404). MEASURED 2026-08-23 rather than assumed:
        # `docker.io/bitnami/postgresql` and `docker.io/bitnami/redis` still
        # answer `tags/list`, and every entry is `latest`, `latest-metadata`, or
        # a cosign `sha256-...`/`.sig`/`.att` artifact -- no versioned tags left.
        #
        # Each of the four resolves under `bitnamilegacy` at the SAME tag, so
        # nothing here is a version change -- only the repository path moves:
        #
        #   bitnamilegacy/postgresql:14.8.0                     91,714,366 B
        #   bitnamilegacy/postgres-exporter:0.12.0-debian-11-r86 41,797,683 B
        #   bitnamilegacy/redis:6.2.16-debian-12-r1             48,916,895 B
        #   bitnamilegacy/redis-exporter:1.46.0-debian-11-r8    36,654,360 B
        #
        # These four are what a GitLab bring-up would have ImagePullBackOff'd on,
        # so this is a live fix that happens to also make the app measurable.
        #
        # HONEST LIMIT, the same one recorded in redis/Application.yaml:
        # `bitnamilegacy` is an ARCHIVE. It gets no updates and Bitnami reserves
        # the right to remove it. Moving GitLab onto an external PostgreSQL/Redis
        # (`global.psql.host` / `global.redis.host`, the production-documented
        # path anyway) is the durable answer and is a maintainer decision, not
        # one to make inside a measurement fix.
        postgresql:
          image:
            repository: bitnamilegacy/postgresql
          # STARTUP PROBES -- THIS IS A BITNAMI CHART; BOTH CONTAINERS EXPOSE THE
          # COORDINATE DIRECTLY. MEASURED (helm pull postgresql --repo
          # https://charts.bitnami.com/bitnami -- the same subchart gitlab vendors):
          # `templates/primary/statefulset.yaml` renders `startupProbe` from
          # `.Values.primary.startupProbe.enabled` / `.Values.metrics.startupProbe.enabled`
          # (both default false), alongside `customLivenessProbe`/`livenessProbe.enabled`
          # for the always-on liveness (postgresql container: 80s kill budget; metrics
          # container: 55s).
          #
          # WHY: not individually vetted at WP15's 2026-09-22 catalog audit; postgresql
          # is a known slow starter (WP18 category b) -- GitLab's embedded Postgres runs
          # first-boot init/WAL replay before it can answer `pg_isready`.
          #
          # Kubelet holds `livenessProbe` off entirely until `startupProbe` first
          # succeeds. Chart default startupProbe shape (initialDelaySeconds 30,
          # periodSeconds 10, failureThreshold 15 -> 30+14*10=170s) is widened further
          # to failureThreshold 30 -> 30+29*10=320s; the chart's own liveness (80s /
          # 55s) resumes once startup succeeds.
          primary:
            startupProbe:
              enabled: true
              failureThreshold: 30
          metrics:
            image:
              repository: bitnamilegacy/postgres-exporter
            startupProbe:
              enabled: true
              failureThreshold: 30
        redis:
          image:
            repository: bitnamilegacy/redis
          # STARTUP PROBE -- SAME BITNAMI SHAPE AS postgresql ABOVE. MEASURED
          # (charts/redis/templates/master/application.yaml): `master.startupProbe.enabled`
          # (default false) exists alongside the always-on `master.livenessProbe`
          # (chart default -> 40s kill budget). Not individually vetted at WP15's
          # 2026-09-22 catalog audit; redis is bundled with GitLab's own slow-starter
          # profile (WP18 category b) -- Sentinel/AOF replay on first boot.
          #
          # Kubelet holds `livenessProbe` off until `startupProbe` first succeeds. The
          # chart's own default `initialDelaySeconds: 20` is left as-is (not zeroed);
          # periodSeconds 10, failureThreshold 30 -> startup kill budget 20+29*10=310s;
          # the chart's own 40s liveness resumes once startup succeeds.
          master:
            startupProbe:
              enabled: true
              periodSeconds: 10
              failureThreshold: 30
          metrics:
            image:
              repository: bitnamilegacy/redis-exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true, SkipDryRunOnMissingResource=true ]
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
