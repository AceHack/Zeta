          # coordinate under `hpa` rather than at the subchart's top level.
          hpa: { minReplicas: 1, maxReplicas: 1 }
          storage:
            secret: zeta-blob-store
            key: config
          # LIVENESS KILL BUDGET -- WIDENED, NOT A startupProbe: MEASURED
          # (charts/registry/templates/deployment.yaml) that this container renders
          # `deployment.livenessProbe.failureThreshold` (chart default 3, kill budget
          # 25s: initialDelaySeconds 5 + (3-1)*periodSeconds 10) with no `startupProbe`
          # key in the registry subchart.
          #
          # failureThreshold: 20 (chart's own initialDelaySeconds/periodSeconds
          # unchanged) -> kill budget 5+19*10=195s.
          deployment:
            strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
            livenessProbe:
              failureThreshold: 20
