            # every repository GitLab hosts, so under node pressure the scheduler preempts for it and the kubelet declines to
            # evict it before any optional workload. Built-in class: no apply-order hazard.
            # Pinned by cluster/essential-priority.test.ts.
            priorityClassName: system-cluster-critical
          webservice:
            minReplicas: 1
            maxReplicas: 2
            deployment: { strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
          sidekiq:
            minReplicas: 1
            maxReplicas: 2
            deployment: { strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
          gitlab-shell:
            minReplicas: 1
            maxReplicas: 1
            deployment:
              strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
              livenessProbe:
                failureThreshold: 20
          gitlab-exporter:
            deployment: { strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } } }
        # Container registry's object storage is a SEPARATE config surface from
        # `global.appConfig.object_store` above -- `charts/registry` is a Go binary, not the
        # Rails app, and reads its own `storage.secret`/`storage.key` (default "config"),
        # mounted at `/config/storage/config` and spliced into the rendered `storage:` block by
        # the chart's own entrypoint script (`charts/registry/templates/deployment.yaml` +
        # `_helper_create_buckets.sh`-adjacent config template). Same SeaweedFS endpoint, same
        # shared `zeta-blob-store` credential, different secret key holding the registry's own
        # `storage.s3.*` YAML shape (`gitlab-registry` bucket, `secure: false` -- in-cluster,
        # no TLS -- `v4auth: true`).
        registry:
          # Replica bounds: see the note on `gitlab:` above. The registry's own HPA nests the
          # coordinate under `hpa` rather than at the subchart's top level.
          hpa: { minReplicas: 1, maxReplicas: 1 }
          storage:
            secret: zeta-blob-store
            key: config
            # THE REGISTRY STREAMS BLOBS ITSELF -- IT DOES NOT 307 CLIENTS TO THE S3 ENDPOINT.
            #
            # MEASURED on the live node: pulls from registry.flowdent.net fail for every client
            # outside the cluster (kubelet/containerd: ErrImagePull DeadlineExceeded; Docker:
            # `unexpected status from GET request to http://blob-store-seaweedfs-all-in-one.
            # object-store.svc:8333/gitlab-...`). The distribution registry's DEFAULT for an S3
            # driver is to answer a blob GET with a 307 to a presigned URL on `regionendpoint` --
            # here an in-cluster DNS name no client outside the cluster (the node itself included)
            # can resolve. `disable: true` makes the registry pod read the object and stream it,
            # so the client only ever talks to registry.<domain>. Cost: registry CPU/bandwidth
            # (fine on one node). Renders `storage.redirect.disable: true` (charts/registry
            # templates/configmap.yaml, `with .Values.storage.redirect`); pinned by
            # gitlab-exposure.test.ts. Detail: docs/ops/GITLAB-REGISTRY-PULLS.md.
            redirect:
              disable: true
          # LIVENESS KILL BUDGET -- WIDENED, NOT A startupProbe: MEASURED
          # (charts/registry/templates/deployment.yaml) that this container renders
          # `deployment.livenessProbe.failureThreshold` (chart default 3, kill budget
          # 25s: initialDelaySeconds 5 + (3-1)*periodSeconds 10) with no `startupProbe`
          # key in the registry subchart.
          #
          # failureThreshold: 20 (chart's own initialDelaySeconds/periodSeconds
          # unchanged) -> kill budget 5+19*10=195s.
          deployment:
            strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
            livenessProbe:
              failureThreshold: 20
        # THE FOUR BUNDLED BITNAMI IMAGES, RE-POINTED AT `bitnamilegacy`.
        #
        # This Application was the largest entry in the partitioner's CANNOT BE
        # PRICED quarantine: 16 of its 20 rendered images measure fine, and four
        # -- all from the bundled `postgresql` and `redis` subcharts -- returned
        # HTTP 404. Bitnami withdrew its free versioned tags from Docker Hub, and
        # this is the same withdrawal `forgejo/Application.yaml` already records
        # (chart 13.0.1 rendering `bitnami/postgresql:17.5.0-debian-12-r18`,
        # likewise a 404). MEASURED 2026-08-23 rather than assumed:
        # `docker.io/bitnami/postgresql` and `docker.io/bitnami/redis` still
        # answer `tags/list`, and every entry is `latest`, `latest-metadata`, or
        # a cosign `sha256-...`/`.sig`/`.att` artifact -- no versioned tags left.
        #
        # Each of the four resolves under `bitnamilegacy` at the SAME tag, so
        # nothing here is a version change -- only the repository path moves:
        #
        #   bitnamilegacy/postgresql:14.8.0                     91,714,366 B
        #   bitnamilegacy/postgres-exporter:0.12.0-debian-11-r86 41,797,683 B
        #   bitnamilegacy/redis:6.2.16-debian-12-r1             48,916,895 B
        #   bitnamilegacy/redis-exporter:1.46.0-debian-11-r8    36,654,360 B
        #
        # These four are what a GitLab bring-up would have ImagePullBackOff'd on,
        # so this is a live fix that happens to also make the app measurable.
        #
        # HONEST LIMIT, the same one recorded in redis/Application.yaml:
        # `bitnamilegacy` is an ARCHIVE. It gets no updates and Bitnami reserves
        # the right to remove it. Moving GitLab onto an external PostgreSQL/Redis
        # (`global.psql.host` / `global.redis.host`, the production-documented
        # path anyway) is the durable answer and is a maintainer decision, not
        # one to make inside a measurement fix.
        postgresql:
          image:
            repository: bitnamilegacy/postgresql
          # STARTUP PROBES -- THIS IS A BITNAMI CHART; BOTH CONTAINERS EXPOSE THE
          # COORDINATE DIRECTLY. MEASURED (helm pull postgresql --repo
          # https://charts.bitnami.com/bitnami -- the same subchart gitlab vendors):
          # `templates/primary/statefulset.yaml` renders `startupProbe` from
          # `.Values.primary.startupProbe.enabled` / `.Values.metrics.startupProbe.enabled`
          # (both default false), alongside `customLivenessProbe`/`livenessProbe.enabled`
          # for the always-on liveness (postgresql container: 80s kill budget; metrics
          # container: 55s).
          #
          # WHY: not individually vetted at WP15's 2026-09-22 catalog audit; postgresql
          # is a known slow starter (WP18 category b) -- GitLab's embedded Postgres runs
          # first-boot init/WAL replay before it can answer `pg_isready`.
          #
          # Kubelet holds `livenessProbe` off entirely until `startupProbe` first
          # succeeds. Chart default startupProbe shape (initialDelaySeconds 30,
          # periodSeconds 10, failureThreshold 15 -> 30+14*10=170s) is widened further
          # to failureThreshold 30 -> 30+29*10=320s; the chart's own liveness (80s /
          # 55s) resumes once startup succeeds.
          primary:
            priorityClassName: system-cluster-critical   # essential tier (gitaly's note, above): GitLab's database
            startupProbe:
              enabled: true
              failureThreshold: 30
          metrics:
            image:
              repository: bitnamilegacy/postgres-exporter
            # The exporter rendered `resources: {}`. The pod is Burstable anyway (the postgres
            # container requests 250m/256Mi), but the exporter's own share was unreserved, so
            # the scheduler's arithmetic and the budget both undercounted this pod.
            resources:
              requests: { cpu: 10m, memory: 16Mi }
            startupProbe:
              enabled: true
              failureThreshold: 30
        redis:
          image:
            repository: bitnamilegacy/redis
          # STARTUP PROBE -- SAME BITNAMI SHAPE AS postgresql ABOVE. MEASURED
          # (charts/redis/templates/master/application.yaml): `master.startupProbe.enabled`
          # (default false) exists alongside the always-on `master.livenessProbe`
          # (chart default -> 40s kill budget). Not individually vetted at WP15's
          # 2026-09-22 catalog audit; redis is bundled with GitLab's own slow-starter
          # profile (WP18 category b) -- Sentinel/AOF replay on first boot.
          #
          # Kubelet holds `livenessProbe` off until `startupProbe` first succeeds. The
          # chart's own default `initialDelaySeconds: 20` is left as-is (not zeroed);
          # periodSeconds 10, failureThreshold 30 -> startup kill budget 20+29*10=310s;
          # the chart's own 40s liveness resumes once startup succeeds.
          master:
            priorityClassName: system-cluster-critical   # essential tier (gitaly's note, above): queues, sessions, cache
            # REDIS RENDERED BESTEFFORT: both containers (redis, exporter) shipped `resources: {}`,
            # so the pod requested nothing and was the first thing the kubelet evicts under node
            # pressure. GitLab keeps its Sidekiq queues, sessions and cache here -- an evicted
            # Redis is every background job and every logged-in session gone at once, on the one
            # node that is also running every CI job. Requests only; `maxmemory` is the
            # chart's own bound, not a pod limit.
            resources:
              requests: { cpu: 100m, memory: 128Mi }
            startupProbe:
              enabled: true
              periodSeconds: 10
              failureThreshold: 30
          metrics:
            resources:
              requests: { cpu: 10m, memory: 16Mi }
            image:
              repository: bitnamilegacy/redis-exporter
            # STARTUP PROBE -- WIDENED, NOT A LIVENESS CHANGE: MEASURED (helm pull
            # gitlab 8.11.8, charts/redis/templates/master/application.yaml). The
            # redis-exporter sidecar renders `startupProbe` from
            # `.Values.metrics.startupProbe.enabled` (chart default false) alongside
            # the always-on `.Values.metrics.livenessProbe` (chart default enabled:
            # initialDelaySeconds 10 + (failureThreshold 5 - 1) * periodSeconds 10 =
            # 50s kill budget -- under the 120s liveness-kill-budget floor). The
            # metrics container is a fast Go exporter, but it shares the pod with the
            # slow-starting redis master (startupProbe enabled above), so until the
            # pod is up the exporter's TCP endpoint is unreachable and its 50s
            # liveness would fire-and-kill the pod mid-boot. Enabling the exporter's
            # own startupProbe holds its livenessProbe off until the port first
            # answers -- same shape as the postgresql metrics block above.
            startupProbe:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    # CLIENT-SIDE APPLY -- `ServerSideApply=true` WAS REMOVED, MEASURED 2026-09-27 on a fresh
    # node: StatefulSet `gitlab-gitaly` was NEVER CREATED. ArgoCD reported "failed to create typed
    # patch object (gitlab/gitlab-gitaly; apps/v1, Kind=StatefulSet): .spec.template.spec.
    # containers[name="gitaly"].env: duplicate entries for key [name="TZ"]" -- chart 8.7.0's
    # charts/gitlab/charts/gitaly/templates/_statefulset_spec.yaml includes `gitlab.timeZone.env`
    # at both ends of the gitaly container's `env`, unconditionally, and SSA's structured merge
    # refuses a list-map with a repeated key. No values coordinate removes either copy. With no
    # Gitaly, GitLab cannot store a single repository. Client-side apply accepts the object (the
    # API server only warns on the shadowed env var). It also closes the other two OutOfSync rows
    # seen live -- StatefulSets gitlab-postgresql / gitlab-redis-master, the SSA
    # volumeClaimTemplates prediction drift (argo-cd#11143) documented in
    # cluster/ssa-volumeclaimtemplate-drift.ts, whose closure #1 is exactly this. Nothing here
    # needs SSA: the chart renders no CRD, and no object approaches the 262144-byte
    # last-applied-configuration cap. Falsifier: cluster/gitlab-exposure.test.ts (e).
    syncOptions: [ CreateNamespace=true, SkipDryRunOnMissingResource=true ]
    retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
