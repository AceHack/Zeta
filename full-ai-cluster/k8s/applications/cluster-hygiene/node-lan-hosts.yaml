# node-lan-hosts -- the NODE resolves gitlab.<domain> / registry.<domain> to the LAN gateway, not the router.
#
# WHY THIS EXISTS. MEASURED 2026-10-02 on node-5b2dfa: the kubelet/containerd pull
# `registry.flowdent.net/flowdent/fd-core:<sha>` and fail with
# `dial tcp 66.10.240.234:443: i/o timeout` (then `failed to fetch oauth token: Post
# https://gitlab.flowdent.net/jwt/auth`). Those names resolve to the PUBLIC IP, which the node can only
# reach by hairpinning through the home router, and the router has no TCP 443 forward at all. Pods use
# CoreDNS and are unaffected; the kubelet/containerd use the HOST resolver, and on NixOS /etc/hosts is a
# read-only symlink into /etc/static (declarative: it needs a rebuild + sudo, i.e. the OS layer). The same
# LAN gateway answers correctly from the node (`curl --resolve registry...:443:<lb-ip>` -> 401 auth
# challenge). So this pins ONLY the names the kubelet needs, at the gateway's own LB address.
#
# GITOPS ONLY, no OS change: a bind mount over /etc/hosts (the file is read-only, the mount point is
# not). Re-asserted every 30s, so it survives a `nixos-rebuild` (new store path) and a reboot (/run is
# tmpfs) -- both leave the entry absent until the next tick, never wrong.
#
#   discover  (kubectl)  reads the Gateway's LB address + its gitlab./registry. listener hostnames and
#                        writes them to a shared emptyDir. A FAILED PROBE KEEPS THE LAST BLOCK: unknown
#                        is not "remove".
#   apply     (busybox)  privileged + hostPID; builds <host /etc/hosts minus our lines> + block, writes it
#                        to /run/zeta-lan-hosts on the host, bind-mounts it once, then rewrites in place.
#
# SECOND JOB, same pod -- `forward`: TCP :443 on the node -> the Gateway's LB address. The owner's AT&T
# router can only port-forward to a DEVICE (the node, 192.168.1.79), never to the Gateway's LB IP
# (.240), and MEASURED 2026-10-02 nothing listens on the node's :443 -- only .240 answers
# (`curl --resolve registry...:443:.240` -> 401, `:.79` -> refused). So the node relays 443 to the
# gateway; TLS still terminates at the gateway (passthrough), the relay never sees plaintext. Client
# source addresses are therefore the node's, not the internet's -- the cost of this relay.
#
# THIRD JOB -- `relay Service`: the router picks WHICH of the node's addresses gets the :443 forward.
# MEASURED 2026-10-02: the forward worked at cutover, then outside SYNs began arriving for
# 192.168.1.250 (the gitlab-lan Gateway, :80 only) and every connection hung -- the node's addresses
# (.79 and each Cilium LB IP: .240 .241 .242 .250) share ONE MAC, so a MAC-keyed router can bind the
# rule to any of them and can change its mind. An iptables DNAT cannot help (Cilium's eBPF owns those
# IPs before netfilter; the rule saw 0 packets). A Service with `externalIPs` can: Cilium (KPR) makes
# <ip>:443 a frontend for the relay, beside the Gateway's own :80. `discover` therefore keeps ONE Service,
# `https-relay`, whose externalIPs are EVERY LoadBalancer address in the cluster that does not already
# serve :443 -- so it follows a new gateway or a changed address with no edit here. A FAILED LISTING
# KEEPS THE LAST SET (unknown is not "remove"). The public gateway (.240) serves :443 itself and is skipped.
#
# PLAIN HTTP gets the same treatment (`http-relay`, :80): MEASURED 2026-10-02, the router also scatters :80, and
# `http://flowdent.net` landed on GitLab (.250), the portal (.241) or a timeout (.79, .242). The edge answers :80 with a
# 301 to https (every host); the Services above cover the addresses that did not serve :80, and a route on the two
# Gateways that DO serve it covers the rest.
#
# FOURTH JOB -- SSH from the internet (owner's request). Same MAC-keyed-router problem, same fix: `ssh-relay` is a
# second externalIPs Service (:22 -> the node's own sshd through the hostNetwork pod) over EVERY LoadBalancer
# address, so a router forward of :22 to the node lands on sshd whichever address it bound. MEASURED before
# this: only the node's own address answered :22, the gateway addresses timed out. sshd is key-only (passwords
# disabled, root prohibit-password, 0 failed logins in 24h); `apply` adds a per-source new-connection rate limit.
#
# DELIBERATELY NOT PINNED: api.<domain> and api-staging.<domain>. Until the production cutover those
# resolve to the Azure container apps; pinning them on the node would silently reroute host-side callers.
#
# Falsifier: src/Core.TypeScript/cluster/node-lan-hosts.test.ts (renders the manifest and RUNS the apply
# script against a fake host root). Cannot prove: the bind mount on the real node -- only a live node does.
apiVersion: v1
kind: Namespace
metadata:
  name: zeta-node-hosts
  labels:
    # The apply container is privileged by necessity (it enters the host mount namespace).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-lan-hosts
  namespace: zeta-node-hosts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-lan-hosts-read-gateway
  namespace: zeta-platform
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    resourceNames: ["zeta-public-gateway"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-lan-hosts-read-gateway
  namespace: zeta-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-lan-hosts-read-gateway
subjects:
  - kind: ServiceAccount
    name: node-lan-hosts
    namespace: zeta-node-hosts
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-lan-hosts
  namespace: zeta-node-hosts
spec:
  selector:
    matchLabels: { app: node-lan-hosts }
  template:
    metadata:
      labels: { app: node-lan-hosts }
    spec:
      serviceAccountName: node-lan-hosts
      hostPID: true
      # `forward` listens on the NODE's :443 (see header), so the pod shares the host network namespace.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Must run through disk-pressure / control-plane taints: it is what lets the node pull images.
      tolerations:
        - { operator: Exists }
      volumes:
        - name: shared
          # Memory-backed: /shared/edge/pem holds the API certificates' PRIVATE KEYS and must never touch disk.
          emptyDir: { medium: Memory }
      containers:
        - name: discover
          image: registry.gitlab.com/gitlab-org/build/cng/kubectl:v17.7.0
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: shared, mountPath: /shared }
          command: ["/bin/bash", "-c"]
          args:
            - |
              SHARED="${SHARED:-/shared}"
              # Every LoadBalancer address that does NOT already expose :443 (one per line, sorted).
              relay_ips() {
                port="$1"
                kubectl get svc -A -o jsonpath='{range .items[*]}{.status.loadBalancer.ingress[*].ip}{"|"}{.spec.ports[*].port}{"\n"}{end}' \
                  | awk -F'|' -v p="$port" '{ n = split($1, a, " "); for (i = 1; i <= n; i++) { seen[a[i]] = 1; if (index(" " $2 " ", " " p " ")) has[a[i]] = 1 } }
                               END { for (ip in seen) if (!(ip in has) && ip ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) print ip }' \
                  | sort
              }
              while :; do
                ip=$(kubectl -n zeta-platform get gateway zeta-public-gateway \
                  -o jsonpath='{.status.addresses[0].value}') || ip=""
                hosts=$(kubectl -n zeta-platform get gateway zeta-public-gateway \
                  -o jsonpath='{range .spec.listeners[*]}{.hostname}{"\n"}{end}') || hosts=""
                hosts=$(printf '%s\n' "$hosts" | grep -E '^(gitlab|registry)\.' | sort -u)
                # Only a complete answer replaces the block; anything else keeps the previous one.
                if [ -n "$ip" ] && [ -n "$hosts" ]; then
                  printf '%s\n' "$hosts" | sed "s|^|$ip |; s|\$| # zeta-lan-hosts|" > $SHARED/block.tmp \
                    && mv $SHARED/block.tmp $SHARED/block
                fi
                # The relay Services, one per port: https-relay (:443 -> the edge) and ssh-relay (:22 -> the node's
                # sshd). Each lists every LoadBalancer address that does not already serve that port. An empty
                # listing means the probe failed or there is nothing to cover; only a NON-empty one is applied
                # (a failed probe must never strip the node's reachability).
                for spec in https-relay:443:https ssh-relay:22:ssh http-relay:80:http; do
                  svc=${spec%%:*}; rest=${spec#*:}; port=${rest%%:*}; pname=${rest#*:}
                  if ips=$(relay_ips "$port") && [ -n "$ips" ]; then
                    list=$(printf '%s\n' "$ips" | sed 's/.*/"&"/' | paste -sd, -)
                    {
                      printf '%s\n' 'apiVersion: v1' 'kind: Service' 'metadata:' "  name: $svc" \
                        '  namespace: zeta-node-hosts' '  labels: { app.kubernetes.io/part-of: node-lan-hosts }' \
                        'spec:' '  type: ClusterIP' '  selector: { app: node-lan-hosts }' "  externalIPs: [$list]" \
                        '  ports:' "    - { name: $pname, port: $port, targetPort: $port, protocol: TCP }"
                    } | kubectl apply --server-side --force-conflicts --field-manager=node-lan-hosts-relay -f - >/dev/null
                  fi
                done
                # The edge's inputs: for each API listener on the public Gateway, its certificate (cert + key as
                # one PEM, in memory only) and which namespace serves it. Listener -> namespace is the repo's
                # convention (k8s/public-tls: https-flowdent-api = production, -staging = staging). A failed read
                # of ANY of it keeps the previous set (unknown is not "remove"): certificates are renewed in place,
                # so a refetch picks the new one up and the edge reloads on the changed bytes.
                if rows=$(kubectl -n zeta-platform get gateway zeta-public-gateway \
                     -o jsonpath='{range .spec.listeners[*]}{.name}{"|"}{.hostname}{"|"}{.tls.certificateRefs[0].name}{"\n"}{end}') \
                   && [ -n "$rows" ]; then
                  mkdir -p "$SHARED/edge/pem.new"; : > "$SHARED/edge/upstreams.new"; edge_ok=1
                  printf '%s\n' "$rows" > "$SHARED/edge/rows"
                  while IFS='|' read -r lname lhost lsecret; do
                    case "$lname" in
                      https-flowdent-api) ns=flowdent-prod ;;
                      https-flowdent-api-staging) ns=flowdent-staging ;;
                      *) continue ;;
                    esac
                    [ -n "$lhost" ] && [ -n "$lsecret" ] || { edge_ok=""; break; }
                    crt=$(kubectl -n zeta-platform get secret "$lsecret" -o jsonpath='{.data.tls\.crt}') \
                      && key=$(kubectl -n zeta-platform get secret "$lsecret" -o jsonpath='{.data.tls\.key}') \
                      && [ -n "$crt" ] && [ -n "$key" ] || { edge_ok=""; break; }
                    { printf '%s' "$crt" | base64 -d; echo; printf '%s' "$key" | base64 -d; echo; } > "$SHARED/edge/pem.new/$lhost.pem"
                    printf '%s %s\n' "$lhost" "$ns" >> "$SHARED/edge/upstreams.new"
                  done < "$SHARED/edge/rows"
                  if [ -n "$edge_ok" ] && [ -s "$SHARED/edge/upstreams.new" ]; then
                    rm -rf "$SHARED/edge/pem"; mv "$SHARED/edge/pem.new" "$SHARED/edge/pem"
                    mv "$SHARED/edge/upstreams.new" "$SHARED/edge/upstreams"
                  else
                    rm -rf "$SHARED/edge/pem.new" "$SHARED/edge/upstreams.new"
                  fi
                fi
                [ -n "$ONCE" ] && exit 0
                sleep 30
              done
        - name: apply
          image: busybox:1.36
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            privileged: true
          volumeMounts:
            - { name: shared, mountPath: /shared }
          env:
            # Root of the host filesystem as seen from this pod. Overridden by the test.
            - { name: HOST, value: /proc/1/root }
          command: ["/bin/sh", "-c"]
          args:
            - |
              TAG='# zeta-lan-hosts'; SHARED="${SHARED:-/shared}"; W="${WORK:-/tmp}"
              STATE="$HOST/run/zeta-lan-hosts"
              # /etc/hosts on NixOS is an ABSOLUTE symlink into /etc/static, which would resolve against
              # THIS container's root through /proc/1/root -- so read it from inside the host mount ns.
              HREAD="${HREAD:-nsenter -t 1 -m -- /run/current-system/sw/bin/cat /etc/hosts}"
              # The node firewall (NixOS `nixos-fw`) has no rule for :443 -- MEASURED: the relay listened and
              # the LAN still got no answer. Assert it each tick (idempotent: -C first). Best-effort on
              # purpose: a host without that chain is not an error here, and the OS-layer fix is
              # networking.firewall.allowedTCPPorts = [ 443 ] on the next ISO.
              IPT="${IPT:-nsenter -t 1 -m -n -- /run/current-system/sw/bin/iptables}"
              while :; do
                $IPT -C nixos-fw -p tcp --dport 443 -j nixos-fw-accept 2>/dev/null                   || $IPT -I nixos-fw 1 -p tcp --dport 443 -j nixos-fw-accept 2>/dev/null || true
                $IPT -C nixos-fw -p tcp --dport 80 -j nixos-fw-accept 2>/dev/null                   || $IPT -I nixos-fw 1 -p tcp --dport 80 -j nixos-fw-accept 2>/dev/null || true
                # SSH is reachable from the internet (owner's request; key-only auth, passwords disabled). Damp
                # brute-force noise: at most 9 NEW connections per minute per NON-private source. Private sources are
                # exempt so scripted admin from the LAN is never throttled. Best-effort: a kernel without the
                # `recent` match just skips it.
                SSHM='-p tcp --dport 22 -m conntrack --ctstate NEW -m recent --name zssh'
                $IPT -C nixos-fw ! -s 192.168.0.0/16 $SSHM --update --seconds 60 --hitcount 10 -j DROP 2>/dev/null \
                  || { $IPT -I nixos-fw 1 ! -s 192.168.0.0/16 $SSHM --update --seconds 60 --hitcount 10 -j DROP \
                       && $IPT -I nixos-fw 1 ! -s 192.168.0.0/16 $SSHM --set; } 2>/dev/null || true
                if [ -s $SHARED/block ]; then
                  $HREAD > $W/cur || { [ -n "$ONCE" ] && exit 0; sleep 30; continue; }
                  grep -vF "$TAG" $W/cur > $W/base
                  # Never mount a hosts file that lost the base entries (localhost, control-plane...):
                  # a node without them cannot reach its own API server.
                  grep -q localhost $W/base || { [ -n "$ONCE" ] && exit 0; sleep 30; continue; }
                  cat $W/base $SHARED/block > $W/new
                  if grep -qF "$TAG" $W/cur; then
                    # Already mounted: rewrite the SAME inode only when the block changed.
                    cmp -s $W/new $W/cur || cat $W/new > "$STATE"
                  else
                    cat $W/new > "$STATE"
                    ${MOUNT:-nsenter -t 1 -m -- /run/current-system/sw/bin/mount} --bind /run/zeta-lan-hosts /etc/hosts
                  fi
                fi
                [ -n "$ONCE" ] && exit 0
                sleep 30
              done
        - name: edge
          image: docker.io/library/haproxy:3.0-alpine
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            # Binding :443 needs only this one capability. Root is required for it to be effective
            # (a non-root process gets no ambient capability from the pod spec); everything else is dropped.
            runAsUser: 0
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
          volumeMounts:
            - { name: shared, mountPath: /shared }
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Node :443 edge. SNI-routes each TLS connection:
              #   * the API hostnames  -> TLS is terminated HERE and the request is forwarded as HTTP with the
              #     REAL client address in X-Forwarded-For (the app rate-limits per client IP and trusts the
              #     nearest hop). A byte-for-byte relay cannot do this: it re-originates every connection from
              #     the node, so every outside client shares ONE rate-limit bucket (MEASURED on staging: after
              #     one client sent 100 requests, probes from 7 countries all got 429).
              #   * every other hostname -> TLS passthrough to the public Gateway, unchanged.
              # Certificates + upstreams are written by `discover` into the memory-backed /shared/edge.
              # The hop between the two frontends is a LOOPBACK TCP port, not an abstract unix socket: MEASURED,
              # a reload cannot re-bind abns@... while the old worker holds it ("cannot bind UNIX socket (already
              # in use)"), so every reload failed and the OLD config kept serving -- the edge silently stayed in
              # passthrough and the shared rate-limit bucket came back. TCP listeners reload via SO_REUSEPORT.
              # Only host-local processes can reach 127.0.0.1 (pods cannot); a PROXY header there could claim any
              # client address, which on a single-tenant node is an accepted, documented risk.
              SHARED="${SHARED:-/shared}"; W="${WORK:-/tmp}"; PORT="${EDGE_PORT:-443}"; HTTP_PORT="${EDGE_HTTP_PORT:-80}"; TERM_PORT="${EDGE_TERM_PORT:-18443}"
              HAPROXY="${HAPROXY:-haproxy}"; PIDF="$W/haproxy.pid"
              ran=""; sig=""
              gen() {
                gw="$1"
                cat <<EOF
              global
                maxconn 4000
              defaults
                log stdout format raw local0
                option dontlognull
                timeout connect 5s
                timeout client 120s
                timeout server 300s
                timeout http-request 30s
                timeout tunnel 1h
              frontend fe_edge
                mode tcp
                no log
                bind :$PORT
                tcp-request inspect-delay 5s
                tcp-request content accept if { req.ssl_hello_type 1 }
              EOF
                names=$(awk '{print $1}' "$SHARED/edge/upstreams" 2>/dev/null | paste -sd' ' -)
                [ -n "$names" ] && echo "  use_backend be_api if { req.ssl_sni -i $names }"
                cat <<EOF
                default_backend be_gateway
              backend be_gateway
                mode tcp
                server gw $gw:443
              frontend fe_http
                mode http
                no log
                bind :$HTTP_PORT
                http-request redirect scheme https code 301
              EOF
                if [ -n "$names" ]; then
                  cat <<EOF
              backend be_api
                mode tcp
                server term 127.0.0.1:$TERM_PORT send-proxy-v2
              frontend fe_term
                mode http
                option httplog
                option dontlog-normal
                bind 127.0.0.1:$TERM_PORT accept-proxy ssl crt $SHARED/edge/pem alpn h2,http/1.1
                http-request del-header X-Forwarded-For
                option forwardfor
                http-request set-header X-Forwarded-Proto https
              EOF
                  i=0
                  while read -r host ns; do
                    i=$((i + 1))
                    echo "  use_backend app_$i if { ssl_fc_sni -i $host }"
                  done < "$SHARED/edge/upstreams"
                  i=0
                  while read -r host ns; do
                    i=$((i + 1))
                    printf 'backend app_%s\n  mode http\n  server a flowdent-api.%s.svc.cluster.local:80\n' "$i" "$ns"
                  done < "$SHARED/edge/upstreams"
                fi
              }
              while :; do
                gw=$(cut -d' ' -f1 "$SHARED/block" 2>/dev/null | head -1)
                if [ -n "$gw" ]; then
                  gen "$gw" > "$W/haproxy.cfg.new"
                  # Reload only when the config OR any certificate changed (renewals land here).
                  now=$( { cat "$W/haproxy.cfg.new"; cat "$SHARED"/edge/pem/*.pem 2>/dev/null; } | cksum)
                  if [ "$now" != "$sig" ]; then
                    if "$HAPROXY" -c -q -f "$W/haproxy.cfg.new"; then
                      mv "$W/haproxy.cfg.new" "$W/haproxy.cfg"
                      if [ -z "$ran" ]; then
                        "$HAPROXY" -W -f "$W/haproxy.cfg" -p "$PIDF" &
                        ran=$!
                      else
                        kill -USR2 "$ran" 2>/dev/null
                      fi
                      sig="$now"
                    else
                      echo "edge: refusing an invalid haproxy config; keeping the running one" >&2
                    fi
                  fi
                fi
                # A dead proxy (bind failed, crashed) must fail the container, not sit silently.
                [ -n "$ran" ] && ! kill -0 "$ran" 2>/dev/null && exit 1
                [ -n "$ONCE" ] && exit 0
                sleep 10
              done
---
# Read every Service's LoadBalancer address + ports (cluster-wide, read-only), to find which addresses
# do not serve :443 yet.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-lan-hosts-list-services
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-lan-hosts-list-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-lan-hosts-list-services
subjects:
  - kind: ServiceAccount
    name: node-lan-hosts
    namespace: zeta-node-hosts
---
# Write ONLY the one relay Service, in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-lan-hosts-relay-service
  namespace: zeta-node-hosts
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["https-relay", "ssh-relay", "http-relay"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-lan-hosts-relay-service
  namespace: zeta-node-hosts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-lan-hosts-relay-service
subjects:
  - kind: ServiceAccount
    name: node-lan-hosts
    namespace: zeta-node-hosts
---
# The edge terminates TLS for the API hostnames, so `discover` reads exactly those two certificate Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-lan-hosts-read-api-certs
  namespace: zeta-platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["flowdent-api-tls", "flowdent-api-staging-tls"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-lan-hosts-read-api-certs
  namespace: zeta-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-lan-hosts-read-api-certs
subjects:
  - kind: ServiceAccount
    name: node-lan-hosts
    namespace: zeta-node-hosts
