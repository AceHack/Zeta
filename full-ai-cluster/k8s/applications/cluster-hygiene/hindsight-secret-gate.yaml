# hindsight-secret-gate -- no Secret, no pods; Secret appears, pods come back.
#
# WHY. hindsight is a `converges-only-after-an-operator-action` app (081M3BKQFNC): its api and
# control-plane Deployments read `envFrom: secretRef: hindsight-llm-api-key`, a REAL third-party LLM key
# this cluster cannot mint for itself (full-ai-cluster/INJECTION-POINTS.md). The chart (0.9.2) offers no
# `optional: true`, so with the Secret absent every pod is held in CreateContainerConfigError -- and
# under node DiskPressure the kubelet evicts them, the Deployment replaces them, and 168 `Failed` pod
# objects accumulated in one evening (MEASURED 2026-10-02, docs/ops/NODE-DISK-HEADROOM.md).
#
# WHAT IT DOES, once every 2 minutes:
#   Secret ABSENT   -> `kubectl scale` both Deployments to 0   (no pod can fail to start)
#   Secret PRESENT  -> `kubectl scale` both Deployments to their DECLARED replica count
# The declared counts are the DESIRED env below and are pinned equal to the hindsight Application's own
# `api.replicaCount` / `controlPlane.replicaCount` by cluster-hygiene.test.ts, so "behaviour once the
# Secret exists" is unchanged by construction. The hindsight Application ignores `/spec/replicas` on
# exactly these two Deployments (ignoreDifferences + RespectIgnoreDifferences), so ArgoCD does not fight
# the gate -- and its render still declares 1 replica each, so the resource ledgers stay honest.
#
# WHAT IT DOES NOT DO. It never creates, reads or prints the Secret's value: the probe is
# `get secret --ignore-not-found -o name`, and the RBAC is `get` on that ONE name. It does not paper over
# the missing key with a placeholder. And a FAILED PROBE IS `unknown`, never `absent`: the script acts on
# a definite answer only (an API blip must not scale a running hindsight to zero).
#
# FIRST SYNC. The Deployments are created at their declared replicas by hindsight's own sync, so for up
# to one gate interval a fresh install has them at 1 with no Secret; the gate then takes them to 0 and
# the pods are DELETED (not Failed). That bounded window is the price of not rendering replicas: 0.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hindsight-secret-gate
  namespace: zeta-hygiene
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zeta-hindsight-secret-gate
rules:
  # resourceNames-scoped: a ClusterRole is the only way to reach the `hindsight` namespace, which the
  # hindsight Application itself creates (a Role here would fail the first sync on a missing namespace).
  # The names are specific, so this cannot reach another namespace's differently-named objects.
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [hindsight-api, hindsight-control-plane]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [hindsight-api, hindsight-control-plane]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hindsight-llm-api-key]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zeta-hindsight-secret-gate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zeta-hindsight-secret-gate
subjects:
  - kind: ServiceAccount
    name: hindsight-secret-gate
    namespace: zeta-hygiene
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hindsight-secret-gate
  namespace: zeta-hygiene
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 90
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: hindsight-secret-gate
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: tmp
              emptyDir: { sizeLimit: 32Mi }
          containers:
            - name: gate
              # bash + kubectl: see pod-janitor.yaml for why this image.
              image: registry.gitlab.com/gitlab-org/build/cng/kubectl:v17.7.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              env:
                - { name: HOME, value: /tmp }
                - { name: GATE_NAMESPACE, value: hindsight }
                - { name: GATE_SECRET, value: hindsight-llm-api-key }
                # `<deployment>=<replicas when the Secret exists>`. Pinned equal to the hindsight
                # Application's api.replicaCount / controlPlane.replicaCount (cluster-hygiene.test.ts).
                - { name: GATE_DESIRED, value: "hindsight-api=1 hindsight-control-plane=1" }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 10m, memory: 32Mi, ephemeral-storage: 16Mi }
                limits: { memory: 128Mi, ephemeral-storage: 64Mi }
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -uo pipefail
                  # PROBE. `--ignore-not-found` makes "absent" an exit-0 empty answer, so a non-zero exit
                  # here is an API/RBAC failure -- UNKNOWN -- and nothing is changed on it.
                  if ! found=$(kubectl -n "$GATE_NAMESPACE" get secret "$GATE_SECRET" --ignore-not-found -o name 2>/tmp/probe.err); then
                    echo "hindsight-secret-gate: UNKNOWN (could not read Secret $GATE_SECRET): $(head -c 300 /tmp/probe.err); leaving replicas as they are"
                    exit 0
                  fi
                  if [ -n "$found" ]; then
                    echo "hindsight-secret-gate: Secret $GATE_SECRET present; Deployments held at their declared replicas"
                    present=1
                  else
                    echo "hindsight-secret-gate: Secret $GATE_SECRET absent; Deployments held at 0 (operator step: INJECTION-POINTS.md)"
                    present=0
                  fi
                  rc=0
                  for pair in $GATE_DESIRED; do
                    name=${pair%%=*}
                    want=${pair##*=}
                    [ "$present" = 1 ] || want=0
                    # Not created yet (hindsight has not synced): nothing to hold.
                    if ! cur=$(kubectl -n "$GATE_NAMESPACE" get deployment "$name" --ignore-not-found -o 'jsonpath={.spec.replicas}' 2>/tmp/get.err); then
                      echo "hindsight-secret-gate: UNKNOWN (could not read Deployment $name): $(head -c 300 /tmp/get.err)"
                      rc=1
                      continue
                    fi
                    [ -n "$cur" ] || { echo "hindsight-secret-gate: Deployment $name not present; skipping"; continue; }
                    if [ "$cur" = "$want" ]; then
                      echo "hindsight-secret-gate: $name already at $want"
                      continue
                    fi
                    if kubectl -n "$GATE_NAMESPACE" scale deployment "$name" --replicas="$want"; then
                      echo "hindsight-secret-gate: $name $cur -> $want"
                    else
                      echo "hindsight-secret-gate: scaling $name to $want FAILED"
                      rc=1
                    fi
                  done
                  exit "$rc"
