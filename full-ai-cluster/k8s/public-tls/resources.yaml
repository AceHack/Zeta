# full-ai-cluster/k8s/public-tls/resources.yaml — the kustomize BASE of the
# `platform-public-tls` Application (081M3JG74G0087G0R001XJC837).
#
# THIS FILE CARRIES NO EMAIL AND NO HOSTNAME, ON PURPOSE. Both are install-time
# configuration: they reach these objects ONLY as the inline JSON6902 patches of
# the Application that nixos/modules/injected-public-tls.nix renders from
# argocd-application.yaml.in, and that Application exists only when the operator
# supplied both values. Nothing here is applied on an install without them —
# this directory is outside k8s/applications/, so the app-of-apps root never
# reaches it.
#
# Why a SEPARATE Application: on a real node, ACME issuers carrying
# `you@example.com` sat in the `platform` Application's wave -1 and ArgoCD waited
# on their health forever, so nothing after them was applied. A Certificate
# cannot issue until DNS points at the cluster and :80/:443 reach it — which the
# installer cannot arrange — so ACME must never share an Application (or a sync
# wave) with anything that has to come up regardless. No object below carries a
# sync-wave annotation, so issuer health cannot gate the Gateway either.
#
# HTTP-01 through the public Gateway's :80 listener: no DNS API, no Cloudflare —
# only that `portal.<domain>` resolves to the forwarded public IP and 80/443 are
# forwarded to this Gateway's LoadBalancer address (INJECTION-POINTS.md §10).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Untrusted certs, very high rate limits — for proving the challenge
    # round-trips without spending the prod quota.
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: zeta-public-gateway
                namespace: zeta-platform
                kind: Gateway
                group: gateway.networking.k8s.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: zeta-public-gateway
                namespace: zeta-platform
                kind: Gateway
                group: gateway.networking.k8s.io
---
# The PUBLIC Gateway — separate from the LAN `zeta-gateway` owned by `platform`,
# so the platform's own ingress never depends on a public name or a certificate.
# Cilium gives it its own LoadBalancer address from the cilium-lb-ipam pool; THAT
# is the address the router forwards 80 + 443 to.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zeta-public-gateway
  namespace: zeta-platform
  annotations:
    # cert-manager's gateway-shim reads the HTTPS listener's hostname and issues
    # `portal-tls` for it. letsencrypt-staging exists for a manual dry run.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  listeners:
    # :80 — serves the ACME HTTP-01 challenge (cert-manager attaches a temporary
    # HTTPRoute here during issuance).
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: All }
    # :443 — TLS terminated here. Index 1: the Application's patch adds the
    # listener's portal.<domain> at /spec/listeners/1/hostname.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: portal-tls }
      allowedRoutes:
        namespaces: { from: All }
---
# The public portal route. `hostnames` is added by the Application's patch.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal-public
  namespace: zeta-platform
spec:
  parentRefs:
    - { name: zeta-public-gateway, namespace: zeta-platform }
  rules:
    - backendRefs:
        - { name: portal, port: 80 }
