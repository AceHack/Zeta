# full-ai-cluster/k8s/public-tls/resources.yaml — the kustomize BASE of the
# `platform-public-tls` Application (081M3JG74G0087G0R001XJC837).
#
# THIS FILE CARRIES NO EMAIL AND NO HOSTNAME, ON PURPOSE. Both are install-time
# configuration: they reach these objects ONLY as the inline JSON6902 patches of
# the Application that nixos/modules/injected-public-tls.nix renders from
# argocd-application.yaml.in, and that Application exists only when the operator
# supplied both values. Nothing here is applied on an install without them —
# this directory is outside k8s/applications/, so the app-of-apps root never
# reaches it.
#
# Why a SEPARATE Application: on a real node, ACME issuers carrying
# `you@example.com` sat in the `platform` Application's wave -1 and ArgoCD waited
# on their health forever, so nothing after them was applied. A Certificate
# cannot issue until DNS points at the cluster and :80/:443 reach it — which the
# installer cannot arrange — so ACME must never share an Application (or a sync
# wave) with anything that has to come up regardless. No object below carries a
# sync-wave annotation, so issuer health cannot gate the Gateway either.
#
# HTTP-01 through the public Gateway's :80 listener: no DNS API, no Cloudflare —
# only that `portal.<domain>` resolves to the forwarded public IP and 80/443 are
# forwarded to this Gateway's LoadBalancer address (INJECTION-POINTS.md §10).
# GitLab is published here too, as `gitlab.<domain>` and `registry.<domain>`: each
# needs its own DNS record to the same address, and each has its own listener and
# certificate, so a missing record costs only that name.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Untrusted certs, very high rate limits — for proving the challenge
    # round-trips without spending the prod quota.
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: zeta-public-gateway
                namespace: zeta-platform
                kind: Gateway
                group: gateway.networking.k8s.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: zeta-public-gateway
                namespace: zeta-platform
                kind: Gateway
                group: gateway.networking.k8s.io
---
# The PUBLIC Gateway — separate from the LAN `zeta-gateway` owned by `platform`,
# so the platform's own ingress never depends on a public name or a certificate.
# Cilium gives it its own LoadBalancer address from the cilium-lb-ipam pool; THAT
# is the address the router forwards 80 + 443 to.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zeta-public-gateway
  namespace: zeta-platform
  annotations:
    # cert-manager's gateway-shim reads the HTTPS listener's hostname and issues
    # `portal-tls` for it. letsencrypt-staging exists for a manual dry run.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  listeners:
    # :80 — serves the ACME HTTP-01 challenge (cert-manager attaches a temporary
    # HTTPRoute here during issuance).
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: All }
    # :443 — TLS terminated here. Index 1: the Application's patch adds the
    # listener's portal.<domain> at /spec/listeners/1/hostname.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: portal-tls }
      allowedRoutes:
        namespaces: { from: All }
    # :443 for GitLab — one listener PER public name, each with its OWN certificate, so a
    # GitLab name that has not issued (no DNS record yet, say) can never hold the portal's
    # certificate hostage, and vice versa. Index 2 gets gitlab.<domain>, index 3
    # registry.<domain> (/spec/listeners/N/hostname, the Application's patches).
    - name: https-gitlab
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: gitlab-tls }
      allowedRoutes:
        namespaces: { from: All }
    - name: https-registry
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: gitlab-registry-tls }
      allowedRoutes:
        namespaces: { from: All }
    # :443 for Forgejo, index 4 -> git.<domain>. Same rule: its own certificate, so Forgejo's name
    # not having a DNS record yet cannot hold any other name's certificate hostage.
    - name: https-forgejo
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: forgejo-tls }
      allowedRoutes:
        namespaces: { from: All }
---
# The public portal route. `hostnames` is added by the Application's patch.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal-public
  namespace: zeta-platform
spec:
  parentRefs:
    - { name: zeta-public-gateway, namespace: zeta-platform }
  rules:
    - backendRefs:
        - { name: portal, port: 80 }
# ═════════════════════════════ GitLab, published ═════════════════════════════
# The routes live in namespace `gitlab`, next to the Services they point at, so no
# ReferenceGrant is needed; the public Gateway admits routes from All namespaces.
# `hostnames` of each is added by the Application's patch. Nothing in the `gitlab`
# Application waits on any of this: when no public domain is configured none of it
# exists, and GitLab is served on the LAN by its own `gitlab-lan` Gateway.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab-public
  namespace: gitlab
spec:
  parentRefs:
    - { name: zeta-public-gateway, namespace: zeta-platform }
  rules:
    - backendRefs:
        - { name: gitlab-webservice-default, port: 8181 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab-registry-public
  namespace: gitlab
spec:
  parentRefs:
    - { name: zeta-public-gateway, namespace: zeta-platform }
  rules:
    - backendRefs:
        - { name: gitlab-registry, port: 5000 }
# GitLab's EXTERNAL URL for this install. The gitlab Application is git-owned by
# `zeta-root` and its valuesObject carries the LAN default; the public names can only be
# known here, where the domain is. So this Job merge-patches that Application's
# `spec.source.helm.parameters` (helm parameters override valuesObject) with the content of
# ConfigMap `gitlab-public-hosts`, whose `patch.json` is added by the Application's patch.
# bootstrap/root-application.yaml ignores exactly that one field (`ignoreDifferences` +
# `RespectIgnoreDifferences=true`), so root's selfHeal neither reverts nor fights it.
# Same shell-less kubectl image and posture as bootstrap/internal-secret-seeding.yaml; the
# only write it can make is `patch` on Application `gitlab`.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-public-hosts
  namespace: zeta-platform
data: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-public-hosts
  namespace: zeta-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-public-hosts
  namespace: argocd
rules:
  # `kubectl wait --for=create` lists+watches; the only WRITE is the next rule.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["gitlab"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-public-hosts
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-public-hosts
subjects:
  - kind: ServiceAccount
    name: gitlab-public-hosts
    namespace: zeta-platform
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-public-hosts
  namespace: zeta-platform
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: gitlab-public-hosts
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: kubecache
          emptyDir: {}
        - name: patch
          configMap: { name: gitlab-public-hosts }
      initContainers:
        # The gitlab Application is created by zeta-root at its own sync wave, which can
        # be long after this Application first syncs on a fresh node.
        - name: wait-for-gitlab-application
          image: docker.io/rancher/kubectl:v1.35.6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: HOME, value: /tmp/kubecache }
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
          command: ["/bin/kubectl"]
          args: ["wait", "--for=create", "applications.argoproj.io/gitlab", "-n", "argocd", "--timeout=24h"]
      containers:
        - name: patch
          image: docker.io/rancher/kubectl:v1.35.6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: HOME, value: /tmp/kubecache }
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
            - { name: patch, mountPath: /patch, readOnly: true }
          command: ["/bin/kubectl"]
          args: ["patch", "applications.argoproj.io", "gitlab", "-n", "argocd", "--type", "merge", "--patch-file", "/patch/patch.json"]
# ═════════════════════════════ Forgejo, published ═════════════════════════════
# docs/ops/INSTALL-TIME-CONFIG.md row 28. Forgejo's chart default renders DOMAIN / ROOT_URL /
# SSH_DOMAIN = git.example.com (measured, chart 17.1.5); applications/forgejo/Application.yaml now
# carries its in-cluster URL, and with a public domain THIS publishes git.<domain> the way GitLab is
# published above: its own listener (index 4) and certificate, a route in namespace `forgejo` next to
# the Service it points at (so no ReferenceGrant), and a Job that merge-patches the forgejo
# Application's helm parameters with the content of ConfigMap `forgejo-public-hosts`. Nothing in the
# `forgejo` Application waits on any of it, and with no public domain none of it exists.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo-public
  namespace: forgejo
spec:
  parentRefs:
    - { name: zeta-public-gateway, namespace: zeta-platform }
  rules:
    - backendRefs:
        - { name: forgejo-http, port: 3000 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-public-hosts
  namespace: zeta-platform
data: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-public-hosts
  namespace: zeta-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-public-hosts
  namespace: argocd
rules:
  # `kubectl wait --for=create` lists+watches; the only WRITE is the next rule.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["forgejo"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-public-hosts
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-public-hosts
subjects:
  - kind: ServiceAccount
    name: forgejo-public-hosts
    namespace: zeta-platform
---
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-public-hosts
  namespace: zeta-platform
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: forgejo-public-hosts
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: kubecache
          emptyDir: {}
        - name: patch
          configMap: { name: forgejo-public-hosts }
      initContainers:
        # The forgejo Application is created by zeta-root at its own sync wave, which can
        # be long after this Application first syncs on a fresh node.
        - name: wait-for-forgejo-application
          image: docker.io/rancher/kubectl:v1.35.6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: HOME, value: /tmp/kubecache }
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
          command: ["/bin/kubectl"]
          args: ["wait", "--for=create", "applications.argoproj.io/forgejo", "-n", "argocd", "--timeout=24h"]
      containers:
        - name: patch
          image: docker.io/rancher/kubectl:v1.35.6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: HOME, value: /tmp/kubecache }
          volumeMounts:
            - { name: kubecache, mountPath: /tmp/kubecache }
            - { name: patch, mountPath: /patch, readOnly: true }
          command: ["/bin/kubectl"]
          args: ["patch", "applications.argoproj.io", "forgejo", "-n", "argocd", "--type", "merge", "--patch-file", "/patch/patch.json"]
