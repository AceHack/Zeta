apiVersion: admission.k8s.io/v1
kind: AdmissionReview
request:
  uid: promote-warmup-to-active-early
  kind: {group: society.zeta.io, version: v1alpha1, kind: HatBinding}
  resource: {group: society.zeta.io, version: v1alpha1, resource: hatbindings}
  name: alice-executor
  namespace: hat-system
  operation: UPDATE
  userInfo: {username: gator-suite}
  object:
    apiVersion: society.zeta.io/v1alpha1
    kind: HatBinding
    metadata: {name: alice-executor, namespace: hat-system}
    spec:
      hat: executor
      wearer: {spiffeID: "spiffe://zeta.local/agent/alice"}
    status: {phase: Active, warmupEndsAt: "{{now+600s}}"}
  oldObject:
    apiVersion: society.zeta.io/v1alpha1
    kind: HatBinding
    metadata: {name: alice-executor, namespace: hat-system}
    spec:
      hat: executor
      wearer: {spiffeID: "spiffe://zeta.local/agent/alice"}
    status: {phase: Warmup, warmupEndsAt: "{{now+600s}}"}
