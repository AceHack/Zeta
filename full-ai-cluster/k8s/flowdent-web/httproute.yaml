# flowdent.net and www.flowdent.net attach to their OWN listeners of zeta-public-gateway
# (k8s/public-tls: https-flowdent-web, https-flowdent-web-www), each with its own certificate -- the
# same one-listener-per-name rule as every other public name. The :80 route only redirects; Cloudflare
# (proxied) reaches the origin on :443.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flowdent-web
  namespace: flowdent-web
  labels: { app.kubernetes.io/name: flowdent-web, app.kubernetes.io/part-of: flowdent }
spec:
  hostnames: [flowdent.net]
  parentRefs:
    - { name: zeta-public-gateway, namespace: zeta-platform, sectionName: https-flowdent-web }
  rules:
    - backendRefs:
        - { name: flowdent-web, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flowdent-web-www
  namespace: flowdent-web
  labels: { app.kubernetes.io/name: flowdent-web, app.kubernetes.io/part-of: flowdent }
spec:
  hostnames: [www.flowdent.net]
  parentRefs:
    - { name: zeta-public-gateway, namespace: zeta-platform, sectionName: https-flowdent-web-www }
  rules:
    - backendRefs:
        - { name: flowdent-web, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flowdent-web-redirect
  namespace: flowdent-web
  labels: { app.kubernetes.io/name: flowdent-web, app.kubernetes.io/part-of: flowdent }
spec:
  hostnames: [flowdent.net, www.flowdent.net]
  parentRefs:
    - { name: zeta-public-gateway, namespace: zeta-platform, sectionName: http }
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
