# full-ai-cluster/dev-cluster/profiles/ci.k3d-config.yaml
#
# Single-node k3d profile for 081KSXN940008QG0R000SCP2H1 GitOps health checks on CI runners.
# It keeps the same Cilium takeover stance and ArgoCD App-of-Apps substrate as
# the local three-node dev profile, but drops agents, registry, host port
# forwards, extra Cilium operator replicas, and Hubble relay/UI so the smoke
# run has fewer moving parts and no impossible single-node scheduling targets.

apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: zeta-ci

servers: 1
agents: 0

# ALIGNED 2026-09-22 (081M33RP3JV087G0R003JBGPKC) to k8s/kubernetes-version.json's
# declared k3sVersion, same reasoning as the sibling dev-cluster/k3d-config.yaml:
# this lane exists to exercise the same GitOps substrate as metal, and a
# minor-version-ahead k3s here cannot report a metal-only regression.
image: rancher/k3s:v1.35.7-k3s1

network: zeta-ci

# Metal k3s-server.nix maps control-plane -> 127.0.0.1 on the founder and
# SANs the API cert for that name. Cilium's Application is
# k8sServiceHost: control-plane. k3d skipped both. agents: 0, so the
# founder mapping is true on every node this profile creates. The local
# three-node profile must NOT copy this hostAliases (agents would resolve
# the API to themselves).
hostAliases:
  - ip: 127.0.0.1
    hostnames:
      - control-plane

options:
  k3d:
    # Cilium is installed by bring-up immediately after cluster creation. Do not
    # wait for node Ready before the CNI exists. bringUpK3dDevCluster waits
    # after Cilium helm, the same way kind --cni cilium does.
    wait: false
  k3s:
    extraArgs:
      - arg: --cluster-init
        nodeFilters: [server:*]
      # Metal k3s-server.nix. Without this SAN, Cilium dialling
      # k8sServiceHost: control-plane fails TLS even if /etc/hosts resolves.
      - arg: --tls-san=control-plane
        nodeFilters: [server:*]
      - arg: --flannel-backend=none
        nodeFilters: [server:*]
      - arg: --disable-kube-proxy
        nodeFilters: [server:*]
      - arg: --disable-network-policy
        nodeFilters: [server:*]
      # Metal k3s-server.nix disables servicelb so Cilium owns L4.
      # k3d skipped it. MEASURED live-k3d 33800779819: klipper
      # svclb-cilium-ingress 2/2 Running while hostNetwork ClusterIP
      # TCP FAIL and overlay pod IPs OPEN. kind+Cilium has no klipper
      # and the four are Healthy on the same helm values.
      - arg: --disable=servicelb
        nodeFilters: [server:*]
      - arg: --disable=traefik
        nodeFilters: [server:*]
      - arg: --node-label=zeta.io/env=ci
        nodeFilters: [all]
      - arg: --node-label=zeta.io/substrate=k3d
        nodeFilters: [all]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
