<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Red State — Zeta</title>
<!--
  Red State — the drill-down map of everything currently red.

  Aaron 2026-08-10: "humans can't stand seeing red … show broad categories and let
  you zoom in more and more specific so you can drill down on the red to the exact
  failures and learn from them too and have all the right context … like zooming a
  map in a game in and out based on geospatial boundary indicators."

  GIT IS THE BACKEND. This page is a pure function of `red-state.json`, which is a
  committed text file regenerated by `collect-red-state.ts`. No server, no API key,
  no database. Every change in the red state is a readable diff, and the file's git
  history IS the event log — which is why the page can be static and still current.

  Four zoom levels, each a boundary you cross rather than a page you load:
    L0 territories -> L1 regions -> L2 findings -> L3 detail
  Region area is proportional to enclosed severity weight, so a territory holding
  one false theorem does not look like one holding a cosmetic nit. That is the
  "boundary indicator": size means how much red is inside, before you read a word.
-->
<style>
  /* Palette: ink-on-parchment by day, deep slate by night. The reds are
     desaturated on purpose — an alarm that shouts at every severity teaches
     people to stop reading it, which is the failure this page exists to avoid. */
  :root {
    --bg: #f7f5f0;
    --panel: #fffefb;
    --edge: #e2ddd2;
    --ink: #1c1a17;
    --muted: #6d675c;
    --accent: #1f5f5b;
    --sev-unsound: #a3282b;
    --sev-failing: #c0562a;
    --sev-drift: #b8892b;
    --sev-gap: #6b7f4a;
    --sev-open: #5a6b7a;
    --ok-fixed: #2f6b46;
    --shadow: 0 1px 2px rgba(28, 26, 23, .06), 0 8px 24px rgba(28, 26, 23, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171a;
      --panel: #1b1f23;
      --edge: #2c333a;
      --ink: #e8e6e1;
      --muted: #98a1ab;
      --accent: #6fd6c9;
      --sev-unsound: #e2686b;
      --sev-failing: #e88c5a;
      --sev-drift: #d9b45e;
      --sev-gap: #9db877;
      --sev-open: #8fa4b8;
      --ok-fixed: #7fc79b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171a; --panel: #1b1f23; --edge: #2c333a; --ink: #e8e6e1;
    --muted: #98a1ab; --accent: #6fd6c9; --sev-unsound: #e2686b;
    --sev-failing: #e88c5a; --sev-drift: #d9b45e; --sev-gap: #9db877;
    --sev-open: #8fa4b8; --ok-fixed: #7fc79b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 2.2rem 1.25rem 5rem; }

  header h1 {
    margin: 0 0 .3rem; font-size: clamp(1.6rem, 3.4vw, 2.3rem);
    letter-spacing: -.02em; text-wrap: balance;
  }
  .sub { color: var(--muted); margin: 0 0 1.4rem; font-size: .95rem; }
  .sub code { font-size: .88em; }

  /* Breadcrumb = the zoom stack. Clicking a crumb zooms back out. */
  nav.crumbs { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-bottom: 1.1rem; }
  nav.crumbs button {
    font: inherit; font-size: .9rem; cursor: pointer; color: var(--accent);
    background: none; border: 0; padding: .15rem .1rem; border-radius: 4px;
  }
  nav.crumbs button:hover { text-decoration: underline; }
  nav.crumbs span { color: var(--muted); font-size: .9rem; }

  .summary { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
  .chip {
    display: inline-flex; align-items: baseline; gap: .4rem;
    padding: .3rem .7rem; border-radius: 999px; border: 1px solid var(--edge);
    background: var(--panel); font-size: .85rem; font-variant-numeric: tabular-nums;
  }
  .chip b { font-size: 1rem; }
  .dot { width: .6rem; height: .6rem; border-radius: 50%; display: inline-block; }

  .grid { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

  .card {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
    padding: 1rem 1.05rem; box-shadow: var(--shadow); cursor: pointer;
    text-align: left; font: inherit; color: inherit; width: 100%;
    position: relative; overflow: hidden;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card h3 { margin: 0 0 .3rem; font-size: 1.05rem; letter-spacing: -.01em; }
  .card p { margin: 0; color: var(--muted); font-size: .9rem; }

  /* The boundary indicator: a bar whose width is the share of total red weight. */
  .weightbar { height: 4px; background: var(--edge); border-radius: 2px; margin-top: .8rem; overflow: hidden; }
  .weightbar > i { display: block; height: 100%; border-radius: 2px; }

  .sevrow { display: flex; gap: .35rem; margin-top: .65rem; flex-wrap: wrap; }
  .sevtag {
    font-size: .74rem; letter-spacing: .04em; text-transform: uppercase;
    padding: .12rem .45rem; border-radius: 4px; color: #fff; font-weight: 600;
  }

  .finding { border-left: 3px solid var(--edge); padding-left: .9rem; margin-bottom: .5rem; }
  .locus {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .84rem;
    color: var(--muted); word-break: break-all;
  }
  .detail { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 1.2rem 1.3rem; box-shadow: var(--shadow); }
  .detail h2 { margin: 0 0 .2rem; font-size: 1.3rem; letter-spacing: -.015em; }
  .detail h4 { margin: 1.3rem 0 .4rem; font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .detail ul { margin: 0; padding-left: 1.1rem; }
  .detail li { margin-bottom: .3rem; }
  .evidence { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
  .why { border-left: 3px solid var(--accent); padding-left: .9rem; margin: 0; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .empty .big { font-size: 2.6rem; margin-bottom: .4rem; color: var(--ok-fixed); }

  footer { margin-top: 3rem; color: var(--muted); font-size: .82rem; border-top: 1px solid var(--edge); padding-top: 1rem; }
  a { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Red State</h1>
    <p class="sub">
      Every red signal in one map. Zoom out for the shape, zoom in for the exact
      failure and why it matters. Backed by <code>red-state.json</code> in the repo —
      git is the database, so this page is a readable diff away from the truth.
    </p>
  </header>

  <nav class="crumbs" id="crumbs" aria-label="Zoom level"></nav>
  <div class="summary" id="summary"></div>
  <main id="view"></main>

  <footer id="foot"></footer>
</div>

<script>
"use strict";

const SEV_COLOR = {
  unsound: "var(--sev-unsound)", failing: "var(--sev-failing)",
  drift: "var(--sev-drift)", gap: "var(--sev-gap)", open: "var(--sev-open)",
};
const SEV_WEIGHT = { unsound: 100, failing: 40, drift: 20, gap: 10, open: 4 };
const SEV_ORDER = ["unsound", "failing", "drift", "gap", "open"];

/** What each severity MEANS. The page is meant to teach, not just alarm. */
const SEV_MEANING = {
  unsound: "A proof admits a falsehood. Anything depending on it is unsound.",
  failing: "A workflow on main is red. Drift the fleet heals after the fact.",
  drift: "A claim and the code disagree. Neither is necessarily wrong yet.",
  gap: "Something real is outside every check. Absence of signal, not a failure.",
  open: "Honest, declared incompleteness. Tracked, not hidden.",
};

let STATE = null;
let path = []; // [territoryId, regionId, findingId] — the zoom stack

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const weightOf = (fs) => fs.reduce((a, f) => a + (SEV_WEIGHT[f.severity] || 1), 0);
const regionFindings = (r) => r.findings || [];
const territoryFindings = (t) => (t.regions || []).flatMap(regionFindings);

function sevTags(findings) {
  const counts = {};
  for (const f of findings) counts[f.severity] = (counts[f.severity] || 0) + 1;
  return SEV_ORDER.filter((s) => counts[s])
    .map((s) => `<span class="sevtag" style="background:${SEV_COLOR[s]}">${counts[s]} ${s}</span>`)
    .join("");
}

/** The boundary indicator — width is this node's share of all red weight. */
function weightBar(findings, total) {
  const w = weightOf(findings);
  const pct = total > 0 ? Math.max(2, Math.round((w / total) * 100)) : 0;
  const worst = SEV_ORDER.find((s) => findings.some((f) => f.severity === s)) || "open";
  return `<div class="weightbar" title="${w} of ${total} severity weight">
            <i style="width:${pct}%;background:${SEV_COLOR[worst]}"></i></div>`;
}

function render() {
  if (!STATE) return;
  const all = STATE.territories.flatMap(territoryFindings);
  const total = weightOf(all);

  // ── breadcrumbs ────────────────────────────────────────────────────────────
  const t = STATE.territories.find((x) => x.id === path[0]);
  const r = t && (t.regions || []).find((x) => x.id === path[1]);
  const f = r && regionFindings(r).find((x) => x.id === path[2]);
  const crumbs = [`<button data-depth="0">All territories</button>`];
  if (t) crumbs.push(`<span>/</span><button data-depth="1">${esc(t.name)}</button>`);
  if (r) crumbs.push(`<span>/</span><button data-depth="2">${esc(r.name)}</button>`);
  if (f) crumbs.push(`<span>/</span><span>${esc(f.title)}</span>`);
  $("crumbs").innerHTML = crumbs.join("");

  // ── summary chips (always the GLOBAL totals, so zoom never hides the whole) ─
  const counts = STATE.totals.bySeverity || {};
  $("summary").innerHTML = all.length === 0
    ? `<span class="chip"><span class="dot" style="background:var(--ok-fixed)"></span> nothing red</span>`
    : SEV_ORDER.filter((s) => counts[s]).map((s) =>
        `<span class="chip" title="${esc(SEV_MEANING[s])}">
           <span class="dot" style="background:${SEV_COLOR[s]}"></span>
           <b>${counts[s]}</b> ${s}</span>`).join("");

  // ── the view at the current zoom ───────────────────────────────────────────
  const view = $("view");
  if (all.length === 0) {
    view.innerHTML = `<div class="empty"><div class="big">&#10003;</div>
      <p>No red anywhere the collectors can see.</p>
      <p style="font-size:.85rem">That is the absence of a signal, not proof of health —
      only what is collected can be shown.</p></div>`;
    return;
  }

  if (!t) {
    view.innerHTML = `<div class="grid">` + STATE.territories.map((x) => {
      const fs = territoryFindings(x);
      return `<button class="card" data-t="${esc(x.id)}">
        <h3>${esc(x.name)}</h3><p>${esc(x.blurb)}</p>
        <div class="sevrow">${sevTags(fs) || '<span class="sevtag" style="background:var(--ok-fixed)">clear</span>'}</div>
        ${weightBar(fs, total)}</button>`;
    }).join("") + `</div>`;
  } else if (!r) {
    view.innerHTML = `<div class="grid">` + (t.regions || []).map((x) => {
      const fs = regionFindings(x);
      return `<button class="card" data-r="${esc(x.id)}">
        <h3>${esc(x.name)}</h3><p>${esc(x.summary)}</p>
        <div class="sevrow">${sevTags(fs) || '<span class="sevtag" style="background:var(--ok-fixed)">clear</span>'}</div>
        ${weightBar(fs, total)}</button>`;
    }).join("") + `</div>`;
  } else if (!f) {
    const fs = regionFindings(r);
    view.innerHTML = fs.length === 0
      ? `<div class="empty"><div class="big">&#10003;</div><p>${esc(r.summary)}</p></div>`
      : `<div class="grid">` + fs.map((x) =>
          `<button class="card" data-f="${esc(x.id)}">
             <h3>${esc(x.title)}</h3>
             ${x.locus ? `<p class="locus">${esc(x.locus)}</p>` : ""}
             <div class="sevrow"><span class="sevtag" style="background:${SEV_COLOR[x.severity]}">${esc(x.severity)}</span></div>
             ${weightBar([x], total)}</button>`).join("") + `</div>`;
  } else {
    view.innerHTML = `<article class="detail">
      <h2>${esc(f.title)}</h2>
      <p class="locus">${esc(f.locus || "")}</p>
      <div class="sevrow"><span class="sevtag" style="background:${SEV_COLOR[f.severity]}">${esc(f.severity)}</span></div>
      <p style="color:var(--muted);font-size:.88rem;margin-top:.6rem">${esc(SEV_MEANING[f.severity] || "")}</p>
      <h4>Evidence</h4>
      <ul class="evidence">${(f.evidence || []).map((e) => `<li>${esc(e)}</li>`).join("")}</ul>
      ${f.why ? `<h4>Why it matters</h4><p class="why">${esc(f.why)}</p>` : ""}
      ${f.clears ? `<h4>What would clear it</h4><p>${esc(f.clears)}</p>` : ""}
    </article>`;
  }
}

// Delegated navigation — one listener for every zoom action.
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-t],[data-r],[data-f],[data-depth]");
  if (!el) return;
  if (el.dataset.depth !== undefined) path = path.slice(0, Number(el.dataset.depth));
  else if (el.dataset.t) path = [el.dataset.t];
  else if (el.dataset.r) path = [path[0], el.dataset.r];
  else if (el.dataset.f) path = [path[0], path[1], el.dataset.f];
  location.hash = path.join("/");
  render();
});

// Back/forward and deep links: the hash IS the zoom coordinate.
addEventListener("hashchange", () => {
  path = location.hash.replace(/^#/, "").split("/").filter(Boolean);
  render();
});

fetch("red-state.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then((data) => {
    if (data.version !== 1) throw new Error(`unknown schema version ${data.version}`);
    STATE = data;
    path = location.hash.replace(/^#/, "").split("/").filter(Boolean);
    $("foot").innerHTML =
      `Generated ${esc(String(data.generatedAtIso).replace("T", " ").slice(0, 16))} UTC ` +
      `at commit <code>${esc(data.commit)}</code> by ` +
      `<code>src/Core.TypeScript/hygiene/collect-red-state.ts</code>. ` +
      `Only what the collectors look at can appear here.`;
    render();
  })
  .catch((err) => {
    $("view").innerHTML = `<div class="empty"><p>Could not load <code>red-state.json</code>.</p>
      <p class="locus">${esc(err.message)}</p>
      <p style="font-size:.85rem">Regenerate with
      <code>bun src/Core.TypeScript/hygiene/collect-red-state.ts --ci</code>.</p></div>`;
    $("foot").textContent = "No data loaded.";
  });
</script>
</body>
</html>
