<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    HARDENED Content-Security-Policy (carried forward from the Phase 7 hardening;
    tightened for the git-as-database pivot 2026-07-02):
      - script-src / style-src = 'self' ONLY; no inline JS/CSS, no event handler attrs.
      - connect-src = 'self' ONLY (Supabase host REMOVED - the viewer reads the
        committed items.json read-model; git is the database).
      - Regression guard: inventory/proofs/phase7-csp-proof.ts.
    Fonts: system-ui only (owner decision 2026-05-31).
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    connect-src 'self';
    img-src 'self' data:;
    base-uri 'none';
    object-src 'none';
    form-action 'none';
  " />
  <title>Zeta Inventory</title>
  <link rel="stylesheet" href="inventory.css" />
</head>
<body>
  <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

  <div class="container">
    <header>
      <div class="logo-area">
        <h1>Zeta Inventory</h1>
        <p class="subtitle">LFG asset register &middot; git is the database &middot; edits are commits</p>
      </div>
      <div class="status-area">
        <span class="status-badge" id="totals-badge">loading&hellip;</span>
      </div>
    </header>

    <section class="panel">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search name, brand, serial, location&hellip;" autocomplete="off" />
        <select id="status-filter">
          <option value="">All statuses</option>
          <option value="active">Active</option>
          <option value="storage">In storage</option>
          <option value="attention">Needs attention</option>
          <option value="repair">In repair</option>
          <option value="retired">Retired</option>
          <option value="disposed">Disposed</option>
          <option value="missing">Missing</option>
        </select>
      </div>
      <div class="table-wrap">
        <table id="items-table">
          <thead>
            <tr>
              <th data-sort="name">Name</th>
              <th data-sort="brand">Brand</th>
              <th data-sort="device_type">Type</th>
              <th data-sort="status">Status</th>
              <th data-sort="location">Location</th>
              <th data-sort="qty">Qty</th>
              <th data-sort="value_usd">Value</th>
            </tr>
          </thead>
          <tbody id="items-body"></tbody>
        </table>
      </div>
      <p class="subtitle" id="empty-note" hidden>No items match.</p>
    </section>
  </div>

  <script type="module" src="lib/inventory-viewer.js"></script>
</body>
</html>
