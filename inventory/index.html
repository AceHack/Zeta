<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    BASELINE Content-Security-Policy (Phase 2). Locks the network surface:
      - connect-src pinned to 'self' + this project's Supabase host only
      - object/base/form-action locked down
    'unsafe-inline' for script/style is the cost of a SINGLE standalone file.
    Phase 7 hardening (per PROGRESS.md) moves JS/CSS to external files + adds
    nonces/SRI and drops 'unsafe-inline'. Do NOT pull that forward here.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline';
    connect-src 'self' https://mdtbgreryqddloluhdmm.supabase.co;
    img-src 'self' data:;
    base-uri 'none';
    object-src 'none';
    form-action 'none';
  " />
  <title>Zeta Inventory</title>
  <style>
    :root { --bg:#0e1116; --panel:#171c24; --line:#2a323d; --fg:#e6edf3; --muted:#8b97a7;
            --accent:#3b82f6; --ok:#1f7a3d; --bad:#9b1c1c; --warn:#8a6d1a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background:var(--bg); color:var(--fg); line-height:1.5; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: .9rem; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
             padding:20px; margin: 0 0 16px; }
    label { display:block; font-size:.85rem; color:var(--muted); margin: 0 0 4px; }
    input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
            background:#0b0e13; color:var(--fg); font-size:1rem; }
    .field { margin-bottom:14px; }
    button { font:inherit; cursor:pointer; border:none; border-radius:8px; padding:10px 16px;
             background:var(--accent); color:#fff; font-weight:600; }
    button.secondary { background:transparent; border:1px solid var(--line); color:var(--fg); }
    button:disabled { opacity:.5; cursor:default; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .hidden { display:none !important; }
    .muted { color:var(--muted); }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.8rem;
             border:1px solid var(--line); }
    .msg { padding:8px 12px; border-radius:8px; font-size:.9rem; margin-top:10px; white-space:pre-wrap;
           word-break:break-word; }
    .msg.ok { background:rgba(31,122,61,.18); border:1px solid var(--ok); }
    .msg.bad { background:rgba(155,28,28,.18); border:1px solid var(--bad); }
    .msg.info { background:rgba(138,109,26,.15); border:1px solid var(--warn); }
    code { background:#0b0e13; padding:1px 5px; border-radius:4px; }
    .stack { display:flex; flex-direction:column; gap:6px; }
    hr { border:none; border-top:1px solid var(--line); margin:18px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Zeta Inventory</h1>
    <p class="sub">Secure inventory. Sign in to continue.</p>

    <!-- ===================== SIGN-IN VIEW (sign-in form ONLY) ===================== -->
    <!-- Intentionally NO sign-up form, NO "create account" link, NO reset-via-signup.
         Accounts are created only by an admin in the Supabase dashboard. -->
    <section id="signin-view" class="panel" aria-labelledby="signin-h">
      <h2 id="signin-h" style="font-size:1.05rem;margin:0 0 14px;">Sign in</h2>
      <form id="signin-form" autocomplete="on" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="username"
                 inputmode="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required
                 autocomplete="current-password" />
        </div>
        <button id="signin-btn" type="submit">Sign in</button>
      </form>
      <div id="signin-msg" class="msg hidden" role="alert" aria-live="assertive"></div>
    </section>

    <!-- ===================== AUTHENTICATED VIEW ===================== -->
    <section id="app-view" class="panel hidden" aria-labelledby="app-h">
      <div class="row" style="justify-content:space-between;">
        <h2 id="app-h" style="font-size:1.05rem;margin:0;">Signed in</h2>
        <button id="signout-btn" class="secondary" type="button">Sign out</button>
      </div>
      <div class="stack" style="margin-top:12px;">
        <div>Email: <span id="who" class="badge"></span></div>
        <div>Role (from <code>current_user_role()</code>): <span id="role" class="badge"></span></div>
      </div>

      <hr />

      <!-- Sign-out proof scaffolding: ONE sample item rendered so we can prove it
           is wiped from the DOM/memory on sign-out. NOT the Phase 3 read path. -->
      <h3 style="font-size:.95rem;margin:0 0 6px;">Sample item <span class="muted">(sign-out clears this)</span></h3>
      <div id="sample-item" class="muted">—</div>

      <hr />

      <!-- (a) proof surface: visible to every role; the DB (RLS) decides. -->
      <h3 style="font-size:.95rem;margin:0 0 6px;">Edit probe <span class="muted">(DB decides, not the UI)</span></h3>
      <div class="row">
        <button id="probe-btn" type="button">Attempt edit (UPDATE items)</button>
      </div>
      <div id="probe-msg" class="msg hidden" aria-live="polite"></div>
    </section>

    <div id="status" class="muted" aria-live="polite" style="font-size:.85rem;"></div>
  </main>

  <!-- supabase-js v2. NOTE (Phase 7): pin an exact version + add SRI. The @2 tag
       resolves the latest v2 and is verified to load during the Phase 2 proof. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    "use strict";

    // Public, low-privilege key (publishable/anon). Safe in client code by design;
    // real security is Postgres RLS. NEVER place the service_role/secret key here.
    const SUPABASE_URL = "https://mdtbgreryqddloluhdmm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_UjTK7ZQ0uGX_mEm9HJOT6Q_MJjPvKE3";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
    });

    // In-memory state we MUST be able to clear on sign-out (shared-device safety).
    let state = { user: null, role: null, sampleItem: null };

    const $ = (id) => document.getElementById(id);
    const signinView = $("signin-view"), appView = $("app-view"), statusEl = $("status");

    function setStatus(t) { statusEl.textContent = t || ""; }
    function showMsg(el, text, kind) {
      el.className = "msg " + (kind || "info");
      el.textContent = text;           // textContent => no HTML injection (baseline XSS-safety)
      el.classList.remove("hidden");
    }
    function hide(el) { el.classList.add("hidden"); }

    // TRUST decisions always use getUser() (server-verified), never getSession()
    // (which only base64-decodes whatever is in localStorage).
    async function verifiedUser() {
      const { data, error } = await sb.auth.getUser();
      if (error) return null;
      return data && data.user ? data.user : null;
    }
    async function readRole() {
      const { data, error } = await sb.rpc("current_user_role");
      if (error) return null;
      return data; // 'viewer' | 'editor' | 'admin' | null
    }

    async function render() {
      setStatus("Connecting…");
      const user = await verifiedUser();
      if (!user) { showSignIn(); setStatus(""); return; }

      state.user = user;
      state.role = await readRole();

      $("who").textContent = user.email || "(no email)";
      $("role").textContent = state.role || "(no role)";

      // Sign-out-proof scaffolding: load exactly ONE item (authenticated SELECT).
      const { data: items, error } = await sb.from("items").select("id,name,status").limit(1);
      if (!error && items && items.length) {
        state.sampleItem = items[0];
        $("sample-item").textContent =
          "#" + items[0].id + " — " + (items[0].name || "(unnamed)") + " [" + (items[0].status || "—") + "]";
      } else {
        state.sampleItem = null;
        $("sample-item").textContent = "(no items visible)";
      }

      hide(signinView);
      appView.classList.remove("hidden");
      hide($("probe-msg"));
      setStatus("");
    }

    function showSignIn() {
      appView.classList.add("hidden");
      signinView.classList.remove("hidden");
    }

    async function onSignIn(e) {
      e.preventDefault();
      hide($("signin-msg"));
      const email = $("email").value.trim();
      const password = $("password").value;
      $("signin-btn").disabled = true;
      setStatus("Signing in…");
      const { error } = await sb.auth.signInWithPassword({ email, password });
      $("signin-btn").disabled = false;
      setStatus("");
      if (error) { showMsg($("signin-msg"), "Sign-in failed: " + error.message, "bad"); return; }
      $("password").value = "";        // do not leave the password in the DOM
      await render();
    }

    // (a) The edit probe: attempt an UPDATE on the sample item. The DB (RLS) is the
    // gate — a Viewer gets 0 rows back (refused); an Editor/Admin gets the updated row.
    async function onProbe() {
      hide($("probe-msg"));
      if (!state.sampleItem) { showMsg($("probe-msg"), "No sample item to probe.", "info"); return; }
      setStatus("Attempting UPDATE…");
      const stamp = new Date().toISOString();
      const { data, error } = await sb
        .from("items")
        .update({ notes: "probe @ " + stamp })
        .eq("id", state.sampleItem.id)
        .select("id,notes");
      setStatus("");
      if (error) {
        showMsg($("probe-msg"),
          "DB REFUSED the edit (role=" + state.role + "): " + error.message, "bad");
        return;
      }
      if (!data || data.length === 0) {
        showMsg($("probe-msg"),
          "DB REFUSED the edit (role=" + state.role + "): 0 rows updated — RLS filtered it out.", "bad");
        return;
      }
      showMsg($("probe-msg"),
        "DB ALLOWED the edit (role=" + state.role + "): updated row #" + data[0].id + ".", "ok");
    }

    // (c) Sign out: end the session AND clear all in-memory + rendered data.
    async function onSignOut() {
      setStatus("Signing out…");
      await sb.auth.signOut();
      // 1) wipe in-memory state
      state = { user: null, role: null, sampleItem: null };
      // 2) wipe rendered data from the DOM
      $("who").textContent = "";
      $("role").textContent = "";
      $("sample-item").textContent = "—";
      hide($("probe-msg"));
      $("probe-msg").textContent = "";
      // 3) confirm the session really ended (verified, not just local)
      const stillUser = await verifiedUser();
      showSignIn();
      setStatus(stillUser ? "WARNING: session still active!" : "Signed out.");
    }

    document.addEventListener("DOMContentLoaded", () => {
      $("signin-form").addEventListener("submit", onSignIn);
      $("probe-btn").addEventListener("click", onProbe);
      $("signout-btn").addEventListener("click", onSignOut);
      render(); // restores an existing session if present, else shows sign-in
    });
  </script>
</body>
</html>
