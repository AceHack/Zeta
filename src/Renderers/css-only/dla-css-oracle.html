<!DOCTYPE html>
<!--
  ORACLE 2: CSS-only DLA renderer.
  No canvas. No JS graphics API. No WebGL.
  The DLA cluster is computed in JavaScript (same seed, same rule as F# oracle),
  then rendered as a single CSS box-shadow string on a 1px div.
  The rendering primitive is a layout engine — not a graphics engine.

  Proof: the identity space boundary shape exists in a CSS layout engine.
  The fractal dimension is computed and displayed.
  Same seed (42) as all other oracles.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oracle 2: CSS-only DLA — Identity Space Boundary</title>
<style>
  body {
    background: #0a0a0f;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    color: #f0a030;
  }
  h1 { font-size: 1rem; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
  .meta { font-size: 0.7rem; color: #888; margin-bottom: 1rem; }
  /* The single pixel that carries the entire DLA cluster via box-shadow */
  #pixel {
    width: 1px;
    height: 1px;
    background: transparent;
    /* box-shadow is injected by JS — this is the only rendering primitive */
  }
  .stats {
    margin-top: 1.5rem;
    font-size: 0.75rem;
    color: #aaa;
    text-align: center;
    line-height: 1.8;
  }
  .highlight { color: #f0a030; font-weight: bold; }
</style>
</head>
<body>
<h1>ORACLE 2 — CSS-only DLA</h1>
<p class="meta">Identity Space Boundary · Seed 42 · sticking probability p_stick = 1/(3√2) ≈ 0.2357 (design choice, not a physical bound)</p>

<div id="pixel"></div>

<div class="stats" id="stats">Computing…</div>

<script>
// ── DLA core (same rule as F# IdentityDLA.fs) ────────────────────────────────────────────────

// ⚠ NAME IS A MISNOMER (Soraya audit, 2026-08-01). `TSIRELSON` is NOT the Tsirelson bound.
// Tsirelson's bound is S ≤ 2√2 ≈ 2.828 on the CHSH correlator (see src/Core/Tsirelson.fs,
// src/Core/BellTest.fs). There is no Tsirelson bound on a correlation coefficient. 1/(3√2)
// is ρ*/√2 — the Condorcet limit ρ* = 1/3 pushed through the FREELY CHOSEN linear map
// ρ = S/12 — a design parameter chosen for homoiconicity, not derived. See
// docs/research/2026-07-04-rho-t-derivation-attempt-it-is-a-design-choice-chosen-for-homoiconicity.md
// Here it is used purely as a DLA sticking probability / density cutoff. Do not read it as physics.
const TSIRELSON = 1.0 / (3.0 * Math.sqrt(2));  // ≈ 0.2357 — DLA sticking probability (design choice)

// Seeded PRNG (xorshift32 — same family as the phase-clock seed)
function makeRng(seed) {
  let s = seed >>> 0 || 1;
  return function() {
    s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
    return (s >>> 0) / 4294967296;
  };
}

function runDLA(seed, width, height, nWalkers) {
  const rng = makeRng(seed);
  // Grid: 0 = ZSet (cold), 1 = GSet (warm)
  const cells = new Uint8Array(width * height);
  const idx = (x, y) => y * width + x;
  const inBounds = (x, y) => x >= 0 && x < width && y >= 0 && y < height;

  // Seed: single GSet cell at center
  const cx = Math.floor(width / 2), cy = Math.floor(height / 2);
  cells[idx(cx, cy)] = 1;
  let clusterSize = 1;

  function gsetNeighbors(x, y) {
    let n = 0;
    if (inBounds(x-1,y) && cells[idx(x-1,y)]) n++;
    if (inBounds(x+1,y) && cells[idx(x+1,y)]) n++;
    if (inBounds(x,y-1) && cells[idx(x,y-1)]) n++;
    if (inBounds(x,y+1) && cells[idx(x,y+1)]) n++;
    return n;
  }

  function stickProb(x, y) {
    const n = gsetNeighbors(x, y);
    if (n === 0) return 0;
    return Math.min(1.0, TSIRELSON * (1 + n * 0.5));
  }

  const killRadius = Math.min(width, height) * 0.48;
  const dirs = [[0,1],[0,-1],[1,0],[-1,0]];

  for (let i = 0; i < nWalkers; i++) {
    // Spawn on boundary ring
    let wx, wy;
    const side = Math.floor(rng() * 4);
    if (side === 0) { wx = Math.floor(rng() * width); wy = 0; }
    else if (side === 1) { wx = Math.floor(rng() * width); wy = height - 1; }
    else if (side === 2) { wx = 0; wy = Math.floor(rng() * height); }
    else { wx = width - 1; wy = Math.floor(rng() * height); }

    let stuck = false, escaped = false;
    while (!stuck && !escaped) {
      const [dx, dy] = dirs[Math.floor(rng() * 4)];
      wx = Math.max(0, Math.min(width - 1, wx + dx));
      wy = Math.max(0, Math.min(height - 1, wy + dy));
      const dist = Math.sqrt((wx-cx)**2 + (wy-cy)**2);
      if (dist > killRadius) { escaped = true; }
      else if (gsetNeighbors(wx, wy) > 0) {
        if (rng() < stickProb(wx, wy)) { stuck = true; }
      }
    }
    if (stuck) {
      cells[idx(wx, wy)] = 1;
      clusterSize++;
    }
  }
  return { cells, width, height, clusterSize };
}

// ── Fractal dimension (box-counting) ─────────────────────────────────────────────────────────
function fractalDimension(cells, width, height) {
  const sizes = [2, 4, 8, 16, 32].filter(s => s < Math.min(width, height));
  if (sizes.length < 2) return 1.5;
  const logCounts = sizes.map(s => {
    let count = 0;
    const bx = Math.ceil(width / s), by = Math.ceil(height / s);
    for (let bxi = 0; bxi < bx; bxi++) {
      for (let byi = 0; byi < by; byi++) {
        let found = false;
        for (let dx = 0; dx < s && !found; dx++) {
          for (let dy = 0; dy < s && !found; dy++) {
            const x = bxi * s + dx, y = byi * s + dy;
            if (x < width && y < height && cells[y * width + x]) found = true;
          }
        }
        if (found) count++;
      }
    }
    return [Math.log(count), Math.log(1 / s)];
  });
  const n = logCounts.length;
  const sumX = logCounts.reduce((a, [,x]) => a + x, 0);
  const sumY = logCounts.reduce((a, [y]) => a + y, 0);
  const sumXY = logCounts.reduce((a, [y, x]) => a + x * y, 0);
  const sumX2 = logCounts.reduce((a, [,x]) => a + x * x, 0);
  return (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
}

// ── CSS box-shadow render ─────────────────────────────────────────────────────────────────────
function renderCSS(grid, scale) {
  const { cells, width, height } = grid;
  const shadows = [];
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      if (cells[y * width + x]) {
        // Colour: warm orange gradient based on distance from center
        const cx = width / 2, cy = height / 2;
        const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
        const maxDist = Math.sqrt(cx * cx + cy * cy);
        const t = dist / maxDist;
        // Inner: bright orange (#ffaa00), outer: deep red (#cc2200)
        const r = Math.round(255 - t * 51);
        const g = Math.round(170 - t * 170);
        const b = 0;
        shadows.push(`${x * scale}px ${y * scale}px 0 ${scale - 1}px rgb(${r},${g},${b})`);
      }
    }
  }
  return shadows.join(',');
}

// ── Main ─────────────────────────────────────────────────────────────────────────────────────
const W = 120, H = 120, N = 1800, SEED = 42, SCALE = 4;

// Offset the pixel so the grid is centered
const pixel = document.getElementById('pixel');
pixel.style.marginLeft = (W * SCALE / 2) + 'px';
pixel.style.marginTop = (H * SCALE / 2) + 'px';

// Run async so the browser can paint the "Computing…" message first
setTimeout(() => {
  const t0 = performance.now();
  const grid = runDLA(SEED, W, H, N);
  const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
  const df = fractalDimension(grid.cells, W, H).toFixed(3);

  pixel.style.boxShadow = renderCSS(grid, SCALE);

  document.getElementById('stats').innerHTML =
    `Oracle: <span class="highlight">CSS box-shadow</span> &nbsp;|&nbsp; ` +
    `Seed: <span class="highlight">${SEED}</span> &nbsp;|&nbsp; ` +
    `Grid: <span class="highlight">${W}×${H}</span> &nbsp;|&nbsp; ` +
    `Walkers: <span class="highlight">${N}</span><br>` +
    `Cluster size: <span class="highlight">${grid.clusterSize}</span> &nbsp;|&nbsp; ` +
    `Fractal dimension D_f ≈ <span class="highlight">${df}</span> &nbsp;|&nbsp; ` +
    `Time: <span class="highlight">${elapsed}s</span><br>` +
    `<br>Rendering primitive: <span class="highlight">CSS box-shadow only</span> — no canvas, no WebGL, no SVG`;
}, 50);
</script>
</body>
</html>
