[package]
name = "zeta-core-merkle"
version = "0.1.0"
edition = "2024"
description = "Merkle integrity -- the checkpoint/anti-entropy building block (PROVEN-CORE-MAP #3). Rust parity oracle (#4 of TS/F#/C#/Rust) for the cross-language byte-lock. Conforms byte-for-byte to the F# canonical shape (src/Core/Merkle.fs): same XXH3-128 leaf hash + same little-endian Hi/Lo combine layout, verified against golden vectors generated from the F# implementation."
license = "Apache-2.0"
publish = false

# HEXAGONAL (own-your-interfaces, same pattern as the JSON port in PRIMITIVE-REGISTRY.md):
# the zero-dep CORE owns the `Hasher128` port + `MerkleHash` + `MerkleTree`. The concrete
# XXH3-128 implementation is a swappable ADAPTER (`Xxh3Hasher128`) gated behind the default
# `xxh3` feature; a future zero-dep pure XXH3 impl can replace it behind the SAME trait
# without touching `MerkleTree`. So the third-party crate is isolated to one adapter and is
# optional. EXACT-PINNED (=0.8.10) per the supply-chain doctrine (no ranges on production pins;
# FACTORY-HYGIENE #44 / docs/security/SUPPLY-CHAIN-SAFE-PATTERNS.md).
[features]
default = ["xxh3"]
xxh3 = ["dep:xxhash-rust"]

[dependencies]
xxhash-rust = { version = "=0.8.18", features = ["xxh3"], optional = true }

# serde_json is DEV-ONLY: the cross-verify test reads the golden-vectors fixture.
[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
