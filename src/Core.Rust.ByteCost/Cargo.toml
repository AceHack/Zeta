[package]
name = "zeta-core-byte-cost"
version = "0.1.0"
edition = "2024"
description = "ByteCost -- the context-window minimization meter (B-1016 slice 1). Rust parity oracle (#4 of TS/F#/C#/Rust) for the cross-language byte-lock. Grown from the shared seed src/Core.TypeScript/byte-cost/golden-vectors.json (seed-first): measure(text) = UTF-8 byte length. Bytes not model-tokens (deterministic + byte-lockable). Zero-dependency production core; serde_json is DEV-ONLY for the cross-verify fixture parse."
license = "Apache-2.0"
publish = false

# Production default = ZERO external dependencies (supply-chain doctrine).
[dependencies]

# serde_json is DEV-ONLY: the cross-verify test reads the shared golden-vectors.json
# fixture. The production crate has no dependencies.
[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
