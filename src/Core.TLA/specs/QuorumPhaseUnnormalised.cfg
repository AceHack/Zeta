SPECIFICATION Spec
CONSTANTS
    Members = {"m1", "m2", "m3", "m4"}
    Byzantine = {"m4"}
    HonestPhases = {0}
    MaxHonestMag = 1
    MaxByzMag = 3
INVARIANT NoFullCancellation

\* CHECK_DEADLOCK FALSE -- added 2026-08-13 after CI run 10452 went red with
\* "Error: Deadlock reached." (TLC exit 11). This is NOT a suppressed violation
\* and NOT a weakened property. Diagnosis, in full, because the distinction is
\* the whole point of running these at all:
\*
\*   This is a ONE-SHOT model. Every member contributes exactly once and there is
\*   no round structure, no time, and nothing to do afterwards -- so once `given`
\*   = Members, no action is enabled and TLC calls the terminal state a deadlock.
\*   That terminal state IS the model: a quorum that has finished contributing.
\*   The state space, and every property verdict over it, are unchanged either
\*   way -- 48 distinct states, depth 5, identical with and without the check.
\*
\* The red was mine and it was a harness mismatch, not a finding: the runs
\* recorded in the companion doc were driven by a script passing -deadlock (which
\* DISABLES the check), while Tlc.Runner.Tests.fs passes no such flag. The two
\* sibling specs added in the same round (QuorumCollateral, WagerSolvency) do not
\* hit this because each carries an explicit stutter disjunct in Next.
\*
\* Declared here rather than by adding a stutter step to Next, deliberately. A
\* stutter self-loop would make the terminal state unreachable-as-terminal and
\* silence any FUTURE genuine deadlock in this module without a word. The
\* declaration says out loud which terminal state is intended. Same choice, same
\* reasoning, as SpineAsyncProtocol.cfg, ChaosEnvDeterminism.cfg and
\* SpineMergeInvariants.cfg already make in this directory.
\*
\* CAVEAT worth carrying, since it cuts the other way: because QuorumCollateral
\* and WagerSolvency DO stutter, their deadlock check is vacuous. Neither spec is
\* making a deadlock-freedom claim, and neither should be read as making one.
CHECK_DEADLOCK FALSE
