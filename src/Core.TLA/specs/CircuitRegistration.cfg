CONSTANTS Threads = {t1, t2} MaxOps = 3
SPECIFICATION Spec
INVARIANT Safety

\* LIVENESS, checked (added 2026-08-10). `THEOREM Spec => BuildCompletes` was stated in the
\* .tla and enforced by nothing; it is now machine-checked on every TLC run.
\* Sound to check here: this cfg declares NO state CONSTRAINT, so the
\* constraint-corrupts-fairness unsoundness that PredictiveLookahead.cfg documents — where a
\* constraint creates artificial sinks and a green becomes a spurious artifact — does not
\* apply. If a CONSTRAINT is ever added to this file, this PROPERTY must be reconsidered in
\* the same breath.
\* It VIOLATES under fairness on Build alone; it holds under the completed fairness set (WF
\* on the finishers too). So this line also guards the fix: weakening the fairness turns the
\* run red instead of silently restoring the original defect.
PROPERTY BuildCompletes

CHECK_DEADLOCK FALSE
