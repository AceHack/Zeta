SPECIFICATION Spec

CONSTANTS
    Nodes = {"otto", "vera", "riven", "lior"}
    Values = {"merge", "reject"}
    MaxFaulty = 1
    \* WHICH node is faulty. Added in the 2026-08-11 repair: previously there was no
    \* Byzantine set at all, so every node could equivocate while the spec claimed a
    \* 1-fault bound. N=4, F=1 satisfies N >= 3F+1 (see ASSUME BftAssumptions).
    Byzantine = {"lior"}

\* Agreement is the load-bearing one — the property the header advertised for months and
\* the model could not express. NoDecisionWithoutReceipt (added with the network model,
\* repair item 3) is the one that pins a decision to the evidence THAT NODE holds; it was
\* not even statable while quorum was global. NoConflictingQuorum is retained inside
\* SafetyInvariant but is NOT sufficient on its own: it is pigeonhole about the state
\* representation and survives deleting the protocol. That is why it must never be alone.
INVARIANT SafetyInvariant

\* FALSIFIABILITY, MEASURED 2026-08-11 — a green invariant proves nothing until it has been
\* shown it CAN go red, which is the defect the audit found. Each was mutated and re-run
\* against this exact config (N=4, F=1, Byzantine={"lior"}):
\*   delete Decide's quorum guard          -> SafetyInvariant           VIOLATED
\*   revert Decide to a GLOBAL quorum      -> NoDecisionWithoutReceipt  VIOLATED
\*                                            ...and Agreement stayed GREEN, so the new
\*                                            invariant is not redundant with it
\*   drop honest write-once in CastVote    -> Agreement                 VIOLATED
\* Clean run is exhaustive: 4,665,495 distinct states, 0 left on queue, depth 24, ~47s.
\* PINNED 2026-08-14 as registry/tlc-models.json id "BftConsensus". That count is now
\* ASSERTED by the gate on every run, and it reproduced byte-identically at -workers 1
\* (192s) -- which is the evidence that an exhaustive count is worker-independent.
\*   bun src/Core.TypeScript/formal-verification/run-tlc.ts --invocation BftConsensus

\* LIVENESS (repair item 5) is now CHECKED, in its honest conditional form, against FairSpec.
\* It is a separate run because temporal checking is ~14x the cost of the safety pass:
\*   bun src/Core.TypeScript/formal-verification/run-tlc.ts BftLiveness
\* THE COMMAND ABOVE REPLACES the one this comment carried until 2026-08-14, which was
\*   java -jar tla2tools.jar -deadlock -workers 4 -config BftLiveness.cfg BftConsensus.tla
\* and is left here on purpose. -deadlock DISABLES deadlock checking, and the gate never
\* passed it -- so this recorded result and the gated result were not the same experiment.
\* That mismatch is what took QuorumPhaseCancellation red on CI with exit 11 and is why
\* the invocation now lives in registry/tlc-models.json instead of in a comment.
\* BftLiveness is tier "extended" there: at -workers 1 it was still exploring after 16
\* minutes, so the 11min 14s below is a 4-worker figure and is NOT what a gated run costs.
\* Result 2026-08-11: ConditionalTermination HOLDS — exhaustive, 4,665,495 distinct states,
\* 0 left on queue, 11min 14s. Falsified in both directions before being believed:
\*   drop WF on DeliverHonest      -> ConditionalTermination    VIOLATED (so the fairness
\*                                    assumption is load-bearing, not decoration)
\*   assert <>AllHonestDecided     -> UnconditionalTermination  VIOLATED (2-1 honest split;
\*                                    the minority value can never reach quorum)
\* UNCONDITIONAL termination is deliberately NOT claimed: it is false here, and the .tla
\* records the counterexample rather than the absence. FLP (1985) forbids the unconditional
\* form without a synchrony assumption; this spec assumes only EVENTUAL delivery, never a
\* bound on delay. Asserting liveness without checking it is the defect the 2026-08-10 audit
\* found here, and the check is what stops this being the same mistake in a nicer font.
