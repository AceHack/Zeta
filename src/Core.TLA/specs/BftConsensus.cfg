SPECIFICATION Spec

CONSTANTS
    Nodes = {"otto", "vera", "riven", "lior"}
    Values = {"merge", "reject"}
    MaxFaulty = 1
    \* WHICH node is faulty. Added in the 2026-08-11 repair: previously there was no
    \* Byzantine set at all, so every node could equivocate while the spec claimed a
    \* 1-fault bound. N=4, F=1 satisfies N >= 3F+1 (see ASSUME BftAssumptions).
    Byzantine = {"lior"}

\* Agreement is the load-bearing one — the property the header advertised for months and
\* the model could not express. NoConflictingQuorum is retained inside SafetyInvariant but
\* is NOT sufficient on its own: it is pigeonhole about the state representation and
\* survives deleting the protocol. That is exactly why it must never again be checked alone.
INVARIANT SafetyInvariant

\* LIVENESS: deliberately NOT checked, and deliberately not claimed in the .tla either.
\* With no network model the honest form requires a partial-synchrony assumption this spec
\* does not state, and FLP (1985) forbids the unconditional form. Scoped out explicitly in
\* the PredictiveLookahead.cfg style rather than advertised in prose — asserting it without
\* checking it is the defect the 2026-08-10 audit found here.
