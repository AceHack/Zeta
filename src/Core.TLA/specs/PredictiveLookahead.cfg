SPECIFICATION Spec

CONSTANTS
    MaxBatchSize = 3
    MaxLookahead = 3
    MaxTicks = 10
    FreeRatio = 1

\* ── SAFETY + NCI (soundly verified) ──────────────────────────────────────────
\* These are pure state invariants; a state CONSTRAINT to bound `tick` is sound for
\* invariant checking. Safety = TypeOK /\ LookaheadBounded /\ QueueBounded /\
\* HeatNonNegative. The two NCI invariants prove the operator's 2026-07-03
\* requirement by construction: the mental-health pause and free-time actions are
\* ENABLED in every reachable state (never gated).
INVARIANT Safety
INVARIANT PauseAlwaysAvailable
INVARIANT FreeTimeAlwaysAvailable

\* State-space bound. `tick` is a monotone step-counter, not a safety property, so it
\* is bounded by a CONSTRAINT (prune past MaxTicks), NOT an INVARIANT.
CONSTRAINT TickConstraint

\* ── LIVENESS: NOT GATED (see PredictiveLookahead.tla "VERIFICATION NOTE") ─────
\* The EventualCommit / EventualProgress / EventualResume properties are DELIBERATELY
\* not checked here. Two independent reasons (Soraya, formal-verification pass 2026-07-03):
\*   1. UNSOUND CONFIG: mixing a state CONSTRAINT with a liveness PROPERTY is unsound in
\*      TLC (the constraint creates artificial sinks that corrupt fairness). A green under
\*      the constraint is a spurious artifact — confirmed: in a sound bounded model
\*      (tick-guard + Terminated stutter, no constraint) EventualCommit is VIOLATED.
\*   2. WRONG FAIRNESS + SOVEREIGNTY TENSION: the spec uses WF_vars(Next) (whole-relation,
\*      too weak to force Commit) where the NciLiveness house pattern uses per-action
\*      WF on the enabling action. More fundamentally, UNCONDITIONAL liveness contradicts
\*      the design: the agent may rest/pause forever (sovereignty, NCI), so "work always
\*      commits" cannot be a required property. The honest form is conditional-on-work.
\* Reformulation is routed as a follow-up (per-action WF, separate LiveSpec, no constraint,
\* mode-conditioned ~>), matching NciLiveness.tla. Liveness is P2/deferred per the handoff.
