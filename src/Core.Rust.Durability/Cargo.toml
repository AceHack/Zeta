[package]
name = "zeta-core-durability"
version = "0.1.0"
edition = "2024"
description = "Durability primitives (DeltaLog + DeltaCodec + RecoverableSpine) -- Rust parity oracle (#4 of TS/F#/C#/Rust). Zero-dep core; serde_json is DEV-ONLY for the cross-verify fixture parse."
license = "Apache-2.0"
publish = false

# Production default = ZERO external dependencies (supply-chain doctrine).
[dependencies]
zeta-core-algebra = { path = "../Core.Rust.Algebra" }
zeta-core-dynamic-value = { path = "../Core.Rust.DynamicValue" }

# serde_json is DEV-ONLY: the cross-verify test reads the shared golden-vectors.json.
[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
