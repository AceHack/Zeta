[package]
name = "zeta-core-frame-delta"
version = "0.1.0"
edition = "2024"
description = "FrameDelta -- the traveler-frame transformation group (relative offset between frames). Rust parity oracle (#4 of TS/F#/C#/Rust). Grown from the shared seed src/Core.TypeScript/frame-delta/golden-vectors.json (seed-first): compose = pointwise add (normalized), inverse = negate, between(from,to) = to-from, apply(delta,frame) = frame+delta (keeps zero coords), magnitude = sum|shift|, distance = magnitude(between). Exact i64. Zero-dependency production core; serde_json is DEV-ONLY for the cross-verify fixture parse."
license = "Apache-2.0"
publish = false

# Production default = ZERO external dependencies (supply-chain doctrine).
[dependencies]

# serde_json is DEV-ONLY: the cross-verify test reads the shared golden-vectors.json fixture.
[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
