# Hindsight (vectorize-io) — agent persistent memory system for any
# in-cluster agent runtime that needs memory persistence.
# Real chart wired: OCI Helm chart at ghcr.io/vectorize-io/charts/hindsight.
#
# Consumer agents reach Hindsight via:
#   HINDSIGHT_URL=http://hindsight.hindsight.svc.cluster.local
# (matches this Application's namespace + chart-default service name).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: hindsight
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: ghcr.io/vectorize-io/charts
    chart: hindsight
    targetRevision: 0.3.0 # bump to latest as vectorize-io publishes
    helm:
      releaseName: hindsight
      valuesObject:
        # Bundled PostgreSQL for storage. Swap to false +
        # api.database.url for an external CockroachDB/Postgres
        # backing store once the cluster's CockroachDB Application
        # is healthy.
        postgresql:
          enabled: true
          primary:
            persistence:
              storageClass: longhorn
              # SIZE CUT, NOT A POD CUT: 20Gi -> 10Gi, one primary either way.
              #
              # THE CUT TO REVISIT FIRST if this box gains room. This is the
              # semantic-memory Postgres, so the bound is on how much agent
              # memory can be retained before the database refuses writes. There
              # is no eviction policy to move alongside it -- Postgres does not
              # age rows out on its own -- so the governor here is whatever
              # retention the application implements, and today that is nothing.
              # The failure is loud (writes fail) rather than silent, and
              # manifesto section 5 makes filling it a memory-preservation
              # surface rather than a performance one.
              size: 10Gi

        api:
          # LLM provider Hindsight uses for its own entity/relation
          # extraction (separate from consumer-agent's LLM choice).
          # Sourced from a Vault-backed ExternalSecret rather than
          # hardcoded.
          llm:
            provider: groq # change per maintainer preference
            existingSecret:
              name: hindsight-llm-api-key
              key: api-key
          # Database URL inferred from bundled postgresql above when
          # `postgresql.enabled: true`. Override here for external
          # CockroachDB:
          # database:
          #   url: postgresql://hindsight:$(PG_PASSWORD)@cockroachdb-public.cockroachdb.svc.cluster.local:26257/hindsight?sslmode=require
          #   existingSecret:
          #     name: hindsight-db-credentials
          #     passwordKey: password

          # Service for Hermes to reach Hindsight at:
          #   http://hindsight.hindsight.svc.cluster.local
        service:
          type: ClusterIP
          port: 80

  destination:
    server: https://kubernetes.default.svc
    namespace: hindsight
  syncPolicy:
    automated:
      prune: false # never prune — memory store is precious
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
