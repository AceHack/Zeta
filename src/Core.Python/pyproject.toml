[project]
name = "zeta-core"
version = "0.1.0"
description = "Zeta Core logic in Python"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.2",
    "qsharp>=1.9.0",
    "xxhash>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zeta"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0.12.20260518",
]
