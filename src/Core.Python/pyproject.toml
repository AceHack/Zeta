[project]
name = "zeta-core"
version = "0.1.0"
description = "Zeta Core logic in Python"
requires-python = ">=3.14"
dependencies = ["pyyaml>=6.0.2", "qdk>=1.29.0", "xxhash>=3.7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/zeta"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# RUFF 0.16 ADOPTED (2026-08-29). This block used to carry a `ruff<0.16` bound (since
# widened to `<0.17` by a Dependabot bump, which permitted 0.16 without anyone landing
# the findings it produces) and a long explanation of why: ruff 0.16 widened the default rule set from 59 rules to
# 413, and `src/Core.Python` measured 65 findings under the new set while measuring 0
# under the old one. The bound said it should be removed "in the change that lands
# the 65 -- not before, and not as a side effect of something else." This is that
# change; the 65 are landed, not suppressed:
#
#   54  auto-fixed  UP006/UP007/UP035/UP037/UP045/I001/RUF022/FURB188 modernisations
#    8  UP046       Generic[T] subclassing -> PEP 695 `class Semiring[T](ABC)`
#    2  PLC0105     the unused contravariant `A` / covariant `B` TypeVars, DELETED
#                   rather than renamed -- renaming an unused declaration only makes
#                   dead code better spelled
#    2  TRY004      `toTagged: float not allowed` now raises TypeError, because it
#                   rejects the argument's TYPE while the adjacent safe-integer
#                   check rejects its VALUE. The cross-verify rejection loop was
#                   widened to `except (ValueError, TypeError)` IN THE SAME CHANGE:
#                   verified that a bare `except ValueError` no longer catches it,
#                   so without the widening a float fixture would have read as
#                   ACCEPTED and silently broken the four-oracle byte-lock.
#    1  PIE810, 1 EXE001, 1 RUF059  -- mechanical
#
# The four-oracle contract is unaffected: it compares rejected/accepted, never the
# exception class, and the Go oracle draws no type distinction at all
# (`errors.New("float not allowed")`).
#
# ON PINNING THE POLICY, and what is deliberately still open. The original defect
# named here was that the rule set is "whatever ruff defaults to this month" -- an
# unpinned POLICY behind a pinned tool. The tool half is now genuinely fixed: 0.16.5
# is pinned in .mise.toml, in tools/setup/manifests/from-uv-tool, and as the floor
# below, and audit-tool-pin-agreement.test.ts refuses a disagreement between them.
# (A second, UNPINNED `uv tool install ruff` in that manifest had been overwriting
# the mise pin at install time, which is why `lint (Python)` failed 6 of 60 runs.)
#
# An explicit `[tool.ruff.lint] select` was drafted and then WITHDRAWN, because
# prefix-level selection cannot express ruff's default set: selecting `TRY` also
# enables TRY003, `RUF` also enables RUF002/RUF003, and this tree has 27 and 25 of
# those respectively. A select list is therefore a NEW policy, not a pinned one, and
# adopting it means landing ~66 further findings -- the same mistake as folding the
# original 65 into a lockfile bump. Measured, with the tool pinned, the default set
# reports zero findings on this tree.
#
# LIFTS WHEN: someone lands a select list rule-by-rule with its findings fixed.
# Until then the policy is pinned by the tool version, which is now pinned in all
# three places and mechanically checked.
[dependency-groups]
dev = [
  "ijson==3.5.1",
  "minigrid==3.1.0",
  "mypy>=2.1.0",
  "numpy==2.5.3",
  "pygame-ce==2.5.8",
  "pytest>=9.1.0",
  "ruff>=0.16.5,<0.17",
  "types-pyyaml>=6.0.12.20260518",
  "gymnasium==1.3.0",
  "sympy>=1.13",
  "mpmath>=1.3",
]
