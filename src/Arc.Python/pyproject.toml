# src/Arc.Python — the ARC-AGI-3 lane.
#
# ITS OWN uv PROJECT, deliberately, per
# docs/design/2026-08-23-arc-agi-3-integration-design-chip8-chip9-atari-and-the-arena.md §3.2:
# "A resolution failure in the ARC lane must not be able to break
#  `uv sync --project src/Core.Python`, and separate projects is the only
#  structural way to guarantee that."
#
# So: never a dependency of zeta-core, never referenced by BOOTSTRAP_SURFACES,
# and no `gate (required)` job may depend on it.
#
# The Python floor is 3.12 because `arcengine` requires it. MEASURED, not
# assumed: this container's system Python is 3.11.15 and the toolkit will not
# install on it; `uv python install 3.12` + this pin is what made it work.
[project]
name = "zeta-arc"
version = "0.1.0"
description = "Zeta's ARC-AGI-3 lane: environments, a scored play loop, and a capability probe."
requires-python = ">=3.12"
dependencies = ["arc-agi"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zeta_arc"]
