[package]
name = "zeta-core-range-set"
version = "0.1.0"
edition = "2024"
description = "RangeSet -- Rust ferry (oracle #4 of TS/F#/C#/Rust) for the sparse-integer-set primitive in compact range notation (\"1-5,8,10-17\"), B-0976 registry Codec/IO line. Cross-verifies against the shared golden-vectors.json: render(parse input) == canonical + contains agrees + rejection-vector parity. Production = ZERO external deps (range-notation parsing is hand-rolled; no JSON on the production path). serde_json is DEV-ONLY (reads the golden fixture)."
license = "Apache-2.0"
publish = false

# Production = ZERO external dependencies (supply-chain doctrine; matching the other Rust
# oracles). RangeSet parses range-notation strings, not JSON, so the production path needs no
# parser dep at all. serde_json is DEV-ONLY: the cross-verify test reads golden-vectors.json.
[dependencies]

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
