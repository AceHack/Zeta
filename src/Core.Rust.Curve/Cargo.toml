[package]
name = "zeta-core-curve"
version = "0.1.0"
edition = "2024"
description = "Curve -- rate (D) / curvature (D2) / integrate (I) over the clock, the discrete DBSP D/I calculus. Rust parity oracle (#4 of TS/F#/C#/Rust). Grown from the shared seed src/Core.TypeScript/curve/golden-vectors.json (seed-first): differentiate = D = 1 - z^-1, integrate = I (its inverse), curvature = D.D. Exact i64. Zero-dependency production core; serde_json is DEV-ONLY for the cross-verify fixture parse."
license = "Apache-2.0"
publish = false

# Production default = ZERO external dependencies (supply-chain doctrine).
[dependencies]

# serde_json is DEV-ONLY: the cross-verify test reads the shared golden-vectors.json fixture.
[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
