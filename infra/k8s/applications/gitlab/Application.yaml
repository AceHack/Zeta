# infra/k8s/applications/gitlab/Application.yaml
#
# Self-hosted GitLab. Per Addison's spec, GitLab is the post-bootstrap
# Git host — everything after GitLab is installed lives there rather
# than on GitHub. The repoURL stays on GitHub for THIS Application
# definition because GitLab can't reference itself before it exists;
# once GitLab is healthy, future apps can point at the self-hosted URL.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.gitlab.io/
    chart: gitlab
    targetRevision: 8.7.0   # GitLab 17.7 family; bump in lockstep with upstream
    helm:
      releaseName: gitlab
      valuesObject:
        global:
          edition: ce
          hosts:
            domain: gitlab.zeta.local
            externalIP: ""   # set to LoadBalancer IP once MetalLB is in
          ingress:
            configureCertmanager: false  # cert-manager comes in a later app
            tls:
              enabled: false   # turn on after cert-manager + DNS
          # Initial root password — must be reset on first login.
          # In production, source from sops-nix decrypted Secret.
          initialRootPassword:
            secret: gitlab-initial-root-password
            key: password

        # Disable bundled components that overlap with cluster services
        # we install separately:
        certmanager:
          install: false       # use cluster-wide cert-manager
        nginx-ingress:
          enabled: false       # use ingress-nginx App
        prometheus:
          install: false       # use cluster-wide observability stack

        gitlab-runner:
          install: true        # ship runners alongside GitLab
          runners:
            privileged: false  # explicit denial; safer default
            tags: "kubernetes,zeta-cluster"

        # THE FOUR BUNDLED BITNAMI IMAGES, RE-POINTED AT `bitnamilegacy`.
        # Same change, same reason, same four tags as the sibling
        # `full-ai-cluster/k8s/applications/gitlab/Application.yaml` -- see the
        # long note there. In short: Bitnami withdrew its free versioned tags
        # from Docker Hub, so chart 8.7.0's bundled postgresql and redis
        # subcharts render four images that return HTTP 404 (measured
        # 2026-08-23). Each resolves under `bitnamilegacy` at the SAME tag.
        #
        # This tree is NOT in the lane-partition roster, so nothing here moves a
        # coverage number. It is fixed anyway because it is the identical live
        # bug -- a GitLab bring-up from this directory would ImagePullBackOff on
        # all four -- and leaving a diagnosed 404 in place because no counter
        # watches it is how the counter becomes the only thing that is true.
        postgresql:
          image:
            repository: bitnamilegacy/postgresql
          metrics:
            image:
              repository: bitnamilegacy/postgres-exporter
        redis:
          image:
            repository: bitnamilegacy/redis
          metrics:
            image:
              repository: bitnamilegacy/redis-exporter

  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated:
      prune: false             # GitLab data is precious — manual prune only
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true   # GitLab CRDs apply in waves
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
