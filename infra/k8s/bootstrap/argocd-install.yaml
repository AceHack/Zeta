# infra/k8s/bootstrap/argocd-install.yaml
#
# ArgoCD installation, as a K3S HelmChart CR (`helm.cattle.io/v1`).
# K3S auto-applies this on first boot via `services.k3s.manifests` in
# infra/nixos/modules/k3s-server.nix; K3S's built-in Helm Controller
# then resolves the chart and applies the rendered manifests, and the
# cluster becomes self-managing — ArgoCD reconciles everything else
# from this same Git repo via root-application.yaml.
#
# ── WHY THIS IS A HelmChart AND NOT A KUSTOMIZATION (2026-08-18) ────────────
# This file used to be a `kustomize.config.k8s.io/v1beta1` Kustomization
# whose `resources:` pointed at the upstream ArgoCD v2.13.2 install.yaml,
# on the belief that "K3S supports kustomize natively for manifests it
# auto-applies." It does — but ONLY for a DIRECTORY under the manifests
# tree that contains a file literally named `kustomization.yaml`,
# `kustomization.yml` or `Kustomization`. NixOS's `services.k3s.manifests`
# cannot produce that shape: each attribute is written as a single flat
# file `/var/lib/rancher/k3s/server/manifests/<name>.yaml`. So K3S read
# this file as an ordinary Kubernetes object of kind `Kustomization` in
# group `kustomize.config.k8s.io` — a group the API server does not serve.
#
# MEASURED on real K3S v1.31.4+k3s1 with exactly the four manifests
# `k3s-server.nix` declares, before this change:
#
#   Addon kube-system/argocd-install     CHECKSUM <empty>
#   Addon kube-system/root-application   CHECKSUM <empty>
#   Warning ApplyManifestFailed  Applying manifest at
#     "/var/lib/rancher/k3s/server/manifests/argocd-install.yaml" failed:
#     the server could not find the requested resource
#   $ kubectl -n argocd get pods -> No resources found
#   $ kubectl get crd | grep argo -> (nothing)
#
# retried every ~15s forever. The `argocd` namespace came up empty, no
# ArgoCD ever installed, `root-application.yaml` could not apply either
# (its `argoproj.io/v1alpha1` CRD ships WITH ArgoCD), and therefore NOTHING
# under infra/k8s/applications/ ever reconciled. Steps 3-9 of the bootstrap
# order in infra/README.md did not happen.
#
# The HelmChart form below is the same shape `full-ai-cluster/k8s/bootstrap/`
# already uses — that substrate hit this on real hardware first and its
# header records the conclusion: the "plain-resources format that
# `services.k3s.manifests` actually understands".
#
# ── VERSION PIN ────────────────────────────────────────────────────────────
# argo-cd chart 10.8.0, appVersion v3.5.2.
#
# THIS FILE WAS THE FIFTH SITE NOBODY COUNTED. It said 7.7.10 (v2.13.2) until
# 2026-09-06 and its header claimed "It is also the pin `full-ai-cluster` uses"
# — true when written on 2026-08-18, false from 2026-09-01, and never noticed
# because three sequential bumps (09-01, 09-03, 09-04) all worked from a roster
# of FOUR sites that did not include this one. This is the METAL path: K3S
# auto-applies this HelmChart on NixOS first boot.
#
# WHAT THE DRIFT COST WOULD HAVE BEEN, and it is not hypothetical — the same
# defect fired on 2026-09-03 in the kind lane, run 33736439359. v2.13.2 ships
# Helm 3 only; seaweedfs >= 4.33.0 uses the Helm-4-only `fromToml`; the
# repo-server fails manifest generation and CACHES the error per revision, so
# the wave -90 self-upgrade arrives after the failure is cached and cannot
# clear it. seaweedfs then reads health=Healthy VACUOUSLY with zero applied
# resources. On metal it would be one major version wider: install v2.13.2,
# then have it upgrade itself to v3.5.2 in the earliest sync wave.
#
# MEASURED BEFORE BUMPING, with THIS FILE's exact values at both versions —
# `helm template argo/argo-cd -n argocd -f <these values>`:
#   40 -> 44 resources; NOTHING REMOVED
#   the four additions are all NetworkPolicy (application-controller, redis,
#     repo-server, server). Four rather than the five `full-ai-cluster` measured
#     because dex is off here, so there is no dex NetworkPolicy.
#   every value this file sets still lands: argocd-server Service is ClusterIP,
#     `server.insecure: true` reaches argocd-cmd-params-cm, notifications render
#     zero resources, and dex renders zero resources at 10.8.0.
#
# ALL FIVE PIN SITES MOVE TOGETHER, and that is now CHECKED rather than asserted:
# `src/Core.TypeScript/hygiene/audit-argocd-pin-parity.ts` fails when they
# disagree. It went red on `main` when written, naming this file. Prose was what
# was already in place when this pin was left behind three times, so prose is not
# what stops the next one.
#
# To upgrade ArgoCD: bump ALL FIVE sites, confirm the chart's appVersion in
# https://argoproj.github.io/argo-helm/index.yaml, and re-render the values.
# `targetRevision: main` in root-application.yaml controls which Git ref ArgoCD
# TRACKS, never which ArgoCD version is INSTALLED — those two are independent,
# keep both pinned.

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  chart: argo-cd
  repo: https://argoproj.github.io/argo-helm
  version: 10.8.0
  targetNamespace: argocd
  # argocd-namespace.yaml creates the namespace explicitly and is applied
  # first, so the chart must not race it.
  createNamespace: false
  valuesContent: |-
    server:
      service:
        # ClusterIP, not LoadBalancer: k3s-server.nix passes --disable=servicelb
        # and no replacement L4 is declared under infra/k8s/applications/ yet, so
        # a LoadBalancer Service would sit Pending forever. Reach the UI with
        # `kubectl -n argocd port-forward svc/argocd-server 8080:80` until
        # ingress lands.
        type: ClusterIP
    configs:
      params:
        # TLS terminates at ingress once ingress lands; until then the
        # port-forward above is loopback-only.
        server.insecure: true
      cm:
        # LOCKSTEP with full-ai-cluster/k8s/bootstrap/argocd-install.yaml and
        # full-ai-cluster/k8s/applications/argocd/Application.yaml -- see the
        # full explanation on the full-ai-cluster copy. Restores
        # Application-CRD health assessment (removed upstream in ArgoCD 1.8;
        # argo-cd docs/operator-manual/upgrading/1.7-1.8.md), which sync-wave
        # gating across child Applications depends on.
        # `audit-argocd-pin-parity.ts` now checks this key for drift the same
        # way it already checks the chart version.
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
          end
          return hs
    notifications:
      enabled: false
    dex:
      # No SSO configured yet; Dex would idle as an unused attack surface.
      enabled: false
